<body>
<div class="atlas">

  <header class="top">
    <a class="mark" href="../index.html">
      <span class="sig" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.6"/><path d="M3.4 12h17.2"/>
          <path d="M12 3.4c2.6 2.7 3.9 5.6 3.9 8.6s-1.3 5.9-3.9 8.6"/>
          <path d="M12 3.4c-2.6 2.7-3.9 5.6-3.9 8.6s1.3 5.9 3.9 8.6"/>
        </svg>
      </span>
      <span><h1>The Ages of Thought</h1><span class="sub">An atlas &middot; the library</span></span>
    </a>
    <div class="readout" aria-live="polite">
      <div class="ro"><span class="sw" id="roAgeArt" aria-hidden="true"></span>
        <span><span class="k">Age</span><span class="v" id="roAge">All ten</span></span></div>
      <div class="ro"><span><span class="k">Reading</span><span class="v" id="roWho">Nobody yet</span></span></div>
    </div>
    <span class="spacer"></span>
    <button class="tbtn" id="btnReset" title="Clear the selection"><span class="wide">Clear selection</span><span class="nar">Clear</span></button>
    <button class="tbtn icon" id="btnTheme" aria-label="Switch between light and dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </header>

  <div class="body">

    <nav class="rail" aria-label="The ten ages">
      <div class="railhead"><span class="k" style="color:var(--ink-2)">The ten ages</span>
        <span class="s">press one to go there</span></div>
      <div class="rails" id="rails"></div>
      <div class="railfoot">An age holds whoever died inside it, so a life belongs to the age
        its work belongs to rather than the one it began in.</div>
    </nav>

    <main class="stage">
      <div class="tools">
        <div class="search" id="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input type="search" id="q" placeholder="Find a thinker, school or tradition"
                 autocomplete="off" role="combobox" aria-expanded="false"
                 aria-controls="hits" aria-autocomplete="list" aria-label="Find a thinker, school or tradition">
          <button class="clr" id="qClr" aria-label="Clear the search">&times;</button>
          <ul class="hits" id="hits" role="listbox" aria-label="Matches"></ul>
        </div>
        <div class="grp show" role="group" aria-label="How many thinkers to show">
          <span class="k">Show</span>
          <div class="seg" id="seg">
            <button data-t="1" aria-pressed="true">The six <i>6</i></button>
            <button data-t="2" aria-pressed="false">Major <i>30</i></button>
            <button data-t="3" aria-pressed="false">Substantial <i>87</i></button>
            <button data-t="4" aria-pressed="false">Everyone <i>117</i></button>
          </div>
        </div>
        <div class="grp linesg" role="group" aria-label="Which lines to draw">
          <span class="k">Lines</span>
          <details class="lines" id="lines" open><summary>Lines <span aria-hidden="true">&#9662;</span></summary><div>
          <button class="kind" data-k="taught" aria-pressed="true" title="One taught the other">
            <svg viewBox="0 0 24 8" aria-hidden="true"><path d="M0 4h17" stroke="var(--taught)" stroke-width="1.8"/>
              <path d="M17 1.2 23 4l-6 2.8z" fill="var(--taught)"/></svg><span>taught</span></button>
          <button class="kind" data-k="read" aria-pressed="true" title="The later one read the earlier">
            <svg viewBox="0 0 24 8" aria-hidden="true"><path d="M0 4h23" stroke="var(--readby)" stroke-width="1.2"/></svg><span>read by</span></button>
          <button class="kind" data-k="reacted" aria-pressed="true" title="The later one argued against the earlier">
            <svg viewBox="0 0 24 8" aria-hidden="true"><path d="M0 4h23" stroke="var(--challenged)" stroke-width="1.4"
              stroke-dasharray="4 3"/></svg><span>challenged by</span></button>
          <button class="kind" data-k="transmitted" aria-pressed="true" title="A text carried across a language or an age">
            <svg viewBox="0 0 24 8" aria-hidden="true"><path d="M0 4h23" stroke="var(--carried)" stroke-width="1.5"
              stroke-dasharray="1.5 3.5" stroke-linecap="round"/></svg><span>carried by</span></button>
          </div></details>
        </div>
        <div class="grp zoom" role="group" aria-label="Zoom">
          <button id="zOut" aria-label="Zoom out">&minus;</button>
          <button id="zIn" aria-label="Zoom in">+</button>
          <button id="zFit" class="ov" aria-pressed="true" title="All ten ages across the window">Overview</button>
        </div>
      </div>

      <div class="scroll" id="scroll" tabindex="0" role="group"
           aria-label="An atlas of philosophy. Time runs left to right across ten ages. Use the arrow keys to move, or the ages listed to the left.">
        <div class="canvas" id="canvas">
          <div class="ages-bg" id="agesbg"></div>
          <svg class="wires" id="wires" aria-hidden="true"></svg>
          <div id="folk"></div>
        </div>
      </div>
    </main>

    <aside class="panel" id="panel" aria-label="The dossier">
      <div class="sheethead"><span class="grab" aria-hidden="true"></span>
        <span class="t" id="sheetTitle">Dossier</span>
        <button class="tbtn" id="sheetClose" style="height:30px">Close</button></div>
      <div id="panelBody"></div>
    </aside>

  </div>
</div>

<script>
"use strict";
/* ---------------------------------------------------------- the ten plates
   One motif per age, drawn as strokes on the age's own colour. They are
   emblems rather than illustrations: a thing the age made, or a shape it
   argued in. Each returns SVG markup for a 160x74 field and is scaled by
   preserveAspectRatio to whatever box it is put in. */
var W = 160, H = 74;
function frame(inner, o) {
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice" ' +
         'aria-hidden="true"><g fill="none" stroke="rgba(255,255,255,' +
         ((o && o.a) || .55) + ')" stroke-width="' + ((o && o.w) || 1.1) +
         '" stroke-linecap="round" stroke-linejoin="round">' + inner + "</g></svg>";
}
function ring(cx, cy, r) { return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>'; }
function line(x1, y1, x2, y2) {
  return '<path d="M' + x1 + " " + y1 + "L" + x2 + " " + y2 + '"/>';
}

var PLATES = {
  /* Miletus: a sun coming up over the sea, and the wave-meander the Greeks
     put round everything. Myth on one side of the horizon, logos on the other. */
  logos: function () {
    var s = ring(80, 52, 21) + line(44, 52, 116, 52);
    for (var i = 0; i < 7; i++) {
      var a = Math.PI + (i + .5) * (Math.PI / 7);
      s += line(80 + Math.cos(a) * 26, 52 + Math.sin(a) * 26,
                80 + Math.cos(a) * 33, 52 + Math.sin(a) * 33);
    }
    var d = "M0 66";
    for (var x = 0; x < W; x += 16)
      d += "h4v-7h8v7h4";
    return frame(s + '<path d="' + d + '" opacity=".55"/>');
  },
  /* Athens: a colonnade. Five columns, an architrave, and the stylobate. */
  classical: function () {
    var s = line(18, 26, 142, 26) + line(18, 31, 142, 31) + line(14, 66, 146, 66);
    for (var i = 0; i < 5; i++) {
      var x = 28 + i * 26;
      s += line(x, 31, x, 62) + line(x - 6, 62, x + 6, 62) + line(x - 5, 31, x + 5, 31);
      s += line(x - 2.2, 34, x - 2.2, 60) + line(x + 2.2, 34, x + 2.2, 60);
    }
    s += '<path d="M18 26 80 12 142 26"/>';
    return frame(s);
  },
  /* Hellenistic and Roman: a laurel, the schools' promise of a life you can
     actually get through. */
  therapy: function () {
    var s = "";
    [-1, 1].forEach(function (k) {
      s += '<path d="M80 68 C' + (80 + k * 40) + ' 62 ' + (80 + k * 46) + ' 30 80 16"/>';
      for (var i = 0; i < 7; i++) {
        var t = .12 + i * .12;
        var x = 80 + k * (44 * Math.sin(t * Math.PI)) * .92;
        var y = 68 - t * 52;
        s += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) +
             '" rx="6.5" ry="2.8" transform="rotate(' + (k * (58 - i * 9)) + " " +
             x.toFixed(1) + " " + y.toFixed(1) + ')"/>';
      }
    });
    return frame(s, { a: .5 });
  },
  /* Late antiquity: Plotinus. Everything flows out of the One in rings and
     is trying to get back. */
  emanation: function () {
    var s = '<circle cx="80" cy="37" r="3.4" fill="rgba(255,255,255,.85)" stroke="none"/>';
    [9, 17, 25, 33, 41].forEach(function (r, i) {
      s += '<circle cx="80" cy="37" r="' + r + '" opacity="' + (.85 - i * .13).toFixed(2) + '"/>';
    });
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4;
      s += line((80 + Math.cos(a) * 6).toFixed(1), (37 + Math.sin(a) * 6).toFixed(1),
                (80 + Math.cos(a) * 43).toFixed(1), (37 + Math.sin(a) * 43).toFixed(1));
    }
    return frame(s, { a: .38 });
  },
  /* Transmission: the eight-point star of the Baghdad and Andalusian
     geometers, in whose libraries the Greek corpus survived. */
  transmission: function () {
    function star(cx, cy, r, rot) {
      var p = [];
      for (var i = 0; i < 16; i++) {
        var a = rot + i * Math.PI / 8, rr = i % 2 ? r * .46 : r;
        p.push((cx + Math.cos(a) * rr).toFixed(1) + " " + (cy + Math.sin(a) * rr).toFixed(1));
      }
      return '<path d="M' + p.join("L") + 'z"/>';
    }
    var s = "";
    for (var i = 0; i < 4; i++) s += star(20 + i * 40, 37, 21, i % 2 ? .39 : 0);
    s += star(0, 37, 21, .39) + star(160, 37, 21, .39);
    return frame(s, { a: .45 });
  },
  /* The universities: a rose window, the age's own diagram of an ordered
     whole with everything in its station. */
  rose: function () {
    var s = ring(80, 37, 32) + ring(80, 37, 26) + ring(80, 37, 9);
    for (var i = 0; i < 12; i++) {
      var a = i * Math.PI / 6;
      s += line((80 + Math.cos(a) * 9).toFixed(1), (37 + Math.sin(a) * 9).toFixed(1),
                (80 + Math.cos(a) * 26).toFixed(1), (37 + Math.sin(a) * 26).toFixed(1));
      var b = a + Math.PI / 12;
      s += '<circle cx="' + (80 + Math.cos(b) * 17.5).toFixed(1) + '" cy="' +
           (37 + Math.sin(b) * 17.5).toFixed(1) + '" r="4.6"/>';
    }
    return frame(s, { a: .45 });
  },
  /* Renaissance: one-point perspective, which is the period's discovery that
     where you stand decides what you see. And the rupture through it. */
  rupture: function () {
    var s = "";
    for (var i = 0; i <= 10; i++) {
      s += line(i * 16, 0, 80, 37) + line(i * 16, 74, 80, 37);
    }
    s += ring(80, 37, 4);
    s += '<path d="M96 0 L70 30 L88 40 L58 74" stroke="rgba(255,255,255,.9)" stroke-width="2"/>';
    return frame(s, { a: .3 });
  },
  /* The age of method: an orbit, and a prism opening a ray. Newton twice. */
  method: function () {
    var s = '<ellipse cx="80" cy="37" rx="52" ry="20"/>' +
            '<ellipse cx="80" cy="37" rx="30" ry="11.5" transform="rotate(-24 80 37)"/>' +
            '<circle cx="80" cy="37" r="5" fill="rgba(255,255,255,.85)" stroke="none"/>' +
            '<circle cx="132" cy="37" r="3"/>';
    s += '<path d="M18 58 L30 36 L42 58 z"/>' + line(2, 52, 18, 52);
    for (var i = 0; i < 4; i++) s += line(42, 50 + i * 1.6, 74, 40 + i * 5.5);
    return frame(s, { a: .45 });
  },
  /* After Kant: the spiral. The system completes itself, is inverted, is
     refused, and comes back round at a different height. */
  spiral: function () {
    var d = "M80 37", a = 0, r = 2;
    for (var i = 0; i < 92; i++) {
      a += .26; r += .43;
      d += "L" + (80 + Math.cos(a) * r).toFixed(1) + " " + (37 + Math.sin(a) * r * .62).toFixed(1);
    }
    return frame('<path d="' + d + '"/>', { a: .5, w: 1.2 });
  },
  /* Two streams: one line out of Frege and Husserl, parting and running on,
     with the beginnings of a way back across. */
  streams: function () {
    var s = '<path d="M0 37 C34 37 42 37 56 37"/>' +
            '<path d="M56 37 C86 37 96 12 160 8" stroke-width="1.6"/>' +
            '<path d="M56 37 C86 37 96 62 160 66" stroke-width="1.6"/>' +
            '<circle cx="56" cy="37" r="3.6" fill="rgba(255,255,255,.85)" stroke="none"/>';
    for (var i = 0; i < 3; i++) {
      var x = 108 + i * 20;
      s += '<path d="M' + x + ' 22 L' + (x + 6) + ' 52" opacity=".38" stroke-dasharray="2 3"/>';
    }
    return frame(s, { a: .5 });
  }
};
var PLATE_ORDER = ["logos", "classical", "therapy", "emanation", "transmission",
                   "rose", "rupture", "method", "spiral", "streams"];

/* The scenes: one picture per age. They start as the emblems above and are
   replaced by the drawn scenes further down when those are present, so the
   rest of the code asks for SCENE(i) and never needs to know which it got. */
var SCENES = {};
function SCENE(i) {
  var k = PLATE_ORDER[i];
  return (SCENES[k] || PLATES[k])();
}

var $  = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };

/* ---------------------------------------------------------- state */
var D = null, BY = {}, OUT = {}, IN = {};
var TIER = 1;                       /* how many are shown: 1 = the six .. 4 = everyone */
var KINDS = { taught: true, read: true, reacted: true, transmitted: true };
var SEL = null;                     /* the chosen thinker's id */
var AGE = null;                     /* the chosen age's index */
var Z = 1, ZMIN = 0.2, ZMAX = 6;    /* pixels per unit of time, relative; ZMIN is "overview" */
var SCALE = null, LAY = null, NODE = {};
var ORDER = [], ROVE = null;

var TIERNAME = { 1: "the six", 2: "the major", 3: "the substantial", 4: "everyone" };

/* What a line means, said from either end. The data records [f, t, kind]
   with influence running from f to t: Plato taught Aristotle; Plotinus read
   Plato; Aristotle argued against Plato. So on Plato's own page an edge
   where he is f reads "read by Plotinus", and one where he is t reads
   "read Heraclitus". Getting this backwards is a quiet way to lie. */
var REL = {
  taught:      { out: "taught",        inn: "taught by",  outS: "%me taught %o",            innS: "%o taught %me" },
  read:        { out: "read by",       inn: "read",       outS: "%o read %me",              innS: "%me read %o" },
  reacted:     { out: "challenged by", inn: "challenged", outS: "%o argued against %me",     innS: "%me argued against %o" },
  transmitted: { out: "carried to",    inn: "received",   outS: "%me was carried to %o",    innS: "%me received %o" },
  /* not a line of descent at all: the same thought arrived at twice, with
     no road between. The source book draws these dashed and apart, and so
     does this one: never as a wire, only in the dossier, with the note. */
  echo:        { out: "parallel",      inn: "parallel",   outS: "%me and %o arrived at the same thought apart",
                                                          innS: "%me and %o arrived at the same thought apart" }
};
function isLine(e) { return e.k !== "echo"; }
function relLabel(e, meId, sentence) {
  var r = REL[e.k] || REL.read, out = e.f === meId;
  var other = BY[out ? e.t : e.f], me = BY[meId];
  if (!sentence) return out ? r.out : r.inn;
  return (out ? r.outS : r.innS).replace("%me", me ? me.n : "").replace("%o", other ? other.n : "");
}

function egVar(i) { return "var(--e" + i + ")"; }
function visible(p) { return p.ti <= TIER; }
function yr(y, circa) { var s = y < 0 ? Math.abs(y) + " BCE" : String(y); return circa ? "c. " + s : s; }
/* "650 – 400 BCE", not "650 BCE – 400 BCE": the era once, at the end, the
   way a historian writes it. */
function yrs(a, b) {
  if (a < 0 && b <= 0) return Math.abs(a) + " – " + Math.abs(b) + " BCE";
  if (a < 0) return Math.abs(a) + " BCE – " + b;
  return a + " – " + b;
}
function span(p) { return p.fl ? "fl. " + yr(p.fl) : yr(p.b, p.cb) + " – " + yr(p.d, p.cd); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function rich(s) { return esc(s).replace(/&lt;em&gt;/g, "<em>").replace(/&lt;\/em&gt;/g, "</em>"); }
function plural(n, one, many) { return n === 1 ? one : (many || one + "s"); }

/* ---------------------------------------------------------- text metrics */
var _mc = document.createElement("canvas").getContext("2d"), _wcache = Object.create(null);
function textW(s, font) {
  var k = font + "|" + s;
  if (_wcache[k] === undefined) { _mc.font = font; _wcache[k] = _mc.measureText(s).width; }
  return _wcache[k];
}
var CARDFONT = { 1: '600 15px "Spectral",Georgia,serif', 2: '600 13px "Spectral",Georgia,serif',
                 3: '600 11.5px "Spectral",Georgia,serif', 4: '500 10.5px system-ui,sans-serif' };
var METAFONT = '9px "IBM Plex Mono",monospace', SCHFONT = '10px system-ui,sans-serif';
var CARDPAD = { 1: 34, 2: 30, 3: 24, 4: 20 };
var BIG_W = 250;                     /* the centrepiece card */
var _cw = Object.create(null);
function cardW(p) {
  if (p.id === SEL) return BIG_W;
  if (_cw[p.id] !== undefined) return _cw[p.id];
  var w = textW(p.n, CARDFONT[p.ti]);
  if (p.ti < 4) w = Math.max(w, textW(span(p), METAFONT));
  if (p.ti < 3 && p.sch) w = Math.max(w, textW(p.sch, SCHFONT));
  return (_cw[p.id] = Math.ceil(Math.min(w, 230) + CARDPAD[p.ti]));
}

/* ---------------------------------------------------------- the x-scale
   Zoom is a change of scale, not a magnifying glass. Z multiplies the width
   of every age band; the cards keep their size and are packed into more rows
   when the bands get narrow. So no name is ever six pixels tall, and
   "overview" means ten columns across the window, not small type. */
var BAND_MIN = 104, BAND_FOG = 62, PER_HEAD = 34, BAND_MAX = 1500;
function rawBands() {
  var count = {};
  D.people.forEach(function (p) { if (visible(p)) count[p.ep] = (count[p.ep] || 0) + 1; });
  return D.epochs.map(function (e, i) {
    var n = count[i] || 0;
    return { w: n ? Math.min(BAND_MAX, BAND_MIN + n * PER_HEAD) : BAND_FOG, n: n };
  });
}
function buildScale() {
  var raw = rawBands(), x = 0, bands = [];
  D.epochs.forEach(function (e, i) {
    var w = raw[i].w * Z;
    bands.push({ i: i, a: e.a, b: e.b, x0: x, w: w, n: raw[i].n });
    x += w;
  });
  return { bands: bands, total: x };
}
function overviewZ() {
  var sc = $("#scroll"), room = sc ? sc.clientWidth - 2 : 900;
  var sum = rawBands().reduce(function (a, b) { return a + b.w; }, 0);
  return Math.max(0.05, room / sum);
}
function ageZ(i) {
  var sc = $("#scroll"), room = sc ? sc.clientWidth - 40 : 900;
  return Math.max(overviewZ(), room / rawBands()[i].w);
}
function xOf(y, sc) {
  sc = sc || SCALE;
  var bs = sc.bands;
  for (var i = 0; i < bs.length; i++) {
    var b = bs[i];
    if (y < b.a) return b.x0;
    if (y < b.b) return b.x0 + (y - b.a) / (b.b - b.a) * b.w;
  }
  return sc.total;
}
/* the inverse, so a zoom can keep the same year under the cursor */
function yearOf(x, sc) {
  sc = sc || SCALE;
  var bs = sc.bands;
  for (var i = 0; i < bs.length; i++) {
    var b = bs[i];
    if (x < b.x0 + b.w) return b.a + Math.max(0, x - b.x0) / b.w * (b.b - b.a);
  }
  return bs[bs.length - 1].b;
}

/* Where a card goes. It sits over its own lifespan, starting at the birth;
   but near the right edge of the map that would hang it off the end, so
   there it slides left to end at the death instead, still over its own bar.
   The packer and the placer both ask here, so they cannot disagree. */
function extent(p) {
  var x1 = xOf(p.fl || p.b), x2 = Math.max(xOf(p.d), x1 + 12), w = cardW(p);
  var cx = x1;
  if (x1 + w > SCALE.total + 4) cx = Math.max(0, x2 - w);
  return { x1: x1, x2: x2, w: w, cx: cx, left: Math.min(x1, cx), right: Math.max(x2, cx + w) };
}

/* ---------------------------------------------------------- the y-layout */
var LANE = 70, BIG_EXTRA = 64, BANDGAP = 24, GAP = 14, TOPPAD = 40, BOTPAD = 30, PAD = TOPPAD;
/* Rows are not all the same height: the chosen thinker's row is taller, so
   the centrepiece card has room of its own instead of lying across the row
   above. laneY() reads the row tops the layout worked out. */
function laneY(r) { return PAD + (LAY && LAY.tops[r] !== undefined ? LAY.tops[r] : r * LANE); }
function buildLayout() {
  var row = {}, bands = {}, base = 0, gapsAfter = {};
  for (var t = 1; t <= TIER; t++) {
    var folk = D.people.filter(function (p) { return p.ti === t; })
                       .sort(function (a, b) { return a.b - b.b || a.d - b.d; });
    var ends = [];
    folk.forEach(function (p) {
      var ex = extent(p);
      var i = 0;
      for (; i < ends.length; i++) if (ends[i] <= ex.left - GAP) break;
      if (i === ends.length) ends.push(0);
      ends[i] = ex.right;
      row[p.id] = base + i;
    });
    bands[t] = { start: base, rows: ends.length };
    base += ends.length;
    if (ends.length) gapsAfter[base - 1] = true;
  }
  var tops = [], hs = [], y = 0, big = SEL ? row[SEL] : -1;
  for (var r = 0; r < base; r++) {
    tops[r] = y;
    hs[r] = LANE + (r === big ? BIG_EXTRA : 0);
    y += hs[r] + (gapsAfter[r] && r < base - 1 ? BANDGAP : 0);
  }
  tops[base] = y;
  return { row: row, bands: bands, rows: base, tops: tops, hs: hs, height: y };
}
function rowH(r) { return LAY.hs[r] || LANE; }
function fitPad() {
  var sc = $("#scroll"), room = sc ? sc.clientHeight - 2 : 0;
  var need = LAY.height + TOPPAD + BOTPAD;
  PAD = room > need ? Math.max(TOPPAD, (room - LAY.height) / 2 - 10) : TOPPAD;
}

/* ---------------------------------------------------------- the ground */
function renderGround() {
  var bg = $("#agesbg"), s = "", sc = $("#scroll");
  fitPad();
  var h = Math.max(PAD + LAY.height + BOTPAD, sc ? sc.clientHeight - 2 : 0);
  SCALE.bands.forEach(function (b) {
    var e = D.epochs[b.i];
    s += '<div class="ageband' + (AGE === b.i ? " on" : "") + (b.w < 168 ? " tight" : "") +
         '" data-i="' + b.i + '" style="left:' + b.x0.toFixed(1) + "px;width:" + b.w.toFixed(1) +
         "px;--eg:" + egVar(b.i) + '"><i></i><u></u>';
    /* century rules, thinned until they are at least sixty pixels apart */
    var step = 100;
    while ((b.w / (b.b - b.a)) * step < 60) step *= 2;
    for (var y = Math.ceil(b.a / step) * step; y < b.b; y += step) {
      if (y === b.a) continue;
      var x = (y - b.a) / (b.b - b.a) * b.w;
      s += '<s style="left:' + x.toFixed(1) + 'px"><em>' + yr(y) + "</em></s>";
    }
    if (b.w >= 90) {
      s += "<b><span>" + esc(e.n) + "</span><em>" + (b.w < 168 ? yr(e.a) : yrs(e.a, e.b)) + "</em></b>";
    }
    s += "</div>";
  });
  for (var t = 1; t <= 4; t++) {
    var bd = LAY.bands[t];
    if (!bd || !bd.rows) continue;
    s += '<div class="tierband t' + t + '" style="top:' + (laneY(bd.start) - 24) + "px;height:" +
         (laneY(bd.start + bd.rows) - laneY(bd.start) + 8) + 'px"><i></i><b>' + esc(TIERNAME[t]) + "</b></div>";
  }
  bg.innerHTML = s;
  $("#canvas").style.width = SCALE.total.toFixed(1) + "px";
  $("#canvas").style.height = h + "px";
}

/* ---------------------------------------------------------- the lines */
function anchor(p, side) {
  var x1 = xOf(p.fl || p.b), x2 = Math.max(xOf(p.d), x1 + 12);
  return { x: side === "out" ? x2 : x1, y: laneY(LAY.row[p.id]) + rowH(LAY.row[p.id]) - 12 };
}
function renderWires() {
  var svg = $("#wires"), s = "", labels = "";
  var W = Math.max(SCALE.total, RIGHT), H = PAD + LAY.height + BOTPAD;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  D.edges.forEach(function (e) {
    if (!KINDS[e.k] || !isLine(e)) return;
    var a = BY[e.f], b = BY[e.t];
    if (!a || !b || !visible(a) || !visible(b)) return;
    var p = anchor(a, "out"), q = anchor(b, "in");
    var dx = Math.max(30, Math.abs(q.x - p.x) * 0.36);
    var lit = SEL && (e.f === SEL || e.t === SEL);
    s += '<path class="wire ' + e.k + (lit ? " lit" : "") + '" data-f="' + e.f + '" data-t="' + e.t +
         '" d="M' + p.x.toFixed(1) + "," + p.y.toFixed(1) + " C" + (p.x + dx).toFixed(1) + "," +
         p.y.toFixed(1) + " " + (q.x - dx).toFixed(1) + "," + q.y.toFixed(1) + " " +
         q.x.toFixed(1) + "," + q.y.toFixed(1) + '"/>';
    if (e.k === "taught") {
      s += '<path class="head taught' + (lit ? " lit" : "") + '" data-f="' + e.f + '" data-t="' + e.t +
           '" d="M' + (q.x - 7).toFixed(1) + "," + (q.y - 3.4).toFixed(1) + "L" + q.x.toFixed(1) + "," +
           q.y.toFixed(1) + "L" + (q.x - 7).toFixed(1) + "," + (q.y + 3.4).toFixed(1) + 'z"/>';
    }
    /* the chosen thinker's own lines say what they are, at the midpoint of
       the curve, in the line's own colour */
    if (lit) {
      var mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
      labels += '<text class="wlab ' + e.k + '" x="' + mx.toFixed(1) + '" y="' + (my - 4).toFixed(1) +
                '" text-anchor="middle">' + esc((REL[e.k] || REL.read).out) + "</text>";
    }
  });
  svg.innerHTML = s + labels;
  svg.classList.toggle("sel", !!SEL);
}

/* ---------------------------------------------------------- the people */
function renderFolk() {
  var frag = document.createDocumentFragment();
  NODE = {};
  D.people.forEach(function (p) {
    if (!visible(p)) return;
    var b = document.createElement("button");
    b.className = "who";
    b.tabIndex = -1;
    b.dataset.id = p.id; b.dataset.ti = String(p.ti);
    b.setAttribute("aria-label", p.n + ", " + span(p) + (p.sch ? ", " + p.sch : "") + ". " + p.one);
    b.innerHTML =
      '<span class="card"><span class="n">' + esc(p.n) + "</span>" +
      '<span class="meta">' + esc(span(p)) + "</span>" +
      (p.sch ? '<span class="sch">' + esc(p.sch) + "</span>" : "") +
      (p.one ? '<span class="one">' + rich(p.one) + "</span>" : "") + "</span>" +
      '<span class="rule' + (p.cb || p.cd ? " circa" : "") + '"></span>';
    frag.appendChild(b);
    NODE[p.id] = b;
  });
  var host = $("#folk");
  host.innerHTML = "";
  host.appendChild(frag);
  placeFolk();
  $("#canvas").style.width = Math.max(SCALE.total, RIGHT).toFixed(1) + "px";
  ORDER = D.people.filter(visible).slice().sort(function (a, b) {
    return (LAY.row[a.id] - LAY.row[b.id]) || (a.b - b.b);
  });
  rove(SEL && NODE[SEL] ? SEL : (ORDER[0] || {}).id);
}
var RIGHT = 0;                    /* the right edge of the rightmost card */
function placeFolk() {
  RIGHT = 0;
  D.people.forEach(function (p) {
    var el = NODE[p.id];
    if (!el) return;
    var ex = extent(p);
    RIGHT = Math.max(RIGHT, ex.right + 4);
    el.style.left = ex.left.toFixed(1) + "px";
    el.style.top = laneY(LAY.row[p.id]) + "px";
    el.style.width = (ex.right - ex.left).toFixed(1) + "px";
    el.style.height = (rowH(LAY.row[p.id]) - 10) + "px";
    el.style.setProperty("--eg", egVar(p.ep));
    var card = el.querySelector(".card"), rule = el.querySelector(".rule");
    card.style.width = ex.w + "px"; card.style.left = (ex.cx - ex.left).toFixed(1) + "px";
    rule.style.width = Math.max(ex.x2 - ex.x1, 10).toFixed(1) + "px";
    rule.style.left = (ex.x1 - ex.left).toFixed(1) + "px";
  });
}

/* One tab stop, not a hundred and seventeen: exactly one card is tabbable and
   the arrow keys move between them, left and right along a row in time
   order, up and down between rows. */
function rove(id) {
  if (!id || !NODE[id]) { ROVE = null; return; }
  if (ROVE && NODE[ROVE]) NODE[ROVE].tabIndex = -1;
  ROVE = id; NODE[id].tabIndex = 0;
}
function roveBy(dRow, dCol) {
  if (!ORDER.length) return;
  var i = 0;
  for (var k = 0; k < ORDER.length; k++) if (ORDER[k].id === ROVE) { i = k; break; }
  var cur = ORDER[i], want = null;
  if (dCol) want = ORDER[Math.max(0, Math.min(ORDER.length - 1, i + dCol))];
  else {
    var row = LAY.row[cur.id] + dRow, bd = Infinity;
    ORDER.forEach(function (p) {
      if (Math.round(LAY.row[p.id]) !== Math.round(row)) return;
      var d = Math.abs(p.b - cur.b);
      if (d < bd) { bd = d; want = p; }
    });
  }
  if (!want) return;
  rove(want.id); NODE[want.id].focus(); reveal(want.id);
}

/* ---------------------------------------------------------- draw it all */
function draw() {
  SCALE = buildScale();
  LAY = buildLayout();
  renderGround();
  renderFolk();
  renderWires();
  applySelection();
}

/* ---------------------------------------------------------- the rail */
function renderRail() {
  var host = $("#rails"), s = "";
  D.epochs.forEach(function (e, i) {
    var shown = SCALE.bands[i].n, quiet = shown === 0;
    s += '<button class="age' + (quiet ? " quiet" : "") + (AGE === i ? " on" : "") + '" data-i="' + i +
         '" style="--eg:' + egVar(i) + '" aria-pressed="' + (AGE === i) + '" aria-label="' +
         esc(e.n) + ", " + yr(e.a) + " to " + yr(e.b) + ", " + e.n_all + " " + plural(e.n_all, "thinker") +
         (quiet ? ", none shown at this setting; press to widen" : "") + '">' +
         '<span class="thumb">' + SCENE(i) + "</span>" +
         '<span class="txt"><span class="nm">' + esc(e.n) + "</span>" +
         '<span class="yr">' + yrs(e.a, e.b) + "</span>" +
         '<span class="ct">' +
         (quiet ? e.n_all + " " + plural(e.n_all, "thinker") + " · press to widen"
                : (shown === e.n_all ? shown + " " + plural(shown, "thinker")
                                     : shown + " of " + e.n_all + " shown")) +
         "</span></span></button>";
  });
  host.innerHTML = s;
}

/* ---------------------------------------------------------- the dossier */
function nWorks(p) {
  return p.works.reduce(function (n, line) {
    return n + line.split(";").filter(function (t) { return t.trim().length > 1; }).length;
  }, 0);
}
function swatch(k) {
  var st = { taught: 'stroke="var(--taught)" stroke-width="2"',
             read: 'stroke="var(--readby)" stroke-width="1.3"',
             reacted: 'stroke="var(--challenged)" stroke-width="1.5" stroke-dasharray="3.5 2.5"',
             transmitted: 'stroke="var(--carried)" stroke-width="1.6" stroke-dasharray="1.2 3" stroke-linecap="round"',
             echo: 'stroke="var(--ink-4)" stroke-width="1.2" stroke-dasharray="2 2.5"' }[k] || "";
  return '<svg class="sw" viewBox="0 0 18 6" aria-hidden="true"><path d="M0 3h18" ' + st + "/></svg>";
}
function hero(i, kk, title, sub) {
  return '<div class="hero" style="--eg:' + egVar(i) + '">' + SCENE(i) +
         '<div class="cap"><div class="kk">' + esc(kk) + "</div><h2>" + esc(title) + "</h2>" +
         (sub ? '<div class="sl">' + sub + "</div>" : "") + "</div></div>";
}

function renderPanel() {
  var host = $("#panelBody");
  if (SEL) { host.innerHTML = dossier(BY[SEL]); $("#sheetTitle").textContent = "Dossier"; }
  else if (AGE !== null) { host.innerHTML = ageIntro(AGE); $("#sheetTitle").textContent = "The age"; }
  else { host.innerHTML = guide(); $("#sheetTitle").textContent = "How to read this"; }
  $("#roWho").textContent = SEL ? BY[SEL].n : "Nobody yet";
}

function dossier(p) {
  var out = OUT[p.id] || [], inn = IN[p.id] || [];
  var every = out.concat(inn);
  var all = every.filter(isLine), echoes = every.filter(function (e) { return !isLine(e); });
  var shown = all.filter(function (e) { var o = BY[e.f === p.id ? e.t : e.f]; return o && visible(o); }).length;
  var hidden = all.length - shown;
  var deepest = all.reduce(function (m, e) { var o = BY[e.f === p.id ? e.t : e.f]; return o ? Math.max(m, o.ti) : m; }, 1);

  function row(e) {
    var other = BY[e.f === p.id ? e.t : e.f];
    if (!other) return "";
    var off = !visible(other);
    return '<button class="link' + (off ? " off" : "") + '" data-go="' + other.id +
           '" title="' + esc(relLabel(e, p.id, true)) + '" aria-label="' + esc(relLabel(e, p.id, true)) +
           (off ? " (not shown at this setting; press to show)" : "") + '">' + swatch(e.k) +
           '<span><span class="rel">' + esc(relLabel(e, p.id)) + '</span><span class="nm">' + esc(other.n) +
           "</span>" + (e.note ? '<span class="note">' + rich(e.note) + "</span>" : "") +
           "</span><span class=\"yr\">" + (other.b < 0 ? Math.abs(other.b) + " BCE" : other.b) + "</span></button>";
  }
  var order = { taught: 0, transmitted: 1, read: 2, reacted: 3, echo: 4 };
  function sortRel(a, b) { return (order[a.k] - order[b.k]) || (BY[a.f === p.id ? a.t : a.f].b - BY[b.f === p.id ? b.t : b.f].b); }

  return hero(p.ep, D.epochs[p.ep].n, p.n, esc(span(p)) + (p.pl ? " &middot; " + esc(p.pl) : "")) +
    '<div class="tallies">' +
      '<div class="tally"><div class="v">' + p.ideas.length + '</div><div class="k">Ideas</div></div>' +
      '<div class="tally"><div class="v">' + nWorks(p) + '</div><div class="k">Works</div></div>' +
      '<div class="tally"><div class="v">' + shown + (hidden ? '<span style="color:var(--ink-4);font-size:12px"> / ' + all.length + "</span>" : "") +
        '</div><div class="k">' + (hidden ? "Lines shown" : "Lines") + "</div></div>" +
    "</div>" +
    '<div class="pscroll">' +
      (p.sch ? '<div class="k" style="margin-bottom:4px">' + esc(p.sch) + "</div>" : "") +
      (p.one ? '<p class="one-l">' + rich(p.one) + "</p>" : "") +
      '<div class="sec"><h3>Key ideas</h3><ul>' + p.ideas.map(function (t) { return "<li>" + rich(t) + "</li>"; }).join("") + "</ul></div>" +
      (p.works.length ? '<div class="sec"><h3>Works</h3><div class="works">' + p.works.map(rich).join(" ") + "</div></div>" : "") +
      (all.length ? '<div class="sec"><h3>Connections</h3><div class="links">' +
          all.slice().sort(sortRel).map(row).join("") + "</div>" +
          (hidden ? '<div class="more"><span>' + hidden + " of these " + plural(hidden, "is", "are") +
             " not shown at this setting.</span><button data-tier=\"" + deepest + '">Show them</button></div>' : "") +
        "</div>" : "") +
      (echoes.length ? '<div class="sec"><h3>Parallel, not descent</h3><div class="links">' +
          echoes.map(row).join("") + "</div></div>" : "") +
      (p.q && p.q.t !== p.one ? '<div class="sec"><h3>A quotation</h3><blockquote class="quote">' + rich(p.q.t) +
             "<cite>" + esc(p.q.s) + "</cite></blockquote></div>" : "") +
    "</div>";
}

function ageIntro(i) {
  var e = D.epochs[i];
  var folk = D.people.filter(function (p) { return p.ep === i; }).sort(function (a, b) { return a.ti - b.ti || a.b - b.b; });
  var shown = folk.filter(visible), hid = folk.length - shown.length;
  return hero(i, "Age " + (i + 1) + " of 10", e.n, yr(e.a) + " – " + yr(e.b)) +
    '<div class="tallies">' +
      '<div class="tally"><div class="v">' + folk.length + '</div><div class="k">' + plural(folk.length, "Thinker") + "</div></div>" +
      '<div class="tally"><div class="v">' + shown.length + '</div><div class="k">Shown</div></div>' +
      '<div class="tally"><div class="v">' + (e.b - e.a) + '</div><div class="k">Years</div></div>' +
    "</div>" +
    '<div class="pscroll"><p class="prose">' + rich(e.d) + "</p>" +
      '<div class="sec"><h3>Who is here</h3><div class="ppl">' +
        folk.map(function (p) { return '<button data-go="' + p.id + '"' + (visible(p) ? "" : ' class="off" title="Not shown at this setting; press to show"') + ">" + esc(p.n) + "</button>"; }).join("") +
      "</div>" + (hid ? '<div class="more"><span>' + hid + " " + plural(hid, "is", "are") + " not shown at this setting.</span><button data-tier=\"" +
        folk.reduce(function (m, p) { return Math.max(m, p.ti); }, 1) + '">Show them</button></div>' : "") + "</div>" +
    "</div>";
}

function guide() {
  var n = D.people.length;
  return '<div class="pscroll guide">' +
    '<p class="one-l" style="font-size:15px">Ten ages, ' + n + ' thinkers, and a line wherever one taught, read or argued with another.</p>' +
    '<div class="row"><div class="g"><svg viewBox="0 0 40 28" width="40" height="28" aria-hidden="true"><rect x="2" y="6" width="36" height="12" rx="4" fill="var(--surface-2)" stroke="var(--rule)"/><rect x="2" y="22" width="26" height="4" rx="2" fill="var(--e1)"/></svg></div>' +
      "<p><b>A card is a thinker.</b> The bar under it is the lifespan, to scale; a dotted bar is a life whose dates are guessed.</p></div>" +
    '<div class="row"><div class="g"><svg viewBox="0 0 40 28" width="40" height="28" aria-hidden="true"><rect x="0" y="0" width="13" height="28" fill="var(--e1)" opacity=".25"/><rect x="13" y="0" width="13" height="28" fill="var(--e4)" opacity=".25"/><rect x="26" y="0" width="14" height="28" fill="var(--e7)" opacity=".25"/></svg></div>' +
      "<p><b>Left to right is time,</b> in ten coloured ages. An age is as wide as it is busy, so antiquity is not a smear.</p></div>" +
    '<div class="row"><div class="g"><svg viewBox="0 0 40 28" width="40" height="28" aria-hidden="true"><rect x="2" y="2" width="36" height="7" rx="2" fill="var(--ink)" opacity=".12"/><rect x="2" y="12" width="36" height="7" rx="2" fill="var(--ink)" opacity=".06"/><rect x="2" y="22" width="36" height="5" rx="2" fill="var(--ink)" opacity=".02"/></svg></div>' +
      "<p><b>Top to bottom is consequence.</b> The six who moved the most sit in the top band; <em>Show</em> widens the view to the rest.</p></div>" +
    '<div class="row"><div class="g"><svg viewBox="0 0 40 28" width="40" height="28" aria-hidden="true"><path d="M2 6h30" stroke="var(--taught)" stroke-width="2"/><path d="M2 14h34" stroke="var(--readby)" stroke-width="1.3"/><path d="M2 22h34" stroke="var(--challenged)" stroke-width="1.5" stroke-dasharray="3.5 2.5"/></svg></div>' +
      "<p><b>A line is a relation the record supports:</b> taught, read by, challenged by. Choose a thinker and theirs come forward.</p></div>" +
    '<div class="row"><div class="g"><svg viewBox="0 0 40 28" width="40" height="28" aria-hidden="true"><circle cx="16" cy="12" r="7" fill="none" stroke="var(--ink-3)" stroke-width="2"/><path d="m22 18 8 8" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round"/></svg></div>' +
      "<p><b>Search finds all " + n + ",</b> whatever is showing. Choosing one brings them onto the map.</p></div>" +
    "</div>";
}

/* ---------------------------------------------------------- selection */
function applySelection() {
  var near = {};
  if (SEL) {
    near[SEL] = 1;
    (OUT[SEL] || []).forEach(function (e) { if (isLine(e)) near[e.t] = 1; });
    (IN[SEL] || []).forEach(function (e) { if (isLine(e)) near[e.f] = 1; });
  }
  $$(".who").forEach(function (b) {
    var id = b.dataset.id;
    b.classList.toggle("on", id === SEL);
    b.classList.toggle("near", !!SEL && id !== SEL && !!near[id]);
    b.classList.toggle("dim", !!SEL && !near[id]);
  });
}

/* ---------------------------------------------------------- choosing */
function select(id, opts) {
  opts = opts || {};
  var was = SEL;
  SEL = id && BY[id] ? id : null;
  if (SEL && !visible(BY[SEL])) setTier(BY[SEL].ti, { quiet: true });
  else if (was !== SEL) draw();               /* the centrepiece changes the packing */
  renderPanel();
  if (SEL) {
    setAge(BY[SEL].ep, { quiet: true });
    if (!opts.quiet) reveal(SEL);
    rove(SEL);
    openSheet(opts.fromEl || null);
  } else {
    closeSheet(false);
  }
  syncHash();
}

function reveal(id) {
  var el = NODE[id];
  if (!el) return;
  var sc = $("#scroll");
  var x = parseFloat(el.style.left), w = parseFloat(el.style.width), y = parseFloat(el.style.top);
  var left = sc.scrollLeft, top = sc.scrollTop;
  if (x < left + 30 || x + w > left + sc.clientWidth - 30) left = Math.max(0, x - sc.clientWidth * 0.36);
  if (y < top + 10 || y > top + sc.clientHeight - 100) top = Math.max(0, y - sc.clientHeight * 0.35);
  if (left !== sc.scrollLeft || top !== sc.scrollTop) sc.scrollTo({ left: left, top: top, behavior: "smooth" });
}

/* Pressing an age goes there. If nobody in it is showing, the setting widens
   until somebody is: a rail that says "press one to go there" has to mean it. */
function setAge(i, opts) {
  opts = opts || {};
  AGE = i;
  if (AGE !== null && !opts.quiet) {
    var here = D.people.filter(function (p) { return p.ep === AGE; });
    if (here.length && !here.some(visible)) {
      setTier(here.reduce(function (m, p) { return Math.min(m, p.ti); }, 4), { quiet: true });
    }
  }
  $$(".age").forEach(function (b) {
    var on = +b.dataset.i === i;
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
  });
  $$(".ageband").forEach(function (b) { b.classList.toggle("on", +b.dataset.i === i); });
  var e = i === null ? null : D.epochs[i];
  $("#roAge").textContent = e ? e.n : "All ten";
  $("#roAgeArt").style.background = e ? egVar(i) : "transparent";
  if (!opts.quiet && e) {
    setZoom(ageZ(i));
    $("#scroll").scrollTo({ left: Math.max(0, SCALE.bands[i].x0 - 20), top: 0, behavior: "smooth" });
  }
  if (!SEL) renderPanel();
  if (!opts.quiet) syncHash();     /* a quiet setAge at start-up must not erase
                                      the address the reader arrived with */
}

function setTier(t, opts) {
  opts = opts || {};
  TIER = Math.max(1, Math.min(4, t));
  $$("#seg button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.t === TIER)); });
  var atOverview = Math.abs(Z - ZMIN) < 1e-6;
  ZMIN = overviewZ();
  if (atOverview || Z < ZMIN) Z = ZMIN;
  draw();
  renderRail();
  $("#zFit").setAttribute("aria-pressed", String(Math.abs(Z - ZMIN) < 1e-6));
  if (!opts.quiet) { renderPanel(); syncHash(); }
}

/* ---------------------------------------------------------- zoom
   A zoom keeps the year under the cursor (or the middle of the window)
   where it is, and never goes below the overview, so there is never an
   empty margin to the right of the last age. */
function setZoom(z, anchorPx) {
  var sc = $("#scroll");
  ZMIN = overviewZ();
  var cx = anchorPx === undefined ? sc.clientWidth / 2 : anchorPx;
  var year = yearOf(sc.scrollLeft + cx);
  Z = Math.max(ZMIN, Math.min(ZMAX, z));
  draw();
  sc.scrollLeft = xOf(year) - cx;
  $("#zFit").setAttribute("aria-pressed", String(Math.abs(Z - ZMIN) < 1e-6));
}
function overview() { setZoom(overviewZ()); $("#scroll").scrollTo({ left: 0, top: 0 }); }

/* ---------------------------------------------------------- the sheet
   On a phone the dossier is a sheet that rises from the bottom. Opening it
   moves focus in; closing it gives focus back to whatever opened it, and
   marks the sheet inert so a hidden dossier is not a hundred hidden tab
   stops. On a wide screen it is a column and none of this applies. */
var SHEET_FROM = null, SHEET_FROM_ID = null;
function narrow() { return window.matchMedia("(max-width:900px)").matches; }
function openSheet(fromEl) {
  var p = $("#panel");
  if (!narrow()) return;
  SHEET_FROM = fromEl || document.activeElement;
  SHEET_FROM_ID = SHEET_FROM && SHEET_FROM.dataset ? SHEET_FROM.dataset.id || null : null;
  p.classList.add("up"); p.inert = false; p.removeAttribute("aria-hidden");
  setTimeout(function () { var c = $("#sheetClose"); if (c) c.focus({ preventScroll: true }); }, 60);
}
function closeSheet(refocus) {
  var p = $("#panel");
  if (!narrow()) return;
  p.classList.remove("up"); p.inert = true; p.setAttribute("aria-hidden", "true");
  if (!refocus) return;
  var back = SHEET_FROM_ID && NODE[SHEET_FROM_ID] ? NODE[SHEET_FROM_ID]
           : (SHEET_FROM && SHEET_FROM.isConnected ? SHEET_FROM : null);
  if (back && back.focus) { rove(back.dataset ? back.dataset.id : null); back.focus({ preventScroll: true }); }
}
function syncSheet() {
  var p = $("#panel");
  $("#lines").open = !narrow();
  if (narrow()) { if (!p.classList.contains("up")) { p.inert = true; p.setAttribute("aria-hidden", "true"); } }
  else { p.classList.remove("up"); p.inert = false; p.removeAttribute("aria-hidden"); }
}

/* ---------------------------------------------------------- the address
   Who, which age and how much is showing live in the hash, so a link to a
   thinker is a link to that thinker and Back retraces the walk. */
var HASHING = false;
function syncHash() {
  if (HASHING) return;
  var parts = [];
  if (SEL) parts.push("who=" + SEL);
  else if (AGE !== null) parts.push("age=" + (AGE + 1));
  if (TIER !== 1) parts.push("show=" + TIER);
  var h = parts.length ? "#" + parts.join("&") : "";
  if (h !== location.hash && !(h === "" && location.hash === "")) {
    try { history.pushState(null, "", location.pathname + location.search + h); } catch (e) { location.hash = h; }
  }
}
function readHash(initial) {
  var q = {}, h = location.hash.replace(/^#/, "");
  h.split("&").forEach(function (kv) { var m = kv.split("="); if (m[0]) q[m[0]] = decodeURIComponent(m[1] || ""); });
  HASHING = true;
  try {
    if (q.show && +q.show >= 1 && +q.show <= 4) setTier(+q.show, { quiet: true });
    /* a link to a thinker or an age arrives THERE: revealed, widened if need
       be, and with the age zoomed to the window, the same as pressing it */
    if (q.who && BY[q.who]) select(q.who);
    else if (q.age && +q.age >= 1 && +q.age <= D.epochs.length) { SEL = null; draw(); setAge(+q.age - 1); renderPanel(); }
    else if (!initial) { SEL = null; AGE = null; draw(); setAge(null, { quiet: true }); renderPanel(); }
  } finally { HASHING = false; }
}

/* ---------------------------------------------------------- search */
var HIT = -1, HITS = [];
function search(qs) {
  qs = qs.trim().toLowerCase();
  var box = $("#hits"), inp = $("#q");
  $("#search").classList.toggle("has", !!qs);
  if (!qs) { box.classList.remove("open"); box.innerHTML = ""; inp.setAttribute("aria-expanded", "false"); HITS = []; return; }
  var tr = D.traditions || {};
  HITS = D.people.filter(function (p) {
    var t = tr[p.tr] ? (tr[p.tr].n + " " + tr[p.tr].full).toLowerCase() : "";
    return p.n.toLowerCase().indexOf(qs) >= 0 || (p.sch || "").toLowerCase().indexOf(qs) >= 0 ||
           (p.pl || "").toLowerCase().indexOf(qs) >= 0 || t.indexOf(qs) >= 0;
  }).sort(function (a, b) {
    var an = a.n.toLowerCase().indexOf(qs) === 0 ? 0 : 1, bn = b.n.toLowerCase().indexOf(qs) === 0 ? 0 : 1;
    return an - bn || a.ti - b.ti || a.b - b.b;
  }).slice(0, 9);
  HIT = HITS.length ? 0 : -1;
  box.innerHTML = HITS.length ? HITS.map(function (p, i) {
    return '<li role="option" id="hit-' + p.id + '" aria-selected="' + (i === HIT) + '"><button class="hit" data-go="' + p.id + '" tabindex="-1">' +
      '<span><span class="n">' + esc(p.n) + '</span><span class="s">' + esc(p.sch || "") +
      (tr[p.tr] ? (p.sch ? " · " : "") + esc(tr[p.tr].n) : "") + "</span></span>" +
      '<span><span class="y">' + esc(span(p)) + "</span>" + (visible(p) ? "" : '<br><span class="hid">hidden · show</span>') +
      "</span></button></li>";
  }).join("") : '<li class="nohit">Nobody by that name, school or tradition.</li>';
  box.classList.add("open"); inp.setAttribute("aria-expanded", "true");
  inp.setAttribute("aria-activedescendant", HIT >= 0 ? "hit-" + HITS[HIT].id : "");
}
function pickHit(i) {
  var p = HITS[i]; if (!p) return;
  $("#q").value = ""; search("");
  select(p.id, { fromEl: $("#q") });
  if (!narrow()) { var n = NODE[p.id]; if (n) n.focus({ preventScroll: true }); }
}

/* ---------------------------------------------------------- wiring up */
function bind() {
  $("#rails").addEventListener("click", function (ev) {
    var b = ev.target.closest(".age"); if (!b) return;
    var i = +b.dataset.i;
    if (AGE === i && !SEL) { setAge(null, { quiet: true }); overview(); renderPanel(); return; }
    if (SEL) { SEL = null; draw(); }
    setAge(i); renderPanel();
  });
  $("#folk").addEventListener("click", function (ev) {
    var b = ev.target.closest(".who"); if (!b) return;
    select(b.dataset.id === SEL ? null : b.dataset.id, { fromEl: b });
  });
  $("#folk").addEventListener("focusin", function (ev) {
    var b = ev.target.closest(".who"); if (b) rove(b.dataset.id);
  });
  $("#folk").addEventListener("keydown", function (ev) {
    if (!ev.target.closest(".who")) return;
    var k = ev.key;
    if (k === "ArrowRight") roveBy(0, 1); else if (k === "ArrowLeft") roveBy(0, -1);
    else if (k === "ArrowDown") roveBy(1, 0); else if (k === "ArrowUp") roveBy(-1, 0);
    else if (k === "Home") { rove((ORDER[0] || {}).id); if (ROVE) { NODE[ROVE].focus(); reveal(ROVE); } }
    else if (k === "End") { rove((ORDER[ORDER.length - 1] || {}).id); if (ROVE) { NODE[ROVE].focus(); reveal(ROVE); } }
    else return;
    ev.preventDefault();
  });
  $("#panelBody").addEventListener("click", function (ev) {
    var go = ev.target.closest("[data-go]");
    if (go) { select(go.dataset.go, { fromEl: go }); return; }
    var t = ev.target.closest("[data-tier]");
    if (t) { setTier(+t.dataset.tier); if (SEL) reveal(SEL); }
  });
  $("#seg").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (b) setTier(+b.dataset.t);
  });
  $$(".kind").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.dataset.k;
      KINDS[k] = !KINDS[k];
      b.setAttribute("aria-pressed", String(KINDS[k]));
      renderWires();
    });
  });
  $("#zIn").onclick = function () { setZoom(Z * 1.3); };
  $("#zOut").onclick = function () { setZoom(Z / 1.3); };
  $("#zFit").onclick = overview;
  $("#btnReset").onclick = function () { SEL = null; draw(); setAge(null, { quiet: true }); renderPanel(); closeSheet(true); syncHash(); };
  $("#sheetClose").onclick = function () { closeSheet(true); };
  $("#scroll").addEventListener("wheel", function (ev) {
    if (!ev.ctrlKey && !ev.metaKey) return;
    ev.preventDefault();
    var r = this.getBoundingClientRect();
    setZoom(Z * (ev.deltaY < 0 ? 1.12 : 1 / 1.12), ev.clientX - r.left);
  }, { passive: false });
  $("#scroll").addEventListener("keydown", function (ev) {
    if (ev.target !== this) return;
    var step = ev.shiftKey ? this.clientWidth : 90;
    if (ev.key === "ArrowRight") this.scrollLeft += step; else if (ev.key === "ArrowLeft") this.scrollLeft -= step;
    else if (ev.key === "ArrowDown") this.scrollTop += 70; else if (ev.key === "ArrowUp") this.scrollTop -= 70;
    else if (ev.key === "Home") this.scrollLeft = 0; else if (ev.key === "End") this.scrollLeft = this.scrollWidth;
    else return;
    ev.preventDefault();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      if ($("#hits").classList.contains("open")) { search(""); $("#q").value = ""; return; }
      if (SEL) { var was = NODE[SEL]; SEL = null; draw(); renderPanel(); closeSheet(true); syncHash(); if (was && !narrow()) was.focus(); }
    }
  });

  /* search */
  var q = $("#q");
  q.addEventListener("input", function () { search(q.value); });
  q.addEventListener("focus", function () { if (q.value) search(q.value); });
  q.addEventListener("keydown", function (ev) {
    if (!HITS.length) return;
    if (ev.key === "ArrowDown") { HIT = (HIT + 1) % HITS.length; }
    else if (ev.key === "ArrowUp") { HIT = (HIT - 1 + HITS.length) % HITS.length; }
    else if (ev.key === "Enter") { ev.preventDefault(); pickHit(HIT); return; }
    else return;
    ev.preventDefault();
    $$("#hits li").forEach(function (li, i) { li.setAttribute("aria-selected", String(i === HIT)); });
    q.setAttribute("aria-activedescendant", "hit-" + HITS[HIT].id);
  });
  $("#hits").addEventListener("mousedown", function (ev) { ev.preventDefault(); });
  $("#hits").addEventListener("click", function (ev) {
    var b = ev.target.closest(".hit"); if (!b) return;
    pickHit(HITS.findIndex(function (p) { return p.id === b.dataset.go; }));
  });
  $("#qClr").onclick = function () { q.value = ""; search(""); q.focus(); };
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest("#search")) { $("#hits").classList.remove("open"); q.setAttribute("aria-expanded", "false"); }
  });

  $("#btnTheme").onclick = function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { var st = JSON.parse(localStorage.getItem("library:v1") || "{}"); st.theme = next;
          localStorage.setItem("library:v1", JSON.stringify(st)); } catch (e) { }
  };
  window.addEventListener("popstate", function () { readHash(false); });
  var t;
  addEventListener("resize", function () {
    clearTimeout(t);
    t = setTimeout(function () {
      var atOv = Math.abs(Z - ZMIN) < 1e-6;
      ZMIN = overviewZ(); if (atOv || Z < ZMIN) Z = ZMIN;
      draw(); syncSheet();
    }, 140);
  });
}

/* ---------------------------------------------------------- start */
function start(data) {
  D = data;
  BY = {}; D.people.forEach(function (p) { BY[p.id] = p; });
  OUT = {}; IN = {};
  D.edges.forEach(function (e) { (OUT[e.f] = OUT[e.f] || []).push(e); (IN[e.t] = IN[e.t] || []).push(e); });
  var counts = {};
  D.people.forEach(function (p) { for (var t = p.ti; t <= 4; t++) counts[t] = (counts[t] || 0) + 1; });
  $$("#seg button").forEach(function (b) { b.querySelector("i").textContent = counts[+b.dataset.t] || 0; });
  bind();
  syncSheet();
  ZMIN = overviewZ(); Z = ZMIN;
  setTier(1, { quiet: true });
  setAge(null, { quiet: true });
  renderPanel();
  readHash(true);
}

fetch("data/atlas.json")
  .then(function (r) { if (!r.ok) throw new Error("atlas.json " + r.status); return r.json(); })
  .then(start)
  .catch(function (err) {
    $("#panelBody").innerHTML = '<div class="pscroll"><p class="one-l">The atlas could not be loaded.</p><p class="prose">' +
      esc(String(err)) + "<br>If you are offline and have not opened this book before, it is not stored yet.</p></div>";
  });
</script>
</body>
</html>
