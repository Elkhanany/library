    if (x < b.x0 + b.w) return b.a + Math.max(0, x - b.x0) / b.w * (b.b - b.a);
  }
  return bs[bs.length - 1].b;
}

/* Where a card goes. It sits over its own lifespan, starting at the birth;
   but near the right edge of the map that would hang it off the end, so
   there it slides left to end at the death instead, still over its own bar.
   The packer and the placer both ask here, so they cannot disagree. */
function extent(p) {
  var x1 = xOf(p.fl || p.b), x2 = Math.max(xOf(p.d), x1 + 12), w = cardW(p);
  var cx = x1;
  if (x1 + w > SCALE.total + 4) cx = Math.max(0, x2 - w);
  return { x1: x1, x2: x2, w: w, cx: cx, left: Math.min(x1, cx), right: Math.max(x2, cx + w) };
}

/* ---------------------------------------------------------- the y-layout */
var LANE = 70, BIG_EXTRA = 64, BANDGAP = 24, GAP = 14, TOPPAD = 40, BOTPAD = 30, PAD = TOPPAD;
/* Rows are not all the same height: the chosen thinker's row is taller, so
   the centrepiece card has room of its own instead of lying across the row
   above. laneY() reads the row tops the layout worked out. */
function laneY(r) { return PAD + (LAY && LAY.tops[r] !== undefined ? LAY.tops[r] : r * LANE); }
function buildLayout() {
  var row = {}, bands = {}, base = 0, gapsAfter = {};
  for (var t = 1; t <= TIER; t++) {
    var folk = D.people.filter(function (p) { return p.ti === t; })
                       .sort(function (a, b) { return a.b - b.b || a.d - b.d; });
    var ends = [];
    folk.forEach(function (p) {
      var ex = extent(p);
      var i = 0;
      for (; i < ends.length; i++) if (ends[i] <= ex.left - GAP) break;
      if (i === ends.length) ends.push(0);
      ends[i] = ex.right;
      row[p.id] = base + i;
    });
    bands[t] = { start: base, rows: ends.length };
    base += ends.length;
    if (ends.length) gapsAfter[base - 1] = true;
  }
  var tops = [], hs = [], y = 0, big = SEL ? row[SEL] : -1;
  for (var r = 0; r < base; r++) {
    tops[r] = y;
    hs[r] = LANE + (r === big ? BIG_EXTRA : 0);
    y += hs[r] + (gapsAfter[r] && r < base - 1 ? BANDGAP : 0);
  }
  tops[base] = y;
  return { row: row, bands: bands, rows: base, tops: tops, hs: hs, height: y };
}
function rowH(r) { return LAY.hs[r] || LANE; }
function fitPad() {
  var sc = $("#scroll"), room = sc ? sc.clientHeight - 2 : 0;
  var need = LAY.height + TOPPAD + BOTPAD;
  PAD = room > need ? Math.max(TOPPAD, (room - LAY.height) / 2 - 10) : TOPPAD;
}

/* ---------------------------------------------------------- the ground */
function renderGround() {
  var bg = $("#agesbg"), s = "", sc = $("#scroll");
  fitPad();
  var h = Math.max(PAD + LAY.height + BOTPAD, sc ? sc.clientHeight - 2 : 0);
  SCALE.bands.forEach(function (b) {
    var e = D.epochs[b.i];
    s += '<div class="ageband' + (AGE === b.i ? " on" : "") + (b.w < 168 ? " tight" : "") +
         '" data-i="' + b.i + '" style="left:' + b.x0.toFixed(1) + "px;width:" + b.w.toFixed(1) +
         "px;--eg:" + egVar(b.i) + '"><i></i><u></u>';
    /* century rules, thinned until they are at least sixty pixels apart */
    var step = 100;
    while ((b.w / (b.b - b.a)) * step < 60) step *= 2;
    for (var y = Math.ceil(b.a / step) * step; y < b.b; y += step) {
      if (y === b.a) continue;
      var x = (y - b.a) / (b.b - b.a) * b.w;
      s += '<s style="left:' + x.toFixed(1) + 'px"><em>' + yr(y) + "</em></s>";
    }
    if (b.w >= 90) {
      s += "<b><span>" + esc(e.n) + "</span><em>" + (b.w < 168 ? yr(e.a) : yrs(e.a, e.b)) + "</em></b>";
    }
    s += "</div>";
  });
  for (var t = 1; t <= 4; t++) {
    var bd = LAY.bands[t];
    if (!bd || !bd.rows) continue;
    s += '<div class="tierband t' + t + '" style="top:' + (laneY(bd.start) - 24) + "px;height:" +
         (laneY(bd.start + bd.rows) - laneY(bd.start) + 8) + 'px"><i></i><b>' + esc(TIERNAME[t]) + "</b></div>";
  }
  bg.innerHTML = s;
  $("#canvas").style.width = SCALE.total.toFixed(1) + "px";
  $("#canvas").style.height = h + "px";
}

/* ---------------------------------------------------------- the lines */
function anchor(p, side) {
  var x1 = xOf(p.fl || p.b), x2 = Math.max(xOf(p.d), x1 + 12);
  return { x: side === "out" ? x2 : x1, y: laneY(LAY.row[p.id]) + rowH(LAY.row[p.id]) - 12 };
}
/* The kind of a line is its colour, and the switches in the toolbar are the
   legend. Words on the lines as well put three CHALLENGED BY and two READ BY
   across the cards of anyone with ten connections; the dossier says it in
   full sentences, where there is room. */
function renderWires() {
  var svg = $("#wires"), s = "";
  var W = Math.max(SCALE.total, RIGHT), H = PAD + LAY.height + BOTPAD;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  D.edges.forEach(function (e) {
    if (!KINDS[e.k] || !isLine(e)) return;
    var a = BY[e.f], b = BY[e.t];
    if (!a || !b || !visible(a) || !visible(b)) return;
    var p = anchor(a, "out"), q = anchor(b, "in");
    var dx = Math.max(30, Math.abs(q.x - p.x) * 0.36);
    var lit = SEL && (e.f === SEL || e.t === SEL);
    s += '<path class="wire ' + e.k + (lit ? " lit" : "") + '" data-f="' + e.f + '" data-t="' + e.t +
         '" d="M' + p.x.toFixed(1) + "," + p.y.toFixed(1) + " C" + (p.x + dx).toFixed(1) + "," +
         p.y.toFixed(1) + " " + (q.x - dx).toFixed(1) + "," + q.y.toFixed(1) + " " +
         q.x.toFixed(1) + "," + q.y.toFixed(1) + '"/>';
    if (e.k === "taught") {
      s += '<path class="head taught' + (lit ? " lit" : "") + '" data-f="' + e.f + '" data-t="' + e.t +
           '" d="M' + (q.x - 7).toFixed(1) + "," + (q.y - 3.4).toFixed(1) + "L" + q.x.toFixed(1) + "," +
           q.y.toFixed(1) + "L" + (q.x - 7).toFixed(1) + "," + (q.y + 3.4).toFixed(1) + 'z"/>';
    }
    /* the chosen thinker's own lines say what they are, at the midpoint of
       the curve, in the line's own colour */
  });
  svg.innerHTML = s;
  svg.classList.toggle("sel", !!SEL);
}

/* ---------------------------------------------------------- the people */
function renderFolk() {
  var frag = document.createDocumentFragment();
  NODE = {};
  D.people.forEach(function (p) {
    if (!visible(p)) return;
    var b = document.createElement("button");
    b.className = "who";
    b.tabIndex = -1;
    b.dataset.id = p.id; b.dataset.ti = String(p.ti);
    b.setAttribute("aria-label", p.n + ", " + span(p) + (p.sch ? ", " + p.sch : "") + ". " + p.one);
    b.innerHTML =
      '<span class="card"><span class="n">' + esc(p.n) + "</span>" +
      '<span class="meta">' + esc(span(p)) + "</span>" +
      (p.sch ? '<span class="sch">' + esc(p.sch) + "</span>" : "") +
      (p.one ? '<span class="one">' + rich(p.one) + "</span>" : "") + "</span>" +
      '<span class="rule' + (p.cb || p.cd ? " circa" : "") + '"></span>';
    frag.appendChild(b);
    NODE[p.id] = b;
  });
  var host = $("#folk");
  host.innerHTML = "";
  host.appendChild(frag);
  placeFolk();
  $("#canvas").style.width = Math.max(SCALE.total, RIGHT).toFixed(1) + "px";
  ORDER = D.people.filter(visible).slice().sort(function (a, b) {
    return (LAY.row[a.id] - LAY.row[b.id]) || (a.b - b.b);
  });
  rove(SEL && NODE[SEL] ? SEL : (ORDER[0] || {}).id);
}
var RIGHT = 0;                    /* the right edge of the rightmost card */
function placeFolk() {
  RIGHT = 0;
  D.people.forEach(function (p) {
    var el = NODE[p.id];
    if (!el) return;
    var ex = extent(p);
    RIGHT = Math.max(RIGHT, ex.right + 4);
    el.style.left = ex.left.toFixed(1) + "px";
    el.style.top = laneY(LAY.row[p.id]) + "px";
    el.style.width = (ex.right - ex.left).toFixed(1) + "px";
    el.style.height = (rowH(LAY.row[p.id]) - 10) + "px";
    el.style.setProperty("--eg", egVar(p.ep));
    var card = el.querySelector(".card"), rule = el.querySelector(".rule");
    card.style.width = ex.w + "px"; card.style.left = (ex.cx - ex.left).toFixed(1) + "px";
    rule.style.width = Math.max(ex.x2 - ex.x1, 10).toFixed(1) + "px";
    rule.style.left = (ex.x1 - ex.left).toFixed(1) + "px";
  });
}

/* One tab stop, not a hundred and seventeen: exactly one card is tabbable and
   the arrow keys move between them, left and right along a row in time
   order, up and down between rows. */
function rove(id) {
  if (!id || !NODE[id]) { ROVE = null; return; }
  if (ROVE && NODE[ROVE]) NODE[ROVE].tabIndex = -1;
  ROVE = id; NODE[id].tabIndex = 0;
}
function roveBy(dRow, dCol) {
  if (!ORDER.length) return;
  var i = 0;
  for (var k = 0; k < ORDER.length; k++) if (ORDER[k].id === ROVE) { i = k; break; }
  var cur = ORDER[i], want = null;
  if (dCol) want = ORDER[Math.max(0, Math.min(ORDER.length - 1, i + dCol))];
  else {
    var row = LAY.row[cur.id] + dRow, bd = Infinity;
    ORDER.forEach(function (p) {
      if (Math.round(LAY.row[p.id]) !== Math.round(row)) return;
      var d = Math.abs(p.b - cur.b);
      if (d < bd) { bd = d; want = p; }
    });
  }
  if (!want) return;
  rove(want.id); NODE[want.id].focus(); reveal(want.id);
}

/* ---------------------------------------------------------- draw it all */
function draw() {
  SCALE = buildScale();
  LAY = buildLayout();
  renderGround();
  renderFolk();
  renderWires();
  applySelection();
}

/* ---------------------------------------------------------- the rail */
function renderRail() {
  var host = $("#rails"), s = "";
  D.epochs.forEach(function (e, i) {
    var shown = SCALE.bands[i].n, quiet = shown === 0;
    s += '<button class="age' + (quiet ? " quiet" : "") + (AGE === i ? " on" : "") + '" data-i="' + i +
         '" style="--eg:' + egVar(i) + '" aria-pressed="' + (AGE === i) + '" aria-label="' +
         esc(e.n) + ", " + yr(e.a) + " to " + yr(e.b) + ", " + e.n_all + " " + plural(e.n_all, "thinker") +
         (quiet ? ", none shown at this setting; press to widen" : "") + '">' +
         '<span class="thumb">' + SCENE(i) + "</span>" +
         '<span class="txt"><span class="nm">' + esc(e.n) + "</span>" +
         '<span class="yr">' + yrs(e.a, e.b) + "</span>" +
         "" +
         '<span class="ct"><span class="full">' +
         (quiet ? e.n_all + " " + plural(e.n_all, "thinker") + " · press to widen"
                : (shown === e.n_all ? shown + " " + plural(shown, "thinker")
                                     : shown + " of " + e.n_all + " shown")) +
         '</span><span class="brief">' +
         (quiet ? "0 of " + e.n_all : (shown === e.n_all ? String(shown) : shown + " of " + e.n_all)) +
         "</span></span></span></button>";
  });
  host.innerHTML = s;
}

/* ---------------------------------------------------------- the dossier */
function nWorks(p) {
  return p.works.reduce(function (n, line) {
    return n + line.split(";").filter(function (t) { return t.trim().length > 1; }).length;
  }, 0);
}
function swatch(k) {
  var st = { taught: 'stroke="var(--taught)" stroke-width="2"',
             read: 'stroke="var(--readby)" stroke-width="1.3"',
             reacted: 'stroke="var(--challenged)" stroke-width="1.5" stroke-dasharray="3.5 2.5"',
             transmitted: 'stroke="var(--carried)" stroke-width="1.6" stroke-dasharray="1.2 3" stroke-linecap="round"',
             echo: 'stroke="var(--ink-4)" stroke-width="1.2" stroke-dasharray="2 2.5"' }[k] || "";
  return '<svg class="sw" viewBox="0 0 18 6" aria-hidden="true"><path d="M0 3h18" ' + st + "/></svg>";
}
function hero(i, kk, title, sub) {
  return '<div class="hero" style="--eg:' + egVar(i) + '">' + SCENE(i) +
         '<div class="cap"><div class="kk">' + esc(kk) + "</div><h2>" + esc(title) + "</h2>" +
         (sub ? '<div class="sl">' + sub + "</div>" : "") + "</div></div>";
}

function renderPanel() {
  var host = $("#panelBody");
  if (SEL) { host.innerHTML = dossier(BY[SEL]); $("#sheetTitle").textContent = "Dossier"; }
  else if (AGE !== null) { host.innerHTML = ageIntro(AGE); $("#sheetTitle").textContent = "The age"; }
  else { host.innerHTML = guide(); $("#sheetTitle").textContent = "How to read this"; }
  $("#roWho").textContent = SEL ? BY[SEL].n : "Nobody yet";
}

function dossier(p) {
  var out = OUT[p.id] || [], inn = IN[p.id] || [];
  var every = out.concat(inn);
  var all = every.filter(isLine), echoes = every.filter(function (e) { return !isLine(e); });
  var shown = all.filter(function (e) { var o = BY[e.f === p.id ? e.t : e.f]; return o && visible(o); }).length;
  var hidden = all.length - shown;
  var deepest = all.reduce(function (m, e) { var o = BY[e.f === p.id ? e.t : e.f]; return o ? Math.max(m, o.ti) : m; }, 1);

  function row(e) {
    var other = BY[e.f === p.id ? e.t : e.f];
    if (!other) return "";
    var off = !visible(other);
    return '<button class="link' + (off ? " off" : "") + '" data-go="' + other.id +
           '" title="' + esc(relLabel(e, p.id, true)) + '" aria-label="' + esc(relLabel(e, p.id, true)) +
           (off ? " (not shown at this setting; press to show)" : "") + '">' + swatch(e.k) +
           '<span><span class="rel">' + esc(relLabel(e, p.id)) + '</span><span class="nm">' + esc(other.n) +
           "</span>" + (e.note ? '<span class="note">' + rich(e.note) + "</span>" : "") +
           "</span><span class=\"yr\">" + (other.b < 0 ? Math.abs(other.b) + " BCE" : other.b) + "</span></button>";
  }
  var order = { taught: 0, transmitted: 1, read: 2, reacted: 3, echo: 4 };
  function sortRel(a, b) { return (order[a.k] - order[b.k]) || (BY[a.f === p.id ? a.t : a.f].b - BY[b.f === p.id ? b.t : b.f].b); }

  return hero(p.ep, D.epochs[p.ep].n, p.n, esc(span(p)) + (p.pl ? " &middot; " + esc(p.pl) : "")) +
    '<div class="tallies">' +
      '<div class="tally"><div class="v">' + p.ideas.length + '</div><div class="k">Ideas</div></div>' +
      '<div class="tally"><div class="v">' + nWorks(p) + '</div><div class="k">Works</div></div>' +
      '<div class="tally"><div class="v">' + shown + (hidden ? '<span style="color:var(--ink-3);font-size:12px"> / ' + all.length + "</span>" : "") +
        '</div><div class="k">' + (hidden ? "Lines shown" : "Lines") + "</div></div>" +
    "</div>" +
    '<div class="pscroll">' +
      (p.sch ? '<div class="k" style="margin-bottom:4px">' + esc(p.sch) + "</div>" : "") +
      (p.one ? '<p class="one-l">' + rich(p.one) + "</p>" : "") +
      '<div class="sec"><h3>Key ideas</h3><ul>' + p.ideas.map(function (t) { return "<li>" + rich(t) + "</li>"; }).join("") + "</ul></div>" +
      (p.works.length ? '<div class="sec"><h3>Works</h3><div class="works">' + p.works.map(rich).join(" ") + "</div></div>" : "") +
      (all.length ? '<div class="sec"><h3>Connections</h3><div class="links">' +
          all.slice().sort(sortRel).map(row).join("") + "</div>" +
          (hidden ? '<div class="more"><span>' + hidden + " of these " + plural(hidden, "is", "are") +
             " not shown at this setting.</span><button data-tier=\"" + deepest + '">Show them</button></div>' : "") +
        "</div>" : "") +
      (echoes.length ? '<div class="sec"><h3>Parallel, not descent</h3><div class="links">' +
          echoes.map(row).join("") + "</div></div>" : "") +
      (p.q && p.q.t !== p.one ? '<div class="sec"><h3>A quotation</h3><blockquote class="quote">' + rich(p.q.t) +
             "<cite>" + esc(p.q.s) + "</cite></blockquote></div>" : "") +
    "</div>";
}

function ageIntro(i) {
  var e = D.epochs[i];
  var folk = D.people.filter(function (p) { return p.ep === i; }).sort(function (a, b) { return a.ti - b.ti || a.b - b.b; });
  var shown = folk.filter(visible), hid = folk.length - shown.length;
  return hero(i, "Age " + (i + 1) + " of 10", e.n, yr(e.a) + " – " + yr(e.b)) +
    '<div class="tallies">' +
      '<div class="tally"><div class="v">' + folk.length + '</div><div class="k">' + plural(folk.length, "Thinker") + "</div></div>" +
      '<div class="tally"><div class="v">' + shown.length + '</div><div class="k">Shown</div></div>' +
      '<div class="tally"><div class="v">' + (e.b - e.a) + '</div><div class="k">Years</div></div>' +
    "</div>" +
    '<div class="pscroll"><p class="prose">' + rich(e.d) + "</p>" +
      (shown.length ? '<div class="sec"><h3>Who is here</h3><div class="ppl">' +
        shown.map(function (p) { return '<button data-go="' + p.id + '">' + esc(p.n) + "</button>"; }).join("") +
        "</div>" + (hid ? '<div class="more"><span>' + hid + " more " + plural(hid, "waits", "wait") +
          " at a wider setting.</span><button data-tier=\"" +
          folk.reduce(function (m, p) { return Math.max(m, p.ti); }, 1) + '">Show them</button></div>' : "") +
        "</div>" : '<div class="more"><span>None of this age is on the map yet.</span><button data-tier="' +
          folk.reduce(function (m, p) { return Math.min(m, p.ti); }, 4) + '">Show them</button></div>') +
    "</div>";
}

function guide() {
  return '<div class="pscroll guide">' +
    '<p class="one-l" style="font-size:16px">Ten ages, ' + D.people.length +
      ' thinkers, and a line wherever one taught, read or argued with another.</p>' +
    '<div class="row"><div class="g"><svg viewBox="0 0 40 28" width="40" height="28" aria-hidden="true">' +
      '<rect x="2" y="4" width="36" height="13" rx="4" fill="var(--surface-2)" stroke="var(--rule)"/>' +
      '<rect x="2" y="21" width="26" height="5" rx="2.5" fill="var(--e1)"/></svg></div>' +
      "<p>A card is a thinker; the bar beneath it is the lifespan, to scale. Choose one and the atlas turns to it.</p></div>" +
    '<div class="row"><div class="g"><svg viewBox="0 0 40 28" width="40" height="28" aria-hidden="true">' +
      '<rect x="0" y="0" width="13" height="28" fill="var(--e1)" opacity=".3"/>' +
      '<rect x="13" y="0" width="13" height="28" fill="var(--e4)" opacity=".3"/>' +
      '<rect x="26" y="0" width="14" height="28" fill="var(--e7)" opacity=".3"/></svg></div>' +
      "<p>Left to right is time, in ten ages; top to bottom is how much a thinker moved.</p></div>" +
    '<div class="row"><div class="g"><svg viewBox="0 0 40 28" width="40" height="28" aria-hidden="true">' +
      '<path d="M2 7h30" stroke="var(--taught)" stroke-width="2.2"/>' +
      '<path d="M2 15h34" stroke="var(--readby)" stroke-width="1.4"/>' +
      '<path d="M2 23h34" stroke="var(--challenged)" stroke-width="1.6" stroke-dasharray="3.5 2.5"/></svg></div>' +
      "<p>The colour of a line is what passed between two people. The switches above name them.</p></div>" +
    "</div>";
}

/* ---------------------------------------------------------- selection */
function applySelection() {
  var near = {};
  if (SEL) {
    near[SEL] = 1;
    (OUT[SEL] || []).forEach(function (e) { if (isLine(e)) near[e.t] = 1; });
    (IN[SEL] || []).forEach(function (e) { if (isLine(e)) near[e.f] = 1; });
  }
  $$(".who").forEach(function (b) {
    var id = b.dataset.id;
    b.classList.toggle("on", id === SEL);
    b.classList.toggle("near", !!SEL && id !== SEL && !!near[id]);
    b.classList.toggle("dim", !!SEL && !near[id]);
  });
}

/* Choosing anyone rebuilds the cards and the dossier, which detaches whatever
   had focus and drops a keyboard reader back to the top of the document. Note
   what was focused, by name rather than by element, and put it back on the
   thing that replaced it. */
function focusKey() {
  var a = document.activeElement;
  if (!a || !a.closest) return null;
  var w = a.closest(".who");
  if (w) return { kind: "who", id: w.dataset.id };
  var l = a.closest(".link,[data-go]");
  if (l && l.dataset.go) return { kind: "go", id: l.dataset.go };
  return a.id ? { kind: "id", id: a.id } : null;
}
function restoreFocus(k) {
  var el = k && (k.kind === "who" ? NODE[k.id]
               : k.kind === "go" ? $('[data-go="' + k.id + '"]')
               : document.getElementById(k.id));
  if (el && el.focus) { el.focus({ preventScroll: true }); return true; }
  return false;
}

/* ---------------------------------------------------------- choosing */
function select(id, opts) {
  opts = opts || {};
  var was = SEL, fk = focusKey();
  SEL = id && BY[id] ? id : null;
  if (SEL && !visible(BY[SEL])) setTier(BY[SEL].ti, { quiet: true });
  else if (was !== SEL) draw();               /* the centrepiece changes the packing */
  renderPanel();
  $("#btnReset").hidden = !SEL && AGE === null;
  if (SEL) {
    setAge(BY[SEL].ep, { quiet: true });
    if (!opts.quiet) reveal(SEL);
    rove(SEL);
    if (fk && fk.kind === "who") fk = { kind: "who", id: SEL };
    /* Following a link to someone whose own page has no link back leaves
       nothing to return to. The card of the person now open is the right
       place to be; on a phone the sheet takes focus instead. */
    if (fk && !restoreFocus(fk) && !narrow()) restoreFocus({ kind: "who", id: SEL });
    openSheet(opts.fromEl || null);
  } else {
    restoreFocus(fk);
    closeSheet(false);
  }
  syncHash();
}

function reveal(id) {
  var el = NODE[id];
  if (!el) return;
  var sc = $("#scroll");
  var x = parseFloat(el.style.left), w = parseFloat(el.style.width), y = parseFloat(el.style.top);
  var h = el.offsetHeight || 100;
  var left = sc.scrollLeft, top = sc.scrollTop;
  if (x < left + 30 || x + w > left + sc.clientWidth - 30) left = Math.max(0, x - sc.clientWidth * 0.36);
  /* A chosen card grows, and on a phone held sideways it is most of the
     height there is. Measure it: a fixed hundred-point allowance left the
     foot of one four points below the edge and called that visible. */
  if (y < top + 10 || y + h > top + sc.clientHeight - 6)
    top = Math.max(0, y - Math.max(10, (sc.clientHeight - h) * 0.4));
  if (left !== sc.scrollLeft || top !== sc.scrollTop) sc.scrollTo({ left: left, top: top, behavior: "smooth" });
}

/* Pressing an age goes there. If nobody in it is showing, the setting widens
   until somebody is: a rail that says "press one to go there" has to mean it. */
function setAge(i, opts) {
  opts = opts || {};
  AGE = i;
  if (AGE !== null && !opts.quiet) {
    var here = D.people.filter(function (p) { return p.ep === AGE; });
    if (here.length && !here.some(visible)) {
      setTier(here.reduce(function (m, p) { return Math.min(m, p.ti); }, 4), { quiet: true });
    }
  }
  $$(".age").forEach(function (b) {
    var on = +b.dataset.i === i;
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
  });
  $$(".ageband").forEach(function (b) { b.classList.toggle("on", +b.dataset.i === i); });
  var e = i === null ? null : D.epochs[i];
  $("#btnReset").hidden = !SEL && i === null;
  $("#roAge").textContent = e ? e.n : "All ten";
  $("#roAgeArt").style.background = e ? egVar(i) : "transparent";
  if (!opts.quiet && e) frameAge(i);
  if (!SEL) renderPanel();
  if (!opts.quiet) syncHash();     /* a quiet setAge at start-up must not erase
                                      the address the reader arrived with */
}

/* Where an age's people actually are. Forty-three of the hundred and
   seventeen were born in an age earlier than the one their work belongs to --
   Plato is classical but born archaic -- and a card sits over its birth. So
   framing the band alone put six of the classical moment's nine off the left
   edge. Frame what is in the age, band included. */
function ageSpan(i) {
  var b = SCALE.bands[i], lo = b.x0, hi = b.x0 + b.w;
  D.people.forEach(function (p) {
    if (p.ep !== i || !visible(p)) return;
    var ex = extent(p);
    lo = Math.min(lo, ex.left); hi = Math.max(hi, ex.right);
  });
  return { lo: lo, hi: hi };
}
function frameAge(i) {
  var sc = $("#scroll"), room = sc.clientWidth - 40;
  setZoom(ageZ(i));
  var sp = ageSpan(i);
  if (sp.hi - sp.lo > room) {                 /* the people need more room than the band */
    setZoom(Z * room / (sp.hi - sp.lo));
    sp = ageSpan(i);
  }
  sc.scrollTo({ left: Math.max(0, sp.lo - 20), top: 0, behavior: "smooth" });
}

function setTier(t, opts) {
  opts = opts || {};
  TIER = Math.max(1, Math.min(4, t));
  $$("#seg button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.t === TIER)); });
  var atOverview = Math.abs(Z - ZMIN) < 1e-6;
  ZMIN = overviewZ();
  if (atOverview || Z < ZMIN) Z = ZMIN;
  draw();
  renderRail();
  $("#zFit").setAttribute("aria-pressed", String(Math.abs(Z - ZMIN) < 1e-6));
  if (!opts.quiet) { renderPanel(); syncHash(); }
}

/* ---------------------------------------------------------- zoom
   A zoom keeps the year under the cursor (or the middle of the window)
   where it is, and never goes below the overview, so there is never an
   empty margin to the right of the last age. */
function setZoom(z, anchorPx) {
  var sc = $("#scroll");
  ZMIN = overviewZ();
  var cx = anchorPx === undefined ? sc.clientWidth / 2 : anchorPx;
  var year = yearOf(sc.scrollLeft + cx);
  Z = Math.max(ZMIN, Math.min(ZMAX, z));
  draw();
  sc.scrollLeft = xOf(year) - cx;
  $("#zFit").setAttribute("aria-pressed", String(Math.abs(Z - ZMIN) < 1e-6));
}
function overview() { setZoom(overviewZ()); $("#scroll").scrollTo({ left: 0, top: 0 }); }

/* ---------------------------------------------------------- the sheet
   On a phone the dossier is a sheet that rises from the bottom. Opening it
   moves focus in; closing it gives focus back to whatever opened it, and
   marks the sheet inert so a hidden dossier is not a hundred hidden tab
   stops. On a wide screen it is a column and none of this applies. */
var SHEET_FROM = null, SHEET_FROM_ID = null;
function narrow() {
  var b = $(".body");
  return b ? getComputedStyle(b).flexDirection === "column"
           : window.matchMedia("(max-width:900px)").matches;
}
function openSheet(fromEl) {
  var p = $("#panel");
  if (!narrow()) return;
  SHEET_FROM = fromEl || document.activeElement;
  SHEET_FROM_ID = SHEET_FROM && SHEET_FROM.dataset ? SHEET_FROM.dataset.id || null : null;
  var was = SEL;
  p.classList.add("up"); p.inert = false; p.removeAttribute("aria-hidden");
  $(".atlas").classList.add("drawer");
  setTimeout(function () { var c = $("#sheetClose"); if (c) c.focus({ preventScroll: true }); }, 60);
  setTimeout(function () {
    if (SEL && SEL === was && p.classList.contains("up")) reveal(SEL);
  }, 300);
}
function closeSheet(refocus) {
  var p = $("#panel");
  if (!narrow()) return;
  p.classList.remove("up"); p.inert = true; p.setAttribute("aria-hidden", "true");
  $(".atlas").classList.remove("drawer");
  if (!refocus) return;
  var back = SHEET_FROM_ID && NODE[SHEET_FROM_ID] ? NODE[SHEET_FROM_ID]
           : (SHEET_FROM && SHEET_FROM.isConnected ? SHEET_FROM : null);
  if (back && back.focus) { rove(back.dataset ? back.dataset.id : null); back.focus({ preventScroll: true }); }
}
function syncSheet() {
  var p = $("#panel");
  $("#lines").open = !narrow();
  if (narrow()) { if (!p.classList.contains("up")) { p.inert = true; p.setAttribute("aria-hidden", "true"); } }
  else { p.classList.remove("up"); p.inert = false; p.removeAttribute("aria-hidden");
         $(".atlas").classList.remove("drawer"); }
}

/* ---------------------------------------------------------- the address
   Who, which age and how much is showing live in the hash, so a link to a
   thinker is a link to that thinker and Back retraces the walk. */
var HASHING = false;
function syncHash() {
  if (HASHING) return;
  var parts = [];
  if (SEL) parts.push("who=" + SEL);
  else if (AGE !== null) parts.push("age=" + (AGE + 1));
  if (TIER !== 1) parts.push("show=" + TIER);
  var h = parts.length ? "#" + parts.join("&") : "";
  if (h !== location.hash && !(h === "" && location.hash === "")) {
    try { history.pushState(null, "", location.pathname + location.search + h); } catch (e) { location.hash = h; }
  }
}
function readHash(initial) {
  var q = {}, h = location.hash.replace(/^#/, "");
  h.split("&").forEach(function (kv) { var m = kv.split("="); if (m[0]) q[m[0]] = decodeURIComponent(m[1] || ""); });
  HASHING = true;
  try {
    /* The address is the whole state, so a hash without a detail level means
       the opening one. Applying it only when present left Back on a widened
       view after a visit to a crowded age. */
    var want = q.show && +q.show >= 1 && +q.show <= 4 ? +q.show : 1;
    if (want !== TIER) setTier(want, { quiet: true });
    /* a link to a thinker or an age arrives THERE: revealed, widened if need
       be, and with the age zoomed to the window, the same as pressing it */
    if (q.who && BY[q.who]) select(q.who);
    else if (q.age && +q.age >= 1 && +q.age <= D.epochs.length) { SEL = null; draw(); setAge(+q.age - 1); renderPanel(); }
    else if (!initial) { SEL = null; AGE = null; draw(); setAge(null, { quiet: true }); renderPanel(); }
  } finally { HASHING = false; }
}

/* ---------------------------------------------------------- search */
var HIT = -1, HITS = [];
function search(qs) {
  qs = qs.trim().toLowerCase();
  var box = $("#hits"), inp = $("#q");
  $("#search").classList.toggle("has", !!qs);
  if (!qs) { box.classList.remove("open"); box.innerHTML = ""; inp.setAttribute("aria-expanded", "false"); HITS = []; return; }
  var tr = D.traditions || {};
  HITS = D.people.filter(function (p) {
    var t = tr[p.tr] ? (tr[p.tr].n + " " + tr[p.tr].full).toLowerCase() : "";
    return p.n.toLowerCase().indexOf(qs) >= 0 || (p.sch || "").toLowerCase().indexOf(qs) >= 0 ||
           (p.pl || "").toLowerCase().indexOf(qs) >= 0 || t.indexOf(qs) >= 0;
  }).sort(function (a, b) {
    var an = a.n.toLowerCase().indexOf(qs) === 0 ? 0 : 1, bn = b.n.toLowerCase().indexOf(qs) === 0 ? 0 : 1;
    return an - bn || a.ti - b.ti || a.b - b.b;
  });
  var total = HITS.length;
  HITS = HITS.slice(0, 9);
  HIT = HITS.length ? 0 : -1;
  box.innerHTML = HITS.length ? HITS.map(function (p, i) {
    return '<li role="option" id="hit-' + p.id + '" aria-selected="' + (i === HIT) + '"><button class="hit" data-go="' + p.id + '" tabindex="-1">' +
      '<span><span class="n">' + esc(p.n) + '</span><span class="s">' + esc(p.sch || "") +
      (tr[p.tr] ? (p.sch ? " · " : "") + esc(tr[p.tr].n) : "") + "</span></span>" +
      '<span><span class="y">' + esc(span(p)) + "</span>" + (visible(p) ? "" : '<br><span class="hid">hidden · show</span>') +
      "</span></button></li>";
  }).join("") + (total > HITS.length
      ? '<li class="nohit">' + HITS.length + " of " + total + " matches. Type more to narrow it.</li>"
      : "") : '<li class="nohit">Nobody by that name, school or tradition.</li>';
  box.classList.add("open"); inp.setAttribute("aria-expanded", "true");
  inp.setAttribute("aria-activedescendant", HIT >= 0 ? "hit-" + HITS[HIT].id : "");
}
function pickHit(i) {
  var p = HITS[i]; if (!p) return;
  $("#q").value = ""; search("");
  select(p.id, { fromEl: $("#q") });
  if (!narrow()) { var n = NODE[p.id]; if (n) n.focus({ preventScroll: true }); }
}

/* ---------------------------------------------------------- wiring up */
function bind() {
  $("#rails").addEventListener("click", function (ev) {
    var b = ev.target.closest(".age"); if (!b) return;
    var i = +b.dataset.i;
    if (AGE === i && !SEL) { setAge(null, { quiet: true }); overview(); renderPanel(); return; }
    if (SEL) { SEL = null; draw(); }
    setAge(i); renderPanel();
  });
  $("#folk").addEventListener("click", function (ev) {
    var b = ev.target.closest(".who"); if (!b) return;
    select(b.dataset.id === SEL ? null : b.dataset.id, { fromEl: b });
  });
  $("#folk").addEventListener("focusin", function (ev) {
    var b = ev.target.closest(".who"); if (b) rove(b.dataset.id);
  });
  $("#folk").addEventListener("keydown", function (ev) {
    if (!ev.target.closest(".who")) return;
    var k = ev.key;
    if (k === "ArrowRight") roveBy(0, 1); else if (k === "ArrowLeft") roveBy(0, -1);
    else if (k === "ArrowDown") roveBy(1, 0); else if (k === "ArrowUp") roveBy(-1, 0);
    else if (k === "Home") { rove((ORDER[0] || {}).id); if (ROVE) { NODE[ROVE].focus(); reveal(ROVE); } }
    else if (k === "End") { rove((ORDER[ORDER.length - 1] || {}).id); if (ROVE) { NODE[ROVE].focus(); reveal(ROVE); } }
    else return;
    ev.preventDefault();
  });
  $("#panelBody").addEventListener("click", function (ev) {
    var go = ev.target.closest("[data-go]");
    if (go) { select(go.dataset.go, { fromEl: go }); return; }
    var t = ev.target.closest("[data-tier]");
    if (t) { setTier(+t.dataset.tier); if (SEL) reveal(SEL); }
  });
  $("#seg").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (b) setTier(+b.dataset.t);
  });
  $$(".kind").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.dataset.k;
      KINDS[k] = !KINDS[k];
      b.setAttribute("aria-pressed", String(KINDS[k]));
      renderWires();
    });
  });
  $("#zIn").onclick = function () { setZoom(Z * 1.3); };
  $("#zOut").onclick = function () { setZoom(Z / 1.3); };
  $("#zFit").onclick = overview;
  $("#btnReset").onclick = function () { SEL = null; draw(); setAge(null, { quiet: true }); renderPanel(); closeSheet(true); syncHash(); };
  $("#sheetClose").onclick = function () { closeSheet(true); };
  $("#scroll").addEventListener("wheel", function (ev) {
    if (!ev.ctrlKey && !ev.metaKey) return;
    ev.preventDefault();
    var r = this.getBoundingClientRect();
    setZoom(Z * (ev.deltaY < 0 ? 1.12 : 1 / 1.12), ev.clientX - r.left);
  }, { passive: false });
  $("#scroll").addEventListener("keydown", function (ev) {
    if (ev.target !== this) return;
    var step = ev.shiftKey ? this.clientWidth : 90;
    if (ev.key === "ArrowRight") this.scrollLeft += step; else if (ev.key === "ArrowLeft") this.scrollLeft -= step;
    else if (ev.key === "ArrowDown") this.scrollTop += 70; else if (ev.key === "ArrowUp") this.scrollTop -= 70;
    else if (ev.key === "Home") this.scrollLeft = 0; else if (ev.key === "End") this.scrollLeft = this.scrollWidth;
    else return;
    ev.preventDefault();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      if ($("#hits").classList.contains("open")) { search(""); $("#q").value = ""; return; }
      if (SEL) {
        var back = SEL;                 /* by id: draw() replaces the element */
        SEL = null; draw(); renderPanel(); closeSheet(true); syncHash();
        if (!narrow() && NODE[back]) { rove(back); NODE[back].focus({ preventScroll: true }); }
      }
    }
  });

  /* search */
  var q = $("#q");
  q.addEventListener("input", function () { search(q.value); });
  q.addEventListener("focus", function () { if (q.value) search(q.value); });
  q.addEventListener("keydown", function (ev) {
    if (!HITS.length) return;
    if (ev.key === "ArrowDown") { HIT = (HIT + 1) % HITS.length; }
    else if (ev.key === "ArrowUp") { HIT = (HIT - 1 + HITS.length) % HITS.length; }
    else if (ev.key === "Enter") { ev.preventDefault(); pickHit(HIT); return; }
    else return;
    ev.preventDefault();
    $$("#hits li").forEach(function (li, i) { li.setAttribute("aria-selected", String(i === HIT)); });
    q.setAttribute("aria-activedescendant", "hit-" + HITS[HIT].id);
  });
  $("#hits").addEventListener("mousedown", function (ev) { ev.preventDefault(); });
  $("#hits").addEventListener("click", function (ev) {
    var b = ev.target.closest(".hit"); if (!b) return;
    pickHit(HITS.findIndex(function (p) { return p.id === b.dataset.go; }));
  });
  $("#qClr").onclick = function () { q.value = ""; search(""); q.focus(); };
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest("#search")) { $("#hits").classList.remove("open"); q.setAttribute("aria-expanded", "false"); }
  });

  $("#btnTheme").onclick = function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { var st = JSON.parse(localStorage.getItem("library:v1") || "{}"); st.theme = next;
          localStorage.setItem("library:v1", JSON.stringify(st)); } catch (e) { }
  };
  window.addEventListener("popstate", function () { readHash(false); });
  var t;
  addEventListener("resize", function () {
    clearTimeout(t);
    t = setTimeout(function () {
      var atOv = Math.abs(Z - ZMIN) < 1e-6;
      ZMIN = overviewZ(); if (atOv || Z < ZMIN) Z = ZMIN;
      draw(); syncSheet();
    }, 140);
  });
}

/* ---------------------------------------------------------- start */
function start(data) {
  D = data;
  BY = {}; D.people.forEach(function (p) { BY[p.id] = p; });
  OUT = {}; IN = {};
  D.edges.forEach(function (e) { (OUT[e.f] = OUT[e.f] || []).push(e); (IN[e.t] = IN[e.t] || []).push(e); });
  var counts = {};
  D.people.forEach(function (p) { for (var t = p.ti; t <= 4; t++) counts[t] = (counts[t] || 0) + 1; });
  $$("#seg button").forEach(function (b) { b.querySelector("i").textContent = counts[+b.dataset.t] || 0; });
  bind();
  syncSheet();
  ZMIN = overviewZ(); Z = ZMIN;
  setTier(1, { quiet: true });
  setAge(null, { quiet: true });
  renderPanel();
  readHash(true);
}

fetch("data/atlas.json")
  .then(function (r) { if (!r.ok) throw new Error("atlas.json " + r.status); return r.json(); })
  .then(start)
  .catch(function (err) {
    $("#panelBody").innerHTML = '<div class="pscroll"><p class="one-l">The atlas could not be loaded.</p><p class="prose">' +
      esc(String(err)) + "<br>If you are offline and have not opened this book before, it is not stored yet.</p></div>";
  });
</script>
</body>
</html>
