    - BC-590
    digest:
      methods: Report of 71 patients with hormone receptor-positive, HER2-mutant metastatic breast cancer in the SUMMIT basket
        study, including 21 from a randomized substudy. Patients with activating HER2 mutations and prior CDK4/6 inhibitor
        therapy received neratinib 240 mg per day with loperamide prophylaxis plus fulvestrant and trastuzumab, or fulvestrant
        plus trastuzumab, or fulvestrant alone, with cross-over allowed on progression. Endpoints included objective response
        rate, clinical benefit rate, duration of response and progression-free survival.
      results: Objective response rate for the 57 patients given neratinib, fulvestrant and trastuzumab was 39% (95% CI 26%
        to 52%), and median progression-free survival was 8.3 months (95% CI 6.0 to 15.1). No responses occurred with fulvestrant
        alone or fulvestrant plus trastuzumab. Patients crossing over to the triplet responded. Responses occurred with ductal
        and lobular histology, one or more HER2 mutations and co-occurring HER3 mutations. Circulating tumour DNA showed acquired
        HER2 and PIK3CA alterations.
