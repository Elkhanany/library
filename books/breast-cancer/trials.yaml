  ea2108:
    acronym: EA2108
    arms: locoregional therapy of the primary site, surgery and radiotherapy to non-metastatic standards, vs continuing systemic
      therapy alone
    chapters:
    - BC-550
    - BC-600
    digest:
      methods: Randomised trial in women presenting with metastatic breast cancer and an intact primary tumour. All received
        systemic therapy for 4 to 8 months, and those without progression were randomly assigned to locoregional therapy of
        the primary site, surgery and radiotherapy to the standards used in non-metastatic disease, or to continuing systemic
        therapy. The primary endpoint was overall survival, with locoregional control and quality of life secondary.
      results: Of 390 enrolled, 256 were randomised, 125 to early locoregional therapy and 131 to continued systemic therapy.
        3-year overall survival was 68.4% and 67.9%, hazard ratio 1.11 (90% CI 0.82-1.52), p=0.57, with median survival 54.9
        and 53.1 months. Locoregional progression at 3 years was 16.3% against 39.8%, p<0.001. Quality of life was largely
        similar.
    endpoint: overall survival
    line: any
    modality: surgery,radiation
    n: 256
    note: Randomisation followed a run-in of systemic therapy, so the population is selected for disease that did not progress
      on it. The trial answers what local therapy adds to a responding patient, not what it adds to everyone presenting de
      novo. No registration identifier is stated in the publication on the record, so none is entered here.
    os: median 54.9 months with early locoregional therapy against 53.1 months without
    phase: 3
    population: de novo metastatic breast cancer with an intact primary tumour and no progression after 4 to 8 months of systemic
      therapy; 390 enrolled and 256 randomised
