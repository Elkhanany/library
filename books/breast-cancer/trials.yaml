    - BC-840
    digest:
      methods: Patients with a primary tumour larger than 2 cm and histologically confirmed positive nodes (T2-4, N1-3, M0)
        were randomly assigned 1:1 to atezolizumab or placebo with dose-dense doxorubicin and cyclophosphamide, then paclitaxel,
        plus pertuzumab and trastuzumab. After surgery patients continued atezolizumab or placebo with pertuzumab and trastuzumab
