    arms: Stereotactic radiosurgery to the resection cavity versus observation.
    chapters:
    - BC-930
    digest:
      methods: Randomised controlled phase 3 trial at a single tertiary cancer centre in the USA. Eligible patients were older
        than 3 years, had a Karnofsky Performance Score of 70 or higher, could have an MRI, and had complete resection of
        one to three brain metastases with a cavity of 4 cm or less. Patients were assigned 1:1 to stereotactic radiosurgery
        of the cavity within 30 days of surgery or to observation, stratified by primary tumour histology, metastasis size
        and number.
