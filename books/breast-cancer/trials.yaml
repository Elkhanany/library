        but the proportional hazards assumption was violated (P=0.02). Three year overall survival was 98.0% versus 94.0%
        (hazard ratio 0.41, 0.20 to 0.83, P=0.01). Grade 3-4 treatment related adverse events occurred in 66.7% versus 55.0%.
