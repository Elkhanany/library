        radiosurgery, with 128 analysed after four were found ineligible. Median follow up was 11.1 months. Freedom from local
        recurrence at 12 months was 43 percent in the observation group and 72 percent in the radiosurgery group, hazard ratio
        0.46 (95% CI 0.24 to 0.88, p=0.015). There were no adverse events or treatment related deaths in either group.
