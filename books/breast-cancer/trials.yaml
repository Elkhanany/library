  tnt:
    acronym: TNT
    arms: Carboplatin versus docetaxel.
    chapters:
    - BC-860
    - BC-920
    digest:
      methods: Phase 3 randomised trial in patients with unselected advanced triple-negative breast cancer. Carboplatin was
        compared with docetaxel. A prespecified protocol allowed biomarker by treatment interaction analyses in germline BRCA1/2
        carriers and in BRCAness subgroups defined by BRCA1 methylation, low BRCA1 mRNA, a Myriad homologous recombination
        deficiency score, and basal-like phenotype. The primary endpoint was objective response rate.
      results: Among 376 patients, 188 received carboplatin and 188 received docetaxel. Objective response rate was 31.4%
        versus 34.0%, P = 0.66. In germline BRCA1/2 carriers response was 68% with carboplatin versus 33% with docetaxel,
        interaction P = 0.01. No such benefit was seen with BRCA1 methylation, BRCA1 mRNA-low tumours or high Myriad homologous
        recombination deficiency score. The basal-like interaction was driven by high docetaxel response in nonbasal tumours.
    endpoint: Objective response rate.
    line: 1L
    modality: chemo
    n: 376
    note: The abstract does not state the treatment line, so the first-line assignment follows the filing rather than the
      published text.
    os: Secondary endpoint. Median 12.8 months with carboplatin against 12.0 months with docetaxel, no evidence of a difference
      (p=0.96); crossover to the other drug was offered at progression.
    phase: 3
    population: Patients with unselected advanced triple-negative breast cancer, with prespecified subgroups defined by germline
      BRCA1/2 mutation and other BRCAness markers.
    primary_ref: tutt2018
    pubs:
    - kind: primary
      ref: tutt2018
