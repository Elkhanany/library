    digest:
      methods: Randomised, double-blind, placebo-controlled phase 3 trial in 36 countries. Adults with germline BRCA1 or BRCA2
        mutations, advanced HER2-negative breast cancer, ECOG 0 to 2, and up to two prior chemotherapy lines for metastatic
        disease were assigned 2:1 to carboplatin AUC 6 plus weekly paclitaxel with veliparib 120 mg twice daily or placebo.
        Veliparib or placebo continued at a higher dose if chemotherapy stopped. Primary endpoint was investigator-assessed
        progression-free survival.
