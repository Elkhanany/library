        as was invasive disease-free survival, 0.91 (0.82-1.02), p=0.116. In postmenopausal women the hazard ratios were 0.82
        (0.67-1.00) and 0.78 (0.64-0.94). Among MAF FISH-negative tumours, 79% of those tested, invasive disease-free survival
        improved, 0.75 (0.58-0.97), and overall survival, 0.69 (0.50-0.94). Bone metastasis as a first recurrence fell, 0.76
        (0.63-0.92). Osteonecrosis of the jaw occurred in 30 patients, 1.8%.
