  inform:
    acronym: INFORM
    arms: Preoperative cisplatin 75 mg/m2 every 3 weeks for four doses versus doxorubicin 60 mg/m2 with cyclophosphamide 600
      mg/m2 every 2 to 3 weeks for four doses, each followed by surgery.
    chapters:
    - BC-810
    - BC-850
    - BC-860
    claim: Cisplatin did not raise pCR over AC in germline BRCA carriers with HER2-negative disease
    digest:
      methods: Randomised multicentre phase 2 trial. Germline BRCA1/2 carriers with cT1-3 tumours of at least 1.5 cm and cN0-3
        HER2-negative breast cancer were randomly assigned to preoperative cisplatin 75 mg/m2 every 3 weeks for four doses
        or to doxorubicin 60 mg/m2 with cyclophosphamide 600 mg/m2 every 2 to 3 weeks for four doses, followed by surgery.
        Pathological responses were confirmed by central review. The primary comparison was pathological complete response
        (ypT0/is, N0); secondary objectives were combined residual cancer burden 0 or 1 and toxicity. The goal was to determine
        whether pathological complete response was at least 20% higher with cisplatin than with doxorubicin-cyclophosphamide.
      results: 118 patients were randomly assigned and 117 were included in the outcome analyses. Mean age was 42 years, range
        24 to 73; clinical stage was I in 19%, II in 63% and III in 18%, and 45% had nodal involvement at baseline. Seventy
        percent had triple-negative disease, and clinical and tumour characteristics were well matched between arms. Pathological
        complete response was 18% with cisplatin and 26% with doxorubicin-cyclophosphamide, risk ratio 0.70 (90% CI 0.39 to
        1.2), and residual cancer burden 0 or 1 was 33% versus 46%, risk ratio 0.73 (90% CI 0.50 to 1.1). Both regimens were
        generally well tolerated without unexpected toxicities.
    endpoint: Pathological complete response (ypT0/is, N0) confirmed by central review, the trial asking whether pathological
      complete response was at least 20% higher with cisplatin than with doxorubicin-cyclophosphamide.
    line: neoadjuvant
    modality: chemo
    n: 118
    note: The same trial is filed in the literature as TBCRC 031; the record is keyed on the INFORM acronym. Entry required
      a germline BRCA1/2 mutation and HER2-negative disease, so the population is wider than the TNBC tag suggests, with 70%
      triple-negative and the rest ER-positive HER2-negative, and all three tags are carried for that reason. n is the 118
      randomly assigned; 117 were included in the outcome analyses. The supplied abstract text has the BRCA1 and BRCA2 gene
      labels stripped by the source feed, so the sentence reporting a 69% and 30% split cannot be attributed to a specific
      gene and those figures are deliberately not used here. No NCT identifier appears in the abstract, so none is recorded.
    os: not reported. The trial read out at surgery on pathological complete response and residual cancer burden, and the
      primary publication reports no survival endpoint
    phase: '2'
    population: Germline BRCA1/2 mutation carriers with cT1-3 tumours of at least 1.5 cm, cN0-3, HER2-negative, stage I to
      III breast cancer; 70% had triple-negative disease and the remainder ER-positive HER2-negative disease.
    primary_ref: tung2020a
    pubs:
