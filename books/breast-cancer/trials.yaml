      section: Brain and leptomeningeal metastases
    status: reported
    subtype: all
    topic: hippocampal-avoidance WBRT plus memantine versus conventional WBRT plus memantine, local-therapy
    year: 2020
  nrg-oncology-krog-rtog-1119:
    acronym: NRG Oncology–KROG / RTOG 1119
    arms: Whole brain radiotherapy or stereotactic radiosurgery plus concurrent lapatinib versus radiotherapy alone
    chapters:
    - BC-930
    digest:
      methods: Randomised phase 2 trial in patients with HER2-positive breast cancer and at least one measurable, unirradiated
        brain metastasis. Patients were randomised to whole brain radiotherapy of 37.5 Gy over 3 weeks or stereotactic radiosurgery
        at size-based dosing, with or without concurrent lapatinib 1000 mg daily for 6 weeks. Secondary endpoints were objective
        response rate, lesion-specific response, central nervous system progression-free survival, and overall survival.
      results: 143 patients were randomised from July 2012 to September 2019, with 116 analysable for the primary endpoint.
        Intracranial complete response at 12 weeks was 0% with radiotherapy plus lapatinib versus 6% with radiotherapy alone,
        one-sided p=0.97, and 12-week objective response was not improved. At 4 weeks objective response was 55% versus 42%.
        Grade 3 and 4 adverse event rates were 8% and 0% for radiotherapy and 28% and 6% with lapatinib.
    endpoint: Intracranial complete response rate at 12 weeks
    modality: radiation,her2
    n: 143
    os: Not yet reported. Overall survival was a secondary endpoint and no result appears in the abstract.
    phase: 2
    population: Patients with HER2-positive breast cancer and at least one measurable, previously unirradiated brain metastasis.
    primary_ref: kim2023
    pubs:
    - kind: primary
      ref: kim2023
      role: primary
    result: Intracranial complete response at 12 weeks was 0% with radiotherapy plus lapatinib versus 6% with radiotherapy
      alone, one-sided p=0.97. Objective response at 12 weeks was also not improved.
    reviewed: '2026-09-14'
    setting: cns
    source:
    - group: Radiotherapy foundations and systemic treatment combinations
      section: Brain and leptomeningeal metastases
