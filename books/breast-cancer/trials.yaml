    cited_by:
    - BC-460
    - BC-590
    - BC-890
    digest:
      methods: A phase 3 trial enrolled patients with HER2-low metastatic breast cancer who had received one or two previous
        lines of chemotherapy. HER2-low was defined as immunohistochemistry 1+, or 2+ with negative in situ hybridization.
        Patients were randomly assigned in a 2:1 ratio to trastuzumab deruxtecan or the physician's choice of chemotherapy.
        The primary end point was progression-free survival in the hormone receptor-positive cohort. Key secondary end points
        were progression-free survival in all patients and overall survival.
      results: Of 557 patients randomized, 494 (88.7%) had hormone receptor-positive disease. In that cohort median progression-free
        survival was 10.1 months with trastuzumab deruxtecan and 5.4 months with physician's choice, hazard ratio 0.51. Median
        overall survival in that cohort was 23.9 versus 17.5 months, hazard ratio 0.64. Among all patients progression-free
        survival was 9.9 versus 5.1 months, hazard ratio 0.50. Overall survival was 23.4 versus 16.8 months, hazard ratio
        0.64.
    endpoint: progression-free survival in the hormone receptor-positive cohort
    line: 2L
    modality: adc
    n: 557
    nct: NCT03734029
    os: median OS 23.9 vs 17.5 months in the hormone receptor-positive cohort, HR 0.64
