  tbcrc006:
    acronym: TBCRC 006
    arms: lapatinib and trastuzumab for 12 weeks without chemotherapy, with letrozole in oestrogen receptor-positive disease,
      single group
    chapters:
    - BC-830
    - BC-840
    cited_by:
    - BC-840
    digest:
      methods: Multicentre phase II study. Women with stage II to III HER2-positive breast cancer received weekly trastuzumab
        (4 mg/kg loading, then 2 mg/kg) and lapatinib 1000 mg once daily for 12 weeks, without chemotherapy. Women with ER-positive
        tumours also received letrozole, plus a luteinizing hormone-releasing hormone agonist if premenopausal. Pathologic
        response was assessed by ER status. Biopsies were taken at baseline, at weeks 2 and 8, and at surgery.
      results: Sixty-six patients were enrolled. Sixty-four were eligible and evaluable for response. Median tumour size was
        6 cm (range 1.5 to 30 cm). In-breast pathologic complete response (ypT0-is) was 27% overall, 21% in ER-positive and
        36% in ER-negative disease. Low-volume residual disease (ypT1a-b) occurred in 22% overall, 33% ER-positive and 4%
        ER-negative. Adverse events were mainly grade 1 to 2. Grade 3 metabolic, gastrointestinal and liver toxicity affected
        12 patients (18%).
    endpoint: in-breast pathological complete response
    line: neoadjuvant
    modality: her2,endocrine
    n: 66
    os: not reported
    phase: 2
    population: stage II-III HER2-positive, median tumour 6 cm; 64 of 66 evaluable; letrozole added where the oestrogen receptor
      was positive
    primary_ref: rimawi2013
    pubs:
    - kind: primary
      ref: rimawi2013
      role: primary
    result: in-breast pCR 27% overall, 21% in oestrogen receptor-positive and 36% in receptor- negative disease; low-volume
      residual disease in a further 33% of receptor-positive cases
    setting: early
    status: reported
    subtype: HER2+,HR+/HER2+
