  ameera-4:
    acronym: AMEERA-4
    arms: Amcenestrant 400 mg once daily or amcenestrant 200 mg once daily vs letrozole 2.5 mg once daily, each for 14 days
      before breast surgery, randomised 1:1:1.
    chapters:
    - BC-810
    claim: two weeks of amcenestrant suppressed Ki67 about as much as letrozole, not more
    digest:
      methods: Window-of-opportunity study comparing the pharmacodynamic effects of amcenestrant, a selective estrogen receptor
        degrader, with those of letrozole. Postmenopausal women with newly diagnosed, operable ER-positive, HER2-negative
        breast cancer were randomised 1:1:1 to amcenestrant 400 mg, amcenestrant 200 mg or letrozole 2.5 mg once daily for
        14 days before breast surgery. The primary endpoint was change in Ki67 between baseline and Day 15, the day of surgery.
        ER H-score and safety were also assessed. Enrollment was stopped early because of slow recruitment in the context
        of the COVID-19 pandemic.
      results: The modified intent-to-treat population consisted of 95 study participants with baseline and post-treatment
        Ki67 values, while the safety population included 104 participants who had received at least one dose of study medication.
        Relative change from baseline in Ki67 was -75.9% (95% CI -81.9 to -67.9) for amcenestrant 400 mg, -68.2% (-75.7 to
        -58.4) for amcenestrant 200 mg and -77.7% (-83.4 to -70.0) for letrozole, as geometric least-squares mean estimates.
        Absolute change in ER H-score from baseline was -176.7 in the amcenestrant 400 mg arm, -202.9 in the amcenestrant
        200 mg arm and -32.5 in the letrozole arm. There were no Grade 3 or higher treatment-related adverse events. Both
        amcenestrant and letrozole demonstrated antiproliferative activity and had good overall tolerability.
    endpoint: Change in Ki67 between baseline and Day 15, the day of surgery.
    line: neoadjuvant
    modality: endocrine
    n: 104
    nct: NCT04191382
    note: The publication does not state a trial phase. This is a 14-day preoperative window study with a pharmacodynamic
      endpoint, so it measures proliferation suppression and not disease outcome, and it cannot stand in for an adjuvant efficacy
      trial. n is the safety population of 104 who received at least one dose; the Ki67 comparison rests on the modified intent-to-treat
      population of 95 with paired values. Enrollment was stopped early for slow recruitment during the COVID-19 pandemic,
      so the arms are smaller than planned.
    population: Postmenopausal women with newly diagnosed, previously untreated, operable oestrogen receptor-positive, HER2-negative
      breast cancer.
    primary_ref: campone2023
    pubs:
    - kind: primary
      ref: campone2023
      role: primary
    result: Relative change from baseline in Ki67 was a geometric least-squares mean of -75.9% (95% CI -81.9 to -67.9) for
      amcenestrant 400 mg, -68.2% (-75.7 to -58.4) for amcenestrant 200 mg and -77.7% (-83.4 to -70.0) for letrozole. Absolute
      change in ER H-score from baseline was -176.7, -202.9 and -32.5 in the same three arms.
