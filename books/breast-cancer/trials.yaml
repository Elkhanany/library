  icarus-breast01:
    acronym: ICARUS-BREAST01
    arms: Single arm of patritumab deruxtecan (HER3-DXd) 5.6 mg/kg intravenously every 3 weeks.
    chapters:
    - BC-890
    claim: HER3-DXd response 53.5% after CDK4/6 inhibition and one chemotherapy line
    digest:
      methods: Multicentre phase 2 study evaluating the efficacy, safety and biomarkers of response and resistance to patritumab
        deruxtecan (HER3-DXd) in hormone receptor-positive, HER2-negative metastatic breast cancer. Eligible patients had
        previously progressed on CDK4/6 inhibitors and one line of chemotherapy. From May 2021 to June 2023, 99 patients were
        enrolled to receive HER3-DXd 5.6 mg/kg intravenously every 3 weeks. The primary endpoint was overall response rate.
        Baseline and on-treatment tumour samples were analysed for HER3 expression and spatial distribution, ESR1 mutation
        status, antibody-drug conjugate intratumoral distribution and interferon response.
      results: The study met its primary endpoint, showing an overall response rate of 53.5% (90% CI 44.8 to 62.1). The most
        frequent adverse events were fatigue in 83%, nausea in 75%, diarrhoea in 53% and alopecia in 40%. Exploratory analysis
        of baseline tumour samples suggested preliminary associations between overall response rate and both HER3 spatial
        distribution and the absence of ESR1 mutations, and between progression-free survival and HER3 expression, pending
        further validation. Analysis of on-treatment tumour samples showed that treatment efficacy seems to be associated
        with antibody-drug conjugate intratumoral distribution and interferon response. The authors conclude that HER3-DXd
        showed promising activity and manageable tolerability after progression on CDK4/6 inhibitors, and that larger trials
        are needed to define its efficacy relative to other drugs, including other antibody-drug conjugates.
    endpoint: Overall response rate.
    line: 3L+
    modality: adc
    n: 99
    nct: NCT04965766
    note: The agent is patritumab deruxtecan, directed at HER3, not the TROP2-directed datopotamab deruxtecan it is easily
      confused with, and the trial is single-arm, so it supports no comparison against another conjugate. The indexed title
      and abstract render the subtype as HRHER2 because the plus and minus signs are stripped in the source text; the population
      is hormone receptor-positive, HER2-negative throughout. Response was reported with a 90% confidence interval, as the
      single-arm design specifies, not the 95% interval used elsewhere in the registry. Progression-free survival and overall
      survival figures are not given in the abstract, and every biomarker association reported is exploratory and explicitly
      pending validation.
    os: not reported; overall response rate was the primary endpoint
