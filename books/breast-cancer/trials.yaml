  hera:
    acronym: HERA
    arms: trastuzumab for one year or for two years vs observation
    chapters:
    - BC-820
    - BC-840
    cited_by:
    - BC-820
    digest:
      methods: International multicentre open-label phase 3 randomised trial of 5102 women with HER2-positive early breast
        cancer, enrolled in 39 countries between December 2001 and June 2005. After completion of all primary therapy, including
        surgery, chemotherapy and radiotherapy as indicated, patients were randomly assigned 1:1:1 to trastuzumab for 1 year,
        trastuzumab for 2 years, or observation. The primary endpoint was disease-free survival in the intention-to-treat
        population. The 2-year versus 1-year comparison used 366-day landmark analyses.
      results: 5099 patients were analysed, 1697 in observation, 1702 in the 1-year group and 1700 in the 2-year group. After
        a median follow-up of 11 years, 1 year of trastuzumab reduced disease-free survival events (hazard ratio 0.76, 95%
        CI 0.68 to 0.86) and death (0.74, 0.64 to 0.86) versus observation. Two years did not improve disease-free survival
        over 1 year (hazard ratio 1.02, 0.89 to 1.17). Ten-year disease-free survival was 63%, 69% and 69%. 884 observation
        patients (52%) crossed over.
    endpoint: disease-free survival
    line: adjuvant
    modality: her2
    n: 5102
    nct: NCT00045032
    os: HR for death 0.74 (0.64-0.86) for one year against observation, with 52% of the observation group crossing over to
      trastuzumab
    phase: 3
    population: HER2+ early breast cancer after locoregional therapy and at least four cycles of chemotherapy, node-positive
      or node-negative
    primary_ref: cameron2017
    pubs:
    - kind: primary
      ref: piccart2005
      role: report
    - kind: follow-up
      ref: cameron2017
