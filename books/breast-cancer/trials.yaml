  attain:
    acronym: ATTAIN
    arms: Etirinotecan pegol 145 mg/m2 every 21 days versus chemotherapy of the physician's choice, from eribulin, ixabepilone,
      vinorelbine, gemcitabine, paclitaxel, docetaxel or nab-paclitaxel.
    chapters:
    - BC-930
    digest:
      methods: Open-label randomised phase 3 trial at 47 sites in 10 countries, enrolling between March 2017 and November
        2019. Patients with metastatic breast cancer and a history of stable, pretreated brain metastases whose disease had
        progressed on chemotherapy for metastatic disease were randomised to etirinotecan pegol 145 mg/m2 every 21 days or
        to chemotherapy of the physician's choice. The primary endpoint was overall survival. Key secondary endpoints were
        progression-free survival, objective response rate, duration of response and clinical benefit rate.
      results: 178 female patients were randomised, 92 to etirinotecan pegol and 86 to chemotherapy. Median overall survival
        was 7.8 months versus 7.5 months, hazard ratio 0.90 (95% CI 0.61 to 1.33, P = .60). Median progression-free survival
        on blinded independent central review was 2.8 versus 1.9 months for non-central nervous system metastases, hazard
        ratio 0.72 (95% CI 0.45 to 1.16, P = .18), and 3.9 versus 3.3 months for central nervous system metastases, hazard
        ratio 0.59 (95% CI 0.33 to 1.05, P = .07). Safety profiles were largely comparable.
    endpoint: Overall survival.
    modality: chemo
    n: 178
    nct: NCT02915744
    note: The trial was built to confirm the brain metastasis subgroup of BEACON, where etirinotecan pegol had lengthened
      overall survival in patients with preexisting, pretreated and non-progressive brain metastases. Entry required stable,
      pretreated brain metastases, so the trial says nothing about untreated or progressing intracranial disease. It is one
      of the largest randomised trials conducted entirely in breast cancer brain metastases.
    os: Overall survival was the primary endpoint and did not differ between the arms, 7.8 months versus 7.5 months, hazard
      ratio 0.90 (95% CI 0.61 to 1.33, P = .60).
