        locally advanced or metastatic breast cancer progressing on a non-steroidal aromatase inhibitor were randomised 1:1:1
        to fulvestrant 500 mg then 250 mg every 28 days plus anastrozole 1 mg, fulvestrant plus matched placebo, or exemestane
        25 mg daily. Stratification was by centre and previous setting of aromatase inhibitor use. The primary endpoint was
        progression-free survival by intention to treat.
