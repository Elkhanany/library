    digest:
      methods: Phase 2, single-arm, prospective trial of three-dimensional conformal external beam partial breast reirradiation
        after a second lumpectomy. Eligible women had a unifocal ipsilateral breast recurrence smaller than 3 cm more than
        1 year after breast-conserving therapy with whole breast irradiation, excised with negative margins. Reirradiation
        was 1.5 Gy twice daily for 30 treatments over 15 days, 45 Gy total. The study ran from June 2010 to June 2013. Median
        follow-up was 5.5 years.
