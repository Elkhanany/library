    digest:
      methods: Single-arm multicentre phase II trial in patients with HER2-positive breast cancer and brain metastases. Participants
        received atezolizumab 1,200 mg intravenously every 3 weeks, pertuzumab at a loading dose of 840 mg followed by 420
        mg every 3 weeks, and high-dose trastuzumab 6 mg/kg weekly for 24 weeks and then every 3 weeks. The primary endpoint
        was CNS overall response rate by RANO-BM criteria. Secondary endpoints included clinical benefit rate, overall survival
        and safety.
      results: 19 participants were enrolled. Two had a confirmed intracranial partial response, giving a CNS overall response
        rate of 10.5% (90% CI 1.9 to 29.6). The prespecified efficacy threshold was not met and the study was terminated early.
        The clinical benefit rate was 42.1% at 18 weeks and 31.6% at 24 weeks. Seven patients (36.8%) required a dose delay
        or hold. The most frequent any-grade adverse events were diarrhoea and fatigue, each 26.3%.
