    year: 2020
  kaitlin:
    acronym: KAITLIN
    arms: anthracycline followed by trastuzumab emtansine with pertuzumab vs anthracycline followed by a taxane with trastuzumab
      and pertuzumab
    chapters:
    - BC-820
    - BC-830
    - BC-840
    cited_by:
    - BC-820
    digest:
      methods: Phase III study in adults with excised HER2-positive early breast cancer that was node-positive, or node-negative,
        hormone receptor-negative with tumour greater than 2.0 cm. After surgery patients were randomly assigned 1:1 to anthracycline-based
        chemotherapy for three or four cycles followed by 18 cycles of trastuzumab emtansine plus pertuzumab, or by taxane
        for three or four cycles plus trastuzumab plus pertuzumab. Coprimary end points were invasive disease-free survival
        in the node-positive and overall intention-to-treat populations.
      results: Median follow-up was 57.1 months for taxane plus trastuzumab plus pertuzumab (n=918) and 57.0 months for trastuzumab
        emtansine plus pertuzumab (n=928). Invasive disease-free survival did not differ in the node-positive population (n=1658,
        stratified hazard ratio 0.97, 95% CI 0.71 to 1.32) or the overall population (n=1846, stratified hazard ratio 0.98,
        0.72 to 1.32). Three-year invasive disease-free survival was 94.2% with the taxane arm and 93.1% with the conjugate
        arm. Treatment completion was 88.4% versus 65.0%.
    endpoint: invasive disease-free survival in the node-positive and overall populations
    line: adjuvant
    modality: adc,her2
    n: 1846
    nct: NCT01966471
    os: not reported at the primary analysis
