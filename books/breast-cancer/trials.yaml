    digest:
      methods: Ongoing single arm phase IIIb study of trastuzumab emtansine in HER2 positive locally advanced or metastatic
        breast cancer previously treated with HER2 targeted therapy and chemotherapy. Patients received trastuzumab emtansine
        3.6 mg/kg intravenously every 3 weeks until unacceptable toxicity, withdrawal of consent, or progression. This post
        hoc exploratory analysis assessed tumour response and outcomes in patients with baseline brain metastases, using best
        overall response rate, clinical benefit rate, progression free survival, overall survival and safety.
      results: Of 2002 treated patients, 398 had baseline brain metastases. In 126 with measurable brain metastases the best
        overall response rate was 21.4 percent and the clinical benefit rate 42.9 percent. Lesion diameter sums fell by at
        least 30 percent in 42.9 percent, and in 49.3 percent of 67 patients without prior brain radiotherapy. Across the
        398 patients, median progression free survival was 5.5 months and median overall survival 18.9 months. Nervous system
        adverse events were commoner with brain metastases.
