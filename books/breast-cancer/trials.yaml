  geparnuevo:
    acronym: GeparNuevo
    arms: durvalumab added to nab-paclitaxel then dose-dense epirubicin and cyclophosphamide vs placebo, with no durvalumab
      after surgery
    chapters:
    - BC-510
    - BC-540
    - BC-850
    - BC-860
    cited_by:
    - BC-510
    - BC-540
    - BC-860
    claim: pCR 53.4% vs 44.2% not significant; 3-year OS 95.2% vs 83.5%, HR 0.24
    digest:
      methods: Randomised phase 2 double-blind placebo-controlled study. Patients with primary cT1b-cT4a-d centrally confirmed
        triple-negative breast cancer were randomised to durvalumab or placebo every 4 weeks in addition to nab-paclitaxel
        followed by standard epirubicin and cyclophosphamide. In a window phase, durvalumab or placebo alone was given 2 weeks
        before the start of nab-paclitaxel. Randomisation was stratified by stromal tumour-infiltrating lymphocytes. The primary
        objective was pathological complete response (ypT0 ypN0).
      results: 174 patients were randomised and 117 took part in the window phase. Median age was 49.5 years. Pathological
        complete response was 53.4% with durvalumab versus 44.2% with placebo (P=0.287, odds ratio 1.45). In the window cohort
        it was 61.0% versus 41.4% (odds ratio 2.22, P=0.035, interaction P=0.048). Thyroid dysfunction of any grade occurred
        in 47%. The 2022 survival report gave 3-year overall survival of 95.2% versus 83.5% (hazard ratio 0.24, 95% CI 0.08
        to 0.72).
    endpoint: pathological complete response
    line: neoadjuvant
    modality: immunotherapy,chemo
    n: 174
    nct: NCT02685059
    os: 3-year OS 95.2% vs 83.5%, HR 0.24 (0.08-0.72). At median 86.4 months HR 0.33 (0.14-0.79)
    phase: 2
    population: stage I-III TNBC
    primary_ref: loibl2019geparnuevo
