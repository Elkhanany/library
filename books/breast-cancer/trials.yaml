  dora:
    acronym: DORA
    arms: Olaparib 300 mg twice daily alone versus olaparib plus durvalumab 1,500 mg on day 1 every 4 weeks, randomized 1:1,
      each arm judged against a historical control rather than against the other.
    chapters:
    - BC-920
    claim: Maintenance PFS 4.0 months with olaparib, 6.1 months with durvalumab added
    digest:
      methods: Phase 2 non-comparative randomized trial. Patients with advanced triple-negative breast cancer, taken as estrogen
        or progesterone receptor expression of 10% or less, who had ongoing stable disease or a complete or partial response
        to first- or second-line platinum-based chemotherapy were randomized 1:1 to olaparib 300 mg twice daily with or without
        durvalumab 1,500 mg on day 1 every 4 weeks. The primary objective was to compare progression-free survival in each
        arm with a historical control of continued platinum-based therapy. Clinical benefit rate, defined as stable disease
        for at least 24 weeks or a complete or partial response, was also assessed. Germline BRCA mutation status and PD-L1
        status were examined.
      results: 45 patients were randomized, 23 to olaparib alone and 22 to the combination, 3 of them with estrogen or progesterone
        receptor expression of 1% to 10%. At 9.8 months median follow-up, median progression-free survival from randomization
        was 4.0 months (95% CI 2.6 to 6.1) with olaparib and 6.1 months (95% CI 3.7 to 10.1) with the combination, both significantly
        longer than the historical control (P = 0.0023 and P < 0.0001 respectively). Clinical benefit rates, stable disease
        for at least 24 weeks or a complete or partial response, were 44% (95% CI 23% to 66%) with olaparib alone and 36%
        (95% CI 17% to 59%) with the combination. Sustained clinical benefit was seen irrespective of germline BRCA mutation
        or PD-L1 status but tended to be associated with a complete or partial response to prior platinum, particularly in
        the olaparib-alone arm. No new safety signals were reported.
    endpoint: Progression-free survival compared with a historical control of continued platinum-based therapy.
    line: 1L,2L
    modality: parp,immunotherapy
    n: 45
    nct: NCT03167619
    note: Randomized but non-comparative. Each arm was tested against a historical control of continued platinum-based chemotherapy
      and the trial was not powered for a head-to-head comparison, so the longer median in the combination arm is not evidence
      that durvalumab adds benefit. Triple-negative disease was defined at estrogen and progesterone receptor expression of
      10% or less and 3 of the 45 patients had expression of 1% to 10%, so the subtype tag is broader than a strict zero-expression
      definition. Maintenance followed first- or second-line platinum-based chemotherapy for advanced disease, and randomisation
      was stratified by that line, so the line tag is 1L,2L. Of the 45 patients, 37 were treated in the first-line setting.
      Germline BRCA mutation was not required and the authors single out a BRCA wild-type subset with durable disease control.
      Overall survival was a secondary endpoint, with medians of 21.7 months with olaparib and 18.3 months with the combination,
      and median follow-up was 9.8 months.
    os: Secondary endpoint. Median overall survival was 21.7 months with olaparib alone and 18.3 months with olaparib plus
      durvalumab, after deaths in 11 of 23 and 8 of 22 patients. The trial was not designed to compare the arms with each
      other.
    phase: '2'
    population: Patients with advanced triple-negative breast cancer, defined as estrogen and progesterone receptor expression
      of 10% or less, with ongoing stable disease or a complete or partial response to first- or second-line platinum-based
      chemotherapy.
    primary_ref: tan2024
    pubs:
    - kind: primary
      ref: tan2024
      role: primary
    result: Median progression-free survival from randomization was 4.0 months (95% CI 2.6 to 6.1) with olaparib and 6.1 months
      (95% CI 3.7 to 10.1) with olaparib plus durvalumab, both significantly longer than the historical control (P = 0.0023
      and P < 0.0001 respectively). Clinical benefit rates were 44% (95% CI 23% to 66%) with olaparib alone and 36% (95% CI
      17% to 59%) with the combination.
    reviewed: '2026-09-24'
    setting: metastatic
    source:
    - ch: 75
      section: Additional studies — Metastatic TNBC / rare histology
    status: reported
    subtype: TNBC
    topic: chemotherapy-free maintenance after platinum-sensitive disease, with or without PD-L1 blockade
    weight: supporting
    year: 2024
  e2112:
    acronym: E2112
    arms: exemestane plus entinostat vs exemestane plus placebo
    chapters:
    - BC-870
    - BC-880
    cited_by:
    - BC-200
    - BC-760
    - BC-870
    digest:
      methods: E2112 was a multicenter, randomized, double-blind, placebo-controlled phase III study. It enrolled men and
        women with advanced hormone receptor-positive, HER2-negative breast cancer whose disease progressed after a nonsteroidal
        aromatase inhibitor. Participants were randomly assigned to exemestane 25 mg daily with either entinostat 5 mg weekly
        or placebo. Primary end points were progression-free survival by central review and overall survival. Secondary end
        points included safety, objective response rate, and lysine acetylation change in peripheral blood mononuclear cells.
      results: 608 patients were randomly assigned between March 2014 and October 2018. Median progression-free survival was
        3.3 months with entinostat versus 3.1 months with placebo, hazard ratio 0.87, P = .30. Median overall survival was
        23.4 versus 21.7 months, hazard ratio 0.99, P = .94. Objective response rate was 5.8% versus 5.6%. The most common
        grade 3 or 4 event with entinostat was neutropenia at 20%.
    endpoint: progression-free survival by central review and overall survival, co-primary
    line: 2L
    modality: endocrine,other
    n: 608
    os: median OS 23.4 vs 21.7 months, HR 0.99, no significant difference
    phase: 3
    population: HR+/HER2- advanced disease progressing after a non-steroidal aromatase inhibitor; 35% with prior CDK4/6 inhibition
    primary_ref: connolly2021
