        disease. Grade 3 or worse neutropenia occurred in 10% and diarrhoea in 8%. At a median follow-up of 5.7 years, median
        progression-free survival was 20.7 months and median overall survival was 65.3 months. Overall survival was more favourable
        in hormone receptor-positive disease. Trastuzumab-pretreated patients with visceral disease had median progression-free
