  neopalana:
    acronym: NeoPalAna
    arms: Single arm, with each patient serving as her own control; anastrozole alone for a four-week run-in, then palbociclib
      added for four 28-day cycles, with anastrozole continued until surgery.
    chapters:
    - BC-810
    claim: Adding palbociclib to anastrozole drove complete cell cycle arrest from 26% to 87%
    digest:
      methods: Single-arm phase II neoadjuvant trial assessing the antiproliferative activity of palbociclib in primary breast
        cancer as a prelude to adjuvant studies. Patients with clinical stage II or III oestrogen receptor-positive, HER2-negative
        disease received anastrozole 1 mg daily for four weeks as cycle 0, with goserelin if premenopausal, after which palbociclib
        125 mg daily on days 1 to 21 was added from cycle 1 day 1 for four 28-day cycles. Patients whose cycle 1 day 15 Ki67
        exceeded 10% went off study for inadequate response. Anastrozole continued to surgery, which took place three to five
        weeks after palbociclib exposure; later patients received an extra 10 to 12 days of palbociclib as cycle 5 immediately
        before surgery. Serial biopsies at baseline, cycle 1 day 1, cycle 1 day 15 and surgery were analysed for Ki67, gene
        expression and mutation profiles, and the primary endpoint was complete cell cycle arrest, central Ki67 of 2.7% or
        less.
      results: Fifty patients enrolled. The complete cell cycle arrest rate was significantly higher after adding palbociclib
        to anastrozole, 87% at cycle 1 day 15 versus 26% at cycle 1 day 1 (P < 0.001). Palbociclib enhanced cell-cycle control
        over anastrozole monotherapy regardless of luminal subtype and across a broad range of clinicopathologic and mutation
        profiles. Ki67 recovery at surgery following palbociclib washout was suppressed by the cycle 5 palbociclib. Resistance
        was associated with nonluminal subtypes and persistent E2F-target gene expression, and the authors conclude that prolonged
        administration may be necessary to maintain the effect.
    endpoint: Complete cell cycle arrest, defined as central Ki67 of 2.7% or less.
    line: neoadjuvant
    modality: cdk4-6,endocrine
    n: 50
    nct: NCT01723774
    note: Two publications are on the record and the result is taken from the primary report, ma2017. The second publication,
      kong2026, reports a separate NeoPalAna endocrine-resistant cohort of 34 patients whose on-treatment Ki67 exceeded 10%
      after standard neoadjuvant endocrine therapy; in that cohort complete cell cycle arrest was reached in 57.6% (95% CI
      39.2 to 74.5), and it is carried here as a correlative biomarker paper rather than as the trial result, so the n of
      50 is the main cohort only. The endpoint is pharmacodynamic. Ki67 suppression and complete cell cycle arrest are evidence
      of cell-cycle control, not of improved recurrence outcomes. The NCT identifier is taken from kong2026, which names it;
      ma2017 does not.
    phase: '2'
    population: Patients with clinical stage II or III oestrogen receptor-positive, HER2-negative breast cancer, with goserelin
      added if premenopausal.
    primary_ref: ma2017
    pubs:
    - kind: primary
      ref: ma2017
      role: primary
    - kind: biomarker
      ref: kong2026
      role: correlative
    result: The complete cell cycle arrest rate was significantly higher after palbociclib was added to anastrozole, 87% at
      cycle 1 day 15 against 26% at cycle 1 day 1 (P < 0.001). Ki67 recovered at surgery after palbociclib washout, and that
      recovery was suppressed by a further cycle of palbociclib immediately before surgery.
    setting: early
    source:
    - ch: 56
      section: Additional studies — Early HR+/HER2−
    status: reported
    subtype: HR+/HER2-
    topic: additional cell-cycle suppression from CDK4/6 inhibition on top of aromatase inhibition, and Ki67 rebound after
      washout
    weight: exploratory
    year: 2017
  neorhea:
    acronym: NeoRHEA
    arms: Single arm of four 28-day cycles of neoadjuvant palbociclib plus endocrine therapy.
    chapters:
    - BC-810
    claim: palbociclib plus endocrine therapy diminished adaptive anti-tumour immunity
    digest:
      methods: NeoRHEA was a single-arm phase 2 study that included patients with estrogen receptor-positive, HER2-negative
        early breast cancer who received four cycles of neoadjuvant palbociclib and endocrine therapy. The primary outcome
        was baseline biomarkers of treatment resistance and the secondary outcome was post-treatment transcriptional and epigenetic
        changes of tumour, immune and stromal cells. Gene set enrichment analyses were run on genes residing in differentially
        accessible chromatin peaks, and marker findings were validated by multiplex immunohistochemistry. A linked report
        assessed circulating tumour DNA with the RaDaR assay on plasma drawn pre-treatment, after cycle 1, pre-surgery and
        1 month post-surgery.
      results: E2F targets and G2M checkpoint proliferation-related gene sets were enriched in baseline samples from resistant
        patients. Downregulation of E2F targets and G2M checkpoint after treatment was observed in tumour, endothelial and
        T cells, and gene set enrichment on differentially accessible peaks revealed similar effects. Decreases in CD8+ CD103+
        tissue-resident memory cell marker genes were observed post-treatment and validated by multiplex immunohistochemistry.
        The authors conclude that palbociclib with endocrine therapy diminishes adaptive anti-tumour immunity by decreasing
        T cell proliferation and the presence of tissue-resident memory T cells. In the linked ctDNA report, baseline ctDNA
        was detected in 55%, fell to 5% during treatment and was undetectable in all patients by 1 month post-surgery, with
        baseline detection higher in grade 3 tumours and in residual cancer burden 3, and baseline ctDNA predicted poor response
        to this regimen.
    endpoint: Baseline biomarkers of treatment resistance, with post-treatment transcriptional and epigenetic changes in tumour,
      immune and stromal cells as the secondary outcome.
    line: neoadjuvant
    modality: cdk4-6,endocrine
    nct: NCT03065621
    note: The primary outcome is a biomarker outcome that the publication reports without figures, so no tabulated result
      is given and what the papers do report sits in the digest. Neither abstract states how many patients were enrolled,
      so n is left out. The ctDNA report by Stanciu is a linked correlative publication of this same single-arm study, not
      a second trial, and its figures describe ctDNA detection rather than the trial's outcome. Serial immune changes under
      treatment do not establish that adding immunotherapy would help. The trial is registered as NCT03065621 and as EudraCT
      2016-000879-24.
    phase: 2
    population: Patients with oestrogen receptor-positive, HER2-negative early breast cancer.
    primary_ref: papagiannis2025
    pubs:
    - kind: primary
      ref: papagiannis2025
      role: primary
    - kind: biomarker
      ref: stanciu2025
      role: correlative
    setting: early
    source:
    - ch: 56
      section: Additional studies — Early HR+/HER2−
    status: reported
    subtype: HR+/HER2-
    topic: what neoadjuvant CDK4/6 inhibition on an endocrine backbone does to the tumour immune microenvironment
    weight: exploratory
    year: 2025
  neosphere:
    acronym: NeoSphere
    arms: pertuzumab, trastuzumab and docetaxel vs trastuzumab and docetaxel, pertuzumab and trastuzumab, or pertuzumab and
      docetaxel
    chapters:
    - BC-830
    - BC-840
    cited_by:
    - BC-500
    - BC-830
    - BC-840
    claim: pCR in the breast 45.8% with pertuzumab, trastuzumab and docetaxel vs 29.0% without pertuzumab
    digest:
      methods: Multicentre, open-label, phase 2 study. Treatment-naive women with HER2-positive breast cancer were randomly
        assigned 1:1:1:1, stratified by operable, locally advanced and inflammatory disease and by hormone receptor expression,
        to four neoadjuvant cycles of trastuzumab plus docetaxel (group A), pertuzumab and trastuzumab plus docetaxel (group
        B), pertuzumab and trastuzumab (group C), or pertuzumab plus docetaxel (group D). The primary endpoint was pathological
        complete response in the breast in the intention-to-treat population. Neither patients nor investigators were masked.
      results: Of 417 eligible patients, 107 went to group A, 107 to group B, 107 to group C and 96 to group D. Pathological
        complete response was 45.8% (95% CI 36.1-55.7) in group B against 29.0% (20.6-38.5) in group A, p=0.0141. It was 24.0%
        in group D and 16.8% in group C. The most common grade 3 or higher event was neutropenia. The 5-year analysis reported
        progression-free survival of 81%, 86%, 73% and 73% in groups A to D.
    endpoint: pathological complete response in the breast
    line: neoadjuvant
    modality: her2,chemo
    n: 417
    nct: NCT00545688
    os: not reported at the primary analysis
    phase: 2
    population: treatment-naive HER2-positive operable, locally advanced or inflammatory disease; randomisation stratified
      by hormone receptor expression
    primary_ref: gianni2012
    pubs:
    - kind: primary
      ref: gianni2012
      role: report
    - kind: follow-up
      ref: gianni2016
      role: 5-yr
    result: pathological complete response in the breast 45.8% with pertuzumab, trastuzumab and docetaxel against 29.0% with
      trastuzumab and docetaxel, p=0.0141; 24.0% with pertuzumab and docetaxel and 16.8% with pertuzumab and trastuzumab alone
    reviewed: '2026-09-14'
