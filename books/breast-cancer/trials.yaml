        with a tumour of 1 cm or more, who had received prior anthracycline and/or taxane chemotherapy. Triple-negative status
        was confirmed centrally by immunohistochemistry. Patients were randomly assigned to capecitabine or observation. Stratification
        was by institution, prior taxane-based therapy, involved axillary nodes, and centrally determined basal or non-basal
        phenotype. The primary objective was to compare disease-free survival between the arms.
