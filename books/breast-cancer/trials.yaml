        69 months of 43.4 versus 22.0 per 1000 women on placebo and tamoxifen. Noninvasive breast cancer fell by 50% (P<.002).
        Estrogen receptor-positive tumours fell by 69%, with no difference in receptor-negative tumours. Hip, radius and spine
        fractures were reduced. Endometrial cancer rose (risk ratio 2.53, 95% CI 1.35 to 4.97). Stroke, pulmonary embolism
        and deep-vein thrombosis rates were elevated.
