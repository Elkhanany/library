        followed by 12 weeks of paclitaxel. Neoadjuvant treatment lasted 24 weeks. The primary endpoint was the proportion
        with PAM50 low risk-of-relapse disease at surgery.
      results: 106 patients were enrolled. At baseline 92 (87%) had high risk-of-relapse disease and 14 (13%) intermediate.
        Median follow-up was 200 days. At surgery 23 of 49 patients (46.9%, 95% CI 32.5 to 61.7) in the ribociclib plus letrozole
        group and 24 of 52 (46.1%, 32.9 to 61.5) in the chemotherapy group were low risk-of-relapse. The most common grade
        3-4 adverse event was neutropenia, in 43% and 60%. No deaths occurred.
