      methods: Randomized phase II screening trial. Patients had a controlled primary malignancy and one to five metastatic
        lesions, all amenable to stereotactic ablative radiotherapy. They were stratified by number of metastases (1-3 or
        4-5) and randomized 1:2 to palliative standard-of-care treatment alone or to standard of care plus stereotactic ablative
        radiotherapy. The primary end point was overall survival, tested at an alpha of 0.20. Secondary end points were progression-free
        survival, toxicity and quality of life.
      results: 99 patients were randomized at 10 centers between 2012 and 2016. The commonest primary tumors were breast (18),
        lung (18), colorectal (18) and prostate (16). Median follow-up was 51 months. The 5-year overall survival rate was
        17.7% in the control arm versus 42.3% with added stereotactic ablative radiotherapy (stratified log-rank P=.006).
        The 5-year progression-free survival rate was 17.3% with radiotherapy, against 3.2% at 4 years in the control arm
        (P=.001). No new grade 2-5 adverse events occurred.
    endpoint: Overall survival, tested at an alpha of 0.20 in a randomised phase 2 screening design.
    line: any
    modality: radiation
    n: 99
    note: A screening design rather than a confirmatory one. The significance threshold was set at 0.20 and four common primary
      tumours were enrolled together, with 18 breast cancers among the 99 patients. It supports a hypothesis about oligometastatic
      disease rather than a result in breast cancer.
    os: Five-year overall survival was 42.3% with added stereotactic ablative radiotherapy against 17.7% with standard care
      alone, at a median follow-up of 51 months.
    phase: 2
    population: Patients with a controlled primary malignancy and one to five metastatic lesions, all amenable to stereotactic
