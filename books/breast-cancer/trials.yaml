    digest:
      methods: This was a randomized, double-blind, placebo-controlled, multicenter phase III trial in postmenopausal women
        with hormone receptor-positive advanced breast cancer progressing or recurring after a nonsteroidal aromatase inhibitor.
        Fulvestrant used a loading-dose regimen of 500 mg intramuscularly on day 0, 250 mg on days 14 and 28, then 250 mg
        every 28 days. Exemestane was 25 mg orally once daily. The primary end point was time to progression.
      results: 693 women were randomly assigned, 351 to fulvestrant and 342 to exemestane. About 60% had received at least
        two prior endocrine therapies. Median time to progression was 3.7 months in both groups, hazard ratio 0.963 (95% CI
        0.819 to 1.133, P=.6531). Overall response rate was 7.4% versus 6.7% (P=.736) and clinical benefit rate 32.2% versus
        31.5% (P=.853). Median duration of clinical benefit was 9.3 and 8.3 months.
    endpoint: Time to progression
    line: 2L
    modality: endocrine
    n: 693
    note: HER2 status was not part of the reported eligibility criteria, so the HR+/HER2- label reflects how the trial is
      used rather than a stated entry requirement.
