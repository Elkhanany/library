  impact:
    acronym: IMPACT
    arms: Anastrozole 1 mg daily versus tamoxifen 20 mg daily versus the two combined, each for 3 months before surgery.
    chapters:
    - BC-810
    digest:
      methods: Postmenopausal women with ER-positive, invasive, nonmetastatic, operable or locally advanced potentially operable
        breast cancer were randomly assigned to neoadjuvant tamoxifen 20 mg daily, anastrozole 1 mg daily, or the combination
        for 3 months. Tumour objective response was assessed by caliper and by ultrasound. Further comparisons covered clinical
        versus ultrasound response, actual and feasible surgery against feasible surgery at baseline, response in HER2-positive
        cancers, and tolerability.
      results: Objective response did not differ significantly between the three arms in the intention-to-treat population.
        Among 124 patients judged at baseline to require mastectomy, 44% had breast-conserving surgery after anastrozole versus
        31% after tamoxifen (P = .23). Among those their surgeon deemed feasible for breast-conserving surgery the difference
        reached significance, 46% versus 22% (P = .03). Objective response in 34 HER2-positive cancers was 58% with anastrozole
        versus 22% with tamoxifen (P = .18). All treatments were well tolerated.
    endpoint: Tumour objective response, assessed by caliper and by ultrasound.
    line: neoadjuvant
    modality: endocrine
    note: Entry required ER-positive disease only, so HER2-positive tumours were included and reported as a 34-patient subgroup;
      the abstract does not give the total number randomised.
