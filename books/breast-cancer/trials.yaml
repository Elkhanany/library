      results: At the February 5, 2021 cutoff, pathologic complete response was 62.7% (143 of 228) with placebo and 62.4%
        (141 of 226) with atezolizumab, a difference of -0.33% (95% CI -9.2 to 8.6, P = .9551). In PD-L1-positive tumours
        the rates were 72.5% and 64.2%, a difference of -8.26% (95% CI -20.6 to 4.0, P = .1846). Grade 3-4 and serious adverse
        events were more frequent with atezolizumab, and five grade 5 events occurred, all with atezolizumab.
