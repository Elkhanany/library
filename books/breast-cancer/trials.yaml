        was 62.9 months. Breast cancer recurrence occurred in 434 of 4480 women (10%), 280 in the treated group and 154 in
        the control group, hazard ratio 0.92 (95% CI 0.75 to 1.12), p=0.40. Freedom from recurrence at 5 years was 91.0% versus
