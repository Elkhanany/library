  gim4:
    acronym: GIM4
    arms: Letrozole for 5 years versus letrozole for 2 to 3 years.
    chapters:
    - BC-790
    digest:
      methods: Multicentre open-label randomised phase 3 trial at 69 Italian hospitals. Eligible women were postmenopausal
        with stage I to III operable hormone receptor-positive breast cancer, had taken adjuvant tamoxifen for 2 to 3 years
        with no sign of recurrence, and had ECOG performance status 2 or lower. Patients were assigned 1:1 to letrozole 2.5
        mg once daily for 2 to 3 years or for 5 years. The primary endpoint was invasive disease-free survival.
      results: 2056 patients were assigned to letrozole for 2 to 3 years (n=1030) or 5 years (n=1026). After a median follow-up
        of 11.7 years, disease-free survival events occurred in 262 control patients (25.4%) and 212 extended patients (20.7%).
        12-year disease-free survival was 62% versus 67%, hazard ratio 0.78, 95% CI 0.65 to 0.93, p=0.0064. Grade 3 or 4 arthralgia
        occurred in 2.2% versus 3.0%. No deaths were related to toxic effects.
    endpoint: Invasive disease-free survival in the intention to treat population.
    line: adjuvant
    modality: endocrine
    n: 2056
    nct: NCT01064635
    os: Not reported in the primary publication abstract.
    phase: 3
    population: Postmenopausal women with stage I to III operable hormone receptor-positive breast cancer who had received
      2 to 3 years of adjuvant tamoxifen without recurrence.
    primary_ref: delmastro2021
    pubs:
    - kind: primary
      ref: delmastro2021
      role: primary
    result: 12-year disease-free survival was 67% with 5 years of letrozole versus 62% with 2 to 3 years, hazard ratio 0.78,
