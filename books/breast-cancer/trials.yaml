  her2-heterogeneity:
    acronym: Neoadjuvant T-DM1-pertuzumab HER2-heterogeneity study
    arms: single arm of neoadjuvant trastuzumab emtansine plus pertuzumab, with the comparison made between prospectively
      defined heterogeneous and non-heterogeneous tumours
    chapters:
    - BC-820
    - BC-830
    - BC-840
    claim: pCR was 55% without HER2 heterogeneity and 0% with it
    digest:
      methods: Prospective phase II neoadjuvant trial designed to assess the impact of HER2 heterogeneity on response to HER2-targeted
        therapy. 164 patients with centrally confirmed HER2-positive early-stage breast cancer were treated with neoadjuvant
        trastuzumab emtansine plus pertuzumab. HER2 heterogeneity was assessed on pretreatment biopsies taken from two locations
        of each tumour, and was defined as an area with HER2 amplification in more than 5% but fewer than 50% of tumour cells,
        or a HER2-negative area by FISH. Single-cell FISH analysis of cellular heterogeneity was also performed. The comparison
        of pathological complete response by heterogeneity status was adjusted for hormone receptor status.
      results: HER2 heterogeneity was detected in 10% of evaluable cases, 16 of 157. The pathological complete response rate
        was 55% in the non-heterogeneous subgroup and 0% in the heterogeneous group, P < 0.0001 after adjustment for hormone
        receptor status. Single-cell FISH analysis identified the fraction of HER2 non-amplified cells as a driver of therapeutic
        resistance. The authors conclude that HER2 heterogeneity is associated with resistance to HER2-targeted therapy and
        should be considered in efforts to optimise treatment strategies.
    endpoint: the impact of HER2 heterogeneity on pathological complete response
    line: neoadjuvant
    modality: adc,her2
    n: 164
    note: The heterogeneity comparison was planned prospectively but the subgroups were not randomised, and the heterogeneous
      group held only 16 of 157 evaluable tumours, so the pathological complete response rate of 0% rests on a very small
      denominator. The abstract gives no pathological complete response rate for the cohort as a whole, so only the subgroup
      contrast can be tabulated. Hormone receptor status was not an eligibility criterion and the analysis was adjusted for
      it, so the cohort is broader than a HER2+ tag alone suggests. This is a separate study from KRISTINE, which randomised
      the same conjugate plus pertuzumab regimen against chemotherapy, and the two records must not be merged. The study has
      no acronym in the literature, so the key is built from the descriptive name and truncated at 40 characters in line with
      the other unnamed studies in the registry. The abstract states no NCT number, so none is recorded.
    phase: 2
    population: centrally confirmed HER2-positive early-stage breast cancer, with HER2 heterogeneity assessed prospectively
      on pretreatment biopsies from two locations of each tumour
    primary_ref: filho2021
    pubs:
    - kind: primary
      ref: filho2021
      role: primary
    result: HER2 heterogeneity was detected in 10%, 16 of 157 evaluable cases. The pathological complete response rate was
      55% in the non-heterogeneous subgroup and 0% in the heterogeneous group (P < 0.0001, adjusted for hormone receptor status)
    setting: early
    source:
    - ch: 59
      section: Additional studies — Early HER2+/HR+HER2+
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: spatial HER2 heterogeneity as a determinant of response to conjugate plus dual blockade without chemotherapy
    weight: exploratory
    year: 2021
  her2climb:
    acronym: HER2CLIMB
    arms: Tucatinib versus placebo, each added to trastuzumab and capecitabine. The primary endpoint was tested in the first
      480 patients randomised and the secondary endpoints in all 612.
    chapters:
