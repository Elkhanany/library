    digest:
      methods: Double-blind randomised phase 3 trial. Patients with hormone receptor-positive, HER2-negative advanced breast
        cancer whose disease had progressed after endocrine therapy were randomised 2 to 1 to dalpiciclib plus fulvestrant
        or placebo plus fulvestrant. The primary endpoint was investigator-assessed progression-free survival. The report
