  destiny-breast01:
    acronym: DESTINY-Breast01
    arms: Single arm of trastuzumab deruxtecan 5.4 mg/kg intravenously every 3 weeks.
    chapters:
    - BC-570
    - BC-900
    digest:
      methods: Two-part, open-label, single-group, multicentre phase 2 study in adults with pathologically documented HER2-positive
        metastatic breast cancer previously treated with trastuzumab emtansine. Part one evaluated three doses to establish
        a recommended dose, and part two evaluated efficacy and safety at that dose. The primary endpoint was objective response
        by independent central review.
      results: 184 patients with a median of six previous treatments received trastuzumab deruxtecan 5.4 mg/kg. Response occurred
        in 112 patients, 60.9 percent (95% CI 53.4 to 68.0). Median response duration was 14.8 months and median progression-free
        survival was 16.4 months at 11.1 months of follow-up. Grade 3 or higher events included decreased neutrophil count
        in 20.7 percent. Adjudicated interstitial lung disease occurred in 13.6 percent, including grade 5 in 2.2 percent.
    endpoint: Objective response by independent central review.
    line: 3L+
    modality: adc,her2
