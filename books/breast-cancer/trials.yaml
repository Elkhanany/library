  h0648g:
    acronym: H0648g
    arms: Standard chemotherapy plus trastuzumab versus standard chemotherapy alone.
    chapters:
    - BC-840
    - BC-900
    digest:
      methods: Randomised trial of trastuzumab added to chemotherapy in women with metastatic breast cancer overexpressing
        HER2. 234 patients were assigned to standard chemotherapy alone and 235 to standard chemotherapy plus trastuzumab.
        Patients with no prior adjuvant anthracycline received doxorubicin, or epirubicin in 36 women, plus cyclophosphamide,
        alone in 138 women or with trastuzumab in 143. Patients with prior adjuvant anthracycline received paclitaxel alone
        in 96 women or paclitaxel with trastuzumab in 92.
      results: Adding trastuzumab lengthened time to progression (median 7.4 versus 4.6 months, P<0.001), raised objective
        response (50 versus 32 percent, P<0.001), lengthened response duration (median 9.1 versus 6.1 months, P<0.001), lowered
        death at 1 year (22 versus 33 percent, P=0.008) and lengthened median survival (25.1 versus 20.3 months, P=0.01).
        Class III or IV cardiac dysfunction occurred in 27 percent given anthracycline, cyclophosphamide and trastuzumab,
        8 percent without trastuzumab, 13 percent given paclitaxel with trastuzumab and 1 percent without.
    endpoint: Time to disease progression.
    line: 1L
    modality: her2,chemo
    n: 469
    note: The publication does not state a trial phase, so phase is left null.
    os: Median survival was 25.1 months with chemotherapy plus trastuzumab versus 20.3 months with chemotherapy alone, P=0.01,
      a 20 percent reduction in the risk of death.
    population: Women with metastatic breast cancer that overexpressed HER2, receiving first-line chemotherapy.
    primary_ref: slamon2001
    pubs:
    - kind: primary
      ref: slamon2001
      role: primary
    result: Median time to disease progression was 7.4 months with chemotherapy plus trastuzumab versus 4.6 months with chemotherapy
      alone, P<0.001.
    reviewed: '2026-09-14'
    setting: metastatic
    source:
    - ch: 72
      group: Historical
      section: Metastatic disease
    status: reported
