  touch:
    acronym: TOUCH
    arms: 16 weeks of neoadjuvant weekly paclitaxel, or palbociclib with letrozole, both given with trastuzumab plus pertuzumab
    chapters:
    - BC-840
    claim: pCR 32.9% with paclitaxel vs 33.3% with palbociclib-letrozole, no RBsig interaction
    digest:
      methods: TOUCH is an international, open-label, randomised phase II trial in postmenopausal patients with cT above 1
        cm, cN0 or cN1, hormone receptor-positive, HER2-positive breast cancer. Patients were randomly assigned to 16 weeks
        of neoadjuvant weekly paclitaxel or to palbociclib and letrozole, both with trastuzumab plus pertuzumab. The primary
        objective investigated the interaction between a gene signature of E2F pathway activity, RBsig, and pathological complete
        response defined as ypT0N0 or ypTisN0. The hypothesis was a higher pCR for RBsig-high tumours in the paclitaxel group
        and for RBsig-low tumours in the palbociclib and letrozole group. RBsig was assessed by RNA sequencing of pre-treatment
        biopsies and intrinsic subtypes were estimated by absolute intrinsic molecular subtyping. The treatment-by-biomarker
        interaction was estimated using logistic regression in 115 assessable patients.
      results: 147 patients were randomly assigned, 74 to paclitaxel with trastuzumab and pertuzumab and 73 to palbociclib,
        letrozole, trastuzumab and pertuzumab, and 145 constituted the treated population, with a median age of 69 years.
        More patients completed palbociclib than paclitaxel, 94.4% versus 79.5%. The most frequent grade 3-4 adverse events
        were neutropenia, 6.9% with paclitaxel versus 43.1% with palbociclib, and diarrhoea, 11% versus 8.3%. The pCR rate
        was 32.9% (95% CI 22.3% to 44.9%) in the paclitaxel group and 33.3% (95% CI 22.7% to 45.4%) in the palbociclib and
        letrozole group, and no significant treatment-by-RBsig interaction was observed, P = 0.18. pCR was higher in non-luminal
        than luminal tumours, 45.5% versus 18.4%, with no interaction with treatment.
    endpoint: the interaction between a gene signature of E2F pathway activity, RBsig, and pathological complete response
      defined as ypT0N0 or ypTisN0, estimated by logistic regression in 115 assessable patients
    line: neoadjuvant
    modality: her2,cdk4-6,endocrine,chemo
    n: 147
    note: The primary objective was the treatment-by-RBsig interaction, not a comparison of pCR between the groups, and that
      interaction was not supported. The trial was not designed as a noninferiority comparison, so the similar pCR estimates
      do not demonstrate that the chemotherapy-free backbone is noninferior to paclitaxel. The population is postmenopausal
      and older, median age 69 years, which limits how far the result carries. The trial is also designated IBCSG 55-17. The
      abstract gives no ClinicalTrials.gov number, so nct is omitted.
    phase: 2
    population: postmenopausal patients with cT above 1 cm, cN0 or cN1, hormone receptor-positive, HER2-positive early breast
      cancer, median age 69 years
    primary_ref: malorni2025
    pubs:
    - kind: primary
      ref: malorni2025
      role: primary
    result: The prespecified treatment-by-RBsig interaction was not significant, P = 0.18, with pCR in RBsig-high versus RBsig-low
      tumours of 31.3% versus 42.3% in the paclitaxel group and 38.5% versus 25.8% in the palbociclib group. The pCR rate
      was 32.9% (95% CI 22.3% to 44.9%) with paclitaxel and 33.3% (95% CI 22.7% to 45.4%) with palbociclib and letrozole.
    setting: early
    source:
    - ch: 60
      section: Additional studies — Early HER2+/HR+HER2+
    - ch: 59
      section: Additional studies — Early HER2+/HR+HER2+
      xref: true
    status: reported
    subtype: HR+/HER2+
    topic: substituting CDK4/6 inhibition and endocrine therapy for a taxane, with an E2F-pathway signature as the predictive
      hypothesis
    weight: supporting
    year: 2025
