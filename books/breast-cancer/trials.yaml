  geparola:
    acronym: GeparOLA
    arms: Paclitaxel 80 mg/m2 weekly plus olaparib 100 mg twice daily for 12 weeks vs paclitaxel plus carboplatin AUC 2 weekly
      for 12 weeks, both followed by epirubicin and cyclophosphamide.
    chapters:
    - BC-810
    - BC-860
    claim: pCR 55.1% with paclitaxel/olaparib vs 48.6% with carboplatin; threshold not excluded
    digest:
      methods: Randomised, multicentre, prospective, open-label phase II trial. Patients with untreated primary HER2-negative
        breast cancer, cT2-cT4a-d or cT1c with clinically or sentinel-node positive disease or cT1c triple-negative or cT1c
        with Ki-67 above 20%, all with homologous recombination deficiency defined by a high HRD score and/or a germline or
        tumour BRCA1/2 mutation, were randomised to paclitaxel 80 mg/m2 weekly plus olaparib 100 mg twice daily for 12 weeks
        or to paclitaxel plus carboplatin AUC 2 weekly for 12 weeks, both followed by epirubicin and cyclophosphamide. Stratification
        was by hormone receptor status and by age under 40 against 40 or older. The primary endpoint was pathological complete
        response, ypT0/is ypN0, with a two-sided one-group chi-square test planned to exclude a pCR rate of 55% or lower in
        the olaparib arm. Secondary endpoints were other pCR definitions, breast conservation rate, clinical and imaging response,
        tolerability and safety, and in the long-term report invasive disease-free survival, distant disease-free survival
        and overall survival with a planned median follow-up beyond four years.
      results: 107 patients were randomised between September 2016 and July 2018 and 106 started treatment, 69 on paclitaxel
        plus olaparib and 37 on paclitaxel plus carboplatin. Median age was 47.0 years, 86.8% had grade 3 tumours, 89.6% had
        Ki-67 above 20%, 72.6% were triple-negative and 56.2% had a confirmed germline BRCA1/2 mutation. The pCR rate was
        55.1%, 90% CI 44.5 to 65.3, with olaparib against 48.6%, 90% CI 34.3 to 63.2, with carboplatin, so a pCR rate of 55%
        or lower could not be excluded, while higher pCR rates with olaparib were seen in patients under 40 and in hormone
        receptor-positive patients and olaparib was significantly better tolerated. After a median follow-up of 49.8 months
        there were 18 invasive disease-free survival events, 15 on olaparib and 3 on carboplatin, and 7 deaths, 6 and 1. Four-year
        invasive disease-free survival was 76.0% against 88.5%, hazard ratio 2.86, 95% CI 0.83 to 9.90, distant disease-free
        survival 81.2% against 93.4%, hazard ratio 3.03, 95% CI 0.67 to 13.67, and overall survival 89.2% against 96.9%, hazard
        ratio 3.27, 95% CI 0.39 to 27.20, all tending to be inferior with olaparib. Patients without a germline or tumour
        BRCA1/2 mutation benefited from carboplatin, 7 of 30 with an event on olaparib against 0 of 16 on carboplatin, log-rank
        P = 0.037, whereas no difference was seen in mutation carriers, hazard ratio 1.16, log-rank P = 0.83.
    endpoint: Pathological complete response, ypT0/is ypN0, tested by a two-sided one-group chi-square test planned to exclude
      a pCR rate of 55% or lower in the paclitaxel plus olaparib arm.
    line: neoadjuvant
    modality: parp,chemo
    n: 107
    nct: NCT02789332
    note: The tabulated result is the pathological complete response from the 2020 primary report; the 2025 publication reports
      the long-term survival endpoints, which were secondary, and supplies the os field. The design was a one-group test against
      a fixed threshold, not a formal comparison or an equivalence trial, so the arm-to-arm differences are descriptive only.
      Eligibility was HER2-negative disease selected by homologous recombination deficiency, so hormone receptor-positive
      patients were enrolled alongside triple-negative ones. The survival signal runs against olaparib and is concentrated
      in patients without a BRCA1/2 mutation, on very small event counts and with confidence intervals that cross one throughout.
    os: 4-year overall survival 89.2% with paclitaxel plus olaparib against 96.9% with paclitaxel plus carboplatin, hazard
      ratio 3.27, 95% CI 0.39 to 27.20, log-rank P = 0.244, at median follow-up 49.8 months.
    phase: '2'
    population: Patients with untreated primary HER2-negative breast cancer, cT2-cT4a-d or cT1c with node-positive or sentinel-node-positive
      disease or cT1c triple-negative or cT1c with Ki-67 above 20%, all with homologous recombination deficiency defined by
      a high HRD score and/or a germline or tumour BRCA1/2 mutation.
