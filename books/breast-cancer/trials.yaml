  neoaltto:
    acronym: NeoALTTO
    arms: neoadjuvant lapatinib with trastuzumab vs trastuzumab alone or lapatinib alone, each followed by the addition of
      weekly paclitaxel
    chapters:
    - BC-830
    - BC-840
    cited_by:
    - BC-830
    - BC-840
    digest:
      methods: Parallel-group, randomised, open-label phase 3 study. Women from 23 countries with HER2-positive primary breast
        cancer and tumours larger than 2 cm were assigned to oral lapatinib 1500 mg, intravenous trastuzumab, or lapatinib
        1000 mg plus trastuzumab. Anti-HER2 therapy alone ran for six weeks, then weekly paclitaxel 80 mg/m2 was added for
        12 weeks before surgery. Adjuvant chemotherapy and the same targeted therapy followed to 52 weeks. The primary endpoint
        was pathological complete response.
      results: 154 patients received lapatinib, 149 trastuzumab and 152 the combination. Pathological complete response was
        51.3% (78 of 152) with lapatinib plus trastuzumab against 29.5% (44 of 149) with trastuzumab, a difference of 21.1
        percentage points (9.1 to 34.2, p=0.0001). Lapatinib alone gave 24.7% (38 of 154). Grade 3 diarrhoea occurred in 23.4%,
        21.1% and 2.0% of the lapatinib, combination and trastuzumab groups. The 2019 survival report gave 6-year event-free
        survival of 74% with the combination and 67% with trastuzumab.
    endpoint: pathological complete response
    line: neoadjuvant
    modality: her2,chemo
    n: 455
    nct: NCT00553358
    os: not reported in the primary analysis
    phase: 3
    population: HER2-positive primary tumours larger than 2 cm; anti-HER2 therapy alone for the first 6 weeks, then paclitaxel
      added for 12 weeks
    primary_ref: baselga2012neoaltto
    pubs:
    - kind: primary
      ref: baselga2012neoaltto
      role: report
    - kind: survival
      ref: huober2019
      role: survival
    result: pathological complete response 51.3% with dual blockade against 29.5% with trastuzumab, a difference of 21.1 percentage
      points (9.1-34.2), p=0.0001; 24.7% with lapatinib alone
    reviewed: '2026-09-14'
