    digest:
      methods: Randomised, double-blind, multicentre study in 337 postmenopausal women with untreated primary breast cancer
        positive for estrogen or progesterone receptors. Patients received letrozole 2.5 mg or tamoxifen 20 mg once daily
        for four months before surgery. None were candidates for breast-conserving surgery at baseline and 14 percent were
        considered inoperable. The primary endpoint was overall objective response by clinical palpation, with response on
        ultrasound and mammography and breast-conserving surgery rate as secondary endpoints.
      results: Objective response by clinical palpation was 55 percent with letrozole versus 36 percent with tamoxifen (P<0.001).
        Ultrasound response was 35 versus 25 percent (P=0.042) and mammographic response 34 versus 16 percent (P<0.001). Breast-conserving
        surgery was performed in 45 percent of the letrozole group versus 35 percent of the tamoxifen group (P=0.022). Both
        treatments were well tolerated.
