    year: 2012
  neostar:
    acronym: NeoSTAR
    arms: four cycles of neoadjuvant sacituzumab govitecan, single arm, with subsequent systemic therapy left to the discretion
      of the treating physician
    chapters:
    - BC-850
    - BC-860
    claim: pCR 30% (18-45) with sacituzumab govitecan alone in 50 patients, single arm
    digest:
      methods: Investigator-initiated trial of neoadjuvant sacituzumab govitecan, an antibody-drug conjugate targeting TROP2,
        in localized triple-negative breast cancer. Participants with early-stage disease received four cycles of the conjugate
        before surgery. The primary objective was the pathological complete response rate in breast and lymph nodes, ypT0/isN0,
        to sacituzumab govitecan. Secondary objectives were overall response rate, safety, event-free survival and predictive
        biomarkers. A response-guided approach was used and subsequent systemic therapy decisions were at the discretion of
        the treating physician.
      results: From July 2020 to August 2021, 50 participants were enrolled, median age 48.5 years, with 13 clinical stage
        I, 26 stage II and 11 stage III. Forty-nine (98%) completed four cycles. The pathological complete response rate with
        sacituzumab govitecan alone was 30% (n = 15, 95% CI 18% to 45%) and the overall response rate per RECIST V1.1 was
        64%, 32 of 50. Higher Ki-67 and higher tumour-infiltrating lymphocytes were predictive of pathological complete response
        (P = 0.007 and P = 0.002), while baseline TROP2 expression was not (P = 0.440). Common adverse events were nausea
        (82%), fatigue (76%), alopecia (76%), rash (48%) and neutropenia (44%). With a median follow-up of 18.9 months the
        2-year event-free survival was 95% for all participants and 100% among the 15 who had a pathological complete response.
    endpoint: pathological complete response in breast and lymph nodes, ypT0/isN0, to sacituzumab govitecan
    line: neoadjuvant
    modality: adc
    n: 50
    nct: NCT04230109
    note: Single arm, so the pathological complete response rate has no concurrent comparator. The design is response-guided
      and systemic therapy after the four cycles was at the treating physician's discretion, so the event-free survival figures
      describe the whole pathway rather than the conjugate alone and the trial is a proof-of-concept step, not validation
      of a replacement regimen. The published overall response rate of 64% is printed with a 95% CI of 77% to 98%, an interval
      that cannot bracket its own point estimate, so only the point estimate is carried into the row. The key neostar is not
      neostop, which is a different trial already in the registry.
    os: not reported. With a median follow-up of 18.9 months the 2-year event-free survival was 95% for all participants and
      100% among the 15 participants with a pathological complete response to sacituzumab govitecan
    phase: 2
    population: early-stage triple-negative breast cancer, clinical stage I to III
    primary_ref: spring2023
    pubs:
    - kind: primary
      ref: spring2023
      role: primary
    result: pathological complete response with sacituzumab govitecan alone 30% (n = 15, 95% CI 18% to 45%). Overall response
      rate per RECIST V1.1 after sacituzumab govitecan alone 64%, 32 of 50
    setting: early
    source:
    - ch: 63
      section: Additional studies — Early TNBC / hereditary HER2−
    status: reported
    subtype: TNBC
    topic: response-guided neoadjuvant antibody-drug conjugate monotherapy in untreated localized disease
    weight: exploratory
    year: 2023
  neostop:
    acronym: NeoSTOP
    arms: Weekly paclitaxel plus carboplatin followed by dose-dense doxorubicin and cyclophosphamide versus carboplatin plus
      docetaxel
    chapters:
    - BC-860
    digest:
      methods: Multisite randomised phase 2 trial. Patients aged 18 or older with stage I to III triple-negative breast cancer
        were randomised 1:1 to weekly paclitaxel for 12 weeks plus carboplatin AUC6 every 21 days for four cycles followed
        by doxorubicin and cyclophosphamide every 14 days for four cycles, or to carboplatin AUC6 plus docetaxel every 21
        days for six cycles. Stromal tumour-infiltrating lymphocytes were assessed.
      results: 100 patients were randomised, 48 to arm A and 52 to arm B. Pathologic complete response was 54% in each arm
        and residual cancer burden 0 or I was 67% in each. Median stromal tumour-infiltrating lymphocyte density was 20% with
        pathologic complete response versus 5% with residual disease. Grade 3 or 4 neutropenia was 60% versus 8% and febrile
        neutropenia 19% versus 0%. Mean cost was lower in arm B.
    endpoint: Pathologic complete response in breast and axilla
    line: neoadjuvant
    modality: chemo
    n: 100
    os: Event-free survival and overall survival were similar in the two arms at a median follow-up of 38 months. No survival
      figures were reported.
    phase: 2
    population: Patients aged 18 or older with stage I to III triple-negative breast cancer.
    primary_ref: sharma2020
    pubs:
    - kind: primary
      ref: sharma2020
      role: primary
    result: Pathologic complete response was 54% with weekly paclitaxel plus carboplatin followed by doxorubicin and cyclophosphamide
      and 54% with carboplatin plus docetaxel. Residual cancer burden 0 or I was 67% in both arms.
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 63
