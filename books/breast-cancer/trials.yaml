  her2climb-05:
    acronym: HER2CLIMB-05
    arms: Tucatinib plus trastuzumab and pertuzumab versus placebo plus trastuzumab and pertuzumab, as first-line maintenance.
    chapters:
    - BC-840
    - BC-900
    - BC-930
    digest:
      methods: Phase III randomised trial in patients with centrally confirmed HER2-positive metastatic breast cancer who
        had no progression after induction therapy and had no or asymptomatic brain metastases. Patients were assigned 1:1
        to tucatinib 300 mg or placebo twice a day combined with trastuzumab and pertuzumab. The primary endpoint was investigator-assessed
        progression-free survival. Secondary endpoints included overall survival, progression-free survival by blinded independent
        central review, CNS progression-free survival and safety.
