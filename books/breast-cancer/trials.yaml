    population: endocrine-resistant HR+/HER2- disease with no previous chemotherapy for metastatic disease
    setting: metastatic
    status: awaited
    subtype: HR+/HER2-
    topic: moving sacituzumab govitecan ahead of first chemotherapy
  astrra:
    acronym: ASTRRA
    arms: tamoxifen for 5 years plus 2 years of goserelin vs tamoxifen for 5 years alone
    cited_by:
    - BC-790
    claim: adding 2 years of ovarian suppression to tamoxifen improved disease-free survival in women who resumed ovarian
      function
    endpoint: disease-free survival
    line: adjuvant
    modality: endocrine
    n: 1293
    os: 5-year overall survival 99.4% vs 97.8%, HR 0.31 (0.10-0.94), p=0.029
    phase: 3
    population: women aged 45 or younger with ER-positive disease who remained premenopausal or resumed ovarian function after
      chemotherapy; 1483 enrolled and 1293 randomised
    primary_ref: kim2020astrra
    result: 5-year disease-free survival 91.1% vs 87.5%, HR 0.69 (0.48-0.97), p=0.033
    setting: early
    status: reported
    subtype: HR+/HER2-,HR+/HER2+
    topic: two years of added ovarian suppression after chemotherapy, ovarian-suppression
    year: 2020
  atac:
    acronym: ATAC
    arms: anastrozole 1 mg daily for 5 years vs tamoxifen 20 mg daily for 5 years
    cited_by:
    - BC-790
    claim: 10-year time to recurrence HR 0.79 in hormone receptor-positive disease, no overall survival difference
    endpoint: disease-free survival
    line: adjuvant
    modality: endocrine
    n: 6241
    os: little difference in overall mortality, HR 0.95 (0.84-1.06), p=0.4
    phase: 3
    population: postmenopausal early breast cancer; 10-year analysis of the two-arm comparison, 5216 of 6241 hormone receptor-positive
    primary_ref: cuzick2010
    result: in hormone receptor-positive patients, disease-free survival HR 0.86 (0.78-0.95) and time to recurrence HR 0.79
      (0.70-0.89); absolute difference in time to recurrence 2.7% at 5 years and 4.3% at 10 years
    setting: early
    status: reported
    subtype: HR+/HER2-,HR+/HER2+
    topic: upfront anastrozole versus upfront tamoxifen, ai-vs-tamoxifen
    year: 2010
  atempt:
    acronym: ATEMPT
    arms: trastuzumab emtansine vs paclitaxel with trastuzumab, randomised 3:1
    cited_by:
    - BC-500
    - BC-820
    claim: 3-year IDFS 97.8% with T-DM1; clinically relevant toxicity not reduced
    endpoint: clinically relevant toxicity, with 3-year invasive disease-free survival as a co-primary endpoint
    line: adjuvant
    modality: adc,her2
    n: 497
    os: not reported at the primary analysis
    phase: 2
    population: stage I HER2-positive; randomised 3:1, with the analysis population the 497 who began protocol therapy
    primary_ref: tolaney2021atempt
    result: clinically relevant toxicity 46% with the conjugate against 47% with the taxane, p=0.83; 3-year invasive disease-free
      survival with the conjugate 97.8% (96.3-99.3)
    setting: early
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: adjuvant trastuzumab emtansine versus paclitaxel with trastuzumab de-escalated
    year: 2021
  atlas:
    acronym: ATLAS
    arms: tamoxifen continued to 10 years vs stopping at 5 years
    cited_by:
    - BC-430
    - BC-790
    claim: recurrence during years 5-14 21.4% vs 25.1%; breast cancer mortality 12.2% vs 15.0%
    endpoint: breast cancer recurrence
    line: adjuvant
    modality: endocrine
    n: 12894
    os: 639 vs 722 deaths from any cause in ER-positive women, p=0.01; breast cancer mortality during years 5-14 12.2% vs
      15.0%
    phase: 3
    population: ER-positive early breast cancer, disease-free after 5 years of tamoxifen; 6846 of 12894 randomised women had
      ER-positive disease
    primary_ref: davies2013atlas
    result: cumulative recurrence during years 5-14 21.4% vs 25.1%; 617 vs 711 recurrences in ER-positive women
    setting: early
    status: reported
    subtype: HR+/HER2-,HR+/HER2+
    topic: ten years versus five years of adjuvant tamoxifen tamoxifen-duration
    year: 2013
  b35:
