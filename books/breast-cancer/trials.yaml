  elipse:
    acronym: ELIPSE
    arms: Single arm of elacestrant 345 mg daily for 4 weeks before surgery.
    chapters:
    - BC-810
    claim: four weeks of elacestrant gave complete cell cycle arrest in 27.3% of 22 tumours
    digest:
      methods: Multicentre window-of-opportunity trial of preoperative elacestrant in postmenopausal women with early breast
        cancer, run to investigate the biological changes induced by a short preoperative course. Eligible patients had untreated
        T1c (at least 1.5 cm) to T3, N0, ER-positive, HER2-negative breast cancer with locally assessed Ki67 of 10% or more.
        They received elacestrant at a daily dose of 345 mg for 4 weeks. The primary efficacy endpoint was complete cell cycle
        arrest, defined as Ki67 of 2.7% or less, on day 28. Molecular change was assessed with PAM50-based gene signatures
        and gene expression.
      results: 22 patients were evaluable for the primary endpoint. Elacestrant was associated with a complete cell cycle
        arrest rate of 27.3% and a statistically significant Ki67 geometric mean change of -52.9% (P = 0.007; 95% CI -67.4
        to -32.1). Treatment shifted tumours towards a more endocrine-sensitive and less proliferative phenotype on PAM50-based
        gene signatures, increased expression of the immune-response genes GZMB, CD4 and CD8A, and suppressed the proliferation
        and estrogen-signalling genes MKI67, ESR1 and AR. These biological changes were independent of the level of Ki67 suppression
        on day 28. The most common adverse events were grade 1 anemia (21.7%), hot flushes (8.7%), constipation (8.7%) and
        abdominal pain (8.7%), and one patient had a grade 3 cutaneous rash leading to treatment discontinuation.
    endpoint: Complete cell cycle arrest, defined as Ki67 of 2.7% or less, on day 28.
    line: neoadjuvant
    modality: endocrine
    n: 22
    note: The publication does not state a trial phase. This is a small single-arm window-of-opportunity study of four weeks
      of treatment, so the endpoints are pharmacodynamic and molecular surrogates and the record carries no outcome evidence.
      n is the 22 patients evaluable for the primary endpoint; the abstract does not state how many patients were treated
      in total, and the adverse event denominators differ from 22. The paper also calls the trial SOLTI-ELIPSE after the sponsoring
      group. No NCT number appears in the abstract, so none is recorded.
    population: Postmenopausal women with untreated T1c (at least 1.5 cm) to T3, N0, oestrogen receptor-positive, HER2-negative
      breast cancer and locally assessed Ki67 of 10% or more.
    primary_ref: vidal2025
    pubs:
    - kind: primary
      ref: vidal2025
      role: primary
    result: Among 22 patients evaluable for the primary endpoint, elacestrant was associated with a complete cell cycle arrest
      rate of 27.3% and a statistically significant Ki67 geometric mean change of -52.9% (P = 0.007; 95% CI -67.4 to -32.1).
      This was a single-arm study with no comparator.
    setting: early
    source:
    - ch: 56
      section: Additional studies — Early HR+/HER2−
    status: reported
    subtype: HR+/HER2-
    topic: whether four weeks of a preoperative oral selective oestrogen receptor degrader arrests the cell cycle in untreated
