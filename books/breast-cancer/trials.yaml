    digest:
      methods: Randomised, controlled, population-based, single-blinded, non-inferiority screening accuracy study at four
        Swedish sites. Women aged 40-80 years eligible for mammography screening were randomly allocated 1:1 to AI-supported
        screening or standard double reading without AI. The AI system scored malignancy risk on a 10-level scale, triaging
        examinations to single reading (score 1-9) or double reading (score 10). This prespecified clinical safety analysis
        assessed early screening performance and screen-reading workload in the modified intention-to-treat population.
      results: 80 033 women were randomised between April 2021 and July 2022, 40 003 to AI-supported screening and 40 030
        to double reading, and 13 were excluded. AI-supported screening gave 244 screen-detected cancers, 861 recalls, and
        46 345 screen readings. Standard screening gave 203 cancers, 817 recalls, and 83 231 readings. Cancer detection rates
        were 6.1 versus 5.1 per 1000 screened (ratio 1.2, 95% CI 1.0 to 1.5; p=0.052). Screen-reading workload fell by 44.3%.
