    subtype: HR+/HER2+
    topic: two-week Ki67 response used to allocate chemotherapy-free treatment
    year: 2019
  permeate:
    acronym: PERMEATE
    arms: Single arm of pyrotinib plus capecitabine, given in a radiotherapy-naive cohort and a post-radiotherapy cohort.
    chapters:
    - BC-930
    digest:
      methods: Multicentre, single-arm, two-cohort phase 2 trial in eight tertiary hospitals in China. Patients aged 18 years
        or older with HER2-positive brain metastases that were radiotherapy-naive (cohort A) or progressive after radiotherapy
        (cohort B), with ECOG performance status 0-2, received pyrotinib 400 mg orally once daily and capecitabine 1000 mg/m2
        twice daily for 14 days followed by seven days off every three weeks until progression or unacceptable toxicity. The
        primary endpoint was confirmed intracranial objective response rate.
      results: 78 women were enrolled, 59 in cohort A and 19 in cohort B. The intracranial objective response rate was 74.6%
        (44 of 59) in cohort A and 42.1% (eight of 19) in cohort B. Median progression-free survival was 10.9 and 5.7 months
        and median overall survival 35.9 and 30.6 months. Grade 3 or worse diarrhoea occurred in 24% and 21%. No treatment-related
        deaths occurred.
    endpoint: Confirmed intracranial objective response rate by investigator assessment using RECIST version 1.1.
    modality: her2,chemo
    n: 78
    nct: NCT03691051
    note: The abstract does not state the number of prior treatment lines, so line is left null.
    os: Median overall survival was 35.9 months (95% CI 24.4 to not reached) in the radiotherapy-naive cohort and 30.6 months
      (95% CI 12.6-33.3) in the post-radiotherapy cohort.
    phase: 2
    population: Adults with HER2-positive metastatic breast cancer and brain metastases, either radiotherapy-naive or progressive
      after radiotherapy, with ECOG performance status 0-2.
    primary_ref: yan2022
    pubs:
    - kind: primary
      ref: yan2022
      role: primary
    - kind: survival
      ref: yan2024
      role: os
    result: The intracranial objective response rate was 74.6% (95% CI 61.6-85.0) in the radiotherapy-naive cohort and 42.1%
      (95% CI 20.3-66.5) in the post-radiotherapy cohort. This was a single-arm study with no control group.
