  her2climb-02:
    acronym: HER2CLIMB-02
    arms: Tucatinib plus trastuzumab emtansine versus placebo plus trastuzumab emtansine.
    chapters:
    - BC-900
    - BC-930
    digest:
      methods: Phase III randomised trial in patients with HER2-positive locally advanced or metastatic breast cancer previously
        treated with trastuzumab and a taxane in any setting, including patients with brain metastases. Patients were assigned
        1:1 to trastuzumab emtansine 3.6 mg/kg intravenously every 21 days with either tucatinib 300 mg orally twice daily
        or placebo twice daily.
      results: 463 patients were randomly assigned. After a median follow-up of 24.4 months, median progression-free survival
        was 9.5 months with tucatinib versus 7.4 months with placebo, hazard ratio 0.76, 95% CI 0.61 to 0.95, P=0.0163, with
        benefit across all prespecified subgroups including patients with brain metastases. Discontinuation for treatment-emergent
        adverse events was 22.1% versus 11.6% and grade 3 or higher events 68.8% versus 41.2%, most often raised alanine and
        aspartate aminotransferase.
    endpoint: Progression-free survival.
    line: 2L
    modality: her2,adc
    n: 463
    nct: NCT03975647
    os: Interim overall survival was immature. Median overall survival was not reached with tucatinib versus 38.0 months in
      the control arm, hazard ratio 1.23, 95% CI 0.87 to 1.74.
