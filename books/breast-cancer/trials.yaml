  peony:
    acronym: PEONY
    arms: Neoadjuvant pertuzumab with trastuzumab and docetaxel versus placebo with trastuzumab and docetaxel.
    chapters:
    - BC-830
    - BC-840
    digest:
      methods: Multicentre, double-blind, placebo-controlled phase 3 trial that randomised 329 Asian women 2:1. Patients had
        ERBB2-positive early (T2-3, N0-1, M0) or locally advanced breast cancer with a primary tumour larger than 2 cm. Before
        surgery they received four cycles of pertuzumab or placebo with trastuzumab and docetaxel every three weeks. After
        surgery they received three cycles of fluorouracil, epirubicin and cyclophosphamide, then 13 cycles of the same anti-ERBB2
        therapy for up to one year.
      results: Total pathological complete response was 39.3% (86 of 219) with pertuzumab and 21.8% (24 of 110) with placebo,
        difference 17.5% (95% CI 6.9-28.0, p=0.001). Grade 3 or higher neutropenia was 38.1% versus 32.7% and serious adverse
        events 10.1% versus 8.2%. At 62.9 months median follow-up, five-year event-free survival was 84.8% versus 73.7% (hazard
        ratio 0.53) and five-year disease-free survival 86.0% versus 75.0% (hazard ratio 0.52).
    endpoint: Total pathological complete response rate assessed by an independent review committee.
    line: neoadjuvant
    modality: her2,chemo
    n: 329
    nct: NCT02586025
    os: Overall survival was a secondary endpoint of the final analysis at 62.9 months median follow-up, but no overall survival
      estimate is given in the abstract.
    phase: 3
    population: Asian women with ERBB2-positive early or locally advanced breast cancer and a primary tumour larger than 2
      cm.
    primary_ref: shao2020
    pubs:
    - kind: primary
      ref: shao2020
      role: primary
    - kind: update
      ref: huang2024
      role: final analysis
    result: Total pathological complete response was 39.3%, 86 of 219 patients, with pertuzumab versus 21.8%, 24 of 110 patients,
      with placebo. The difference was 17.5% (95% CI 6.9-28.0, p=0.001).
