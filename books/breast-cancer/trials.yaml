        versus 711 in 3418 controls, p=0.002), breast cancer mortality (331 versus 397 deaths, p=0.01) and overall mortality
        (639 versus 722 deaths, p=0.01). Cumulative recurrence risk during years 5 to 14 was 21.4% versus 25.1%, and breast
        cancer mortality 12.2% versus 15.0%. The rate ratio was 1.87 for pulmonary embolus and 1.74 for endometrial cancer.
