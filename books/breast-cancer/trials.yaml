  pelops:
    acronym: PELOPS
    arms: Neoadjuvant endocrine therapy plus palbociclib vs neoadjuvant endocrine therapy alone for 24 weeks, randomised 2:1.
    chapters:
    - BC-810
    claim: after neoadjuvant endocrine therapy, ALND added no benefit over SLNB in ypN+ disease
    digest:
      methods: Report of nodal status, surgical procedure and outcomes among patients enrolled between 2016 and 2020 in the
        Palbociclib and Endocrine therapy for LObular breast cancer Preoperative Study. Women with hormone receptor-positive,
        HER2-negative tumours larger than 1.5 cm, any cN, were randomised 2:1 to neoadjuvant endocrine therapy with or without
        palbociclib for 24 weeks. Axillary surgery, sentinel lymph node biopsy with or without axillary dissection, and nodal
        evaluation by H&E with or without immunohistochemistry were not specified in the protocol. Pathologic node-positive
        rates, local-regional recurrence-free interval and breast cancer-specific survival, compared by univariate Cox proportional
        hazards, were prespecified exploratory endpoints.
      results: 188 patients were analysed, 128 treated with neoadjuvant endocrine therapy plus palbociclib and 60 with endocrine
        therapy alone, at a median age of 56.5 years. 82 (43.6%) had lobular histology, 99 (52.7%) were cN0, 84 (44.7%) cN+
        and 5 (2.6%) cN unknown. Of cN+ patients with known ypN, nodal pathologic complete response was 10.9% (6 of 55) after
        endocrine therapy plus palbociclib and 13.6% (3 of 22) after endocrine therapy alone. Among 108 ypN+ patients, 26
        (24.1%) underwent sentinel lymph node biopsy, 82 (75.9%) axillary dissection and 99 (91.7%) radiation. At 4.65 years
        median follow-up, 3-year local-regional recurrence-free interval for ypN+ patients treated with sentinel node biopsy
        only was 96% and with axillary dissection 97.4% (p = 0.6), and 3-year breast cancer-specific survival was 96.0% and
        100.0% (p = 0.9). The addition of palbociclib did not impact pathologic nodal outcomes.
    endpoint: The trial's own primary endpoint is not stated in the publication on the record. That publication's prespecified
      exploratory endpoints were pathologic node-positive rate, local-regional recurrence-free interval and breast cancer-specific
      survival.
    line: neoadjuvant
    modality: cdk4-6,endocrine
    n: 188
    nct: NCT02764541
    note: The only publication on the record is the axillary management analysis, whose endpoints the paper calls prespecified
      exploratory ones, so no tabulated result is given and this reference must not be attached to any claim about the trial's
      primary systemic endpoint. n is the 188 patients analysed in that report, which is not necessarily the full randomised
      population. The abstract does not state a phase; the phase 2 tag comes from the registry design entry. The trial is
      named for lobular cancer but enrolled hormone receptor-positive, HER2-negative disease of any histology, and 82 of 188
      (43.6%) had lobular tumours. Breast cancer-specific survival is reported and overall survival is not, so the os field
      is left out.
    phase: 2
    population: Women with hormone receptor-positive, HER2-negative tumours larger than 1.5 cm and any clinical nodal status,
      enrolled between 2016 and 2020.
    primary_ref: weiss2025
    pubs:
    - kind: endpoint
      ref: weiss2025
      role: secondary
    setting: early
    source:
    - ch: 56
      section: Additional studies — Early HR+/HER2−
    status: reported
    subtype: HR+/HER2-
    topic: whether palbociclib adds to preoperative endocrine therapy, and how lobular and ductal tumours differ
    weight: exploratory
    year: 2025
  pembrolizumab-in-bm-of-diverse-histologi:
    acronym: Pembrolizumab in BM of diverse histologies
    arms: Single arm of pembrolizumab in two cohorts, nine patients with untreated and 48 with recurrent or progressive brain
      metastases.
    chapters:
    - BC-930
    digest:
      methods: Single-arm, open-label phase 2 trial of pembrolizumab, a programmed cell death protein 1 inhibitor, in patients
        with brain metastases of different histologies. Nine patients with untreated brain metastases formed cohort A and
        48 with recurrent and progressive brain metastases formed cohort B. The primary endpoint was the proportion achieving
        intracranial benefit, defined as complete response, partial response or stable disease. Overall survival was a secondary
        endpoint.
      results: The primary endpoint was met with an intracranial benefit rate of 42.1% (90% CI 31-54%). Median overall survival
        was 8.0 months across both cohorts, 6.5 months in cohort A and 8.1 months in cohort B. Seven patients (12.3%) with
        breast, melanoma and sarcoma histologies survived beyond two years. Thirty patients (52%) had one or more grade 3
        or higher possibly related adverse events, including two grade 4 cerebral oedema.
    endpoint: Proportion of patients achieving intracranial benefit, defined as complete response, partial response or stable
      disease.
    modality: immunotherapy
    n: 57
    nct: NCT02886585
    note: The trial enrolled brain metastases of any primary histology rather than breast cancer alone, it reports no breast-specific
      result, and the abstract gives no treatment line.
    os: Median overall survival was 8.0 months (90% CI 5.5-8.7) across both cohorts, 6.5 months in cohort A and 8.1 months
      in cohort B.
    phase: 2
    population: Patients with untreated brain metastases or with recurrent and progressive brain metastases arising from diverse
      primary histologies, including breast cancer.
    primary_ref: brastianos2023
    pubs:
    - kind: primary
      ref: brastianos2023
      role: primary
    result: The intracranial benefit rate was 42.1% (90% CI 31-54%), which met the prespecified primary endpoint. This was
      a single-arm trial with no control group.
