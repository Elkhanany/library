        age was 54 years, 69.3% had de novo metastatic disease, 52.6% were hormone receptor-positive and 12.4% had baseline
        brain metastases. Median progression-free survival was 24.9 versus 16.3 months, hazard ratio 0.641, 95% CI 0.514 to
        0.799, P<.0001, with benefit regardless of brain metastases or hormone receptor status. Diarrhoea affected 72.7% of
        tucatinib patients.
