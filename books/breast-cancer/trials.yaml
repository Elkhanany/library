  alternative:
    acronym: ALTERNATIVE
    arms: Lapatinib plus trastuzumab plus aromatase inhibitor vs trastuzumab plus aromatase inhibitor vs lapatinib plus aromatase
      inhibitor.
    chapters:
    - BC-910
    digest:
      methods: Randomised phase III study in postmenopausal women with HER2-positive, hormone receptor-positive metastatic
        breast cancer who had received prior endocrine therapy and prior neoadjuvant, adjuvant or first-line trastuzumab with
        chemotherapy. Patients for whom chemotherapy was intended were excluded. Patients were randomised 1:1:1 to lapatinib
        plus trastuzumab plus an aromatase inhibitor, trastuzumab plus an aromatase inhibitor, or lapatinib plus an aromatase
        inhibitor. The primary endpoint was investigator-assessed progression-free survival for the triplet versus trastuzumab
        plus aromatase inhibitor.
      results: 355 patients were analysed, with 120 on the triplet, 117 on trastuzumab plus aromatase inhibitor and 118 on
        lapatinib plus aromatase inhibitor. The triplet improved progression-free survival over trastuzumab plus aromatase
        inhibitor (hazard ratio 0.62; 95% CI 0.45 to 0.88; P = .0063), consistently across predefined subgroups. Median progression-free
        survival with lapatinib plus aromatase inhibitor was 8.3 versus 5.6 months (hazard ratio 0.85; 95% CI 0.62 to 1.17).
        Diarrhoea occurred in 69% on the triplet.
