  swog-8814-int-0100:
    acronym: SWOG-8814 / INT-0100
    arms: CAF followed by tamoxifen, or CAF with concurrent tamoxifen, versus tamoxifen alone.
    chapters:
    - BC-490
    - BC-790
    digest:
      methods: Open-label phase 3 trial in postmenopausal women with hormone receptor positive, node positive breast cancer.
        Patients were randomised 2:3:3 to tamoxifen alone for five years, to six cycles of CAF every four weeks followed by
        tamoxifen, or to CAF with concurrent tamoxifen. The primary endpoint was disease-free survival, addressing chemotherapy
        benefit and then tamoxifen timing. Overall survival and toxicity were predefined secondary outcomes. Analysis was
        by intention to treat among eligible patients using stratified log-rank tests and adjusted Cox regression.
      results: Of 1558 randomised women, 1477 were eligible for analysis. Median follow-up was 8.94 years and 637 had a disease-free
        survival event. CAF plus tamoxifen beat tamoxifen alone for disease-free survival, hazard ratio 0.76, 95 percent CI
        0.64 to 0.91, p=0.002, and marginally for overall survival, hazard ratio 0.83, p=0.057. Sequential versus concurrent
        tamoxifen gave hazard ratio 0.84, p=0.061. Neutropenia, stomatitis, thromboembolism, heart failure and leukaemia were
        more frequent with chemotherapy.
    endpoint: Disease-free survival.
    line: adjuvant
    modality: chemo,endocrine
    n: 1558
    nct: NCT00929591
    note: Eligibility required hormone receptor positive, node positive disease without any HER2 criterion, so the HR+/HER2-
      axis reflects the modern filing rather than the enrolment rule.
    os: Overall survival favoured CAF plus tamoxifen over tamoxifen alone only marginally, hazard ratio 0.83, 95 percent CI
      0.68 to 1.01, p=0.057.
