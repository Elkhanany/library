  ispy2-pembro:
    acronym: I-SPY2 pembrolizumab arm
    arms: pembrolizumab added to weekly paclitaxel then doxorubicin and cyclophosphamide vs the same chemotherapy, adaptively
      randomised against a shared control
    chapters:
    - BC-810
    - BC-860
    cited_by:
    - BC-860
    digest:
      methods: I-SPY2 is an ongoing open-label, multicenter, adaptively randomised phase 2 platform trial in high-risk stage
        II or III breast cancer, with standard neoadjuvant chemotherapy as the common control arm. Patients with ERBB2-negative
        breast cancer were eligible for randomisation to pembrolizumab between November 2015 and November 2016. They received
        taxane- and anthracycline-based neoadjuvant chemotherapy with or without four cycles of pembrolizumab, followed by
        definitive surgery. The primary end point was pathologic complete response.
      results: Of 250 women in the final analysis, 181 were randomised to standard control chemotherapy and 69 to pembrolizumab
        with weekly paclitaxel followed by doxorubicin and cyclophosphamide, 40 hormone receptor-positive and 29 triple-negative.
        Pembrolizumab graduated in all three biomarker signatures. Final estimated pathologic complete response rates were
        44% versus 17% in ERBB2-negative disease, 30% versus 13% in hormone receptor-positive ERBB2-negative disease, and
        60% versus 22% in triple-negative disease. Thyroid abnormalities occurred in 13.0% and adrenal insufficiency in 8.7%.
    endpoint: pathological complete response, with Bayesian graduation
    line: neoadjuvant
    modality: immunotherapy,chemo
    n: 250
    nct: NCT01042379
    os: not reported
    phase: 2
    population: high-risk stage II-III HER2-negative disease; 29 of 69 in the experimental arm triple-negative
    primary_ref: nanda2020
    pubs:
    - kind: primary
      ref: nanda2020
      role: primary
    result: estimated pCR 60% with pembrolizumab vs 22% in triple-negative disease, 44% vs 17% across HER2-negative disease
