  egf30008:
    acronym: EGF30008
    arms: Letrozole plus lapatinib versus letrozole plus placebo.
    chapters:
    - BC-840
    - BC-870
    - BC-910
    digest:
      methods: Postmenopausal women with hormone receptor-positive metastatic breast cancer were randomly assigned to daily
        letrozole 2.5 mg orally plus lapatinib 1,500 mg orally, or letrozole plus placebo, as first-line treatment. The primary
        end point was progression-free survival in the HER2-positive population. A preplanned Cox regression analysis examined
        factors in the HER2-negative population.
      results: In 219 hormone receptor-positive, HER2-positive patients, adding lapatinib reduced the risk of progression,
        hazard ratio 0.71 (95% CI 0.53 to 0.96, P=.019), with median progression-free survival of 8.2 versus 3.0 months. Clinical
        benefit was 48% versus 29% (P=.003). The 952 centrally confirmed HER2-negative patients had no progression-free survival
        improvement. Grade 3 or 4 diarrhea occurred in 10% versus 1% and rash in 1% versus 0%.
    endpoint: Progression-free survival in the HER2-positive population
    line: 1L
    modality: endocrine,her2
    note: The abstract gives no total randomised number, only 219 HER2-positive and 952 centrally confirmed HER2-negative
      patients, so n is left null.
    os: not yet reported
    phase: 3
    population: Postmenopausal women with hormone receptor-positive metastatic breast cancer receiving first-line therapy,
      enrolled regardless of HER2 status.
    primary_ref: johnston2009
    pubs:
    - kind: primary
      ref: johnston2009
      role: primary
    result: In the 219 HER2-positive patients, median progression-free survival was 8.2 months with lapatinib plus letrozole
      and 3.0 months with letrozole plus placebo, hazard ratio 0.71 (95% CI 0.53 to 0.96, P=.019). The 952 centrally confirmed
      HER2-negative patients had no improvement.
