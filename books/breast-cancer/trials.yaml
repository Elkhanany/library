  jpbo-abemaciclib-cns-study:
    acronym: JPBO abemaciclib CNS study
    arms: Single arm cohorts of abemaciclib, given alone, with endocrine therapy, or with trastuzumab.
    chapters:
    - BC-930
    digest:
      methods: Nonrandomised phase II study in four subtype specific cohorts. Cohort A was hormone receptor positive HER2
        negative brain metastases, cohort B hormone receptor positive HER2 positive brain metastases, cohort C leptomeningeal
        metastases, cohort D brain metastases undergoing surgical resection. Abemaciclib 200 mg twice daily was given as monotherapy
        or with endocrine therapy, or 150 mg twice daily with trastuzumab. Cohorts A and B used a Simon two stage design.
      results: Cohort A (58 patients) had 3 confirmed responders, an intracranial objective response rate of 5.2 percent and
        a clinical benefit rate of 24 percent, with median overall survival 12.5 months. Cohort B (27 patients) had no confirmed
        intracranial responses and a clinical benefit rate of 11 percent, with median overall survival 10.1 months. Cohort
        C (10 patients) had one complete parenchymal response. In cohort D, unbound brain drug concentrations exceeded the
        CDK4 and CDK6 targets 96 fold and 19 fold.
    endpoint: Intracranial objective response rate
    line: 3L+
    modality: cdk4-6,endocrine,her2
    n: 104
    nct: NCT02308020
    os: Median overall survival was 12.5 months in cohort A and 10.1 months in cohort B. There was no control arm for comparison.
    phase: 2
    population: Patients with brain metastases or leptomeningeal metastases from hormone receptor positive metastatic breast
      cancer, mostly heavily pretreated.
    primary_ref: tolaney2020a
    pubs:
    - kind: primary
      ref: tolaney2020a
      role: primary
    result: In the HER2 negative cohort A, 3 of 58 patients were confirmed intracranial responders, an intracranial objective
      response rate of 5.2 percent (95% CI 0.0 to 10.9). In the HER2 positive cohort B there were no confirmed intracranial
      responses. The study did not meet its primary endpoint.
    reviewed: '2026-09-14'
    setting: cns
    source:
    - group: Hormone receptor positive brain metastases
      section: Brain and leptomeningeal metastases
    status: reported
    subtype: HR+/HER2-,HR+/HER2+
