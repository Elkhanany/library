  calgb-40502-ncctg-n063h:
    acronym: CALGB 40502 / NCCTG N063H
    arms: Weekly nab-paclitaxel or weekly ixabepilone versus weekly paclitaxel, each with bevacizumab.
    chapters:
    - BC-890
    - BC-920
    digest:
      methods: 'Randomised phase 3 trial. Patients aged 18 years or older with chemotherapy-naive advanced breast cancer were
        assigned to bevacizumab plus one of three weekly regimens given 3 weeks of every 4: paclitaxel 90 mg/m2, nab-paclitaxel
        150 mg/m2, or ixabepilone 16 mg/m2. Planned enrolment was 900 patients, giving 88% power to detect a hazard ratio
        of 0.73. The comparison was progression-free survival for each experimental arm against paclitaxel.'
      results: 799 patients were enrolled and 783 received treatment, with 97% receiving bevacizumab. The ixabepilone arm
        closed for futility at the first interim analysis and the other two arms closed at the second. Median progression-free
        survival was 11 months with paclitaxel, 7.4 months with ixabepilone (hazard ratio 1.59, 95% CI 1.31 to 1.93, p<0.001)
        and 9.3 months with nab-paclitaxel (hazard ratio 1.20, 95% CI 1.00 to 1.45, p=0.054). Toxicity including peripheral
        neuropathy was greater with nab-paclitaxel.
    endpoint: Progression-free survival for nab-paclitaxel and for ixabepilone, each versus paclitaxel.
    line: 1L
    modality: chemo
    n: 799
    note: The trial is first-line and all-comers, so it fits the cross-subtype chemotherapy foundations subsection rather
      than the later-line hormone receptor-positive chapter title it sits under.
    os: Overall survival results were concordant with progression-free survival, favouring neither experimental arm. No survival
      figures were given in the abstract.
    phase: 3
    population: Patients aged 18 years or older with chemotherapy-naive locally recurrent or metastatic breast cancer.
    primary_ref: rugo2015
    pubs:
    - kind: primary
      ref: rugo2015
      role: primary
    result: Median progression-free survival was 11 months with paclitaxel, 9.3 months with nab-paclitaxel (hazard ratio 1.20,
      95% CI 1.00 to 1.45, p=0.054) and 7.4 months with ixabepilone (hazard ratio 1.59, 95% CI 1.31 to 1.93, p<0.001). Neither
      experimental arm beat paclitaxel.
    reviewed: '2026-09-14'
    setting: metastatic
    source:
    - ch: 70
      group: Chemotherapy foundations (cross-subtype)
      section: Metastatic disease
    status: reported
    subtype: all
    topic: paclitaxel versus nab-paclitaxel versus ixabepilone, with bevacizumab
    year: 2015
  calgb-40601:
    acronym: CALGB 40601
    arms: Weekly paclitaxel with trastuzumab plus lapatinib versus paclitaxel with trastuzumab versus paclitaxel with lapatinib.
    chapters:
    - BC-830
    - BC-840
    digest:
      methods: Randomised phase 3 neoadjuvant trial. 305 women with untreated stage II and III HER2-positive breast cancer
        were assigned to weekly paclitaxel combined with trastuzumab plus lapatinib, with trastuzumab alone, or with lapatinib
        alone. The primary endpoint was pathological complete response. Secondary endpoints included relapse-free survival,
        overall survival and gene expression analyses. mRNA sequencing was performed on 264 pretreatment samples.
      results: 118 patients were assigned paclitaxel with trastuzumab and lapatinib, 120 paclitaxel with trastuzumab and 67
        paclitaxel with lapatinib. At more than 7 years, dual blockade improved relapse-free survival (hazard ratio 0.32,
        95% CI 0.14 to 0.71, p=0.005) and overall survival (hazard ratio 0.34, 95% CI 0.12 to 0.94, p=0.037) versus trastuzumab
        alone, with no difference between trastuzumab and lapatinib. Of 688 signatures, 215 were associated with pathological
        complete response and 45 with relapse-free survival.
    endpoint: Pathological complete response.
    line: neoadjuvant
    modality: her2,chemo
    n: 305
    note: The result is taken from the primary report, carey2016. The overall survival entry and the summary of methods and
      results come from the later analysis of long-term outcome and gene expression signatures, fernandezmartinez2020.
    os: In the later long-term analysis, at more than 7 years of follow-up, overall survival favoured paclitaxel with trastuzumab
      and lapatinib over paclitaxel with trastuzumab, hazard ratio 0.34 (95% CI 0.12 to 0.94), P = .037, with relapse-free
      survival hazard ratio 0.32 (95% CI 0.14 to 0.71), P = .005.
    phase: 3
    population: Women with untreated stage II or III HER2-positive breast cancer.
    primary_ref: carey2016
    pubs:
    - kind: primary
      ref: carey2016
      role: primary
    - kind: analysis
      ref: fernandezmartinez2020
      role: molecular correlates and long-term outcome
    result: Pathological complete response in the breast was 56% (95% CI 47 to 65) with paclitaxel, trastuzumab and lapatinib
      against 46% (95% CI 37 to 55) with paclitaxel and trastuzumab, P = .13. Adding lapatinib raised response in hormone
      receptor-negative disease (P = .01) and not in hormone receptor-positive disease.
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 59
      group: Foundational trastuzumab / dual blockade
      section: Early nonmetastatic disease
    status: reported
    subtype: HER2+,HR+/HER2+
    tabulated: false
    topic: paclitaxel+trastuzumab ± lapatinib, backbone-addition
    year: 2016
  calgb-70604:
    acronym: CALGB 70604 (Alliance)
    arms: Zoledronic acid 4 mg intravenously every 4 weeks versus every 12 weeks, for two years.
    chapters:
    - BC-600
    digest:
      methods: Randomised open-label trial at 269 sites in the United States. Patients with metastatic breast cancer, metastatic
        prostate cancer or multiple myeloma and at least one site of bone involvement were randomised to zoledronic acid every
        4 weeks or every 12 weeks for two years. The primary endpoint was the proportion with at least one skeletal-related
        event within two years, with a 7 percentage point non-inferiority margin. Skeletal-related event was defined as clinical
        fracture, spinal cord compression, radiation to bone or surgery involving bone.
      results: Of 1822 patients randomised, 795 completed two years. At least one skeletal-related event occurred in 260 of
        911 (29.5%) on the 4-weekly schedule and 253 of 911 (28.6%) on the 12-weekly schedule, risk difference -0.3%, P <
        .001 for non-inferiority. The proportions did not differ significantly within breast, prostate or myeloma. Pain, performance
        status, osteonecrosis of the jaw and kidney dysfunction did not differ. C-terminal telopeptide levels were higher
        on the 12-weekly schedule, indicating less complete suppression of bone turnover.
    endpoint: Proportion of patients with at least one skeletal-related event within two years, with a non-inferiority margin
      of 7 percentage points.
    modality: bone
    n: 1822
    nct: NCT00869206
    note: Three cancers were enrolled together and the per-disease comparisons were secondary. Patients were randomised to
      the assigned interval for the whole two years. OPTIMIZE-2 randomised only after nine or more monthly doses had already
      been given, so the two trials ask different questions. The publication reports no phase, so none is entered here.
    population: Metastatic breast cancer, metastatic prostate cancer or multiple myeloma with at least one site of bone involvement.
      855 of the 1822 patients had breast cancer.
    primary_ref: himelstein2017
    pubs:
    - kind: primary
      ref: himelstein2017
      role: primary
    result: At least one skeletal-related event occurred in 29.5% on the 4-weekly schedule and 28.6% on the 12-weekly schedule,
      risk difference -0.3%, P < .001 for non-inferiority. Pain scores, performance status, osteonecrosis of the jaw and kidney
      dysfunction did not differ. Bone turnover was less suppressed on the longer interval.
    reviewed: '2026-09-16'
    setting: metastatic
    status: reported
    subtype: all
    topic: zoledronic acid every 12 weeks against every 4 weeks from the start of treatment, bone-modifying-agent
    year: 2017
  calgb-9344:
    acronym: CALGB 9344
    arms: Four cycles of doxorubicin and cyclophosphamide at three doxorubicin doses, then four cycles of paclitaxel versus
      no further therapy.
    chapters:
    - BC-490
    - BC-510
    - BC-850
    digest:
      methods: Randomised adjuvant trial. 3121 women with operable breast cancer and involved lymph nodes were assigned after
        surgery to cyclophosphamide 600 mg/m2 with doxorubicin at 60, 75 or 90 mg/m2 for four cycles, followed by either no
        further therapy or four cycles of paclitaxel 175 mg/m2. Tamoxifen was given to 94% of patients with hormone receptor-positive
        tumours. Endpoints were time to recurrence and survival.
      results: There was no doxorubicin dose effect, with 5-year disease-free survival of 69%, 66% and 67% at 60, 75 and 90
        mg/m2. Adding paclitaxel reduced the hazard of recurrence by 17% (p=0.0023) and of death by 18% (p=0.0064). Five-year
        disease-free survival was 70% with paclitaxel versus 65% without, and overall survival 80% versus 77%. In an unplanned
        analysis the recurrence hazard ratio was 0.72 in oestrogen receptor-negative and 0.91 in receptor-positive tumours.
    endpoint: Time to recurrence and overall survival.
    line: adjuvant
    modality: chemo
    n: 3121
    note: The abstract does not state a phase, but the design is a 3121-patient randomised adjuvant comparison with survival
      endpoints.
    os: Five-year overall survival was 80% with paclitaxel versus 77% without, an 18% reduction in the hazard of death (p=0.0064).
    phase: 3
    population: Women with operable breast cancer and involved axillary lymph nodes after surgical treatment.
    primary_ref: henderson2003
    pubs:
    - kind: primary
      ref: henderson2003
      role: primary
    result: Adding paclitaxel after doxorubicin and cyclophosphamide reduced the hazard of recurrence by 17% (p=0.0023), with
      5-year disease-free survival of 70% versus 65%. Escalating doxorubicin gave no benefit, with 5-year disease-free survival
      of 69%, 66% and 67% at 60, 75 and 90 mg/m2.
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 53
      group: Assay-validation cohorts / chemotherapy foundations (cross-subtype)
      section: Early nonmetastatic disease
    status: reported
    subtype: all
    topic: addition of paclitaxel after AC, adjuvant-backbone
    year: 2003
  calgb40603:
    acronym: CALGB 40603
    arms: carboplatin and bevacizumab, each added or not in a 2 x 2, to weekly paclitaxel followed by dose-dense doxorubicin
      and cyclophosphamide
    chapters:
    - BC-850
    - BC-860
    cited_by:
    - BC-860
    digest:
      methods: CALGB 40603 was a 2 x 2 factorial, open-label, randomised phase 2 trial. 443 patients with stage II to III
        triple-negative breast cancer received weekly paclitaxel 80 mg/m2 for 12 weeks followed by four cycles of doxorubicin
        plus cyclophosphamide every 2 weeks. They were randomly assigned to carboplatin AUC 6 every 3 weeks for four cycles
        and/or bevacizumab 10 mg/kg every 2 weeks for nine cycles. Endpoints were pathological complete response in breast
        and in breast and axilla.
      results: Using one-sided P values, carboplatin raised pathological complete response in the breast from 44% to 60% (P
        = .0018) and bevacizumab from 48% to 59% (P = .0089). Only carboplatin raised pathological complete response in breast
        and axilla, 54% versus 41% (P = .0029). More-than-additive interaction between the agents was not demonstrated. Patients
        given either agent less often completed treatment without dose changes. The long-term report at median 7.9 years found
        no outcome gain from either agent.
    endpoint: pathological complete response in breast and axilla
    line: neoadjuvant
    modality: chemo
    n: 443
    nct: NCT00861705
    os: no long-term benefit from carboplatin at median 7.9 years follow-up
    phase: 2
    population: stage II-III TNBC
    primary_ref: sikov2015
    pubs:
    - kind: primary
      ref: sikov2015
      role: report
    - kind: follow-up
      ref: shepherd2022
      role: long-term
    result: pCR in breast and axilla 54% with carboplatin vs 41%, P=0.0029. pCR in breast 60% vs 44%, P=0.0018
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 63
      group: Platinum
      section: Early nonmetastatic disease
    status: reported
    subtype: TNBC
    topic: neoadjuvant platinum, carboplatin and bevacizumab added to paclitaxel and dose-dense chemotherapy
    year: 2015
  calgb49907:
    acronym: CALGB 49907
    arms: capecitabine vs physician's choice of standard chemotherapy, either CMF or doxorubicin and cyclophosphamide
    chapters:
    - BC-510
    - BC-620
    - BC-850
    cited_by:
    - BC-620
    - BC-850
    claim: 10-year relapse-free survival 50% vs 56% favouring standard chemotherapy
    digest:
      methods: Patients aged 65 years or older with early breast cancer were randomly assigned to standard adjuvant chemotherapy
        or capecitabine. Standard chemotherapy was the physician's choice of cyclophosphamide, methotrexate and fluorouracil,
        or cyclophosphamide and doxorubicin. An adaptive Bayesian design determined the sample size and tested noninferiority
        of capecitabine. The primary endpoint was recurrence-free survival. This report updates the trial at a median follow-up
        of 11.4 years.
      results: The design stopped accrual with 633 patients. At 10 years, recurrence-free survival was 56% with standard chemotherapy
        and 50% with capecitabine (HR 0.80, P = .03). Breast cancer-specific survival was 88% and 82% (HR 0.62, P = .03).
        Overall survival was 62% and 56% (HR 0.84, P = .16). Standard chemotherapy remained superior in hormone receptor-negative
        patients (HR 0.66, P = .02) but not in receptor-positive patients (HR 0.89, P = .43). 43.9% of patients had died.
    endpoint: relapse-free survival, non-inferiority design
    line: adjuvant
    modality: chemo
    n: 633
    os: 10-year OS 56% vs 62%, HR 0.84, P=0.16
    phase: 3
    population: age 65 and over, early breast cancer, all subtypes
    primary_ref: muss2019
    pubs:
    - kind: primary
      ref: muss2019
      role: primary
    result: 10-year RFS 50% with capecitabine vs 56% with standard chemotherapy, HR 0.80 favouring standard, P=0.03
    setting: early
    status: reported
    subtype: all
    topic: capecitabine substituted for standard adjuvant chemotherapy in older patients
    year: 2019
  calgb9343:
    acronym: CALGB 9343
    chapters:
    - BC-420
    - BC-790
    cited_by:
    - BC-420
    claim: 10-year freedom from locoregional recurrence 98% vs 90%; OS 67% vs 66%
    digest:
      methods: Between July 1994 and February 1999, 636 women aged 70 years or older with clinical stage I (T1N0M0) estrogen
        receptor-positive breast carcinoma treated by lumpectomy were randomly assigned to tamoxifen plus radiation therapy
        (317 women) or tamoxifen alone (319 women). Primary endpoints were time to local or regional recurrence, frequency
        of mastectomy, breast cancer-specific survival, time to distant metastasis and overall survival.
      results: Median follow-up for treated patients was 12.6 years. At 10 years, 98% of women given tamoxifen plus radiation
        (95% CI 96% to 99%) were free from local and regional recurrence, compared with 90% of those given tamoxifen alone
        (95% CI 85% to 93%). Time to mastectomy, time to distant metastasis, breast cancer-specific survival and overall survival
        did not differ significantly. Ten-year overall survival was 67% (62% to 72%) with radiation and 66% (61% to 71%) without.
    line: adjuvant
    modality: radiation,endocrine
    phase: 3
    population: ER+
    primary_ref: hughes2013
    pubs:
    - kind: primary
      ref: hughes2013
      role: primary
    setting: early
    status: reported
    subtype: HR+/HER2-
    topic: radiotherapy omission with tamoxifen in women aged 70 or older
  calgb9741:
    acronym: CALGB 9741
    arms: every-2-week dose-dense chemotherapy with filgrastim vs every-3-week chemotherapy, in a 2 x 2 with sequential vs
      concurrent scheduling
    chapters:
    - BC-490
    - BC-510
    - BC-850
    cited_by:
    - BC-850
    digest:
      methods: This adjuvant trial used a 2 x 2 factorial design in women with axillary node-positive breast cancer. 2005
        patients were randomly assigned to one of four regimens. These were sequential doxorubicin, then paclitaxel, then
        cyclophosphamide, four doses each, given every 3 weeks or every 2 weeks with filgrastim, or concurrent doxorubicin
        and cyclophosphamide for four cycles followed by four cycles of paclitaxel, given every 3 weeks or every 2 weeks with
        filgrastim. The primary endpoint was disease-free survival.
      results: At a protocol-specified analysis at median follow-up of 36 months, 315 patients had relapsed or died against
        515 expected treatment failures. Dose-dense treatment improved disease-free survival (risk ratio 0.74, P = .010) and
        overall survival (risk ratio 0.69, P = .013). Four-year disease-free survival was 82% for the dose-dense regimens
        and 75% for the others. Concurrent and sequential schedules did not differ. There was no interaction between density
        and sequence. Severe neutropenia was less frequent with dose-dense treatment.
    endpoint: disease-free survival
    line: adjuvant
    modality: chemo
    n: 2005
    os: risk ratio 0.69, P=0.013
    phase: 3
    population: node-positive operable breast cancer, all subtypes
    primary_ref: citron2003
    pubs:
    - kind: primary
      ref: citron2003
      role: primary
    result: 4-year DFS 82% with dose-dense vs 75%; risk ratio 0.74, P=0.010
