        reached) with dalpiciclib plus fulvestrant versus 7.2 months (95% CI 5.6 to 9.2) with placebo plus fulvestrant, hazard
        ratio 0.42 (95% CI 0.31 to 0.58), one-sided p less than 0.0001. Grade 3 or 4 neutropenia occurred in 84.2 percent
        and leukopenia in 62.1 percent. Serious adverse events occurred in 5.8 percent versus 6.7 percent.
