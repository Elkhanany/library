  bcirg006:
    acronym: BCIRG-006
    arms: doxorubicin and cyclophosphamide then docetaxel with trastuzumab, or docetaxel and carboplatin with trastuzumab,
      vs doxorubicin and cyclophosphamide then docetaxel alone
    chapters:
    - BC-820
    - BC-830
    - BC-840
    cited_by:
    - BC-820
    digest:
      methods: 3222 women with HER2-positive early-stage breast cancer were randomly assigned to doxorubicin and cyclophosphamide
        followed by docetaxel every 3 weeks (AC-T), to the same regimen plus 52 weeks of trastuzumab, or to docetaxel and
        carboplatin plus 52 weeks of trastuzumab (TCH). The primary end point was disease-free survival. Secondary end points
        were overall survival and safety.
      results: At a median follow-up of 65 months, 656 events triggered the protocol-specified analysis. Estimated 5-year
        disease-free survival was 75% with AC-T, 84% with AC-T plus trastuzumab, and 81% with TCH. Estimated 5-year overall
        survival was 87%, 92%, and 91%. No significant differences in disease-free or overall survival were found between
        the two trastuzumab regimens. Both were superior to AC-T. Congestive heart failure and cardiac dysfunction were significantly
        more frequent with AC-T plus trastuzumab than with TCH (P<0.001).
