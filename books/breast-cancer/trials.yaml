  th3resa:
    acronym: TH3RESA
    arms: trastuzumab emtansine vs physician's choice
    chapters:
    - BC-900
    - BC-910
    cited_by:
    - BC-900
    digest:
      methods: Randomised, open-label, phase 3 trial in medical centres in 22 countries. Eligible patients were aged 18 years
        or older with progressive HER2-positive advanced breast cancer after two or more HER2-directed regimens, including
        trastuzumab and lapatinib, plus previous taxane therapy. Randomisation was 2:1 to trastuzumab emtansine 3.6 mg/kg
        intravenously every 21 days or treatment of physician's choice, stratified by world region, number of previous regimens
        and visceral disease. Coprimary endpoints were investigator-assessed progression-free survival and overall survival.
      results: 602 patients were randomly assigned, 404 to trastuzumab emtansine and 198 to physician's choice. Median progression-free
        survival was 6.2 months versus 3.3 months (stratified hazard ratio 0.528, 95% CI 0.422 to 0.661, p<0.0001). The interim
        overall survival analysis favoured trastuzumab emtansine (stratified hazard ratio 0.552, 95% CI 0.369 to 0.826, p=0.0034)
        without crossing the stopping boundary. The 2017 final overall survival report gave median 22.7 months versus 15.8
        months, hazard ratio 0.68 (95% CI 0.54 to 0.85).
    endpoint: progression-free survival and overall survival
