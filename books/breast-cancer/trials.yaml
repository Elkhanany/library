schema: 1
_note: 'Trial registry. Trials recur across many chapters, so they get stable keys of their own. A chapter writes
  {{trial:katherine}} and the build renders the acronym, links it to the registry entry, and adds the trial to appendix
  APP-A automatically. Editing a result here updates every chapter that mentions it.

  '
_key_policy: lowercase acronym. Suffix with the population when a name is reused, e.g. dare-tbcrc.
_collision_warning: 'DARE is used by at least two different studies in the breast cancer literature, a ctDNA-guided
  intervention trial and the TBCRC demographic representation project. They are keyed separately as dare-ctdna and
  dare-tbcrc. Never merge them.

  '
trials:
  abcsg12:
    acronym: ABCSG-12
    arms: goserelin plus anastrozole or tamoxifen, each with or without zoledronic acid, for 3 years
    cited_by:
    - BC-790
    claim: no advantage for anastrozole over tamoxifen when both were given with goserelin for 3 years
    endpoint: disease-free survival
    line: adjuvant
    modality: endocrine,bone
    n: 1803
    os: zoledronic acid did not significantly reduce death, HR 0.60 (0.32-1.11), p=0.11
    phase: 3
    population: premenopausal endocrine-responsive early breast cancer, all receiving goserelin, median follow-up 47.8 months
    primary_ref: gnant2009
    result: anastrozole did not improve disease-free survival over tamoxifen, HR 1.10 (0.78-1.53), p=0.59; adding zoledronic
      acid reduced disease progression, HR 0.64 (0.46-0.91), p=0.01
    setting: early
    status: reported
    subtype: HR+/HER2-,HR+/HER2+
    topic: anastrozole versus tamoxifen with goserelin, and adjuvant zoledronic acid, ovarian-suppression
    year: 2009
  abcsg16:
    acronym: ABCSG-16
    arms: anastrozole for 5 further years vs anastrozole for 2 further years
    cited_by:
    - BC-790
    claim: no benefit from a 5-year extension over a 2-year extension, with more fractures
    endpoint: disease-free survival
    line: adjuvant
    modality: endocrine
    n: 3484
    os: no significant difference
    phase: 3
    population: postmenopausal hormone receptor-positive breast cancer after 5 years of adjuvant endocrine therapy; 3208 of
      3484 entered the primary analysis set
    primary_ref: gnant2021
    result: disease-free survival HR 0.99 (0.85-1.15), p=0.90 at 8 years, with 335 events in each group; clinical fracture
      risk HR 1.35 (1.00-1.84) with the longer course
    setting: early
    status: reported
    subtype: HR+/HER2-,HR+/HER2+
    topic: five further years versus two further years of anastrozole, extended-endocrine
    year: 2021
  abcsg18:
    acronym: ABCSG-18
    cited_by:
    - BC-640
    - BC-650
    claim: time to first clinical fracture HR 0.50
    line: adjuvant
    modality: bone
    phase: 3
    population: HR+ postmenopausal on aromatase inhibitor
    primary_ref: gnant2015
    setting: early
    status: reported
    subtype: HR+/HER2-
    topic: adjuvant denosumab for fracture prevention
  abrave:
    acronym: A-BRAVE
    arms: one year of avelumab after standard treatment vs observation
    cited_by:
    - BC-850
    endpoint: disease-free survival, in the intention-to-treat and residual disease populations
    line: adjuvant,post-neoadjuvant
    modality: immunotherapy
    n: 466
    os: 3-year OS 84.8% vs 76.3%, HR 0.66 (0.45-0.97), descriptive
    phase: 3
    population: high-risk early TNBC. 383 of 466 with residual disease after neoadjuvant chemotherapy, 83 high-risk after
      primary surgery
    primary_ref: conte2025abrave
    result: DFS HR 0.81 (0.61-1.09), P=0.172. Residual disease stratum HR 0.80 (0.58-1.10), P=0.170. Neither co-primary endpoint
      met
    setting: early
    status: reported
    subtype: TNBC
    topic: adjuvant avelumab after chemotherapy, given after surgery only
    year: 2025
  acelera:
    acronym: acelERA
    arms: giredestrant vs physician's choice endocrine monotherapy
    cited_by:
    - BC-870
    endpoint: investigator-assessed progression-free survival
    line: 2L
    modality: endocrine
    n: 303
    os: not yet reported
    phase: 2
    population: progression after one or two prior systemic lines
    primary_ref: martin2024
    result: progression-free survival HR 0.81 against endocrine monotherapy, primary endpoint not met
    setting: metastatic
    status: reported
    subtype: HR+/HER2-
    topic: giredestrant against endocrine monotherapy, oral SERD
    year: 2024
  adapt-her2-hr:
    acronym: WSG-ADAPT HER2+/HR+
    arms: 12 weeks of trastuzumab emtansine, with or without endocrine therapy, vs trastuzumab plus endocrine therapy
    cited_by:
    - BC-840
    endpoint: pathological complete response
    line: neoadjuvant
    modality: adc,her2,endocrine
    n: 375
    os: not reported
    phase: 2
    population: early HER2-positive hormone receptor-positive disease; 463 screened, 375 randomised
    primary_ref: harbeck2017adapt
    result: pCR 41.0% with the conjugate, 41.5% with the conjugate plus endocrine therapy and 15.1% with trastuzumab plus
      endocrine therapy, P < 0.001; early responders reached pCR in 35.7% vs 19.8% of non-responders
    setting: early
    status: reported
    subtype: HR+/HER2+
    topic: twelve weeks of conjugate without chemotherapy, and whether adding endocrine therapy changes the response
    year: 2017
  adaptcycle:
    acronym: WSG ADAPTcycle
    arms: ribociclib plus an aromatase inhibitor, with a gonadotropin-releasing hormone agonist in premenopausal women, vs
      chemotherapy followed by endocrine therapy
    cited_by:
    - BC-800
    - BC-810
    endpoint: invasive disease-free survival
    line: adjuvant
    modality: cdk4-6,chemo
    n: 1684
    os: not yet reported
    phase: 3
    population: intermediate-risk HR-positive, HER2-negative early breast cancer selected by a 21-gene recurrence score and
      by endocrine response measured as post-endocrine Ki-67; 5292 screened and 1684 randomised at 85 German sites
    primary_ref: hamann2025
    result: not yet reported; local against central agreement for post-endocrine Ki67 at or below 10% was 80.5%, 95% CI 79.0
      to 82.1
    setting: early
    status: ongoing
    subtype: HR+/HER2-
    topic: CDK4/6 inhibition as a substitute for adjuvant chemotherapy, adjuvant-cdk46 response-guided
    year: 2025
  alienor:
    acronym: ALIENOR
    cited_by:
    - BC-390
    line: any
    modality: other
    primary_ref: blaye2026
    setting: mrd
    status: reported
    subtype: all
    topic: high-sensitivity structural-variant ctDNA after neoadjuvant therapy
  alternate:
    acronym: ALTERNATE
    arms: neoadjuvant fulvestrant, or anastrozole plus fulvestrant, vs anastrozole
    cited_by:
    - BC-810
    endpoint: endocrine-sensitive disease rate at 6 months
    line: neoadjuvant
    modality: endocrine
    n: 1362
    os: not reported
    phase: 3
    population: postmenopausal, oestrogen receptor-rich (Allred 6-8 or above 66%), clinical stage II-III; 1298 of 1362 evaluable;
      week 4 or week 12 Ki67 above 10% triggered a switch to chemotherapy or immediate surgery
    primary_ref: ma2024alternate
    result: endocrine-sensitive disease rate 22.8% with fulvestrant, 20.5% with the combination and 18.7% with anastrozole;
      neither fulvestrant-containing arm improved on anastrozole
    setting: early
    status: reported
    subtype: HR+/HER2-
    topic: neoadjuvant endocrine therapy with Ki67-directed switch to chemotherapy
    year: 2024
  altto:
    acronym: ALTTO
    arms: trastuzumab with lapatinib, or trastuzumab followed by lapatinib, or lapatinib alone, vs one year of trastuzumab
      alone
    cited_by:
    - BC-820
    endpoint: disease-free survival
    line: adjuvant
    modality: her2
    n: 8381
    os: not reported at the protocol-specified analysis
    phase: 3
    population: centrally confirmed HER2-positive early breast cancer
    primary_ref: piccart2016altto
    result: at a median 4.5 years, the combination against trastuzumab gave a disease-free survival HR of 0.84 (97.5% CI 0.70-1.02,
      p=0.048 against a 0.025 threshold); the sequence gave an HR of 0.96 (0.80-1.15)
    setting: early
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: dual blockade with lapatinib rather than pertuzumab, added to or sequenced with trastuzumab
    year: 2016
  amaros:
    acronym: AMAROS
    cited_by:
    - BC-410
    - BC-420
    line: adjuvant
    modality: surgery,radiation
    phase: 3
    setting: early
    status: reported
    subtype: all
    topic: axillary radiation versus dissection
  ameera3:
    acronym: AMEERA-3
    arms: amcenestrant vs physician's choice endocrine monotherapy
    cited_by:
    - BC-870
    endpoint: progression-free survival by independent central review
    line: 2L
    modality: endocrine
    n: 290
    os: no significant difference, HR 0.913
    phase: 2
    population: progression after up to two prior endocrine lines
    primary_ref: tolaney2023
    result: median PFS 3.6 vs 3.7 months, HR 1.05, not significant
    setting: metastatic
    status: reported
    subtype: HR+/HER2-
    topic: amcenestrant against endocrine monotherapy, oral SERD
    year: 2023
  aphinity:
    acronym: APHINITY
    arms: pertuzumab vs placebo added to adjuvant chemotherapy and one year of trastuzumab
    cited_by:
    - BC-500
    - BC-820
    - BC-840
    claim: 6-year IDFS 91% vs 88%, HR 0.76; benefit confined to node-positive disease
    endpoint: invasive disease-free survival
    line: adjuvant
    modality: her2
    n: 4805
    os: 6-year overall survival 95% vs 94%, HR 0.85, P = 0.17, not significant
    phase: 3
    population: node-positive or high-risk node-negative HER2-positive operable disease; 36% hormone receptor-negative, so
      about two thirds of the trial was triple-positive
    primary_ref: vonminckwitz2017
    result: 3-year invasive disease-free survival 94.1% against 93.2%, HR 0.81 (0.66-1.00), p=0.045; node-positive 92.0% against
      90.2%, node-negative 97.5% against 98.4%
    setting: early
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: dual blockade, adjuvant pertuzumab added to trastuzumab and chemotherapy
    year: 2017
  apt:
    acronym: APT
    arms: weekly paclitaxel with trastuzumab for 12 weeks then trastuzumab to one year, single group
    cited_by:
    - BC-500
    - BC-820
    claim: 3-year invasive disease-free survival 98.7%
    endpoint: survival free from invasive disease
    line: adjuvant
    modality: her2,chemo
    n: 406
    os: not reported at the primary analysis
    phase: 2
    population: HER2+ node-negative, tumour 3 cm or smaller
    primary_ref: tolaney2015
    result: 3-year survival free from invasive disease 98.7% (97.6-99.8) at a median 4.0 years, with 12 recurrences of which
      2 were distant
    setting: early
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: single-arm adjuvant paclitaxel and trastuzumab de-escalated
    year: 2015
