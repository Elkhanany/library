  geparsepto-gbg-69:
    acronym: GeparSepto / GBG 69
    arms: Weekly nab-paclitaxel versus weekly solvent-based paclitaxel, each followed by epirubicin plus cyclophosphamide.
    chapters:
    - BC-810
    - BC-830
    - BC-860
    digest:
      methods: Phase 3 randomised trial in patients with previously untreated primary invasive breast cancer, assigned 1:1
        with minimisation by subtype, Ki67 and SPARC expression. Patients received nab-paclitaxel 150 mg/m2, later amended
        to 125 mg/m2, or solvent-based paclitaxel 80 mg/m2 on days 1, 8 and 15 for four 3-week cycles, followed by epirubicin
        plus cyclophosphamide for four cycles. Patients with HER2-positive tumours also received trastuzumab and pertuzumab.
        The primary endpoint was pathological complete response.
      results: 1229 women were randomly assigned and 1206 started treatment. The nab-paclitaxel dose was reduced to 125 mg/m2
        after 464 participants because of discontinuation and neuropathy. Pathological complete response occurred in 233 patients
        (38%) given nab-paclitaxel versus 174 (29%) given solvent-based paclitaxel, odds ratio 1.53, 95% CI 1.20 to 1.95,
        p=0.00065. Grade 3-4 sensory neuropathy occurred in 10% versus 3% and grade 3-4 anaemia in 2% versus 1%. Four deaths
        occurred on treatment.
    endpoint: Pathological complete response, defined as ypT0 ypN0.
    line: neoadjuvant
    modality: chemo
    n: 1229
    nct: NCT01583426
