    digest:
      methods: Randomised, placebo-controlled phase 3 trial in 668 postmenopausal women with HR-positive, HER2-negative recurrent
        or metastatic breast cancer and no previous systemic therapy for advanced disease. Patients received ribociclib 600
        mg per day on a 3-weeks-on, 1-week-off schedule plus letrozole 2.5 mg per day, or placebo plus letrozole. The primary
        end point was investigator-assessed progression-free survival. Secondary end points included overall survival, overall
