  swog-s0500:
    acronym: SWOG S0500
    chapters:
    - BC-390
    - BC-870
    - BC-970
    cited_by:
    - BC-390
    claim: switching on persistent CTCs did not improve survival
    digest:
      methods: Patients with metastatic breast cancer starting first-line chemotherapy were grouped by circulating tumour
        cell count, increased meaning five or more cells per 7.5 mL of whole blood. Those without increased counts at baseline
        stayed on initial therapy (arm A). Those whose counts fell by day 21 also stayed on it (arm B). Those with persistently
        increased counts were randomly assigned to continue initial therapy (arm C1) or change to alternative chemotherapy
        (arm C2). The primary outcome was overall survival.
      results: Of 595 eligible and evaluable patients, 276 (46%) had no increased counts (arm A). Of those with increased
        counts, 31 (10%) were not retested, 165 went to arm B and 123 were randomly assigned to arm C1 or C2. Median overall
        survival was 10.7 months in arm C1 versus 12.5 months in arm C2 (P = .98), and 35, 23 and 13 months in arms A, B and
        C (P < .001).
