      role: update
    - kind: survival
      ref: corts2024
      role: long-term survival
    - kind: subgroup
      ref: hurvitz2024
      role: bm subgroup
    result: progression-free survival at 12 months 75.8% against 34.1% with trastuzumab emtansine, hazard ratio 0.28. The
