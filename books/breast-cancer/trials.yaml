      group: CDK4/6 combinations
      section: Metastatic disease
    status: reported
    subtype: HR+/HER2+
    topic: abemaciclib + trastuzumab ± fulvestrant
    year: 2020
  muther:
    acronym: MutHER
    arms: Single arm within each cohort, neratinib plus fulvestrant in the two oestrogen receptor-positive cohorts and neratinib
      monotherapy in the oestrogen receptor-negative cohort.
    chapters:
    - BC-590
    - BC-900
    claim: clinical benefit 38% with neratinib and fulvestrant in HER2-mutated, non-amplified MBC
    digest:
      methods: Single-arm, multi-cohort phase 2 trial of neratinib in HER2-mutated, HER2 non-amplified metastatic breast cancer,
        on the premise that HER2 mutations induce endocrine resistance in oestrogen receptor-positive breast cancer. Patients
        with oestrogen receptor-positive, HER2-mutated disease received neratinib plus fulvestrant in one of two cohorts,
        a fulvestrant-treated cohort of 24 patients and a fulvestrant-naive cohort of 11. Patients with oestrogen receptor-negative,
        HER2-mutated disease received neratinib monotherapy in an exploratory cohort of 5. Clinical benefit rate was the efficacy
        measure reported for each cohort. Trastuzumab was added at progression in a small number of patients, and tumours
        were assessed for acquired HER2 mutations at progression.
      results: Clinical benefit rate was 38% (95% CI 18% to 62%) in the fulvestrant-treated cohort, 30% (7% to 65%) in the
        fulvestrant-naive cohort and 25% (1% to 81%) in the oestrogen receptor-negative cohort. Adding trastuzumab at progression
        in 5 patients produced three partial responses and one stable disease lasting 24 weeks or more. Clinical benefit appeared
        positively associated with lobular histology and negatively associated with HER2 L755 alterations. Acquired HER2 mutations
        were detected in 5 of 23 patients at progression. The authors concluded that neratinib and fulvestrant are active
        in oestrogen receptor-positive, HER2-mutated metastatic breast cancer and that the data support further evaluation
        of dual HER2 blockade.
    endpoint: Clinical benefit rate in each cohort.
    line: any
    modality: her2,endocrine
    n: 40
    note: Selection was by an activating HER2 mutation in HER2 non-amplified disease, not by HER2 amplification or overexpression,
      so the trial does not belong in tables of HER2-positive disease defined by IHC or ISH. The subtype tag covers the two
      oestrogen receptor-positive cohorts; the exploratory oestrogen receptor-negative cohort of 5 patients is broader than
      that tag. n is omitted because the abstract gives the three cohort sizes but no total enrolment, and the registry does
      not carry a computed figure. The line tag is any because the abstract states no requirement for a number of previous
      lines and the cohorts are defined by previous fulvestrant exposure rather than by line. The abstract does not label
      a primary endpoint; clinical benefit rate is the efficacy measure the report leads with, and all three confidence intervals
      are very wide because each cohort is small.
    os: not reported; clinical benefit rate in each cohort was the endpoint
    phase: '2'
    population: Patients with HER2-mutated, HER2 non-amplified metastatic breast cancer, entered by oestrogen receptor status
      and previous fulvestrant exposure into a fulvestrant-treated cohort of 24, a fulvestrant-naive cohort of 11 and an exploratory
      oestrogen receptor-negative cohort of 5.
    primary_ref: ma2022
    pubs:
    - kind: primary
      ref: ma2022
      role: primary
    result: Clinical benefit rate was 38% (95% CI 18 to 62) in the fulvestrant-treated cohort, 30% (95% CI 7 to 65) in the
      fulvestrant-naive cohort and 25% (95% CI 1 to 81) in the oestrogen receptor-negative cohort.
    setting: metastatic
    source:
    - ch: 68
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
    status: reported
    subtype: HR+/HER2-
    topic: neratinib with fulvestrant for activating HER2 mutations in HER2 non-amplified disease, HER2-mutant
    weight: exploratory
    year: 2022
  na-pher2:
    acronym: NA-PHER2
    arms: single arm; six cycles of trastuzumab and pertuzumab with palbociclib and five cycles of fulvestrant, with no control
      group
    chapters:
    - BC-840
    claim: Ki67 fell from 31.9 to 4.3 at 2 weeks with chemotherapy-free triple blockade, pCR 27%
    digest:
      methods: NA-PHER2 is a multicohort, open-label, exploratory phase 2 study done at seven sites in Italy. Patients were
        eligible for the first cohort if they had previously untreated, histologically confirmed, unilateral, invasive, HER2-positive,
        ER-positive breast cancer and were suitable for neoadjuvant therapy. They were treated every 3 weeks with intravenous
        trastuzumab and pertuzumab for six cycles plus oral palbociclib 125 mg once a day for 21 days in a 4-week cycle and
        intramuscular fulvestrant 500 mg every 4 weeks for five cycles. The coprimary endpoints were change from baseline
        in Ki67 expression at 2 weeks and at surgery 16 weeks after starting treatment, and change in apoptosis from baseline
        to surgery. Secondary endpoints were clinical objective response by modified RECIST and pathological complete response.
        Cohort B gave dual HER2 blockade and palbociclib without fulvestrant, and cohort C enrolled tumours with Ki67 above
        20% and HER2 immunohistochemistry 1+ or 2+ without gene amplification and added fulvestrant.
      results: 36 patients were enrolled in the first cohort, of whom one was ineligible and five were HER2-negative on retrospective
        analysis, leaving 35 in safety analyses and 30 assessed for the primary and secondary endpoints. Geometric mean Ki67
        was 31.9 at baseline versus 4.3 at week 2 (n=25, p<0.0001) and 12.1 at surgery (n=22, p=0.013), and geometric mean
        apoptosis was 1.2 at baseline versus 0.4 at surgery (p=0.019). A clinical objective response immediately before surgery
        was achieved by 29 of 30 patients (97%, 95% CI 83 to 100), and 8 (27%, 95% CI 12 to 46) had a pathological complete
        response in breast and axillary nodes. The most frequent grade 3 adverse events were neutropenia in ten patients (29%)
        and diarrhoea in five (14%), with no grade 4 or serious adverse events and no deaths. In cohort B, without fulvestrant,
        the mean Ki67 change was -25.7 at week 2 and -9.5 at surgery, with objective response in 88.5% and pCR in 19.2%; in
        cohort C the mean Ki67 change was -29.5 at week 2 and -19.3 at surgery, with objective response in 78.3%. The biomarker
        analysis found that high immune infiltration and low ER signalling correlated with pCR while TP53 mutations were associated
        with high day 14 Ki67.
    endpoint: coprimary, the change from baseline in Ki67 expression at 2 weeks and at surgery 16 weeks after starting treatment,
      and the change in apoptosis from baseline to surgery
    line: neoadjuvant
    modality: her2,cdk4-6,endocrine
    n: 36
    nct: NCT02530424
    note: NA-PHER2 is an exploratory multicohort study with no control group. The n, endpoint and result here are the first
      cohort as reported in gianni2018a; the abstracts do not state how many patients were enrolled in cohorts B and C, so
      no combined enrolment figure is given. The coprimary endpoints are Ki67 and apoptosis change, not pathological complete
      response, which was secondary. Cohort C enrolled tumours with HER2 immunohistochemistry 1+ or 2+ without gene amplification,
      that is HER2-low disease, and must be kept separate from the HER2-positive cohorts; cohort B omitted fulvestrant. gianni2022
      reports cohorts B and C and callari2025 the biomarker secondary objective; neither reports the first-cohort primary
      endpoint.
    phase: 2
    population: previously untreated, histologically confirmed, unilateral, invasive, HER2-positive, ER-positive breast cancer
      suitable for neoadjuvant therapy in the first cohort; later cohorts added dual HER2 blockade with palbociclib without
      fulvestrant, and tumours with Ki67 above 20% and HER2 immunohistochemistry 1+ or 2+ without gene amplification
    primary_ref: gianni2018a
    pubs:
    - kind: primary
      ref: gianni2018a
      role: primary
    - kind: update
      ref: gianni2022
      role: secondary
    - kind: biomarker
      ref: callari2025
      role: correlative
    result: In the first cohort geometric mean Ki67 was 31.9 at baseline versus 4.3 at week 2 (n=25, p<0.0001) and 12.1 at
      surgery (n=22, p=0.013), and geometric mean apoptosis was 1.2 at baseline versus 0.4 at surgery (p=0.019). Pathological
      complete response in breast and axillary nodes, a secondary endpoint, occurred in 8 of 30 patients (27%, 95% CI 12 to
      46).
    setting: early
    source:
    - ch: 60
      section: Additional studies — Early HER2+/HR+HER2+
    - ch: 59
      section: Additional studies — Early HER2+/HR+HER2+
      xref: true
    status: reported
    subtype: HR+/HER2+,HER2-low
    topic: chemotherapy-free triple blockade of ER, HER2 and the cell cycle, read out by early proliferation change
    weight: exploratory
    year: 2018
  nala:
    acronym: NALA
    arms: neratinib plus capecitabine vs lapatinib plus capecitabine
    chapters:
    - BC-900
    cited_by:
    - BC-900
    digest:
      methods: Randomised, active-controlled phase 3 trial in patients with centrally confirmed HER2-positive metastatic breast
        cancer who had received two or more previous HER2-directed regimens. Patients with stable asymptomatic CNS disease
        were eligible. Assignment was one to one to neratinib 240 mg daily plus capecitabine 750 mg/m2 twice daily on 14 of
        21 days with loperamide prophylaxis, or to lapatinib 1250 mg daily plus capecitabine 1000 mg/m2 twice daily. Coprimary
        end points were centrally confirmed progression-free survival and overall survival.
      results: 621 patients from 28 countries were assigned, 307 to neratinib plus capecitabine and 314 to lapatinib plus
        capecitabine. Centrally reviewed progression-free survival favoured neratinib (hazard ratio 0.76; 95% CI 0.63 to 0.93).
        The overall survival hazard ratio was 0.88 (95% CI 0.72 to 1.07). Cumulative incidence of intervention for CNS disease
        was 22.8% versus 29.2%. Objective response rates were 32.8% versus 26.7%. Median duration of response was 8.5 versus
        5.6 months. Diarrhea occurred in 83% versus 66%.
    endpoint: progression-free survival and overall survival
    line: 3L+
    modality: her2,chemo
    n: 621
    nct: NCT01808573
    os: HR 0.88 (0.72-1.07), not significant
    phase: 3
    population: HER2+ metastatic disease after two or more HER2-directed regimens, stable CNS disease allowed
    primary_ref: saura2020nala
    pubs:
    - kind: primary
      ref: saura2020nala
      role: primary
    - kind: subgroup
      ref: hurvitz2021
      role: cns subgroup
    result: PFS HR 0.76 (0.63-0.93); ORR 32.8% vs 26.7%; fewer CNS interventions, 22.8% vs 29.2%
    reviewed: '2026-09-14'
