  ispy2:
    acronym: I-SPY 2
    arms: an investigational agent added to weekly paclitaxel then doxorubicin and cyclophosphamide vs the same chemotherapy
      as a shared control
    chapters:
    - BC-540
    - BC-740
    - BC-810
    - BC-830
    - BC-860
    cited_by:
    - BC-540
    - BC-740
    - BC-860
    digest:
      methods: Multicenter platform trial of women with operable clinical stage 2 or 3 breast cancer, no prior surgery or
        systemic therapy, and primary tumours 2.5 cm or larger. Participants were adaptively randomised within molecular subtypes
        to one of several investigational regimens or control therapy from March 2010 through 2016. Treatment was taxane with
        or without an investigational agent or combination, followed by doxorubicin and cyclophosphamide. Measures were pathologic
        complete response and 3-year event-free and distant recurrence-free survival.
      results: Of 950 participants with median age 49 years, 330 (34.7%) achieved pathologic complete response. Three-year
        event-free survival and distant recurrence-free survival for those patients were both 95%. Hazard ratios for pathologic
        complete response versus no pathologic complete response were 0.19 for event-free survival (95% CI 0.12-0.31) and
        0.21 for distant recurrence-free survival (0.13-0.34). These were similar across molecular subtypes, ranging from
        0.14 to 0.18 for event-free survival and 0.10 to 0.20 for distant recurrence-free survival.
    endpoint: pathological complete response, with event-free survival by response
    line: neoadjuvant
    modality: chemo,other
    n: 950
    nct: NCT01042379
    os: not reported
    phase: 2
    population: stage 2-3 disease, adaptively randomised within molecular signatures; 950 patients across nine investigational
      combinations in the pooled response analysis
    primary_ref: yee2020
    pubs:
