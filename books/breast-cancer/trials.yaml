    digest:
      methods: Patients with inoperable HER2-positive locally recurrent or metastatic breast cancer and no prior systemic
        therapy for advanced disease, except endocrine therapy, received docetaxel, paclitaxel or nab-paclitaxel with trastuzumab
        and pertuzumab until progression or unacceptable toxicity. The primary endpoint was safety. Secondary endpoints included
        progression-free survival and overall survival. Prespecified subgroups were defined by taxane, hormone receptor status
        and prior trastuzumab. Exploratory analyses identified prognostic factors used to define risk subgroups.
