    digest:
      methods: 'Multicentre single-arm phase II study in treatment-naive adults with centrally confirmed HER2-positive, node-negative
        early breast cancer and tumours of 5-30 mm on MRI. Patients received eight cycles of neoadjuvant trastuzumab plus
        pertuzumab every 3 weeks, with endocrine therapy if hormone receptor-positive. After surgery 10 adjuvant cycles followed
        the pathological response: trastuzumab plus pertuzumab for pathological complete response, T-DM1 for residual disease,
        and optional chemotherapy then T-DM1 for ypN1-3. Co-primary endpoints were 1-year quality-of-life decline and 3-year
