  intrathecal-trastuzumab-kumthekar-phase-:
    acronym: Intrathecal trastuzumab, Kumthekar phase I/II
    arms: Single arm of intrathecal trastuzumab, escalated to 80 mg twice weekly.
    chapters:
    - BC-930
    digest:
      methods: This multicentre combined phase I/II study enrolled 34 patients with HER2-positive leptomeningeal disease to
        determine the maximum tolerated dose of intrathecal trastuzumab and its efficacy. Any HER2-positive histology was
        allowed in phase I, while phase II was limited to HER2-positive breast cancer. Cerebrospinal fluid pharmacokinetics
        were sampled during treatment.
      results: Intrathecal trastuzumab was well tolerated, with one dose-limiting toxicity of grade 4 arachnoiditis at 80
        mg twice weekly, the dose taken forward as the recommended phase II dose. Among 26 patients evaluated at 80 mg, 5
        (19.2%) had a partial response, 13 (50.0%) stable disease and 8 (30.8%) progressive disease. Median overall survival
        was 8.3 months at the phase II dose and 10.5 months in phase II breast cancer patients. Cerebrospinal fluid concentrations
        stayed stable with repeated dosing.
    endpoint: Maximum tolerated dose of intrathecal trastuzumab and its efficacy in HER2-positive leptomeningeal disease.
    modality: her2
    n: 34
    note: The phase I portion admitted any HER2-positive histology rather than breast cancer alone, and the recommended dose
      here, 80 mg twice weekly, differs from the 150 mg weekly dose of the French intrathecal trastuzumab studies.
    os: Median overall survival was 8.3 months (95% CI 5.2 to 19.6) in patients treated at the phase II dose, and 10.5 months
      (95% CI 5.2 to 20.9) in the phase II HER2-positive breast cancer patients.
    phase: 1/2
    population: Patients with leptomeningeal metastases from HER2-positive cancer of any histology in phase I, restricted
      to HER2-positive breast cancer in phase II.
    primary_ref: kumthekar2023
    pubs:
    - kind: primary
      ref: kumthekar2023
      role: primary
    result: One dose-limiting toxicity of grade 4 arachnoiditis occurred at 80 mg twice weekly, which became the recommended
      phase II dose. Among 26 patients treated at that dose, 5 (19.2%) had a partial response, 13 (50.0%) stable disease and
      8 (30.8%) progressive disease.
