  begonia:
    acronym: BEGONIA arms 7 and 8
    arms: Single arm in each cohort, datopotamab deruxtecan 6 mg/kg intravenously plus durvalumab 1120 mg intravenously every
      3 weeks, with no control arm.
    chapters:
    - BC-920
    claim: First-line Dato-DXd plus durvalumab, confirmed response 79.0%, median PFS 14.0 months
    digest:
      methods: Phase Ib/II, Simon's two-stage, open-label platform study of durvalumab combined with novel therapies as first-line
        treatment for unresectable locally advanced or metastatic triple-negative breast cancer. Arms 7 and 8 assessed datopotamab
        deruxtecan, a TROP2-directed antibody-drug conjugate, with durvalumab. Arm 7 included patients regardless of tumour
        PD-L1 expression level; arm 8 then enrolled patients with PD-L1-high tumours, determined by local immunohistochemistry-based
        testing. Patients in both arms received datopotamab deruxtecan 6 mg/kg intravenously plus durvalumab 1120 mg intravenously
        every 3 weeks. The primary endpoints were safety and tolerability and investigator-assessed confirmed objective response
        rate; secondary endpoints included confirmed objective response rate in part 1, duration of response, progression-free
        survival by RECIST 1.1 and overall survival.
      results: 62 patients in arm 7 and 33 patients in arm 8 had received datopotamab deruxtecan and durvalumab. At the data
        cutoff of 29 November 2024, median study follow-up was 35.0 months in arm 7 and 10.7 months in arm 8. In arm 7 the
        confirmed objective response rate was 79.0% (95% CI 66.8 to 88.3), median duration of response was 17.6 months (95%
        CI 10.5 to 27.3), median progression-free survival was 14.0 months (11.0 to 21.1) and median overall survival was
        not reached. In arm 8 the confirmed objective response rate was 81.8% (95% CI 64.5 to 93.0), and median duration of
        response and median progression-free survival were immature given the short median follow-up, 8.3 months in censored
        patients. The safety profile of the combination was manageable with no new safety signals versus prior studies.
    endpoint: Safety and tolerability, and investigator-assessed confirmed objective response rate.
    line: 1L
    modality: adc,immunotherapy
    nct: NCT03742102
    note: The record covers arms 7 and 8 of the BEGONIA platform only, and the key is suffixed so that the other arms of the
      platform can be registered separately. Both are single-arm cohorts of a non-randomized study, so they do not isolate
      what durvalumab adds to datopotamab deruxtecan and they do not validate other combinations of an antibody-drug conjugate
      with immunotherapy. The two cohorts differ in selection rather than treatment, arm 7 taking all comers and arm 8 only
      PD-L1-high tumours, so the response rates are not a comparison. No n is given because the publication reports 62 patients
      in arm 7 and 33 in arm 8 and states no combined total. Arm 8 is early, with median follow-up of 10.7 months and immature
      duration of response and progression-free survival.
    os: Median overall survival was not reached in arm 7. No overall survival figure is reported for arm 8.
    phase: 1/2
    population: Patients with unresectable locally advanced or metastatic triple-negative breast cancer receiving first-line
      treatment; arm 7 enrolled regardless of tumour PD-L1 expression level and arm 8 then enrolled patients with PD-L1-high
      tumours by local immunohistochemistry-based testing.
    primary_ref: schmid2026
    pubs:
    - kind: primary
      ref: schmid2026
      role: primary
    result: In arm 7 the confirmed objective response rate was 79.0% (95% CI 66.8 to 88.3), median duration of response 17.6
      months (95% CI 10.5 to 27.3) and median progression-free survival 14.0 months (11.0 to 21.1). In arm 8 the confirmed
      objective response rate was 81.8% (95% CI 64.5 to 93.0), with duration of response and progression-free survival still
      immature.
    setting: metastatic
    source:
    - ch: 75
      section: Additional studies — Metastatic TNBC / rare histology
    status: reported
    subtype: TNBC
    topic: TROP2 antibody-drug conjugate with PD-L1 blockade in the first line, unselected and PD-L1-high cohorts
    weight: exploratory
    year: 2026
  bellini:
    acronym: BELLINI
    arms: Single arm within each of three sequential cohorts, 4 weeks of anti-PD-1 nivolumab in cohort A, 4 weeks of nivolumab
      plus anti-CTLA-4 ipilimumab in cohort B, and 6 weeks of nivolumab plus ipilimumab followed by surgery in cohort C.
    chapters:
    - BC-860
    claim: Chemotherapy-free nivolumab plus ipilimumab gave pCR in 5 of 15 TIL-high early TNBC
    digest:
      methods: Adaptive phase 2 trial asking whether short checkpoint inhibition without chemotherapy induces immune activation
        in early-stage triple-negative breast cancer, and so whether neoadjuvant immunotherapy without chemotherapy is worth
        pursuing. The primary endpoint in the window-of-opportunity cohorts was immune activation, defined as a twofold increase
        in CD8 T cells or IFNG. Cohort A received 4 weeks of anti-PD-1 nivolumab and cohort B 4 weeks of nivolumab plus anti-CTLA-4
        ipilimumab. On the strength of those data, cohort C was opened for patients with tumour-infiltrating lymphocytes of
        50% or more, who received 6 weeks of nivolumab plus ipilimumab followed by surgery, with pathological complete response
        as the primary endpoint. Single-cell RNA sequencing was used to look for correlates of response, and each cohort followed
        a Simon two-stage design.
      results: Immune activation was observed in 53%, 8 of 15, of cohort A and 60%, 9 of 15, of cohort B. High levels of tumour-infiltrating
        lymphocytes correlated with response, as did higher pretreatment tumour-reactive CD8 T cells, follicular helper T
        cells and shorter distances between tumour and CD8 T cells, while higher levels of regulatory T cells after treatment
        were associated with non-response. In cohort C, 53%, 8 of 15, had a major pathological response with under 10% viable
        tumour at resection and 33%, 5 of 15, had a pathological complete response. All cohorts met the Simon two-stage threshold
        for expansion to stage II. Grade 3 or higher adverse events occurred in 17% of patients and immune-mediated endocrinopathies
        were frequent, at 57%. The authors conclude that neoadjuvant immunotherapy without chemotherapy shows potential efficacy
        and warrants further investigation in early triple-negative breast cancer.
    endpoint: Immune activation, defined as a twofold increase in CD8 T cells or IFNG, in the window-of-opportunity cohorts
      A and B, and pathological complete response in cohort C.
    line: neoadjuvant
    modality: immunotherapy
    nct: NCT03815890
    note: The abstract gives a denominator of 15 for each cohort but no total enrolment, so no participant count is recorded.
      The cohorts answer different questions. A and B are window-of-opportunity cohorts whose endpoint is immune activation,
      a laboratory readout rather than a clinical outcome, and only cohort C, restricted to tumours with tumour-infiltrating
      lymphocytes of 50% or more, took patients to surgery with pathological complete response as its endpoint. Grade 3 or
      higher adverse events occurred in 17% of patients and immune-mediated endocrinopathies in 57%, a high price in early
      disease. Small selected cohorts and that toxicity mean the trial does not establish that chemotherapy can be omitted.
    os: not reported. The window-of-opportunity cohorts read out on immune activation and the surgical cohort on pathological
      complete response
    phase: '2'
    population: Patients with early-stage triple-negative breast cancer; cohort C additionally required tumour-infiltrating
      lymphocytes of 50% or more.
    primary_ref: nederlof2024
    pubs:
    - kind: primary
      ref: nederlof2024
      role: primary
    result: Immune activation occurred in 53%, 8 of 15, of cohort A and 60%, 9 of 15, of cohort B, and all cohorts met the
      Simon two-stage threshold for expansion to stage II. In the TIL-high cohort C, 53%, 8 of 15, had a major pathological
      response with under 10% viable tumour and 33%, 5 of 15, a pathological complete response.
    setting: early
    source:
    - ch: 63
      section: Additional studies — Early TNBC / hereditary HER2−
    status: reported
    subtype: TNBC
    topic: chemotherapy-free neoadjuvant checkpoint blockade in early TNBC, including a TIL-high cohort
    weight: exploratory
    year: 2024
  big1-98:
