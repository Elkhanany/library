  pearly:
    acronym: PEARLY
    arms: doxorubicin and cyclophosphamide followed by taxane plus carboplatin vs doxorubicin and cyclophosphamide followed
      by taxane
    chapters:
    - BC-850
    - BC-860
    cited_by:
    - BC-850
    - BC-860
    digest:
      methods: Multicenter, randomized, phase III trial in patients with stage II or III triple-negative breast cancer, treated
        in the neoadjuvant or adjuvant setting. Patients received either doxorubicin and cyclophosphamide followed by a taxane,
        or doxorubicin and cyclophosphamide followed by a taxane with carboplatin added. The primary endpoint was event-free
        survival. Secondary endpoints included overall survival, invasive disease-free survival, distant recurrence-free survival,
        pathologic complete response rate and safety.
      results: Between January 2016 and June 2020, 868 patients were randomly assigned. At a median follow-up of 57.2 months,
        carboplatin improved event-free survival (hazard ratio 0.67, 95% CI 0.49 to 0.92, P = 0.012). The 5-year event-free
        survival rate rose from 75.1% to 82.3%, an absolute difference of 7.2%. Overall survival, invasive disease-free survival
        and distant recurrence-free survival trended in favour of carboplatin without reaching significance. Grade 3 or higher
        treatment-related adverse events were 74.7% versus 56.7%.
    endpoint: event-free survival
    line: neoadjuvant,adjuvant
    modality: chemo
    n: 868
    os: favoured carboplatin, not statistically significant
    phase: 3
    population: stage II-III TNBC treated in either the neoadjuvant or the adjuvant setting
    primary_ref: kim2026pearly
    pubs:
    - kind: primary
      ref: kim2026pearly
      role: primary
    result: 5-year EFS 82.3% with carboplatin vs 75.1%; HR 0.67 (0.49-0.92), P=0.012
