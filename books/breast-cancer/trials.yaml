  ample:
    acronym: AMPLE
    arms: Indwelling pleural catheter versus talc pleurodesis, minimised by mesothelioma and by trapped lung.
    chapters:
    - BC-600
    digest:
      methods: Open-label randomised clinical trial recruiting 146 patients with symptomatic malignant pleural effusion and
        no previous indwelling catheter or pleurodesis from nine centres in Australia, New Zealand, Singapore and Hong Kong
        between July 2012 and October 2014, followed for 12 months. Randomisation was 1:1, minimised by malignancy type and
        trapped lung and stratified by region. The primary endpoint was total days in hospital from the procedure to death
        or to 12 months.
      results: The catheter arm spent fewer days in hospital, median 10 days against 12, P = .03, with a Hodges-Lehmann difference
        of 2.92 days. Effusion-related hospital days were 1 against 4, P < .001. Further ipsilateral invasive pleural drainage
        was needed by 4.1% against 22.5%, difference 18.4% (95% CI 7.7% to 29.2%). Improvements in breathlessness and quality
        of life did not differ. Adverse events occurred in 22 catheter patients and 13 pleurodesis patients.
    endpoint: Total days spent in hospital from the procedure to death or to 12 months.
    modality: supportive
    n: 146
    note: Mesothelioma was a minimisation variable, so the population is not breast-cancer specific. The endpoint is health-service
      use rather than symptom relief, which is why it separates the arms where TIME2 did not. The publication states no phase.
    population: Patients with symptomatic malignant pleural effusion and no previous catheter or pleurodesis, at nine centres
      in Australia, New Zealand, Singapore and Hong Kong.
    primary_ref: thomas2017
    pubs:
    - kind: primary
      ref: thomas2017
      role: primary
    result: Median total hospital stay was 10 days with a catheter against 12 with pleurodesis, P = .03. Effusion-related
      days were 1 against 4, P < .001. Further ipsilateral pleural drainage was needed in 4.1% against 22.5%. Breathlessness
      and quality of life did not differ.
