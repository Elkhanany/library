        fulvestrant plus placebo and 249 to exemestane. Median progression-free survival was 4.4, 4.8 and 3.4 months. Hazard
        ratios were 1.00 (95% CI 0.83-1.21, p = 0.98) for the two fulvestrant arms and 0.95 (0.79-1.14, p = 0.56) for fulvestrant
        plus placebo versus exemestane. 87 serious adverse events were reported and grade 3-4 events were rare.
