  intrathecal-trastuzumab-bonneau-phase-i:
    acronym: Intrathecal trastuzumab, Bonneau phase I
    arms: Single arm of intrathecal trastuzumab given weekly at 30, 60, 100 or 150 mg.
    chapters:
    - BC-930
    digest:
      methods: This multicentre phase I dose-escalation study gave intrathecal trastuzumab once weekly for at least 4 weeks
        at dose levels of 30, 60, 100 and 150 mg to patients with meningeal carcinomatosis from HER2-positive breast cancer.
        The maximum tolerated dose was defined by achieving an intra-cerebrospinal fluid trastuzumab concentration close to
        a conventional therapeutic plasma concentration of 30 mg/L and by dose-limiting toxicity. Cerebrospinal fluid was
        sampled before each injection for pharmacokinetics. Sixteen patients were treated.
      results: No dose-limiting toxicity was observed. Eleven patients had no toxicity attributed to intrathecal trastuzumab.
        At 60 mg and above, minor attributed toxicities were headache in 2 patients, nausea in 2, vomiting in 1, cervical
        pain in 1 and peripheral neuropathy in 1. Two patients had immediate headache or vomiting. Mean residual cerebrospinal
        fluid trastuzumab concentration at the 150 mg level was 27.9 mg/L. Three patients had a clinical response, seven had
        stable disease and four had progressive disease.
    endpoint: Maximum tolerated dose of intrathecal trastuzumab, defined by cerebrospinal fluid concentration near 30 mg/L
      and by dose-limiting toxicity.
    modality: her2
    n: 16
    nct: NCT01373710
    note: The abstract does not state how many prior systemic lines patients had received, so no treatment line is assigned.
    os: Overall survival was not reported in this publication.
    phase: 1
    population: Patients with leptomeningeal carcinomatosis from HER2-positive breast cancer.
    primary_ref: bonneau2018
    pubs:
    - kind: primary
      ref: bonneau2018
      role: primary
    result: No dose-limiting toxicity was seen at any level, and the maximum tolerated and recommended phase II dose was 150
      mg weekly.
