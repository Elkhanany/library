  tbcrc-001:
    acronym: TBCRC 001
    arms: Cetuximab alone with weekly carboplatin added after progression, versus cetuximab plus carboplatin given together
      from the beginning.
    chapters:
    - BC-920
    claim: response rate under 20% with cetuximab plus carboplatin in metastatic TNBC
    digest:
      methods: Randomised phase II study in metastatic triple-negative breast cancer. Patients received the anti-EGFR antibody
        cetuximab, 400 mg/m2 loading then 250 mg/m2 per week intravenously, either alone with weekly carboplatin at an area
        under the curve of 2 added after progression, or with carboplatin as concomitant therapy from the beginning. Response
        rate was the primary endpoint; others were time to progression, overall survival and toxicity. Embedded correlative
        studies included molecular subtyping on archival tissue. Fresh tumour tissue taken before and after 7 to 14 days of
        therapy was used for microarray analyses exploring EGFR pathway activity and inhibition.
      results: 102 patients with triple-negative breast cancer were treated. Response rates were 6%, two of 31, to cetuximab
        alone and 16%, four of 25, to cetuximab plus carboplatin after progression, while the response rate to cetuximab plus
        carboplatin from the beginning was 17%, 12 of 71, and 31% of patients responded or had prolonged disease stabilisation.
        The combination was well tolerated, but time to progression and overall survival were short at 2.1 months (95% CI
        1.8 to 5.5 months) and 10.4 months (95% CI 7.7 to 13.1 months). Of 73 patients with archival tissue, 74% had basal-like
        molecular subtype. Among 16 patients biopsied before and one week after therapy, genomic patterns of the EGFR pathway
        showed activation in 13 and inhibition by therapy in five.
    endpoint: Response rate.
    modality: chemo,other
    n: 102
    note: 'The design crosses over by protocol: patients assigned cetuximab alone had carboplatin added at progression, so
      the 102 patients contribute to more than one response group and the response rates are not a clean randomised comparison.
      The abstract reports that 31% of patients responded or had prolonged disease stabilisation without saying which group
      that figure covers, so it is recorded as the abstract states it and not as a figure for the concomitant group. The abstract
      does not state how many prior lines of therapy patients had received, so no treatment line is assigned. The modality
      tag other denotes EGFR antibody blockade. Molecular subtyping and the paired-biopsy microarray work were embedded correlative
      studies, and they are the basis for the conclusion that cetuximab blocked EGFR pathway expression in only a minority.'
    os: Overall survival on cetuximab plus carboplatin was short at 10.4 months (95% CI 7.7 to 13.1 months).
    phase: 2
    population: Patients with stage IV triple-negative breast cancer, with archival tissue for molecular subtyping and, in
      a subset, paired fresh tumour biopsies for pathway analysis.
    primary_ref: carey2012
    pubs:
    - kind: primary
      ref: carey2012
      role: primary
    result: Response rate was 6% (two of 31) to cetuximab alone and 16% (four of 25) to cetuximab plus carboplatin after progression,
      and 17% (12 of 71) in patients given cetuximab plus carboplatin from the beginning; 31% of patients responded or had
      prolonged disease stabilisation. Time to progression on cetuximab plus carboplatin was short at 2.1 months (95% CI 1.8
      to 5.5 months).
    setting: metastatic
    source:
    - ch: 75
      section: Additional studies — Metastatic TNBC / rare histology
    status: reported
    subtype: TNBC
    topic: EGFR blockade with cetuximab added to carboplatin in metastatic triple-negative disease
    weight: supporting
    year: 2012
  tbcrc-003:
    acronym: TBCRC 003
    arms: Single arm of lapatinib plus trastuzumab without chemotherapy, given in both cohorts.
    chapters:
    - BC-570
    - BC-900
    claim: chemotherapy-free lapatinib and trastuzumab, ORR 50.0% in cohort 1 and 22.2% in cohort 2
    digest:
      methods: Phase II study of lapatinib plus trastuzumab in HER2-positive metastatic breast cancer, testing the chemotherapy-free
        combination earlier than the heavily pretreated setting in which it had been shown to improve outcomes over lapatinib
        alone. Two cohorts were enrolled, the first with no prior trastuzumab for metastatic disease and at least a year from
        adjuvant trastuzumab if given, the second with one to two lines of chemotherapy including trastuzumab for metastatic
        disease and/or recurrence less than a year from adjuvant trastuzumab. The primary end point was objective response
        rate by RECIST v1.0. Secondary end points included clinical benefit rate, defined as complete plus partial response
        plus stable disease of at least 24 weeks, and progression-free survival. Fluorodeoxyglucose positron emission tomography
        scans were acquired at baseline, week 1 and week 8, and associations between metabolic response and clinical outcomes
        were explored.
      results: Eighty-seven patients were registered and 85 were evaluable for efficacy. The confirmed objective response
        rate was 50.0% (95% CI, 33.8% to 66.2%) in cohort 1 and 22.2% (95% CI, 11.3% to 37.3%) in cohort 2. Clinical benefit
        rate was 57.5% (95% CI, 40.9% to 73.0%) in cohort 1 and 40.0% (95% CI, 25.7% to 55.7%) in cohort 2. Median progression-free
        survival was 7.4 months in cohort 1 and 5.3 months in cohort 2. Lack of a week-1 FDG-PET/CT response was associated
        with failure to achieve an objective response by RECIST, with a negative predictive value of 91% (95% CI, 74% to 100%)
        in cohort 1 and 91% (95% CI, 79% to 100%) in cohort 2.
    endpoint: Objective response rate by RECIST v1.0.
    line: 1L,2L,3L+
    modality: her2
    n: 87
    note: Single-arm study with two line-defined cohorts and no comparator, so the two response rates are cohort estimates
      and not a comparison. Eighty-seven patients were registered and 85 were evaluable for efficacy; n records the number
      registered. Cohort 1 was untreated for metastatic disease and cohort 2 had one to two prior lines, so line is recorded
      as 1L,2L,3L+. The abstract gives no overall survival and no trial registration number, so both fields are left out.
    os: Not reported. The publication gives objective response rate, clinical benefit rate and progression-free survival by
      cohort only.
    phase: '2'
    population: Patients with HER2-positive metastatic breast cancer enrolled into two cohorts, one with no prior trastuzumab
      for metastatic disease and at least a year from adjuvant trastuzumab if given, the other with one to two lines of chemotherapy
      including trastuzumab for metastatic disease or recurrence less than a year from adjuvant trastuzumab.
    primary_ref: lin2015
    pubs:
    - kind: primary
      ref: lin2015
      role: primary
    result: The confirmed objective response rate was 50.0% (95% CI, 33.8% to 66.2%) in cohort 1 and 22.2% (95% CI, 11.3%
      to 37.3%) in cohort 2. There was no control arm for comparison.
    reviewed: '2026-09-16'
    setting: metastatic
    source:
    - ch: 72
      section: Additional studies — Metastatic HER2+ / HR+HER2+
    status: reported
    subtype: HER2+
    topic: chemotherapy-free dual HER2 blockade with early FDG-PET response prediction
    weight: exploratory
    year: 2015
  tbcrc-009:
    acronym: TBCRC 009
    arms: Single arm of cisplatin 75 mg/m2 or carboplatin at an area under the concentration-time curve of 6 every three weeks,
      with the agent chosen by the physician rather than randomised.
    chapters:
    - BC-920
    claim: 'single-agent platinum: 25.6% response in metastatic TNBC, 54.5% with germline BRCA1/2'
    digest:
      methods: Single-arm multicentre phase II trial of single-agent platinum in metastatic triple-negative breast cancer
        with biomarker correlates. Patients received first- or second-line cisplatin 75 mg/m2 or carboplatin at an area under
        the concentration-time curve of 6 once every three weeks, by physician choice. The coprimary endpoints were objective
        response rate and response prediction by p63/p73 gene expression. Secondary and exploratory endpoints included toxicity,
        response rate with cisplatin versus carboplatin, and response rate in molecularly defined subgroups including germline
        BRCA1/2 mutation carriers.
      results: 86 patients were treated, 69 of them as first-line therapy, 43 with cisplatin and 43 with carboplatin. The
        response rate was 25.6% (95% CI 16.8% to 36%), numerically higher with cisplatin at 32.6% than with carboplatin at
        18.7%, and 54.5% in the 11 germline BRCA1/2 carriers. Among the 66 patients without BRCA1/2 mutations, an exploratory
        BRCA-like genomic instability signature discriminated responding from non-responding tumours, with mean HRD-LOH/HRD-LST
        scores of 12.68 and 5.11, whereas the predefined analyses by p63/p73 expression, p53 and PIK3CA mutation status and
        PAM50 subtype did not. Five of the six long-term responders alive at a median of 4.5 years lacked germline BRCA1/2
        mutations, and two of those had raised HRD scores. The authors conclude that platinum agents are active, especially
        in germline carriers, and that prospective controlled confirmatory trials are warranted.
    endpoint: Coprimary objective response rate and prediction of response by p63/p73 gene expression.
    line: 1L,2L
    modality: chemo
    n: 86
    note: Cisplatin versus carboplatin was chosen by the treating physician and not randomised, so the difference between
      the two agents is not a controlled comparison. Eligibility allowed platinum as first- or second-line therapy, so the
      trial is not a first-line study alone. The line is tagged 1L,2L, and 69 of the 86 patients were treated in the first
      line. Germline BRCA1/2 status was not an eligibility criterion; the carriers were a subgroup of 11. One of the two coprimary
      endpoints, response prediction by p63/p73 expression, was negative, and the BRCA-like genomic instability analyses that
      did discriminate responders were exploratory.
    phase: 2
    population: Patients with metastatic triple-negative breast cancer receiving platinum as first- or second-line therapy.
    primary_ref: isakoff2015
    pubs:
    - kind: primary
      ref: isakoff2015
      role: primary
    result: 'The objective response rate was 25.6% (95% CI 16.8% to 36%), numerically higher with cisplatin at 32.6% than
      with carboplatin at 18.7%, and 54.5% in the 11 patients with germline BRCA1/2 mutations. The other coprimary endpoint
      was negative: the predefined p63/p73 expression analysis did not discriminate responding from non-responding tumours.'
    setting: metastatic
    source:
    - ch: 75
      section: Additional studies — Metastatic TNBC / rare histology
    status: reported
    subtype: TNBC
    topic: platinum monotherapy and the biomarkers that might predict platinum sensitivity in metastatic triple-negative disease
    weight: exploratory
    year: 2015
  tbcrc-011:
    acronym: TBCRC 011
    arms: Single arm of bicalutamide 150 mg daily.
    chapters:
    - BC-580
    - BC-880
    - BC-920
    claim: six-month clinical benefit 19% with bicalutamide in AR-positive, ER/PgR-negative disease
    digest:
      methods: Multicentre phase II study of the androgen receptor antagonist bicalutamide. Tumours from patients with oestrogen
        and progesterone receptor-negative advanced breast cancer were tested centrally for androgen receptor by immunohistochemistry,
        with more than 10% nuclear staining counted as positive. Patients were eligible if either the primary tumour or a
        metastatic site was positive, and received bicalutamide 150 mg daily. The primary endpoint was clinical benefit rate,
        the total number of patients with a complete response, a partial response or stable disease beyond six months; secondary
        endpoints were progression-free survival and toxicity. Correlative studies measured circulating endocrine markers
        and immunohistochemical surrogates for basal-like breast cancer.
      results: Of 424 patients with oestrogen and progesterone receptor-negative breast cancer screened, 12% tested androgen
        receptor-positive. The six-month clinical benefit rate with bicalutamide was 19% (95% CI 7% to 39%). Median progression-free
        survival was 12 weeks (95% CI 11 to 22 weeks). Bicalutamide was well tolerated, with no grade 4 or 5 treatment-related
        adverse events. The authors read the result as proof of principle for minimally toxic androgen blockade in a selected
        group of patients.
    endpoint: Clinical benefit rate, defined as complete response, partial response or stable disease beyond six months.
    line: any
    modality: endocrine
    n: 28
    note: Eligibility was oestrogen and progesterone receptor-negative, androgen receptor-positive disease; HER2-positive
      disease was eligible if trastuzumab had been given, and the full text says only that the majority of patients had HER2-normal
      cancers, so the subtype tag is HER2+,TNBC and the population should not be read as modern triple-negative disease. The
      abstract reports that 424 patients were screened and 12% were androgen receptor-positive. The full text gives 28 patients
      treated, 26 of them evaluable for the primary endpoint. The full text sets no limit on prior therapy and reports a median
      of 1 (0 to 8) prior lines of chemotherapy for metastatic disease, so the line is any. The modality tag endocrine denotes
      androgen receptor antagonism rather than oestrogen-directed therapy.
    os: Not reported. Overall survival was not an endpoint of this single-arm study.
    phase: 2
    population: Patients with oestrogen and progesterone receptor-negative advanced breast cancer whose primary tumour or
      a metastatic site was androgen receptor-positive on central immunohistochemistry, defined as more than 10% nuclear staining.
    primary_ref: gucalp2013
    pubs:
    - kind: primary
      ref: gucalp2013
      role: primary
    result: The six-month clinical benefit rate was 19% (95% CI 7% to 39%) and median progression-free survival was 12 weeks
      (95% CI 11 to 22 weeks). There was no comparator arm.
    reviewed: '2026-09-16'
    setting: metastatic
    source:
    - ch: 75
      section: Additional studies — Metastatic TNBC / rare histology
    status: reported
    subtype: HER2+,TNBC
    topic: androgen receptor blockade in hormone receptor-negative, androgen receptor-positive advanced disease
    weight: exploratory
    year: 2013
  tbcrc-019:
    acronym: TBCRC 019
    arms: Nab-paclitaxel weekly for three weeks of each 28-day cycle with tigatuzumab every other week, versus nab-paclitaxel
      alone, randomised 2:1.
    chapters:
    - BC-920
    claim: adding tigatuzumab to nab-paclitaxel did not raise response, ORR 28% versus 38%
    digest:
      methods: Randomised 2:1 phase II trial of nab-paclitaxel with or without tigatuzumab, an agonistic anti-DR5 antibody
        that triggers apoptosis in DR5-positive tumour cells without crosslinking, in patients with metastatic triple-negative
        breast cancer stratified by prior chemotherapy. Patients received nab-paclitaxel weekly for three weeks, with or without
        tigatuzumab every other week, in 28-day cycles. The primary objective was the within-arm objective response rate.
        Secondary objectives were safety, progression-free survival, clinical benefit and tigatuzumab immunogenicity. Metastatic
        research biopsies were required.
      results: Of 64 patients, 60 were treated, 39 with tigatuzumab plus nab-paclitaxel and 21 with nab-paclitaxel alone.
        The combination arm had three complete remissions, eight partial remissions, 11 stable diseases and 17 progressive
        diseases, an objective response rate of 28%; the nab-paclitaxel arm had no complete remissions, eight partial remissions,
        four stable diseases and nine progressive diseases, a response rate of 38%. Complete remissions were numerically more
        frequent with tigatuzumab and several patients in that arm had prolonged progression-free survival. Grade 3 toxicity
        occurred in 28% and 29% of the two arms with no grade 4 or 5 events. An exploratory analysis suggested an association
        between ROCK1 gene pathway activation and efficacy in the combination arm.
    endpoint: Within-arm objective response rate.
    line: any
    modality: chemo,other
    n: 64
    note: The primary objective was the response rate within each arm, not a comparison between them, and randomisation was
      2:1 with 39 patients treated in the combination arm and 21 in the control arm, so the higher response rate on nab-paclitaxel
      alone is not evidence that tigatuzumab did harm. 64 patients were enrolled and 60 treated. Prior chemotherapy was a
      stratification factor rather than a restriction, so patients entered at varying treatment lines and the line is tagged
      any. The modality tag other denotes the anti-DR5 antibody, and the ROCK1 pathway association was exploratory.
    phase: 2
    population: Patients with metastatic triple-negative breast cancer, stratified by prior chemotherapy, in whom metastatic
      research biopsies were required.
    primary_ref: forerotorres2015
    pubs:
    - kind: primary
      ref: forerotorres2015
      role: primary
    result: The objective response rate was 28% in the tigatuzumab plus nab-paclitaxel arm, with three complete and eight
      partial remissions among 39 patients, and 38% in the nab-paclitaxel arm, with eight partial remissions among 21 patients.
      Response rate and progression-free survival were similar in both arms.
    setting: metastatic
    source:
    - ch: 75
      section: Additional studies — Metastatic TNBC / rare histology
    status: reported
    subtype: TNBC
    topic: death receptor 5 agonism added to taxane chemotherapy in metastatic triple-negative disease
    weight: supporting
    year: 2015
  tbcrc-022:
    acronym: TBCRC 022
    arms: Neratinib plus ado-trastuzumab emtansine in three single-arm cohorts, with no control arm.
    chapters:
    - BC-930
    digest:
      methods: 'Multicenter phase 2 study, cohort 4. Patients with measurable HER2 positive breast cancer brain metastases
        received neratinib 160 mg daily plus ado-trastuzumab emtansine 3.6 mg/kg intravenously every 21 days in three parallel
        enrolling cohorts: 4A with previously untreated brain metastases, 4B progressing after local central nervous system
        therapy without prior T-DM1, and 4C with prior T-DM1. Diarrhoea prophylaxis was required in cycle 1. The primary endpoint
        was central nervous system response by RANO-BM in each cohort.'
      results: Between 2018 and 2021, 6, 17 and 21 patients enrolled in cohorts 4A, 4B and 4C, and enrolment stopped early
        for slow accrual. Central nervous system objective response rates were 33.3, 35.3 and 28.6 percent. Between 38.1 and
        50 percent had response or stable disease for at least six months. Grade 3 diarrhoea occurred in 22.7 percent. Median
        overall survival was 30.2, 23.3 and 20.9 months.
    endpoint: Central nervous system objective response rate by RANO-BM, reported separately for each cohort.
    line: 3L+
    modality: her2,adc
    n: 44
    note: The result given is cohort 4 of TBCRC 022, neratinib plus T-DM1, and not the earlier neratinib plus capecitabine
      cohorts that the registry topic also names.
    os: Median overall survival was 30.2 months in cohort 4A, 23.3 months in cohort 4B and 20.9 months in cohort 4C.
    phase: 2
    population: Patients with measurable HER2 positive breast cancer brain metastases, either previously untreated or progressing
      after local central nervous system therapy.
    primary_ref: freedman2024
    pubs:
    - kind: primary
      ref: freedman2016
      role: neratinib alone, cohorts 1-3
    - kind: primary
      ref: freedman2019
      role: neratinib plus capecitabine, cohorts 3A and 3B
    - kind: primary
      ref: freedman2024
      role: primary
    - kind: follow-up
      ref: grinda2026
      role: patient-reported outcomes, cohort 4
    result: The central nervous system objective response rate was 33.3 percent in cohort 4A, 35.3 percent in cohort 4B and
      28.6 percent in cohort 4C. There was no comparator arm.
    reviewed: '2026-09-14'
    setting: cns
    source:
    - group: HER2 positive brain metastases and other kinase inhibitors
      section: Brain and leptomeningeal metastases
    status: reported
    subtype: HER2+
    topic: neratinib alone, then with capecitabine, then with T-DM1 in HER2-positive brain metastases, intracranial-response
    year: 2024
  tbcrc-023:
    acronym: TBCRC 023
    arms: 12 versus 24 weeks of lapatinib and trastuzumab without chemotherapy, randomised 1 to 2, with letrozole and ovarian
      suppression if premenopausal added for oestrogen receptor-positive tumours
    chapters:
    - BC-830
    - BC-840
    claim: in-breast pCR 28% with 24 weeks vs 12% with 12 weeks of chemotherapy-free HER2 blockade
    digest:
      methods: TBCRC023 is a randomized phase II trial combining a Simon phase II design in the experimental arm with a pick-the-winner
        design, and it was not powered for direct comparison. Women with HER2-positive breast tumours measuring 2 cm or more
        were randomised in a 1 to 2 ratio to 12 versus 24 weeks of lapatinib and trastuzumab without chemotherapy. Letrozole,
        along with ovarian suppression if premenopausal, was administered to patients whose tumours were also oestrogen receptor-positive.
        All evaluable patients were assessed for in-breast pathological complete response. The trial followed earlier neoadjuvant
        studies in which 12 weeks of dual anti-HER2 therapy without chemotherapy produced a meaningful pCR rate.
      results: Ninety-seven patients were enrolled, 33 in the 12-week arm and 64 in the 24-week arm, of whom 94 were evaluable.
        Median age was 51 years and 55% were postmenopausal; median tumour size was 5 cm and 65% were oestrogen receptor-positive.
        The rate of pCR in the 24-week arm was 28% and numerically superior to the 12-week arm at 12%. This was driven by
        increased pCR in the oestrogen receptor-positive subgroup, 33% versus 9%. Study treatment was well tolerated, with
        grade 1-2 diarrhoea and acneiform rash the most common toxicities.
    endpoint: in-breast pathological complete response in all evaluable patients
    line: neoadjuvant
    modality: her2,endocrine
    n: 97
    nct: NCT00999804
    note: The design combined a Simon phase II design in the experimental arm with a pick-the-winner design and was explicitly
      not powered for a direct comparison of the two durations, so the gap between 28% and 12% is a numerical difference and
      no significance test is reported. The trial has no chemotherapy comparator and no survival endpoint, so nothing here
      supports equivalence to chemotherapy. Entry required HER2-positive disease of any hormone receptor status and 65% were
      oestrogen receptor-positive, which is why the record carries both HER2+ and HR+/HER2+; the duration effect was confined
      to the oestrogen receptor-positive subgroup, which is the reason the trial is read alongside the triple-positive chapter.
    os: Overall survival was not an endpoint and no overall survival result is reported in the primary publication.
    phase: 2
    population: women with HER2-positive breast tumours measuring 2 cm or more, median tumour size 5 cm, median age 51 years,
      55% postmenopausal and 65% oestrogen receptor-positive
    primary_ref: rimawi2019
    pubs:
    - kind: primary
      ref: rimawi2019
      role: primary
    result: Among the 94 evaluable patients the rate of in-breast pathological complete response was 28% in the 24-week arm
      and numerically superior to the 12% seen in the 12-week arm. This was driven by increased pCR in the oestrogen receptor-positive
      subgroup, 33% versus 9%.
    reviewed: '2026-09-16'
    setting: early
    source:
    - ch: 59
      section: Additional studies — Early HER2+/HR+HER2+
    - ch: 60
      section: Additional studies — Early HER2+/HR+HER2+
      xref: true
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: duration of chemotherapy-free dual HER2 blockade, 12 versus 24 weeks
    weight: supporting
    year: 2019
  tbcrc-026:
    acronym: TBCRC026
    arms: single arm of four cycles of neoadjuvant pertuzumab and trastuzumab without chemotherapy, with FDG PET-CT at baseline
      and on day 15 of cycle 1
    chapters:
    - BC-830
    claim: early SULmax change predicted pCR but missed the prespecified AUC threshold
    digest:
      methods: Multicentre phase II trial. Patients with stage II or III, oestrogen receptor-negative, HER2-positive breast
        cancer received four cycles of neoadjuvant pertuzumab and trastuzumab. FDG PET-CT was performed at baseline and 15
        days after the start of treatment (C1D15). Eighty evaluable patients were required to test the null hypothesis that
        the area under the curve of percent change in SULmax by C1D15 predicting pathological complete response is 0.65 or
        less, with a one-sided type I error rate of 10%. A later analysis fitted logistic regressions combining the imaging
        biomarkers with tissue HER2 biomarkers, using the C statistic to assess prediction power and Youden's index to set
        the composite cut-off.
      results: Eighty-eight women were enrolled and 83 were evaluable; 85%, 75 of 88, completed all four cycles. Pathological
        complete response after pertuzumab and trastuzumab alone was 22%. The area under the curve for percent change in SULmax
        by C1D15 was 0.72 (80% CI 0.64 to 0.80; one-sided P = .12), which did not reject the null hypothesis. Early metabolic
        change still separated the groups, with a median percent reduction in SULmax by C1D15 of 63.8% in patients obtaining
        pathological complete response against 41.8% in those who did not (P = .004), and a SULmax reduction of 40% or more
        more prevalent, 83% against 52% (P = .03), giving a positive predictive value of 31% and a negative predictive value
        of 91%. In the later composite analysis the strongest single predictors were C1D15 SULmax (OR 0.43, P = 0.007, c =
        0.77), percent reduction in SULmax (OR 1.03, P = 0.006, c = 0.72) and tumour HER2 protein abundance (OR 1.75, P =
        0.01, c = 0.76), and combining the two imaging measures with their interaction term raised the c statistic to 0.89,
        which adding tumour HER2 protein did not improve further.
    endpoint: the area under the receiver operating characteristic curve for percent change in SULmax by cycle 1 day 15 predicting
      pathological complete response, tested against a null hypothesis that the area under the curve is 0.65 or less, with
      a one-sided type I error rate of 10%
    line: neoadjuvant
    modality: her2,other
    n: 88
    note: The primary objective was not met, so the row records a negative primary endpoint alongside a real predictive signal;
      participants failing to reach a 40% SULmax reduction were unlikely to obtain pathological complete response. Eighty-eight
      women were enrolled and 83 were evaluable, so the response and biomarker figures rest on the smaller evaluable set.
      The result is taken from the 2021 primary report; the 2025 Hennessy publication is a correlative composite-biomarker
      analysis of the same 83 patients and reports no trial endpoint of its own. Entry required oestrogen receptor-negative
      disease, so the record says nothing about triple-positive tumours. Neither abstract states an NCT number, so none is
      recorded.
    phase: 2
    population: stage II or III, oestrogen receptor-negative, HER2-positive breast cancer; 88 women enrolled and 83 evaluable
    primary_ref: connolly2021a
    pubs:
    - kind: primary
      ref: connolly2021a
      role: primary
    - kind: biomarker
      ref: hennessy2025
      role: correlative
    result: the area under the curve for percent change in SULmax by cycle 1 day 15 was 0.72 (80% CI 0.64 to 0.80; one-sided
      P = .12), which did not reject the null hypothesis, so the primary objective was not met. Pathological complete response
      after pertuzumab and trastuzumab alone was 22%
    setting: early
    source:
    - ch: 59
      section: Additional studies — Early HER2+/HR+HER2+
    status: reported
    subtype: HER2+
    topic: early FDG-PET metabolic change as a predictor of pathological complete response to chemotherapy-free dual HER2
      blockade
    weight: exploratory
    year: 2021
  tbcrc-030:
    acronym: TBCRC 030
    arms: Twelve weeks of preoperative single-agent cisplatin versus single-agent paclitaxel, with crossover to an alternative
      provider-selected chemotherapy offered for inadequate clinical response.
    chapters:
    - BC-850
    - BC-860
    claim: HRD score did not predict pathological response to cisplatin or paclitaxel in TNBC
    digest:
      methods: Prospective randomised phase 2 study. Patients with germline BRCA1/2 wild-type or unknown stage I to III triple-negative
        breast cancer entered a 12-week randomised comparison of preoperative cisplatin or paclitaxel. The homologous recombination
        deficiency assay (Myriad Genetics) was carried out on baseline tissue and a score of 33 or above was defined as positive.
        Crossover to an alternative provider-selected chemotherapy was offered when clinical response was inadequate. The
        primary objective was to detect an association of homologous recombination deficiency with pathological response,
        defined as residual cancer burden 0 or 1.
      results: 139 patients were evaluable for response, 88 (63.3%) having surgery at 12 weeks and 51 (36.7%) crossing over
        to an alternative preoperative regimen for inadequate clinical response. Homologous recombination deficiency results
        were available for 104 tumours (74.8%), of which 74 (71.1%) were positive. Residual cancer burden 0 or 1 was 26.4%
        with cisplatin and 22.3% with paclitaxel. Odds ratios for residual cancer burden 0 or 1 if homologous recombination
        deficiency positive were 2.22 (95% CI 0.39 to 23.68) for cisplatin and 0.90 (95% CI 0.19 to 4.95) for paclitaxel,
        with no evidence of an interaction between homologous recombination deficiency and pathological response. The authors
        conclude that homologous recombination deficiency was not predictive and that tumours were similarly responsive to
        preoperative paclitaxel or cisplatin.
    endpoint: Association of the homologous recombination deficiency score, positive at 33 or above, with pathological response
      defined as residual cancer burden 0 or 1 after single-agent cisplatin or paclitaxel.
    line: neoadjuvant
    modality: chemo
    n: 139
    note: A biomarker trial, not a powered head-to-head efficacy comparison. The randomisation exists to test the predictive
      claim, so the 26.4% versus 22.3% difference should not be read as a comparison of cisplatin against paclitaxel. Entry
      was restricted to germline BRCA1/2 wild-type or unknown status, so known carriers were excluded while patients whose
      germline status was never tested remained eligible; the record is tagged TNBC and not BRCA for that reason. n is the
      number evaluable for response; the abstract gives no enrolled total, 36.7% of patients crossed over to a different preoperative
      regimen before surgery, and homologous recombination deficiency status was obtainable in only 104 of the 139. No NCT
      identifier appears in the abstract, so none is recorded.
    os: not reported. The trial read out at surgery on residual cancer burden and the primary publication reports no survival
      endpoint
    phase: '2'
    population: Patients with germline BRCA1/2 wild-type or unknown stage I to III triple-negative breast cancer.
    primary_ref: mayer2020
    pubs:
    - kind: primary
      ref: mayer2020
      role: primary
    result: Residual cancer burden 0 or 1 was 26.4% with cisplatin and 22.3% with paclitaxel. No significant association was
      observed between homologous recombination deficiency score and response to cisplatin, odds ratio for residual cancer
      burden 0 or 1 if homologous recombination deficiency positive 2.22 (95% CI 0.39 to 23.68), or to paclitaxel, odds ratio
      0.90 (95% CI 0.19 to 4.95), and there was no evidence of an interaction.
    setting: early
    source:
    - ch: 63
      section: Additional studies — Early TNBC / hereditary HER2−
    status: reported
    subtype: TNBC
    topic: homologous recombination deficiency as a predictor of platinum benefit in BRCA-wild-type triple-negative disease
    weight: supporting
    year: 2020
  tbcrc-032:
    acronym: TBCRC 032
    arms: Phase Ib gave enzalutamide 160 mg with taselisib to find dose-limiting toxicities and the maximum tolerated dose;
      phase II randomised patients to enzalutamide alone or enzalutamide plus taselisib 4 mg until disease progression.
    chapters:
    - BC-580
    - BC-880
    - BC-920
    claim: 16-week clinical benefit 35.7% with enzalutamide plus taselisib in AR-positive TNBC
    digest:
      methods: Investigator-initiated multi-institutional phase Ib/II study of the androgen receptor antagonist enzalutamide
        alone or with the PI3K inhibitor taselisib, in metastatic breast cancer with androgen receptor expression of at least
        10%. Phase Ib enrolled oestrogen receptor-positive or triple-negative patients, who received enzalutamide 160 mg in
        combination with taselisib to determine dose-limiting toxicities and the maximum tolerated dose. Phase II randomised
        triple-negative patients to enzalutamide alone or in combination with taselisib 4 mg until disease progression. The
        primary endpoint was clinical benefit rate at 16 weeks. Genomic analyses of tumour subtype, fusions and androgen receptor
        splice variants were correlative.
      results: The combination was tolerated and the maximum tolerated dose was not reached, with hyperglycaemia and skin
        rash as the adverse events. The clinical benefit rate for evaluable patients receiving the combination was 35.7% and
        median progression-free survival was 3.4 months. Patients with luminal androgen receptor subtype tumours trended towards
        better response than non-luminal patients, 75.0% versus 12.5% at a p value of 0.06, and towards longer progression-free
        survival, 4.6 versus 2.0 months at a p value of 0.082. Genomic analyses revealed subtype-specific treatment response
        and novel fusions and androgen receptor splice variants. The authors conclude that androgen receptor protein expression
        alone is insufficient to identify patients with androgen receptor-dependent tumours, and that knowledge of the luminal
        androgen receptor subtype and of splice variants may identify who is more or less likely to benefit.
    endpoint: Clinical benefit rate at 16 weeks.
    line: any
    modality: endocrine,pi3k-akt
    n: 30
    note: Phase Ib admitted oestrogen receptor-positive as well as triple-negative patients, so the enrolled population is
      broader than the TNBC tag suggests; phase 1/2 stands for phase Ib/II. The abstract reports no total enrolment, so the
      count of 30 comes from the full text, 13 patients in phase Ib and 17 randomised in phase II. The abstract gives no clinical
      benefit rate for the enzalutamide-alone arm, and the full text says only that all five patients on it had progressed
      by 16 weeks, so the record carries the combination figure and not a randomised comparison. The luminal androgen receptor
      subgroup analyses were exploratory and reported as trends on small numbers. The modality tag endocrine denotes androgen
      receptor antagonism. The supplied abstract text has characters dropped around the AR-positive superscripts and before
      the p values 0.06 and 0.082.
    os: Not reported. Overall survival was not an endpoint of this study, which closed early.
    phase: 1/2
    population: Patients with metastatic androgen receptor-positive breast cancer, defined as at least 10% expression, with
      the phase Ib part open to oestrogen receptor-positive as well as triple-negative disease and the randomised phase II
      part restricted to triple-negative disease.
    primary_ref: lehmann2019
    pubs:
    - kind: primary
      ref: lehmann2019
      role: primary
    result: The clinical benefit rate among evaluable patients receiving the combination was 35.7% and median progression-free
      survival was 3.4 months. The abstract gives no clinical benefit rate for the enzalutamide-alone arm, so the record carries
      no comparison.
    reviewed: '2026-09-16'
    setting: metastatic
    source:
    - ch: 75
      section: Additional studies — Metastatic TNBC / rare histology
    status: reported
    subtype: TNBC
    topic: androgen receptor antagonism with and without PI3K inhibition in androgen receptor-positive triple-negative disease
    weight: exploratory
    year: 2019
