    arms: zoledronic acid 4 mg intravenously added to standard therapy, six doses then at reducing frequency to five years,
      vs standard therapy alone
    chapters:
    - BC-640
    digest:
      methods: Academic international open-label phase 3 trial. 3360 patients with stage II or III breast cancer were randomly
        assigned 1:1 to standard adjuvant systemic therapy with or without intravenous zoledronic acid 4 mg every 3 to 4 weeks
        for six doses and then at reducing frequency to complete five years. Follow-up ran to ten years. Subgroup analyses
