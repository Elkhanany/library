  dart-metaplastic:
    acronym: DART / SWOG S1609 cohort 36
    arms: Single arm of ipilimumab 1 mg/kg intravenously every 6 weeks plus nivolumab 240 mg intravenously every 2 weeks.
    chapters:
    - BC-590
    - BC-920
    claim: ORR 18% in metaplastic breast cancer, all three responses ongoing past 2 years
    digest:
      methods: Prospective, open-label, multicenter phase 2 trial with a two-stage design, run as cohort 36 of the DART /
        SWOG S1609 basket study of dual anti-CTLA-4 and anti-PD-1 blockade in rare tumours. Patients with advanced metaplastic
        breast cancer received ipilimumab 1 mg/kg intravenously every 6 weeks plus nivolumab 240 mg intravenously every 2
        weeks. The primary endpoint was objective response rate. Secondary endpoints included progression-free survival, overall
        survival and toxicity.
      results: 17 evaluable patients enrolled, median age 60 years (range 26 to 85), with a median of 2 prior lines of therapy
        (range 0 to 5). The objective response rate was 18%, 3 of 17 patients achieving an objective response, 1 complete
        and 2 partial, in 2 spindle cell and 1 chondromyxoid tumour, all ongoing at 28+, 33+ and 34+ months. Median progression-free
        survival was 2 months and median overall survival 12 months. 11 patients (65%) had adverse events including one grade
        5 event, and 8 (47%) had an immune-related adverse event, with adrenal insufficiency in all 3 responders. Responses
        occurred in tumours with low tumour mutational burden, low PD-L1 and absent tumour-infiltrating lymphocytes.
    endpoint: Objective response rate.
    line: any
    modality: immunotherapy
    n: 17
    nct: NCT02834013
    note: This is one cohort of a rare-tumour basket study rather than a stand-alone trial, and the key is suffixed with the
      population so that other DART cohorts can be registered separately. Eligibility turned on metaplastic histology rather
      than receptor status, and the publication describes the majority of tumours as triple-negative without restricting entry
      to them, so the subtype axis is all rather than TNBC even though the record is cross-referenced from metastatic triple-negative
      disease. Prior therapy ranged from none to five lines, so no single treatment line is assigned. The result is carried
      by a subset, three exceptional and still ongoing responses against no activity in the rest, in 17 patients, and all
      three responders developed adrenal insufficiency. A single-arm cohort of this size is a signal in a rare histology and
      should not be read across to unselected triple-negative disease.
    os: Median overall survival was 12 months.
    phase: '2'
    population: Patients with unresectable or metastatic metaplastic breast cancer, median age 60 years and a median of 2
      prior lines of therapy, range none to five.
    primary_ref: adams2021
    pubs:
    - kind: primary
      ref: adams2021
      role: primary
    result: The objective response rate was 18%, 3 of 17 patients, with 1 complete and 2 partial responses, which met the
      primary endpoint; the three responses were ongoing at 28+, 33+ and 34+ months. Median progression-free survival was
      2 months.
    setting: metastatic
    source:
