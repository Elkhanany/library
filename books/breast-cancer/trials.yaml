  tbcrc-039:
    acronym: TBCRC 039
    arms: A 7-day run-in of ruxolitinib alone or ruxolitinib plus paclitaxel, then 12 weeks of neoadjuvant ruxolitinib plus
      paclitaxel or paclitaxel alone, with all patients receiving four cycles of doxorubicin plus cyclophosphamide before
      surgery.
    chapters:
    - BC-860
    claim: Ruxolitinib lowered pSTAT3 in triple-negative inflammatory breast cancer but pCR was 8.7%
    digest:
      methods: Randomised phase 2 study with a nested window of opportunity in triple-negative inflammatory breast cancer.
        Treatment-naive patients received a 7-day run-in of ruxolitinib alone or ruxolitinib plus paclitaxel. Those who received
        ruxolitinib alone then proceeded to neoadjuvant therapy with either ruxolitinib plus paclitaxel or paclitaxel alone
        for 12 weeks, while those who had received ruxolitinib plus paclitaxel continued that treatment for 12 weeks. All
        patients subsequently received four cycles of doxorubicin plus cyclophosphamide before surgery. Research tumour biopsies
        at baseline and after the run-in were evaluated for phosphorylated STAT3 by immunostaining, with a subset analysed
        by RNA sequencing; the primary endpoint was the percent of phosphorylated STAT3-positive pre-run-in tumours that became
        negative, and pathological complete response was a secondary endpoint.
      results: 23 patients were enrolled, of whom 21 completed preoperative therapy. Two patients achieved pathological complete
        response (8.7%). Phosphorylated STAT3 and IL-6/JAK/STAT3 signalling decreased in post-run-in biopsies of ruxolitinib-treated
        samples, while sustained ruxolitinib plus paclitaxel upregulated IL-6/JAK/STAT3 signalling compared with ruxolitinib
        alone. Both treatments decreased GZMB T cells, implying immune suppression, and ruxolitinib alone inhibited JAK/STAT3
        signalling effectively while its combination with paclitaxel gave incomplete inhibition. The authors conclude that
        ruxolitinib was associated with a decrease in phosphorylated STAT3 despite a lack of clinical benefit, and that cancer
        cell-specific targeting of JAK2/STAT3 or combination with immunotherapy may be required.
    endpoint: The percent of tumours positive for phosphorylated STAT3 before the run-in that became phosphorylated STAT3
      negative after it.
    line: neoadjuvant
    modality: other,chemo
    n: 23
    nct: NCT02876302
    note: The primary endpoint is pharmacodynamic, the proportion of phosphorylated STAT3-positive tumours converting to negative,
      and the abstract gives no percentage for it, so the tabulated result carries the secondary pathological complete response
      figure and says as much. Only 23 patients were enrolled and 21 completed preoperative therapy, so the 8.7% rests on
      two events. Entry required triple-negative inflammatory breast cancer, a rare population that should stay identifiable
      and should not be pooled with general early TNBC. The window-of-opportunity run-in sits inside the randomisation rather
      than before it, so the two randomised comparisons overlap.
    phase: '2'
    population: Treatment-naive patients with triple-negative inflammatory breast cancer.
    primary_ref: lynce2024
    pubs:
    - kind: primary
      ref: lynce2024
      role: primary
    result: The abstract does not state the primary conversion percentage; it reports that phosphorylated STAT3 and IL-6/JAK/STAT3
      signalling decreased in post-run-in biopsies of ruxolitinib-treated samples, while sustained ruxolitinib plus paclitaxel
      upregulated IL-6/JAK/STAT3 signalling compared with ruxolitinib alone. Two patients achieved pathological complete response
      (8.7%), a secondary endpoint.
    setting: early
    source:
    - ch: 63
      section: Additional studies — Early TNBC / hereditary HER2−
    status: reported
    subtype: TNBC
    topic: JAK-STAT inhibition added to preoperative chemotherapy in triple-negative inflammatory breast cancer
    weight: supporting
    year: 2024
  tbcrc-041:
    acronym: TBCRC 041
    arms: Alisertib 50 mg orally daily on days 1 to 3, 8 to 10 and 15 to 17 of a 28-day cycle alone versus the same alisertib
      dose and schedule with standard-dose fulvestrant.
    chapters:
    - BC-870
    - BC-880
    claim: ORR 19.6% with alisertib alone vs 20.0% with fulvestrant added; no gain from adding
    digest:
      methods: Randomised phase 2 trial conducted through the Translational Breast Cancer Research Consortium, enrolling participants
        from July 2017 to November 2019, asking whether adding fulvestrant to the selective Aurora A kinase inhibitor alisertib
        improves objective response rate in endocrine-resistant metastatic breast cancer. Postmenopausal women with endocrine-resistant,
        ERBB2-negative metastatic breast cancer previously treated with fulvestrant were eligible. Stratification factors
        were prior treatment with a CDK4/6 inhibitor, baseline metastatic tumour ERα level below 10% or 10% and above, and
        primary or secondary endocrine resistance. Arm 1 received alisertib 50 mg orally daily on days 1 to 3, 8 to 10 and
        15 to 17 of a 28-day cycle, and arm 2 the same dose and schedule with standard-dose fulvestrant. The design sought
        an improvement in objective response rate in arm 2 of at least 20% over arm 1, where the expected arm 1 rate was 20%.
        Among 114 preregistered patients, 96 (84.2%) registered and 91 (79.8%) were evaluable for the primary endpoint.
      results: All 91 evaluable patients, of mean age 58.5 years (SD 11.3), had received prior treatment with a CDK4/6 inhibitor,
        46 (50.5%) in arm 1 and 45 (49.5%) in arm 2. Objective response rate was 19.6% (90% CI 10.6 to 31.7) for arm 1 and
        20.0% (90% CI 10.9 to 32.3) for arm 2. In arm 1 the 24-week clinical benefit rate and median progression-free survival
        were 41.3% (90% CI 29.0 to 54.5) and 5.6 months (95% CI 3.9 to 10.0); in arm 2 they were 28.9% (90% CI 18.0 to 42.0)
        and 5.4 months (95% CI 3.9 to 7.8). The most common grade 3 or higher adverse events attributed to alisertib were
        neutropenia in 41.8% and anaemia in 13.2%. Treatment was discontinued for disease progression in 38 patients (82.6%)
        in arm 1 and 31 (68.9%) in arm 2, and for toxic effects or refusal in 5 (10.9%) and 12 (26.7%). The authors conclude
        that adding fulvestrant did not increase objective response rate or progression-free survival, while promising clinical
        activity was seen with alisertib monotherapy in endocrine-resistant and CDK4/6 inhibitor-resistant disease.
    endpoint: Objective response rate, with the design seeking an improvement in the fulvestrant-containing arm of at least
      20% over an expected 20% rate with alisertib alone.
    line: 2L,3L+
    modality: endocrine,other
    n: 91
    nct: NCT02860000
    note: Both arms contain alisertib, so the randomised comparison answers only whether fulvestrant adds anything; there
      is no endocrine-only or placebo control, and the alisertib monotherapy activity signal is effectively a single-arm observation
      that no comparison in this trial validates. The randomised question was negative and the monotherapy signal is the separate
      finding. n is the 91 patients evaluable for the primary endpoint, of 96 registered and 114 preregistered. Eligibility
      was endocrine-resistant, ERBB2-negative disease and stratification included tumours with an ERα level below 10%, so
      the population is broader than the HR+/HER2- tag suggests. Alisertib is tagged as other, since an Aurora A kinase inhibitor
      has no dedicated modality. All evaluable patients had prior CDK4/6 inhibitor treatment and prior fulvestrant. The full
      text allowed unlimited prior endocrine therapy and up to two chemotherapy regimens for metastatic disease, and 58% of
      patients had received chemotherapy for metastatic disease, so the line axis is 2L,3L+. The abstract reports no overall
      survival, so that field is omitted.
    os: not reported in the primary publication
    phase: '2'
    population: Postmenopausal women with endocrine-resistant, ERBB2-negative metastatic breast cancer previously treated
      with fulvestrant; all evaluable patients had received a prior CDK4/6 inhibitor.
    primary_ref: haddad2023
    pubs:
    - kind: primary
      ref: haddad2023
      role: primary
    result: Objective response rate was 19.6% (90% CI 10.6 to 31.7) with alisertib alone and 20.0% (90% CI 10.9 to 32.3) with
      alisertib plus fulvestrant. The 24-week clinical benefit rate and median progression-free survival were 41.3% (90% CI
      29.0 to 54.5) and 5.6 months (95% CI 3.9 to 10.0) with alisertib alone, and 28.9% (90% CI 18.0 to 42.0) and 5.4 months
      (95% CI 3.9 to 7.8) with alisertib plus fulvestrant.
    setting: metastatic
    source:
    - ch: 68
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
    - ch: 69
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
      xref: true
    status: reported
    subtype: HR+/HER2-
    topic: whether adding fulvestrant to Aurora A kinase inhibition improves response after endocrine and CDK4/6 resistance
    weight: supporting
    year: 2023
  tbcrc-043:
    acronym: TBCRC 043
    arms: Carboplatin AUC 6 every three weeks alone versus carboplatin AUC 6 with atezolizumab 1200 mg every three weeks,
      continued until disease progression or unacceptable toxicity.
    chapters:
    - BC-920
    claim: PFS 4.1 vs 2.2 months, HR 0.66; OS 12.6 vs 8.6 months, HR 0.60
    digest:
      methods: Randomised phase 2 trial conducted at six centres from August 2017 to June 2021. Patients with metastatic triple-negative
        breast cancer were randomly assigned to carboplatin area under the curve 6 alone or to carboplatin with atezolizumab
        1200 mg, each every three weeks until disease progression or unacceptable toxicity, with three years of follow-up.
        The primary endpoint was investigator-assessed progression-free survival. Secondary endpoints were overall response
        rate, clinical benefit rate and overall survival. Other objectives correlated response with tumour PD-L1 level, tumour-infiltrating
        lymphocytes, DNA- and RNA-sequenced biomarkers, TNBC subtyping and multiplex analyses of immune markers.
      results: All 106 enrolled patients were female, with a mean age of 55 years (range 27 to 79); 50 received carboplatin
        and 56 carboplatin with atezolizumab. The combination improved progression-free survival from a median of 2.2 to 4.1
        months, hazard ratio 0.66 (95% CI 0.44 to 1.01; P = .05), raised the overall response rate from 8.0% to 30.4% and
        the clinical benefit rate at six months from 18.0% to 37.5%, and improved overall survival from a median of 8.6 to
        12.6 months, hazard ratio 0.60 (95% CI 0.37 to 0.96; P = .03). Tumours that were PD-L1-positive did not benefit more
        from the addition of atezolizumab, hazard ratio 0.62 (95% CI 0.23 to 1.65; P = .35). Greater benefit on the combination
        was reported in patients with high tumour-infiltrating lymphocytes, in patients with high mutation burden and in patients
        with prior chemotherapy, the last with a hazard ratio of 0.59 (95% CI 0.36 to 0.95); better progression-free survival
        on the combination was also associated with obesity and with on-treatment blood glucose above 125 mg/dL. All TNBC
        subtypes except the luminal androgen receptor subtype benefited from the addition of atezolizumab.
    endpoint: Investigator-assessed progression-free survival.
    line: 1L,2L
    modality: immunotherapy,chemo
    n: 106
    nct: NCT03206203
    note: Exploratory randomised phase 2 trial. Its result should not be equated with the confirmatory registration evidence
      for the approved chemotherapy-immunotherapy regimens in metastatic TNBC. Benefit was seen regardless of PD-L1 status,
      and the PD-L1-positive subgroup did not benefit more, which runs against the selection strategy used by the phase 3
      trials. The abstract sets no prior-therapy requirement, but the full text limits entry to 0 to 1 prior treatments for
      metastatic disease, so line is recorded as 1L,2L. All subgroup hazard ratios are exploratory, and each named subgroup
      carries its own hazard ratio rather than the single one quoted for prior chemotherapy.
    os: Overall survival improved, hazard ratio 0.60 (95% CI 0.37 to 0.96; P = .03), from a median of 8.6 months with carboplatin
      alone to 12.6 months with carboplatin and atezolizumab.
    phase: '2'
    population: Patients with metastatic triple-negative breast cancer treated at six centres between August 2017 and June
      2021; all were female, with a mean age of 55 years (range 27 to 79).
    primary_ref: lehmann2024
    pubs:
    - kind: primary
      ref: lehmann2024
      role: primary
    result: Adding atezolizumab improved progression-free survival, hazard ratio 0.66 (95% CI 0.44 to 1.01; P = .05), from
      a median of 2.2 months with carboplatin alone to 4.1 months with the combination. The overall response rate rose from
      8.0% (95% CI 3.2% to 18.8%) to 30.4% (95% CI 19.9% to 43.3%).
    setting: metastatic
    source:
    - ch: 75
      section: Additional studies — Metastatic TNBC / rare histology
    status: reported
    subtype: TNBC
    topic: whether adding PD-L1 blockade to platinum chemotherapy helps in metastatic TNBC
    weight: supporting
    year: 2024
  tbcrc-049:
    acronym: TBCRC 049
    arms: Tucatinib plus trastuzumab plus capecitabine, given as a single arm.
    chapters:
    - BC-930
    digest:
      methods: Phase 2, nonrandomised, single-arm, multicenter study. Women with magnetic resonance imaging confirmed newly
        diagnosed leptomeningeal metastasis and HER2 positive breast cancer received tucatinib, trastuzumab and capecitabine.
        The primary endpoint was overall survival, compared against a historical control of 4.4 months at a prespecified interim
        efficacy threshold. Secondary endpoints were central nervous system progression-free survival, leptomeningeal objective
        response, neurological symptom improvement, pharmacokinetics and safety.
      results: 17 women enrolled, 15 were symptomatic and 8 had abnormal cerebrospinal fluid cytology. At a median follow-up
        of 18 months, 6 of 17 remained alive and median overall survival was 10 months, 95 percent CI 4.1 to not reached.
        Median time to central nervous system progression was 6.9 months, 95 percent CI 2.8 to 13.8. 5 of 13 evaluable patients
        had a composite leptomeningeal response and 7 of 12 had improved neurological deficits. Tucatinib reached therapeutic
        cerebrospinal fluid levels.
    endpoint: Overall survival.
    modality: her2,chemo
    n: 17
    nct: NCT03501979
    note: The abstract does not state how many prior systemic lines patients had received, so no treatment line is assigned.
    os: Median overall survival was 10 months, 95 percent CI 4.1 months to not reached, and 6 of 17 women remained alive at
      a median follow-up of 18 months.
    phase: 2
    population: Women with newly diagnosed leptomeningeal metastasis from HER2 positive breast cancer.
    primary_ref: murthy2026
    pubs:
    - kind: primary
      ref: murthy2026
      role: primary
    result: Median overall survival was 10 months, 95 percent CI 4.1 months to not reached, against a prespecified historical
      control of 4.4 months.
    reviewed: '2026-09-14'
    setting: cns
    source:
    - group: HER2 directed therapy for leptomeningeal disease
      section: Brain and leptomeningeal metastases
    status: reported
    subtype: HER2+
    topic: tucatinib plus trastuzumab and capecitabine in HER2-positive LMD, phase II, leptomeningeal
    year: 2026
