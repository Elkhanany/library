    digest:
      methods: Randomised phase III trial. Postmenopausal patients with hormone receptor-positive breast cancer were randomly
        allocated to either 2.5 or five years of letrozole after an initial five years of any endocrine therapy. The primary
        end point was disease-free survival. Secondary end points were overall survival, distant metastasis-free interval,
        new primary breast cancer, and safety. Hazard ratios were determined by Cox regression analysis. All analyses followed
        the intention-to-treat principle.
      results: 1824 patients were assigned to 2.5 years (n=909) or five years (n=915) of letrozole, with median follow-up
        of 6.6 years. A disease-free survival event occurred in 152 patients in the five-year group and 163 in the 2.5-year
        group, HR 0.92 (95% CI 0.74 to 1.16). Overall survival HR was 1.04 (0.78 to 1.38). Distant metastasis-free interval
        HR was 1.06 (0.78 to 1.45). Second primary breast cancer was reduced with five years, HR 0.39 (0.19 to 0.81).
