trials:
  a-plus:
    acronym: A-PLUS
    arms: Three cycles of bevacizumab, etoposide and cisplatin followed by whole-brain radiotherapy vs whole-brain radiotherapy
      alone.
    chapters:
    - BC-930
    digest:
      methods: Open-label randomised multicentre trial in Taiwan. Eligible patients were aged 20 to 75, had brain metastases
        from breast cancer not suitable for focal treatment, were whole-brain radiotherapy naive and had at least one measurable
        brain lesion. Patients were randomised 2:1 to three cycles of bevacizumab, etoposide and cisplatin followed by whole-brain
        radiotherapy, or to whole-brain radiotherapy alone. The primary endpoint was brain-specific progression-free survival
        assessed by local investigators using RECIST 1.1.
      results: 118 patients were randomised and 112 formed the intention-to-treat cohort. Median age was 56 years and 61 patients
        (54.5%) had HER2-positive disease. Median brain-specific progression-free survival was 8.1 versus 6.5 months (hazard
        ratio 0.71; 95% CI 0.44 to 1.13; P = .15). Brain-specific objective response at 2 months was 41.9% versus 52.6%. The
        8-month brain-specific progression-free survival rate was 48.7% versus 26.3% (P = .03).
    endpoint: Brain-specific progression-free survival.
    modality: chemo,radiation,other
    n: 118
    nct: NCT02185352
    note: The publication does not state a trial phase.
    os: Overall survival was a secondary endpoint and no overall survival result is reported in the abstract.
    population: Patients aged 20 to 75 with untreated brain metastases from breast cancer not suitable for focal treatment,
      with at least one measurable brain lesion.
    primary_ref: chen2024
    pubs:
    - kind: primary
      ref: chen2024
      role: primary
    result: Median brain-specific progression-free survival was 8.1 months with induction chemotherapy before whole-brain
      radiotherapy and 6.5 months with whole-brain radiotherapy alone. The hazard ratio for brain progression or death was
      0.71 (95% CI 0.44 to 1.13; P = .15), significant at the predefined alpha of .20.
    reviewed: '2026-09-14'
    setting: cns
    source:
    - group: Radiotherapy foundations and systemic treatment combinations
      section: Brain and leptomeningeal metastases
    status: reported
    subtype: all
    topic: bevacizumab, etoposide, and cisplatin before WBRT versus WBRT alone for breast cancer BM, drug-with-radiotherapy
    year: 2024
  abc-study:
    acronym: ABC study
    arms: Single arm of adebrelimab plus bevacizumab plus cisplatin or carboplatin until progression or unacceptable toxicity.
    chapters:
    - BC-930
    digest:
      methods: Single-arm phase II trial in patients with triple-negative breast cancer and active brain metastases. Patients
        received adebrelimab, bevacizumab and cisplatin or carboplatin until disease progression or unacceptable toxicity.
        The primary endpoint was CNS objective response rate by RANO-BM criteria. Secondary endpoints were CNS clinical benefit
        rate, progression-free survival, overall survival, first site of progression and safety.
      results: 35 patients were enrolled and treated, with a median of 2 prior lines of treatment. The confirmed CNS objective
        response rate was 77.1% (27 of 35) and the CNS clinical benefit rate was 80.0%. Median progression-free survival was
        8.3 months, median CNS progression-free survival was 10.3 months and median overall survival was 21.1 months. Grade
        3 or higher treatment-related adverse events occurred in 65.7% of patients.
    endpoint: CNS objective response rate by RANO-BM criteria.
    modality: immunotherapy,chemo,other
    n: 35
    note: Prior treatment ranged from none to four lines, so no single treatment line is assigned.
    os: Median overall survival was 21.1 months (95% CI 13.2 to not reached).
    phase: 2
    population: Patients with triple-negative breast cancer and active brain metastases.
    primary_ref: li2026
    pubs:
    - kind: primary
      ref: li2026
      role: primary
    result: The confirmed CNS objective response rate was 77.1%, that is 27 of 35 patients (95% CI 59.9 to 89.6). This was
      a single-arm study with no comparator.
    reviewed: '2026-09-14'
    setting: cns
    source:
    - group: TNBC and studies spanning breast cancer subtypes
      section: Brain and leptomeningeal metastases
    status: reported
    subtype: TNBC
    topic: adebrelimab plus bevacizumab and platinum in TNBC with active BM, phase II, intracranial-response
    year: 2026
  abc-trials:
    acronym: ABC trials
    arms: Six cycles of docetaxel and cyclophosphamide vs standard taxane plus anthracycline regimens.
    chapters:
    - BC-490
    - BC-510
    - BC-850
    digest:
      methods: Three adjuvant randomised trials assigned women with high-risk HER2-negative early breast cancer to six cycles
        of docetaxel and cyclophosphamide or to a standard taxane plus anthracycline regimen. USOR 06-090 compared TC6 with
        TAC6. NSABP B-46-I/USOR 07132 compared TC6, TAC6 and TC6 plus bevacizumab. NSABP B-49 compared TC6 with several anthracycline
        and taxane regimens. A joint efficacy analysis with invasive disease-free survival as the primary endpoint was prespecified,
        with a hazard ratio above 1.18 defined as inferiority.
      results: 2,125 patients were assigned to TC6 regimens and 2,117 to taxane plus anthracycline regimens. At a median follow-up
        of 3.3 years there were 334 invasive disease-free survival events and the hazard ratio for TC6 versus taxane plus
        anthracycline was 1.202 (95% CI 0.97 to 1.49), which triggered early reporting for futility. Four-year invasive disease-free
        survival was 88.2% versus 90.7% (P = .04). Interaction tests by protocol, hormone receptor status and nodal status
        were negative.
    endpoint: Invasive disease-free survival.
    line: adjuvant
    modality: chemo
    n: 4242
    note: The record covers three separate adjuvant trials, USOR 06-090, NSABP B-46-I/USOR 07132 and NSABP B-49, reported
      as one prespecified joint analysis.
    os: There was no difference in overall survival between the regimens at a median follow-up of 6.9 years.
    phase: 3
    population: Women with high-risk HER2-negative early breast cancer receiving adjuvant chemotherapy.
    primary_ref: blum2017
    pubs:
    - kind: primary
      ref: blum2017
      role: primary
    - kind: follow-up
      ref: geyer2024
      role: long-term follow-up
    result: Four-year invasive disease-free survival was 88.2% with six cycles of docetaxel and cyclophosphamide and 90.7%
      with taxane plus anthracycline regimens (P = .04). The hazard ratio for an invasive disease-free survival event was
      1.202 (95% CI 0.97 to 1.49), above the predefined inferiority boundary of 1.18, so noninferiority could not be declared.
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 53
      group: Assay-validation cohorts / chemotherapy foundations (cross-subtype)
      section: Early nonmetastatic disease
    - ch: 61
      group: Early triple-negative disease (overview)
      section: Early nonmetastatic disease
    status: reported
    subtype: HR+/HER2-,TNBC
    topic: TC6 versus anthracycline–taxane regimens, adjuvant-backbone
    year: 2017
  abcsg-8-arno-95:
    acronym: ABCSG-8 / ARNO 95
    arms: Anastrozole 1 mg daily vs continued tamoxifen for the remainder of adjuvant therapy.
    chapters:
    - BC-790
    digest:
      methods: Combined analysis of two prospective multicentre randomised open-label trials with nearly identical inclusion
        criteria. Postmenopausal women with hormone-sensitive early breast cancer who had completed 2 years of adjuvant tamoxifen
        were randomised to anastrozole 1 mg daily (n=1618) or to tamoxifen 20 or 30 mg daily (n=1606) for the remainder of
        adjuvant therapy. The primary endpoint was event-free survival, with events defined as local or distant metastasis
        or contralateral breast cancer. Analysis was by intention to treat.
      results: 3,224 patients were included. At a median follow-up of 28 months there were 67 events with anastrozole and
        110 with tamoxifen (hazard ratio 0.60; 95% CI 0.44 to 0.81; P = .0009). Both treatments were well tolerated. Fractures
        were significantly more frequent with anastrozole (P = .015) and thromboses significantly less frequent (P = .034).
    endpoint: Event-free survival, with an event defined as local or distant metastasis or contralateral breast cancer.
    line: adjuvant
    modality: endocrine
    n: 3224
    note: HER2 status was not an eligibility criterion in these trials, and the source record gives no publication year or
      trial phase.
    os: Overall survival is not reported in this combined analysis.
    population: Postmenopausal women with hormone-sensitive early breast cancer who had completed 2 years of adjuvant tamoxifen.
    primary_ref: jakesz0000
    pubs:
    - kind: pooled
      ref: jakesz0000
      role: combined analysis
    result: There were 67 events with anastrozole and 110 with tamoxifen, a 40% lower risk of an event with anastrozole. The
      hazard ratio was 0.60 (95% CI 0.44 to 0.81; P = .0009) at a median follow-up of 28 months.
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 54
      group: AI vs tamoxifen / switching (postmenopausal)
      section: Early nonmetastatic disease
    status: reported
    subtype: HR+/HER2-,HR+/HER2+
    topic: switch to anastrozole after tamoxifen, ai-vs-tamoxifen
  abcsg12:
    acronym: ABCSG-12
    arms: goserelin plus anastrozole or tamoxifen, each with or without zoledronic acid, for 3 years
    chapters:
    - BC-640
    - BC-790
    cited_by:
    - BC-790
    claim: no advantage for anastrozole over tamoxifen when both were given with goserelin for 3 years
    digest:
      methods: Randomised trial in premenopausal women with endocrine-responsive early breast cancer. 1803 patients were assigned
        to goserelin 3.6 mg subcutaneously every 28 days plus either tamoxifen 20 mg daily or anastrozole 1 mg daily, each
        with or without zoledronic acid 4 mg intravenously every 6 months, for 3 years. The primary end point was disease-free
        survival. Recurrence-free survival and overall survival were secondary end points.
      results: After a median 47.8 months, 137 events occurred. Disease-free survival was 92.8% with tamoxifen, 92.0% with
        anastrozole, 90.8% without zoledronic acid and 94.0% with it. Anastrozole versus tamoxifen gave a hazard ratio of
        1.10 (0.78 to 1.53, P=0.59). Zoledronic acid gave 0.64 (0.46 to 0.91, P=0.01) for disease progression and 0.60 (0.32
        to 1.11, P=0.11) for death. The 94.4-month final analysis reported 0.77 (0.60 to 0.99, P=0.042) for progression.
    endpoint: disease-free survival
    line: adjuvant
    modality: endocrine,bone
    n: 1803
    nct: NCT00295646
    os: zoledronic acid did not significantly reduce death, HR 0.60 (0.32-1.11), p=0.11
    phase: 3
    population: premenopausal endocrine-responsive early breast cancer, all receiving goserelin, median follow-up 47.8 months
    primary_ref: gnant2009
    pubs:
    - kind: primary
      ref: gnant2009
      role: primary
    - kind: update
      ref: gnant2014
      role: final analysis
    result: anastrozole did not improve disease-free survival over tamoxifen, HR 1.10 (0.78-1.53), p=0.59; adding zoledronic
      acid reduced disease progression, HR 0.64 (0.46-0.91), p=0.01
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 54
      group: Ovarian function suppression (premenopausal)
      section: Early nonmetastatic disease
    status: reported
    subtype: HR+/HER2-,HR+/HER2+
    topic: anastrozole versus tamoxifen with goserelin, and adjuvant zoledronic acid, ovarian-suppression
    year: 2009
  abcsg16:
    acronym: ABCSG-16
    arms: anastrozole for 5 further years vs anastrozole for 2 further years
    chapters:
    - BC-790
    cited_by:
    - BC-790
    claim: no benefit from a 5-year extension over a 2-year extension, with more fractures
    digest:
      methods: Prospective phase 3 trial. Postmenopausal women with hormone-receptor-positive breast cancer who had already
        received 5 years of adjuvant endocrine therapy were randomly assigned to anastrozole for an additional 2 years or
        an additional 5 years. The primary end point was disease-free survival, analysed in patients still in the trial and
        free of recurrence 2 years after randomisation. Secondary end points were overall survival, contralateral breast cancer,
        second primary cancer and clinical bone fracture.
      results: Of 3484 women enrolled, 3208 remained without disease progression after the first 2 years of extended treatment
        following randomisation. In that primary-analysis set, disease progression or death occurred in 335 women in each
        group at 8 years, a hazard ratio of 0.99 (95% CI 0.85 to 1.15, P=0.90). Most secondary end points showed no between-group
        difference. Clinical bone fracture risk was higher in the 5-year group, hazard ratio 1.35 (1.00 to 1.84).
    endpoint: disease-free survival
    line: adjuvant
    modality: endocrine
    n: 3484
    nct: NCT00295620
    os: no significant difference
    phase: 3
    population: postmenopausal hormone receptor-positive breast cancer after 5 years of adjuvant endocrine therapy; 3208 of
      3484 entered the primary analysis set
    primary_ref: gnant2021
    pubs:
    - kind: primary
      ref: gnant2021
      role: primary
    result: disease-free survival HR 0.99 (0.85-1.15), p=0.90 at 8 years, with 335 events in each group; clinical fracture
      risk HR 1.35 (1.00-1.84) with the longer course
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 54
      group: Extended aromatase inhibition
      section: Early nonmetastatic disease
    status: reported
    subtype: HR+/HER2-,HR+/HER2+
    topic: five further years versus two further years of anastrozole, extended-endocrine
    year: 2021
  abcsg18:
    acronym: ABCSG-18
    arms: denosumab 60 mg subcutaneously every 6 months vs placebo, added to adjuvant aromatase inhibitor therapy
    chapters:
    - BC-640
    - BC-650
    cited_by:
    - BC-640
    - BC-650
    claim: time to first clinical fracture HR 0.50
    digest:
      methods: Prospective, double-blind, placebo-controlled phase 3 trial at 58 centres in Austria and Sweden. Postmenopausal
        patients with early hormone receptor-positive breast cancer receiving aromatase inhibitors were randomly assigned
        1:1 to denosumab 60 mg or placebo subcutaneously every 6 months, stratified by DXA device type, previous aromatase
        inhibitor use and baseline bone mineral density. The primary endpoint was time to first clinical fracture by intention
        to treat. Treatment continued until 247 first clinical fractures had occurred.
      results: Of 3425 eligible patients enrolled, 3420 were randomly assigned to denosumab (n=1711) or placebo (n=1709).
        Time to first clinical fracture was significantly delayed with denosumab, hazard ratio 0.50 (95% CI 0.39 to 0.65,
        p<0.0001). Fractures numbered 92 with denosumab and 176 with placebo. Adverse events occurred in 80% of the denosumab
        group and 79% of the placebo group, with serious events in 30% of each. No osteonecrosis of the jaw was reported.
        93 patients died.
    endpoint: time from randomisation to first clinical fracture
    line: adjuvant
    modality: bone
    n: 3420
    nct: NCT00556374
    os: not an endpoint of this fracture-prevention trial; 93 patients (3%) died during the study period
    phase: 3
    population: HR+ postmenopausal on aromatase inhibitor
    primary_ref: gnant2015
    pubs:
    - kind: primary
      ref: gnant2015
      role: primary
    result: time to first clinical fracture favoured denosumab, hazard ratio 0.50 (0.39-0.65), p<0.0001, with 92 fractures
      against 176. The effect held both in patients with a baseline bone mineral density T-score of -1 or higher, 0.44 (0.31-0.64),
      and in those already below it, 0.57 (0.40-0.82). No case of osteonecrosis of the jaw was adjudicated
    setting: early
    status: reported
    subtype: HR+/HER2-
    topic: adjuvant denosumab for fracture prevention
    year: 2015
  abigail:
    acronym: ABIGAIL
    arms: Immediate abemaciclib with endocrine therapy vs an initial course of paclitaxel followed by abemaciclib with endocrine
      therapy.
    chapters:
    - BC-560
    - BC-880
    line: 1L
    modality: cdk4-6,endocrine,chemo
    note: No verified peer-reviewed publication was located for this trial. The evidence located is conference or registry
      material only, so the record carries no primary_ref, no pubs, no result, no enrolment figure and no digest. Status is
      awaited because no reported result was verified, not because the source document states a trial state. The axes are
      taken from the source document's design line, a randomised phase 2 comparison, and its story line; the document gives
      no primary endpoint, so endpoint is omitted, and it gives no number of previous lines, so the 1L tag is read from the
      induction-versus-immediate framing of the design. Carried from the source document as an interpretive limit, an early
      response to induction chemotherapy is not a universal answer for every visceral-crisis scenario, and the eligibility
      and the treatment sequence must be preserved whenever the trial is cited.
    phase: '2'
    population: Patients with aggressive hormone receptor-positive, HER2-negative metastatic breast cancer; the source document
      gives no eligibility criteria and none are verified.
    setting: metastatic
    source:
    - ch: 69
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
    status: awaited
    subtype: HR+/HER2-
    topic: induction chemotherapy before CDK4/6 inhibition against immediate CDK4/6 inhibition in aggressive disease
    weight: exploratory
  abrave:
    acronym: A-BRAVE
    arms: one year of avelumab after standard treatment vs observation
    chapters:
    - BC-850
    - BC-860
    cited_by:
    - BC-850
    digest:
      methods: Phase III trial. Patients with high-risk early triple-negative breast cancer were randomly assigned to 1 year
        of avelumab or to observation after completion of surgery and (neo)adjuvant chemotherapy. High risk meant at least
        pN2 with any pT, pN1/pT2 or pN0/pT3 after primary surgery (stratum A), or invasive residual disease after neoadjuvant
        chemotherapy (stratum B). Coprimary endpoints were disease-free survival in the intention-to-treat and stratum B populations.
        Secondary endpoints were overall survival and disease-free survival in PD-L1-positive patients.
      results: 466 patients were randomly assigned, 383 to stratum B and 83 to stratum A. At a median follow-up of 52.1 months,
        the disease-free survival hazard ratio was 0.81 (95% CI 0.61 to 1.09, P=0.172) in the intention-to-treat population,
        with 3-year estimates of 68.3% versus 63.2%, and 0.80 (0.58 to 1.10, P=0.170) in stratum B, 66.9% versus 60.7%. The
        descriptive overall survival hazard ratio was 0.66 (0.45 to 0.97), 3-year rates 84.8% versus 76.3%.
    endpoint: disease-free survival, in the intention-to-treat and residual disease populations
    line: adjuvant,post-neoadjuvant
    modality: immunotherapy
    n: 466
    nct: NCT02926196
    os: 3-year OS 84.8% vs 76.3%, HR 0.66 (0.45-0.97), descriptive
    phase: 3
    population: high-risk early TNBC. 383 of 466 with residual disease after neoadjuvant chemotherapy, 83 high-risk after
      primary surgery
    primary_ref: conte2025abrave
    pubs:
    - kind: primary
      ref: conte2025abrave
      role: primary
    result: DFS HR 0.81 (0.61-1.09), P=0.172. Residual disease stratum HR 0.80 (0.58-1.10), P=0.170. Neither co-primary endpoint
      met
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 62
      group: Adjuvant checkpoint blockade
      section: Early nonmetastatic disease
    status: reported
    subtype: TNBC
    topic: adjuvant avelumab after chemotherapy, given after surgery only
    year: 2025
  acelera:
    acronym: acelERA
    arms: giredestrant vs physician's choice endocrine monotherapy
    chapters:
    - BC-870
    cited_by:
    - BC-870
    digest:
      methods: Randomised phase II study. Post-, pre- and perimenopausal women and men with measurable disease or evaluable
        bone lesions, whose estrogen receptor-positive, HER2-negative advanced breast cancer had progressed after 1 to 2 lines
        of systemic therapy, were assigned 1:1 to giredestrant 30 mg orally once daily or to physician's choice of endocrine
        monotherapy until progression or unacceptable toxicity. Stratification was by visceral disease, prior CDK4/6 inhibitor
        and prior fulvestrant. The primary end point was investigator-assessed progression-free survival.
      results: At the February 18, 2022 cutoff, with a median follow-up of 7.9 months and 303 patients, the investigator-assessed
        progression-free survival hazard ratio was 0.81 (95% CI 0.60 to 1.10, P=.1757). Among 232 patients evaluable for circulating
        tumour DNA, the hazard ratio was 0.60 (0.35 to 1.03) in the 90 with a detectable mutation and 0.88 (0.54 to 1.42)
        in the 142 without. Related grade 3-4 adverse events, serious adverse events and discontinuations were balanced.
    endpoint: investigator-assessed progression-free survival
    line: 2L
    modality: endocrine
    n: 303
    nct: NCT04576455
    os: not yet reported
    phase: 2
    population: progression after one or two prior systemic lines
    primary_ref: martin2024
    pubs:
    - kind: primary
      ref: martin2024
      role: primary
    result: progression-free survival HR 0.81 against endocrine monotherapy, primary endpoint not met
    setting: metastatic
    status: reported
    subtype: HR+/HER2-
    topic: giredestrant against endocrine monotherapy, oral SERD
    year: 2024
  adapt-her2-hr:
    acronym: WSG-ADAPT HER2+/HR−
    arms: trastuzumab plus pertuzumab for 12 weeks, with or without weekly paclitaxel
    chapters:
    - BC-820
    - BC-830
    digest:
      methods: Prospective randomised phase II trial in the ADAPT umbrella, at 40 German breast centres. Patients with HER2-positive,
        hormone receptor-negative early breast cancer were randomly assigned 5:2 to 12 weeks of trastuzumab with pertuzumab,
        with or without weekly paclitaxel at 80 mg/m2. Early response was a Ki-67 fall of 30% or more, or low cellularity,
        on a three-week biopsy. Further chemotherapy could be omitted after a pathological complete response.
      results: 134 patients were randomised, 92 to dual blockade and 42 to dual blockade with paclitaxel. Pathological complete
        response was 90.5% with paclitaxel and 36.3% without. Among the 92 given dual blockade alone it was 44.7% in early
        responders and 8.3% in non-responders. At a median 59.9 months, 5-year invasive disease-free survival was 98% with
        paclitaxel and 87% without, hazard ratio 0.32 (0.07-1.49), p=0.15. A pathological complete response was associated
        with better invasive disease-free survival, hazard ratio 0.14 (0.03-0.64).
    endpoint: pathological complete response in early responders given dual blockade alone, tested for non-inferiority against
      every patient given the taxane
    line: neoadjuvant
    modality: her2,chemo
    n: 134
    nct: NCT01817452
    note: ADAPT is an umbrella trial and this is its hormone receptor-negative HER2-positive sub-trial. The hormone receptor-positive
      sub-trial is WSG-ADAPT-TP, a different trial with a different regimen; do not merge the two.
    os: 5-year overall survival 98% (84-100) with the taxane and 94% (86-97) without, hazard ratio 0.41 (0.05-3.63), p=0.43,
      on 134 patients
    phase: 2
    population: HER2-positive, hormone receptor-negative early breast cancer without metastases; 160 screened and 134 randomised
      5:2
    primary_ref: nitz2017a
    pubs:
    - kind: primary
      ref: nitz2017a
      role: primary
    - kind: survival
      ref: nitz2022a
      role: 5-year survival
    result: pathological complete response 90.5% with trastuzumab, pertuzumab and paclitaxel against 36.3% with dual blockade
      alone. Within the dual blockade arm early responders reached 44.7% and non-responders 8.3%, so non-inferiority was not
      shown and the taxane was not dispensable
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 59
      group: Anthracycline omission / de-escalation
      section: Early nonmetastatic disease
    status: reported
    subtype: HER2+
    topic: twelve weeks of dual blockade with or without weekly paclitaxel, and whether an early responder can be spared the
      taxane, chemotherapy-free
    year: 2017
  adaptcycle:
    acronym: WSG ADAPTcycle
    arms: ribociclib plus an aromatase inhibitor, with a gonadotropin-releasing hormone agonist in premenopausal women, vs
      chemotherapy followed by endocrine therapy
    chapters:
    - BC-490
    - BC-790
    - BC-800
    - BC-810
    cited_by:
    - BC-800
    - BC-810
    digest:
      methods: Analysis within the WSG ADAPTcycle trial at 85 sites in Germany, in which 5292 patients were screened and 1684
        randomised. Patients with intermediate-risk hormone receptor-positive, HER2-negative early breast cancer defined by
        Oncotype DX and endocrine therapy response were randomised to (neo)adjuvant chemotherapy followed by endocrine therapy
        or to ribociclib plus an aromatase inhibitor, with a gonadotropin-releasing hormone agonist in premenopausal women.
        Local and central Ki67 at baseline and after endocrine therapy were compared.
      results: Median baseline Ki67 was 25% locally (n=4972) and centrally (n=4903). Overall agreement for Ki67 above versus
        at or below 10% was 86.9% (95% CI 85.9% to 87.9%). After short preoperative endocrine therapy, median Ki67 was 5%
        locally (n=2786) and 10% centrally (n=4429). Endocrine response, Ki67 at or below 10%, was seen in 1663 patients (64.2%)
        centrally and 1571 (60.7%) locally, overall agreement 80.5% (79% to 82.1%). Among local responders, 206 (13.1%) were
        central non-responders.
