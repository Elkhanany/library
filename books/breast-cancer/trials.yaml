    digest:
      methods: Multicentre, randomised, phase 3, non-inferiority trial at 30 UK radiotherapy centres. Women aged 50 years
        or older who had breast-conserving surgery for unifocal invasive ductal adenocarcinoma up to 3 cm, with none to three
        positive axillary nodes and microscopic margins of 2 mm or more, were randomly assigned 1:1:1 to 40 Gy whole-breast
