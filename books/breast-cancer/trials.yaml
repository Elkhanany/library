    result: pCR 55.1%, 90% CI 44.5 to 65.3, with paclitaxel plus olaparib against 48.6%, 90% CI 34.3 to 63.2, with paclitaxel
      plus carboplatin. The trial could not exclude a pCR rate of 55% or lower in the olaparib arm, so the primary endpoint
