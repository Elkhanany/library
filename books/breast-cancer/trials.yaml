    year: 2022
  nimbus:
    acronym: NIMBUS
    arms: Single arm of nivolumab 3 mg/kg every 2 weeks plus low-dose ipilimumab 1 mg/kg every 6 weeks, given for 2 years
      or until progression.
    chapters:
    - BC-550
    - BC-590
    - BC-890
    - BC-920
    claim: confirmed response 20% with nivolumab plus low-dose ipilimumab in hypermutated disease
    digest:
      methods: Phase II single-arm trial in patients with HER2-negative metastatic breast cancer and high tumour mutational
        burden, defined as at least 9 mutations per megabase. Patients received nivolumab 3 mg/kg every 2 weeks and low-dose
        ipilimumab 1 mg/kg every 6 weeks for 2 years or until progression. The primary endpoint was objective response rate
        per RECIST 1.1. Secondary endpoints were progression-free survival, overall survival, clinical benefit rate, and safety
        and tolerability including immune-related adverse events. A prespecified correlative outcome was the response rate
        in patients with a burden of at least 14 mutations per megabase. Exploratory genomic, circulating tumour DNA and stool
        microbiome analyses were also performed.
      results: Among 30 patients enrolled, the median tumour mutational burden was 10.9 mutations per megabase (range 9 to
        110) and the confirmed objective response rate was 20%. The 6 patients with a burden of at least 14 mutations per
        megabase had a higher response rate, 60% versus 12% (p = 0.041), and showed a trend towards improved progression-free
        and overall survival compared with patients below that threshold. Exploratory genomic analyses suggested that ESR1
        and PTEN mutations may be associated with poor response, while clinical benefit was associated with a decrease or
        no change in tumour fraction on serial circulating tumour DNA during treatment. Stool microbiome analysis showed that
        baseline blood tumour mutational burden, PD-L1 positivity and immune-related diarrhoea were associated with distinct
        taxonomic profiles. The authors conclude that some patients with hypermutated HER2-negative metastatic breast cancer
        experience extended clinical benefit with dual immunotherapy, and that a higher burden together with additional genomic
        and microbiome biomarkers may optimise selection.
    endpoint: Objective response rate by RECIST 1.1.
    line: any
    modality: immunotherapy
    n: 30
    nct: NCT03789110
    note: Selection was by tumour mutational burden alone within HER2-negative disease, so hormone receptor-positive patients
      were enrolled alongside triple-negative ones and the record is tagged across both; the abstract does not give the split.
      The full text allowed up to three prior lines of chemotherapy for metastatic disease, so the line is any. The threshold
      subgroup that carries the selection message is 6 patients and is a prespecified correlative outcome rather than a randomised
      comparison, so it does not establish a universal tumour mutational burden cut-off. The trial was funded by Bristol Myers
      Squibb.
    os: Overall survival was a secondary endpoint and no overall survival figures are reported in the abstract.
    phase: '2'
    population: Patients with HER2-negative metastatic breast cancer and a high tumour mutational burden, at least 9 mutations
      per megabase.
    primary_ref: barrososousa2025
    pubs:
    - kind: primary
      ref: barrososousa2025
      role: primary
    result: Among 30 patients enrolled, the median tumour mutational burden was 10.9 mutations per megabase (range 9 to 110)
      and the confirmed objective response rate was 20%. In the prespecified correlative analysis the 6 patients with a burden
      of at least 14 mutations per megabase had a higher response rate, 60% versus 12% below that threshold (p = 0.041).
    setting: metastatic
    source:
    - ch: 70
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
    - ch: 75
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
    status: reported
    subtype: HR+/HER2-,TNBC
    topic: dual checkpoint blockade selected by tumour mutational burden
    weight: exploratory
    year: 2025
  noah:
    acronym: NOAH
    arms: neoadjuvant and adjuvant trastuzumab added to doxorubicin, paclitaxel, cyclophosphamide, methotrexate and fluorouracil
      vs the same chemotherapy alone
    chapters:
    - BC-830
    - BC-840
    cited_by:
    - BC-830
    digest:
      methods: Randomised superiority trial. Women with HER2-positive locally advanced or inflammatory breast cancer received
        neoadjuvant chemotherapy of doxorubicin, paclitaxel, cyclophosphamide, methotrexate and fluorouracil, with 1 year
        of trastuzumab given neoadjuvantly and adjuvantly (n=117) or without trastuzumab (n=118). Randomisation used a computer
        program with minimisation by geographical area, disease stage and hormone receptor status. A parallel cohort of 99
        patients with HER2-negative disease received the same chemotherapy. The primary endpoint was event-free survival,
        analysed by intention to treat.
      results: Trastuzumab significantly improved event-free survival in HER2-positive patients. Three-year event-free survival
        was 71% (95% CI 61-78, 36 events) with trastuzumab and 56% (46-65, 51 events) without, hazard ratio 0.59 (95% CI 0.38-0.90),
        p=0.013. Two patients (2%) developed symptomatic cardiac failure despite concurrent doxorubicin, and both responded
        to cardiac drugs. The 2014 follow-up reported 5-year event-free survival of 58% with trastuzumab and 43% with chemotherapy
        alone, hazard ratio 0.64 (95% CI 0.44-0.93), p=0.016.
    endpoint: event-free survival
    line: neoadjuvant
    modality: her2,chemo
    n: 235
    nct: ISRCTN86043495
