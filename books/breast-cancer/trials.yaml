  u-bomb:
    acronym: U-BOMB
    arms: Single arm of bevacizumab 15 mg/kg on day 1 with utidelone 30 mg/m2 on days 1 to 5, every 3 weeks, until progression
      or unacceptable toxicity.
    chapters:
    - BC-930
    digest:
      methods: Non-randomised phase 2 trial at five hospitals in China. Adults with ERBB2-negative metastatic breast cancer
        and untreated or progressive brain metastases were enrolled between May 2022 and October 2023, with a data cutoff
        of May 2024. Patients received bevacizumab 15 mg/kg on day 1 and utidelone 30 mg/m2 on days 1 to 5 every 3 weeks.
