    digest:
      methods: This was a phase 3, randomised, double-blind, placebo-controlled trial at 145 sites in 15 countries. Patients
        aged 18 years and older with untreated clinical stage II-III triple-negative breast cancer and ECOG performance status
        0 or 1 were randomly assigned 2:1:1 to weekly paclitaxel plus carboplatin plus veliparib, paclitaxel plus carboplatin
        plus veliparib placebo, or paclitaxel with both placebos. All then received four cycles of doxorubicin and cyclophosphamide.
        The primary endpoint was pathological complete response in breast and lymph nodes.
      results: 634 patients were randomised, 316 to paclitaxel plus carboplatin plus veliparib, 160 to paclitaxel plus carboplatin,
        and 158 to paclitaxel alone. Pathological complete response was reached in 168 of 316 (53%) with veliparib and carboplatin,
        92 of 160 (58%) with carboplatin, and 49 of 158 (31%) with paclitaxel alone (p<0.0001 versus paclitaxel alone, p=0.36
        versus carboplatin). The 4.5-year follow-up reported event-free survival HR 0.57 (0.36-0.91) for carboplatin with
        paclitaxel versus paclitaxel, with no overall survival difference.
