  destiny-b05:
    acronym: DESTINY-Breast05
    arms: trastuzumab deruxtecan vs trastuzumab emtansine
    chapters:
    - BC-820
    - BC-840
    cited_by:
    - BC-500
    - BC-820
    claim: 3-year IDFS 92.4% vs 83.7%, HR 0.47 (0.34-0.66)
    digest:
      methods: A phase 3, open-label, international, randomized trial compared postneoadjuvant trastuzumab deruxtecan at 5.4
        mg per kilogram with trastuzumab emtansine at 3.6 mg per kilogram. Patients had HER2-positive breast cancer with residual
        invasive disease and node-positive disease at surgery, or inoperable disease at diagnosis. The primary end point was
        invasive disease-free survival. The key secondary end point was disease-free survival. Other end points included overall
        survival, distant recurrence-free interval, brain metastasis-free interval, and safety.
      results: A total of 1635 patients were randomly assigned, 818 to trastuzumab deruxtecan and 817 to trastuzumab emtansine.
        Median follow-up was about 30 months. Invasive-disease events or deaths occurred in 51 patients (6.2%) versus 102
        patients (12.5%), hazard ratio 0.47. Three-year invasive disease-free survival was 92.4% versus 83.7%. Three-year
        disease-free survival was 92.3% versus 83.5%. Adjudicated drug-related interstitial lung disease occurred in 9.6%
        versus 1.6%. Two patients with interstitial lung disease in the trastuzumab deruxtecan group died.
    endpoint: invasive disease-free survival
    line: post-neoadjuvant
    modality: adc
    n: 1635
    nct: NCT04622319
    os: immature at the primary analysis
    phase: 3
    population: HER2+ residual invasive disease after neoadjuvant therapy, with node-positive disease at surgery or inoperable
      disease at diagnosis
    primary_ref: loibl2026db05
    pubs:
    - kind: primary
      ref: loibl2026db05
      role: primary
    result: 3-year invasive disease-free survival 92.4% against 83.7%, HR 0.47 (0.34-0.66), p<0.001, at a median follow-up
