    claim: invasive breast cancer reduced by 49%; by 86% in women with atypical hyperplasia
    digest:
      methods: Women at increased risk for breast cancer were randomly assigned to placebo (n=6707) or tamoxifen 20 mg per
        day (n=6681) for 5 years, 13,388 in total. Eligible women were 60 years of age or older, were 35 to 59 years with
        a 5-year predicted breast cancer risk of at least 1.66% by the Gail algorithm, or had a history of lobular carcinoma
        in situ.
