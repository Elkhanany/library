    digest:
      methods: Open-label multicentre parallel-group randomised phase 3 trial at 130 UK hospitals. Postmenopausal women aged
        at least 50 years with performance status 0-1 and hormone receptor-positive operable breast cancer were randomly assigned
        2:1 to a perioperative aromatase inhibitor, letrozole 2.5 mg or anastrozole 1 mg daily for 14 days before and after
        surgery, or to no such treatment. The primary endpoint was time to recurrence. A second objective examined 2-week
        Ki67 dichotomised at 10%.
