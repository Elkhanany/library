    claim: false-negative rate 14.2% after conversion to clinically node-negative; 51.6% for repeat biopsy
    digest:
      methods: Four-arm prospective multicentre cohort study at 103 institutions in Germany and Austria. Women scheduled for
        neoadjuvant chemotherapy were enrolled. Clinically node-negative patients had sentinel-lymph-node biopsy before chemotherapy
        (arm A), and those with a positive node had a second biopsy afterwards (arm B). Clinically node-positive patients
        who converted to node-negative had biopsy plus axillary dissection (arm C). Those still node-positive had dissection
        alone (arm D). The primary endpoint was the false-negative rate in arm C.
      results: 1737 patients received treatment. Among 1022 women biopsied before chemotherapy the detection rate was 99.1%
        (1013 of 1022). In arm C the detection rate was 80.1% (474 of 592) and the false-negative rate was 14.2% (32 of 226).
        The false-negative rate was 24.3% (17 of 70) with one node removed and 18.5% (10 of 54) with two. In arm B the detection
        rate was 60.8% (219 of 360) and the false-negative rate 51.6% (33 of 64).
