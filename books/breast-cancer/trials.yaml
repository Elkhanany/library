    digest:
      methods: A phase 3, multicenter, open-label trial enrolled patients with hormone receptor-positive metastatic breast
        cancer with HER2-low expression (immunohistochemistry 1+ or 2+ with negative in situ hybridization) or HER2-ultralow
        expression (immunohistochemistry 0 with membrane staining). All had received one or more lines of endocrine-based
        therapy and no chemotherapy for metastatic disease. Patients were randomly assigned 1:1 to trastuzumab deruxtecan
        or physician's choice of chemotherapy. The primary end point was progression-free survival in HER2-low disease.
      results: Of 866 patients randomized, 713 had HER2-low disease and 153 had HER2-ultralow disease. Among those with HER2-low
        disease, median progression-free survival was 13.2 months with trastuzumab deruxtecan and 8.1 months with chemotherapy,
        hazard ratio 0.62. Results were consistent in the exploratory HER2-ultralow population. Overall survival data were
        immature. Grade 3 or higher adverse events occurred in 52.8% versus 44.4%. Adjudicated interstitial lung disease or
        pneumonitis occurred in 49 patients (11.3%) versus 1 patient (0.2%).
    endpoint: progression-free survival by blinded independent central review in the HER2-low population
    line: 2L
    modality: adc
