      methods: Comparison of anastrozole 1 mg with tamoxifen 20 mg, each given orally every day for 5 years as adjuvant treatment
        for postmenopausal women with early-stage breast cancer, analysed after a median follow-up of 120 months. A proportional
        hazards model assessed disease-free survival and secondary endpoints in all randomised patients (anastrozole 3125,
        tamoxifen 3116) and in hormone-receptor-positive patients (anastrozole 2618, tamoxifen 2598). Fractures and serious
        adverse events continued to be collected in masked fashion.
