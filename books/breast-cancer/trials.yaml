      methods: This was a phase 3, randomised, double-blind trial. It enrolled pre-, peri- and postmenopausal women and men
        with hormone receptor-positive, HER2-negative advanced breast cancer who had relapsed or progressed during or after
        an aromatase inhibitor, with or without previous CDK4/6 inhibitor therapy. Patients were randomly assigned 1:1 to
        capivasertib plus fulvestrant or placebo plus fulvestrant. The dual primary endpoint was investigator-assessed progression-free
        survival in the overall population and in patients with AKT pathway-altered tumours. Safety was assessed.
      results: 708 patients underwent randomisation. 289 (40.8%) had AKT pathway alterations and 489 (69.1%) had previously
