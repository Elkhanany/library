    digest:
      methods: Prospective trial involving 10,273 women with hormone receptor-positive, HER2-negative, axillary node-negative
        breast cancer. Of the 9,719 eligible patients with follow-up information, 6,711 (69%) had a midrange 21-gene recurrence
        score of 11 to 25 and were randomly assigned to chemoendocrine therapy or endocrine therapy alone. The trial was designed
        to show non-inferiority of endocrine therapy alone for invasive disease-free survival, defined as freedom from invasive
        recurrence, second primary cancer or death.
      results: Endocrine therapy was non-inferior to chemoendocrine therapy for invasive disease-free survival (hazard ratio
        1.08, 95% CI 0.94 to 1.24, P = 0.26). At 9 years the groups had similar invasive disease-free survival (83.3% versus
        84.3%), freedom from distant recurrence (94.5% and 95.0%), freedom from distant or local-regional recurrence (92.2%
        and 92.9%) and overall survival (93.9% and 93.8%). Chemotherapy benefit varied with recurrence score and age, with
        some benefit in women 50 or younger scoring 16 to 25.
    endpoint: invasive disease-free survival, non-inferiority design
    line: adjuvant
    modality: chemo
    n: 6711
