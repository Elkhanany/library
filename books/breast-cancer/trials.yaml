    digest:
      methods: Randomised trial of 257 premenopausal women with operable hormone-receptor-negative breast cancer assigned
        to standard chemotherapy with the gonadotropin-releasing hormone agonist goserelin or standard chemotherapy alone.
        The primary endpoint was the rate of ovarian failure at 2 years, defined as absence of menses in the preceding 6 months
        together with follicle-stimulating hormone in the postmenopausal range. Rates were compared by conditional logistic
        regression. Secondary endpoints included pregnancy outcomes, disease-free survival and overall survival.
      results: 218 patients were eligible and evaluable. Among the 135 with complete primary endpoint data, the ovarian failure
        rate was 8% with goserelin and 22% with chemotherapy alone (odds ratio 0.30, 95% CI 0.09 to 0.97, two-sided P=0.04).
        Sensitivity analyses for missing data were consistent. Among the 218 evaluable patients, pregnancy occurred in 21%
        of the goserelin group versus 11% (P=0.03). The goserelin group also had improved disease-free survival (P=0.04) and
        overall survival (P=0.05).
