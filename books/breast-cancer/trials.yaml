  petremac:
    acronym: PETREMAC
    arms: Single arm, olaparib for up to 10 weeks before chemotherapy, with tumour biopsies taken before and after the olaparib
      window.
    chapters:
    - BC-860
    claim: Olaparib alone produced objective responses in 18 of 32 treatment-naive TNBCs (56.3%)
    digest:
      methods: Phase II trial in which patients with primary triple-negative breast cancer larger than 2 cm received olaparib
        for up to 10 weeks before chemotherapy. Tumour biopsies collected before and after olaparib underwent targeted DNA
        sequencing of 360 genes and BRCA1 methylation analysis. Pretreatment samples were also assessed for BRCAness by multiplex
        ligation-dependent probe amplification, PAM50 gene expression, RAD51 foci, tumour-infiltrating lymphocytes and PD-L1.
        Entry did not require a germline BRCA1/2 mutation. The hypothesis was that PARP inhibition might be effective in primary
        TNBC without previous chemotherapy exposure, in contrast to its lack of activity in BRCA1/2 wild-type metastatic TNBC.
      results: Median pretreatment tumour diameter was 60 mm, range 25 to 112 mm. Eighteen of 32 patients obtained an objective
        response to olaparib, 56.3%. Somatic or germline mutations affecting homologous recombination were seen in 10 of 18
        responders, 55.6%, against 1 of 14 non-responders, 7.1%, P = 0.008, and among tumours without such mutations 6 of
        8 responders against 3 of 13 non-responders showed BRCA1 hypermethylation, P = 0.03. Taken together, 16 of 18 responders,
        88.9%, against 4 of 14 non-responders, 28.6%, carried homologous recombination mutations and/or BRCA1 methylation,
        P = 0.0008. Excluding one germline PALB2 and four germline BRCA1/2 carriers, 12 of 14 responders, 85.7%, against 3
        of 13 non-responders, 23.1%, carried somatic homologous recombination mutations and/or BRCA1 methylation, P = 0.002.
        Low RAD51 scores, high tumour-infiltrating lymphocytes and high PD-L1 expression all correlated with response, whereas
        the BRCAness signature and basal-like subtype did not.
    endpoint: Objective response to olaparib given as primary treatment, with paired biopsies used to relate response to homologous
      recombination status. The abstract does not label a primary endpoint.
    line: neoadjuvant
    modality: parp
    n: 32
    nct: NCT02624973
    note: The publication reports the olaparib arm of the PETREMAC programme, a single-arm phase II cohort, not a randomised
      comparison. The abstract does not label a primary endpoint, so the tabulated result is the objective response rate the
      paper reports. Entry did not require a germline BRCA mutation and the abstract identifies only one germline PALB2 and
      four germline BRCA1/2 carriers, so the record is tagged TNBC rather than BRCA. An olaparib response window of up to
      10 weeks says nothing about whether the chemotherapy that followed could have been omitted.
    os: not reported. The olaparib window was followed by planned chemotherapy, and the primary publication reports response
      and homologous recombination status only
    phase: '2'
    population: Patients with primary triple-negative breast cancer larger than 2 cm who had not received previous chemotherapy,
      enrolled without selection by germline BRCA status.
    primary_ref: eikesdal2020
    pubs:
    - kind: primary
      ref: eikesdal2020
      role: primary
    result: Objective response to olaparib in 18 of 32 patients, 56.3%. Homologous recombination mutations and/or BRCA1 methylation
      were carried by 16 of 18 responders, 88.9%, against 4 of 14 non-responders, 28.6%, P = 0.0008.
    setting: early
    source:
    - ch: 63
      section: Additional studies — Early TNBC / hereditary HER2−
    status: reported
    subtype: TNBC
    topic: PARP inhibitor monotherapy before chemotherapy in TNBC unselected for germline BRCA status
    weight: exploratory
    year: 2020
