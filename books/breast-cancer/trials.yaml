  sacituzumab-govitecan-phase-0-window-stu:
    acronym: Sacituzumab govitecan phase 0 window study
    arms: Single arm of sacituzumab govitecan 10 mg/kg given one day before resection and then on days 1 and 8 of 21-day cycles.
    chapters:
    - BC-930
    digest:
      methods: Prospective single-centre window-of-opportunity trial. 25 patients aged 18 or older with breast cancer brain
        metastases or recurrent glioblastoma received a single intravenous dose of sacituzumab govitecan 10 mg/kg one day
        before resection, then continued on days 1 and 8 of 21-day cycles after recovery. Intratumoral drug concentration
        was the primary endpoint, with survival, toxicity and biomarkers also assessed.
      results: Median total SN-38 was 249.8 ng/g in breast cancer brain metastases and 104.5 ng/g in recurrent glioblastoma.
        Progression-free survival was 8 months and 2 months, and overall survival 35.2 months and 9.5 months. Objective response
        was 38% and 29%. Grade 3 or higher events included neutropenia in 28% and hypokalemia, seizure, thromboembolism, urinary
        tract infection and lower limb weakness in 8% each. Trop-2 was expressed in 100% of breast and 78% of glioblastoma
        tumours.
    endpoint: Intratumoral concentration of sacituzumab govitecan and its payload in resected tissue.
    modality: adc
    n: 25
