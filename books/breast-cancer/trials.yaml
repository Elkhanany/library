    - BC-840
    cited_by:
    - BC-830
    digest:
      methods: Multicentre, open-label phase II cardiac safety study. Patients with operable, locally advanced or inflammatory
        HER2-positive breast cancer were randomised 1:1:1 to six neoadjuvant cycles every 3 weeks. Arm A gave fluorouracil,
        epirubicin and cyclophosphamide with trastuzumab and pertuzumab for three cycles, then docetaxel with both antibodies.
        Arm B gave the same chemotherapy alone for three cycles, then docetaxel with both antibodies. Arm C gave docetaxel,
        carboplatin, trastuzumab and pertuzumab. Adjuvant treatment completed one year of trastuzumab.
      results: Two hundred twenty-five patients were randomised. During neoadjuvant treatment two patients (2.7%, arm B) had
        symptomatic left ventricular systolic dysfunction. Eleven patients had ejection fraction declines of 10 points or
        more from baseline to below 50% (four in arm A, four in arm B, three in arm C). Pathologic complete response (ypT0/is)
        was 61.6% in arm A, 57.3% in arm B, 66.2% in arm C. The 2017 long-term analysis gave 3-year disease-free survival
        of 87%, 88% and 90%.
