  nrg-cc001:
    acronym: NRG CC001
    arms: Hippocampal-avoidance whole brain radiotherapy plus memantine versus whole brain radiotherapy plus memantine
    chapters:
    - BC-930
    digest:
      methods: Phase 3 trial enrolling adult patients with brain metastases, randomised to hippocampal-avoidance whole brain
        radiotherapy plus memantine or whole brain radiotherapy plus memantine. The primary endpoint was time to cognitive
        function failure, defined as decline by the reliable change index on at least one cognitive test. Secondary endpoints
        were overall survival, intracranial progression-free survival, toxicity, and patient-reported symptom burden.
      results: 518 patients were randomised between July 2015 and March 2018, with median follow-up of 7.9 months for living
        patients. Cognitive failure risk was lower with hippocampal avoidance, adjusted hazard ratio 0.74, p=0.02, driven
        by less deterioration in executive function at 4 months, 23.3% versus 40.4%, and in learning and memory at 6 months.
        Overall survival, intracranial progression-free survival, and toxicity did not differ.
    endpoint: Time to cognitive function failure, defined as decline by the reliable change index on at least one cognitive
      test
    modality: radiation,supportive
    n: 518
    note: The trial enrolled brain metastases of any primary histology rather than breast cancer only.
    os: Overall survival did not differ significantly between the two arms. No medians or hazard ratio were reported in the
      abstract.
    phase: 3
    population: Adults with brain metastases planned for whole brain radiotherapy and without metastases in the hippocampal
      avoidance region.
    primary_ref: brown2020
    pubs:
    - kind: primary
      ref: brown2020
      role: primary
    - kind: update
      ref: gondi2023
      role: final report
    result: Risk of cognitive failure was lower with hippocampal-avoidance whole brain radiotherapy plus memantine than with
      whole brain radiotherapy plus memantine, adjusted hazard ratio 0.74, p=0.02.
    reviewed: '2026-09-14'
    setting: cns
    source:
