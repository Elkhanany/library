  team:
    acronym: TEAM
    arms: exemestane alone for 5 years vs tamoxifen followed by exemestane
    chapters:
    - BC-790
    cited_by:
    - BC-790
    claim: no difference between upfront aromatase inhibition and a tamoxifen-first sequence
    digest:
      methods: Open-label phase 3 trial conducted in hospitals in nine countries. Postmenopausal women with hormone-receptor-positive
        breast cancer, median age 64 years (range 35 to 96), were randomly assigned in a 1:1 ratio to oral exemestane 25 mg
        once a day alone or to the same exemestane following tamoxifen 20 mg once a day, for 5 years. Randomisation used a
        computer-generated random permuted block method. The primary endpoint was disease-free survival at 5 years, analysed
        by intention to treat.
      results: 9779 patients were assigned to sequential treatment (n=4875) or exemestane alone (n=4904), with 4868 and 4898
        analysed by intention to treat. At 5 years, 4154 (85%) of the sequential group and 4186 (86%) of the exemestane alone
        group were disease free (hazard ratio 0.97, 95% CI 0.88 to 1.08, p=0.60). Sequential treatment carried more gynaecological
        symptoms, venous thrombosis and endometrial abnormalities. Exemestane alone carried more musculoskeletal events, hypertension
        and hyperlipidaemia.
    endpoint: disease-free survival at 5 years
    line: adjuvant
    modality: endocrine
    n: 9779
    os: not reported in the primary analysis
    phase: 3
    population: postmenopausal hormone receptor-positive early breast cancer, median age 64
    primary_ref: vandevelde2011
    pubs:
    - kind: primary
