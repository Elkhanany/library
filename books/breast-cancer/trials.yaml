        (hazard ratio 0.86, 95% CI 0.78 to 0.95, p=0.003), time to recurrence (0.79, 0.70 to 0.89, p=0.0002) and time to distant
        recurrence (0.85, 0.73 to 0.98, p=0.02). Absolute differences in time to recurrence were 2.7% at 5 years and 4.3%
        at 10 years. Overall mortality differed little (0.95, 0.84 to 1.06, p=0.4). Fractures during active treatment numbered
        451 versus 351.
