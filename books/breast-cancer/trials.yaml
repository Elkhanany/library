  neopact:
    acronym: NeoPACT
    arms: carboplatin, docetaxel and pembrolizumab for six cycles, single arm, no anthracycline
    chapters:
    - BC-860
    cited_by:
    - BC-510
    - BC-860
    claim: pCR 58% in 115 patients, single arm
    digest:
      methods: Open-label phase 2 trial with a single group of patients with stage I to III triple-negative breast cancer
        at 2 sites. Neoadjuvant carboplatin (AUC 6) and docetaxel 75 mg/m2 plus pembrolizumab 200 mg were given every 21 days
        for 6 cycles with myeloid growth factor support. Enrolment ran from 2018 to 2022. The primary end point was pathologic
        complete response. Secondary end points were residual cancer burden, event-free survival, toxicity and immune biomarkers.
      results: Among 115 eligible female patients, median age 50 years, 39% had node-positive disease. The pathologic complete
        response rate was 58% (95% CI 48-67) and the rate of residual cancer burden 0 plus 1 was 69% (95% CI 60-78). Grade
        3 or higher immune-mediated adverse events occurred in 3.5% of patients. Estimated 3-year event-free survival was
        86% overall, 98% in the pathologic complete response group and 68% in the no-response group.
    endpoint: pathological complete response
