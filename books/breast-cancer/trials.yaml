      ref: tung2020a
      role: primary
    result: Pathological complete response was 18% with cisplatin and 26% with doxorubicin-cyclophosphamide, risk ratio 0.70
      (90% CI 0.39 to 1.2). Residual cancer burden 0 or 1 was 33% with cisplatin and 46% with doxorubicin-cyclophosphamide,
