  geparsixto:
    acronym: GeparSixto
    arms: carboplatin added to weekly paclitaxel and non-pegylated liposomal doxorubicin vs the same backbone without carboplatin
    chapters:
    - BC-830
    - BC-850
    - BC-860
    cited_by:
    - BC-860
    digest:
      methods: Randomised phase 2 trial. Patients with previously untreated, non-metastatic, stage II-III triple-negative
        or HER2-positive breast cancer received 18 weeks of weekly paclitaxel plus non-pegylated liposomal doxorubicin. Triple-negative
        patients also received bevacizumab. HER2-positive patients also received trastuzumab and lapatinib. Patients were
        randomly assigned 1:1, stratified by subtype and Ki-67, to weekly carboplatin AUC 1.5 (AUC 2.0 for the first 329 patients)
        or no carboplatin. The primary endpoint was pathological complete response (ypT0 ypN0).
      results: 296 patients were assigned carboplatin and 299 no carboplatin. Pathological complete response was 43.7% (129
        patients) versus 36.9% (108 patients), odds ratio 1.33, p=0.107. In triple-negative disease it was 53.2% (84 of 158)
        versus 36.9% (58 of 157), p=0.005. In HER2-positive disease it was 32.8% (45 of 137) versus 36.8% (50 of 136), p=0.581,
        interaction p=0.015. Grade 3 or 4 neutropenia occurred in 65% versus 27%.
    endpoint: pathological complete response, ypT0 ypN0
    line: neoadjuvant
    modality: chemo
    n: 595
    nct: NCT01426880
    os: DFS HR 0.56 (0.34-0.93) in triple-negative disease. OS improvement not statistically significant
    phase: 2
