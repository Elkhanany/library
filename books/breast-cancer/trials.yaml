  ribolaris:
    acronym: RIBOLARIS
    arms: Single arm through the neoadjuvant phase; after surgery patients with a ROR-low score or a pathological complete
      response continue adjuvant ribociclib and endocrine therapy, whereas patients with ROR-medium or ROR-high receive standard
      chemotherapy first.
    chapters:
    - BC-810
    claim: Tests whether molecular response to ribociclib lets high-risk patients skip chemotherapy
    digest:
      methods: Open-label, multicentre phase II trial in patients with stage II, grade 2 or 3 HR-positive, HER2-negative early
        breast cancer judged high risk on a Ki-67 index of 20% or more and/or high genomic risk by a validated gene expression
        signature. All patients receive six 28-day cycles of neoadjuvant ribociclib 600 mg/day, three weeks on and one week
        off, with letrozole 2.5 mg/day. After surgery, patients with a ROR-low score or a pathological complete response continue
        adjuvant ribociclib 400 mg/day for 30 months plus endocrine therapy for at least five years, while patients with ROR-medium
        or ROR-high disease receive standard chemotherapy followed by ribociclib and endocrine therapy. The primary endpoint
        is five-year distant metastasis-free survival in the ROR-low cohort.
      results: This is a rationale and design report and carries no outcome data. Interim futility analyses are planned at
        300 and 800 patient-years, with the primary analysis after 1300 patient-years. The study targets enrolment of 1100
        patients, anticipating 400 ROR-low cases, which gives at least 90% power to detect a five-year distant metastasis-free
        survival of 96% against a benchmark of 90.6% taken from the MINDACT high-risk subgroup. The authors describe it as
        the first prospective trial of a chemotherapy-free, ribociclib-based strategy selected by neoadjuvant molecular response.
    endpoint: Five-year distant metastasis-free survival in the ROR-low cohort.
    line: neoadjuvant
    modality: cdk4-6,endocrine,chemo
    nct: NCT05296746
    note: The only publication on the record is a rationale and trial design paper, so there is no result and no enrolled
      n; the figures of 1100 patients and 400 anticipated ROR-low cases are planned enrolment, not accrual. Treatment spans
      a neoadjuvant and an adjuvant phase and the primary endpoint is measured after surgery, but the record is tagged neoadjuvant
      because the response assessment that drives the whole design is made on neoadjuvant therapy. The source document also
      lists the trial as SOLTI-2011. A low post-treatment risk-of-relapse score is a reclassification, not evidence that chemotherapy
      can be safely omitted; the five-year distant metastasis-free survival endpoint is the decisive test.
    phase: '2'
    population: Patients with stage II, grade 2 or 3 HR-positive, HER2-negative early breast cancer defined as high risk by
      a Ki-67 index of 20% or more and/or high genomic risk on a validated gene expression signature.
