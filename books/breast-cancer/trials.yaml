    digest:
      methods: Randomised multicentre trial comparing first line trastuzumab plus docetaxel with docetaxel alone in patients
        with HER2 positive metastatic breast cancer. Patients were randomly assigned to six cycles of docetaxel 100 mg/m2
        every 3 weeks, with or without trastuzumab given as a 4 mg/kg loading dose followed by 2 mg/kg weekly until disease
        progression.
