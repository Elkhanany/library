  saci-io-hr:
    acronym: SACI-IO HR+
    arms: Sacituzumab govitecan plus pembrolizumab versus sacituzumab govitecan alone, randomised 1 to 1.
    chapters:
    - BC-590
    - BC-890
    claim: pembrolizumab added to sacituzumab govitecan did not improve PFS, 8.4 vs 6.7 months
    digest:
      methods: Randomised phase II trial comparing sacituzumab govitecan with or without pembrolizumab in hormone receptor-positive,
        HER2-negative metastatic breast cancer. Patients pretreated with endocrine therapy and zero or one chemotherapy regimen
        for metastatic disease, with no prior topoisomerase I inhibitor, were randomly assigned 1 to 1 to sacituzumab govitecan
        plus pembrolizumab or sacituzumab govitecan alone. The primary endpoint was progression-free survival. Key secondary
        endpoints were progression-free survival in the PD-L1-positive population, defined by pharmDx 22C3 combined positive
        score of at least 1, together with overall survival, objective response rate and toxicity. Baseline tumour tissue
        and plasma samples were collected for correlative analyses. Enrolment ran from March 2021 to January 2024.
      results: 104 patients started treatment and 47%, 49 patients, had received no chemotherapy for metastatic disease. At
        15.5 months median follow-up, median progression-free survival was 8.4 versus 6.7 months, hazard ratio 0.76 (95% CI
        0.48 to 1.19), P = 0.12. Median overall survival was 20.0 versus 18.0 months (P = 0.18) and objective response rate
        was 28.8% versus 19.2% (P = 0.36). In the PD-L1-positive population, 44% or 39 of the 88 patients with tissue, median
        progression-free survival was 11.1 versus 5.6 months, hazard ratio 0.51 (95% CI 0.24 to 1.12), P = 0.09, and median
        overall survival 18.5 versus 12.5 months, hazard ratio 0.59 (95% CI 0.18 to 1.98), P = 0.39. The most frequent grade
        2 or worse adverse events were neutropenia, alopecia, fatigue, anaemia, nausea, leukopenia and diarrhoea. Neither
        TROP2 expression by immunohistochemistry, immunofluorescence or plasma epigenome-based analysis nor tumour-infiltrating
        lymphocytes were associated with outcomes, while a higher circulating tumour DNA fraction and PIK3CA mutations were
        associated with worse progression-free survival.
    endpoint: Progression-free survival.
    line: 2L
    modality: adc,immunotherapy
    n: 104
    note: The primary endpoint was negative in the population unselected by PD-L1. The PD-L1-positive result is a key secondary
      analysis in 39 of the 88 patients with evaluable tissue, is not statistically significant, and is described by the authors
      as a trend warranting investigation in larger randomised trials, so it should be read as hypothesis-generating. Eligibility
      allowed zero or one prior chemotherapy regimen for metastatic disease on top of prior endocrine therapy and 47% had
      received no chemotherapy for metastatic disease, so the line tag is a single label for a mixed population and the trial
      sits earlier than the third-line setting in which sacituzumab govitecan is registered for this subtype. The abstract
      gives no ClinicalTrials.gov identifier, so no NCT number is recorded.
    os: Median overall survival was 20.0 versus 18.0 months (P = 0.18).
    phase: '2'
    population: Patients with hormone receptor-positive, HER2-negative metastatic breast cancer pretreated with endocrine
