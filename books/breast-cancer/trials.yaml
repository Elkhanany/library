    claim: Ribociclib suppressed proliferation without improving PEPI-0; conference data only
    endpoint: Rate of a preoperative endocrine prognostic index score of 0, PEPI-0, at surgery.
    line: neoadjuvant
    modality: cdk4-6,endocrine
    note: No verified publication was located for this trial. The evidence located is conference or registry material only,
      so the record carries no primary_ref, no pubs and no result, and no figures are recorded. What the source document states
      is that early proliferation suppression with ribociclib did not translate into an improved PEPI-0 rate; that is a conference
      report, and it must be cited as such rather than as a peer-reviewed trial report. Do not cite unrelated ribociclib laboratory
      papers as the trial report. Only the phase comes from the source document's design line, which reads randomised phase
      II and nothing further; the setting, subtype, line, modality, topic and endpoint are inferred from the story line's
