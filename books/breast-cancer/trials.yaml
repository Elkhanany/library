  finher:
    acronym: FinHer
    arms: Nine weekly trastuzumab infusions versus none in HER2-positive disease, inside a randomisation of docetaxel versus
      vinorelbine followed by fluorouracil, epirubicin and cyclophosphamide.
    chapters:
    - BC-820
    - BC-840
    digest:
      methods: Randomised trial. 1010 women with axillary node-positive or high-risk node-negative breast cancer were assigned
        to three cycles of docetaxel or vinorelbine, each followed by three cycles of fluorouracil, epirubicin and cyclophosphamide.
        The 232 women whose tumours had an amplified HER2/neu gene were further assigned to receive or not to receive nine
        weekly trastuzumab infusions. The primary endpoint was recurrence-free survival.
      results: 3-year recurrence-free survival was 91% with docetaxel and 86% with vinorelbine (hazard ratio 0.58, 95% CI
        0.40 to 0.85, P = 0.005), with no difference in overall survival (P = 0.15). Among HER2-positive patients, 3-year
        recurrence-free survival was 89% with trastuzumab and 78% without (hazard ratio 0.42, 95% CI 0.21 to 0.83, P = 0.01).
        Docetaxel caused more adverse effects. Trastuzumab was not associated with decreased left ventricular ejection fraction
        or cardiac failure.
    endpoint: Recurrence-free survival.
    line: adjuvant
    modality: her2,chemo
    n: 1010
    nct: ISRCTN76560285
    note: The trastuzumab comparison is a 232-patient HER2-positive substudy inside a 1010-patient docetaxel versus vinorelbine
      randomisation.
    os: Overall survival did not differ between docetaxel and vinorelbine (P = 0.15). No overall survival result was reported
      for the trastuzumab comparison.
    phase: 3
    population: Women with axillary node-positive or high-risk node-negative early breast cancer, of whom 232 with HER2 amplified
      tumours entered the trastuzumab randomisation.
    primary_ref: joensuu2006
    pubs:
    - kind: primary
      ref: joensuu2006
      role: primary
    result: Among HER2-positive patients, 3-year recurrence-free survival was 89% with trastuzumab and 78% without it (hazard
      ratio 0.42, 95% CI 0.21 to 0.83, P = 0.01).
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 58
      group: Adjuvant trastuzumab
      section: Early nonmetastatic disease
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: pivotal adjuvant trastuzumab given for nine weeks, the short-course signal behind the duration question
    year: 2006
  first:
    acronym: FIRST
    arms: Fulvestrant 500 mg monthly with a day 14 loading dose versus anastrozole 1 mg daily.
    chapters:
    - BC-870
    digest:
      methods: Phase 2 randomised open-label multicentre study in postmenopausal women with hormone receptor-positive advanced
        breast cancer receiving first-line endocrine therapy. Patients received fulvestrant 500 mg per month plus 500 mg on
        day 14 of month 1, or anastrozole 1 mg daily. The primary endpoint was clinical benefit rate, defined as objective
        response or stable disease for at least 24 weeks. The primary analysis was done 6 months after the last patient was
        randomly assigned.
      results: Clinical benefit rate was 72.5% for fulvestrant 500 mg (n=102) and 67.0% for anastrozole (n=103), odds ratio
        1.30, 95% CI 0.72 to 2.38, P=.386. Objective response rate was 36.0% versus 35.5%. Median time to progression was
        not reached with fulvestrant versus 12.5 months with anastrozole, hazard ratio 0.63, 95% CI 0.39 to 1.00, P=.0496.
        Both treatments were well tolerated with no significant difference in prespecified adverse events.
    endpoint: Clinical benefit rate, meaning objective response or stable disease lasting at least 24 weeks.
    line: 1L
    modality: endocrine
    n: 205
    note: The overall survival analysis was added by protocol amendment after the time to progression results, so it was not
      prespecified.
    os: Median overall survival was 54.1 months with fulvestrant 500 mg versus 48.4 months with anastrozole, hazard ratio
      0.70, 95% CI 0.50 to 0.98, P=.04.
    phase: 2
    population: Postmenopausal women with oestrogen or progesterone receptor-positive locally advanced or metastatic breast
      cancer and no previous systemic therapy for advanced disease. Endocrine therapy for early disease was allowed if completed
      more than 12 months before randomisation.
    primary_ref: robertson2009
    pubs:
    - kind: primary
      ref: robertson2009
      role: primary
    - kind: follow-up
      ref: robertson2012
      role: follow-up
    - kind: survival
      ref: ellis2015
      role: os
    result: Clinical benefit rate was 72.5% with fulvestrant 500 mg versus 67.0% with anastrozole, a difference that was not
      significant (odds ratio 1.30, 95% CI 0.72 to 2.38, P=.386).
    reviewed: '2026-09-14'
    setting: metastatic
    source:
    - ch: 68
      group: Fulvestrant / endocrine sequencing
      section: Metastatic disease
    status: reported
    subtype: HR+/HER2-
    topic: fulvestrant versus anastrozole, phase II
    year: 2009
  gap70:
    acronym: GAP70+
    chapters:
    - BC-620
    cited_by:
    - BC-620
    claim: grade 3-5 toxic effects 51% vs 71%, RR 0.74
    digest:
      methods: Cluster-randomised trial in 40 community oncology practice clusters across the USA. Eligible patients were
        aged 70 years and older with incurable solid tumours or lymphoma, had at least one impaired geriatric assessment domain,
        and were starting a new regimen. Clusters were randomly assigned 1:1 to the intervention, in which oncologists received
        a tailored geriatric assessment summary and management recommendations, or usual care. The primary outcome was the
        proportion of patients with any grade 3-5 toxic effect over 3 months.
      results: 718 patients were enrolled. Mean age was 77.2 years and 311 of 718 participants (43%) were female. The mean
        number of impaired geriatric assessment domains was 4.5. Grade 3-5 toxic effects occurred in 177 of 349 patients (51%)
        in the intervention group versus 263 of 369 (71%) with usual care (relative risk 0.74, 95% CI 0.64 to 0.86, p=0.0001).
        Falls over 3 months were 12% versus 21% (adjusted relative risk 0.58).
    line: any
    modality: supportive
    nct: NCT02054741
    phase: 3
    primary_ref: mohile2021
    pubs:
    - kind: primary
      ref: mohile2021
      role: primary
    setting: any
    status: reported
    subtype: all
    topic: geriatric assessment with management recommendations
  gbg-26-big-03-05:
    acronym: GBG 26 / BIG 03-05
    arms: Capecitabine plus continued trastuzumab versus capecitabine alone.
    chapters:
    - BC-900
    digest:
      methods: Randomised trial in patients with HER2-positive breast cancer progressing during trastuzumab. Patients were
        assigned to capecitabine 2,500 mg/m2 on days 1 through 14, given as 1,250 mg/m2 twice daily, alone or with continuation
        of trastuzumab 6 mg/kg, in 3-week cycles. The primary endpoint was time to progression.
      results: 78 patients were assigned to capecitabine and 78 to capecitabine plus trastuzumab. During 15.6 months of follow-up
        there were 65 events and 38 deaths with capecitabine and 62 events and 33 deaths with capecitabine plus trastuzumab.
        Median time to progression was 5.6 versus 8.2 months, hazard ratio 0.69, 95% CI 0.48 to 0.97, P=.0338. Overall response
        rate was 27.0% versus 48.1%, odds ratio 2.50, P=.0115. Toxicity was not increased.
    endpoint: Time to progression.
    line: 2L
    modality: her2,chemo
    n: 156
    os: Median overall survival was 25.5 months with capecitabine plus trastuzumab versus 20.4 months with capecitabine alone,
      a difference that was not significant (P=.257).
    phase: 3
    population: Patients with HER2-positive breast cancer that progressed during treatment with trastuzumab.
    primary_ref: vonminckwitz2009
    pubs:
    - kind: primary
      ref: vonminckwitz2009
      role: primary
    result: Median time to progression was 8.2 months with capecitabine plus trastuzumab versus 5.6 months with capecitabine
      alone, hazard ratio 0.69, 95% CI 0.48 to 0.97, P=.0338.
    reviewed: '2026-09-14'
    setting: metastatic
    source:
    - ch: 72
      group: Continued blockade / alternative antibodies
      section: Metastatic disease
    status: reported
