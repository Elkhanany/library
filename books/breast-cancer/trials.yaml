  destiny-b09:
    acronym: DESTINY-Breast09
    arms: trastuzumab deruxtecan plus pertuzumab vs taxane, trastuzumab and pertuzumab
    chapters:
    - BC-840
    - BC-900
    - BC-910
    cited_by:
    - BC-570
    claim: PFS 40.7 vs 26.9 months, HR 0.56
    digest:
      methods: A phase 3 trial enrolled patients with HER2-positive advanced or metastatic breast cancer and no previous chemotherapy
        or HER2-directed therapy for metastatic disease. Patients were randomly assigned in a 1:1:1 ratio to trastuzumab deruxtecan
        plus pertuzumab, trastuzumab deruxtecan plus placebo, or a taxane with trastuzumab and pertuzumab. The primary end
        point was progression-free survival assessed by blinded independent central review. Secondary end points included
        objective response, duration of response, and safety.
      results: At the February 26, 2025 data cutoff, median progression-free survival was 40.7 months with trastuzumab deruxtecan
        plus pertuzumab (383 patients) and 26.9 months with taxane, trastuzumab, and pertuzumab (387 patients), hazard ratio
        0.56. Confirmed response occurred in 85.1% versus 78.6%, with complete responses in 15.1% and 8.5%. Median duration
        of response was 39.2 versus 26.4 months. Adjudicated drug-related interstitial lung disease or pneumonitis occurred
        in 12.1% versus 1.0%.
    endpoint: progression-free survival by blinded independent central review
    line: 1L
    modality: adc,her2
    n: 770
    nct: NCT04784715
    note: n is the 770 patients in the two groups the primary publication reports. The total randomised across all three groups
      is not stated in the primary publication, so it is not recorded here.
    os: not yet reported
    phase: 3
    population: HER2-positive advanced or metastatic disease with no prior chemotherapy or HER2-directed therapy for metastatic
      disease; randomised 1:1:1, and 770 patients in the two unblinded groups are reported at this prespecified interim analysis,
      383 given the conjugate with pertuzumab and 387 given the taxane triplet, with the third group still blinded
