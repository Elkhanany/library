    population: Adults with brain metastases from systemic cancer who were starting whole-brain radiotherapy.
    primary_ref: brown2013
    pubs:
    - kind: primary
      ref: brown2013
      role: primary
    result: Decline in delayed recall at 24 weeks was smaller with memantine than with placebo, P = .059, which did not reach
      statistical significance. Only 149 patients were analysable at 24 weeks, giving 35% power.
