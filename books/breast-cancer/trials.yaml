      methods: Randomised phase 2 trial in breast cancer survivors within 5 years of diagnosis who had detectable disseminated
        tumour cells on bone marrow aspirate. Patients received hydroxychloroquine, everolimus, or the combination. Primary
        endpoints were feasibility and safety. Secondary endpoints included disseminated tumour cell reduction or clearance
        and recurrence-free survival.
      results: 51 patients with detectable disseminated tumour cells started hydroxychloroquine (15), everolimus (15), or
        both (21). Treatment was feasible and tolerable, and one patient stopped early for grade 3 toxicity. At 42 months
        median follow-up, landmark 3-year recurrence-free survival was 91.7% for hydroxychloroquine, 92.9% for everolimus,
        and 100% for the combination, and was greater in patients who cleared disseminated tumour cells (hazard ratio 0.21,
        95% CI 0.01 to 3.4). Estimated disseminated tumour cell reductions were 80%, 78%, and 87%.
