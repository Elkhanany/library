  talazoparib-beyond-brca:
    acronym: Talazoparib Beyond BRCA
    arms: Single arm of open-label talazoparib monotherapy.
    chapters:
    - BC-550
    - BC-590
    - BC-890
    - BC-920
    claim: talazoparib response 31% beyond BRCA, with regression in every germline PALB2 tumour
    digest:
      methods: Open-label phase II trial of talazoparib monotherapy, Talazoparib Beyond BRCA. Eligible patients had pretreated
        advanced HER2-negative breast cancer (n = 13) or other solid tumours (n = 7) with mutations in homologous recombination
        pathway genes other than BRCA1 and BRCA2, and were themselves wild-type for BRCA1 and BRCA2. Response was assessed
        by RECIST, with clinical benefit defined to include stable disease of at least 6 months. Tumour and plasma circulating
        tumour DNA homologous recombination deficiency scores were measured and correlated with treatment outcomes. A germline
        PALB2-associated mutational signature was also examined against tumour response.
      results: Among the patients with breast cancer, four had a RECIST partial response, an overall response rate of 31%,
        and three additional patients had stable disease of at least 6 months, a clinical benefit rate of 54%. All patients
        with germline PALB2 mutations had treatment-associated tumour regression. Tumour or plasma circulating tumour DNA
        homologous recombination deficiency scores correlated with treatment outcomes and were increased in all germline PALB2
        tumours. A germline PALB2-associated mutational signature was associated with tumour response. The authors conclude
        that talazoparib has efficacy in advanced breast cancer with germline PALB2 mutations, showing activity in the context
        of homologous recombination pathway gene mutations beyond germline BRCA1 and BRCA2.
    endpoint: Overall response rate by RECIST.
    line: 2L,3L+
    modality: parp
    n: 13
    nct: NCT02401347
    note: A basket study of 13 patients with breast cancer and 7 with other solid tumours; n records the breast cancer cohort
      only, because that is the figure the abstract gives for breast cancer and no combined analysed total is stated. Entry
      required wild-type BRCA1 and BRCA2 with a mutation in another homologous recombination gene, so despite sitting in the
      PARP grouping this is not a germline BRCA trial and it carries no BRCA subtype tag. Eligibility was any HER2-negative
      disease and the abstract does not give the hormone receptor split, so the record is tagged across hormone receptor-positive
      and triple-negative disease. The full text required progression on at least one line of therapy for advanced disease
      with no upper limit, and patients had received a median of two prior lines (range 1 to 8), so the line tag is 2L,3L+.
      The abstract does not designate a primary endpoint, so overall response rate is taken as primary from the order in which
      the efficacy results are presented. The response figures rest on four responders among 13 patients and the gene-specific
      signal is confined to germline PALB2, so the result does not validate homologous recombination genes or deficiency scores
      as interchangeable biomarkers.
    os: not reported; the breast cancer cohort of 13 patients reported response and clinical benefit rates only
    phase: '2'
    population: Patients with pretreated advanced HER2-negative breast cancer, wild-type for BRCA1 and BRCA2, whose tumours
      carried a mutation in a homologous recombination pathway gene other than BRCA1 and BRCA2, enrolled alongside a parallel
      cohort of other solid tumours.
    primary_ref: gruber2022
    pubs:
    - kind: primary
      ref: gruber2022
      role: primary
    result: Four of the 13 patients with breast cancer had a RECIST partial response, an overall response rate of 31%, and
      three additional patients had stable disease of at least 6 months, a clinical benefit rate of 54%. All patients with
      germline PALB2 mutations had treatment-associated tumour regression.
    setting: metastatic
    source:
    - ch: 70
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
    - ch: 75
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
    status: reported
    subtype: HR+/HER2-,TNBC
