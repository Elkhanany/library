      methods: Randomised, open label, phase 3 trial at one centre in China between March 2020 and March 2022. Female patients
        with operable high risk triple negative breast cancer, node positive or node negative with Ki-67 of 50% or more, were
        randomised 1:1 after surgery. The carboplatin arm received four cycles of two weekly epirubicin and cyclophosphamide
        then four cycles of weekly paclitaxel with carboplatin. The control arm received four cycles of three weekly or two
        weekly epirubicin and cyclophosphamide then four cycles of weekly paclitaxel. The primary endpoint was disease-free
        survival.
