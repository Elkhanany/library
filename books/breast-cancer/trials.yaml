    arms: Fulvestrant loading dose regimen then monthly injection plus anastrozole 1 mg daily versus anastrozole 1 mg daily
      alone.
    chapters:
    - BC-870
    digest:
      methods: Open-label randomised phase 3 trial. Postmenopausal women, or premenopausal women receiving a gonadotropin-releasing
        hormone agonist, with oestrogen receptor or progesterone receptor positive disease at first relapse after primary
        treatment of localised disease were randomly assigned to a fulvestrant loading dose regimen followed by monthly injection
        plus anastrozole 1 mg daily, or to anastrozole 1 mg daily alone. The primary endpoint was time to progression.
      results: 514 women were assigned to fulvestrant plus anastrozole (258) or anastrozole alone (256). About two thirds
        had received adjuvant antiestrogens and only eight had received an aromatase inhibitor. Median time to progression
        was 10.8 versus 10.2 months (hazard ratio 0.99, 95% CI 0.81 to 1.20, P = .91). Median overall survival was 37.8 versus
        38.2 months (hazard ratio 1.0, P = 1.00). Hot flashes occurred in 24.6% versus 13.8% (P = .0023).
    endpoint: Time to progression.
    line: 1L
    modality: endocrine
    n: 514
    note: Entry required hormone receptor-positive disease with no restriction by HER2 status, so the HER2-negative axis is
      an approximation.
    os: Median overall survival was 37.8 months with fulvestrant plus anastrozole and 38.2 months with anastrozole alone (hazard
      ratio 1.0, 95% CI 0.76 to 1.32, P = 1.00).
    phase: 3
    population: Postmenopausal women, or premenopausal women on a GnRH agonist, with oestrogen or progesterone receptor positive
      disease at first relapse after treatment of localised disease.
    primary_ref: bergh2012
    pubs:
    - kind: primary
      ref: bergh2012
      role: primary
    result: Median time to progression was 10.8 months with fulvestrant plus anastrozole and 10.2 months with anastrozole
      alone (hazard ratio 0.99, 95% CI 0.81 to 1.20, P = .91).
    reviewed: '2026-09-14'
    setting: metastatic
    source:
    - ch: 68
      group: Fulvestrant / endocrine sequencing
      section: Metastatic disease
    status: reported
    subtype: HR+/HER2-
    topic: fulvestrant plus anastrozole versus anastrozole
    year: 2012
  faktion:
    acronym: FAKTION
    arms: Fulvestrant 500 mg plus capivasertib 400 mg twice daily, 4 days on and 3 days off, versus fulvestrant plus placebo.
    chapters:
    - BC-870
    digest:
      methods: Randomised, double-blind, placebo-controlled phase 2 trial at 19 UK hospitals. Postmenopausal women aged at
        least 18 years with ECOG performance status 0 to 2 and oestrogen receptor-positive, HER2-negative metastatic or locally
        advanced inoperable breast cancer who had relapsed or progressed on an aromatase inhibitor were randomly assigned
        1:1 to fulvestrant 500 mg every 28 days plus either capivasertib 400 mg or placebo twice daily on a 4 days on, 3 days
        off schedule.
      results: 183 patients were screened and 140 were randomly assigned, 69 to capivasertib and 71 to placebo. At the primary
        analysis 112 progression-free survival events had occurred, 49 (71%) with capivasertib and 63 (89%) with placebo.
        Median progression-free survival was 10.3 months versus 4.8 months (hazard ratio 0.58, 95% CI 0.39 to 0.84, p = 0.0044).
        Common grade 3 to 4 events were hypertension (32% versus 24%), diarrhoea (14% versus 4%) and rash (20% versus 0).
    endpoint: Progression-free survival in the intention-to-treat population.
    line: 2L
    modality: endocrine,pi3k-akt
    n: 140
    nct: NCT01992952
    note: No participant had prior CDK4/6 inhibitor exposure, which limits how the result transfers to current practice.
    os: Median overall survival was 29.3 months with capivasertib and 23.4 months with placebo (adjusted hazard ratio 0.66,
      95% CI 0.45 to 0.97, p = 0.035), reported in 2022.
    phase: 2
    population: Postmenopausal women with oestrogen receptor-positive, HER2-negative metastatic or locally advanced inoperable
      breast cancer that relapsed or progressed on an aromatase inhibitor.
    primary_ref: jones2020
    pubs:
    - kind: primary
      ref: jones2020
      role: primary
    - kind: biomarker
      ref: howell2022
      role: os and expanded biomarker analysis
    result: Median progression-free survival was 10.3 months with capivasertib and 4.8 months with placebo, each added to
      fulvestrant (hazard ratio 0.58, 95% CI 0.39 to 0.84, p = 0.0044).
    reviewed: '2026-09-14'
    setting: metastatic
    source:
    - ch: 68
      group: PI3K / AKT / mTOR
      section: Metastatic disease
    status: reported
    subtype: HR+/HER2-
    topic: capivasertib plus fulvestrant, phase II
    year: 2020
  falcon:
    acronym: FALCON
    arms: fulvestrant 500 mg vs anastrozole 1 mg
    chapters:
    - BC-430
    - BC-870
    cited_by:
    - BC-430
    - BC-870
    claim: median PFS 16.6 vs 13.8 months, HR 0.797
    digest:
      methods: Phase 3 randomised double-blind trial at 113 hospitals and community centres in 20 countries. Eligible patients
        were postmenopausal, endocrine therapy-naive, with oestrogen receptor-positive or progesterone receptor-positive locally
        advanced or metastatic breast cancer, WHO performance status 0-2 and at least one measurable or non-measurable lesion.
        Patients were randomly assigned 1:1 to fulvestrant 500 mg intramuscularly on days 0, 14 and 28 then every 28 days,
        or anastrozole 1 mg orally daily. The primary endpoint was progression-free survival.
      results: 524 patients were enrolled and 462 were randomised, 230 to fulvestrant and 232 to anastrozole. Progression-free
        survival favoured fulvestrant (hazard ratio 0.797, 95% CI 0.637 to 0.999, p=0.0486). Median progression-free survival
        was 16.6 versus 13.8 months. The most common adverse events were arthralgia (17% versus 10%) and hot flushes (11%
        versus 10%). The 2025 final overall survival analysis reported medians of 44.8 versus 42.7 months (hazard ratio 0.97,
        0.77 to 1.21) after 314 deaths.
    endpoint: progression-free survival
    line: 1L
    modality: endocrine
    n: 462
    nct: NCT01602380
    os: median OS 44.8 vs 42.7 months, HR 0.97, no significant difference
    phase: 3
