      methods: Randomised double-blind trial in patients with breast cancer and bone metastases. Patients received either
        subcutaneous denosumab 120 mg with intravenous placebo, or intravenous zoledronic acid 4 mg adjusted for creatinine
        clearance with subcutaneous placebo, every 4 weeks. Daily calcium and vitamin D were strongly recommended in both
        arms. The primary endpoint was time to first on-study skeletal-related event, defined as pathological fracture, radiation
        or surgery to bone, or spinal cord compression.
      results: Denosumab was superior to zoledronic acid for time to first skeletal-related event, hazard ratio 0.82 (95%
        CI 0.71 to 0.95, P = .01), and for first and subsequent events, rate ratio 0.77 (95% CI 0.66 to 0.89, P = .001). Reduction
        in bone turnover markers was greater with denosumab. Overall survival, disease progression and rates of adverse events
        were similar. Renal adverse events and acute-phase reactions were more frequent with zoledronic acid, and hypocalcaemia
        with denosumab. Osteonecrosis of the jaw occurred in 2.0% on denosumab and 1.4% on zoledronic acid, P = .39.
    endpoint: Time to first on-study skeletal-related event, tested for non-inferiority and then for superiority.
    modality: bone
    n: 2046
    note: The endpoint is a composite of pathological fracture, radiation to bone, surgery to bone and spinal cord compression.
      Two of the four are interventions rather than events, so the composite partly records clinical behaviour rather than
      disease behaviour. That limits how well the absolute rates transfer between health systems.
    os: Overall survival did not differ between the arms, and neither did disease progression.
    phase: 3
    population: Advanced breast cancer with at least one bone metastasis. 1026 patients were assigned denosumab and 1020 zoledronic
      acid.
    primary_ref: stopeck2010
    pubs:
    - kind: primary
      ref: stopeck2010
      role: primary
    result: Denosumab delayed time to first skeletal-related event, hazard ratio 0.82 (95% CI 0.71 to 0.95), P = .01 for superiority.
      For first and subsequent events the rate ratio was 0.77 (95% CI 0.66 to 0.89), P = .001.
    reviewed: '2026-09-16'
    setting: metastatic
    status: reported
    subtype: all
    topic: denosumab versus zoledronic acid for established bone metastases, bone-modifying-agent
    year: 2010
  deposein:
    acronym: DEPOSEIN
    arms: Systemic therapy plus intrathecal liposomal cytarabine versus systemic therapy alone.
    chapters:
    - BC-930
    digest:
      methods: Randomised open-label phase 3 study. Patients with newly diagnosed leptomeningeal metastasis from breast cancer,
        defined by tumour cells in the cerebrospinal fluid or by combined clinical and neuroimaging signs, were randomised
        to systemic therapy alone or systemic therapy plus intrathecal liposomal cytarabine. The primary endpoint was progression-free
        survival related to leptomeningeal metastasis.
      results: Thirty-seven patients were assigned to control and 36 to the experimental group. The median number of liposomal
        cytarabine injections was 5. Median leptomeningeal progression-free survival was 2.2 months (95% CI 1.3 to 3.1) versus
        3.8 months (95% CI 2.3 to 6.8), hazard ratio 0.61 (95% CI 0.38 to 0.98), p equal to 0.04. Median overall survival
        was 4.0 versus 7.3 months, hazard ratio 0.85, p equal to 0.51. Serious adverse events occurred in 22 and 30 patients.
    endpoint: Progression-free survival related to leptomeningeal metastasis.
    modality: chemo
    n: 73
    nct: NCT01645839
    note: Intrathecal treatment was added to whatever systemic therapy the patient was receiving, so the trial does not sit
      on a defined treatment line and no breast cancer subtype was required.
    os: Median overall survival was 7.3 months with intrathecal liposomal cytarabine versus 4.0 months with systemic therapy
      alone, hazard ratio 0.85 (95% CI 0.53 to 1.36), p equal to 0.51, which was not significant.
    phase: 3
    population: Newly diagnosed leptomeningeal metastasis from breast cancer, defined by tumour cells in cerebrospinal fluid
      or by clinical and neuroimaging signs.
    primary_ref: lerhun2020
    pubs:
    - kind: primary
      ref: lerhun2020
      role: primary
    result: Median leptomeningeal progression-free survival was 3.8 months with added intrathecal liposomal cytarabine versus
      2.2 months with systemic therapy alone, a hazard ratio of 0.61 (95% CI 0.38 to 0.98) for progression or death, p equal
      to 0.04.
    reviewed: '2026-09-14'
    setting: cns
    source:
    - group: Intrathecal chemotherapy in breast cancer leptomeningeal disease
      section: Brain and leptomeningeal metastases
    status: reported
    subtype: all
    topic: intrathecal liposomal cytarabine plus systemic therapy versus systemic therapy alone, leptomeningeal
    year: 2020
  destiny-b03:
    acronym: DESTINY-Breast03
    arms: Trastuzumab deruxtecan versus trastuzumab emtansine, randomised 1:1 in a multicentre open-label trial.
    chapters:
    - BC-900
    - BC-910
    cited_by:
    - BC-570
    - BC-460
    claim: PFS 28.8 vs 6.8 months; OS not reached in either arm, HR 0.64
    digest:
      methods: A phase 3, multicenter, open-label, randomized trial compared trastuzumab deruxtecan, a HER2 antibody-drug
        conjugate, with trastuzumab emtansine. Patients had HER2-positive metastatic breast cancer previously treated with
        trastuzumab and a taxane. The primary end point was progression-free survival as determined by blinded independent
        central review. Secondary end points included overall survival, objective response, and safety.
      results: Among 524 randomly assigned patients, 75.8% were alive without disease progression at 12 months with trastuzumab
        deruxtecan versus 34.1% with trastuzumab emtansine, hazard ratio 0.28. Alive at 12 months were 94.1% versus 85.9%,
        hazard ratio 0.55. Overall response occurred in 79.7% versus 34.2%. Adjudicated drug-related interstitial lung disease
        or pneumonitis occurred in 10.5% versus 1.9%. The long-term survival analysis reported median overall survival of
        52.6 versus 42.7 months, hazard ratio 0.73.
    endpoint: progression-free survival by blinded independent review
    line: 2L
    modality: adc
    n: 524
    nct: NCT03529110
    os: median 52.6 months against 42.7 months, hazard ratio 0.73, in the long-term analysis
    phase: 3
    population: HER2-positive metastatic disease previously treated with trastuzumab and a taxane, all conjugate-naive
    primary_ref: cortes2022destinyb03
    pubs:
