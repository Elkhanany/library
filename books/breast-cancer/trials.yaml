  perelisa:
    acronym: PerELISA
    arms: letrozole with trastuzumab and pertuzumab in molecular responders; weekly paclitaxel with trastuzumab and pertuzumab
      in non-responders
    chapters:
    - BC-840
    cited_by:
    - BC-840
    digest:
      methods: Phase II multicentre study in postmenopausal patients with hormone receptor-positive, HER2-positive operable
        breast cancer. Patients received 2 weeks of letrozole, then re-biopsy for Ki67. Molecular responders, defined by a
        relative Ki67 reduction above 20%, continued letrozole and began five cycles of trastuzumab plus pertuzumab. Molecular
        non-responders received weekly paclitaxel for 13 weeks with trastuzumab plus pertuzumab. The primary aim was breast
        and axillary pathological complete response under a two-stage Simon design requiring at least 8 of 43.
      results: Sixty-four patients were enrolled and 44 were molecular responders. All 44 completed letrozole with trastuzumab
        and pertuzumab and had surgery. Pathological complete response occurred in 9 of 44 (20.5%, 95% CI 11.1% to 34.5%).
        Among molecular non-responders, 16 of 17 completed treatment and had surgery, with pathological complete response
        in 81.3%. PAM50 subtype was associated with Ki67 response and with pathological complete response. Among molecular
        responders the rate was 45.5% in HER2-enriched tumours versus 13.8% in other subtypes (P=0.042).
    endpoint: breast and axillary pathological complete response
    line: neoadjuvant
    modality: her2,endocrine,chemo
    n: 64
    nct: NCT02411344
    os: not reported
    phase: 2
    population: postmenopausal hormone receptor-positive HER2-positive operable disease, allocated by relative Ki67 fall above
      20% after 2 weeks of letrozole
    primary_ref: guarneri2019perelisa
    pubs:
    - kind: primary
      ref: guarneri2019perelisa
      role: primary
    result: pCR in 9 of 44 molecular responders, 20.5%, 95% CI 11.1 to 34.5; 81.3% among the 16 non-responders who had surgery;
      pCR 45.5% in HER2-enriched against 13.8% in other subtypes
    setting: early
