    endpoint: event-free survival
    line: neoadjuvant
    modality: immunotherapy,chemo
    n: 1550
    os: HR 0.86 (0.62-1.19), 4-year difference 0.7 points
    phase: 3
    population: TNBC stage II-III
    primary_ref: loibl2026b59
    result: HR 0.80, stratified log-rank P=0.083, 4-year EFS difference 3.3 points. Primary endpoint not met
    setting: early
    status: reported
    subtype: TNBC
    topic: atezolizumab added to neoadjuvant and adjuvant chemotherapy
    year: 2026
  bcirg006:
    acronym: BCIRG-006
    arms: doxorubicin and cyclophosphamide then docetaxel with trastuzumab, or docetaxel and carboplatin with trastuzumab,
      vs doxorubicin and cyclophosphamide then docetaxel alone
    cited_by:
    - BC-820
    endpoint: disease-free survival
    line: adjuvant
    modality: her2,chemo
    n: 3222
    os: 5-year overall survival 92%, 91% and 87% respectively
    phase: 3
    population: HER2+ early-stage breast cancer, node-positive or high-risk node-negative
    primary_ref: slamon2011
    result: 5-year disease-free survival 84% with the anthracycline and trastuzumab regimen, 81% with docetaxel, carboplatin
      and trastuzumab, and 75% without trastuzumab; no significant difference between the two trastuzumab regimens
    setting: early
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: pivotal adjuvant trastuzumab given with and without an anthracycline at the standard one-year duration
    year: 2011
  big1-98:
    acronym: BIG 1-98
    arms: letrozole for 5 years vs tamoxifen for 5 years, with sequential arms in the four-arm option
    cited_by:
    - BC-790
    claim: letrozole monotherapy superior to tamoxifen monotherapy; sequences not superior to letrozole alone
    endpoint: disease-free survival
    line: adjuvant
    modality: endocrine
    n: 8010
    os: overall survival HR 0.87 (0.77-0.999) by intention to treat
    phase: 3
    population: postmenopausal hormone receptor-positive early breast cancer; two-arm and four-arm randomisation options,
      8.1 years median follow-up
    primary_ref: regan2011
    result: letrozole monotherapy vs tamoxifen monotherapy, disease-free survival HR 0.86 (0.78-0.96) by intention to treat;
      sequential arms did not differ from letrozole monotherapy on any of four endpoints
    setting: early
    status: reported
    subtype: HR+/HER2-,HR+/HER2+
    topic: letrozole versus tamoxifen alone and in sequence, ai-vs-tamoxifen
    year: 2011
  bolero2:
    acronym: BOLERO-2
    arms: everolimus plus exemestane vs placebo plus exemestane
    cited_by:
    - BC-170
    - BC-560
    - BC-870
    endpoint: progression-free survival
    line: 2L
    modality: endocrine,other
    n: 724
    os: median OS 31.0 vs 26.6 months, HR 0.89, not significant
    phase: 3
    population: postmenopausal HR+/HER2- recurring or progressing on a non-steroidal aromatase inhibitor, biomarker unselected
    primary_ref: baselga2012
    result: progression-free survival more than doubled with everolimus at the interim analysis
    setting: metastatic
    status: reported
    subtype: HR+/HER2-
    topic: everolimus with exemestane
    year: 2012
  brightness:
    acronym: BrighTNess
    arms: paclitaxel with carboplatin and veliparib, or with carboplatin alone, or alone, each followed by doxorubicin and
      cyclophosphamide
    cited_by:
    - BC-860
    endpoint: pathological complete response
    line: neoadjuvant
    modality: chemo,parp
    n: 634
    os: 4.5-year EFS HR 0.57 (0.36-0.91) for carboplatin with paclitaxel against paclitaxel alone. OS did not differ between
      arms
    phase: 3
    population: stage II-III TNBC, randomisation stratified by germline BRCA status
    primary_ref: loibl2018brightness
    result: pCR 53% with veliparib and carboplatin vs 58% with carboplatin vs 31% with paclitaxel alone. Veliparib added nothing,
      P=0.36
    setting: early
    status: reported
    subtype: TNBC
    topic: neoadjuvant platinum and PARP inhibition, carboplatin, veliparib
    year: 2018
  calgb40603:
    acronym: CALGB 40603
    arms: carboplatin and bevacizumab, each added or not in a 2 x 2, to weekly paclitaxel followed by dose-dense doxorubicin
      and cyclophosphamide
    cited_by:
    - BC-860
    endpoint: pathological complete response in breast and axilla
    line: neoadjuvant
    modality: chemo
    n: 443
    os: no long-term benefit from carboplatin at median 7.9 years follow-up
    phase: 2
    population: stage II-III TNBC
    primary_ref: sikov2015
    result: pCR in breast and axilla 54% with carboplatin vs 41%, P=0.0029. pCR in breast 60% vs 44%, P=0.0018
