  ncctg-n107c-cec-3:
    acronym: NCCTG N107C / CEC.3
    arms: Postoperative stereotactic radiosurgery to the cavity versus whole brain radiotherapy
    chapters:
    - BC-930
    digest:
      methods: Randomised controlled phase 3 trial at 48 institutions in the USA and Canada. Adults with one resected brain
        metastasis and a resection cavity under 5.0 cm were assigned 1:1 to postoperative radiosurgery of 12 to 20 Gy in a
        single fraction by cavity volume, or whole brain radiotherapy of 30 Gy in ten fractions or 37.5 Gy in 15 fractions.
        Analyses were by intention to treat.
      results: 194 patients were randomised, 98 to radiosurgery and 96 to whole brain radiotherapy, with median follow-up
        11.1 months. Median cognitive-deterioration-free survival was 3.7 versus 3.0 months, hazard ratio 0.47, p<0.0001.
        Cognitive deterioration at 6 months was 52% versus 85%. Median overall survival was 12.2 versus 11.6 months, hazard
        ratio 1.07, p=0.70. Commonest grade 3 or 4 events were hearing impairment and cognitive disturbance.
    endpoint: Co-primary cognitive-deterioration-free survival and overall survival
    modality: radiation
    n: 194
    nct: NCT01372774
    note: The trial enrolled patients with a resected brain metastasis of any primary histology rather than breast cancer
      only.
    os: Median overall survival was 12.2 months with radiosurgery and 11.6 months with whole brain radiotherapy, hazard ratio
      1.07, p=0.70. There was no difference between the arms.
    phase: 3
    population: Adults with one resected brain metastasis and a resection cavity less than 5.0 cm in maximal extent.
    primary_ref: brown2017
    pubs:
    - kind: primary
      ref: brown2017
      role: primary
    - kind: follow-up
      ref: palmer2022
      role: long-term secondary analysis
    result: Median cognitive-deterioration-free survival was 3.7 months with radiosurgery versus 3.0 months with whole brain
      radiotherapy, hazard ratio 0.47, p<0.0001. Cognitive deterioration at 6 months occurred in 52% versus 85% of evaluable
