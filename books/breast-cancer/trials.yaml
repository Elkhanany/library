  capitello-290:
    acronym: CAPItello-290
    arms: Capivasertib plus paclitaxel versus placebo plus paclitaxel.
    chapters:
    - BC-920
    digest:
      methods: Randomised global phase 3 trial. Patients with previously untreated metastatic triple-negative breast cancer
        were randomised 1:1 to paclitaxel 80 mg/m2 on day 1 of weeks 1 to 3 of each 4-week cycle plus either capivasertib
        400 mg or placebo twice daily on days 2 to 5 of those weeks. PIK3CA, AKT1 and PTEN alterations were analysed by retrospective
        central molecular testing. Dual primary endpoints were overall survival overall and in altered tumours, with investigator-assessed
        progression-free survival a key secondary endpoint.
      results: 812 patients were randomised from July 2019 to February 2022 and 30.7% had PIK3CA, AKT1 or PTEN alterations.
        Median overall survival was 17.7 versus 18.0 months (hazard ratio 0.92, 95% CI 0.78 to 1.08, p=0.3239), and 20.4 months
        in both arms among altered tumours (hazard ratio 1.05, p=0.7602). Median progression-free survival was 5.6 versus
        5.1 months (hazard ratio 0.72), and 7.5 versus 5.6 months in altered tumours (hazard ratio 0.70). Grade 3 or worse
        diarrhoea occurred in 12.7% versus 0.7%.
    endpoint: Dual primary endpoint of overall survival in the overall population and in patients with PIK3CA, AKT1 or PTEN
      altered tumours.
    line: 1L
    modality: pi3k-akt,chemo
    n: 812
    os: Median overall survival was 17.7 versus 18.0 months in the overall population, hazard ratio 0.92 (95% CI 0.78 to 1.08),
      and 20.4 months in both arms among altered tumours, hazard ratio 1.05 (95% CI 0.77 to 1.43).
    phase: 3
    population: Patients with previously untreated metastatic triple-negative breast cancer, with PIK3CA, AKT1 or PTEN alterations
      assessed retrospectively.
    primary_ref: schmid2025
    pubs:
