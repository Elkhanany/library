  helen-006:
    acronym: HELEN-006
    arms: Weekly nab-paclitaxel with trastuzumab and pertuzumab versus docetaxel plus carboplatin with trastuzumab and pertuzumab.
    chapters:
    - BC-830
    - BC-840
    digest:
      methods: Multicentre randomised phase 3 trial at six hospitals in China. Patients aged 18 to 70 with untreated stage
        II to III HER2-positive breast cancer were assigned 1:1, stratified by tumour stage, nodal status and hormone receptor
        status. One group received nab-paclitaxel 125 mg/m2 on days 1, 8 and 15 for six 3-week cycles, the other docetaxel
        75 mg/m2 plus carboplatin AUC 6 for six 3-week cycles. Both received concurrent trastuzumab and pertuzumab. The primary
        endpoint was pathological complete response.
      results: 689 of 789 screened patients were randomly assigned and 669 started treatment. All were Asian women with a
        median age of 50 years, and median follow-up was 26 months. Pathological complete response occurred in 220 patients
        (66.3%, 95% CI 61.2 to 71.4) given nab-paclitaxel versus 194 (57.6%, 52.3 to 62.9) given docetaxel plus carboplatin,
        odds ratio 1.54, 95% CI 1.10 to 2.14, p=0.011. Grade 3-4 adverse events occurred in 30% versus 38%.
    endpoint: Pathological complete response, defined as ypT0/is ypN0.
    line: neoadjuvant
    modality: chemo,her2
    n: 689
    nct: NCT04547907
    note: Both arms are anthracycline-free, which is what the tag records. The trial changes the taxane formulation and the
      carboplatin at once, so it cannot attribute its gain to either alone, and it enrolled Asian women only.
    os: Not yet reported. Follow-up of the adjuvant phase is ongoing.
    phase: 3
    population: Asian patients aged 18 to 70 with untreated stage II to III invasive HER2-positive breast cancer and ECOG
      performance status 0 or 1.
    primary_ref: chen2024a
    pubs:
    - kind: primary
      ref: chen2024a
      role: primary
    result: Pathological complete response occurred in 66.3% of patients given nab-paclitaxel (220 of 332) versus 57.6% given
      docetaxel plus carboplatin (194 of 337), odds ratio 1.54, 95% CI 1.10 to 2.14, stratified p=0.011.
