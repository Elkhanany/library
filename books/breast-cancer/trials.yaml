    arms: Tamoxifen alone versus tamoxifen plus a gonadotropin-releasing hormone analogue versus an aromatase inhibitor plus
      a gonadotropin-releasing hormone analogue, each given for 6 months.
    chapters:
    - BC-630
    - BC-790
    claim: 3-month median estradiol +67% with tamoxifen, -85% with tam+GnRHa, -72% with AI+GnRHa
    digest:
      methods: Multicentre phase 2 randomised clinical trial that assessed 56 male patients with hormone receptor-positive
        breast cancer, recruited from 24 breast units across Germany between October 2012 and May 2017. Patients were randomised
        to one of three arms, tamoxifen alone, tamoxifen plus a gonadotropin-releasing hormone analogue, or an aromatase inhibitor
        plus a gonadotropin-releasing hormone analogue, each for 6 months. The primary endpoint was the change in estradiol
        levels from baseline to 3 months. Secondary endpoints were changes in estradiol after 6 months, changes in additional
        hormonal parameters, adverse effects, sexual function and quality of life after 3 and 6 months. The last patient completed
        6 months of treatment in December 2017, the analysis data set was locked on 24 August 2018 and analysis was completed
        on 19 December 2018.
      results: Of the 56 patients, 52 started treatment, with a median age of 61.5 years, range 37 to 83. Three patients discontinued
        study treatment prematurely, one in each arm, and 50 patients were evaluable for the primary endpoint. After 3 months
        median estradiol levels increased by 67 percent, a change of +17.0 ng/L, with tamoxifen, decreased by 85 percent,
        -23.0 ng/L, with tamoxifen plus GnRH analogue, and decreased by 72 percent, -18.5 ng/L, with aromatase inhibitor plus
        GnRH analogue, p less than 0.001. After 6 months median estradiol levels increased by 41 percent, +12 ng/L, with tamoxifen,
        decreased by 61 percent, -19.5 ng/L, with tamoxifen plus GnRH analogue, and decreased by 64 percent, -17.0 ng/L, with
        aromatase inhibitor plus GnRH analogue, p less than 0.001. Sexual function and quality of life decreased when the
        GnRH analogue was added but were unchanged with tamoxifen alone.
    endpoint: The change in estradiol levels from baseline to 3 months.
    line: any
    modality: endocrine
    n: 56
    nct: NCT01638247
    note: The primary endpoint is hormonal, the change in estradiol at 3 months, and the secondary endpoints are other hormonal
      parameters, adverse effects, sexual function and quality of life. The trial reports no recurrence or survival outcomes,
      so it cannot rank the three regimens for efficacy and the tabulated result is an endocrine-physiology result only. Of
