  bioper:
    acronym: BioPER
    arms: Single arm of palbociclib continued at the dose used in the prior regimen plus endocrine therapy of physician's
      choice.
    chapters:
    - BC-870
    - BC-880
    claim: clinical benefit rate 34.4% and median PFS 2.6 months on palbociclib rechallenge
    digest:
      methods: Multicentre, open-label, phase II trial assessing continuation of palbociclib plus endocrine therapy beyond
        progression on a prior palbociclib-based regimen in hormone receptor-positive, HER2-negative advanced breast cancer.
        Eligible women had progressive disease after having achieved clinical benefit on the immediately prior palbociclib
        plus endocrine therapy regimen. Palbociclib was given at 125 mg, 100 mg or 75 mg daily orally for three weeks on and
        one week off, as per the prior palbociclib-based regimen, with endocrine therapy of physician's choice in four-week
        cycles until progression or unacceptable toxicity. Coprimary endpoints were clinical benefit rate and the percentage
        of tumours with baseline loss of retinoblastoma protein expression. Additional endpoints were safety and biomarker
        analysis.
      results: Among 33 patients enrolled, clinical benefit rate was 34.4% (95% CI 18.6 to 53.2; P < 0.001) and 13.0% of tumours
        (95% CI 5.2 to 27.5) showed loss of Rb protein expression, so both coprimary endpoints were met. Median progression-free
        survival was 2.6 months (95% CI 1.8 to 6.7). No new safety signals were reported. A signature combining baseline mediators
        of resistance to palbociclib and endocrine therapy, namely low Rb score, high cyclin E1 score and ESR1 mutation, was
        independently associated with shorter median progression-free survival (HR 22.0, 95% CI 1.71 to 282.9; P = 0.018).
        The authors conclude that maintaining palbociclib after progression seems a reasonable investigational approach for
        selected patients and that the composite signature warrants validation in larger randomised trials.
    endpoint: Coprimary endpoints of clinical benefit rate and the percentage of tumours with baseline loss of retinoblastoma
      protein expression.
    line: 2L
    modality: cdk4-6,endocrine
    n: 33
    note: Single-arm rechallenge study in 33 patients, not a randomised continuation strategy, so the clinical benefit rate
      carries no comparison against stopping palbociclib. One of the two coprimary endpoints is a biomarker prevalence endpoint,
      the proportion of tumours with baseline Rb loss, rather than a clinical outcome. The resistance signature is exploratory
      and its hazard ratio of 22.0 has a confidence interval from 1.71 to 282.9, so it is a hypothesis rather than a validated
      predictor. The full text allowed up to two prior endocrine lines and no more than one line of chemotherapy for advanced
      disease, and 75% of patients were treated in the second line, so the line axis is 2L. The abstract gives no NCT number
      and no overall survival, so both fields are omitted.
    os: not reported; the coprimary endpoints were clinical benefit rate and baseline loss of retinoblastoma protein expression
    phase: '2'
    population: Women with hormone receptor-positive, HER2-negative advanced breast cancer who had progressive disease after
      achieving clinical benefit on the immediately prior palbociclib plus endocrine therapy regimen.
    primary_ref: albanell2023
    pubs:
    - kind: primary
      ref: albanell2023
      role: primary
    result: Clinical benefit rate was 34.4% (95% CI 18.6 to 53.2; P < 0.001) and 13.0% of tumours (95% CI 5.2 to 27.5) showed
      loss of Rb protein expression, meeting both coprimary endpoints. Median progression-free survival was 2.6 months (95%
      CI 1.8 to 6.7).
    setting: metastatic
    source:
    - ch: 69
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
    status: reported
    subtype: HR+/HER2-
    topic: palbociclib rechallenge with a changed endocrine partner after progression on palbociclib
    weight: exploratory
