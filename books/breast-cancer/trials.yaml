      group: Early triple-positive (HR+/HER2+) disease
      section: Early nonmetastatic disease
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: chemotherapy-free trastuzumab plus lapatinib, with ET for HR-positive disease
    year: 2017
  panacea:
    acronym: PANACEA
    arms: Single arm. Phase 1b was a 3 + 3 dose escalation of pembrolizumab at 2 mg/kg and 10 mg/kg every 3 weeks with trastuzumab
      6 mg/kg in PD-L1-positive tumours; phase 2 gave flat-dose pembrolizumab 200 mg every 3 weeks plus standard trastuzumab
      in parallel PD-L1-positive and PD-L1-negative cohorts.
    chapters:
    - BC-900
    claim: objective response in 15% of PD-L1-positive tumours and in none that were PD-L1-negative
    digest:
      methods: Single-arm, multicentre phase 1b-2 trial at 11 centres in five countries, testing whether trastuzumab resistance
        in HER2-positive breast cancer is mediated by immune mechanisms that PD-1 blockade could reverse. Eligible women had
        advanced HER2-positive breast cancer with documented progression during previous trastuzumab-based therapy, performance
        status 0 or 1, and a formalin-fixed metastatic biopsy for central PD-L1 assessment. Phase 1b enrolled PD-L1-positive
        tumours in a 3 + 3 dose escalation of intravenous pembrolizumab at 2 mg/kg and 10 mg/kg every 3 weeks with trastuzumab
        6 mg/kg, its primary endpoint being dose-limiting toxicity and the recommended phase 2 dose, although a protocol amendment
        in August 2015 fixed pembrolizumab at a flat 200 mg every 3 weeks. Phase 2 enrolled PD-L1-positive and PD-L1-negative
        tumours in parallel cohorts at the flat dose with standard trastuzumab, with the proportion of PD-L1-positive patients
        achieving an objective response as its primary endpoint.
      results: Between February 2015 and April 2017, six patients entered phase 1b, three at each pembrolizumab dose, and
        52 entered phase 2, of whom 40 had PD-L1-positive and 12 PD-L1-negative tumours. There were no dose-limiting toxicities
        in phase 1b. Median follow-up in phase 2 was 13.6 months for PD-L1-positive and 12.2 months for PD-L1-negative patients.
        Six (15%, 90% CI 7-29) of 40 PD-L1-positive patients achieved an objective response and there were no responders among
        the PD-L1-negative patients. Fatigue was the commonest treatment-related adverse event of any grade, in 12 (21%) of
        58 patients; grade 3-5 adverse events occurred in 29 (50%), treatment-related grade 3-5 events in 17 (29%), and there
        was one treatment-related death from Lambert-Eaton syndrome in a PD-L1-negative patient.
    endpoint: The proportion of PD-L1-positive patients achieving an objective response, in phase 2; incidence of dose-limiting
      toxicity and the recommended phase 2 dose, in phase 1b.
    line: 3L+
    modality: her2,immunotherapy
    n: 58
    nct: NCT02129556
    note: Single-arm early-phase study with no comparator, so the response rate is an activity signal rather than evidence
      of benefit over standard treatment. n is the 58 patients treated across both phases, six in phase 1b and 52 in phase
      2, while the primary response figure applies only to the 40 phase 2 patients with PD-L1-positive tumours. Entry required
      progression on prior trastuzumab-based therapy and the investigators describe the population as heavily pretreated,
      so line is recorded as 3L+. The abstract reports no overall survival.
    os: Not reported. The primary publication gives objective response, clinical benefit and safety in a single arm.
    phase: 1/2
    population: Women aged 18 years or older with advanced, histologically confirmed HER2-positive breast cancer and documented
      progression during previous trastuzumab-based therapy, performance status 0 or 1, with a metastatic tumour biopsy available
      for central assessment of PD-L1 status.
    primary_ref: loi2019a
    pubs:
    - kind: primary
      ref: loi2019a
      role: primary
    result: Six (15%, 90% CI 7-29) of 40 patients with PD-L1-positive tumours achieved an objective response. There were no
      objective responders among the patients with PD-L1-negative tumours.
    reviewed: '2026-09-16'
    setting: metastatic
    source:
    - ch: 72
      section: Additional studies — Metastatic HER2+ / HR+HER2+
    status: reported
    subtype: HER2+
    topic: checkpoint blockade added to trastuzumab in trastuzumab-resistant disease, with central PD-L1 selection
    weight: exploratory
    year: 2019
  patchell-cord-compression-trial:
    acronym: Patchell decompressive surgery trial
    arms: Direct decompressive surgery followed by radiotherapy versus radiotherapy alone, with ten 3 Gy fractions given in
      both arms.
    chapters:
    - BC-600
    digest:
      methods: Randomised multi-institutional non-blinded trial. Patients with spinal cord compression caused by metastatic
        cancer were assigned to surgery followed by radiotherapy or to radiotherapy alone, with ten 3 Gy fractions in both
        arms. The primary endpoint was the ability to walk. Secondary endpoints were urinary continence, muscle strength,
        functional status, the need for corticosteroids and opioids, and survival.
      results: The study was stopped early when a predetermined stopping rule was met, after 101 of 123 assessed patients
        had been randomised. 42 of 50 in the surgery arm walked after treatment against 29 of 51 in the radiotherapy arm,
        odds ratio 6.2 (95% CI 2.0 to 19.8, P = .001). Median retained ambulation was 122 days against 13 days (P = .003).
        Of 32 patients entering unable to walk, 10 of 16 regained ambulation with surgery against 3 of 16 without (P = .01).
        The need for corticosteroids and opioids was lower after surgery.
    endpoint: Ability to walk after treatment.
    modality: surgery,radiation
    n: 101
    note: Enrolment was metastatic cancer of any primary site rather than breast cancer. The trial stopped early at a prespecified
      interim analysis, which tends to inflate the estimated effect. The publication states no phase.
    population: Patients with spinal cord compression from metastatic cancer of any primary site. 50 were assigned surgery
      followed by radiotherapy and 51 radiotherapy alone.
    primary_ref: patchell2005
    pubs:
    - kind: primary
      ref: patchell2005
      role: primary
    result: 42 of 50 patients walked after surgery and radiotherapy against 29 of 51 after radiotherapy alone, odds ratio
      6.2 (95% CI 2.0 to 19.8), P = .001. Median time with retained ambulation was 122 days against 13. Of the 32 who entered
      unable to walk, 10 of 16 regained ambulation with surgery against 3 of 16 without.
    reviewed: '2026-09-16'
    setting: metastatic
    status: reported
    subtype: all
    topic: decompressive surgery added to radiotherapy for metastatic spinal cord compression, cord-compression
    year: 2005
  patina:
    acronym: PATINA
    arms: palbociclib added to maintenance HER2-targeted and endocrine therapy vs maintenance HER2-targeted and endocrine
      therapy alone
    chapters:
    - BC-840
    - BC-910
    cited_by:
    - BC-570
    claim: PFS 44.3 vs 29.1 months, HR 0.75
    digest:
      methods: Phase 3, open-label, randomized trial in patients with hormone-receptor-positive, HER2-positive metastatic
        breast cancer who did not have disease progression after four to eight cycles of chemotherapy plus HER2-targeted therapy.
        Patients were randomly assigned 1:1 to receive maintenance HER2-targeted and endocrine therapies with or without palbociclib.
        The primary end point was investigator-assessed progression-free survival. Secondary end points included objective
        response, clinical benefit, safety and overall survival.
      results: 518 patients underwent randomization, 261 to palbociclib and 257 to standard therapy. At a median follow-up
        of 53.5 months, median progression-free survival was 44.3 months with palbociclib versus 29.1 months with standard
        therapy (hazard ratio 0.75, 95% CI 0.59 to 0.96, two-sided P = 0.02). Grade 3 adverse events occurred in 79.7% of
        the palbociclib group and 30.6% of the standard-therapy group. Grade 4 events occurred in 10.0% and 3.6%. Neutropenia
        predominated.
    endpoint: investigator-assessed progression-free survival
    line: 1L
    modality: cdk4-6,her2,endocrine
    n: 518
    nct: NCT02947685
    os: not yet reported
    phase: 3
    population: hormone receptor-positive HER2-positive metastatic disease without progression after four to eight cycles
      of induction chemotherapy with HER2-targeted therapy
    primary_ref: metzger2026patina
    pubs:
    - kind: primary
      ref: metzger2026patina
      role: primary
    result: median progression-free survival 44.3 vs 29.1 months, HR 0.75, 95% CI 0.59 to 0.96, P = 0.02
    reviewed: '2026-09-14'
    setting: metastatic
    source:
    - ch: 73
      group: CDK4/6 combinations
      section: Metastatic disease
    status: reported
    subtype: HR+/HER2+
    topic: palbociclib maintenance after induction
    year: 2026
  patricia:
    acronym: PATRICIA
    arms: Single arm of standard-dose pertuzumab plus high-dose trastuzumab at 6 mg/kg weekly.
    chapters:
    - BC-930
    digest:
      methods: Single-arm study in patients with HER2-positive metastatic breast cancer and progressive central nervous system
        metastases after radiotherapy. Patients received standard-dose pertuzumab plus high-dose trastuzumab 6 mg/kg weekly
        until central nervous system or systemic progression or unacceptable toxicity. The primary endpoint was confirmed
        central nervous system objective response rate. Secondary endpoints were response duration, clinical benefit rate,
        progression-free survival, overall survival, safety and patient-reported outcomes. This report adds 21 months of follow-up.
      results: 39 patients had completed or discontinued treatment by the cut-off. Confirmed central nervous system objective
        response rate was 11% (95% CI 3.0-25.4). Median central nervous system progression-free survival was 4.6 months (95%
        CI 4.0-8.9), as was combined central nervous system or systemic progression-free survival. Median overall survival
        was 27.2 months. Six-month central nervous system clinical benefit rate was 51% (19 patients). Treatment-related grade
        3/4 adverse events occurred in 7.7%.
    endpoint: Confirmed central nervous system objective response rate by Response Assessment in Neuro-Oncology Brain Metastases
      criteria.
    modality: her2
    nct: NCT02536339
    note: The abstract states only that 39 patients had completed or discontinued treatment and gives no prior treatment line,
      so number enrolled and line are left null.
    os: Median overall survival was 27.2 months (95% CI 16.1 to not reached).
    phase: 2
    population: Patients with HER2-positive metastatic breast cancer and central nervous system metastases progressing after
      radiotherapy.
    primary_ref: lin2023a
    pubs:
    - kind: update
      ref: lin2023a
      role: final efficacy
    result: Confirmed central nervous system objective response rate was 11% (95% CI 3.0-25.4). This was a single-arm study
      with no control group.
    reviewed: '2026-09-14'
    setting: cns
    source:
    - group: HER2 positive brain metastases and antibody combinations
      section: Brain and leptomeningeal metastases
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: pertuzumab plus high-dose trastuzumab in progressive BM after radiotherapy, reaching-the-compartment, intracranial-response
    year: 2023
  patricia-solti:
    acronym: SOLTI-1303 PATRICIA
    arms: In cohort C, palbociclib, trastuzumab and endocrine therapy versus trastuzumab-based treatment of physician's choice,
      randomised 1:1, with patients allocated to the physician's choice arm eligible for re-randomisation on progression if
      they still met the inclusion criteria; the earlier cohorts gave palbociclib plus trastuzumab in estrogen receptor-negative
      disease (cohort A) and in estrogen receptor-positive disease without or with letrozole (cohorts B1 and B2).
    chapters:
    - BC-900
    - BC-910
    claim: PAM50 luminal HER2+ disease, triplet PFS HR 0.52 (0.29-0.95) over physician's choice
    digest:
      methods: Prospective, open-label, multicentre phase II trial in HER2-positive advanced breast cancer after two to four
        prior anti-HER2-based regimens. Treatment was palbociclib 200 mg daily for 2 weeks on and 1 week off plus trastuzumab,
        in a Simon two-stage design with three cohorts, estrogen receptor-negative (cohort A), estrogen receptor-positive
        (cohort B1) and estrogen receptor-positive with letrozole (cohort B2), with estrogen receptor-positive patients randomised
        between B1 and B2. The primary endpoint of those cohorts was the progression-free survival rate at 6 months, with
        safety and PAM50 intrinsic subtype as secondary objectives. Enrolment was stopped prematurely and a new randomised
        cohort C was opened in the PAM50 luminal population. Cohort C randomised pretreated patients with HER2-positive, hormone
        receptor-positive, PAM50 luminal A or B advanced disease 1:1 to the triplet of palbociclib, trastuzumab and endocrine
        therapy or to trastuzumab-based treatment of physician's choice, with patients allocated to physician's choice eligible
        for re-randomisation on progression if they still met the inclusion criteria, and its primary endpoint was investigator-assessed
        progression-free survival per RECIST version 1.1.
      results: Seventy-one patients were recruited to the first cohorts, 15 in cohort A and 28 in each cohort B, where the
        6-month progression-free survival rate was 33.3% in cohort A, 42.8% in cohort B1 and 46.4% in cohort B2. PAM50 profiling
        was available for 59 tumours and luminal disease was independently associated with longer progression-free survival
        than non-luminal disease, 10.6 versus 4.2 months, adjusted hazard ratio 0.40. In cohort C, 264 participants were prescreened
        from August 2019 to 2023 and 73 patients were randomly assigned, including seven re-randomisations; in the physician's
        choice arm 48.5% received trastuzumab plus chemotherapy, 39.4% trastuzumab emtansine and 12.1% trastuzumab plus endocrine
        therapy. The triplet significantly improved progression-free survival, stratified hazard ratio 0.52 (95% CI, 0.29
        to 0.95; two-sided P = 0.03), with 24-month progression-free survival rates of 24.0% versus 4.3% and overall response
        rates of 18.9% (95% CI, 8.6 to 35.7) versus 7.1% (95% CI, 1.2 to 25.0). Grade 3 or worse adverse events occurred in
        61.5% of the triplet arm, most often neutropenia at 53.9%, with no permanent discontinuations for toxicity.
    endpoint: Investigator-assessed progression-free survival by RECIST version 1.1 in cohort C; progression-free survival
      rate at 6 months in cohorts A, B1 and B2.
    line: 3L+
    modality: cdk4-6,her2,endocrine
    n: 73
    nct: NCT02448420
    note: Keyed solti-1303-patricia because the registry already holds patricia, the unrelated single-arm study of pertuzumab
      with high-dose trastuzumab in progressive brain metastases; the two must never be merged. The tabulated result comes
      from ciruelos2026, the randomised cohort C, and n is the 73 patients randomly assigned there including seven re-randomisations,
      so the number of distinct participants is smaller; only patients allocated to physician's choice could be re-randomised.
      ciruelos2020 reports cohorts A, B1 and B2, where 71 patients were recruited against a different primary endpoint, the
      6-month progression-free survival rate. Cohort A enrolled estrogen receptor-negative disease, so the subtype tag carries
      HER2+ as well as HR+/HER2+ even though the randomised cohort is triple-positive and PAM50 luminal. No overall survival
      is reported in either abstract.
    os: Not reported. Neither the randomised cohort C publication nor the earlier single-arm cohort publication reports overall
      survival.
    phase: '2'
    population: Patients with HER2-positive advanced breast cancer who had received two to four prior anti-HER2-based regimens;
      the randomised cohort C additionally required hormone receptor-positive disease and a PAM50 luminal A or B subtype.
    primary_ref: ciruelos2026
    pubs:
    - kind: primary
      ref: ciruelos2026
      role: primary
    - kind: primary
      ref: ciruelos2020
      role: primary
    result: In cohort C the triplet was associated with significantly better progression-free survival than trastuzumab-based
      treatment of physician's choice, stratified hazard ratio 0.52 (95% CI, 0.29 to 0.95; two-sided P = 0.03). Progression-free
      survival rates after 24 months were 24.0% with the triplet and 4.3% with physician's choice.
    reviewed: '2026-09-16'
    setting: metastatic
    source:
    - ch: 73
      section: Additional studies — Metastatic HER2+ / HR+HER2+
    - ch: 72
      section: Additional studies — Metastatic HER2+ / HR+HER2+
      xref: true
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: PAM50 luminal selection for CDK4/6 inhibition added to trastuzumab and endocrine therapy after HER2-directed therapy
    weight: supporting
    year: 2026
  pattern:
    acronym: PATTERN
    arms: paclitaxel plus carboplatin for six cycles vs cyclophosphamide, epirubicin and fluorouracil followed by docetaxel
    chapters:
    - BC-510
    - BC-850
    cited_by:
    - BC-850
    digest:
      methods: Phase 3 randomized trial in China. Women aged 18 to 70 years with operable triple-negative breast cancer after
        definitive surgery, either node-positive or node-negative with tumor diameter over 10 mm, were randomized to paclitaxel
        80 mg/m2 plus carboplatin AUC 2 on days 1, 8 and 15 every 28 days for 6 cycles, or to cyclophosphamide, epirubicin
        and fluorouracil every 3 weeks for 3 cycles followed by docetaxel for 3 cycles. The primary end point was disease-free
        survival.
      results: 647 patients were randomized, 322 to CEF-T and 325 to paclitaxel plus carboplatin. At a median follow-up of
        62 months, 5-year disease-free survival was 86.5% with paclitaxel plus carboplatin versus 80.3% with CEF-T (hazard
        ratio 0.65, 95% CI 0.44 to 0.96, P = .03). Overall survival did not differ (hazard ratio 0.71, 95% CI 0.42 to 1.22,
        P = .22). In subgroup analysis the disease-free survival hazard ratio was 0.44 with BRCA1/2 variants and 0.39 with
        HRR variants.
    endpoint: disease-free survival
    line: adjuvant
    modality: chemo
    n: 647
    nct: NCT01216111
    os: HR 0.71 (0.42-1.22), P=0.22
    phase: 3
    population: operable TNBC after surgery, node-positive or tumour over 10 mm
    primary_ref: yu2020pattern
    pubs:
    - kind: primary
