    digest:
      methods: Double-blind, randomised, phase 3 study at 75 academic and community sites in 13 countries. Patients with previously
        untreated stage II-III triple-negative breast cancer were randomly assigned 1:1 to chemotherapy plus intravenous atezolizumab
