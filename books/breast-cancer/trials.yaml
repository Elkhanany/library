  tonic:
    acronym: TONIC
    arms: Non-comparative randomisation to nivolumab without induction or with two weeks of low-dose induction, or to irradiation
      (3 x 8 Gy), cyclophosphamide, cisplatin or doxorubicin, each followed by nivolumab; there is no control group.
    chapters:
    - BC-920
    claim: ORR 20% overall, 35% after doxorubicin and 23% after cisplatin induction
    digest:
      methods: Adaptive, non-comparative phase 2 trial addressing the low efficacy of PD-1 blockade in metastatic triple-negative
        breast cancer and the preclinical suggestion that chemotherapy and irradiation have immunomodulatory properties. In
        the first stage, 67 patients with metastatic triple-negative breast cancer were randomised to nivolumab without induction
        or with two-week low-dose induction, or to irradiation (3 x 8 Gy), cyclophosphamide, cisplatin or doxorubicin, each
        followed by nivolumab. Response was assessed by iRECIST. Translational analyses compared gene expression after induction
        to test whether the priming strategies altered the tumour microenvironment.
      results: In the overall cohort the objective response rate was 20%. The majority of responses were observed in the cisplatin
        cohort, objective response rate 23%, and the doxorubicin cohort, objective response rate 35%. After doxorubicin and
        cisplatin induction the investigators detected upregulation of immune-related genes involved in PD-1/PD-L1 and T cell
        cytotoxicity pathways. Among genes upregulated after doxorubicin there was enrichment for inflammation, JAK-STAT and
        TNF-alpha signalling. The authors conclude that short-term doxorubicin and cisplatin may induce a more favourable
        tumour microenvironment and that the findings warrant confirmation in TNBC and exploration in other cancer types.
    endpoint: Objective response rate by iRECIST.
    modality: immunotherapy,chemo,radiation
    n: 67
    note: Adaptive, non-comparative phase 2 design. Patients were randomly allocated between induction cohorts, but the cohorts
      are small and were not compared with one another statistically, so the apparent ranking of priming strategies is hypothesis-generating
      and not a definitive comparison. Only the first stage is reported here. Radiation and chemotherapy are tagged as modalities
      because they were the induction strategies under test, with nivolumab as the common backbone. The abstract does not
      state how many prior systemic lines patients had received, so no treatment line is assigned. No ClinicalTrials.gov identifier
      appears in the abstract, so nct is omitted.
    phase: '2'
    population: Patients with metastatic triple-negative breast cancer enrolled in the first stage of an adaptive trial.
    primary_ref: voorwerk2019
    pubs:
    - kind: primary
      ref: voorwerk2019
      role: primary
    result: In the overall cohort the objective response rate was 20%. The majority of responses were observed in the cisplatin
      cohort, objective response rate 23%, and the doxorubicin cohort, objective response rate 35%.
    setting: metastatic
    source:
    - ch: 75
      section: Additional studies — Metastatic TNBC / rare histology
    status: reported
    subtype: TNBC
    topic: short-course chemotherapy or radiation as immune priming before PD-1 blockade
    weight: exploratory
    year: 2019
  topacio:
    acronym: TOPACIO/KEYNOTE-162 breast cohort
    arms: Single arm of oral niraparib 200 mg once daily with intravenous pembrolizumab 200 mg on day 1 of each 21-day cycle.
    chapters:
    - BC-920
    claim: ORR 21% overall and 47% in tumour BRCA-mutant disease, single arm
    digest:
      methods: Open-label, single-arm phase 2 study that enrolled 55 eligible patients with advanced or metastatic triple-negative
        breast cancer at 34 US sites, irrespective of BRCA mutation status or PD-L1 expression. Data were collected from January
        3, 2017 through October 29, 2018 and analysed through February 27, 2019. Patients received oral niraparib 200 mg once
        daily with intravenous pembrolizumab 200 mg on day 1 of each 21-day cycle. The primary endpoint was objective response
        rate by RECIST version 1.1. Secondary endpoints were safety, disease control rate, duration of response, progression-free
        survival and overall survival.
      results: Among the 55 women enrolled, median age 54 years, 5 had a confirmed complete response, 5 a confirmed partial
        response, 13 stable disease and 24 progressive disease. In the efficacy-evaluable population of 47, the objective
        response rate was 21%, 10 patients (90% CI 12% to 33%), and the disease control rate 49%, 23 patients (90% CI 36%
        to 62%); median duration of response was not reached, with 7 patients still on treatment. In 15 evaluable patients
        with tumour BRCA mutations the objective response rate was 47% (90% CI 24% to 70%), disease control rate 80% (90%
        CI 56% to 94%) and median progression-free survival 8.3 months (95% CI 2.1 months to not estimable). In 27 evaluable
        patients with BRCA wild-type tumours the corresponding figures were 11% (90% CI 3% to 26%), 33% (90% CI 19% to 51%)
        and 2.1 months (95% CI 1.4 to 2.5). The most common grade 3 or higher treatment-related adverse events were anaemia
        in 10 patients (18%), thrombocytopenia in 8 (15%) and fatigue in 4 (7%); immune-related adverse events were reported
        in 8 patients (15%) and were grade 3 in 2 (4%).
    endpoint: Objective response rate by the Response Evaluation Criteria in Solid Tumors, version 1.1.
    modality: parp,immunotherapy
    n: 55
    nct: NCT02657889
    note: Single-arm study with no comparator, so the incremental contribution of niraparib or of pembrolizumab cannot be
      inferred. The response denominator is the efficacy-evaluable population of 47, not all 55 enrolled. Enrolment was irrespective
      of BRCA mutation status, so the subtype axis is TNBC and the BRCA-mutant figures are a subgroup, not the trial population.
      This record covers the breast cohort only; the ovarian cohort of TOPACIO/KEYNOTE-162 is reported separately and is not
      part of this entry. The abstract does not state how many prior systemic lines patients had received, so no treatment
      line is assigned.
    phase: '2'
    population: Women with advanced or metastatic triple-negative breast cancer at 34 US sites, enrolled irrespective of BRCA
      mutation status or PD-L1 expression; median age 54 years (range 32 to 90).
    primary_ref: vinayak2019
    pubs:
    - kind: primary
      ref: vinayak2019
      role: primary
    result: In the efficacy-evaluable population of 47 patients the objective response rate was 21%, 10 patients (90% CI 12%
      to 33%), and the disease control rate 49%, 23 patients (90% CI 36% to 62%). Among 15 evaluable patients with tumour
      BRCA mutations the objective response rate was 47% (90% CI 24% to 70%), against 11% (90% CI 3% to 26%) in 27 evaluable
      patients with BRCA wild-type tumours.
    setting: metastatic
    source:
    - ch: 75
      section: Additional studies — Metastatic TNBC / rare histology
    status: reported
    subtype: TNBC
    topic: PARP inhibition combined with PD-1 blockade in advanced TNBC unselected for BRCA status
    weight: exploratory
    year: 2019
  torchlight:
    acronym: TORCHLIGHT
    arms: Toripalimab plus nab-paclitaxel versus placebo plus nab-paclitaxel.
    chapters:
    - BC-920
    digest:
      methods: Randomised double-blinded phase 3 trial of first-line toripalimab plus nab-paclitaxel in 353 women against
        placebo plus nab-paclitaxel in 178 women with metastatic or recurrent triple-negative breast cancer. The primary endpoint
        was progression-free survival assessed by blinded independent central review in the PD-L1-positive and intention-to-treat
        populations. Secondary endpoints included overall survival and safety.
      results: PD-L1-positive disease was present in 200 patients in the toripalimab arm and 100 in the placebo arm. At the
        prespecified interim analysis median progression-free survival in the PD-L1-positive population was 8.4 versus 5.6
        months, hazard ratio 0.65, P = 0.0102. Median overall survival was 32.8 versus 19.5 months, hazard ratio 0.62, P =
        0.0148. Grade 3 or worse treatment-emergent adverse events occurred in 56.4% versus 54.3%, and fatal events in 0.6%
        versus 3.4%.
    endpoint: Progression-free survival by blinded independent central review in the PD-L1-positive and intention-to-treat
