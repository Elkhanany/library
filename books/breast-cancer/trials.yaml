        in either group, hazard ratio 0.97 (0.82-1.14), p=0.70. Positively adjudicated osteonecrosis of the jaw occurred in
        122 of 2241 treated patients, 5%, against four of 2218 on placebo. Treatment-emergent hypocalcaemia occurred in 7%
