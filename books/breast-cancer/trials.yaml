        61 percent versus 34 percent (p=0.0002), median overall survival, 31.2 versus 22.7 months (p=0.0325), median time
        to progression, 11.7 versus 6.1 months (p=0.0001), median time to treatment failure, 9.8 versus 5.3 months (p=0.0001),
        and median duration of response, 11.7 versus 5.7 months (p=0.009). Grade 3 to 4 neutropenia occurred in 32 percent
        versus 22 percent and febrile neutropenia in 23 percent versus 17 percent.
