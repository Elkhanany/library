    claim: breast cancer-free interval HR 0.73 (0.56-0.96), benefit confined to women under 60
    digest:
      methods: Double-blind, randomised, phase 3 NSABP trial done at 333 centres in the USA and Canada. Postmenopausal women
        with hormone-positive ductal carcinoma in situ treated by lumpectomy with clear resection margins and whole-breast
        irradiation were randomly assigned 1:1 to oral tamoxifen 20 mg per day or oral anastrozole 1 mg per day for 5 years,
        each with a matching placebo. Randomisation was stratified by age. The primary outcome was breast cancer-free interval,
        analysed by intention to treat.
      results: Between January 2003 and June 2006, 3104 eligible patients were enrolled, 1552 to each group. Median follow-up
        was 9.0 years. There were 212 breast cancer-free interval events, 122 in the tamoxifen group and 90 in the anastrozole
        group (hazard ratio 0.73, 95% CI 0.56 to 0.96, p=0.0234). Interactions with time (p=0.0410) and with age group (p=0.0379)
        were significant. Grade 4 or worse thrombosis or embolism occurred 17 times versus four.
