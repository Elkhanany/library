  gim2:
    acronym: GIM2
    arms: every-2-week dose-dense chemotherapy vs every-3-week, each with or without fluorouracil added to epirubicin, cyclophosphamide
      and paclitaxel
    chapters:
    - BC-490
    - BC-510
    - BC-850
    cited_by:
    - BC-850
    digest:
      methods: Open-label 2x2 factorial phase 3 trial at 81 Italian centres. Patients aged 18-70 years with operable, node-positive,
        early-stage breast cancer were randomly allocated 1:1:1:1. Allocation was to dose-dense chemotherapy every 2 weeks
        with pegfilgrastim support or standard-interval chemotherapy every 3 weeks, and to fluorouracil plus epirubicin, cyclophosphamide
        and paclitaxel (FEC-P) or to EC-P alone. The primary endpoint was disease-free survival in the intention-to-treat
        population.
      results: 2091 patients were recruited and median follow-up was 7.0 years. For the dose-density comparison, 5-year disease-free
        survival was 81% with every-2-week treatment versus 76% with every-3-week treatment (hazard ratio 0.77, 95% CI 0.65
        to 0.92, p=0.004). Five-year overall survival was 94% versus 89% (hazard ratio 0.65, 0.51 to 0.84, p=0.001). For the
        chemotherapy-type comparison, 5-year disease-free survival was 78% with FEC-P versus 79% with EC-P (hazard ratio 1.06,
        p=0.561).
    endpoint: disease-free survival
    line: adjuvant
    modality: chemo
    n: 2091
    nct: NCT00433420
    os: 5-year OS 94% vs 89%; HR 0.65 (0.51-0.84), P=0.001
    phase: 3
