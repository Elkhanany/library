  veronica:
    acronym: VERONICA
    arms: Venetoclax 800 mg orally daily plus fulvestrant versus fulvestrant alone, randomised 1:1.
    chapters:
    - BC-870
    - BC-880
    claim: CBR 11.8% vs 13.7% and PFS 2.69 vs 1.94 months; venetoclax added nothing
    digest:
      methods: Randomised phase II trial evaluating the BCL2 inhibitor venetoclax with fulvestrant in oestrogen receptor-positive,
        HER2-negative metastatic breast cancer after progression on a CDK4/6 inhibitor, reported as the prespecified primary
        results. Pre- and postmenopausal females aged 18 years or older were randomised 1:1 to venetoclax 800 mg orally daily
        plus fulvestrant 500 mg intramuscularly, given on days 1 and 15 of cycle 1 and on day 1 of subsequent 28-day cycles,
        or to fulvestrant alone. The primary endpoint was clinical benefit rate. Secondary endpoints were progression-free
        survival, overall survival and safety. Exploratory biomarker analyses covered tumour BCL2 and BCL extra-large expression
        and PIK3CA circulating tumour DNA mutational status.
      results: At the primary analysis, with a cutoff of August 5, 2020 and 103 patients, venetoclax did not significantly
        improve clinical benefit rate, which was 11.8% (6 of 51; 95% CI 4.44 to 23.87) with venetoclax plus fulvestrant versus
        13.7% (7 of 51; 95% CI 5.70 to 26.26) with fulvestrant, a risk difference of -1.96% (95% CI -16.86 to 12.94). Median
        progression-free survival was 2.69 months (95% CI 1.94 to 3.71) with venetoclax plus fulvestrant versus 1.94 months
        (95% CI 1.84 to 3.55) with fulvestrant, stratified HR 0.94 (95% CI 0.61 to 1.45; P = 0.7853). Overall survival data
        were not mature. A nonsignificant improvement in clinical benefit rate and progression-free survival was observed
        in patients whose tumours had strong BCL2 expression by immunohistochemistry at 3+, a BCL2 to BCLXL Histoscore ratio
        of 1 or more, or PIK3CA wild-type status. The authors conclude that the findings do not indicate clinical utility
        for venetoclax plus fulvestrant in endocrine-resistant, CDK4/6 inhibitor-refractory disease, but suggest possible
        increased dependence on BCLXL in this setting.
    endpoint: Clinical benefit rate.
    line: 2L
    modality: endocrine,other
    n: 103
    note: The primary endpoint was negative and that is the substance of the record. The biomarker-defined subgroups with
      strong BCL2 expression, a BCL2 to BCLXL Histoscore ratio of 1 or more, or PIK3CA wild-type status showed only nonsignificant
      improvements in exploratory analyses and should not be read as a positive signal. n is the 103 patients at the primary
      analysis cutoff of August 5, 2020. Venetoclax is tagged as other, since a BCL2 inhibitor has no dedicated modality;
      no CDK4/6 inhibitor was given on trial, and prior CDK4/6 inhibition is an entry criterion rather than a treatment arm.
      The full text allowed no more than two prior endocrine lines and no chemotherapy for advanced disease, and about four
      in five patients had one prior endocrine line, so the line axis is 2L. The abstract gives no NCT number, so that field
      is omitted.
    os: Overall survival was a secondary endpoint and the data were not mature at the primary analysis.
    phase: '2'
    population: Pre- and postmenopausal females aged 18 years or older with oestrogen receptor-positive, HER2-negative metastatic
      breast cancer that had progressed after a CDK4/6 inhibitor.
    primary_ref: lindeman2022
    pubs:
    - kind: primary
      ref: lindeman2022
      role: primary
    result: Venetoclax did not significantly improve clinical benefit rate, which was 11.8% (6 of 51; 95% CI 4.44 to 23.87)
      with venetoclax plus fulvestrant and 13.7% (7 of 51; 95% CI 5.70 to 26.26) with fulvestrant, a risk difference of -1.96%
      (95% CI -16.86 to 12.94). Median progression-free survival was 2.69 months (95% CI 1.94 to 3.71) versus 1.94 months
      (95% CI 1.84 to 3.55), stratified HR 0.94 (95% CI 0.61 to 1.45; P = 0.7853).
    setting: metastatic
    source:
    - ch: 68
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
    - ch: 69
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
      xref: true
    status: reported
    subtype: HR+/HER2-
    topic: BCL2 inhibition added to fulvestrant after progression on a CDK4/6 inhibitor
    weight: supporting
    year: 2022
  viktoria1:
    acronym: VIKTORIA-1
    arms: gedatolisib plus fulvestrant with or without palbociclib vs standard of care
    chapters:
    - BC-870
    - BC-880
    cited_by:
    - BC-870
    - BC-880
    digest:
      methods: Phase III randomised trial in patients with hormone receptor-positive, HER2-negative, PIK3CA wild-type advanced
        breast cancer whose disease progressed during or after CDK4/6 inhibitor and aromatase inhibitor treatment. Patients
        were randomly assigned 1:1:1 to gedatolisib with palbociclib and fulvestrant, to gedatolisib with fulvestrant, or
        to fulvestrant monotherapy. The primary objective was progression-free survival by blinded independent central review,
        comparing each gedatolisib group with fulvestrant.
      results: 392 patients were randomly assigned. Median study follow-up was 10.1 months. Median progression-free survival
        was 9.3 months in the gedatolisib triplet group, 7.4 months in the gedatolisib doublet group and 2.0 months in the
        fulvestrant group. Hazard ratios for progression or death versus fulvestrant were 0.24 (95% CI 0.17 to 0.35) for the
        triplet and 0.33 (95% CI 0.24 to 0.48) for the doublet, both P<.001. Grade 3 or higher neutropenia was 62.3% and 0.8%.
    endpoint: progression-free survival by blinded independent review, for the gedatolisib triplet and the doublet each against
      fulvestrant, in the PIK3CA wild-type cohort
    line: 2L
    modality: pi3k-akt,endocrine,cdk4-6
    n: 392
    nct: NCT05501886
    note: The 392 patients are the PIK3CA wild-type cohort, which is what this result is about. The trial as a whole enrolled
      about 701 across its wild-type and mutant cohorts, and the mutant cohort has not reported.
    os: not yet reported
    phase: 3
    population: progression on or after a CDK4/6 inhibitor with an aromatase inhibitor, randomised separately by PIK3CA mutation
      status
    primary_ref: hurvitz2026
    pubs:
    - kind: primary
      ref: hurvitz2026
      role: primary
    result: median progression-free survival 9.3 months with gedatolisib, palbociclib and fulvestrant and 7.4 months with
      gedatolisib and fulvestrant, against 2.0 months with fulvestrant alone. Hazard ratios 0.24 (0.17-0.35) and 0.33 (0.24-0.48),
      both P < 0.001, at a median 10.1 months of follow-up
    reviewed: '2026-09-14'
    setting: metastatic
    source:
    - ch: 68
      group: PI3K / AKT / mTOR
      section: Metastatic disease
    status: reported
