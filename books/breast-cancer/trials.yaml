    claim: OS 12.1 vs 6.7 months, HR 0.48
    digest:
      methods: Randomized phase 3 trial of sacituzumab govitecan compared with single-agent chemotherapy of the physician's
        choice, either eribulin, vinorelbine, capecitabine, or gemcitabine, in patients with relapsed or refractory metastatic
        triple-negative breast cancer. The primary end point was progression-free survival determined by blinded independent
        central review among patients without brain metastases.
      results: 468 patients without brain metastases were randomly assigned, 235 to sacituzumab govitecan and 233 to chemotherapy.
        Median age was 54 years. Median progression-free survival was 5.6 months versus 1.7 months (hazard ratio 0.41, 95%
