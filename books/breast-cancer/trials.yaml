    digest:
      methods: Adults with brain metastases received whole-brain radiotherapy and were randomised to memantine 20 mg daily
        or placebo, started within 3 days of beginning radiotherapy and continued for 24 weeks. Serial standardised tests
        of cognitive function were performed.
      results: Of 554 patients accrued, 508 were eligible. Delayed recall declined less with memantine at 24 weeks (P = .059),
        not significant with 149 analysable patients and 35% power. Time to cognitive decline was longer with memantine (hazard
        ratio 0.78, 95% CI 0.62-0.99, P = .01), and cognitive failure at 24 weeks was 53.8% versus 64.9%. Executive function,
        processing speed and delayed recognition favoured memantine. Grade 3 or 4 toxicity was similar.
