        assigned to 1 year of adjuvant trastuzumab, lapatinib, the sequence of trastuzumab then lapatinib, or the combination
        of lapatinib and trastuzumab. The primary end point was disease-free survival, with 850 events required for 80% power
        to detect a hazard ratio of 0.8 for the combination versus trastuzumab.
