      results: 47 female patients were recruited, median age 53 years. 35 had untreated brain metastases and 12 had brain
        metastases progressing after local radiotherapy. The central nervous system objective response rate was 42.6% (95%
        CI 28.3 to 57.8) by RECIST version 1.1 and 40.4% (95% CI 26.4 to 55.7) by RANO-BM criteria. Median follow-up was 11.0
        months. Median progression-free survival was 7.7 months, median central nervous system progression-free survival 10.6
        months and median overall survival 15.1 months. Grade 3 or higher events were uncommon and no fatal events occurred.
    endpoint: Central nervous system objective response rate by Response Evaluation Criteria in Solid Tumors version 1.1.
    modality: chemo,other
    n: 47
    nct: NCT05357417
    note: This is the first prospective cohort of any size in HER2-negative breast cancer with active brain metastases. It
      reports its response rate under two sets of criteria in the same patients, which is the only place in this cell where
      the criteria can be compared without also changing the cohort. The untreated and post-radiotherapy strata are described
