    digest:
      methods: Randomized phase 3 trial enrolling 1,483 premenopausal women aged 45 years or younger with estrogen receptor-positive
        breast cancer treated with definitive surgery after adjuvant or neoadjuvant chemotherapy. Ovarian function was assessed
        every 6 months for 2 years using follicle-stimulating hormone levels and vaginal bleeding history. Patients confirmed
        premenopausal at each visit were randomly assigned to 5 years of tamoxifen alone or 5 years of tamoxifen with 2 years
        of monthly goserelin.
