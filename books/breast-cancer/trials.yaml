  enobosarm:
    acronym: Study G200802
    arms: Oral enobosarm 9 mg daily vs oral enobosarm 18 mg daily, with no standard-therapy control arm.
    chapters:
    - BC-870
    - BC-880
    claim: clinical benefit at 24 weeks 32% with enobosarm 9 mg and 29% with 18 mg
    digest:
      methods: Randomised, open-label, multicentre, multinational, parallel design phase 2 trial at 35 cancer treatment centres
        in nine countries. Postmenopausal women aged 18 years or older with previously treated oestrogen receptor-positive,
        HER2-negative, locally advanced or metastatic breast cancer and an Eastern Cooperative Oncology Group performance
        status of 0 to 2 were enrolled. Participants were stratified on the setting of the immediately preceding endocrine
        therapy and the presence of bone-only metastasis, and randomly assigned 1:1 to 9 mg or 18 mg oral enobosarm daily
        using an interactive web response system. The primary endpoint was clinical benefit rate at 24 weeks in those with
        centrally confirmed androgen receptor-positive disease, the evaluable population. The premise of the trial is that
        the androgen receptor is a tumour suppressor in oestrogen receptor-positive breast cancer.
      results: Between Sept 10, 2015 and Nov 28, 2017, 136 of 172 patients deemed eligible (79%) were randomly assigned to
        9 mg (n=72) or 18 mg (n=64) oral enobosarm daily, and 102 of those 136 (75%) formed the evaluable population, 50 in
        the 9 mg group and 52 in the 18 mg group. Median age was 60.5 years in the 9 mg group and 62.5 years in the 18 mg
        group, and median follow-up was 7.5 months. At 24 weeks, 16 of 50 (32%, 95% CI 20 to 47) in the 9 mg group and 15
        of 52 (29%, 17 to 43) in the 18 mg group had clinical benefit. Grade 3 or grade 4 drug-related adverse events occurred
        in 6 of 75 patients who received 9 mg (8%) and 10 of 61 who received 18 mg (16%), most often raised hepatic transaminases,
        hypercalcaemia and fatigue. Four deaths, one in the 9 mg group and three in the 18 mg group, were deemed unrelated
        to the study drug. The authors concluded that enobosarm has anti-tumour activity and that androgen receptor activation
        can produce clinical benefit.
    endpoint: Clinical benefit rate at 24 weeks in patients with centrally confirmed androgen receptor-positive disease, the
      evaluable population.
    line: 2L
    modality: endocrine,other
    n: 136
    nct: NCT02463032
    note: Randomisation was between two doses of enobosarm, not against standard therapy, so the trial supports activity and
      not comparative efficacy; there is no control arm to read the clinical benefit rate against. This is androgen receptor
      agonism in oestrogen receptor-positive disease and is the opposite pharmacology to the androgen receptor antagonism
      studied in triple-negative disease, so the two must not be grouped. Entry required oestrogen receptor-positive, HER2-negative
      disease; central confirmation of androgen receptor positivity was not an entry requirement but defined the evaluable
      population, which was 102 of the 136 randomly assigned patients, so a quarter of those randomised fall outside the population
      the primary endpoint describes and the subtype tag carries neither the androgen receptor selection nor that distinction.
      n is the 136 patients randomly assigned; the primary endpoint was assessed in the 102 with centrally confirmed androgen
      receptor-positive disease, and the safety denominators of 75 and 61 are all patients who received each dose. Entry required
      previous treatment, and the abstract sets no minimum of two previous lines, so the line tag is 2L, the convention for
      hormone receptor-positive disease after endocrine therapy. The trial is keyed on its study number because the literature
      names it Study G200802; it is the enobosarm phase 2 trial.
    os: not reported; clinical benefit rate at 24 weeks was the primary endpoint and median follow-up was 7.5 months
    phase: '2'
    population: Postmenopausal women aged 18 years or older with previously treated oestrogen receptor-positive, HER2-negative,
      locally advanced or metastatic breast cancer and an ECOG performance status of 0 to 2; the primary analysis was confined
      to those with centrally confirmed androgen receptor-positive disease.
    primary_ref: palmieri2024
    pubs:
    - kind: primary
      ref: palmieri2024
      role: primary
    result: At 24 weeks, 16 of 50 patients (32%, 95% CI 20 to 47) in the 9 mg group and 15 of 52 (29%, 95% CI 17 to 43) in
      the 18 mg group had clinical benefit.
    setting: metastatic
    source:
    - ch: 68
      section: Additional studies — Metastatic HR+ / mutation-selected HER2−
    status: reported
    subtype: HR+/HER2-
    topic: androgen receptor agonism with enobosarm, dose comparison
    weight: exploratory
    year: 2024
  eortc-22952-26001:
    acronym: EORTC 22952-26001
    arms: Adjuvant whole-brain radiotherapy of 30 Gy in 10 fractions versus observation after complete surgery or radiosurgery.
    chapters:
    - BC-930
    digest:
      methods: Phase 3 randomised trial. Patients with one to three brain metastases of solid tumours, excluding small-cell
        lung cancer, with stable systemic disease or asymptomatic primary tumours and WHO performance status 0 to 2 were treated
        with complete surgery or radiosurgery. They were then randomly assigned to adjuvant whole-brain radiotherapy of 30
        Gy in 10 fractions or to observation. The primary endpoint was time to WHO performance status deterioration beyond
        2.
      results: Of 359 patients, 199 had radiosurgery and 160 had surgery. Median time to performance status worse than 2 was
        10.0 months with observation and 9.5 months with radiotherapy (P = .71). Median overall survival was 10.7 versus 10.9
        months (P = .89). Radiotherapy lowered 2-year relapse at initial sites (surgery 59% to 27%; radiosurgery 31% to 19%)
        and at new sites (42% to 23%; 48% to 33%). Intracranial progression caused death in 44% versus 28%.
    endpoint: Time to deterioration of WHO performance status to more than 2.
    modality: radiation
    n: 359
    note: The trial enrolled brain metastases from solid tumours generally, not breast cancer specifically.
    os: Median overall survival was 10.9 months with whole-brain radiotherapy and 10.7 months with observation (P = .89).
    phase: 3
    population: Patients with one to three brain metastases from solid tumours, small-cell lung cancer excluded, with stable
      systemic disease and WHO performance status 0 to 2.
