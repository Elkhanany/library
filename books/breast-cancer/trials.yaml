  optimize-2:
    acronym: OPTIMIZE-2
    arms: Zoledronic acid 4 mg intravenously every 4 weeks versus every 12 weeks with placebo at the intervening infusions,
      for one year.
    chapters:
    - BC-600
    digest:
      methods: Prospective randomised double-blind multicentre phase 3 trial at 102 centres in the United States. Women with
        bone metastases from breast cancer who had already received nine or more doses of zoledronic acid or pamidronate were
        randomised 1:1 to zoledronic acid every 4 weeks or every 12 weeks for one year, with placebo at the intervening infusions.
        The primary endpoint was the proportion of patients with one or more skeletal-related event on study.
      results: 416 women were randomised, 200 to the 4-weekly schedule, 203 to the 12-weekly schedule and 13 to placebo. After
        one year of follow-up, skeletal-related events occurred in 44 patients (22.0%) on the 4-weekly schedule and 47 (23.2%)
        on the 12-weekly schedule, proportional difference -1.2%, P = .02 for non-inferiority. Time to first skeletal-related
        event did not differ, hazard ratio 1.06 (95% CI 0.70 to 1.60, P = .79). Mean skeletal morbidity rate was 0.46 against
        0.50 events per year. Safety profiles were comparable.
    endpoint: Proportion of patients with at least one skeletal-related event on study.
    modality: bone
    n: 416
    nct: NCT00320710
    note: This is a de-escalation question rather than a starting-schedule question. Every patient had already had nine or
      more monthly doses, so the result does not license a 12-weekly interval from the first dose. It is the only one of the
      two interval trials confined to breast cancer.
    phase: 3
    population: Women with bone metastases from breast cancer who had already received nine or more doses of zoledronic acid
      or pamidronate over the first 10 to 15 months of treatment.
    primary_ref: hortobagyi2017
    pubs:
    - kind: primary
