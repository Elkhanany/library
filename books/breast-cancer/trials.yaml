  destiny-b12:
    acronym: DESTINY-Breast12
    arms: Single arm of trastuzumab deruxtecan 5.4 mg/kg every three weeks, given in both cohorts.
    chapters:
    - BC-900
    - BC-930
    cited_by:
    - BC-570
    - BC-600
    digest:
      methods: The phase 3b/4 study was single-arm and open-label in patients with HER2-positive advanced or metastatic breast
        cancer, 263 with stable or active brain metastases and 241 without. All had received one or more prior anti-HER2-based
        regimens and received trastuzumab deruxtecan 5.4 mg per kg. Primary endpoints were progression-free survival in the
        brain metastases cohort and objective response rate by RECIST version 1.1 in the cohort without. No formal hypothesis
        testing was conducted.
      results: In the brain metastases cohort, 12-month progression-free survival was 61.6% and 12-month central nervous system
        progression-free survival was 58.9%. In the cohort without brain metastases, objective response rate was 62.7%. Grade
        3 or higher adverse events occurred in 51% of the brain metastases cohort and 49% of the cohort without. Investigator-reported
        interstitial lung disease or pneumonitis occurred in 16% of patients with brain metastases and 13% of those without.
    endpoint: progression-free survival at 12 months in the brain metastasis cohort, and objective response in the cohort
      without brain metastases
    line: 2L
    modality: adc
    n: 504
    nct: NCT04739761
    os: not yet reported
    phase: 3b/4
