    claim: 5-year recurrence-free survival 89.7% vs 88.7%, HR 0.89 (0.66-1.19)
    digest:
      methods: Noninferiority randomized trial. Patients with clinically node-negative primary T1 to T3 breast cancer and
        one or two sentinel-node macrometastases larger than 2 mm were assigned 1:1 to completion axillary-lymph-node dissection
        or to sentinel-node biopsy only. Adjuvant systemic treatment and radiation therapy followed national guidelines. The
        primary end point was overall survival. This report gives per-protocol and modified intention-to-treat analyses of
        recurrence-free survival, with a noninferiority margin of 1.44 for the hazard ratio.
      results: 2766 patients were enrolled in five countries between January 2015 and December 2021. The per-protocol population
        was 2540 patients, 1335 assigned to sentinel-node biopsy only and 1205 to dissection. Nodal radiation therapy was
        given to 89.9% and 88.4% respectively. Median follow-up was 46.8 months and 191 patients had recurrence or died. Estimated
        5-year recurrence-free survival was 89.7% with sentinel-node biopsy only and 88.7% with dissection, country-adjusted
        hazard ratio 0.89 (95% CI 0.66 to 1.19), P<0.001 for noninferiority.
