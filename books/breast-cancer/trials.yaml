    digest:
      methods: Multicentre phase 2 trial with integrated prospective circulating tumour DNA surveillance by digital PCR. Patients
        had early-stage triple-negative breast cancer with residual disease after neoadjuvant chemotherapy, or stage II or
        III disease treated with adjuvant chemotherapy. Blood was sampled every three months to 12 months. Patients with detected
        circulating tumour DNA were randomised 2:1 to pembrolizumab or observation, and the observation group was closed by
        amendment. Co-primary endpoints were detection rate and sustained clearance on pembrolizumab.
      results: 208 patients registered, 185 had tumour sequenced, 171 (92.4%) had trackable mutations and 161 entered surveillance.
        Circulating tumour DNA was detected by 12 months in 27.3% (44 of 161). Seven patients relapsed without prior detection.
        Forty-five patients entered the therapeutic component, 31 to intervention and 14 to observation. Of those allocated
        to intervention, 72% (23 of 32) had metastases on staging, and four declined pembrolizumab. None of the five who started
        pembrolizumab achieved sustained clearance.
