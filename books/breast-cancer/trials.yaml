    digest:
      methods: Patients with T1-2 primary breast cancer and no palpable lymphadenopathy were enrolled at 34 centres in nine
        European countries. Those with a positive sentinel node were randomly assigned 1:1 to axillary lymph node dissection
        or axillary radiotherapy, stratified by institution. The primary endpoint was non-inferiority of 5-year axillary recurrence,
        with a margin of not more than 4% versus an expected 2%. Analyses were by intention to treat and per protocol.
      results: Of 4806 eligible patients, 1425 had a positive sentinel node and were randomised. Axillary recurrence occurred
        in 4 of 744 after dissection and 7 of 681 after radiotherapy. Median follow-up was 6.1 years. 5-year axillary recurrence
        was 0.43% versus 1.19%. Lymphoedema was more frequent after dissection at 1, 3 and 5 years. The preplanned 10-year
        analysis reports cumulative axillary recurrence of 0.93% and 1.82%, with no difference in overall or disease-free
        survival.
