    claim: did not reach significance for a 6-year over a 3-year course of anastrozole
    digest:
      methods: Prospective, randomised, open-label, multicentre phase 3 study in 79 hospitals in the Netherlands. Postmenopausal
        women with hormone receptor-positive early breast cancer and no sign of recurrence after 2 to 3 years of adjuvant
        tamoxifen were randomly assigned 1:1 to 3 or 6 years of anastrozole 1 mg once daily. Stratification was by nodal status,
        hormone receptor status, HER2 status and duration of tamoxifen. The primary endpoint was disease-free survival starting
        beyond 3 years after randomisation.
      results: 1912 patients were screened, 955 assigned to 3 years and 957 to 6 years of anastrozole. 1860 were eligible
        and 1660 were disease free 3 years after randomisation. Five-year adapted disease-free survival was 83.1% (95% CI
        80.0 to 86.3) in the 6-year group and 79.4% in the 3-year group (hazard ratio 0.79, 95% CI 0.62 to 1.02, p=0.066).
        The 6-year group had more arthralgia or myalgia, 58% versus 53%, and more osteopenia or osteoporosis, 21% versus 16%.
    endpoint: disease-free survival beyond 3 years after randomisation
