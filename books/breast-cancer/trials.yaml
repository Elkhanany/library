  ipatunity130-cohort-a:
    acronym: IPATunity130 cohort A
    arms: Ipatasertib plus paclitaxel versus placebo plus paclitaxel.
    chapters:
    - BC-920
    digest:
      methods: In cohort A of this randomised double-blind placebo-controlled phase III trial, taxane-eligible patients with
        PIK3CA, AKT1 or PTEN-altered measurable advanced triple-negative breast cancer and no prior chemotherapy for advanced
        disease were randomised 2:1 to ipatasertib 400 mg on days 1 to 21 or placebo, both with paclitaxel 80 mg/m2 on days
        1, 8 and 15, every 28 days until progression or unacceptable toxicity. The primary endpoint was investigator-assessed
        progression-free survival.
      results: Between February 2018 and April 2020, 255 patients were randomised, 168 to ipatasertib and 87 to placebo. Progression-free
        survival did not differ, hazard ratio 1.02 (95% CI 0.71 to 1.45), median 7.4 versus 6.1 months. Overall survival did
        not differ, hazard ratio 1.08 (95% CI 0.73 to 1.58), median 24.4 versus 24.9 months. Ipatasertib caused more grade
        3 or higher diarrhoea (9% versus 2%) and more dose reductions (39% versus 14%).
    endpoint: Investigator-assessed progression-free survival.
    line: 1L
    modality: pi3k-akt,chemo
    n: 255
    os: Final analysis showed no difference in overall survival, hazard ratio 1.08 (95% CI 0.73 to 1.58), median 24.4 months
      with ipatasertib versus 24.9 months with placebo.
    phase: 3
    population: Taxane-eligible patients with PIK3CA, AKT1 or PTEN-altered measurable locally advanced unresectable or metastatic
      triple-negative breast cancer and no prior chemotherapy for advanced disease.
    primary_ref: dent2024
    pubs:
