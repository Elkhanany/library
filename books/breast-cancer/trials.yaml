  egf104900:
    acronym: EGF104900
    arms: Lapatinib plus trastuzumab versus lapatinib alone.
    chapters:
    - BC-900
    digest:
      methods: Patients with HER2-positive metastatic breast cancer whose disease progressed during prior trastuzumab-based
        therapies were randomly assigned to lapatinib monotherapy or lapatinib in combination with trastuzumab. Overall survival
        and updated progression-free survival were presented with Kaplan-Meier curves and log-rank tests stratified for hormone
        receptor status and visceral disease status. Subgroup analyses sought characteristics of patients deriving the greatest
        clinical benefit.
      results: Among the 291 patients randomly assigned with strata, lapatinib plus trastuzumab remained superior to lapatinib
        alone for progression-free survival, hazard ratio 0.74 (95% CI 0.58 to 0.94, P=.011), and gave an overall survival
        benefit, hazard ratio 0.74 (95% CI 0.57 to 0.97, P=.026). Absolute overall survival rates were 10% higher at 6 months
        and 15% higher at 12 months with the combination. Performance status 0, nonvisceral disease and fewer than three metastatic
        sites were associated with better survival.
    endpoint: Progression-free survival
    line: 3L+
    modality: her2
    n: 291
    note: The only publication on the record is the final overall survival analysis, so the primary progression-free survival
      result is quoted as updated in that report.
    os: Median overall survival was 4.5 months longer with lapatinib plus trastuzumab than with lapatinib alone, hazard ratio
      0.74 (95% CI 0.57 to 0.97, P=.026).
    phase: 3
    population: Patients with HER2-positive metastatic breast cancer progressing during prior trastuzumab-based therapy, heavily
