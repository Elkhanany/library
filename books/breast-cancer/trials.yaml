  destiny-b11:
    acronym: DESTINY-Breast11
    arms: trastuzumab deruxtecan alone, or trastuzumab deruxtecan followed by paclitaxel with trastuzumab and pertuzumab,
      vs dose-dense doxorubicin and cyclophosphamide followed by the same triplet
    chapters:
    - BC-820
    - BC-830
    - BC-840
    cited_by:
    - BC-500
    - BC-830
    - BC-840
    claim: pCR 67.3% vs 56.3% against ddAC-THP; EFS immature
    digest:
      methods: This open-label phase III trial ran at 147 sites in 18 countries. Adults with high-risk (at least cT3cN0 or
        cT0-4cN1-3) HER2-positive early breast cancer were randomised 1:1:1 to trastuzumab deruxtecan for eight cycles, trastuzumab
        deruxtecan for four cycles followed by paclitaxel, trastuzumab, and pertuzumab for four, or dose-dense doxorubicin
        and cyclophosphamide followed by the same four cycles. Enrolment in the trastuzumab deruxtecan alone arm closed early.
        The primary endpoint was pathological complete response.
      results: 286 patients were randomised to trastuzumab deruxtecan, 321 to trastuzumab deruxtecan followed by paclitaxel,
        trastuzumab, and pertuzumab, and 320 to dose-dense doxorubicin and cyclophosphamide followed by the same. Pathological
        complete response rates were 43.0%, 67.3%, and 56.3%. The difference between the two combination sequences was 11.2
        percentage points (95% CI 4.0 to 18.3, P = 0.003). The event-free survival hazard ratio was 0.56 (95% CI 0.26 to 1.17)
        at 4.5% maturity.
