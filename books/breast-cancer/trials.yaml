    digest:
      methods: In the worldwide ATLAS trial, 12,894 women with early breast cancer who had completed 5 years of tamoxifen
        were randomly allocated 1:1 by central computer minimisation to continue tamoxifen to 10 years or to stop at 5 years
        with open control. Women entered between 1996 and 2005. Yearly follow-up forms recorded any recurrence, second cancer,
