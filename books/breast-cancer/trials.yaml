  egf100151:
    acronym: EGF100151
    arms: Lapatinib plus capecitabine versus capecitabine alone.
    chapters:
    - BC-900
    digest:
      methods: Women with HER2-positive locally advanced or metastatic breast cancer that had progressed after regimens including
        an anthracycline, a taxane and trastuzumab were randomly assigned to lapatinib 1,250 mg per day continuously plus
        capecitabine 2,000 mg per square metre on days 1 through 14 of a 21-day cycle, or to capecitabine alone 2,500 mg per
        square metre on days 1 through 14 of a 21-day cycle. The primary end point was time to progression by blinded independent
        review.
      results: The interim analysis of time to progression met the criteria for early reporting on grounds of superiority
        in the combination arm. The hazard ratio for independently assessed time to progression was 0.49 (95% CI 0.34 to 0.71,
        P<0.001), with 49 events in the combination arm and 72 in the monotherapy arm. Median time to progression was 8.4
        months with the combination and 4.4 months with monotherapy, without more serious toxic effects or symptomatic cardiac
        events.
    endpoint: Time to progression by blinded independent review
    line: 2L
    modality: her2,chemo
    n: 399
    nct: NCT00078572
    note: The number randomised, 399, is taken from the final survival publication because the primary report does not state
      it.
    os: Median overall survival was 75.0 weeks with lapatinib plus capecitabine and 64.7 weeks with capecitabine alone, hazard
      ratio 0.87 (95% CI 0.71 to 1.08, P=.210).
    phase: 3
    population: Women with HER2-positive locally advanced or metastatic breast cancer progressing after regimens that included
      an anthracycline, a taxane and trastuzumab.
    primary_ref: geyer2006
    pubs:
