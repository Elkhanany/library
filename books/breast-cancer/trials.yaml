  pamela:
    acronym: PAMELA
    arms: Single arm of lapatinib plus trastuzumab for 18 weeks, with letrozole or tamoxifen added for hormone receptor-positive
      disease.
    chapters:
    - BC-830
    - BC-840
    digest:
      methods: Open-label, single-group phase 2 trial in 19 hospitals in Spain. Women aged at least 18 years with untreated,
        centrally confirmed HER2-positive stage I-IIIA breast cancer received lapatinib 1000 mg daily and trastuzumab for
        18 weeks. Hormone receptor-positive patients also received letrozole or tamoxifen. Surgery followed one to three weeks
        after the last dose. Intrinsic subtype was determined by PAM50 on biopsies at day 0 and day 14.
      results: 151 patients were recruited and 137 (91%) completed treatment as planned. At baseline 101 (67%) had HER2-enriched
        tumours. Pathological complete response in the breast occurred in 46 of 151 patients (30%, 95% CI 23-39). It occurred
        in 41 of 101 HER2-enriched tumours (41%) and in five of 50 non-HER2-enriched tumours (10%), odds ratio 6.2 (95% CI
        2.3-16.8, p=0.0004).
    endpoint: The ability of the HER2-enriched intrinsic subtype to predict pathological complete response in the breast at
      surgery.
    line: neoadjuvant
    modality: her2,endocrine
    n: 151
    nct: NCT01973660
    note: PAMELA enrolled HER2-positive patients regardless of hormone receptor status, so it is broader than the triple-positive
      heading it is filed under.
    os: not yet reported
    phase: 2
    population: Women aged at least 18 years with previously untreated, centrally confirmed HER2-positive stage I-IIIA invasive
      breast cancer of any hormone receptor status.
    primary_ref: llombart2017
    pubs:
    - kind: primary
      ref: llombart2017
      role: primary
    result: Pathological complete response occurred in 41% of 101 HER2-enriched tumours and in 10% of 50 non-HER2-enriched
      tumours. The odds ratio was 6.2 (95% CI 2.3-16.8, p=0.0004).
    reviewed: '2026-09-14'
