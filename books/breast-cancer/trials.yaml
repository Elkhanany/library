    digest:
      methods: Prospective open-label single-arm phase 2 trial. Patients aged 18 years or older with HER2-positive breast
        cancer and newly diagnosed untreated brain metastases or brain metastases progressing after local therapy, with previous
        trastuzumab and pertuzumab and no indication for immediate local therapy, received trastuzumab deruxtecan 5.4 mg/kg
