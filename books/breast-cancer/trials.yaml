  calor:
    acronym: CALOR
    chapters:
    - BC-530
    cited_by:
    - BC-530
    claim: benefit confined to ER-negative recurrence, 10-year DFS 70% vs 34%, HR 0.29; ER-positive HR 1.07
    digest:
      methods: CALOR was a pragmatic, open-label, randomised trial. It accrued patients with histologically proven, completely
        excised isolated locoregional recurrence after unilateral breast cancer treated by mastectomy or lumpectomy with clear
        surgical margins. Patients were centrally randomised 1:1 to chemotherapy, type selected by the investigator, or to
        no chemotherapy, stratified by previous chemotherapy, hormone receptor status and location of the recurrence. Endocrine
        therapy, radiotherapy for involved margins and anti-HER2 therapy were specified separately. The primary endpoint was
        disease-free survival.
      results: From August 2003 to January 2010, 85 patients were assigned chemotherapy and 77 no chemotherapy. At a median
        follow-up of 4.9 years, 24 of 85 (28%) in the chemotherapy group had a disease-free survival event, compared with
        34 of 77 (44%). Five-year disease-free survival was 69% with chemotherapy and 57% without (hazard ratio 0.59, 95%
        CI 0.35-0.99, p=0.046). Benefit was greater for oestrogen receptor-negative recurrence (p interaction 0.046). Serious
        adverse events occurred in 12 of 81 treated patients.
    line: adjuvant
    modality: chemo
    nct: NCT00074152
    phase: 3
    primary_ref: aebi2014
    pubs:
    - kind: primary
      ref: aebi2014
      role: primary
    setting: recurrence
    status: reported
    subtype: all
    topic: adjuvant chemotherapy after completely excised isolated locoregional recurrence
