  tbcrc048:
    acronym: TBCRC 048
    arms: Single arm of olaparib 300 mg orally twice daily in two cohorts, cohort 1 germline mutations in homologous recombination
      genes other than BRCA1 and BRCA2, cohort 2 somatic mutations in those genes or in BRCA1 or BRCA2.
    chapters:
    - BC-070
    - BC-120
    - BC-180
    - BC-380
    - BC-450
    - BC-590
    - BC-890
    - BC-920
    cited_by:
    - BC-180
    - BC-580
    - BC-590
    claim: responses confined to germline PALB2 and somatic BRCA1/2; none with ATM or CHEK2
    digest:
      methods: Investigator-initiated phase II study of olaparib in metastatic breast cancer with measurable disease. Cohort
        1 had germline mutations in homologous recombination related genes. Cohort 2 had somatic mutations in those genes.
        Prior PARP inhibitor use, platinum-refractory disease, or progression on more than two chemotherapy regimens for metastatic
        disease were not allowed. Patients received olaparib 300 mg orally twice a day until progression. A single-arm, two-stage
        design was used. The primary endpoint was objective response rate.
      results: Fifty-four patients enrolled. Seventy-six percent had oestrogen receptor-positive HER2-negative disease. Objective
        response rate was 33% (90% CI 19% to 51%) in cohort 1 and 31% (90% CI 15% to 49%) in cohort 2. Confirmed responses
        were seen in only two mutation groups, with response rates of 82% and 50%. Median progression-free survival was 13.3
        months (90% CI 12 months to not available) and 6.3 months (90% CI 4.4 months to not available) in those two groups.
    endpoint: Objective response rate, with a single-arm two-stage design in each cohort.
    line: any
    modality: parp
    n: 54
    os: Not reported. Overall survival was not an endpoint of this single-arm study.
    phase: 2
    population: metastatic breast cancer with germline mutations in homologous recombination related genes other than BRCA1
      and BRCA2 (cohort 1) or somatic mutations in those genes or in BRCA1/2 (cohort 2); 76% oestrogen receptor-positive HER2-negative
    primary_ref: tung2020
    pubs:
    - kind: primary
      ref: tung2020
      role: report
    - kind: subgroup
      ref: tung2026a
      role: expansion
    result: Objective response rate was 33% (90% CI 19% to 51%) in cohort 1 and 31% (90% CI 15% to 49%) in cohort 2. Confirmed
      responses occurred only with germline PALB2, response rate 82%, and with somatic BRCA1 or BRCA2, response rate 50%.
      Median progression-free survival was 13.3 months and 6.3 months in those two groups. No responses occurred with ATM
      or CHEK2 mutations alone.
    reviewed: '2026-09-14'
    setting: metastatic
