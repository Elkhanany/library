        survival rate was 91.1% with tamoxifen plus ovarian function suppression and 87.5% with tamoxifen alone (hazard ratio
        0.69, 95% CI 0.48 to 0.97, p=0.033). The estimated 5-year overall survival rate was 99.4% versus 97.8% (hazard ratio
        0.31, 95% CI 0.10 to 0.94, p=0.029). The 8-year follow-up reported 8-year disease-free survival of 85.4% versus 80.2%
        (hazard ratio 0.67).
    endpoint: disease-free survival
