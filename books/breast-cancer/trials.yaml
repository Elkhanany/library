        hormone receptor-positive, HER2-negative locally recurrent inoperable or metastatic breast cancer who had received
        at least one previous endocrine therapy, a taxane and a CDK4/6 inhibitor, plus two to four previous chemotherapy regimens
        for metastatic disease, were randomly assigned 1:1 to sacituzumab govitecan or chemotherapy (eribulin, vinorelbine,
