      results: Twenty-one patients received trastuzumab deruxtecan. The 16-week progression-free survival rate was 87.5 percent
        (95% CI 47.3 to 99.7) in cohort 1. Intracranial objective response rate was 50.0 percent in cohort 2 and 44.4 percent
        in cohort 3, and 46.2 percent overall in patients with active brain metastases. Objective response among patients
        with measurable lesions was 66.7 percent, all partial. Two patients (9.5 percent) had grade 1 interstitial lung disease.
