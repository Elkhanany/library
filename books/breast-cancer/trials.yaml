    claim: switch to exemestane improves disease-free survival with a modest survival effect
    digest:
      methods: 4724 postmenopausal patients with unilateral invasive, oestrogen-receptor-positive or oestrogen-receptor-unknown
        breast cancer who were disease-free on 2-3 years of tamoxifen were randomly assigned to switch to exemestane (n=2352)
        or to continue tamoxifen (n=2372) for the remainder of a 5-year endocrine treatment period. The primary endpoint was
        disease-free survival. Overall survival was a secondary endpoint. Efficacy analyses were intention to treat.
      results: After a median follow-up of 55.7 months, 809 disease-free survival events were reported, 354 with exemestane
        and 455 with tamoxifen. The unadjusted hazard ratio was 0.76 (95% CI 0.66-0.88, p=0.0001) in favour of exemestane,
        an absolute benefit of 3.3% (1.6-4.9) by the end of treatment. There were 222 deaths with exemestane and 261 with
        tamoxifen, hazard ratio 0.85 (0.71-1.02, p=0.08), and 0.83 (0.69-1.00, p=0.05) after excluding 122 patients with oestrogen-receptor-negative
        disease.
