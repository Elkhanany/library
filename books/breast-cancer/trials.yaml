    digest:
      methods: Phase 3 randomised clinical trial. Postmenopausal women with clinical stage II to III, estrogen receptor-rich,
        ERBB2-negative breast cancer received anastrozole, fulvestrant or the combination for 6 months preoperatively. Tumour
        Ki67 was assessed at week 4 and optionally at week 12, and patients with Ki67 above 10% switched to neoadjuvant chemotherapy
        or immediate surgery. The primary outcome was the endocrine-sensitive disease rate. A secondary outcome was percentage
        change in Ki67 after 4 weeks.
      results: Between February 2014 and November 2018, 1362 female patients were enrolled. Among 1298 evaluable patients,
        endocrine-sensitive disease rates were 18.7% with anastrozole, 22.8% with fulvestrant and 20.5% with the combination.
        Neither fulvestrant-containing regimen significantly improved that rate or week 4 Ki67 suppression. Ki67 above 10%
        at week 4 or 12 occurred in 25.1%, 24.2% and 15.7% respectively. PAM50 subtyping of 753 baseline biopsies identified
        394 luminal A, 304 luminal B and 55 nonluminal tumours.
