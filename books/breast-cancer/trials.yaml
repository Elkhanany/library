        35 (60%) invasive. 53 tumors (91%) were 2 cm or smaller. Four patients had a further breast recurrence, a 5-year cumulative
        incidence of 5% (95% CI 1%-13%). Seven underwent ipsilateral mastectomy, a 5-year cumulative incidence of 10% (95%
        CI 4%-20%). Distant metastasis-free survival and overall survival were both 95%. Four patients (7%) had grade 3 late
        adverse events.
