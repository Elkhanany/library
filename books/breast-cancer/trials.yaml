    cited_by:
    - BC-390
    digest:
      methods: Multicentre study. Patients whose tumour did not achieve a pathologically documented complete response after
        neoadjuvant chemotherapy entered a 5-year liquid biopsy surveillance programme. The primary objective was relapse-free
        interval in patients with or without circulating tumour DNA detection during adjuvant follow-up. Whole genome sequencing
        of primary tumour samples supported personalised multiplex digital PCR assays that tracked structural variants in
        plasma.
      results: Eighty-three patients had a successful structural variant fingerprint designed, covering 473 plasma samples.
        Median follow-up from surgery was 60.6 months and 27 clinical recurrences (32.5%) occurred. Circulating tumour DNA
        was detected in 34 patients, 15 of them (44.1%) below 100 parts per million at the earliest positive sample. Detection
        predicted shorter relapse-free interval, hazard ratio 29.2 (95% CI 6.9 to 124.0, P<0.0001). Median lead time to relapse
        was 13.9 months. Sensitivity for relapse was 92.6%.
