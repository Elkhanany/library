    pubs:
    - kind: primary
      ref: domchek2020
      role: primary
    result: 24 of 30 patients eligible for the activity analysis had disease control at 12 weeks, 80% (90% CI 64.3 to 90.9).
      Grade 3 or worse adverse events occurred in 11 of the 34 patients treated, 32%.
    setting: metastatic
    source:
