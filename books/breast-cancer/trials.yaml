  ncctg-n0574:
    acronym: NCCTG N0574
    arms: Stereotactic radiosurgery alone versus stereotactic radiosurgery plus whole brain radiotherapy
    chapters:
    - BC-930
    digest:
      methods: Patients with one to three brain metastases at 34 North American institutions were randomised between February
        2002 and December 2013 to radiosurgery alone or radiosurgery plus whole brain radiotherapy. Whole brain radiotherapy
        was 30 Gy in 12 fractions. Radiosurgery was 18 to 22 Gy in the combined group and 20 to 24 Gy alone. The primary endpoint
        was cognitive deterioration at 3 months.
      results: Of 213 patients randomised, 111 received radiosurgery alone and 102 radiosurgery plus whole brain radiotherapy.
        Cognitive deterioration at 3 months was 63.5% versus 91.7%, difference -28.2%, p<0.001. Overall quality of life change
        was -0.1 versus -12.0 points, p=0.001. Time to intracranial failure was shorter with radiosurgery alone, hazard ratio
        3.6. Functional independence did not differ, p=0.26.
    endpoint: Cognitive deterioration at 3 months, defined as a decline of more than 1 standard deviation from baseline on
      at least one cognitive test
    modality: radiation
    n: 213
    nct: NCT00377156
    note: The abstract does not state a trial phase, and the trial enrolled brain metastases of any primary histology rather
      than breast cancer only.
    os: Median overall survival was 10.4 months with radiosurgery alone and 7.4 months with radiosurgery plus whole brain
      radiotherapy, hazard ratio 1.02, p=0.92. There was no significant difference.
    population: Patients with one to three brain metastases treated at 34 North American institutions.
    primary_ref: brown2016
    pubs:
    - kind: primary
      ref: brown2016
      role: primary
    result: Cognitive deterioration at 3 months occurred in 63.5% of patients after radiosurgery alone versus 91.7% after
      radiosurgery plus whole brain radiotherapy, a difference of -28.2%, p<0.001.
    reviewed: '2026-09-14'
    setting: cns
    source:
    - group: Radiotherapy foundations and systemic treatment combinations
