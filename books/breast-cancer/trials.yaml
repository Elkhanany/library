  ember3:
    acronym: EMBER-3
    arms: imlunestrant, or imlunestrant with abemaciclib, vs standard endocrine monotherapy
    chapters:
    - BC-430
    - BC-870
    - BC-880
    cited_by:
    - BC-430
    - BC-560
    - BC-870
    - BC-880
    digest:
      methods: In a phase 3, open-label trial, patients with ER-positive, HER2-negative advanced breast cancer that recurred
        or progressed during or after aromatase inhibitor therapy, given alone or with a CDK4/6 inhibitor, were assigned in
        a 1:1:1 ratio to imlunestrant, standard endocrine monotherapy, or imlunestrant with abemaciclib. Primary end points
        were investigator-assessed progression-free survival for imlunestrant versus standard therapy in patients with ESR1
        mutations and in all patients, and for imlunestrant-abemaciclib versus imlunestrant among concurrently randomized
        patients.
