        survival events had occurred in 141 patients (12.8%) on atezolizumab plus chemotherapy and 125 (11.4%) on chemotherapy
        alone, with median follow-up 32 months. The stratified hazard ratio was 1.11 (95% CI 0.87-1.42, P=.38). Treatment-related
        grade 3 or 4 adverse events were 54% versus 44%.
