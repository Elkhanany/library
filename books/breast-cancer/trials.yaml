  natalee:
    acronym: NATALEE
    arms: ribociclib 400 mg daily, 3 weeks on and 1 week off, for 36 months plus a nonsteroidal aromatase inhibitor vs the
      aromatase inhibitor alone
    chapters:
    - BC-490
    - BC-800
    cited_by:
    - BC-490
    - BC-800
    claim: positive. 3-year iDFS difference 3.1 points; overall survival immature
    digest:
      methods: Phase 3 trial in women and men with HR-positive, HER2-negative early breast cancer of anatomical stage IIA
        (N0 with risk factors, or N1), IIB or III. Patients were randomised 1:1 to ribociclib 400 mg per day, three weeks
        on and one week off for 36 months, plus a non-steroidal aromatase inhibitor for 60 months (2549), or the aromatase
        inhibitor alone (2552). Premenopausal women and men also received goserelin. The primary endpoint was invasive disease-free
        survival.
      results: At the 21 July 2023 cut-off, ribociclib had been stopped in 1996 patients (78.3%) and 1091 (42.8%) had completed
        three years. Median follow-up for invasive disease-free survival was 33.3 months. There were 226 events with ribociclib
        plus the aromatase inhibitor and 283 with the inhibitor alone (hazard ratio 0.749; 95% CI 0.628 to 0.892; P = 0.0012).
        Three-year invasive disease-free survival was 90.7% versus 87.6%. Overall survival data were immature.
    endpoint: invasive disease-free survival
    line: adjuvant
    modality: cdk4-6
    n: 5101
    nct: NCT03701334
    os: immature; no significant difference at the final invasive disease-free survival analysis
    phase: 3
    population: HR-positive/HER2-negative disease at anatomical stage IIA to III, including selected node-negative tumours
    primary_ref: hortobagyi2025
