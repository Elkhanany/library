  triniti-1:
    acronym: TRINITI-1
    arms: Single arm of ribociclib plus everolimus plus exemestane, at two recommended phase II dose combinations.
    chapters:
    - BC-870
    - BC-880
    claim: week-24 clinical benefit rate 41.1% in a single arm, against a 10% threshold
    digest:
      methods: Multicentre, open-label, single-arm, phase I/II study in patients with locally advanced or metastatic hormone
        receptor-positive, HER2-negative breast cancer. Treatment was ribociclib, everolimus and exemestane, all once daily
        on days 1 to 28 of a 28-day cycle. The recommended phase II doses were ribociclib 300 mg with everolimus 2.5 mg and
        exemestane 25 mg in group 1, and ribociclib 200 mg with everolimus 5 mg and exemestane 25 mg in group 2. The primary
        endpoint was clinical benefit rate at week 24 among patients with endocrine-therapy-refractory disease that had progressed
        on a CDK4/6 inhibitor. Other endpoints included safety and biomarker analysis.
      results: Of 104 patients enrolled across phases I and II, 96 had received a prior CDK4/6 inhibitor. Clinical benefit
        rate at week 24 among the 95 efficacy-evaluable patients from phases I and II was 41.1% (95% CI 31.1 to 51.6), meeting
        the primary endpoint against a predetermined threshold of 10%. Common adverse events were neutropenia in 69.2% and
        stomatitis in 40.4%. No new safety signals were observed and no grade 3 or 4 QTc prolongation was reported. The authors
        describe the safety and efficacy results as preliminary and as supporting further investigation of combined CDK4/6
        and PI3K/AKT/mTOR blockade in this setting.
    endpoint: Clinical benefit rate at week 24 among patients with endocrine-therapy-refractory disease with progression on
      a CDK4/6 inhibitor.
    line: 2L
    modality: cdk4-6,pi3k-akt,endocrine
    n: 104
    note: Single-arm phase I/II study, so the 41.1% clinical benefit rate has no control comparison and cannot say which of
      the three drugs, or the continuation of CDK4/6 inhibition itself, produced it. n is the 104 patients enrolled across
      phases I and II; the primary endpoint was assessed in 95 efficacy-evaluable patients and 96 of the 104 had a prior CDK4/6
      inhibitor. Two dose groups were carried forward rather than one, and the efficacy figure pools them. The full text allowed
      up to three prior lines for advanced disease, one to three of them endocrine and no more than one of chemotherapy, and
      patients had a median of one prior endocrine line, so the line axis is 2L. The abstract gives no NCT number and no overall
      survival, so both fields are omitted.
