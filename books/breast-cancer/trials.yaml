  neotala:
    acronym: NEOTALA
    arms: Single arm, talazoparib 1 mg once daily for 24 weeks, 0.75 mg for moderate renal impairment, followed by surgery.
    chapters:
    - BC-860
    claim: Neoadjuvant talazoparib alone gave pCR 45.8%, short of the prespecified threshold
    digest:
      methods: Phase II, single-arm, open-label study of neoadjuvant talazoparib in patients with germline BRCA1/2-mutated
        early-stage triple-negative breast cancer. Patients received talazoparib 1 mg once daily for 24 weeks, reduced to
        0.75 mg for moderate renal impairment, followed by surgery. The primary endpoint was pathologic complete response
        by independent central review. Secondary endpoints included residual cancer burden by independent central review.
        Safety, tolerability and patient-reported outcomes were also assessed.
      results: Of 61 patients, 48 received at least 80% of talazoparib doses and underwent surgery, or progressed before pCR
        assessment and were counted as non-responders. The pathologic complete response rate was 45.8%, 95% CI 32.0 to 60.6,
        in the evaluable population and 49.2%, 95% CI 36.7 to 61.6, in the intention-to-treat population. Residual cancer
        burden 0 or I was 45.8%, 95% CI 29.4 to 63.2, and 50.8%, 95% CI 35.5 to 66.0, in the evaluable and intention-to-treat
        populations respectively. Treatment-related adverse events were reported in 58 patients, 95.1%, the commonest grade
        3 and 4 events being anaemia in 39.3% and neutropenia in 9.8%. There was no clinically meaningful detriment in quality
        of life, no deaths occurred during the reporting period, and two deaths from progressive disease occurred more than
        400 days after the first dose. The authors conclude that talazoparib monotherapy was active despite pCR rates not
        meeting the prespecified threshold, and that the rates were comparable with those of anthracycline- and taxane-based
        regimens.
    endpoint: Pathologic complete response by independent central review.
    line: neoadjuvant
    modality: parp
    n: 61
    nct: NCT03499353
    note: The primary endpoint was not met. Pathologic complete response fell below the prespecified statistical threshold
      even though the rates are close to those of combination chemotherapy, so the trial should be cited as a signal rather
      than as a positive study. The 45.8% figure has the 48-patient evaluable population as its denominator and the 49.2%
      figure the 61-patient intention-to-treat population. Eligibility required a germline BRCA1/2 mutation as well as triple-negative
      disease, so both tags apply.
    os: not reported. No deaths occurred during the reporting period and two deaths from progressive disease occurred more
      than 400 days after the first dose
    phase: '2'
    population: Patients with germline BRCA1/2-mutated early-stage triple-negative breast cancer.
    primary_ref: litton2023
    pubs:
    - kind: primary
      ref: litton2023
      role: primary
    result: pCR 45.8%, 95% CI 32.0 to 60.6, in the evaluable population and 49.2%, 95% CI 36.7 to 61.6, in the intention-to-treat
      population. Residual cancer burden 0 or I was 45.8%, 95% CI 29.4 to 63.2, and 50.8%, 95% CI 35.5 to 66.0, in the same
      two populations. The prespecified pCR threshold was not met.
    setting: early
    source:
    - ch: 63
      section: Additional studies — Early TNBC / hereditary HER2−
    status: reported
    subtype: TNBC,BRCA
    topic: chemotherapy-free neoadjuvant PARP inhibition in germline BRCA-mutated TNBC
    weight: exploratory
    year: 2023
  neotrip:
    acronym: NeoTRIP
    arms: atezolizumab added to carboplatin and nab-paclitaxel vs carboplatin and nab-paclitaxel, both followed by adjuvant
      anthracycline
    chapters:
    - BC-860
    cited_by:
    - BC-860
    digest:
      methods: 280 patients with triple-negative breast cancer were enrolled in this multicentre randomised study. They received
        neoadjuvant carboplatin AUC 2 and nab-paclitaxel 125 mg/m2 intravenously on days 1 and 8, without atezolizumab (n=142)
        or with atezolizumab 1200 mg intravenously on day 1 (n=138). Both regimens were given every 3 weeks for eight cycles
        before surgery, followed by four cycles of an adjuvant anthracycline regimen. The primary aim was event-free survival,
        with pathological complete response an important secondary aim.
      results: In the intention-to-treat analysis the pathological complete response rate was 48.6% with atezolizumab against
        44.4% without, odds ratio 1.18, 95% CI 0.74-1.89, P=0.48. Treatment-related adverse events were similar between regimens
        except for significantly more serious adverse events and liver transaminase abnormalities with atezolizumab. In multivariate
        analysis PD-L1 expression was the most significant factor influencing the rate of pathological complete response,
        odds ratio 2.08.
    endpoint: event-free survival. The pathological complete response tabulated here is a secondary endpoint
    line: neoadjuvant
    modality: immunotherapy,chemo
    n: 280
    note: The primary endpoint, event-free survival, was presented at a conference in 2023 and has not been published, so
      it is deliberately not tabulated here. What the row carries is the published pathological complete response, which is
      a secondary endpoint and does not settle the question the trial was designed to answer.
    os: not yet reported
    phase: 3
    population: high-risk and locally advanced TNBC
    primary_ref: gianni2022neotrip
    pubs:
    - kind: endpoint
      ref: gianni2022neotrip
      role: pcr report
    result: pathological complete response 48.6% with atezolizumab added to carboplatin and nab-paclitaxel against 44.4% without,
      odds ratio 1.18 (0.74-1.89), P=0.48
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 63
      group: Checkpoint blockade
      section: Early nonmetastatic disease
