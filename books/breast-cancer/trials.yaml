    digest:
      methods: Single-arm, open-label, five-cohort phase 2 trial. Cohort 5 enrolled seven patients with HER2-positive or HER2-low
        advanced breast cancer and pathologically confirmed leptomeningeal disease. They received trastuzumab deruxtecan 5.4
        mg/kg intravenously every 21 days until disease progression or unacceptable toxicity. The primary endpoint was overall
        survival, with progression-free survival and safety as key secondary endpoints.
