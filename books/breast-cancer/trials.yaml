      section: Brain and leptomeningeal metastases
    status: reported
    subtype: all
    topic: pembrolizumab in BM of diverse histologies, Brastianos phase II including breast cancer, intracranial-response
    year: 2023
  pembrolizumab-lmd-cohort:
    acronym: Pembrolizumab in leptomeningeal carcinomatosis
    arms: Single arm of pembrolizumab 200 mg intravenously every 3 weeks until definitive progression or unacceptable toxicity.
    chapters:
    - BC-930
    digest:
      methods: Single-arm, open-label phase 2 study of pembrolizumab 200 mg intravenously every 3 weeks in patients with solid
        tumour malignancies and leptomeningeal dissemination of disease. The primary endpoint was the rate of overall survival
        at 3 months. A Simon two-stage design compared a null hypothesis of 18% against an alternative of 43%. Secondary objectives
        were toxicity, response rate and time to intracranial or extracranial progression.
      results: 20 patients were enrolled into the prespecified evaluation group, 17 with breast cancer, two with lung cancer
        and one with ovarian cancer. Median follow-up of surviving patients was 6.3 months. 12 of 20 were alive at 3 months,
        giving an overall survival rate at 3 months of 0.60 (90% CI 0.39 to 0.78), which met the primary endpoint. 40% had
        one or more grade 3 or higher adverse events at least possibly related to treatment.
    endpoint: Overall survival at 3 months, under a Simon two-stage design testing a null of 18% against an alternative of
      43%.
    modality: immunotherapy
    n: 20
    nct: NCT02886585
    note: This is the leptomeningeal cohort of NCT02886585 and shares its registration with the parenchymal brain metastasis
      cohorts reported separately as `pembrolizumab-in-bm-of-diverse-histologi`. The two are keyed separately because the
      population, the primary endpoint and the report are different, and they must never be merged. The comparator is a historical
      three-month survival written into the protocol rather than a concurrent arm, and three of the 20 patients did not have
      breast cancer.
    os: Overall survival at 3 months was the primary endpoint and was 0.60 (90% CI 0.39 to 0.78). No median overall survival
      is reported.
    phase: 2
    population: Patients with leptomeningeal dissemination from solid tumours, 17 of 20 with breast cancer, the remainder
      with lung or ovarian cancer.
    primary_ref: brastianos2020
    pubs:
    - kind: primary
      ref: brastianos2020
      role: primary
    result: 12 of 20 patients were alive at 3 months, giving overall survival at 3 months of 0.60 (90% CI 0.39 to 0.78), which
      met the primary endpoint. There was no comparator arm.
    reviewed: '2026-09-16'
    setting: cns
    status: reported
    subtype: all
    topic: Brastianos phase II in solid-tumour leptomeningeal disease, mostly breast cancer, leptomeningeal
    year: 2020
  pembrolizumab-plus-radiotherapy-in-metas:
    acronym: Pembrolizumab plus radiotherapy in metastatic TNBC
    arms: Single arm of pembrolizumab 200 mg every three weeks with 3000 cGy radiotherapy in five fractions.
    chapters:
    - BC-920
    digest:
      methods: Single-arm, Simon two-stage phase 2 trial that enrolled 17 patients with metastatic triple-negative breast
        cancer, median age 52 years, unselected for programmed death-ligand 1 expression. Radiotherapy of 3000 cGy was delivered
        in five daily fractions. Pembrolizumab 200 mg was given intravenously within three days of the first radiotherapy
        fraction and then every three weeks until progression. The primary endpoint was overall response rate at week 13 in
        unirradiated lesions by RECIST version 1.1.
      results: The overall response rate was 17.6%, three of 17 patients (95% CI 4.7-44.2), with three complete responses,
        one stable disease and 13 progressive disease. Eight patients died before week 13 from progression. Among the nine
        women assessed at week 13, three (33%) had a complete response with 100% tumour volume reduction outside the irradiated
        field, durable for 18, 20 and 108 weeks. Four grade 3 events were attributed to pembrolizumab.
    endpoint: Overall response rate at week 13 in unirradiated lesions by RECIST version 1.1.
    modality: immunotherapy,radiation
    n: 17
    note: The abstract does not state how many prior lines of therapy patients had received, so line is left null.
    os: not yet reported
    phase: 2
    population: Patients with metastatic triple-negative breast cancer unselected for programmed death-ligand 1 expression.
    primary_ref: ho2019
    pubs:
    - kind: primary
      ref: ho2019
      role: primary
    result: The overall response rate at week 13 was 17.6%, three of 17 patients (95% CI 4.7-44.2). This was a single-arm
      study with no control group.
    reviewed: '2026-09-14'
    setting: metastatic
    source:
