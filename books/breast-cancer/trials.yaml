  bylieve:
    acronym: BYLieve
    arms: Single arm of alpelisib 300 mg daily plus fulvestrant 500 mg, cohort A of a non-comparative study.
    chapters:
    - BC-870
    digest:
      methods: Ongoing phase 2, multicentre, open-label, non-comparative study at 114 sites in 18 countries. Cohort A enrolled
        adults with hormone receptor-positive, HER2-negative advanced breast cancer and a tumour PIK3CA mutation who had progressed
        on a CDK4/6 inhibitor plus an aromatase inhibitor as immediate previous treatment, with ECOG 2 or less and no more
        than two prior anticancer treatments. Patients received alpelisib 300 mg daily plus fulvestrant 500 mg. Primary endpoint
        was the proportion alive without progression at 6 months.
      results: 127 patients with at least 6 months of follow-up were enrolled in cohort A and 121 had a centrally confirmed
        PIK3CA mutation. Median follow-up was 11.7 months. 61 of 121 patients, 50.4% (95% CI 41.2 to 59.6), were alive without
        disease progression at 6 months. Grade 3 or worse hyperglycaemia occurred in 28%, rash in 9% and maculopapular rash
        in 9%. Serious adverse events occurred in 26%. No treatment-related deaths were reported.
    endpoint: Proportion of patients alive without disease progression at 6 months by local RECIST 1.1 assessment.
    line: 2L
    modality: pi3k-akt,endocrine
    n: 127
    nct: NCT03056755
    note: The Lancet Oncology published an expression of concern about this cohort A report in 2023.
