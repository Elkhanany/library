    year: 2012
  neolbc:
    acronym: NEOLBC
    arms: Ribociclib plus letrozole vs standard neoadjuvant chemotherapy.
    chapters:
    - BC-810
    claim: Ribociclib-letrozole gave similar cell-cycle arrest to chemotherapy, 35.3% vs 31.3%
    digest:
      methods: Randomised phase II trial tailoring neoadjuvant therapy in postmenopausal patients with early, luminal, HER2-negative,
        stage II or III breast cancer according to the percentage of Ki67-positive cancer cells after two weeks of letrozole.
        Patients with a Ki67 of 1% or higher were randomised between ribociclib plus letrozole and standard chemotherapy.
        The primary endpoint was whether ribociclib plus letrozole doubles the rate of complete cell-cycle arrest, Ki67 below
        1% by immunohistochemistry, in the surgical specimen compared with chemotherapy. Secondary endpoints included pathologic
        response and toxicity.
      results: Of 161 registered patients, 70 were randomised and 66 started the allocated treatment. Complete cell-cycle
        arrest in the surgical specimen was similar for both groups, 35.3% in the ribociclib plus letrozole group and 31.3%
        in the chemotherapy group (P = 0.73). Response according to Miller and Payne was not significantly different between
        the two groups, nor was the pathological complete response rate. Overall toxicity was observed more often in the chemotherapy
        group; eight patients discontinued for toxicity in the ribociclib plus letrozole group and 10 in the chemotherapy
        group. The authors conclude that although the primary endpoint was not met, ribociclib plus letrozole as an alternative
        to neoadjuvant chemotherapy merits further investigation.
    endpoint: Complete cell-cycle arrest, Ki67 below 1% on immunohistochemistry, in the surgical specimen, with the trial
      designed to detect a doubling of that rate over chemotherapy.
    line: neoadjuvant
    modality: cdk4-6,endocrine,chemo
    n: 70
    nct: NCT03283384
    note: The primary endpoint was negative, and that is the point of the row. It marks a boundary on the chemotherapy-replacement
      story rather than support for it. The n of 70 is the number randomised; 161 patients were registered and only those
      with a Ki67 of 1% or higher after the two-week letrozole run-in went on to randomisation, and 66 actually started the
      allocated treatment, so the trial is much smaller than its registration figure suggests. The source document also lists
      the trial as BOOG 2017-01.
    phase: '2'
    population: Postmenopausal patients with early, luminal, HER2-negative, stage II or III breast cancer whose Ki67 was 1%
      or higher after two weeks of letrozole.
    primary_ref: degroot2025
    pubs:
    - kind: primary
      ref: degroot2025
      role: primary
    result: Complete cell-cycle arrest in the surgical specimen was similar in both groups, 35.3% with ribociclib plus letrozole
      and 31.3% with chemotherapy (P = 0.73), so the primary endpoint was not met. Response by Miller and Payne and the pathological
      complete response rate did not differ significantly either, and overall toxicity was observed more often in the chemotherapy
      group.
    setting: early
    source:
    - ch: 56
      section: Additional studies — Early HR+/HER2−
    status: reported
    subtype: HR+/HER2-
    topic: CDK4/6 inhibition with endocrine therapy as a less toxic alternative to neoadjuvant chemotherapy, after an endocrine-response
      run-in
    weight: exploratory
    year: 2025
