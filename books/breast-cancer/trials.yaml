      ng/L, with tamoxifen, decreased by 61 percent, -19.5 ng/L, with tamoxifen plus GnRH analogue, and decreased by 64 percent,
      -17.0 ng/L, with aromatase inhibitor plus GnRH analogue, p less than 0.001.
