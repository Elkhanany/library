    digest:
      methods: Open label randomised phase III trial of 5 years of exemestane versus 5 years of anastrozole in postmenopausal
        women with hormone dependent early breast cancer. The two sided superiority design was powered to detect a 2.4 percent
        improvement with exemestane in 5 year event free survival. Secondary objectives were overall survival, distant disease
        free survival, incidence of contralateral new primary breast cancer, and safety.
