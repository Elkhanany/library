    modality: adc,immunotherapy
    n: 202
    nct: NCT02924883
    note: The primary endpoint was negative and the study was unmasked early for futility, so the clinical cutoff is the unmasking
      date and follow-up is short, with medians of 8.5 and 8.4 months. The authors argue for further study in a PD-L1-positive
      subpopulation, but the abstract reports no PD-L1 subgroup figures, so no subgroup result is tabulated here. Entry required
