  neomonarch:
    acronym: neoMONARCH
    arms: 2-week lead-in of abemaciclib plus anastrozole, or abemaciclib alone, vs anastrozole alone, then 14 weeks of the
      combination in all groups
    chapters:
    - BC-810
    cited_by:
    - BC-810
    digest:
      methods: Phase 2 neoadjuvant study. Postmenopausal women with stage I to IIIB HR-positive, HER2-negative breast cancer
        were randomised to a two-week lead-in of abemaciclib, anastrozole, or abemaciclib plus anastrozole, followed by 14
        weeks of the combination. The primary objective was change in Ki67 from baseline to two weeks of treatment. Additional
        objectives were clinical, radiologic and pathologic response, safety, and gene expression changes related to cell
        proliferation and immune response.
      results: Abemaciclib, alone or with anastrozole, gave a significant decrease in Ki67 expression and potent cell-cycle
        arrest at two weeks compared with anastrozole alone. Complete cell-cycle arrest was reached in 58% and 68% of the
        abemaciclib-containing arms versus 14% with anastrozole (P < 0.001). At the end of treatment 46% of intent-to-treat
        patients achieved a radiologic response and 4% a pathological complete response. The most common all-grade adverse
        events were diarrhea (62%), constipation (44%) and nausea (42%).
    endpoint: change in Ki67 from baseline to 2 weeks
    line: neoadjuvant
    modality: cdk4-6,endocrine
    n: 224
    os: not reported
    phase: 2
    population: postmenopausal, stage I-IIIB; 190 of 224 went on to surgery
    primary_ref: hurvitz2020neomonarch
    pubs:
    - kind: primary
      ref: hurvitz2020neomonarch
      role: primary
    result: complete cell-cycle arrest in 68% with the combination and 58% with abemaciclib vs 14% with anastrozole, P < 0.001;
      pCR in 4% of the 190 patients operated
    reviewed: '2026-09-14'
