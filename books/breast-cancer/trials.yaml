  ecog-e1199:
    acronym: ECOG E1199
    arms: After doxorubicin and cyclophosphamide, paclitaxel or docetaxel, each given every 3 weeks for four cycles or weekly
      for 12 cycles.
    chapters:
    - BC-490
    - BC-510
    - BC-850
    digest:
      methods: 4,950 women with axillary lymph node-positive or high-risk lymph node-negative breast cancer were enrolled.
        All first received four cycles of intravenous doxorubicin and cyclophosphamide at 3-week intervals. They were then
        assigned to intravenous paclitaxel or docetaxel, given at 3-week intervals for four cycles or at 1-week intervals
        for 12 cycles. The primary end point was disease-free survival.
      results: Against standard paclitaxel every 3 weeks, the odds ratio for disease-free survival was 1.27 with weekly paclitaxel
        (P=0.006), 1.23 with docetaxel every 3 weeks (P=0.02) and 1.09 with weekly docetaxel (P=0.29). Weekly paclitaxel also
        improved survival, odds ratio 1.32, P=0.01. An exploratory subgroup whose tumours expressed no HER2 protein showed
        similar gains regardless of hormone receptor expression. Grade 2 to 4 neuropathy was more frequent with weekly paclitaxel,
        27% versus 20%.
    endpoint: Disease-free survival
    line: adjuvant
    modality: chemo
    n: 4950
    nct: NCT00004125
    note: The document files this cross-subtype chemotherapy trial under both the HR+/HER2- and the triple-negative overview
      headings, which is consistent with the all-comers population.
    os: Weekly paclitaxel improved overall survival against paclitaxel every 3 weeks, odds ratio 1.32, P=0.01.
    phase: 3
    population: Women with axillary lymph node-positive or high-risk lymph node-negative operable breast cancer, enrolled
      without regard to receptor subtype.
    primary_ref: sparano2008
    pubs:
    - kind: primary
      ref: sparano2008
      role: primary
    result: Against paclitaxel every 3 weeks, the odds ratio for disease-free survival was 1.27 with weekly paclitaxel (P=0.006),
      1.23 with docetaxel every 3 weeks (P=0.02) and 1.09 with weekly docetaxel (P=0.29), an odds ratio above 1 favouring
