  paloma3:
    acronym: PALOMA-3
    arms: palbociclib plus fulvestrant vs placebo plus fulvestrant
    chapters:
    - BC-140
    - BC-160
    - BC-170
    - BC-300
    - BC-330
    - BC-345
    - BC-390
    - BC-430
    - BC-870
    - BC-880
    cited_by:
    - BC-160
    - BC-300
    - BC-345
    - BC-880
    digest:
      methods: Multicentre, double-blind, randomised phase 3 study at 144 centres in 17 countries. Women with hormone-receptor-positive,
        HER2-negative metastatic breast cancer that had progressed on previous endocrine therapy were randomly assigned 2:1
        to oral palbociclib 125 mg daily for 3 weeks of each 28-day cycle plus fulvestrant 500 mg, or placebo plus fulvestrant.
        Stratification was by sensitivity to previous hormonal therapy, menopausal status and visceral metastasis. The primary
        endpoint was investigator-assessed progression-free survival, analysed by intention to treat.
      results: Between Oct 7, 2013, and Aug 26, 2014, 521 patients were assigned, 347 to fulvestrant plus palbociclib and
        174 to fulvestrant plus placebo. Median follow-up was 8.9 months. Median progression-free survival was 9.5 months
        (95% CI 9.2-11.0) versus 4.6 months (3.5-5.6), hazard ratio 0.46 (95% CI 0.36-0.59, p<0.0001). Grade 3 or 4 adverse
        events occurred in 73% versus 22% of patients. The 2022 analysis reported median overall survival 34.8 versus 28.0
        months (hazard ratio 0.81).
    endpoint: investigator-assessed progression-free survival
    line: 2L
    modality: cdk4-6,endocrine
    n: 521
    nct: NCT01942135
    os: median OS 34.9 vs 28.0 months, HR 0.81, not significant; 39.7 vs 29.7 months in the 410 patients with previous endocrine
