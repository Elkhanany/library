    digest:
      methods: Patients with one to three newly diagnosed brain metastases were randomly allocated whole-brain radiotherapy
        or whole-brain radiotherapy followed by a stereotactic radiosurgery boost. Stratification was by number of metastases
        and extracranial disease status. The primary outcome was survival. Secondary outcomes were tumour response, local
        and overall intracranial recurrence rates, cause of death and performance measurements.
      results: 333 patients were enrolled at 55 institutions, 167 assigned whole-brain radiotherapy plus radiosurgery and
        164 whole-brain radiotherapy alone. In patients with a single metastasis median survival was 6.5 versus 4.9 months
        (p = 0.0393). A stable or improved Karnofsky score at 6 months was seen in 43% versus 27% (p = 0.03). On multivariate
        analysis survival improved with RPA class 1 (p < 0.0001) and favourable histology (p = 0.0121).
