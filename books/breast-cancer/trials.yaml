    year: 2023
  nsabp-b-14:
    acronym: NSABP B-14
    arms: Tamoxifen 10 mg twice daily after surgery versus placebo.
    chapters:
    - BC-490
    - BC-790
    digest:
      methods: Randomised, double-blind, placebo-controlled trial of postoperative tamoxifen 10 mg twice daily in 2,644 patients
        with breast cancer, histologically negative axillary nodes, and estrogen-receptor-positive tumours of at least 10
        fmol. Disease-free survival and survival were compared over four years of follow-up, with multivariate analysis of
        subgroups. A later correlative study measured a 21-gene recurrence score by RT-PCR in tumour blocks from tamoxifen-treated
        patients.
      results: Disease-free survival was 83 percent with tamoxifen versus 77 percent with placebo (P<0.00001), and survival
        93 versus 92 percent (P=0.3). Benefit held in women 49 or younger (P=0.0005) and 50 or older (P=0.0008). Tamoxifen
        reduced local and distant treatment failure, contralateral tumours, and recurrence after lumpectomy. In 668 assayed
        tumours, 10-year distant recurrence was 6.8, 14.3 and 30.5 percent across low, intermediate and high recurrence-score
        groups.
    endpoint: Disease-free survival.
    line: adjuvant
    modality: endocrine
    n: 2644
    note: The registry topic names the recurrence-score validation cohort, which is a correlative analysis of the tamoxifen-treated
      arm rather than the randomised comparison reported here.
    os: Survival at four years was 93 percent with tamoxifen and 92 percent with placebo (P=0.3), so no survival advantage
      was seen at that point.
    phase: 3
    population: Women with operable breast cancer, histologically negative axillary nodes, and estrogen-receptor-positive
      tumours of at least 10 fmol.
    primary_ref: fisher1989
    pubs:
    - kind: biomarker
      ref: paik2004
      role: assay paper
    - kind: primary
      ref: fisher1989
      role: primary
    result: Disease-free survival at four years was 83 percent with tamoxifen and 77 percent with placebo (P<0.00001).
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 53
      group: Assay-validation cohorts / chemotherapy foundations (cross-subtype)
      section: Early nonmetastatic disease
    - ch: 54
      group: Tamoxifen foundation
      section: Early nonmetastatic disease
    status: reported
    subtype: HR+/HER2-
    topic: recurrence-score validation cohort, recurrence-score-cohort
    year: 1989
  nsabp-b-18:
    acronym: NSABP B-18
    arms: Four cycles of doxorubicin and cyclophosphamide before surgery versus the same chemotherapy after surgery.
    chapters:
    - BC-400
    - BC-810
    - BC-830
    - BC-860
    digest:
      methods: 1,523 women with primary operable breast cancer were randomly assigned to doxorubicin and cyclophosphamide
        given preoperatively or postoperatively. Clinical tumour response to preoperative therapy was graded complete, partial
        or absent, and clinical complete responses were classified as pathologic complete response or residual invasive cells.
        Disease-free survival, distant disease-free survival and survival were estimated through five years and updated through
        nine years.
      results: No significant difference in disease-free survival, distant disease-free survival or survival at five years
        (P=.99, .70 and .83). At nine years survival was 69 versus 70 percent and disease-free survival 55 versus 53 percent.
        Lumpectomy with radiotherapy was more frequent after preoperative therapy (67.8 versus 59.8 percent). Relapse-free
        survival was 85.7 percent after pathologic complete response versus 63.9 percent with no clinical response (P<.0001).
    endpoint: Disease-free survival and overall survival.
    line: neoadjuvant
    modality: chemo
    n: 1523
    note: B-18 enrolled all-comers with operable breast cancer and is not a triple-negative trial, although the source document
      files it under the early triple-negative overview as a neoadjuvant chemotherapy foundation.
    os: Survival at nine years was 69 percent with preoperative chemotherapy and 70 percent with postoperative chemotherapy
      (P=.80), a difference that was not significant.
    phase: 3
    population: Women with primary operable breast cancer of stage I or II, without restriction by hormone receptor status.
    primary_ref: fisher1998a
    pubs:
    - kind: primary
      ref: fisher1998a
      role: report
    - kind: follow-up
      ref: wolmark2001
      role: 9-year report
    result: Disease-free survival and survival did not differ between preoperative and postoperative chemotherapy (P=.99 and
      P=.83 at five years; 55 versus 53 percent disease-free survival at nine years, P=.50).
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 61
      group: Early triple-negative disease (overview)
      section: Early nonmetastatic disease
    status: reported
    subtype: all
    topic: preoperative versus postoperative chemotherapy
    year: 1998
  nsabp-b-20:
    acronym: NSABP B-20
    arms: Methotrexate and fluorouracil plus tamoxifen, or cyclophosphamide, methotrexate and fluorouracil plus tamoxifen,
      versus tamoxifen alone.
    chapters:
    - BC-490
    - BC-790
    digest:
      methods: 2,306 patients with node-negative, estrogen receptor-positive breast cancer were randomly assigned after surgery
        to one of three groups. 771 assessable patients received tamoxifen alone, 767 received methotrexate, fluorouracil
        and tamoxifen, and 768 received cyclophosphamide, methotrexate, fluorouracil and tamoxifen. Disease-free survival,
        distant disease-free survival and survival were estimated by the Kaplan-Meier method with two-sided P values. A later
        analysis measured the 21-gene recurrence score in 651 tumours.
      results: Through five years, disease-free survival was 90 and 89 percent with the two chemotherapy plus tamoxifen regimens
        versus 85 percent with tamoxifen (P=.01 and .001), distant disease-free survival 92 and 91 versus 87 percent, and
        survival 97 and 96 versus 94 percent. Benefit was greatest in patients aged 49 or under. Chemotherapy benefit interacted
        with recurrence score (P=.038), being large at scores of 31 or more and minimal below 18.
    endpoint: Disease-free survival.
    line: adjuvant
    modality: chemo,endocrine
    n: 2306
    os: Five-year survival was 97 percent with methotrexate and fluorouracil plus tamoxifen and 96 percent with CMF plus tamoxifen,
      versus 94 percent with tamoxifen alone (P=.05 and P=.03).
    phase: 3
    population: Patients with axillary lymph node-negative, estrogen receptor-positive breast cancer treated surgically.
    primary_ref: fisher1997
    pubs:
    - kind: primary
      ref: fisher1997
      role: primary
    - kind: biomarker
      ref: paik2006
      role: recurrence-score predictive analysis
    result: Five-year disease-free survival was 90 percent with methotrexate and fluorouracil plus tamoxifen and 89 percent
      with CMF plus tamoxifen, versus 85 percent with tamoxifen alone (P=.01 and P=.001).
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 53
      group: Assay-validation cohorts / chemotherapy foundations (cross-subtype)
      section: Early nonmetastatic disease
    status: reported
    subtype: HR+/HER2-,HR+/HER2+
    topic: chemotherapy added to tamoxifen, recurrence-score-cohort
    year: 1997
  nsabp-b-27:
    acronym: NSABP B-27
    arms: Preoperative AC then surgery versus preoperative AC then docetaxel then surgery versus preoperative AC then surgery
      then docetaxel.
    chapters:
    - BC-810
    - BC-860
    digest:
      methods: 2,411 women with operable breast cancer were randomly assigned to preoperative doxorubicin and cyclophosphamide
        followed by surgery, to the same chemotherapy followed by docetaxel then surgery, or to the same chemotherapy followed
        by surgery then docetaxel. Tamoxifen was started concurrently with chemotherapy in all groups. Median time on study
        for the 2,404 patients with follow-up was 77.9 months.
      results: Adding docetaxel did not significantly change disease-free survival or overall survival, with trends toward
        better disease-free survival. Docetaxel reduced local recurrence as a first event (P=.0034). Preoperative but not
        postoperative docetaxel improved disease-free survival in patients with a clinical partial response after AC (hazard
        ratio 0.71, 95 percent CI 0.55 to 0.91, P=.007). Pathologic complete response, doubled by preoperative docetaxel,
        predicted overall survival (hazard ratio 0.33, P<.0001).
    endpoint: Disease-free survival and overall survival, with pathologic complete response.
    line: neoadjuvant
    modality: chemo
    n: 2411
    note: B-27 enrolled all-comers with operable breast cancer rather than a triple-negative population, although the source
      document files it under the early triple-negative overview.
    os: Overall survival did not differ significantly between the three arms, and the abstract reports no survival percentages.
    phase: 3
    population: Women with operable breast cancer, without restriction by hormone receptor status, all receiving concurrent
      tamoxifen.
    primary_ref: bear2006
    pubs:
    - kind: primary
      ref: bear2006
      role: primary
    result: Adding docetaxel to preoperative doxorubicin and cyclophosphamide did not significantly change disease-free survival
      or overall survival, although preoperative docetaxel doubled the pathologic complete response rate and reduced local
      recurrence as a first event (P=.0034).
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 61
      group: Early triple-negative disease (overview)
      section: Early nonmetastatic disease
    status: reported
    subtype: all
    topic: docetaxel added to preoperative AC
    year: 2006
  nsabp-b-28:
    acronym: NSABP B-28
    arms: Four cycles of doxorubicin and cyclophosphamide followed by four cycles of paclitaxel versus four cycles of doxorubicin
      and cyclophosphamide alone.
    chapters:
    - BC-490
    - BC-510
    - BC-850
    digest:
      methods: Between August 1995 and May 1998, 3,060 patients with resected operable breast cancer and positive axillary
        nodes were randomly assigned to four cycles of doxorubicin and cyclophosphamide (1,529) or the same followed by four
        cycles of paclitaxel (1,531). Patients aged 50 or older and younger patients with receptor-positive tumours also received
        five years of tamoxifen. Postlumpectomy radiotherapy was required. Median follow-up was 64.6 months.
      results: Paclitaxel reduced the hazard of a disease-free survival event by 17 percent (relative risk 0.83, 95 percent
        CI 0.72 to 0.95, P=.006). Five-year disease-free survival was 76 percent with paclitaxel versus 72 percent without.
        Five-year overall survival was 85 percent in both groups (relative risk 0.93, 95 percent CI 0.78 to 1.12, P=.46).
        No significant interaction with receptor status or tamoxifen use was seen. Toxicity was acceptable.
    endpoint: Disease-free survival and overall survival.
    line: adjuvant
    modality: chemo
    n: 3060
    os: Five-year overall survival was 85 percent in both groups (relative risk 0.93, 95 percent CI 0.78 to 1.12, P=.46),
      so the difference was not significant.
    phase: 3
    population: Patients with resected operable breast cancer and histologically positive axillary nodes.
    primary_ref: mamounas2005
    pubs:
    - kind: primary
      ref: mamounas2005
      role: primary
    result: Adding paclitaxel reduced the hazard of a disease-free survival event by 17 percent (relative risk 0.83, 95 percent
      CI 0.72 to 0.95, P=.006), with five-year disease-free survival of 76 percent versus 72 percent.
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 53
      group: Assay-validation cohorts / chemotherapy foundations (cross-subtype)
      section: Early nonmetastatic disease
    status: reported
    subtype: all
    topic: addition of paclitaxel after AC, adjuvant-backbone
    year: 2005
  nsabp-b-41:
    acronym: NSABP B-41
    arms: Weekly paclitaxel with lapatinib, or with trastuzumab plus lapatinib, versus weekly paclitaxel with trastuzumab,
      all after doxorubicin and cyclophosphamide.
    chapters:
    - BC-830
    - BC-840
    digest:
      methods: Open-label randomised phase 3 trial in women aged 18 or older with operable HER2-positive breast cancer and
        ECOG performance status 0 or 1. All received four cycles of doxorubicin 60 mg/m2 and cyclophosphamide 600 mg/m2, then
        four cycles of weekly paclitaxel 80 mg/m2 with weekly trastuzumab, daily lapatinib 1250 mg, or weekly trastuzumab
        plus daily lapatinib 750 mg until surgery. Randomisation was 1:1:1. All received trastuzumab after surgery to complete
        52 weeks.
      results: 529 women were enrolled and 519 had pathological response determined. Breast pathological complete response
        occurred in 93 of 177 patients on trastuzumab (52.5 percent), 91 of 171 on lapatinib (53.2 percent, p=0.9852) and
        106 of 171 on the combination (62.0 percent, p=0.095). Grade 3 diarrhoea affected 2, 20 and 27 percent of the three
        groups (p<0.0001). Symptomatic congestive heart failure occurred in 4, 4 and under 1 percent.
    endpoint: Pathological complete response in the breast.
    line: neoadjuvant
    modality: chemo,her2
    n: 529
    os: Overall survival was not reported in this publication, which addressed pathological complete response at surgery.
    phase: 3
    population: Women aged 18 or older with operable HER2-positive breast cancer and ECOG performance status 0 or 1.
    primary_ref: robidoux2013
    pubs:
    - kind: primary
      ref: robidoux2013
      role: primary
    result: Breast pathological complete response was 53.2 percent with lapatinib and 62.0 percent with trastuzumab plus lapatinib,
      versus 52.5 percent with trastuzumab (P=0.9852 and P=0.095).
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 59
      group: Foundational trastuzumab / dual blockade
      section: Early nonmetastatic disease
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: chemotherapy with trastuzumab, lapatinib, or both, backbone-addition
    year: 2013
  nsabp-b06:
    acronym: NSABP B-06
    chapters:
    - BC-410
    cited_by:
    - BC-410
    claim: 20-year mortality equivalent; ipsilateral recurrence 14.3% with radiation vs 39.2% without
    digest:
      methods: A randomised trial begun in 1976. A total of 1851 women with invasive breast cancer, for whom follow-up data
        were available and nodal status was known, underwent randomly assigned treatment consisting of total mastectomy, lumpectomy
        alone, or lumpectomy plus breast irradiation. Outcomes were estimated by Kaplan-Meier and cumulative-incidence methods.
        Follow-up extended to 20 years.
      results: The cumulative incidence of recurrent tumour in the ipsilateral breast was 14.3% after lumpectomy plus irradiation
        against 39.2% after lumpectomy alone, P<0.001. Disease-free survival, distant-disease-free survival and overall survival
        did not differ significantly among the three groups. The hazard ratio for death was 1.05 (95% CI 0.90-1.23, P=0.51)
        for lumpectomy alone versus mastectomy and 0.97 (0.83-1.14, P=0.74) for lumpectomy plus irradiation versus mastectomy.
    line: adjuvant
    modality: surgery,radiation
    phase: 3
    primary_ref: fisher2002b06
    pubs:
    - kind: primary
      ref: fisher2002b06
      role: primary
    setting: early
    status: reported
    subtype: all
    topic: lumpectomy with or without irradiation versus total mastectomy
  nsabp-b31-n9831:
    acronym: NSABP B-31/N9831
    arms: doxorubicin and cyclophosphamide followed by paclitaxel with trastuzumab vs the same chemotherapy without trastuzumab
    chapters:
    - BC-820
    - BC-840
    cited_by:
    - BC-820
    digest:
      methods: Planned joint analysis of two adjuvant trials. In all, 4046 patients with HER2-positive operable breast cancer
        were enrolled to receive doxorubicin and cyclophosphamide followed by paclitaxel with or without trastuzumab. The
        required number of events for the definitive overall survival analysis, 710 events, was reached in September 2012.
        Updated analyses of overall disease-free survival and related subgroups were also performed.
      results: Median time on study was 8.4 years. Adding trastuzumab gave a 37% relative improvement in overall survival,
        hazard ratio 0.63 (95% CI 0.54-0.73), P<0.001, and raised the 10-year overall survival rate from 75.2% to 84%. Disease-free
        survival improved by 40%, hazard ratio 0.60 (95% CI 0.53-0.68), P<0.001, with the 10-year disease-free survival rate
        rising from 62.2% to 73.7%. All patient subgroups benefited.
    endpoint: disease-free survival
    line: adjuvant
    modality: her2,chemo
    n: 4046
    os: HR 0.63 (0.54-0.73), with 10-year overall survival 84.0% against 75.2%
    phase: 3
    population: HER2+ operable breast cancer, largely node-positive, enrolled to two trials analysed jointly
    primary_ref: perez2014
    pubs:
    - kind: primary
      ref: romond2005
      role: report
    - kind: survival
      ref: perez2014
      role: os joint
    - kind: subgroup
      ref: perez2011
      role: n9831 sequential vs concurrent
    - kind: primary
      ref: chumsri2019
      role: primary
    result: disease-free survival HR 0.60 (0.53-0.68), with 10-year rates of 73.7% against 62.2%, at a median 8.4 years on
      study
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 58
      group: Adjuvant trastuzumab
      section: Early nonmetastatic disease
    - ch: 60
      group: Early triple-positive (HR+/HER2+) disease
      section: Early nonmetastatic disease
    status: reported
    subtype: HER2+,HR+/HER2+
    topic: pivotal adjuvant trastuzumab added to anthracycline and taxane chemotherapy, the regimen that fixed the one-year
      duration
    year: 2014
  nsabp-b32:
    acronym: NSABP B-32
    chapters:
    - BC-410
    cited_by:
    - BC-410
    claim: 8-year OS 91.8% vs 90.3%, HR 1.20 (0.96-1.50)
    digest:
      methods: Randomised controlled phase 3 trial at 80 centres in Canada and the USA between May 1999 and February 2004.
        Women with invasive breast cancer were randomly assigned 1:1 to sentinel lymph node resection plus axillary dissection
        (group 1) or to sentinel node resection alone with axillary dissection only if the sentinel nodes were positive (group
        2). Sentinel node resection used blue dye and radioactive tracer. The primary endpoint was overall survival.
      results: 5611 women were randomly assigned and 3989 had pathologically negative sentinel nodes. Among 3986 such patients
        with follow-up, 309 deaths occurred, 140 of 1975 in group 1 and 169 of 2011 in group 2, hazard ratio 1.20 (95% CI
        0.96-1.50, p=0.12). Eight-year overall survival was 91.8% in group 1 and 90.3% in group 2. The disease-free survival
        hazard ratio was 1.05 (0.90-1.22, p=0.54), with 8-year estimates 82.4% and 81.5%.
    line: adjuvant
    modality: surgery
    nct: NCT00003830
    phase: 3
    primary_ref: krag2010
    pubs:
    - kind: primary
      ref: krag2010
      role: primary
    setting: early
    status: reported
    subtype: all
    topic: sentinel node resection versus axillary dissection in clinically node-negative disease
  nsabp-b39:
    acronym: NSABP B-39/RTOG 0413
    chapters:
    - BC-420
    cited_by:
    - BC-420
    claim: 10-year ipsilateral recurrence 4.6% vs 3.9%, HR 1.22; equivalence not met
    digest:
      methods: Randomised phase 3 equivalence trial at 154 clinical centres in the USA, Canada, Ireland and Israel. Adult
        women with stage 0, I or II breast cancer up to 3 cm and lumpectomy with negative margins were assigned 1:1 to whole-breast
        irradiation, 50 Gy in 25 fractions over 5 weeks, or to accelerated partial breast irradiation, 34 Gy brachytherapy
        or 38.5 Gy external beam in 10 fractions. The primary outcome was ipsilateral breast tumour recurrence as a first
        recurrence.
      results: Between March 2005 and April 2013, 4216 women were enrolled, 2109 to whole-breast irradiation and 2107 to partial
        breast irradiation. At a median follow-up of 10.2 years, ipsilateral breast tumour recurrence occurred in 90 of 2089
        partial irradiation patients (4%) and 71 of 2036 whole-breast patients (3%), hazard ratio 1.22 (90% CI 0.94-1.58).
        The 10-year cumulative incidence was 4.6% against 3.9%. Deaths from recurring breast cancer were 49 of 2093 and 44
        of 2039.
    line: adjuvant
    modality: radiation
    nct: NCT00103181
    phase: 3
    primary_ref: vicini2019
    pubs:
    - kind: primary
      ref: vicini2019
      role: primary
    setting: early
    status: reported
    subtype: all
    topic: accelerated partial breast irradiation versus whole-breast irradiation
  nsabp-b42:
    acronym: NSABP B-42
    arms: letrozole for 5 further years vs placebo
    chapters:
    - BC-790
    cited_by:
    - BC-790
    claim: did not meet its prespecified significance threshold for disease-free survival
    digest:
      methods: Randomised, double-blind, placebo-controlled phase 3 trial at 158 centres in the USA, Canada and Ireland. Postmenopausal
        women with stage I-IIIA hormone receptor-positive breast cancer who were disease free after about 5 years of an aromatase
        inhibitor, or tamoxifen followed by an aromatase inhibitor, were assigned 1:1 to 5 years of letrozole 2.5 mg daily
        or placebo. Randomisation was stratified by nodal status, previous tamoxifen use and lowest bone mineral density T
        score. The primary endpoint was disease-free survival.
      results: Between September 2006 and January 2010, 3966 patients were assigned to letrozole (n=1983) or placebo (n=1983),
        with follow-up data for 3903 and a median follow-up of 6.9 years. Letrozole did not significantly improve disease-free
        survival, with 292 events against 339 on placebo, hazard ratio 0.85 (95% CI 0.73-0.999), p=0.048. Seven-year disease-free
        survival was 84.7% with letrozole and 81.3% with placebo. The 10-year update reported a disease-free survival hazard
        ratio of 0.85 (0.74-0.96), P=.01.
    endpoint: disease-free survival
    line: adjuvant
    modality: endocrine
    n: 3966
    nct: NCT00382070
    os: not reported in the primary analysis
    phase: 3
    population: postmenopausal stage I-IIIA hormone receptor-positive disease, disease-free after about 5 years of aromatase
      inhibitor-based therapy
    primary_ref: mamounas2019
    pubs:
    - kind: primary
      ref: mamounas2019
      role: primary
    - kind: follow-up
