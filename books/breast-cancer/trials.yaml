  train-3:
    acronym: TRAIN-3
    arms: Single arm of paclitaxel, trastuzumab, carboplatin and pertuzumab with surgery once MRI showed a complete radiological
      response.
    chapters:
    - BC-830
    - BC-840
    digest:
      methods: Single-arm phase 2 study across 43 hospitals in the Netherlands. Patients received paclitaxel, trastuzumab,
        carboplatin and pertuzumab for up to nine cycles and were referred for surgery once MRI showed a complete radiological
        response. Patients with a pathological complete response completed one year of trastuzumab and pertuzumab. Patients
        with residual invasive disease completed nine cycles then received 14 cycles of trastuzumab emtansine. The primary
        endpoint was three-year event-free survival.
      results: 235 patients with hormone receptor-negative and 232 with hormone receptor-positive tumours were enrolled. Median
        follow-up was 40.1 months. Three-year event-free survival was 92.2% and 92.0% respectively, with 40 events in 467
        patients. By cycles given, event-free survival was 96.1% and 98.6% after one to three cycles, 89.2% and 94.2% after
        four to six, and 90.6% and 85.4% after seven to nine. Grade 3-4 neutropenia affected 40%.
    endpoint: Three-year event-free survival, analysed separately in hormone receptor-negative and hormone receptor-positive
      patients.
    line: neoadjuvant
    modality: her2,chemo,adc
    n: 467
    nct: NCT03820063
    note: This is a single-arm study, so the event-free survival figures carry no randomised comparison against standard-duration
      chemotherapy.
    os: not yet reported
    phase: 2
    population: Patients aged 18 years or older with stage II to III HER2-positive breast cancer and WHO performance status
      0 or 1.
    primary_ref: louis2026
    pubs:
    - kind: primary
      ref: louis2026
      role: primary
    result: Three-year event-free survival was 92.2% in hormone receptor-negative patients and 92.0% in hormone receptor-positive
      patients, with no comparator arm.
