    arms: Anastrozole plus fulvestrant versus anastrozole alone with crossover to fulvestrant at progression strongly encouraged.
    chapters:
    - BC-870
    digest:
      methods: Phase 3 randomised trial. Postmenopausal women with previously untreated hormone receptor positive metastatic
        breast cancer were assigned 1:1 to anastrozole 1 mg daily, with crossover to fulvestrant at progression strongly encouraged,
        or to anastrozole plus fulvestrant. Fulvestrant was given intramuscularly at 500 mg on day 1 and 250 mg on days 14
        and 28 and monthly thereafter. Randomisation was stratified by prior adjuvant tamoxifen. The primary endpoint was
        progression-free survival, with overall survival prespecified as secondary.
      results: Median progression-free survival was 15.0 months with the combination and 13.5 months with anastrozole alone,
        hazard ratio 0.80, 95 percent CI 0.68 to 0.94, p=0.007. Median overall survival was 47.7 versus 41.3 months, hazard
        ratio 0.81, p=0.05, despite 41 percent crossover. In the final analysis of 694 patients, median overall survival was
        49.8 versus 42.0 months, hazard ratio 0.82. Grade 3 to 5 toxicity rates were similar.
