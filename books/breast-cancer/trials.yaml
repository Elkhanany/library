        and a protocol modification required P of .025 or less for the two remaining comparisons. At a median follow-up of
        4.5 years and 555 disease-free survival events, the combination gave a hazard ratio of 0.84 (97.5% CI 0.70 to 1.02,
        P=.048) and the sequence 0.96 (0.80 to 1.15, P=.61). Lapatinib caused more diarrhoea, rash and hepatic toxicity.
