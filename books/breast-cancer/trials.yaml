  train2:
    acronym: TRAIN-2
    arms: paclitaxel and carboplatin with dual HER2 blockade, with or without three preceding cycles of fluorouracil, epirubicin
      and cyclophosphamide
    chapters:
    - BC-500
    - BC-820
    - BC-830
    - BC-840
    cited_by:
    - BC-500
    - BC-830
    claim: 3-year EFS 93.6% without anthracycline vs 92.7% with
    digest:
      methods: Secondary analysis of an open-label, randomised phase 3 trial at 37 hospitals in the Netherlands. 438 patients
        with stage II and III ERBB2-positive breast cancer were randomised 1:1, stratified by age, tumour stage, nodal stage
        and oestrogen receptor status, to three cycles of fluorouracil, epirubicin and cyclophosphamide then six cycles of
        paclitaxel and carboplatin, or to nine cycles of paclitaxel and carboplatin. Both groups received trastuzumab and
        pertuzumab every three weeks. Outcomes were 3-year event-free survival and overall survival.
      results: Median follow-up was 48.8 months (interquartile range 44.1 to 55.2). There were 23 event-free survival events
        (10.5%) in the anthracycline group and 21 (9.6%) in the non-anthracycline group (hazard ratio 0.90, 95% CI 0.50 to
        1.63). Three-year event-free survival was 92.7% with anthracyclines and 93.6% without. Three-year overall survival
        was 97.7% and 98.2%. A left ventricular ejection fraction decline of 10% or more to below 50% occurred in 7.7% versus
        3.2% (P=.04).
    endpoint: pathological complete response, with 3-year event-free survival on follow-up
    line: neoadjuvant
