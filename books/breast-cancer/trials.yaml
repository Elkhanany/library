  lccc1025:
    acronym: LCCC 1025
    arms: Single arm of everolimus with trastuzumab and vinorelbine, with no control arm.
    chapters:
    - BC-930
    claim: intracranial response rate 4%, a single partial response, despite a pathway rationale
    digest:
      methods: Phase II study in patients with progressive HER2-positive breast cancer brain metastases, opened on the rationale
        that two-thirds of such metastases show activation of the PI3K/mTOR pathway driving resistance to anti-HER2 therapy.
        Patients received everolimus, a brain-permeable mTOR inhibitor, with trastuzumab and vinorelbine. The primary endpoint
        was intracranial response rate. Secondary objectives were CNS clinical benefit rate, extracranial response rate, time
        to progression, overall survival, and targeted sequencing of tumours from enrolled patients. A two-stage design was
        used to distinguish an intracranial response rate of 5% from one of 20%.
      results: 32 patients were evaluable for toxicity and 26 for efficacy. The intracranial response rate was 4%, a single
        partial response. CNS clinical benefit rate was 27% at 6 months and 65% at 3 months, median intracranial time to progression
        was 3.9 months (95% CI 2.2 to 5) and overall survival was 12.2 months (95% CI 0.6 to 20.2). Grade 3 to 4 toxicities
        included neutropenia in 41%, anemia in 16% and stomatitis in 16%. Mutations in TP53 and PIK3CA were common in the
        brain metastases, but mutations in the PI3K/mTOR pathway were not associated with response; ERBB2 amplification was
        higher in brain metastases than in the primary tumour, and ERBB2 amplification in the primary trended toward worse
        overall survival.
    endpoint: Intracranial response rate, with a two-stage design built to distinguish an intracranial response rate of 5%
      from one of 20%.
    line: 3L+
    modality: pi3k-akt,her2,chemo
    n: 32
    nct: NCT01305941
    note: The primary endpoint was negative. The single-arm design has no comparator, and the authors read the time to progression
      and overall survival as similar to historical control. The enrolled count of 32 is the number evaluable for toxicity;
      only 26 were evaluable for efficacy, so the response figures rest on the smaller group. The correlative finding that
      PI3K/mTOR pathway mutations were not associated with response is the point of the record, in that a pathway and brain-penetration
      rationale did not deliver intracranial activity. The published confidence interval for overall survival, 0.6 to 20.2
      months, is reproduced as printed. The abstract does not separate hormone receptor positive from hormone receptor negative
      HER2-positive disease, so the subtype axis stays HER2+, and the treatment line axis rests on entry requiring progressive
      brain metastases rather than on a stated count of prior lines.
    os: Overall survival was 12.2 months (95% CI 0.6 to 20.2), which the authors describe as similar to historical control.
    phase: '2'
    population: Patients with progressive HER2-positive breast cancer brain metastases.
    primary_ref: vanswearingen2018
    pubs:
    - kind: primary
