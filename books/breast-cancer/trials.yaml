  e5194:
    acronym: ECOG E5194
    chapters:
    - BC-480
    cited_by:
    - BC-480
    digest:
      methods: The Oncotype DX DCIS Score was measured in patients with ductal carcinoma in situ treated with surgical excision
        without radiation in the ECOG E5194 study. The score was calculated from seven cancer-related genes and five reference
        genes. Its association with the risk of an ipsilateral breast event, defined as local recurrence of ductal carcinoma
        in situ or invasive carcinoma, was analyzed by Cox regression. The prespecified primary analysis adjusted for tamoxifen
        use.
      results: 327 patients had adequate tissue for analysis. The continuous DCIS Score was significantly associated with
        the risk of an ipsilateral breast event, hazard ratio 2.31 (95% CI 1.15 to 4.49, P=.02), and with invasive ipsilateral
        breast event, unadjusted hazard ratio 3.68 (95% CI 1.34 to 9.62, P=.01). For the low, intermediate, and high risk
        groups, 10-year risks of an ipsilateral breast event were 10.6%, 26.7%, and 25.9%, and of an invasive event 3.7%,
        12.3%, and 19.2%.
    line: adjuvant
    modality: surgery
    phase: 2
    primary_ref: solin2013
    pubs:
    - kind: primary
      ref: solin2013
      role: primary
    setting: dcis
    status: reported
    subtype: all
    topic: excision without radiation in selected DCIS, the cohort in which the DCIS Score was validated
  ea1131:
    acronym: EA1131
    arms: four cycles of carboplatin or cisplatin vs six cycles of capecitabine
    chapters:
    - BC-850
    cited_by:
    - BC-850
    digest:
      methods: Patients with clinical stage II or III triple-negative breast cancer and at least 1 cm of residual invasive
        disease after neoadjuvant chemotherapy were randomly assigned to platinum, carboplatin or cisplatin, once every 3
        weeks for four cycles, or capecitabine on 14 of every 21 days for six cycles. Triple-negative subtype, basal or nonbasal,
        was assigned by PAM50 on the residual disease. The design tested noninferiority with a superiority alternative, assuming
        4-year invasive disease-free survival of 67% with capecitabine.
      results: 410 of a planned 775 participants were randomly assigned between 2015 and 2021. After median follow-up of 20
        months and 120 invasive disease-free survival events, representing 61% of full information, in the 308 patients (78%)
        with basal subtype disease, 3-year invasive disease-free survival was 42% (95% CI 30 to 53) with platinum and 49%
        (95% CI 39 to 59) with capecitabine. Grade 3 and 4 toxicities were more common with platinum.
    endpoint: invasive disease-free survival, non-inferiority design
    line: post-neoadjuvant
    modality: chemo
    n: 410
    note: The trial closed early at 410 of 775 planned participants on the recommendation of the data and safety monitoring
      committee.
    os: not yet reported
    phase: 3
    population: clinical stage II-III TNBC with residual disease of 1 cm or more after neoadjuvant chemotherapy; 308 of 410
      basal subtype by PAM50
    primary_ref: mayer2021ea1131
    pubs:
    - kind: primary
      ref: mayer2021ea1131
      role: primary
    result: 3-year iDFS 42% with platinum vs 49% with capecitabine in basal subtype. Stopped early, non-inferiority not shown
    reviewed: '2026-09-14'
