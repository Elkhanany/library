      role: primary
    - kind: update
      ref: piccart2021mindact
      role: updated
    result: 5-year distant metastasis-free survival without chemotherapy in the primary test population of 644 patients was
      95.1% (93.1-96.6), above the 92% boundary. In the randomised intention-to-treat comparison, 8-year distant metastasis-free
