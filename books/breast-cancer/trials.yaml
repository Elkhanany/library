  cbcsg006:
    acronym: CBCSG006
    arms: Cisplatin plus gemcitabine versus paclitaxel plus gemcitabine.
    chapters:
    - BC-920
    digest:
      methods: Open-label, randomised, phase 3 trial at 12 Chinese centres. Patients aged 18 to 70 years with previously untreated
        metastatic triple-negative breast cancer and ECOG 0 or 1 were assigned 1:1 to cisplatin 75 mg/m2 on day 1 with gemcitabine
        1250 mg/m2 on days 1 and 8, or paclitaxel 175 mg/m2 on day 1 with the same gemcitabine, every 3 weeks for up to eight
        cycles. The primary endpoint was progression-free survival, with a non-inferiority margin of 1.2.
      results: 236 of 240 randomised patients received at least one dose and were analysed, 118 per group. After median follow-up
        of about 16 months the hazard ratio for progression-free survival was 0.692 (95% CI 0.523 to 0.915), non-inferiority
        p<0.0001 and superiority p=0.009. Median progression-free survival was 7.73 months with cisplatin and gemcitabine
        versus 6.47 months with paclitaxel and gemcitabine. Grade 3 or 4 anaemia (33% versus 5%) and thrombocytopenia (32%
        versus 3%) were more common with cisplatin.
    endpoint: Progression-free survival, tested first for non-inferiority against a margin of 1.2 and then for superiority.
    line: 1L
