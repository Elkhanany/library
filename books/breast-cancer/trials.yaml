  persephone:
    acronym: PERSEPHONE
    arms: six months vs twelve months of adjuvant trastuzumab
    chapters:
    - BC-820
    - BC-840
    cited_by:
    - BC-820
    digest:
      methods: Open-label randomised phase 3 non-inferiority trial at 152 UK centres. Patients aged 18 years or older with
        HER2-positive early breast cancer and a clear indication for chemotherapy were assigned 1:1 to 6 or 12 months of trastuzumab
        every 3 weeks, intravenously at an 8 mg/kg loading dose then 6 mg/kg or subcutaneously at 600 mg, combined with chemotherapy.
        The primary endpoint was disease-free survival by intention to treat, with a 3% non-inferiority margin at 4 years.
      results: 2045 patients were assigned to 12 months and 2044 to 6 months. Median follow-up was 5.4 years. A disease-free
        survival event occurred in 265 of 2043 patients (13%) in the 6-month group and 247 of 2045 (12%) in the 12-month group.
        4-year disease-free survival was 89.4% versus 89.8% (hazard ratio 1.07, 90% CI 0.93 to 1.24, non-inferiority p=0.011).
        Severe adverse events were reported by 373 of 1939 (19%) versus 459 of 1894 (24%), p=0.0002.
    endpoint: disease-free survival, non-inferiority margin 3 percentage points of 4-year disease-free survival
    line: adjuvant
    modality: her2
