  intrathecal-trastuzumab-oberkampf-phase-:
    acronym: Intrathecal trastuzumab, Oberkampf phase II
    arms: Single arm of intrathecal trastuzumab 150 mg weekly.
    chapters:
    - BC-930
    digest:
      methods: This phase II study gave weekly intrathecal trastuzumab 150 mg, the recommended dose from a preceding phase
        I dose-escalation study, to patients with HER2-positive breast cancer and leptomeningeal metastasis. The primary endpoint
        was clinical neurologic progression-free survival related to leptomeningeal disease after 8 weeks. Overall survival,
        toxicity and quality of life were secondary endpoints. Nineteen patients were enrolled.
      results: Of the 19 patients enrolled, 16 (84%) had concomitant brain metastases and 15 of these had received prior brain
        radiotherapy. All had received at least one line of systemic anti-HER2 therapy. At 8 weeks, 14 patients (74%) were
        free of neurological progression. Median leptomeningeal-related progression-free survival was 5.9 months and median
        overall survival was 7.9 months. Global health-related quality of life on the QLQ-C30 and BN20 scales appeared preserved,
        and no toxicity above grade 3 was observed.
    endpoint: Clinical neurologic progression-free survival related to leptomeningeal disease at 8 weeks.
    modality: her2
    n: 19
    note: Patients had at least one prior line of systemic anti-HER2 therapy, but the abstract does not give the line distribution,
      so no treatment line is assigned to this compartment-directed therapy.
    os: Median overall survival was 7.9 months.
    phase: 2
    population: Patients with leptomeningeal metastasis from HER2-positive breast cancer, all of whom had received at least
      one line of systemic anti-HER2 therapy.
    primary_ref: oberkampf2023
    pubs:
    - kind: primary
      ref: oberkampf2023
      role: primary
    result: At 8 weeks, 14 of 19 patients (74%) were free of neurological progression, and median leptomeningeal-related progression-free
