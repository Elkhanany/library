    arms: palbociclib rechallenge plus second-line endocrine therapy vs endocrine therapy alone
    chapters:
    - BC-880
    cited_by:
    - BC-880
    digest:
      methods: International, randomized, open-label, phase II study in 198 patients with hormone receptor-positive, HER2-negative
        advanced breast cancer that progressed after first-line palbociclib plus endocrine therapy. Patients needed clinical
        benefit on the previous regimen, meaning response or stable disease for at least 24 weeks, or progression on adjuvant
        palbociclib. Randomisation was 2:1 to palbociclib rechallenge plus second-line endocrine therapy with fulvestrant
        or letrozole, or to second-line endocrine therapy alone. The primary end point was investigator-assessed progression-free
        survival.
      results: Between April 2019 and October 2022, 136 patients were assigned to palbociclib plus endocrine therapy and 62
        to endocrine therapy alone. Median investigator-assessed progression-free survival was 4.9 months (95% CI, 3.6 to
        6.1) with palbociclib plus endocrine therapy versus 3.6 months (95% CI, 2.5 to 4.2) with endocrine therapy alone (hazard
        ratio 0.84, 95% CI 0.66 to 1.07, P = .149). Grade 3 or higher treatment-emergent adverse events were 47.4% versus
        10.0%.
    endpoint: investigator-assessed progression-free survival
    line: 2L
    modality: cdk4-6
    n: 198
    os: not yet reported
    phase: 2
    population: progression after first-line palbociclib with endocrine therapy, with prior clinical benefit
    primary_ref: llombartcussac2025
    pubs:
    - kind: primary
      ref: llombartcussac2025
      role: primary
    result: median PFS 4.9 vs 3.6 months, HR 0.84, not significant
    reviewed: '2026-09-14'
    setting: metastatic
    source:
    - ch: 69
      group: Post-CDK4/6i (continuation / switch)
      section: Metastatic disease
    status: reported
    subtype: HR+/HER2-
    topic: palbociclib rechallenge after progression on palbociclib
    year: 2025
  paloma-1-trio-18:
    acronym: PALOMA-1 / TRIO-18
    arms: Palbociclib plus letrozole versus letrozole alone.
    chapters:
    - BC-870
    - BC-880
    digest:
      methods: Open-label randomised phase 2 trial. Postmenopausal women with advanced oestrogen receptor-positive, HER2-negative
        breast cancer and no prior systemic therapy for advanced disease entered two sequential cohorts. Cohort 1 required
        biomarker status alone. Cohort 2 also required CCND1 amplification, p16 loss, or both. Patients were randomised 1:1,
        stratified by disease site and disease-free interval, to letrozole 2.5 mg daily or letrozole plus palbociclib 125
        mg daily for three weeks on and one week off in 28-day cycles.
      results: 165 patients were randomised, 84 to palbociclib plus letrozole and 81 to letrozole. Median progression-free
        survival was 20.2 versus 10.2 months (hazard ratio 0.488, 95% CI 0.319-0.748, one-sided p=0.0004). The hazard ratio
        was 0.299 in cohort 1 and 0.508 in cohort 2. Grade 3-4 neutropenia occurred in 54% versus 1% and leucopenia in 19%
        versus none. 13% versus 2% discontinued for adverse events.
    endpoint: Investigator-assessed progression-free survival in the intention-to-treat population.
    line: 1L
    modality: endocrine,cdk4-6
    n: 165
    nct: NCT00721409
    os: Final analysis, a secondary endpoint, gave median overall survival 37.5 months with palbociclib plus letrozole versus
      34.5 months with letrozole alone, hazard ratio 0.897 (95% CI 0.623 to 1.294), P=0.281. Not significantly improved.
    phase: 2
    population: Postmenopausal women with advanced oestrogen receptor-positive, HER2-negative breast cancer who had received
      no systemic treatment for advanced disease.
    primary_ref: finn2014
    pubs:
    - kind: primary
      ref: finn2014
      role: primary
    - added: '2026-09-24'
      kind: survival
      ref: finn2020
      role: final os
    result: Median progression-free survival was 20.2 months with palbociclib plus letrozole versus 10.2 months with letrozole
      alone. The hazard ratio was 0.488 (95% CI 0.319-0.748, one-sided p=0.0004).
    reviewed: '2026-09-24'
    setting: metastatic
    source:
    - ch: 69
      group: First line
      section: Metastatic disease
    status: reported
    subtype: HR+/HER2-
    topic: palbociclib plus letrozole, phase II
    year: 2014
  paloma2:
    acronym: PALOMA-2
    arms: palbociclib plus letrozole vs placebo plus letrozole
    chapters:
    - BC-880
    cited_by:
    - BC-880
    digest:
      methods: Double-blind phase 3 study. 666 postmenopausal women with ER-positive, HER2-negative advanced breast cancer
        who had no prior treatment for advanced disease were randomly assigned 2:1 to palbociclib plus letrozole or placebo
        plus letrozole. The primary end point was investigator-assessed progression-free survival. Secondary end points were
        overall survival, objective response, clinical benefit response, patient-reported outcomes, pharmacokinetic effects
        and safety.
      results: Median progression-free survival was 24.8 months (95% CI, 22.1 to not estimable) with palbociclib plus letrozole
        versus 14.5 months (95% CI, 12.9 to 17.1) with placebo plus letrozole (hazard ratio 0.58, 95% CI 0.46 to 0.72, P<0.001).
        Grade 3 or 4 neutropenia occurred in 66.4% versus 1.4%. Permanent discontinuation for adverse events occurred in 43
        patients (9.7%) versus 13 (5.9%). The 2024 overall survival report gave median overall survival 53.9 versus 51.2 months
        (hazard ratio 0.96).
    endpoint: investigator-assessed progression-free survival
    line: 1L
