  destiny-breast02:
    acronym: DESTINY-Breast02
    arms: Trastuzumab deruxtecan versus physician's choice of capecitabine plus trastuzumab or capecitabine plus lapatinib.
    chapters:
    - BC-900
    digest:
      methods: Randomised, open-label, multicentre phase 3 trial at 227 sites. Eligible patients had unresectable or metastatic
        HER2-positive breast cancer that had progressed after trastuzumab emtansine, with ECOG performance status 0 or 1.
        Patients were randomly assigned 2 to 1 to trastuzumab deruxtecan 5.4 mg/kg every 3 weeks or treatment of physician's
        choice, either capecitabine plus trastuzumab or capecitabine plus lapatinib. The primary endpoint was progression-free
        survival by blinded independent central review.
      results: 608 patients were randomised, 406 to trastuzumab deruxtecan and 202 to physician's choice. Median progression-free
        survival was 17.8 months (95% CI 14.3 to 20.8) versus 6.9 months (95% CI 5.5 to 8.4), hazard ratio 0.36 (95% CI 0.28
        to 0.45), p less than 0.0001. Grade 3 or higher treatment-emergent adverse events occurred in 53 percent versus 44
        percent. Drug-related interstitial lung disease occurred in 10 percent versus less than 1 percent.
    endpoint: Progression-free survival by blinded independent central review.
