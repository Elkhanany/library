  mediola:
    acronym: MEDIOLA breast cohort
    arms: Single arm of olaparib 300 mg orally twice daily for four weeks, then olaparib 300 mg twice daily with durvalumab
      1.5 g intravenously every four weeks until disease progression.
    chapters:
    - BC-890
    - BC-920
    claim: 12-week disease control 80%, 24 of 30, with olaparib plus durvalumab
    digest:
      methods: MEDIOLA is a multicentre, open-label, phase 1/2 basket trial of durvalumab and olaparib in solid tumours, with
        four initial cohorts, namely germline BRCA-mutated metastatic breast cancer, germline BRCA-mutated metastatic ovarian
        cancer, metastatic gastric cancer and relapsed small-cell lung cancer. This report covers the breast cancer cohort.
        Eligible patients were aged 18 years or older, 19 or older in South Korea, with germline BRCA1 or BRCA2 mutations
        and histologically confirmed progressive HER2-negative metastatic breast cancer and no more than two previous lines
        of chemotherapy for metastatic disease, enrolled from 14 health centres in six countries. Patients received olaparib
        300 mg orally twice daily for four weeks and thereafter olaparib 300 mg twice daily with durvalumab 1.5 g intravenously
        every four weeks until disease progression. The primary endpoints were safety and tolerability and the 12-week disease
        control rate; safety was analysed in patients who received at least one dose of study treatment and activity in the
        full-analysis set.
      results: Between June 14, 2016 and May 2, 2017, 34 patients were enrolled, received both study drugs and were included
        in the safety analysis. 11 patients (32%) experienced grade 3 or worse adverse events, most commonly anaemia in four
        (12%), neutropenia in three (9%) and pancreatitis in two (6%). Three patients (9%) discontinued because of adverse
        events and four (12%) experienced a total of six serious adverse events, and there were no treatment-related deaths.
        24 of 30 patients eligible for the activity analysis had disease control at 12 weeks, 80% (90% CI 64.3 to 90.9). The
        authors conclude that the combination showed promising antitumour activity with safety similar to that seen with either
        drug alone, and that randomised research is needed to determine whether adding durvalumab improves long-term outcomes
        over olaparib monotherapy.
    endpoint: Safety and tolerability, and disease control rate at 12 weeks.
    line: any
    modality: parp,immunotherapy
    n: 34
    nct: NCT02734004
    note: This record covers the germline BRCA-mutated breast cancer cohort of a phase 1/2 basket trial; the ovarian, gastric
      and small-cell lung cohorts are separate and are not part of this entry. Entry required HER2-negative disease rather
      than triple-negative disease, so the cohort includes HR-positive breast cancer and the BRCA subtype tag is broader than
      a triple-negative reader might assume. The study is single-arm, so added value over olaparib alone cannot be established,
      as the authors themselves state. Disease control was assessed in the 30 patients eligible for the activity analysis
      while safety covers all 34 treated. Patients could have received up to two previous lines of chemotherapy for metastatic
      disease but none was required, so line is recorded as any. Recruitment was complete and the basket study was still ongoing
      at the time of this report.
    os: not reported; the primary endpoints were safety and tolerability and the disease control rate at 12 weeks
    phase: 1/2
    population: Patients aged 18 years or older, or 19 years or older in South Korea, with a germline BRCA1 or BRCA2 mutation
      and histologically confirmed progressive HER2-negative metastatic breast cancer and no more than two previous lines
      of chemotherapy for metastatic disease, enrolled at 14 centres in the UK, the USA, Israel, France, Switzerland and South
      Korea.
