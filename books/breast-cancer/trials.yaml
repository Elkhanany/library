    claim: non-inferior, not superior. Recurrence HR 0.89 (0.64-1.23)
    digest:
      methods: Double-blind, multicentre, randomised placebo-controlled trial. Postmenopausal women with locally excised,
        hormone-receptor-positive DCIS were randomly assigned 1:1 by central computer allocation to 1 mg oral anastrozole
        or 20 mg oral tamoxifen daily for 5 years. Randomisation was stratified by major centre or hub and done in blocks.
        Trial personnel, participants and clinicians were masked. The primary endpoint was all recurrence, including recurrent
        DCIS and new contralateral tumours. Analysis was modified intention to treat.
      results: Between March 2003 and February 2012, 2980 postmenopausal women from 236 centres in 14 countries were enrolled,
        with 1449 analysed on anastrozole and 1489 on tamoxifen. Median follow-up was 7.2 years and 144 breast cancer recurrences
        were recorded. Overall recurrence was 67 with anastrozole versus 77 with tamoxifen, HR 0.89 (95% CI 0.64-1.23). Deaths
        numbered 33 versus 36, HR 0.93 (0.58-1.50), p=0.78. Any adverse event was reported by 1323 women (91%) versus 1379
        (93%).
