  sgntuc-019:
    acronym: SGNTUC-019
    arms: Single arm of tucatinib plus trastuzumab, with fulvestrant added for hormone receptor-positive disease.
    chapters:
    - BC-580
    - BC-590
    - BC-870
    - BC-900
    - BC-920
    claim: overall response 41.9% with tucatinib and trastuzumab in HER2-mutated MBC
    digest:
      methods: SGNTUC-019 is an open-label phase 2 basket study of tucatinib, a HER2-targeted tyrosine kinase inhibitor, in
        combination with trastuzumab in patients with HER2-altered solid tumours. This record covers its breast cohort, 31
        heavily pretreated female patients with HER2-mutated metastatic breast cancer who were also HER2-negative by local
        testing. Patients with hormone receptor-positive disease also received fulvestrant. The primary endpoint was overall
        response rate, with duration of response and progression-free survival as secondary endpoints. The regimen is chemotherapy-free.
      results: The overall response rate, the primary endpoint, was 41.9% (90% CI 26.9 to 58.2). The secondary endpoints of
        duration of response and progression-free survival were 12.6 months (90% CI 4.7 to not estimable) and 9.5 months (90%
        CI 5.4 to 13.8) respectively. Responses were observed across various HER2 mutations, including mutations in the tyrosine
        kinase and extracellular domains. No new safety signals were detected. The authors concluded that the chemotherapy-free
        combination showed clinically meaningful antitumour activity with durable responses and favourable tolerability in
        heavily pretreated patients, and that the data support further investigation of HER2-targeted therapy in this population.
    endpoint: Overall response rate.
    line: 2L,3L+
    modality: her2,endocrine
    n: 31
    nct: NCT04579380
    note: This is the HER2-mutated breast cohort of a solid-tumour basket study rather than a stand-alone breast trial, and
      it is single-arm. Entry required an activating HER2 mutation in disease that was HER2-negative by conventional local
      testing, so it is not a HER2-amplified or first-line HER2-positive trial and belongs with molecular-target evidence.
      The subtype tag is HR+/HER2-,TNBC because the cohort took both hormone receptor-positive and hormone receptor-negative
      patients within HER2-negative disease. Only the hormone receptor-positive patients received fulvestrant, and the full
      text gives response separately, 12 of 27 hormone receptor-positive and 1 of 4 receptor-negative patients. The abstract
      reports the duration of response and progression-free survival figures without naming a statistic, so the record does
      not call them medians. Confidence intervals are 90%, not the registry's usual 95%, and the cohort of 31 is small. Patients
      were heavily pretreated, but entry required only one previous line for locally advanced or metastatic disease and the
      full text gives a median of 3 (range 1 to 7) such lines, so the line tag is 2L,3L+.
    os: Secondary endpoint. Median overall survival was 20.1 months (90% CI 15.9 to not estimable) in this single-arm cohort,
      with 11 deaths, and the authors describe the data as immature.
    phase: '2'
    population: Heavily pretreated women with HER2-mutated metastatic breast cancer that was HER2-negative on local testing,
      enrolled as one cohort of an open-label basket study of HER2-altered solid tumours; those with hormone receptor-positive
      disease also received fulvestrant.
