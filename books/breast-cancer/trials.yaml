  kate2:
    acronym: KATE2
    arms: Trastuzumab emtansine 3.6 mg/kg plus atezolizumab 1200 mg versus trastuzumab emtansine plus placebo, randomly assigned
      2:1 and given intravenously every 3 weeks.
    chapters:
    - BC-900
    claim: PFS 8.2 vs 6.8 months, HR 0.82 (0.55-1.23), primary endpoint not met
    digest:
      methods: Randomised, double-blind, placebo-controlled phase 2 study at 68 centres in nine countries across Asia, Australia,
        North America and western Europe, testing whether atezolizumab potentiates the anticancer immunity and HER2-directed
        cytotoxic activity of trastuzumab emtansine. Eligible patients were adults with performance status 0 or 1 and centrally
        confirmed, measurable, HER2-positive advanced breast cancer previously treated with trastuzumab and a taxane. Patients
        were randomly assigned 2:1 to trastuzumab emtansine 3.6 mg/kg plus atezolizumab 1200 mg or trastuzumab emtansine plus
        placebo, all given intravenously every 3 weeks. Randomisation used a permuted block scheme stratified by PD-L1 status,
        world region and liver metastases, and patients, investigators and study team were masked. The primary endpoint was
        investigator-assessed progression-free survival in the intention-to-treat population.
      results: Between September 2016 and August 2017, 330 patients were screened and 202 were randomly allocated, 133 to
        atezolizumab and 69 to placebo. Treatment assignment was unmasked in December 2017 on the recommendation of the independent
        data monitoring committee because of futility and a numerically higher frequency of adverse events with atezolizumab,
        and that date became the clinical cutoff for the primary analysis. Median follow-up was 8.5 months with atezolizumab
        and 8.4 months with placebo. Median progression-free survival was 8.2 months (95% CI 5.8-10.7) versus 6.8 months (95%
        CI 4.0-11.1), stratified hazard ratio 0.82 (95% CI 0.55-1.23; p=0.33). The commonest grade 3 or worse adverse events
        were thrombocytopenia, in 17 (13%) of 132 patients given atezolizumab versus three (4%) of 68 given placebo, and raised
        aspartate aminotransferase; serious adverse events occurred in 43 (33%) versus 13 (19%), and one patient given atezolizumab
        died of treatment-related haemophagocytic syndrome.
    endpoint: Investigator-assessed progression-free survival in the intention-to-treat population.
