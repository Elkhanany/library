  coopera:
    acronym: coopERA Breast Cancer
    arms: Giredestrant 30 mg orally daily vs anastrozole 1 mg orally daily on days 1 to 14 as a window-of-opportunity phase,
      after which both groups continued the same regimen plus palbociclib for four 28-day cycles over a 16-week neoadjuvant
      phase.
    chapters:
    - BC-810
    claim: Giredestrant beat anastrozole on two-week Ki67 suppression, -75% vs -67%
    digest:
      methods: Open-label, randomised, controlled phase 2 study at 59 hospital or clinic sites in 11 countries, testing whether
        giredestrant, a potent non-steroidal oral selective oestrogen receptor degrader, has a stronger antiproliferative
        effect than anastrozole after two weeks. Postmenopausal women aged 18 or older with untreated clinical T1c to T4a-c
        oestrogen receptor-positive, HER2-negative early breast cancer, ECOG performance status 0 to 1 and a baseline Ki67
        score of at least 5% were randomly assigned 1:1 to giredestrant 30 mg or anastrozole 1 mg orally daily on days 1 to
        14, stratified by clinical T stage, baseline Ki67 score and progesterone receptor status. A 16-week neoadjuvant phase
        then gave the same regimen plus palbociclib 125 mg orally daily on days 1 to 21 of a 28-day cycle for four cycles.
        The primary endpoint was the geometric mean relative Ki67 change from baseline to week 2 in patients with complete
        central Ki67 scores at both timepoints. The report covers both the primary and the final analyses.
      results: Between Sept 4, 2020, and June 22, 2021, 221 patients were enrolled and randomly assigned, 112 to giredestrant
        plus palbociclib and 109 to anastrozole plus palbociclib, with a median age of 62.0 years in both groups. At the primary
        analysis cutoff the geometric mean relative reduction of Ki67 from baseline to week 2 was -75% (95% CI -80 to -70)
        with giredestrant and -67% (-73 to -59) with anastrozole (p=0.043), meeting the primary endpoint. The most common
        grade 3-4 adverse events at the final analysis were neutropenia, in 29 of 112 and 29 of 109, and decreased neutrophil
        count, in 17 and 16. Serious adverse events occurred in five patients in the giredestrant group and two in the anastrozole
        group, with no treatment-related deaths and one death from myocardial infarction in the giredestrant group. The authors
        conclude that giredestrant shows encouraging antiproliferative and antitumour activity alone and with palbociclib.
    endpoint: Geometric mean relative change in Ki67 score from baseline to week 2, in patients with complete central Ki67
      scores at baseline and week 2.
    line: neoadjuvant
    modality: endocrine,cdk4-6
    n: 221
    nct: NCT04436744
    note: The primary endpoint is pharmacodynamic and belongs to the two-week endocrine-only window, before either group received
      palbociclib, so it compares giredestrant with anastrozole and nothing else. The 16-week neoadjuvant combination phase
      that follows gave palbociclib to both groups and answers a different question; neither phase establishes survival superiority.
      The n of 221 is the number enrolled and randomised, while the primary endpoint was assessed only in the subset with
      complete central Ki67 scores at baseline and week 2, a number the abstract does not give. The key carries the full name
      because the literature writes the trial as coopERA Breast Cancer rather than as a bare acronym; there is no collision
      with an existing key.
    phase: '2'
    population: Postmenopausal women aged 18 years or older with untreated clinical T1c to T4a-c oestrogen receptor-positive,
      HER2-negative early breast cancer, an ECOG performance status of 0 to 1 and a baseline Ki67 score of at least 5%.
