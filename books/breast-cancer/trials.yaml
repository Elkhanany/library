  ang1005:
    acronym: ANG1005
    arms: Single arm of ANG1005 600 mg/m2 intravenously every 3 weeks, with no control arm.
    chapters:
    - BC-930
    claim: iORR 15% by investigator and 8% by independent review; preset response rule not met
    digest:
      methods: Multicenter, open-label phase II study of ANG1005, a taxane derivative in which three paclitaxel molecules
        are covalently linked to Angiopep-2, designed to cross the blood-brain and blood-cerebrospinal barriers and to enter
        malignant cells through the LRP1 transport system. Adult patients with measurable recurrent brain metastases from
        breast cancer, with or without leptomeningeal carcinomatosis, were enrolled. ANG1005 was given intravenously at 600
        mg/m2 every 3 weeks. Intracranial response was assessed by CNS RECIST 1.1 and extracranial response by RECIST 1.1.
        The primary endpoint was determination of the intracranial objective response rate.
      results: 72 patients with breast cancer brain metastases were enrolled, including a leptomeningeal carcinomatosis subset
        of 28. Median age was 47.5 years, the average number of prior CNS-directed therapies was 2.8, and 94% of patients
        had prior taxane treatment. Patient benefit, defined as stable disease or better, was seen in 77% of evaluable patients
        intracranially and 86% extracranially, with an intracranial objective response rate of 15% by investigator and 8%
        by independent radiology facility review. In the leptomeningeal carcinomatosis subset, 79% of patients had intracranial
        disease control and estimated median overall survival was 8.0 months (95% CI 5.4 to 9.4). The safety profile was similar
        to that of paclitaxel, with myelosuppression predominating.
    endpoint: Intracranial objective response rate, assessed by CNS RECIST 1.1.
    line: 3L+
    modality: chemo,other
    n: 72
    note: Single-arm study with no randomised comparator for either the parenchymal or the leptomeningeal population. The
      primary endpoint was formally negative, in that the preset rule for intracranial objective response rate by independent
      radiology facility review was not met, and the investigator-assessed rate of 15% and the independent rate of 8% should
      be read separately rather than merged. The 28-patient leptomeningeal carcinomatosis group is a subset of the 72 enrolled
      patients, so its disease control and survival figures are subgroup results, and the authors' claim of prolonged survival
      there rests on a comparison with historical control. The abstract gives no NCT identifier and states no hormone receptor
      or HER2 restriction, so the subtype axis is all comers. The treatment line axis rests on recurrent brain metastases
      having required prior therapy, with a mean of 2.8 prior CNS-directed therapies, rather than on a stated count of prior
      systemic lines.
    os: In the leptomeningeal carcinomatosis subset the estimated median overall survival was 8.0 months (95% CI 5.4 to 9.4).
      No overall survival figure is reported for the whole cohort, and the comparison the authors draw is with historical
      control rather than a randomised arm.
    phase: '2'
    population: Adults with measurable recurrent brain metastases from breast cancer, with or without leptomeningeal carcinomatosis,
      most of them heavily pretreated.
    primary_ref: kumthekar2020
    pubs:
    - kind: primary
      ref: kumthekar2020
      role: primary
    result: The intracranial objective response rate was 15 percent by investigator assessment and 8 percent by independent
      radiology facility review. The study preset rule for intracranial objective response rate by independent review was
      not met, and there was no comparator arm.
