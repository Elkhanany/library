        disease. Patients were assigned 2:1 to everolimus plus exemestane or placebo plus exemestane. The primary endpoint
        was progression-free survival. Secondary endpoints included survival, response rate and safety. A preplanned interim
        analysis was done after 359 progression-free survival events.
