    - BC-900
    - BC-930
    cited_by:
    - BC-570
    - BC-600
    - BC-450
    claim: OS 21.9 vs 17.4 months; brain-metastasis subgroup PFS HR 0.48
    digest:
      methods: Randomised double-blind placebo-controlled trial. Patients with HER2-positive metastatic breast cancer previously
        treated with trastuzumab, pertuzumab and trastuzumab emtansine, with or without brain metastases, were assigned to
        tucatinib or placebo in combination with trastuzumab and capecitabine. The primary endpoint was progression-free survival
        among the first 480 patients randomised. Secondary endpoints in the total population of 612 patients included overall
        survival, progression-free survival in patients with brain metastases, confirmed objective response rate and safety.
      results: One-year progression-free survival was 33.1% with tucatinib versus 12.3% with placebo (hazard ratio 0.54, 95%
        CI 0.42 to 0.71), with medians of 7.8 and 5.6 months. Two-year overall survival was 44.9% versus 26.6% (hazard ratio
        0.66, 0.50 to 0.88), with medians of 21.9 and 17.4 months. Among patients with brain metastases, 1-year progression-free
        survival was 24.9% versus 0% (hazard ratio 0.48, 0.34 to 0.69), with medians of 7.6 and 5.4 months.
    endpoint: progression-free survival in the first 480 patients randomised
    line: 3L+
    modality: her2,chemo
    n: 612
    nct: NCT02614794
    os: median 21.9 months against 17.4 months, hazard ratio 0.66 (0.50-0.88)
    phase: 2
    population: HER2-positive metastatic breast cancer previously treated with trastuzumab, pertuzumab and trastuzumab emtansine,
      with or without brain metastases; brain metastases could be untreated or progressing after local therapy.
    primary_ref: murthy2020
