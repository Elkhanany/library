    - BC-910
    digest:
      methods: Open-label, noninferiority phase 3 randomised trial at nine hospitals in China. Patients were stratified by
        previous adjuvant endocrine therapy and by recurrent versus de novo metastatic disease, then assigned 1:1 to trastuzumab
        plus endocrine therapy, using investigator's choice of oestrogen receptor modulator or aromatase inhibitor with or
        without ovarian suppression, or to trastuzumab plus chemotherapy, using investigator's choice of taxane, capecitabine
        or vinorelbine. The primary endpoint was progression-free survival with a noninferiority margin of 1.35, analysed
        by intention to treat.
      results: 392 patients were randomised, 196 to each group. After a median follow-up of 30.2 months, interquartile range
        15.0 to 44.7, median progression-free survival was 19.2 months, 95 percent CI 16.7 to 21.7, with endocrine therapy
        and 14.8 months, 95 percent CI 12.8 to 16.8, with chemotherapy. The hazard ratio was 0.88, 95 percent CI 0.71 to 1.09,
        noninferiority p less than 0.0001. Toxicity was significantly more prevalent in the chemotherapy group.
