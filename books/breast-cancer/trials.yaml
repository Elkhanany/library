  time2:
    acronym: TIME2
    arms: Outpatient indwelling pleural catheter with subsequent home drainage versus inpatient chest tube insertion with
      talc slurry pleurodesis.
    chapters:
    - BC-600
    digest:
      methods: Unblinded randomised controlled trial recruiting 106 patients with malignant pleural effusion and no previous
        pleurodesis from 143 treated at seven UK hospitals between April 2007 and February 2011, with 12 months of follow-up.
        Indwelling pleural catheters were inserted on an outpatient basis with initial large-volume drainage, education and
        home drainage. The talc arm was admitted for chest tube insertion and talc slurry pleurodesis. The primary endpoint
        was a daily 100 mm visual analogue scale for breathlessness over 42 days.
      results: Mean breathlessness score was 24.7 mm in the catheter arm and 24.4 mm in the talc arm over 42 days, difference
        0.16 mm (95% CI -6.82 to 7.15, P = .96). At six months the difference was -14.0 mm in favour of the catheter (95%
        CI -25.2 to -2.8, P = .01). Median initial hospitalisation was 0 days against 4 days, difference -3.5 days (P < .001).
        Quality of life did not differ. Further pleural procedures were needed by 3 of 52 catheter patients against 12 of
        54 talc patients. Adverse events occurred in 21 of 52 against 7 of 54.
    endpoint: Daily 100 mm visual analogue scale score for breathlessness over the 42 days after the procedure.
    modality: supportive
    n: 106
    note: Mixed primary tumours rather than breast cancer alone. Registration was ISRCTN87514420. The primary endpoint is
      a patient-reported symptom score, so the trial measures relief of breathlessness and not control of the effusion. The
      publication states no phase.
