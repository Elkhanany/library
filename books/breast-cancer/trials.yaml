  neopal:
    acronym: NeoPAL
    arms: letrozole plus palbociclib for 19 weeks vs FEC100 followed by docetaxel
    chapters:
    - BC-810
    cited_by:
    - BC-810
    digest:
      methods: NeoPAL was a randomised, parallel, non-comparative phase 2 study. Patients with ER-positive, HER2-negative,
        Prosigna-defined luminal B or luminal A node-positive stage II-III breast cancer who were not candidates for breast-conserving
        surgery were assigned to letrozole 2.5 mg daily plus palbociclib 125 mg daily 3 weeks in 4 for 19 weeks, or to three
        cycles of FEC100 followed by three cycles of docetaxel 100 mg/m2. The primary end point was residual cancer burden
        0-I rate.
      results: 106 patients were randomised, with a median Prosigna ROR score of 71 (22-93). Residual cancer burden 0-I was
        seen in 4 patients on letrozole-palbociclib (7.7%, 95% CI 0.4-14.9) and 8 on chemotherapy (15.7%, 95% CI 5.7-25.7).
        Pathological complete response rates were 3.8% and 5.9%. Clinical response was 75% and breast-conserving surgery 69%
        in both arms. Preoperative Endocrine Prognostic Index 0 scores occurred in 17.6% and 8.0%. Serious adverse events
        numbered 2 versus 17.
    endpoint: residual cancer burden class 0 or I rate
    line: neoadjuvant
    modality: cdk4-6,endocrine,chemo
