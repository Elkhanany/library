  insema:
    acronym: INSEMA
    arms: no axillary surgery vs sentinel lymph node biopsy
    chapters:
    - BC-410
    digest:
      methods: Prospective randomised non-inferiority trial. Patients with clinically node-negative invasive breast cancer
        staged T1 or T2 at 5 cm or less, scheduled for breast-conserving surgery, were randomly assigned 1:4 to omission of
        axillary surgery or to sentinel lymph node biopsy. Non-inferiority required a 5-year invasive disease-free survival
        of at least 85% and an upper confidence limit for the hazard ratio below 1.271.
      results: 5502 patients were randomised and 4858 analysed per protocol, 962 without axillary surgery and 3896 with sentinel
        node biopsy. At a median 73.6 months, 5-year invasive disease-free survival was 91.9% and 91.7%, hazard ratio 0.91
        (0.73-1.14). Axillary recurrence was 1.0% against 0.3% and death 1.4% against 2.4%. Lymphoedema was less frequent
        and arm mobility better without axillary surgery.
    endpoint: invasive disease-free survival, non-inferiority, analysed per protocol
    line: adjuvant
    modality: surgery
    n: 5502
    nct: NCT02466737
    note: 90% of those enrolled had clinical T1 disease, so the result speaks to small node-negative tumours rather than to
      the T2 range the eligibility allowed.
    os: not reported separately. Among the 525 first primary-outcome events, death accounted for 1.4% in the surgery-omission
      group and 2.4% in the sentinel node group
    phase: 3
    population: clinically node-negative invasive breast cancer of 5 cm or less scheduled for breast-conserving surgery; 5502
      randomised 1:4 and 4858 analysed per protocol
    primary_ref: reimer2024
    pubs:
    - kind: primary
      ref: reimer2024
      role: primary
    result: 5-year invasive disease-free survival 91.9% (89.9-93.5) without axillary surgery against 91.7% (90.8-92.6) with
      sentinel node biopsy, hazard ratio 0.91 (0.73-1.14), inside the prespecified margin of 1.271, at a median 73.6 months.
      Axillary recurrence was 1.0% against 0.3%
