  penelope-b:
    acronym: PENELOPE-B
    arms: palbociclib 125 mg on days 1-21 of a 28-day cycle for 13 cycles plus endocrine therapy vs placebo plus endocrine
      therapy
    chapters:
    - BC-800
    cited_by:
    - BC-490
    - BC-800
    claim: negative. Stratified HR for IDFS 0.93 (95% repeated CI 0.74-1.17)
    digest:
      methods: Double-blind, placebo-controlled phase III trial in women with hormone receptor-positive, HER2-negative primary
        breast cancer and no pathological complete response after taxane-containing neoadjuvant chemotherapy, at high risk
        of relapse by a CPS-EG score of 3 or more, or 2 with ypN+. Patients were assigned 1:1 to 13 cycles of palbociclib
        125 mg once daily on days 1-21 of a 28-day cycle or placebo, each added to endocrine therapy. The primary endpoint
        was invasive disease-free survival.
      results: 1250 patients were randomly assigned. At a median follow-up of 42.8 months, 308 invasive disease-free survival
        events were confirmed. The stratified hazard ratio was 0.93 (95% repeated CI 0.74 to 1.17, weighted log-rank p=0.525),
        with no difference across subgroups. Related serious adverse events occurred in 113 patients (9.1%). The final survival
        report recorded 225 deaths at a median 77.8 months, with 6-year overall survival 82.4% versus 80.3% (hazard ratio
        0.87, 95% CI 0.67 to 1.14, P=0.31).
    endpoint: invasive disease-free survival
    line: post-neoadjuvant
    modality: cdk4-6
    n: 1250
    nct: NCT01864746
    os: not reported in the primary analysis
    phase: 3
    population: HR-positive/HER2-negative disease with residual invasive disease after taxane-containing neoadjuvant chemotherapy
      and a CPS-EG score of 3 or more, or 2 with ypN-positive disease
    primary_ref: loibl2021penelopeb
    pubs:
    - kind: primary
      ref: loibl2021penelopeb
      role: report
    - kind: update
      ref: loibl2025
      role: final
    result: stratified HR 0.93 (95% repeated CI 0.74-1.17), p=0.525, with 308 events at a median follow-up of 42.8 months
