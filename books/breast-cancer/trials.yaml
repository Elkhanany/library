  fast-forward:
    acronym: FAST-Forward
    chapters:
    - BC-420
    - BC-740
    cited_by:
    - BC-420
    claim: 26 Gy in 5 fractions non-inferior to 40 Gy in 15 at 5 years
    digest:
      methods: Multicentre phase 3 randomised non-inferiority trial at 97 UK centres. Patients aged at least 18 years with
        invasive breast carcinoma (pT1-3, pN0-1, M0) after breast conservation surgery or mastectomy were eligible. Allocation
        was to 40 Gy in 15 fractions over 3 weeks, 27 Gy in five fractions over 1 week, or 26 Gy in five fractions over 1
        week, to the whole breast or chest wall. The primary endpoint was ipsilateral breast tumour relapse.
      results: 4096 patients were recruited, 1361 to 40 Gy, 1367 to 27 Gy and 1368 to 26 Gy. At a median follow-up of 71.5
        months, 79 primary endpoint events occurred (31, 27 and 21). Hazard ratios versus 40 Gy were 0.86 (95% CI 0.51 to
        1.44) for 27 Gy and 0.67 (0.38 to 1.16) for 26 Gy. Five-year relapse incidence after 40 Gy was 2.1%. Moderate or marked
        clinician-assessed normal tissue effects at 5 years were 9.9%, 15.4% and 11.9%.
    line: adjuvant
    modality: radiation
    nct: ISRCTN19906132
    phase: 3
    primary_ref: brunt2020
    pubs:
    - kind: primary
      ref: brunt2020
      role: primary
    setting: early
    status: reported
    subtype: all
    topic: five-fraction radiotherapy delivered in one week
  fata-gim3:
    acronym: FATA-GIM3
    arms: Anastrozole, exemestane or letrozole upfront for 5 years versus tamoxifen for 2 years then one of those aromatase
      inhibitors for 3 years.
    chapters:
    - BC-790
    digest:
      methods: Multicentre, open-label, randomised phase 3 trial of six treatments. Postmenopausal women with completely resected
        hormone receptor-positive invasive breast cancer, any tumour size and nodal status, and no previous tamoxifen, were
        assigned in equal ratio to oral anastrozole 1 mg, exemestane 25 mg or letrozole 2.5 mg daily upfront for 5 years,
        or to tamoxifen 20 mg daily for 2 years followed by one of those aromatase inhibitors for 3 years. The primary endpoint
        was disease-free survival.
      results: 3697 patients were enrolled. After a median follow-up of 60 months, 401 disease-free survival events occurred,
        211 of 1850 on the switch strategy and 190 of 1847 on upfront treatment. 5-year disease-free survival was 88.5% versus
        89.8% (hazard ratio 0.89, 95% CI 0.73 to 1.08, p = 0.23). By drug it was 90.0% with anastrozole, 88.0% with exemestane
        and 89.4% with letrozole (p = 0.24). Grade 3 to 4 musculoskeletal events occurred in 7% of each strategy.
    endpoint: Disease-free survival.
    line: adjuvant
    modality: endocrine
    n: 3697
    nct: NCT00541086
    os: not yet reported
    phase: 3
    population: Postmenopausal women with hormone receptor-positive invasive breast cancer completely removed by surgery,
      any tumour size and any nodal status, no previous tamoxifen.
    primary_ref: deplacido2018
    pubs:
    - kind: primary
      ref: deplacido2018
      role: primary
    result: 5-year disease-free survival was 89.8% with upfront aromatase inhibitor and 88.5% with the switch strategy (hazard
      ratio 0.89, 95% CI 0.73 to 1.08, p = 0.23).
    reviewed: '2026-09-14'
    setting: early
