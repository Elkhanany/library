      methods: Randomised, open-label, international phase III trial. Patients with previously untreated, locally recurrent
        inoperable or metastatic triple-negative breast cancer for whom immunotherapy was not an option were randomly assigned
        1:1 to datopotamab deruxtecan 6 mg/kg intravenously every 3 weeks or to investigator's choice of chemotherapy. Randomisation
