    digest:
      methods: Ongoing single-arm, five-cohort phase 2 study in pretreated HER2-positive or HER2-low advanced breast cancer
        with stable, untreated or progressing brain metastases, or leptomeningeal carcinomatosis. This report covers HER2-positive
        patients with non-progressing brain metastases after local therapy (cohort 1, 8 patients), asymptomatic untreated
        brain metastases (cohort 2, 4 patients) and brain metastases progressing after local therapy (cohort 3, 9 patients).
