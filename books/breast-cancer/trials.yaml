  pearl:
    acronym: PEARL
    arms: Palbociclib plus exemestane or fulvestrant versus capecitabine.
    chapters:
    - BC-560
    - BC-870
    - BC-880
    - BC-890
    digest:
      methods: Multicentre phase III randomised trial in patients with aromatase inhibitor-resistant metastatic breast cancer,
        enrolled in two consecutive cohorts. Cohort 1 randomised 1:1 to palbociclib plus exemestane or capecitabine. After
        evidence that ESR1 mutations drive aromatase inhibitor resistance, cohort 2 randomised 1:1 to palbociclib plus fulvestrant
        or capecitabine. Stratification was by disease site, prior endocrine sensitivity, prior chemotherapy for metastatic
        disease and country. Co-primary endpoints were progression-free survival in cohort 2 and in wild-type ESR1 patients.
      results: 296 patients entered cohort 1 and 305 entered cohort 2. Palbociclib plus endocrine therapy was not superior
        to capecitabine in cohort 2 (median progression-free survival 7.5 versus 10.0 months, adjusted hazard ratio 1.13)
        or in wild-type ESR1 patients (8.0 versus 10.6 months, adjusted hazard ratio 1.11). Grade 3-4 neutropenia was 57.4%
        and 55.7% with palbociclib versus 5.5% with capecitabine. Time to deterioration of global health status favoured palbociclib,
        adjusted hazard ratio 0.67.
    endpoint: Progression-free survival in cohort 2 and in patients with wild-type ESR1, as co-primary endpoints.
    line: 2L
    modality: endocrine,cdk4-6,chemo
    n: 601
    nct: NCT02028507
    os: Median overall survival in cohort 2 was 31.1 months with palbociclib plus fulvestrant versus 32.8 months with capecitabine,
      adjusted hazard ratio 1.10 (95% CI 0.81-1.50, p=0.550). In the wild-type ESR1 population it was 37.2 versus 34.8 months,
      adjusted hazard ratio 1.06 (95% CI 0.81-1.37, p=0.683).
    phase: 3
    population: Postmenopausal patients with hormone receptor-positive, HER2-negative metastatic breast cancer resistant to
      aromatase inhibitors.
    primary_ref: martin2020
    pubs:
    - kind: primary
      ref: martin2020
      role: primary
    - kind: survival
      ref: martn2022
      role: os
    result: In cohort 2 median progression-free survival was 7.5 months with palbociclib plus fulvestrant versus 10.0 months
      with capecitabine, adjusted hazard ratio 1.13 (95% CI 0.85-1.50). In wild-type ESR1 patients it was 8.0 versus 10.6
      months, adjusted hazard ratio 1.11 (95% CI 0.87-1.41). Palbociclib plus endocrine therapy was not superior.
    reviewed: '2026-09-14'
