    digest:
      methods: Open-label phase 3 non-inferiority trial at 156 French centres comparing 6 months with 12 months of adjuvant
        trastuzumab. Eligible women were 18 years or older with non-metastatic operable HER2-positive breast cancer, either
        node-positive or node-negative with a tumour of at least 10 mm. All had received at least four chemotherapy cycles
        and started adjuvant trastuzumab. Randomisation occurred between the third and sixth month. The primary objective
        was non-inferiority for disease-free survival with a hazard margin of 1.15.
      results: 3384 patients were randomly assigned, 1691 to 12 months and 1693 to 6 months, with 1690 per group analysed.
        At a median follow-up of 7.5 years, 704 disease-free survival events were observed, 345 (20.4%) in the 12-month group
        and 359 (21.2%) in the 6-month group. The adjusted hazard ratio was 1.08 (95% CI 0.93 to 1.25, p=0.39). The confidence
        interval included the non-inferiority margin. No subgroup differences by duration were found.
