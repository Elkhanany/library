  scorad:
    acronym: SCORAD
    arms: External beam single-fraction 8 Gy versus 20 Gy in five fractions over five consecutive days.
    chapters:
    - BC-600
    digest:
      methods: Multicentre non-inferiority randomised clinical trial at 42 UK and 5 Australian radiotherapy centres, recruiting
        between February 2008 and April 2016 with final follow-up in September 2017. Eligible patients had metastatic cancer
        with spinal cord or cauda equina compression, life expectancy over 8 weeks and no previous radiotherapy to the same
        area. They were randomised to single-fraction 8 Gy or to 20 Gy in five fractions. The primary endpoint was ambulatory
        status at week 8 on a 4-point scale, with a non-inferiority margin of -11%.
      results: Of 686 randomised patients, 342 were analysed for the primary endpoint because 255 died before the week 8 assessment.
        Ambulatory grade 1 or 2 at week 8 was reached by 115 of 166 (69.3%) after a single fraction against 128 of 176 (72.7%)
        after five fractions, difference -3.5%, P for non-inferiority = .06. Non-inferiority was met at week 1 (-0.4%, P =
        .004), week 4 (-0.7%, P = .01) and week 12 (4.1%, P = .002). Overall survival at 12 weeks was 50% against 55%, hazard
        ratio 1.02 (95% CI 0.74 to 1.41).
    endpoint: Ambulatory status at week 8, with a non-inferiority margin of -11 percentage points.
    modality: radiation
    n: 686
    note: Breast cancer was 12% of the enrolled population. The primary endpoint was assessed in 342 of 686 patients because
      the rest had died by week 8, which is the main limit on reading the non-inferiority result. The publication states no
      phase.
    os: Overall survival at 12 weeks was 50% after a single fraction against 55% after five fractions, stratified hazard ratio
      1.02 (95% CI 0.74 to 1.41).
    population: Patients with spinal cord or cauda equina compression from metastatic cancer at 42 UK and 5 Australian centres,
      with life expectancy over 8 weeks and no previous radiotherapy to the same area. 44% had prostate cancer, 19% lung cancer
      and 12% breast cancer.
    primary_ref: hoskin2019
