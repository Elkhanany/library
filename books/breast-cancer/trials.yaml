    result: The geometric mean relative reduction of Ki67 from baseline to week 2 was -75% (95% CI -80 to -70) with giredestrant
      and -67% (-73 to -59) with anastrozole (p=0.043), meeting the primary endpoint.
    setting: early
    source:
