    arms: Single arm of neoadjuvant paclitaxel plus trastuzumab and pertuzumab, with adjuvant therapy guided by pathologic
      response.
    chapters:
    - BC-830
    - BC-840
    digest:
      methods: Single-arm prospective phase 2 trial. Patients with treatment-naive stage II to III HER2-positive breast cancer
        received neoadjuvant weekly paclitaxel for 12 doses with trastuzumab and pertuzumab every 3 weeks for 4 doses, then
        surgery. Adjuvant therapy was guided by pathologic response, with antibody doublet alone for patients with pathologic
        complete response. The primary endpoint was receipt of adjuvant non-HER2-directed cytotoxic chemotherapy.
      results: Ninety-eight patients received at least one dose. Median age was 50 years, 86 percent had stage II tumours
        and 34 percent were hormone receptor negative. Five patients with incomplete clinical response received doxorubicin
        and cyclophosphamide before surgery and were classified as non-pCR. The overall pCR rate was 56.7 percent. Adherence
        to antibody-only adjuvant therapy was 98.2 percent. At median follow-up of 19.1 months there were no recurrences.
    endpoint: Receipt of adjuvant non-HER2-directed cytotoxic chemotherapy, as a measure of feasibility of de-escalation.
    line: neoadjuvant
    modality: her2,chemo
