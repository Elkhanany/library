  jlgk0901:
    acronym: JLGK0901
    arms: Single cohort of stereotactic radiosurgery without whole-brain radiotherapy, analysed by number of brain metastases.
    chapters:
    - BC-930
    digest:
      methods: This prospective observational study at 23 Japanese facilities enrolled patients with one to ten newly diagnosed
        brain metastases, largest tumour under 10 mL and 3 cm and total volume at most 15 mL, with Karnofsky performance status
        70 or higher. Stereotactic radiosurgery was given without whole-brain radiotherapy, 22 Gy at the periphery for tumours
        under 4 mL and 20 Gy for those of 4 to 10 mL. The primary endpoint was overall survival, with a non-inferiority margin
        of 1.30.
      results: Between March 2009 and February 2012, 1194 eligible patients were enrolled. Median overall survival was 13.9
        months in 455 patients with one tumour, 10.8 months in 531 with two to four tumours and 10.8 months in 208 with five
        to ten tumours. Survival did not differ between the two multiple-tumour groups, hazard ratio 0.97 (95% CI 0.81 to
        1.18, p = 0.78). Radiosurgery-induced adverse events occurred in 101 patients (8%), and four patients died.
    endpoint: Overall survival, tested for non-inferiority of five to ten brain metastases against two to four.
    modality: radiation
    n: 1194
    note: This is a prospective observational cohort rather than a randomised trial, and it enrolled patients with brain metastases
      from any primary cancer, not only breast cancer, so the subtype axis is not breast-specific.
    os: Median overall survival after stereotactic radiosurgery was 13.9 months (95% CI 12.0 to 15.6) with one tumour, 10.8
      months (9.4 to 12.4) with two to four tumours, and 10.8 months (9.1 to 12.7) with five to ten tumours.
    population: Patients with one to ten newly diagnosed brain metastases, each under 10 mL and 3 cm, with Karnofsky performance
      status 70 or higher.
    primary_ref: yamamoto2014
    pubs:
    - kind: primary
      ref: yamamoto2014
      role: primary
    result: Median overall survival was 10.8 months in patients with five to ten brain metastases and 10.8 months in those
      with two to four, hazard ratio 0.97 (95% CI 0.81 to 1.18, p = 0.78), which met the non-inferiority margin (p non-inferiority
      < 0.0001).
