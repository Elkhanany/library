        (0.49-0.78). Median overall survival was 21.3 versus 17.6 months, hazard ratio 0.84 (0.69-1.02, P=0.08). The final
        overall survival analysis reported 21.0 versus 18.7 months, hazard ratio 0.87 (0.75-1.02).
