    claim: letrozole monotherapy superior to tamoxifen monotherapy; sequences not superior to letrozole alone
    digest:
      methods: BIG 1-98 is a randomised, double-blind, phase 3 trial in postmenopausal women with hormone receptor-positive
        early breast cancer. It compares 5 years of tamoxifen or letrozole monotherapy against sequential treatment with 2
        years of one drug followed by 3 years of the other. Randomisation was stratified by randomisation option, participating
        institution and chemotherapy use. The primary endpoint was disease-free survival. Secondary endpoints were overall
        survival, distant recurrence-free interval and breast cancer-free interval.
      results: 8010 patients were enrolled, with a median follow-up of 8.1 years. At 8.7 years median follow-up letrozole
        monotherapy was better than tamoxifen by intention to treat. Disease-free survival HR was 0.86 (0.78-0.96), overall
        survival HR 0.87 (0.77-0.999), distant recurrence-free interval HR 0.86, breast cancer-free interval HR 0.86. Neither
        sequence differed from letrozole monotherapy on any endpoint. The 12.6-year long-term follow-up reported a disease-free
        survival HR of 0.91 (0.81-1.01).
    endpoint: disease-free survival
