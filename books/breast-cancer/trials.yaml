        0.79, 95% CI 0.65 to 0.96, p=0.020), consistent across Trop-2 expression subgroups. Objective response rate was 21%
        versus 14% (odds ratio 1.63, p=0.035). The 2022 primary analysis reported median progression-free survival of 5.5
