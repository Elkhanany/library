        was 3.6 months versus 3.7 months, stratified hazard ratio 1.051 (95% CI 0.789 to 1.4, one-sided P=.643). Among the
        120 of 280 patients with a baseline mutation, median progression-free survival was 3.7 versus 2.0 months, hazard ratio
        0.9 (0.565 to 1.435). Overall survival data were immature, hazard ratio 0.913 (0.595 to 1.403). Grade 3 or higher
