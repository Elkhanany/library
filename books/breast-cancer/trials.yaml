    - BC-490
    - BC-850
    cited_by:
    - BC-490
    - BC-380
    digest:
      methods: Randomised phase 3 study. 6693 women with early-stage breast cancer had genomic risk determined with the 70-gene
        signature and clinical risk with a modified Adjuvant! Online. Women at low clinical and low genomic risk received
        no chemotherapy. Women at high clinical and high genomic risk received chemotherapy. Patients with discordant results
        were assigned by either the genomic or the clinical risk. The primary goal tested 5-year survival without distant
        metastasis against a 92% non-inferiority boundary.
      results: 1550 patients (23.2%) were at high clinical risk and low genomic risk. Among those not given chemotherapy,
        the 5-year rate of survival without distant metastasis was 94.7% (95% CI 92.5 to 96.2). The absolute difference against
        patients who received chemotherapy was 1.5 percentage points, lower without chemotherapy. Similar rates were reported
        in the ER-positive, HER2-negative subgroup. The 2021 updated analysis reported 8-year distant metastasis-free survival
        of 92.0% with chemotherapy and 89.4% without (hazard ratio 0.66).
    endpoint: 5-year distant metastasis-free survival without chemotherapy in patients at high clinical and low genomic risk,
      against a non-inferiority boundary of 92%
    line: adjuvant
    modality: chemo
    n: 6693
    nct: NCT00433589
    os: not reported in the updated analysis
    phase: 3
    population: early breast cancer with up to three positive nodes, staged for clinical risk by a modified Adjuvant! Online
      and for genomic risk by the 70-gene signature; 6,693 enrolled and the 1,497 at high clinical and low genomic risk randomised
    primary_ref: piccart2021mindact
    pubs:
    - kind: primary
