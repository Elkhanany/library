    topic: pan-PI3K and mTOR inhibition after CDK4/6 inhibitor failure, with or without palbociclib
    year: 2026
  wbrt-with-or-without-temozolomide:
    acronym: WBRT with or without temozolomide
    arms: Whole-brain radiation therapy with concurrent temozolomide versus whole-brain radiation therapy alone.
    chapters:
    - BC-930
    digest:
      methods: Multicentre prospective randomised phase 2 study in patients with newly diagnosed intraparenchymal brain metastases
        from breast cancer unsuitable for surgery or radiosurgery. All patients received conformal whole-brain radiation therapy
        of 3 Gy fractions to 10 to 30 Gy, with or without concomitant temozolomide 75 mg/m2 daily during irradiation. The
        primary endpoint was objective response rate at six weeks on brain MRI by modified WHO criteria. Secondary endpoints
        were progression-free survival, overall survival, neurologic symptoms and tolerability.
      results: 100 patients were enrolled between February 2008 and November 2010, 50 per arm. Median age was 55 years and
        median follow-up 9.4 months. Objective response rate at six weeks was 36% with whole-brain radiation alone and 30%
        with added temozolomide, not significant. Median progression-free survival was 7.4 months versus 6.9 months and median
        overall survival 11.1 months versus 9.4 months. The most common grade 2 or worse acute toxicity was reversible lymphopenia.
    endpoint: Objective response rate on brain MRI six weeks after the end of treatment.
    modality: radiation,chemo
    n: 100
    nct: NCT00875355
    os: Median overall survival was 9.4 months with whole-brain radiation plus temozolomide versus 11.1 months with whole-brain
      radiation alone.
    phase: 2
    population: Patients with newly diagnosed intraparenchymal brain metastases from breast cancer unsuitable for surgery
      or radiosurgery.
    primary_ref: cao2014
    pubs:
    - kind: primary
      ref: cao2014
      role: primary
    result: Objective response rate was 30% with whole-brain radiation plus temozolomide versus 36% with whole-brain radiation
      alone, a difference that was not significant.
    reviewed: '2026-09-14'
    setting: cns
    source:
    - group: Radiotherapy foundations and systemic treatment combinations
      section: Brain and leptomeningeal metastases
    status: reported
    subtype: all
    topic: WBRT with or without concurrent temozolomide in breast cancer BM, randomised phase II, drug-with-radiotherapy
    year: 2014
  wsg-adapt-hr-her2:
    acronym: WSG-ADAPT HR+/HER2−
    arms: Endocrine therapy alone for recurrence score 12 to 25 with endocrine response versus endocrine therapy alone for
      recurrence score 11 or lower.
    chapters:
    - BC-490
    - BC-790
    - BC-810
    digest:
      methods: Trial combining the 21-gene recurrence score with response to three weeks of preoperative endocrine therapy
        to guide systemic treatment. Baseline and post-endocrine Ki67 were assessed centrally. Patients with none to three
        involved nodes received endocrine therapy alone, in the control arm if recurrence score was 11 or lower and in the
        experimental arm if recurrence score was 12 to 25 with endocrine response, meaning Ki67 of 10% or less. All other
        patients received dose-dense chemotherapy then endocrine therapy.
      results: The intention-to-treat population was 2,290 patients, 1,422 experimental and 868 control. Five-year invasive
        disease-free survival was 92.6% versus 93.9%, five-year distant disease-free survival 95.6% versus 96.3% and five-year
        overall survival 97.3% versus 98.0%. Results were similar across age and nodal subgroups. Endocrine response occurred
        in 78.1% on aromatase inhibitors versus 41.1% on tamoxifen, and in 78.8% of recurrence score 0 to 11, 62.2% of 12
        to 25 and 32.7% above 25.
    endpoint: Noninferiority of five-year invasive disease-free survival in the experimental arm compared with the control
      arm.
    line: adjuvant
    modality: endocrine,chemo
    n: 2290
    nct: NCT01779206
    note: Arm allocation followed recurrence score and endocrine response rather than randomisation, and the three-week preoperative
      endocrine therapy is a response window while the therapy decision itself is adjuvant.
    os: Five-year overall survival was 97.3% in the experimental arm versus 98.0% in the control arm.
    population: Patients with hormone receptor-positive HER2-negative early breast cancer and no more than three involved
      lymph nodes.
    primary_ref: nitz2022
    pubs:
    - kind: primary
      ref: nitz2022
      role: primary
    result: Five-year invasive disease-free survival was 92.6% in the experimental arm versus 93.9% in the control arm, and
      the one-sided 95% lower confidence limit of the difference was -3.3%, establishing prespecified noninferiority.
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 53
      group: Genomic assay–guided chemotherapy
      section: Early nonmetastatic disease
    - ch: 56
      group: Endocrine response–adapted / biomarker
      section: Early nonmetastatic disease
    status: reported
    subtype: HR+/HER2-
    topic: RS + Ki-67 endocrine-response–guided omission, genomic-assay
    year: 2022
  wsg-adapt-tn:
    acronym: WSG-ADAPT-TN
    arms: Nab-paclitaxel 125 mg/m2 with gemcitabine 1000 mg/m2 on days 1 and 8 every 3 weeks versus nab-paclitaxel 125 mg/m2
      with carboplatin AUC 2 on days 1 and 8 every 3 weeks, each for 12 weeks.
    chapters:
    - BC-860
    claim: Nab-paclitaxel plus carboplatin raised pCR over gemcitabine without a survival gain
    digest:
      methods: Randomised neoadjuvant multicentre phase 2 trial. Patients with triple-negative breast cancer, oestrogen and
        progesterone receptor under 1% and HER2-negative, cT1c to cT4c, cN0 or node-positive, were randomly assigned to 12
        weeks of nab-paclitaxel 125 mg/m2 with gemcitabine 1000 mg/m2 or with carboplatin AUC 2, given on days 1 and 8 every
        3 weeks. The trial was powered for a pathological complete response comparison by arm and for early response, defined
        as a Ki-67 decrease of more than 30% or fewer than 500 invasive tumour cells in the three-week serial biopsy. Omission
        of further neoadjuvant or adjuvant chemotherapy was allowed only in patients with pathological complete response.
        The final report added invasive and distant disease-free survival and overall survival, and quantified 119 genes including
        PAM50 subtype on the nCounter platform alongside stromal tumour-infiltrating lymphocytes.
      results: 336 patients were enrolled at 48 centres, 182 to nab-paclitaxel plus gemcitabine and 154 to nab-paclitaxel
        plus carboplatin; median age was 50 years, and 62.6% and 62.9% respectively had cT2 to cT4c tumours. Pathological
        complete response was 28.7% versus 45.9%, P = .002, and was lower in early non-responders than in early responders,
        19.5% versus 44.4%, P < .001. Nab-paclitaxel with gemcitabine brought more dose reductions, 20.6% versus 11.9%, and
        more grade 3 to 4 ALAT elevations, 11.7% versus 3.3%. After 60 months of median follow-up the final analysis found
        12-week pathological complete response favourably associated with outcome, hazard ratio 0.24, with 5-year invasive
        disease-free survival of 90.6% versus 62.8%. No survival advantage of carboplatin was seen despite the higher pathological
        complete response rate, hazard ratio 1.04 (95% CI 0.68 to 1.59), and additional anthracycline-containing chemotherapy
        was not associated with a significant invasive disease-free survival advantage in patients with pathological complete
        response, hazard ratio 1.29 (95% CI 0.41 to 4.02).
    endpoint: Pathological complete response (ypT0/is ypN0) by therapy arm; the trial was also powered for early response,
      defined as a Ki-67 decrease of more than 30% or fewer than 500 invasive tumour cells in the three-week serial biopsy.
    line: neoadjuvant
    modality: chemo
    n: 336
    note: The tabulated result is the primary pathological complete response comparison from gluz2018. The final analysis,
      gluz2022, reports no survival advantage for carboplatin despite its higher pathological complete response rate, hazard
      ratio 1.04 (95% CI 0.68 to 1.59), so the pathological complete response gain here did not become a survival gain. Treatment
      after the 12 weeks was response-adapted, with omission of further chemotherapy allowed only after pathological complete
      response, so between-arm survival comparisons are confounded by what patients received next. gluz2022 is indexed in
      PubMed as an editorial but is the trial's final survival and translational report, and no overall survival figures are
      given in either abstract. No NCT identifier appears in the abstracts, so none is recorded.
    os: no survival advantage from carboplatin at a median follow-up of 60 months despite the higher pathological complete
      response rate, HR 1.04 (0.68-1.59); the final analysis does not report overall survival separately from invasive disease-free
      survival
    phase: '2'
    population: Patients with triple-negative breast cancer, oestrogen and progesterone receptor under 1% and HER2-negative,
      cT1c to cT4c, cN0 or node-positive.
    primary_ref: gluz2018
    pubs:
    - kind: primary
      ref: gluz2018
      role: primary
    - kind: survival
      ref: gluz2022
      role: follow-up
    result: Pathological complete response was 28.7% (95% CI 0.22 to 0.36) with nab-paclitaxel plus gemcitabine and 45.9%
      (95% CI 0.38 to 0.54) with nab-paclitaxel plus carboplatin, 95% CI for the difference 6.2% to 27.9%, P = .002. Pathological
      complete response was lower in early non-responders than in early responders, 19.5% versus 44.4%, P < .001, and was
      50.0% in patients whose early response was unclassifiable.
    setting: early
    source:
    - ch: 63
      section: Additional studies — Early TNBC / hereditary HER2−
    status: reported
    subtype: TNBC
    topic: twelve weeks of anthracycline-free nab-paclitaxel chemotherapy, carboplatin versus gemcitabine, with response used
      to guide further treatment
    weight: supporting
    year: 2018
  wsg-adapt-tp:
    acronym: WSG-ADAPT-TP
    arms: trastuzumab emtansine, with or without endocrine therapy, vs trastuzumab plus endocrine therapy, each for 12 weeks
      before surgery
    chapters:
    - BC-830
    - BC-840
    digest:
      methods: Phase 2 trial. 375 patients with centrally confirmed HR+/HER2+ early breast cancer, clinical stage I to III,
        were randomly assigned 1:1:1 to 12 weeks of neoadjuvant T-DM1, T-DM1 plus endocrine therapy, or trastuzumab plus endocrine
        therapy every 3 weeks. Adjuvant chemotherapy could be omitted after pathologic complete response. Patients receiving
        at least one dose were analysed. Survival used Kaplan-Meier, log-rank and Cox models stratified for nodal and menopausal
        status.
      results: Five-year invasive disease-free survival was 88.9%, 85.3% and 84.6% across the three arms, p=0.608. Five-year
        overall survival was 97.2%, 96.4% and 96.3%, p=0.534. Patients with pathologic complete response had 5-year invasive
        disease-free survival of 92.7% versus 82.7% without, hazard ratio 0.40. Of 117 patients with pathologic complete response,
        41 omitted adjuvant chemotherapy, with rates of 92.1% versus 93.0%, p=0.848.
    endpoint: pathological complete response (ypT0/is ypN0)
    line: neoadjuvant
    modality: adc,her2,endocrine
    n: 375
    nct: NCT01779206
    note: The hormone receptor-positive sub-trial of the ADAPT umbrella. The hormone receptor-negative sub-trial is adapt-her2-hr,
      a different regimen; the two were held in one record until the publications were checked against the populations.
    os: 5-year overall survival 97.2%, 96.4% and 96.3% across the three arms, p=0.534
    phase: 2
    population: centrally reviewed hormone receptor-positive, HER2-positive early breast cancer of clinical stage I to III;
      463 screened and 375 randomised
    primary_ref: harbeck2017adapt
    pubs:
    - kind: primary
      ref: harbeck2017adapt
      role: primary
    - kind: survival
      ref: harbeck2023
      role: 5-year survival
    result: pathological complete response 41.0% with trastuzumab emtansine, 41.5% with trastuzumab emtansine plus endocrine
      therapy and 15.1% with trastuzumab plus endocrine therapy, P < 0.001. Five-year invasive disease-free survival was 88.9%,
      85.3% and 84.6% across the same arms, p=0.608
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 60
      group: Early triple-positive (HR+/HER2+) disease
      section: Early nonmetastatic disease
    status: reported
    subtype: HR+/HER2+
    topic: twelve weeks of a conjugate without chemotherapy, and whether adding endocrine therapy changes the response
    year: 2017
  wsg-planb:
    acronym: WSG-PlanB
    arms: Four cycles of epirubicin and cyclophosphamide followed by four cycles of docetaxel versus six cycles of docetaxel
      and cyclophosphamide.
    chapters:
    - BC-490
    - BC-510
    - BC-790
    - BC-850
    digest:
      methods: Phase 3 trial in HER2-negative early breast cancer, pT1 to pT4c, all node-positive and high-risk node-negative
        disease. After an amendment, hormone receptor-positive tumours had recurrence score testing and chemotherapy omission
        was recommended for recurrence score 11 or lower with pN0 to pN1 disease. Remaining patients were randomly assigned
        to four cycles of epirubicin and cyclophosphamide followed by four cycles of docetaxel, or six cycles of docetaxel
        and cyclophosphamide, every 3 weeks.
      results: Of 3198 registered patients, 348 with recurrence score 11 or lower omitted chemotherapy and 2449 formed the
        randomised intention-to-treat population. After 60 months median follow-up, 5-year disease-free survival was 89.6%
        versus 89.9% and overall survival was 94.5% versus 94.7%. Among endocrine-treated patients with recurrence score 11
        or lower, 5-year disease-free survival was 94% and overall survival was 99%.
    endpoint: Disease-free survival, tested for noninferiority with a margin of 4.4%.
    line: adjuvant
    modality: chemo,endocrine
    n: 2449
    nct: NCT01049425
    note: 3198 patients were enrolled, 2449 were randomised to the chemotherapy comparison, and the recurrence score 11 or
      lower chemotherapy omission cohort that the filing refers to was a nonrandomised 348-patient group.
    os: Five-year overall survival was 94.5% with epirubicin and cyclophosphamide followed by docetaxel versus 94.7% with
      six cycles of docetaxel and cyclophosphamide.
    phase: 3
    population: HER2-negative early breast cancer, pT1 to pT4c, node-positive or node-negative with at least one high-risk
      feature.
    primary_ref: nitz2019
    pubs:
    - kind: biomarker
      ref: nitz2017
      role: 5-year genomic-risk analysis
    - kind: other
      ref: nitz2019
      role: randomized chemotherapy comparison
    result: Five-year disease-free survival was 89.6% with epirubicin and cyclophosphamide followed by docetaxel versus 89.9%
      with six cycles of docetaxel and cyclophosphamide. The difference was within the prespecified noninferiority margin
      of 4.4%.
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 53
      group: Genomic assay–guided chemotherapy
      section: Early nonmetastatic disease
    status: reported
    subtype: HR+/HER2-,TNBC
    topic: recurrence score and chemotherapy omission, adjuvant-backbone
    year: 2019
  wsg-tpii:
    acronym: WSG TP-II
    arms: 12 weeks of trastuzumab and pertuzumab with endocrine therapy vs the same antibodies with weekly paclitaxel
    chapters:
    - BC-830
    - BC-840
    cited_by:
    - BC-830
    - BC-840
    digest:
      methods: The trial was a multicenter, randomized, open-label phase II trial. 207 patients with hormone receptor-positive,
        HER2-positive early breast cancer were randomly assigned 1:1 to 12 weeks of neoadjuvant trastuzumab and pertuzumab
        with endocrine therapy or with weekly paclitaxel. All patients received dual HER2 blockade in the adjuvant setting.
        Further standard chemotherapy was obligatory in patients without pathologic complete response and optional after pathologic
        complete response. This report is the final 5-year survival analysis.
      results: The pathologic complete response rate was 56.4% with paclitaxel and 23.7% with endocrine therapy. At 5 years,
        overall survival was 100% with endocrine therapy and 97.9% (95.0 to 100.0) with paclitaxel. Event-free survival-ductal
        carcinoma in situ at 5 years was 92.1% (86.6 to 97.9) with endocrine therapy and 94.8% (90.5 to 99.3) with paclitaxel.
        Five-year invasive disease-free survival was 97.7% (94.5 to 100.0) and 79.8% (55.6 to 100.0).
    endpoint: pathological complete response
    line: neoadjuvant
    modality: her2,endocrine,chemo
    n: 207
    nct: NCT03272477
    os: 5-year overall survival 100% with endocrine therapy and 97.9% (95.0-100) with paclitaxel
    phase: 2
    population: hormone receptor-positive, HER2-positive early breast cancer
    primary_ref: tpii2026
    pubs:
    - kind: primary
      ref: gluz2023
      role: primary
    - kind: update
      ref: tpii2026
      role: source of the tabulated result
    result: pathological complete response 23.7% with endocrine therapy against 56.4% with paclitaxel; 5-year invasive disease-free
      survival 97.7% against 79.8% (55.6-100)
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 60
      group: Early triple-positive (HR+/HER2+) disease
      section: Early nonmetastatic disease
    status: reported
    subtype: HR+/HER2+
    topic: neoadjuvant chemotherapy-free dual blockade with endocrine therapy against weekly paclitaxel
    year: 2026
  young-pearl-kcsg-br15-10:
    acronym: Young-PEARL / KCSG-BR15-10
    arms: Palbociclib plus exemestane with leuprolide ovarian suppression versus capecitabine.
    chapters:
    - BC-560
    - BC-870
    - BC-880
    - BC-890
    digest:
      methods: Multicentre open-label phase 2 trial at 14 institutions in South Korea. Premenopausal women aged 19 years or
        older with hormone receptor-positive, HER2-negative metastatic breast cancer that relapsed or progressed on tamoxifen
        were randomly assigned 1:1 to palbociclib 125 mg plus exemestane 25 mg with leuprolide, or capecitabine 1250 mg/m2
        twice daily. One previous line of chemotherapy for metastatic disease was allowed. Randomisation was stratified by
        previous chemotherapy and visceral metastasis. Analysis was modified intention to treat.
      results: 184 patients were randomly assigned, 92 to each group, and 178 entered the modified intention-to-treat analysis.
        At 17 months median follow-up, median progression-free survival was 20.1 months versus 14.4 months, hazard ratio 0.659,
        one-sided p=0.0235. Grade 3 or worse neutropenia occurred in 75% versus 16%. Treatment-related serious adverse events
        occurred in 2% versus 17%. No treatment-related deaths occurred.
    endpoint: Progression-free survival.
    line: 2L
    modality: cdk4-6,endocrine,chemo
    n: 184
    nct: NCT02592746
    note: About half of patients in each group were treatment naive for metastatic disease, so the trial straddles first and
      second line despite all patients having prior tamoxifen.
    os: In the 2025 analysis, median overall survival was 54.8 months with palbociclib plus endocrine therapy versus 57.8
      months with capecitabine, hazard ratio 1.02, p=0.92. There was no overall survival difference.
    phase: 2
    population: Premenopausal women aged 19 years or older with hormone receptor-positive, HER2-negative metastatic breast
      cancer progressing on tamoxifen, performance status 0 to 2.
    primary_ref: park2019a
    pubs:
    - kind: primary
      ref: park2019a
      role: primary
    - kind: survival
      ref: ahn2025
      role: os
    result: Median progression-free survival was 20.1 months with palbociclib plus exemestane and ovarian suppression versus
      14.4 months with capecitabine, hazard ratio 0.659, one-sided p=0.0235.
    reviewed: '2026-09-14'
    setting: metastatic
    source:
    - ch: 69
      group: Timing / comparison / sequencing
      section: Metastatic disease
    status: reported
    subtype: HR+/HER2-
    topic: palbociclib plus exemestane and OFS versus capecitabine
    year: 2019
  z0011:
    acronym: ACOSOG Z0011
    chapters:
    - BC-010
    - BC-370
    - BC-410
    - BC-520
    cited_by:
    - BC-410
    digest:
      methods: Phase 3 randomised noninferiority trial enrolling patients from May 1999 to December 2004 at 115 sites. Eligible
        women had clinical T1 or T2 invasive breast cancer, no palpable axillary adenopathy, and 1 or 2 sentinel lymph nodes
        with metastases. All patients had planned lumpectomy, tangential whole-breast irradiation and adjuvant systemic therapy,
        with third-field radiation prohibited. Patients were randomised to sentinel lymph node dissection alone or axillary
        lymph node dissection. The primary outcome was overall survival, noninferiority margin 1.3.
      results: 891 women were randomised, 446 to sentinel lymph node dissection alone and 445 to axillary dissection. At a
        median follow-up of 9.3 years, 10-year overall survival was 86.3% with sentinel dissection alone and 83.6% with axillary
        dissection (hazard ratio 0.85, noninferiority P = .02). 10-year disease-free survival was 80.2% and 78.2% (hazard
        ratio 0.85, P = .32). Between years 5 and 10, 1 regional recurrence occurred with sentinel dissection alone and none
        with axillary dissection.
    line: adjuvant
    modality: surgery
    nct: NCT00003855
    phase: 3
    pubs:
    - kind: update
      ref: giuliano2017
      role: 10-year
    setting: early
    status: reported
    subtype: all
    tabulated: false
    topic: axillary dissection omission
  z1031:
    acronym: ACOSOG Z1031
    arms: neoadjuvant exemestane vs letrozole vs anastrozole
    chapters:
    - BC-810
    cited_by:
    - BC-810
    digest:
      methods: Z1031 was a randomized phase II neoadjuvant trial designed to select agents for phase III study. 377 postmenopausal
        women with clinical stage II to III estrogen receptor-positive breast cancer, Allred score 6 to 8, were randomly assigned
        to neoadjuvant exemestane, letrozole, or anastrozole. The primary end point was clinical response. Secondary end points
        were breast-conserving surgery, change in Ki67, the Preoperative Endocrine Prognostic Index, and PAM50-based intrinsic
        subtype.
      results: Letrozole and anastrozole were selected for further investigation on the basis of clinical response rates.
        No other differences in surgical outcome, PEPI score, or Ki67 suppression were detected. The breast-conserving surgery
        rate among patients presenting as mastectomy-only candidates was 51%. PAM50 identified aromatase inhibitor-unresponsive
        nonluminal subtypes in 3.3%. Clinical response and surgical outcomes were similar in luminal A and luminal B tumors.
        A PEPI of 0 was more frequent in luminal A tumors (27.1% v 10.7%; P = .004).
    endpoint: clinical response
    line: neoadjuvant
    modality: endocrine
    n: 377
    os: not reported
    phase: 2
    population: postmenopausal, oestrogen receptor-rich (Allred 6-8), clinical stage II-III
    primary_ref: ellis2011
    pubs:
    - kind: subgroup
      ref: ellis2011
      role: z1031a
    - kind: subgroup
      ref: ellis2017
      role: z1031b
    result: letrozole and anastrozole taken forward on clinical response; no difference between agents in Ki67 suppression
      or PEPI score; breast-conserving surgery in 51% of patients presenting as mastectomy-only candidates
    reviewed: '2026-09-14'
    setting: early
    source:
    - ch: 56
      group: Neoadjuvant endocrine therapy
      section: Early nonmetastatic disease
    status: reported
    subtype: HR+/HER2-
    topic: neoadjuvant aromatase inhibitor comparison, Ki67 and PEPI as endpoints, neoadjuvant-endocrine
    year: 2011
  z1071:
    acronym: ACOSOG Z1071
    chapters:
    - BC-410
    cited_by:
    - BC-410
    claim: false-negative rate 12.6% with two or more sentinel nodes removed
    digest:
      methods: The trial enrolled 756 women at 136 institutions from July 2009 to June 2011 with clinical T0 to T4, N1 to
        N2, M0 breast cancer treated with neoadjuvant chemotherapy. After chemotherapy each patient underwent both sentinel
        lymph node surgery and axillary lymph node dissection. Mapping with both blue dye and a radiolabeled colloid was encouraged.
        The primary end point was the false-negative rate of sentinel node surgery in women presenting with biopsy-proven
        cN1 disease.
      results: Of 663 evaluable cN1 patients, 649 underwent both sentinel node surgery and axillary dissection. No sentinel
