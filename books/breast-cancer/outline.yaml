schema: 2
book:
  id: bcbook
  title: Breast Cancer
  subtitle: Biology, heterogeneity, and care
  audience: Hematology and oncology fellows and practicing medical oncologists
  status: outline
  id_policy:
    parts: PT-##
    chapters: BC-###, gapped by 10, minted in creation order, not reading order
    sections: BS-####, gapped by 10, minted globally, never scoped to a parent
    appendices: APP-A through APP-Z
    references: 'bare slug key, rendered as anchor #r-<key>'
    trials: 'bare acronym key, rendered as anchor #t-<key>'
tags:
