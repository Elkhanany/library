schema: 1
_note: 'Figures the writer constructed rather than reported. numcheck.py requires every number in
  prose to occur in the registry record of a trial the chapter names or in a reference it cites, and
  most of what it reports is a real defect. A teaching paragraph is the exception. "Out of 100 women,
  over 7 years" is a sentence shape being recommended to a clinician, not a result, and no paper will
  ever hold it.

  '
_why: 'Declaring them is what keeps the check worth running. A report that stands at eighty-four
  every run teaches its reader to ignore it, and the next genuinely unsourced figure is lost in the
  noise. With these named, the report is empty, and a new entry in it is a new defect.

  '
_rule: 'A figure belongs here only when no source could carry it: an arithmetic example, a threshold
  named as a convention rather than reported as a result, or a number computed by the writer from
  figures cited elsewhere. A figure that HAS a source belongs in the prose with its citation, even
  when that citation already sits in the paragraph above. Repeating the mark is cheap and makes the
  paragraph stand on its own, which is what the rule was for.

  '
constructed:
- chapter: BC-080
  figures: ['1.66']
  because: The eligibility convention named as an example of what calibration buys. The threshold is
    reported properly, with its source and its two competing model estimates, later in the same chapter.
- chapter: BC-290
  figures: ['90']
  because: Arithmetic about where a staining category boundary falls. The paragraph is comparing the
    distance between 0 and 2 per cent with the distance between 2 and 90, to show that one crosses a
    boundary and the other does not.
- chapter: BC-670
  figures: ['100']
  because: A sentence shape recommended to a clinician. Out of 100 women, over 7 years, is the
    denominator and horizon a patient can hold, and the paragraph is about the form rather than about
    any particular trial.
- chapter: BC-700
  figures: ['30']
  because: An illustrative service standard. A programme placed where abnormal results already resolve
    inside a month has little available benefit to produce, and the number is there to make that
    concrete.
- chapter: BC-720
  figures: ['75', '85', '30', '28']
  because: Two constructed examples. A guideline derived from trials that excluded patients over 75
    does not govern an 85-year-old, and a 30-day indicator produces a spike of treatment starts at day
    28. Both are arithmetic about how a rule behaves, not measurements of anything.
- chapter: BC-740
  figures: ['2.03']
  because: Computed by the writer from IMPORT-LOW's own stated margin and control event rate, to put
    a non-inferiority allowance into ratio form. The inputs are cited in the paragraph; the ratio is
    the arithmetic this chapter is teaching.
