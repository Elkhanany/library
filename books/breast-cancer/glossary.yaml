schema: 1
_note: Terms for appendix APP-B. A term is keyed once and linked from any chapter with [[term:key]].
terms:
  her2-low: {term: "HER2-low", definition: "IHC 1+, or IHC 2+ without amplification. A category defined by assay thresholds rather than by a distinct biology.", see: [BC-110, BC-590]}
  rcb: {term: "Residual cancer burden", definition: "A continuous measure of residual disease after neoadjuvant therapy.", see: [BC-370, BC-540]}
  hrd: {term: "Homologous recombination deficiency", definition: "A functional phenotype of impaired double-strand break repair, measured by scars, signatures, or functional assays.", see: [BC-180, BC-380]}
  mrd: {term: "Molecular residual disease", definition: "Detectable tumor-derived material after definitive therapy, in the absence of radiographic disease.", see: [BC-330, BC-390]}
