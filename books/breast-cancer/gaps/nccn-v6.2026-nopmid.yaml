schema: 1
guideline: NCCN Clinical Practice Guidelines in Oncology, Breast Cancer, version 6.2026
_note: How each of the reference rows that carry no PubMed identifier is carried by the book. guidelinediff.py --resolved
  reads this file, checks every key against references.yaml and the chapters, and reports the rows. A row marked
  not-citable has no PubMed record, so under the rule that a chapter may not cite an unverified reference it cannot
  be cited as it stands.
bases:
  same-paper: the row is a journal article that the parsed list carried without an identifier; the book cites that
    article
  published-version: the row is a meeting abstract; the book cites the full publication of the same analysis
  same-trial: the row is a meeting abstract never published in full; the book names the trial and cites its published
    reports
  underlying-trial: the row is a registry record; the book cites the trial it registers
  edition: the row is a staging manual; the book names the edition and cites the published description of it
  not-citable: the row has no PubMed record, and the book cannot cite it as a verified reference
