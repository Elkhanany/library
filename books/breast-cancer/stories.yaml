schema: 1
_note: 'Chapter Stories. The registry says what each trial showed and the evidence tables say what
  else is in the same cell. Neither says what we were trying to find out. A story is that layer: one
  position in the treatment landscape, and under it an ordered list of clinical questions, each
  written in five moves and naming the trials that carry it.

  '
_shape: 'The hierarchy is deliberately shallow. Setting, then subtype, then when in the course. The
  depth belongs in the question and not in the tree. A drug class is not a question: PALOMA-3, SERENA-4,
  PADA-1 and SONIA all carry the same two modalities and ask whether to add, to substitute, to select
  and to sequence. So the deepest level is always something a clinic actually wants to know.

  '
_moves: 'rationale (why the idea was worth testing) -> experiment (what was done) -> finding (what
  came back) -> limitation (what the design cannot tell you) -> next (the question the finding leaves
  open). All five are required. A story that cannot fill limitation is a story that has not been
  read properly.

  '
_id_policy: 'ST-### for a position, SQ-#### for a question. Both permanent and globally minted, never
  renumbered. A question moves between stories by editing its story, not by changing its id. A trial
  is named by registry key and appears under every question it speaks to, which is the point.

  '
_no_numbers: 'A story carries no figures. The result belongs to the registry and is printed by the
  evidence table, so a story and a table can never disagree about a number.

  '
stories:
  ST-010:
    setting: early
    subtype: HR+/HER2-
    stage: adjuvant
    title: Choosing the intensity and the duration of endocrine treatment
    chapters:
    - BC-790
    - BC-800
    premise: Almost everyone in this cell is cured by local treatment and endocrine therapy, and the
      recurrences arrive over two decades rather than two years. So the adjuvant questions are not
      whether to treat but how hard, for how long, and for whom the extra years or the extra drug
      are worth their cost.
    questions:
    - id: SQ-0010
      ask: How completely does oestrogen have to be removed?
      rationale: Tamoxifen blocks the receptor; an aromatase inhibitor removes the ligand; ovarian
        suppression removes the source. Each step is a deeper intervention on the same axis, and
        each was expected to buy more disease control at more cost.
      experiment: Direct comparisons of an aromatase inhibitor against tamoxifen, and of ovarian
        suppression added to either, in premenopausal and postmenopausal populations separately.
      finding: Deeper suppression lowers recurrence, and the absolute gain tracks baseline risk
        rather than being uniform across the cell.
      limitation: None of these trials randomised the decision that a clinic actually makes, which
        is whether this particular patient's risk justifies the menopausal symptoms and the bone
        loss. Subgroup gradients are not the same as a randomised selection rule.
      next: If the benefit tracks risk, can risk be measured well enough to allocate the intensity
        rather than infer it after the fact?
      trials:
      - atac
      - big1-98
      - soft
      - soft-text
      - astrra
      - abcsg12
    - id: SQ-0020
      ask: How long should endocrine treatment continue?
      rationale: Recurrence in this cell continues at a roughly constant rate for at least twenty
        years, so treatment that stops at five years stops while the hazard is still running.
      experiment: Randomised extension beyond five years, in each of the sequences a clinic actually
        uses. Tamoxifen to ten years, an aromatase inhibitor after tamoxifen, an aromatase inhibitor
        after an aromatase inhibitor. Then, against the same question from the other side, trials of
        shorter or intermittent extension.
      finding: Extension lowers recurrence, the effect is smaller than the first five years bought,
        and several extension trials found that more was not better than less.
      limitation: The extension trials enrolled patients who had already tolerated five years, which
        is a selected population, and they differ in the drug taken first, so the results are not
        interchangeable across sequences.
      next: Since the benefit of extension is real but small, can the patients who get it be
        identified before ten years of treatment are prescribed to everyone?
      trials:
      - atlas
      - attom
      - ma17
      - ma17r
      - nsabp-b42
      - gim4
      - ideal
      - data
      - abcsg16
      - sole
    - id: SQ-0030
      ask: Does adding a CDK4/6 inhibitor to adjuvant endocrine therapy lower recurrence?
      rationale: CDK4/6 inhibition roughly doubles progression-free survival in metastatic hormone
        receptor-positive disease, and the cells that seed a late recurrence are the same lineage.
        If the drug works on macroscopic disease it should work on residual disease.
      experiment: Four trials added a CDK4/6 inhibitor to adjuvant endocrine therapy, differing in
        the drug, the duration, and how high the enrolled risk was.
      finding: Two showed a durable improvement in invasive disease-free survival and two did not,
        and the split follows the specific drug, schedule and risk population rather than the class.
      limitation: These are not head-to-head trials. The populations, the treatment durations and
        the endpoints differ enough that the divergence cannot be attributed to the molecule alone,
        and overall survival is immature.
      next: If escalation only pays at high risk, what is the risk threshold, and does it have to be
        measured before treatment or can it be read from the response to treatment?
      trials:
      - monarche
      - natalee
      - pallas
      - penelope-b
    - id: SQ-0040
      ask: Can the decision to give chemotherapy be made on biology rather than on anatomy?
      rationale: Node count and tumour size measure how long a cancer has been growing, not how
        much it depends on oestrogen. A genomic assay measures the second, which is what predicts
        whether cytotoxic treatment adds anything to endocrine treatment.
      experiment: Randomised trials that assigned chemotherapy by a genomic score rather than by
        stage, in node-negative and then node-positive disease, with survival as the endpoint.
      finding: A large fraction of this cell can omit chemotherapy without losing disease control,
        and the exceptions cluster by age and menopausal status rather than by score alone.
      limitation: The assays were validated on populations treated with the endocrine therapy of
        their era, and the age effect is confounded with ovarian function, so the benefit attributed
        to chemotherapy may partly be the benefit of chemotherapy-induced menopause.
      next: If a score taken once before treatment can allocate chemotherapy, can the tumour's own
        response to a short course of endocrine therapy allocate it better?
      trials:
      - tailorx
      - rxponder
      - mindact
    - id: SQ-0050
      ask: Can the response to treatment be used to allocate treatment, rather than the baseline
        alone?
      rationale: A baseline assay predicts; a short course of endocrine therapy tests. A tumour
        whose proliferation collapses under two weeks of an aromatase inhibitor has demonstrated
        the dependence the assay was trying to infer.
      experiment: Response-adapted designs that give a brief endocrine exposure, measure the change
        in proliferation, and route patients to chemotherapy or to endocrine treatment on what they
        see.
      finding: Response separates the population, and the endocrine-responsive group does well on
        endocrine treatment alone.
      limitation: A dynamic marker predicts outcome in a cohort that has already been selected on
        it, so the comparison is against a historical expectation rather than against the same
        patients treated the other way.
      next: Does adding CDK4/6 inhibition to the induction course change who looks responsive, and
        is that change real or an artefact of a drug that suppresses proliferation in everyone?
      trials:
      - wsg-adapt-hr-her2
      - adaptcycle
