schema: 1
_note: 'Chapter Stories. The registry says what each trial showed and the evidence tables say what
  else is in the same cell. Neither says what we were trying to find out. A story is that layer: one
  position in the treatment landscape, and under it an ordered list of clinical questions, each
  written in five moves and naming the trials that carry it.

  '
_shape: 'The hierarchy is deliberately shallow. Setting, then subtype, then when in the course. The
  depth belongs in the question and not in the tree. A drug class is not a question: PALOMA-3, SERENA-4,
  PADA-1 and SONIA all carry the same two modalities and ask whether to add, to substitute, to select
  and to sequence. So the deepest level is always something a clinic actually wants to know.

  '
_moves: 'rationale (why the idea was worth testing) -> experiment (what was done) -> finding (what
  came back) -> limitation (what the design cannot tell you) -> next (the question the finding leaves
  open). All five are required. A story that cannot fill limitation is a story that has not been
  read properly.

  '
_id_policy: 'ST-### for a position, SQ-#### for a question. Both permanent and globally minted, never
  renumbered. A question moves between stories by editing its story, not by changing its id. A trial
  is named by registry key and appears under every question it speaks to, which is the point.

  '
_no_numbers: 'A story carries no figures. The result belongs to the registry and is printed by the
  evidence table, so a story and a table can never disagree about a number.

  '
stories:
  ST-020:
    setting: early
    subtype: HR+/HER2-
    stage: neoadjuvant
    title: The preoperative window as a measurement and as a treatment
    chapters:
    - BC-810
    premise: Preoperative treatment in this cell serves as an experiment at least as much as a treatment. Pathological
      complete response is rare here, so nearly every endpoint read before surgery is a proliferation measurement
      standing in for an outcome. Almost every question at this position turns on whether that substitution holds,
      and on whether a tumour's early response can be trusted to decide what happens after the operation.
    questions:
    - id: SQ-0060
      ask: How far can proliferation be suppressed before surgery, and does the proliferation that survives treatment
        predict recurrence?
      rationale: Oestrogen drives the cell cycle in this cell, so the fraction of cells still dividing after a
        short exposure is the most direct read-out of whether the drug is working. A pretreatment biopsy says
        how fast the tumour was growing. A biopsy taken on treatment says how much of that growth oestrogen was
        responsible for. CDK4/6 sits immediately downstream of the receptor, so a tumour still proliferating on
        an aromatase inhibitor is the obvious place to put a cell-cycle drug.
      experiment: Paired biopsies taken before and during preoperative treatment, scored centrally for Ki67. The
        largest trial randomised a short perioperative course of an aromatase inhibitor against no perioperative
        treatment, with time to recurrence as its primary endpoint and the paired Ki67 only as a secondary objective.
        Smaller trials added a CDK4/6 inhibitor to an aromatase inhibitor, either as a randomised arm or as a
        within-patient step after an endocrine-only run-in, and one ongoing trial profiles serial biopsies at
        single-cell resolution.
      finding: Endocrine therapy alone leaves a proliferating fraction in most tumours. How large that fraction
        is after two weeks separates patients across a wide span of recurrence risk, while the two weeks of treatment
        themselves changed no outcome. The three aromatase inhibitors are indistinguishable on this read-out,
        so it reports the class and not the molecule. Adding a CDK4/6 inhibitor drives most tumours below the
        arrest threshold, far more of them than an aromatase inhibitor does alone. The arrest reverses once the
        drug is withdrawn.
      limitation: Complete cell cycle arrest is an assay threshold, not a biological state. The cut point was
        calibrated on tumours given endocrine therapy alone, so it was built to grade endocrine dependence. A
        drug that stops the cycle whether or not the tumour depends on oestrogen crosses that line in nearly everyone,
        which is precisely what destroys its power to select. The thresholds in use are not even the same number
        from trial to trial, and local and central scoring of one specimen disagree often enough to move a patient
        across one. The within-patient designs also confound the added drug with longer time on treatment, because
        the second biopsy is both on more drug and later.
      next: If proliferation can be shut down almost completely, does that deeper suppression produce more of
        the tumour response a surgeon and a patient can see?
      trials:
      - poetic
      - z1031
      - neopalana
      - pallet
      - neomonarch
      - neoletrib
    - id: SQ-0070
      ask: Does suppressing proliferation more deeply produce a better tumour response at surgery?
      rationale: Ki67 was adopted before surgery because it is quick, cheap and readable in a core biopsy. The
        whole case for using it rests on the assumption that it stands in for something the patient experiences.
        If a drug that suppresses proliferation far more does not shrink tumours more or leave less disease behind,
        then the surrogate and the outcome have come apart. The surrogate is then the thing to distrust.
      experiment: Trials that reported a proliferation endpoint and a clinical or pathological endpoint out of
        the same randomisation. One added a CDK4/6 inhibitor to letrozole and reported the change in Ki67 beside
        the clinical response rate. Others carried the combination through a full preoperative course against
        chemotherapy and reported residual cancer burden, pathological complete response and a composite prognostic
        index scored on the surgical specimen. One asked directly whether early proliferation suppression converted
        into that index.
      finding: The proliferation endpoints separated the arms decisively. The clinical and pathological endpoints
        did not follow. Where both came out of one randomisation, a large difference in Ki67 sat beside a clinical
        response rate that was no different. In the comparison against chemotherapy the two arms changed places
        depending on which endpoint was read, chemotherapy ahead on residual disease and the combination ahead
        on the composite index. Where early suppression was tested directly as a predictor of that index, it did
        not deliver one.
      limitation: Pathological complete response sits near its floor in this cell, so a trial powered on it has
        almost no room to move and a null result there means very little. The composite index is not independent
        of the surrogate, because proliferation is one of its own components, so a drug that suppresses proliferation
        improves the index partly by construction. The trial that tested the translation most directly has conference
        and registry material behind it and no peer-reviewed report, so its negative result cannot be weighed
        as a published trial result. The immune and stromal profiling is single-arm, so what it records on treatment
        cannot be separated from what would have happened over the same interval anyway.
      next: If pathological response cannot carry the argument in this cell, can the response measured during
        treatment still be used to decide who needs chemotherapy at all?
      trials:
      - pallet
      - neomonarch
      - feline
      - neopal
      - coralleen
      - neorhea
    - id: SQ-0080
      ask: Can the tumour's response to preoperative treatment be used to withhold chemotherapy?
      rationale: Most of this cell gains little from cytotoxic treatment. The difficulty is telling who. A baseline
        genomic score infers endocrine dependence from the untreated tumour, while a short preoperative course
        tests it. A tumour whose proliferation collapses under an aromatase inhibitor has demonstrated the dependence
        the score was trying to predict.
      experiment: 'Response-adapted designs: a short endocrine run-in, a central Ki67 read against a prespecified
        threshold, and a route to chemotherapy for the tumours that stay above it. One programme combined that
        window with a genomic score and tested whether the endocrine-only group was noninferior. Others dropped
        chemotherapy altogether in favour of a CDK4/6 inhibitor and compared what was left at surgery, by molecular
        risk score or by cell-cycle arrest.'
      finding: Response does separate the population, and in the direction the biology predicts. Patients routed
        to endocrine treatment alone on a low genomic score and a responding window did as well as the low-risk
        control group. Only a minority of tumours reach the endocrine-sensitive state these designs define, whichever
        endocrine drug is used to produce it. The trials that replaced chemotherapy with a CDK4/6 inhibitor reached
        the same molecular and proliferative state at surgery as chemotherapy did, at a lower cost in serious
        adverse events.
      limitation: In the response-guided programme the groups were allocated by score and by response rather than
        by randomisation, so the comparison is between two differently selected populations and not between two
        ways of treating the same patient. Its window is preoperative, but the therapy decision it drives is adjuvant,
        so it does not test preoperative treatment at all. In the chemotherapy-replacement trials the arms produced
        similar estimates. Similar estimates are not noninferiority, and none of those trials carried a noninferiority
        margin or the size to test one. The trial designed to detect a doubling of cell-cycle arrest over chemotherapy
        did not find it, and it randomised only the tumours whose proliferation stayed up after an endocrine run-in,
        a deliberately endocrine-resistant group and a small fraction of those registered. The trial built to
        settle the question on distant control has published a design paper and nothing else, so nothing on its
        record is a result.
      next: If the endocrine backbone sets the ceiling on how many tumours respond, would a better receptor-directed
        drug raise it?
      trials:
      - alternate
      - wsg-adapt-hr-her2
      - adaptcycle
      - neopal
      - coralleen
      - neolbc
      - ribolaris
    - id: SQ-0090
      ask: Does a better receptor-directed drug improve the tumour's early biological response more than an aromatase
        inhibitor?
      rationale: The first preoperative comparisons put an aromatase inhibitor against tamoxifen and found more
        tumour response with the aromatase inhibitor, in postmenopausal women and, with ovarian suppression, in
        premenopausal women. So the receptor axis had headroom before surgery. Changing between the aromatase
        inhibitors does not exploit it, because they behave alike. Degrading the receptor rather than starving
        it should shut down more signalling, and it should keep working where the receptor is mutated.
      experiment: Short preoperative windows of two or four weeks, each ending in a central Ki67 score. One randomised
        an oral receptor degrader against anastrozole before putting both groups on the same combination. One
        randomised two doses of a second oral degrader against letrozole. One was a single arm read against an
        arrest threshold. Against these sits a full-length preoperative phase III trial of an injectable degrader,
        given alone and added to an aromatase inhibitor, with a prognostic composite scored at surgery.
      finding: One oral degrader suppressed proliferation more than anastrozole over two weeks. The other matched
        letrozole without beating it. The single-arm study arrested the cycle in a minority of the tumours it
        treated. Over a full preoperative course the injectable degrader did not improve on an aromatase inhibitor
        on the trial's own prognostic endpoint, given alone or added to it.
      limitation: A window study is small because a fortnight of treatment is all its design asks for, and its
        endpoint is a ratio of two Ki67 scores. That ratio measures what the drug does to proliferation. It has
        never been shown to buy a lower recurrence rate, so a better ratio is a better ratio and nothing more.
        The comparisons are also not on one footing. The older agent trials scored tumour response by callipers
        and by ultrasound, and the two methods gave different response rates inside the same trial. One of them
        permitted concurrent chemotherapy, which contaminates the endocrine comparison. One window study stopped
        early for slow accrual, and in another the primary comparison rests on the subset with paired central
        scores rather than on everyone randomised. The phase III trial enrolled a broader population and read
        a different endpoint entirely, so it does not settle the window question and the window results do not
        overturn it.
      next: If the ceiling is not set by which receptor drug is given, is it set by the tumour's histology instead?
      trials:
      - p024
      - impact
      - proact
      - stage
      - coopera
      - ameera-4
      - elipse
      - alternate
    - id: SQ-0100
      ask: Does invasive lobular carcinoma need its own preoperative endocrine experiment?
      rationale: Lobular tumours lose E-cadherin and infiltrate in single files rather than forming a discrete
        mass. They are almost always receptor-positive and low grade, and they respond poorly to cytotoxic treatment.
        Both halves of a neoadjuvant argument therefore change. Endocrine therapy becomes the plausible option
        rather than one of two, and a tumour with no discrete mass cannot be measured by callipers or by imaging
        the way a ductal tumour can.
      experiment: A randomised short preoperative exposure to tamoxifen, to an aromatase inhibitor or to fulvestrant
        in lobular disease, read out as target engagement rather than as tumour response. Separately, a randomised
        preoperative trial of adding a CDK4/6 inhibitor to endocrine therapy that enrolled receptor-positive disease
        of any histology, so that lobular and ductal tumours could be compared inside one trial.
      finding: Neither has reported the comparison it was built to make. The short-exposure study has conference
        and registry material only, and nothing on its record may be read as a published outcome. The only publication
        on the randomised trial's record is its axillary analysis, which found that clearing the axilla added
        nothing over sentinel node biopsy in node-positive disease after preoperative endocrine therapy.
      limitation: The short-exposure study is a phase 0 design and it measures whether a drug reaches and engages
        its target. It cannot rank endocrine agents for efficacy, and reading it that way is the error its design
        invites. The randomised trial is named for lobular cancer but enrolled any histology, and lobular tumours
        were a minority of the patients in its published analysis, so it is a comparison inside a mixed population
        rather than a lobular trial. The endpoints of that publication are ones the paper itself calls prespecified
        exploratory, so they say nothing about the trial's systemic question. No other trial at this position
        enrolled a lobular-only population, so the histology argument rests on these two and on subgroups borrowed
        from elsewhere.
      next: If neither escalating the receptor drug nor separating the histology has raised the response, can
        a different mechanism raise it?
      trials:
      - tbcrc-037
      - pelops
    - id: SQ-0110
      ask: Can checkpoint blockade or an antibody-drug conjugate raise response where endocrine escalation has
        not?
      rationale: Luminal tumours are usually immunologically quiet. The high-grade, receptor-low end of this cell
        is not, and an adaptive platform trial had already reported a pembrolizumab signal across HER2-negative
        disease rather than in triple-negative disease alone. Separately, most receptor-positive tumours express
        HER2 below the amplification threshold, which an antibody-drug conjugate can use as an address rather
        than as a driver.
      experiment: Two phase III trials added a checkpoint inhibitor to anthracycline and taxane-based preoperative
        chemotherapy in luminal disease, with pathological complete response as a primary endpoint and event-free
        survival to follow. Alongside them sit a randomised trial of preoperative radiation dose as an immune
        primer before checkpoint blockade, and a preoperative trial of an antibody-drug conjugate given with and
        without an aromatase inhibitor in receptor-positive, HER2-low disease rather than HER2-amplified disease.
      finding: Both phase III trials raised pathological complete response. In both, the increase concentrated
        where PD-L1 was expressed. The event-free survival that decides whether the increase matters is immature
        in both. The radiation-priming trial and the antibody-drug conjugate trial have conference and registry
        material only, so neither yet has a result to read.
      limitation: Pathological complete response is not the surrogate here that it is in triple-negative disease,
        so a gain in it does not convert into an expectation about recurrence. One of the two phase III trials
        selected explicitly on grade, on low oestrogen receptor expression and on PD-L1, which is the end of this
        cell that behaves least like the rest of it, so its result does not generalise to the ordinary luminal
        tumour. The PD-L1 result there is scored with a single antibody clone against a single cut-off, and a
        group defined by a marker is not a randomised comparison. The single-arm profiling study at this position
        found that a CDK4/6 inhibitor on an endocrine backbone diminished adaptive anti-tumour immunity, which
        is a reason to doubt that the two escalation strategies combine, and a single-arm observation is not a
        test of that. The radiation-priming trial holds its receptor-positive and triple-negative cohorts separately,
        so nothing there may be read as a pooled population.
      next: Does a gain in pathological response, in a cell where pathological response is rare, convert into
        fewer distant recurrences, and is any trial at this position designed to answer that?
      trials:
      - ispy2-pembro
      - keynote756
      - checkmate7fl
      - neorhea
      - p-rad
      - talent
  ST-010:
    setting: early
    subtype: HR+/HER2-
    stage: adjuvant
    title: Choosing the intensity and the duration of endocrine treatment
    chapters:
    - BC-790
    - BC-800
    premise: Almost everyone in this cell is cured by local treatment and endocrine therapy, and the recurrences
      arrive over two decades rather than two years. So the adjuvant questions are not whether to treat but how
      hard, for how long, and for whom the extra years or the extra drug are worth their cost.
    questions:
    - id: SQ-0010
      ask: How completely does oestrogen have to be removed?
      rationale: Tamoxifen blocks the receptor; an aromatase inhibitor removes the ligand; ovarian suppression
        removes the source. Each step is a deeper intervention on the same axis, and each was expected to buy
        more disease control at more cost.
      experiment: Direct comparisons of an aromatase inhibitor against tamoxifen, and of ovarian suppression added
        to either, in premenopausal and postmenopausal populations separately.
      finding: Deeper suppression lowers recurrence, and the absolute gain tracks baseline risk rather than being
        uniform across the cell.
      limitation: None of these trials randomised the decision that a clinic actually makes, which is whether
        this particular patient's risk justifies the menopausal symptoms and the bone loss. Subgroup gradients
        are not the same as a randomised selection rule.
      next: If the benefit tracks risk, can risk be measured well enough to allocate the intensity rather than
        infer it after the fact?
      trials:
      - atac
      - big1-98
      - soft
      - soft-text
      - astrra
      - abcsg12
    - id: SQ-0020
      ask: How long should endocrine treatment continue?
      rationale: Recurrence in this cell continues at a roughly constant rate for at least twenty years, so treatment
        that stops at five years stops while the hazard is still running.
      experiment: Randomised extension beyond five years, in each of the sequences a clinic actually uses. Tamoxifen
        to ten years, an aromatase inhibitor after tamoxifen, an aromatase inhibitor after an aromatase inhibitor.
        Then, against the same question from the other side, trials of shorter or intermittent extension.
      finding: Extension lowers recurrence, the effect is smaller than the first five years bought, and several
        extension trials found that more was not better than less.
      limitation: The extension trials enrolled patients who had already tolerated five years, which is a selected
        population, and they differ in the drug taken first, so the results are not interchangeable across sequences.
      next: Since the benefit of extension is real but small, can the patients who get it be identified before
        ten years of treatment are prescribed to everyone?
      trials:
      - atlas
      - attom
      - ma17
      - ma17r
      - nsabp-b42
      - gim4
      - ideal
      - data
      - abcsg16
      - sole
    - id: SQ-0030
      ask: Does adding a CDK4/6 inhibitor to adjuvant endocrine therapy lower recurrence?
      rationale: CDK4/6 inhibition roughly doubles progression-free survival in metastatic hormone receptor-positive
        disease, and the cells that seed a late recurrence are the same lineage. If the drug works on macroscopic
        disease it should work on residual disease.
      experiment: Four trials added a CDK4/6 inhibitor to adjuvant endocrine therapy, differing in the drug, the
        duration, and how high the enrolled risk was.
      finding: Two showed a durable improvement in invasive disease-free survival and two did not, and the split
        follows the specific drug, schedule and risk population rather than the class.
      limitation: These are not head-to-head trials. The populations, the treatment durations and the endpoints
        differ enough that the divergence cannot be attributed to the molecule alone, and overall survival is
        immature.
      next: If escalation only pays at high risk, what is the risk threshold, and does it have to be measured
        before treatment or can it be read from the response to treatment?
      trials:
      - monarche
      - natalee
      - pallas
      - penelope-b
    - id: SQ-0040
      ask: Can the decision to give chemotherapy be made on biology rather than on anatomy?
      rationale: Node count and tumour size measure how long a cancer has been growing, not how much it depends
        on oestrogen. A genomic assay measures the second, which is what predicts whether cytotoxic treatment
        adds anything to endocrine treatment.
      experiment: Randomised trials that assigned chemotherapy by a genomic score rather than by stage, in node-negative
        and then node-positive disease, with survival as the endpoint.
      finding: A large fraction of this cell can omit chemotherapy without losing disease control, and the exceptions
        cluster by age and menopausal status rather than by score alone.
      limitation: The assays were validated on populations treated with the endocrine therapy of their era, and
        the age effect is confounded with ovarian function, so the benefit attributed to chemotherapy may partly
        be the benefit of chemotherapy-induced menopause.
      next: If a score taken once before treatment can allocate chemotherapy, can the tumour's own response to
        a short course of endocrine therapy allocate it better?
      trials:
      - tailorx
      - rxponder
      - mindact
    - id: SQ-0050
      ask: Can the response to treatment be used to allocate treatment, rather than the baseline alone?
      rationale: A baseline assay predicts; a short course of endocrine therapy tests. A tumour whose proliferation
        collapses under two weeks of an aromatase inhibitor has demonstrated the dependence the assay was trying
        to infer.
      experiment: Response-adapted designs that give a brief endocrine exposure, measure the change in proliferation,
        and route patients to chemotherapy or to endocrine treatment on what they see.
      finding: Response separates the population, and the endocrine-responsive group does well on endocrine treatment
        alone.
      limitation: A dynamic marker predicts outcome in a cohort that has already been selected on it, so the comparison
        is against a historical expectation rather than against the same patients treated the other way.
      next: Does adding CDK4/6 inhibition to the induction course change who looks responsive, and is that change
        real or an artefact of a drug that suppresses proliferation in everyone?
      trials:
      - wsg-adapt-hr-her2
      - adaptcycle
  ST-030:
    setting: early
    subtype: HER2+
    stage: neoadjuvant
    title: Deciding how much chemotherapy a HER2-positive tumour still needs
    chapters:
    - BC-830
    premise: Almost everyone in this cell is cured by chemotherapy given with HER2 antibodies, with most of what
      the cure costs coming from the chemotherapy rather than from the antibodies. The questions here are therefore
      subtractive ones, asked before surgery because that is where the tumour answers back. Every argument in
      this position turns on how far the grade the specimen puts on the response should be allowed to route what
      follows.
    questions:
    - id: SQ-0120
      ask: Is a pathological complete response worth raising, or is it only a marker of the tumour the patient
        already had?
      rationale: Preoperative and postoperative chemotherapy were compared head to head in operable disease. The
        order changed nothing about survival. So the reason to treat first is not more cure. It is downstaging
        of the breast and the axilla. It is also information, because in HER2-positive disease the response is
        graded on the surgical specimen. That grade separates outcomes steeply.
      experiment: The order of the same chemotherapy was randomised in operable disease of every subtype. Within
        HER2-positive disease, trastuzumab was added to a neoadjuvant anthracycline and taxane backbone, with
        event-free survival rather than a pathological endpoint as the primary measure. A platform trial with
        a shared chemotherapy control then followed patients by whether they reached a complete response. Separately,
        residual invasive disease found at surgery was used as the entry criterion for a trial that randomised
        what was given afterwards. A dual combination that had raised the pathological endpoint before surgery
        was also randomised adjuvantly against trastuzumab, in a trial large enough to measure disease-free survival.
      finding: The order of treatment does not change survival. What the specimen shows does. Patients who reach
        a complete response have few events. Those with residual disease have many. Acting on that residual disease
        with a conjugate lowers recurrence against continuing the antibody alone. Adding trastuzumab to neoadjuvant
        chemotherapy raised event-free survival against the same chemotherapy alone, which is the endpoint that
        trial was built to measure.
      limitation: The association between response and outcome is measured within patients rather than between
        treatments. A drug that raises the proportion reaching a complete response has not thereby been shown
        to lower recurrence. The clearest counterexample sits in this cell. The lapatinib and trastuzumab pair
        raised pathological complete response against trastuzumab before surgery. Tested adjuvantly at scale,
        the same combination did not clear its prespecified significance threshold for disease-free survival against
        trastuzumab. The trial that fixed the equivalence of the two orders predates HER2 testing and used chemotherapy
        nobody now gives. It licenses the neoadjuvant approach in general rather than this backbone in particular.
      next: If the endpoint is worth raising at all, what raises it?
      trials:
      - nsabp-b-18
      - noah
      - ispy2
      - katherine
      - neoaltto
      - altto
    - id: SQ-0130
      ask: Does intensifying the HER2 block itself, by adding a second drug or by engineering a better antibody,
        raise pathological complete response?
      rationale: Trastuzumab binds one epitope and does not prevent ligand-driven dimerisation. Pertuzumab blocks
        the dimerisation face. A small-molecule inhibitor blocks the kinase from inside the cell. Engineering
        the Fc region raises affinity for the activating receptor on immune effector cells. Each is a different
        way of asking whether one antibody leaves HER2 signalling, or immune killing, on the table.
      experiment: A second HER2-directed drug was added to trastuzumab on a taxane backbone in separate randomised
        trials of pertuzumab, of lapatinib and of pyrotinib, each designed around a pathological endpoint. The
        lapatinib question was asked three times, once with the antibodies given ahead of the taxane and twice
        with them given alongside it. One trial substituted an Fc-engineered antibody for trastuzumab alongside
        pertuzumab and paclitaxel. One added a checkpoint inhibitor rather than a second HER2-directed drug, with
        co-primary analyses in all comers and in the PD-L1-positive subset.
      finding: The antibody pair raises the proportion reaching a complete response against trastuzumab alone
        on the same taxane. So does pyrotinib added to trastuzumab and a taxane. Lapatinib is less consistent.
        Added to trastuzumab ahead of the taxane it raised the pathological endpoint. Added to trastuzumab after
        an anthracycline it did not reach significance on the same endpoint. The third lapatinib comparison reports
        long-term relapse-free and overall survival in favour of dual blockade over trastuzumab. Whatever the
        kinase inhibitors buy, they buy it with diarrhoea. Improving the antibody rather than adding to it did
        not raise response against trastuzumab in an otherwise identical regimen. Nor did adding a checkpoint
        inhibitor, in either of its co-primary populations.
      limitation: The endpoint is not scored the same way across these trials. Some report response in the breast
        alone. Others require the nodes to be clear as well. Rates are therefore not comparable between trials
        even where the regimens nearly are. Two of the positive trials enrolled in a single country on a docetaxel
        backbone, which fixes the comparator rather than answering the question about a taxane and carboplatin
        backbone. The third lapatinib trial published long-term survival and gene expression analyses rather than
        its own pathological complete response rates. The registry cannot set it beside the other two on the endpoint
        they were all designed around. The Fc-engineering result exists only as conference and registry material,
        with no primary publication. Its unsuccessful comparison cannot be read at the level of detail the others
        allow.
      next: If the antibodies are doing this much of the work, how much of the chemotherapy beside them is still
        earning its place?
      trials:
      - neosphere
      - peony
      - neoaltto
      - nsabp-b-41
      - calgb-40601
      - phedra
      - margot
      - impassion050
    - id: SQ-0140
      ask: Can the anthracycline come out of the neoadjuvant backbone without lowering response?
      rationale: An anthracycline costs cardiac function and carries a small leukaemia risk. It is given alongside
        an antibody that itself depresses left ventricular function. The pivotal adjuvant trial that ran a trastuzumab
        regimen with and without an anthracycline had already found the two close, which made the omission worth
        testing where the readout is fast.
      experiment: A cardiac safety trial ran three dual-blockade regimens, two containing an anthracycline and
        one not, with the pathological endpoint secondary. A randomised trial then varied the anthracycline alone,
        on a fixed taxane, carboplatin and dual-blockade backbone, with response as the endpoint and event-free
        survival on follow-up. Separately, carboplatin was added to a taxane and anthracycline backbone in a trial
        enrolling both triple-negative and HER2-positive disease. A further comparison set weekly nab-paclitaxel
        with dual blockade against docetaxel and carboplatin with dual blockade. The taxane formulation on its
        own had already been randomised in an all-comers neoadjuvant trial, with the anthracycline kept in both
        arms.
      finding: Removing the anthracycline did not lower response or event-free survival against keeping it. It
        lowered the frequency of a substantial fall in ejection fraction. Adding platinum raised response in triple-negative
        disease. It added nothing in the HER2-positive stratum of the same trial. Among anthracycline-free regimens,
        weekly nab-paclitaxel with dual blockade raised response against docetaxel and carboplatin with dual blockade.
        Nab-paclitaxel had also raised response against solvent-based paclitaxel in the all-comers trial that
        kept the anthracycline in both arms.
      limitation: The anthracycline trial was sized on the pathological endpoint. Its event-free survival comparison
        is a follow-up analysis with few events. The absence of a difference there is not a demonstration of equivalence.
        The cardiac safety trial set its three regimens side by side without powering a comparison between them,
        so its response rates rank the arms rather than test them. The comparison that favoured nab-paclitaxel
        changed two things at once, the taxane formulation and the carboplatin. It cannot say which change produced
        the gain. It also enrolled in a single country. The trial that isolates the taxane formulation alone enrolled
        every subtype rather than this one.
      next: If the anthracycline is dispensable, is the rest of the cytotoxic backbone dispensable too?
      trials:
      - bcirg006
      - tryphaena
      - train2
      - geparsixto
      - helen-006
      - geparsepto-gbg-69
    - id: SQ-0150
      ask: Can conventional chemotherapy be left out altogether, leaving the HER2 block to work alone?
      rationale: Some HER2-positive tumours depend on the receptor to the point of addiction. In the trial that
        established the antibody pair, the arm given both antibodies without a taxane produced complete responses
        in a minority of patients. If those tumours can be identified, the cytotoxic drug is being given to them
        for nothing.
      experiment: Chemotherapy-free dual blockade was given for a fixed window before surgery, with endocrine
        therapy added for oestrogen receptor-positive disease, across a series of single-arm and randomised phase
        II trials. One randomised the length of that window, a longer course against a shorter one. One asked
        whether the intrinsic subtype called from the diagnostic biopsy predicts who responds. One tested formally
        whether early responders given dual blockade alone could be spared the taxane.
      finding: Chemotherapy-free blockade produces complete responses in a minority. The minority is larger with
        the longer window than with the shorter. It is larger in oestrogen receptor-negative than in receptor-positive
        disease. It is larger in tumours called HER2-enriched than in the rest. The trial that tested omission
        formally did not show non-inferiority. On that test the taxane was not dispensable, even in early responders.
      limitation: Most of these trials have no chemotherapy arm and no survival endpoint. Nothing in them supports
        equivalence to chemotherapy. The duration trial combined a phase II design in the experimental arm with
        a pick-the-winner design. It was explicitly not powered to compare the two windows, so the gap between
        them is a numerical difference that was never tested. The trial that did test omission set early responders
        in the chemotherapy-free arm against every patient in the taxane arm, which compares a selected group
        with an unselected one. It also enrolled hormone receptor-negative disease only. The subtype trial had
        no comparator. A subtype that identifies responders to chemotherapy-free blockade has not thereby been
        shown to identify patients who can forgo chemotherapy.
      next: If blanket omission fails, can the patients who can safely omit be picked out instead, either before
        treatment or from their response to it?
      trials:
      - neosphere
      - tbcrc006
      - tbcrc-023
      - pamela
      - adapt-her2-hr
    - id: SQ-0160
      ask: Can the response to the first weeks of treatment decide who needs chemotherapy, rather than the decision
        being made for everyone in advance?
      rationale: A baseline assay predicts. A short exposure tests. A tumour whose metabolic activity collapses
        under the opening weeks of antibody has demonstrated the dependence an assay was trying to infer. The
        same logic applies at the other end of the course, because a complete response at surgery is the strongest
        evidence a tumour can give that what it received was enough.
      experiment: One trial randomised a response-adapted strategy against chemotherapy with dual blockade, giving
        antibodies alone and adding chemotherapy only to patients whose tumours failed to respond on imaging.
        One tested formally whether the metabolic change measured in the middle of the first cycle predicts pathological
        complete response, against a prespecified accuracy threshold. Others adapted at the far end, using MRI
        to decide when enough chemotherapy had been given, or withholding further chemotherapy from patients whose
        specimen showed a complete response.
      finding: Imaging separates responders from non-responders early. The adapted groups have done well on the
        endpoints reported so far. Adherence to withholding chemotherapy after a complete response was high where
        it was measured. The formal test of predictive accuracy missed its prespecified threshold. The signal
        underneath it was nonetheless real, since tumours without a substantial metabolic fall rarely reached
        a complete response.
      limitation: The randomised response-adapted trial reported its recurrence endpoint against a fixed threshold
        rather than against its own comparator arm. That arm was small by design. The strategy was therefore measured
        against an expectation rather than against chemotherapy. The trials that adapt on the pathological response
        are single-arm, which makes the good outcome after a complete response the prognosis of a responder rather
        than the effect of stopping. Their recurrence endpoints are not yet reported. The trial that tested metabolic
        prediction required oestrogen receptor-negative disease. It says nothing about the receptor-positive majority,
        where complete responses are least common and the decision is hardest.
      next: If what is being avoided is systemic cytotoxic exposure, can the cytotoxic be carried to the target
        instead of given free?
      trials:
      - phergain
      - tbcrc-026
      - train-3
      - daphne
      - compassher2pcr
      - phergain2
    - id: SQ-0170
      ask: Can an antibody-drug conjugate replace conventional chemotherapy before surgery?
      rationale: A conjugate delivers a cytotoxic to cells that display the target. In a tumour selected for displaying
        that target, it ought to reproduce the cell kill of chemotherapy with far less systemic exposure. The
        neoadjuvant setting reads that claim out in months rather than years.
      experiment: The substitution was made randomly, conjugate plus pertuzumab against docetaxel, carboplatin
        and dual blockade, with pathological complete response as the endpoint. The same swap was made adjuvantly
        against a taxane with dual blockade, behind an anthracycline in both arms. In hormone receptor-positive
        disease the conjugate was randomised against trastuzumab with endocrine therapy. A single-arm study of
        conjugate plus pertuzumab defined heterogeneous and non-heterogeneous tumours prospectively, from multiple
        regions of the specimen rather than from one score. A newer conjugate was then tested not as a replacement
        for chemotherapy but as the first half of the regimen, against an anthracycline first half, with the same
        antibody and taxane triplet second half. That trial also ran an arm giving the newer conjugate alone.
      finding: Substituting the conjugate for chemotherapy lowered response against chemotherapy, even though
        severe toxicity was far lower. On follow-up the conjugate arm carried the higher event risk as well. The
        same substitution failed adjuvantly against a taxane with dual blockade. In hormone receptor-positive
        disease the conjugate did raise response against trastuzumab with endocrine therapy, without separating
        the arms on invasive disease-free survival. The heterogeneity study accounts for part of the pattern,
        because tumours carrying regions without the target essentially did not respond, while tumours uniform
        for it responded well. The newer conjugate, placed before the taxane triplet rather than instead of it,
        raised response against the anthracycline sequence. Given alone, with no triplet behind it, it fell below
        that anthracycline sequence.
      limitation: The heterogeneity comparison was planned prospectively. The groups were not randomised. Only
        a small minority of evaluable tumours were heterogeneous, so the response rate in that group rests on
        very few patients. The hormone receptor-positive conjugate trial used trastuzumab with endocrine therapy
        as its control, a comparator with little cytotoxic content. Beating it on response says nothing about
        replacing chemotherapy, and its own survival comparison says so directly. The newer conjugate was tested
        in high-risk disease only. Its event-free survival is barely mature. Its winning arm still contains a
        taxane. These are separate questions about conjugates rather than repeated confirmations of one.
      next: If a target-positive report can conceal regions without the target, should HER2 be recorded as a proportion
        of the tumour rather than as a score on one block?
      trials:
      - kristine
      - kaitlin
      - wsg-adapt-tp
      - her2-heterogeneity
      - destiny-b11
  ST-050:
    setting: early
    subtype: HER2+
    stage: adjuvant
    title: Matching adjuvant HER2 treatment to baseline risk
    chapters:
    - BC-820
    premise: 'Before the antibody, HER2 amplification carried the worst prognosis in early breast cancer. It now
      carries one of the best, on a regimen whose chemotherapy backbone, whose duration and whose stopping point
      were all fixed in trials of node-positive disease. Most patients treated with it today sit well below that
      risk, so the questions at this position run along a single axis and run in both directions at once: what
      can be taken away at the bottom, and what has to be added at the top.'
    questions:
    - id: SQ-0180
      ask: Does adding a year of trastuzumab to adjuvant chemotherapy lower recurrence?
      rationale: HER2 amplification marked the fastest-relapsing early breast cancer of the pre-antibody era.
        The antibody already worked against established metastatic disease. Micrometastatic disease left behind
        after surgery should be the easier target, being smaller and less heterogeneous than a measurable metastasis.
      experiment: Adjuvant programmes randomised trastuzumab against no trastuzumab on a chemotherapy backbone.
        They differ in whether the antibody ran concurrently with the taxane or began only after all chemotherapy,
        in whether the backbone contained an anthracycline, and in how long the antibody was continued.
      finding: Recurrence fell in every comparison. The separation was still open at ten years where follow-up
        ran that long. The anthracycline-free backbone gave disease control close to the anthracycline backbone
        with less cardiac dysfunction.
      limitation: A year of antibody was a protocol convention rather than a tested dose, so these trials establish
        that the antibody works without establishing how much of it is needed. The trial that compared the antibody
        against observation allowed its control group to cross over once the first results were public, so its
        long-term survival comparison is diluted by design. The two trastuzumab backbones in the anthracycline
        comparison were never set against each other under a non-inferiority design, so the absence of a significant
        difference between them is an absence of evidence and not a demonstration of equivalence. The short-course
        signal that prompted everything downstream came from a small HER2-positive substudy nested inside a randomisation
        of two different chemotherapies.
      next: If a year was chosen rather than found, can less than a year hold the same disease control?
      trials:
      - nsabp-b31-n9831
      - hera
      - bcirg006
      - finher
    - id: SQ-0190
      ask: Can adjuvant trastuzumab be shortened below a year without losing disease control?
      rationale: The year was inherited from the pivotal protocols rather than derived from them. It carries cardiac
        risk, a year of infusions, and a cost that decides access in much of the world. The nested short course
        suggested the antibody might do most of its work early.
      experiment: Non-inferiority randomisations of six months against twelve, and of nine weeks against twelve
        months, each trial setting its own margin on its own scale. The pivotal observation trial had already
        tested the question from the other end by randomising a second year against the first.
      finding: A second year bought nothing over the first. Of the shorter comparisons, only one was declared
        non-inferior. The nine-week comparisons pointed against the short course, one of them with a point estimate
        a long way from equivalence. Cardiac events were consistently fewer on the shorter arms.
      limitation: These results do not stack, and estimates that look alike did not answer alike. The two six-month
        trials returned nearly identical hazard ratios and reached opposite verdicts, because one set its margin
        as a difference in percentage points of disease-free survival at a fixed time point and the other set
        its margin on the hazard ratio scale. The chemotherapy partners, and the point at which the antibody started
        relative to them, also differ across the four. None randomised duration inside a defined risk stratum,
        so failing non-inferiority in an unselected population says nothing about whether a small node-negative
        tumour needs the full year.
      next: If the duration cannot be cut for everyone, can the chemotherapy be cut for the patients whose baseline
        risk is lowest?
      trials:
      - hera
      - persephone
      - phare
      - shorther
      - sold
    - id: SQ-0200
      ask: For a small node-negative HER2-positive tumour, how little chemotherapy is enough?
      rationale: The pivotal trials were built on node-positive disease and prescribed an anthracycline followed
        by a taxane. Small node-negative tumours were largely excluded from them. Those tumours still recur, so
        they are still treated, and they are asked to carry a toxicity that was justified against a much higher
        baseline risk.
      experiment: A single-group adjuvant course of a weekly taxane with trastuzumab in node-negative disease
        below a size cut-off. Then a randomised substitution of the antibody-drug conjugate for the taxane, with
        a protocol-defined composite of clinically relevant toxicity as a co-primary endpoint alongside disease-free
        survival. From the neoadjuvant side, a randomised test of whether early responders to dual blockade could
        be spared the taxane altogether.
      finding: Almost everyone given the short taxane-and-antibody course stayed free of invasive disease, and
        the rate held on extended follow-up. The conjugate gave comparable disease control without lowering the
        composite toxicity endpoint. Dropping the taxane from dual blockade lost pathological response, including
        among the early responders it was designed to protect.
      limitation: 'The single-group trial has no control arm, so its outcome measures the population selected
        into it as much as the regimen given to it. The substitution trial was powered for toxicity rather than
        for a disease-free survival comparison and allocated most of its patients to the conjugate, keeping only
        a small taxane comparator, so its outcome arms cannot establish equivalence. Its null toxicity result
        is also a statement about a composite: the totals matched, which is not the same as the two regimens costing
        a patient the same things. The taxane-omission question was settled on pathological response rather than
        on recurrence, in hormone receptor-negative disease only, with very few patients in each response group.'
      next: If the floor can be lowered this far for low-risk disease, does the ceiling need raising for node-positive
        disease?
      trials:
      - apt
      - atempt
      - adapt-her2-hr
    - id: SQ-0210
      ask: Does adding pertuzumab to adjuvant trastuzumab and chemotherapy lower recurrence?
      rationale: A second antibody binds a different epitope and blocks the dimerisation that trastuzumab leaves
        intact. Neoadjuvant trials had already shown the pair raises pathological complete response above the
        single antibody. The adjuvant question is whether more response in the breast converts into fewer recurrences
        years later.
      experiment: One trial randomised pertuzumab against placebo on top of chemotherapy and a year of trastuzumab,
        in node-positive and high-risk node-negative disease. A second tested a different route to a dual block,
        randomising a kinase inhibitor given with trastuzumab or sequenced after it against trastuzumab alone.
        A third kept the dual block and replaced the taxane portion of the regimen with the conjugate.
      finding: The second antibody lowered invasive recurrence, with the gain sitting in the node-positive stratum
        and nothing to show in node-negative disease. The kinase inhibitor given concurrently fell short of its
        significance threshold, and the sequence added nothing at all. The conjugate substitution matched the
        taxane arm without beating it.
      limitation: The nodal split is a subgroup gradient inside one randomisation rather than a randomised comparison
        of two populations, and overall survival has not separated. The kinase inhibitor's concurrent arm was
        judged against a threshold tightened after a third arm closed for futility, so the same estimate reads
        as a narrow miss or as a small real benefit depending on which threshold is applied to it. The conjugate's
        null result is a failure to improve on an active control and not evidence of an inactive drug, and far
        fewer patients completed treatment on that arm, so it compares strategies as delivered rather than drugs
        as prescribed.
      next: If a second antibody pays only at higher nodal risk, does a drug with a different mechanism help the
        patients still at risk once the year of blockade has finished?
      trials:
      - aphinity
      - altto
      - kaitlin
    - id: SQ-0220
      ask: Does extending HER2-directed treatment beyond the first year with an oral kinase inhibitor add anything?
      rationale: Recurrences keep arriving after the antibody stops, and in hormone receptor-positive disease
        they arrive late. An irreversible pan-HER kinase inhibitor acts inside the cell and covers signalling
        the antibody does not, including the crosstalk with the oestrogen receptor that is one proposed route
        of escape.
      experiment: A randomisation of a further year of the kinase inhibitor against placebo in patients who had
        completed trastuzumab-based adjuvant therapy, stratified by hormone receptor status, with invasive disease-free
        survival measured at two years as the primary endpoint.
      finding: The extra year lowered invasive recurrence inside the two-year window. Severe diarrhoea was common
        and it arrived in the first weeks. By the final analysis the two arms had the same overall survival.
      limitation: A two-year endpoint is a short window for the very group the drug is now aimed at, whose recurrences
        come late, so the primary result is a measurement taken before the population it selects for has had time
        to relapse. Hormone receptor status was a stratification factor and not a randomised comparison of the
        strata. The trial enrolled before adjuvant pertuzumab and before conjugate treatment for residual disease,
        so almost nobody in it had received the treatment a candidate would receive today. No antidiarrhoeal strategy
        was part of the randomisation, so the tolerability on record is the tolerability of the drug given without
        one.
      next: Every escalation here is allocated on nodal status and tumour size measured before a drop of treatment
        is given. Can the tumour's own response to treatment allocate it better?
      trials:
      - extenet
      - hera
      - aphinity
  ST-060:
    setting: early
    subtype: HER2+
    stage: post-neoadjuvant
    title: Escalating treatment on residual disease after HER2 blockade
    chapters:
    - BC-820
    premise: Residual invasive disease at surgery is the strongest selection rule in early breast cancer, because
      it is measured rather than inferred. The tumour met HER2-directed therapy and was still there at operation.
      Every question in this position therefore concerns a population defined by a failure that has already happened,
      and the arguments turn on how much of that population each trial agreed to enrol.
    questions:
    - id: SQ-0230
      ask: For residual invasive disease at surgery, does switching to an antibody-drug conjugate lower recurrence
        more than completing the planned trastuzumab?
      rationale: Residual disease is observed resistance rather than inferred risk. The tumour met trastuzumab
        and a taxane and was still present at operation. Completing the same antibody asks a drug to finish work
        it has already been shown not to do in that patient. A conjugate keeps the target and changes the mechanism,
        by delivering a cytotoxic to a cell the antibody can still find. Escalation on residual disease had already
        lowered recurrence in HER2-negative disease, so the principle was not new when it reached this subtype.
      experiment: KATHERINE randomised patients with residual invasive disease in the breast or axilla after neoadjuvant
        taxane-based chemotherapy with trastuzumab to a conjugate or to completing trastuzumab, with invasive
        disease-free survival as the endpoint. Beside it, KAITLIN gave the same conjugate to unselected patients
        after surgery in place of the taxane, which is the same drug asked to work without the selection rule.
      finding: In selected residual disease the conjugate lowered invasive recurrence against continuing the antibody.
        Follow-up ran long enough for that recurrence benefit to become a survival benefit, which is uncommon
        in this setting. In the unselected adjuvant population the same conjugate improved nothing, and fewer
        patients finished the planned course.
      limitation: The control arm was the drug the tumour had already grown through. What the trial establishes
        is that a conjugate beats continuing an agent known to have failed in that patient, not that it beats
        any other escalation that might have been offered. The entry rule also rested on what counted as adequate
        neoadjuvant therapy, and that was never standardised. Most patients were treated before pertuzumab was
        routine, so residual disease in the trial followed a weaker regimen than residual disease in clinic today.
      next: If the class is right, does a conjugate with a different payload beat the one that established the
        setting?
      trials:
      - katherine
      - kaitlin
      - create-x
    - id: SQ-0240
      ask: Does a bystander-capable conjugate lower recurrence further than the conjugate that established this
        setting?
      rationale: The first conjugate carries a payload that stays inside the cell it enters, so it kills only
        cells that bind and internalise enough antibody. Residual disease after HER2 blockade is the compartment
        most likely to carry reduced or patchy antigen. A cleavable payload that crosses into neighbouring cells
        should reach what the first conjugate cannot, and a single-arm neoadjuvant study had already reported
        no responses at all to a non-bystander conjugate where HER2 was spatially heterogeneous.
      experiment: DESTINY-Breast05 randomised trastuzumab deruxtecan against trastuzumab emtansine in residual
        invasive disease, with entry restricted to node-positive disease at surgery or inoperable disease at diagnosis.
        The comparator was the established conjugate rather than the antibody, so this is the first trial in this
        position whose control arm was known to work.
      finding: The newer conjugate lowered invasive recurrence against an active comparator, by a margin larger
        than the one that established the older drug. Drug-related interstitial lung disease was far more frequent
        than on the older conjugate, and patients died of it.
      limitation: Recurrence was measured and survival was not, so a pulmonary toxicity that killed patients is
        currently being set against a surrogate. The enrolled population was narrower than that of the trial it
        displaced, because residual disease with negative nodes at surgery was not admitted. The antigen reasoning
        behind the whole comparison comes from a single-arm study whose heterogeneous and non-heterogeneous groups
        were prospectively defined but never randomised, resting on very few heterogeneous tumours.
      next: Does the benefit reach the residual-disease patients the trial did not enrol?
      trials:
      - destiny-b05
      - katherine
      - her2-heterogeneity
    - id: SQ-0250
      ask: Does low-volume residual disease with negative nodes at surgery need the same escalation as residual
        nodal disease?
      rationale: Residual disease is a category rather than a quantity. A small deposit left in the breast with
        clear nodes carries a different hazard from disease still in the nodes after treatment. Trials have written
        that gradient into their entry criteria instead of testing it, which converts a biological question into
        an eligibility question.
      experiment: Read the entry criteria against each other rather than the results. The first conjugate trial
        admitted any residual invasive disease in the breast or axilla. The trial of the newer conjugate required
        node-positive disease at surgery or inoperable disease at diagnosis. The two randomised additions still
        running narrow entry further, to oestrogen receptor-negative or node-positive disease in one case and
        to high-risk residual disease in the other.
      finding: The randomised record is dense where risk is highest and thin where it is lowest. For residual
        disease with negative nodes, the only randomised evidence is still the older comparison against the antibody.
        The newer conjugate is untested in exactly the group whose absolute risk is smallest.
      limitation: Nodal status after neoadjuvant therapy is a staging convention as much as a biological variable.
        It depends on how the axilla was sampled and on how many nodes were examined, so a patient called node-negative
        after a sentinel procedure has not had the same test as one after a dissection. No trial randomised the
        threshold itself. The line between escalating and not escalating is an eligibility rule that was chosen
        once and then inherited.
      next: For a patient outside the newer trial's entry criteria, is there anything worth adding to the established
        conjugate instead?
      trials:
      - katherine
      - destiny-b05
      - compassher2-rd
      - astefania
    - id: SQ-0260
      ask: Can adding a second agent to the post-neoadjuvant conjugate lower recurrence further, and can it reach
        the brain?
      rationale: Once systemic control improves in this subtype, a large share of first relapses arrive in the
        brain, and a conjugate is a poor drug for that site. A small molecule with intracranial activity in metastatic
        disease is the obvious partner. Residual disease has also survived in an intact immune context, which
        is the argument for adding a checkpoint antibody instead.
      experiment: Two randomised trials add an agent to the established conjugate in residual disease. One adds
        tucatinib against placebo in oestrogen receptor-negative or node-positive disease, with brain metastasis-free
        survival among its outcomes. The other adds atezolizumab against placebo in high-risk residual disease.
      finding: Neither has reported. The only publication on the record of the immunotherapy trial is its design
        protocol, so nothing there says what the trial showed, and the enrolment figure attached to it is a plan
        rather than a count of patients randomised.
      limitation: Both trials were designed when the established conjugate was the only post-neoadjuvant option.
        A positive result will therefore show that an addition improves on a backbone that a newer conjugate has
        already beaten in node-positive disease. The comparison a clinic needs is between those two strategies,
        and no trial is making it. The immunotherapy arm also carries a warning from the preoperative setting,
        where a checkpoint antibody added to chemotherapy and dual blockade did not raise pathological complete
        response in this subtype.
      next: When the conjugate course finishes and the risk has not finished with it, is there anything to give
        next?
      trials:
      - compassher2-rd
      - her2climb
      - astefania
      - impassion050
    - id: SQ-0270
      ask: After the post-neoadjuvant conjugate is completed, is there anything more to offer a patient whose
        risk continues?
      rationale: Recurrence in this population goes on after the planned cycles of conjugate end, so the escalation
        stops while the hazard is still running. Extending oral pan-HER inhibition for a further year is the only
        continuation that has been randomised in this subtype.
      experiment: ExteNET randomised a year of neratinib against placebo after completion of trastuzumab-based
        adjuvant therapy, stratified by hormone receptor status. The population was defined by having finished
        trastuzumab rather than by residual disease, so patients with residual disease sit inside the trial as
        a fraction of it.
      finding: Extension lowered invasive recurrence against placebo over the first years. The effect was concentrated
        in hormone receptor-positive disease, long-term survival was no different between the arms, and severe
        diarrhoea was common in a trial run without antidiarrhoeal prophylaxis.
      limitation: The trial predates routine pertuzumab and predates post-neoadjuvant conjugates entirely, so
        nobody in it had received the treatment that now defines this position. The hormone receptor restriction
        that governs current use is a comparison between two strata rather than a randomised comparison, however
        well balanced those strata were. Eligibility was also narrowed partway through accrual, so the population
        enrolled is not the one the protocol opened with.
      next: If everything available after surgery is constrained by what was given before it, does a better preoperative
        regimen dissolve this question or only move it?
      trials:
      - extenet
      - katherine
      - destiny-b05
    - id: SQ-0280
      ask: Does a stronger preoperative regimen remove the population this whole strategy was built for?
      rationale: Every question in this position presupposes residual disease at surgery. The preoperative regimen
        decides how many patients arrive with it and which ones they are. It also decides which drugs remain unused,
        because a conjugate spent before surgery is not available after it.
      experiment: Three trials move that boundary in different directions. DESTINY-Breast11 randomised a conjugate
        given alone, or followed by the taxane with dual antibody, against dose-dense anthracycline chemotherapy
        followed by the same triplet. CompassHER2 pCR gave a chemotherapy-light preoperative regimen in a single
        arm and omitted further chemotherapy after a pathological complete response. KRISTINE substituted a conjugate
        with dual blockade for chemotherapy altogether.
      finding: A conjugate-containing preoperative regimen raised pathological complete response against the anthracycline
        standard, which shrinks the residual-disease population. The chemotherapy-light regimen left most patients
        with residual disease, and those patients were predominantly oestrogen receptor-positive. Substituting
        the conjugate for chemotherapy lowered pathological complete response and therefore enlarged the residual-disease
        population, at much lower acute toxicity.
      limitation: All three moved a surrogate. Pathological complete response is the endpoint that reports first,
        the event-free survival of the conjugate trial was immature, and the response-adapted trial has not yet
        reported its recurrence endpoint at all. Nothing has randomised what to do about residual disease that
        persisted through a preoperative conjugate. Every post-neoadjuvant trial in this position enrolled tumours
        that survived an antibody and a taxane, and a tumour that survives trastuzumab deruxtecan before surgery
        is a different population with no evidence behind it.
      next: Does residual disease mean the same thing when the regimen it survived has changed, and should the
        escalation rule be written in terms of what the tumour was exposed to rather than what is left in the
        specimen?
      trials:
      - destiny-b11
      - compassher2pcr
      - kristine
      - destiny-b05
  ST-040:
    setting: early
    subtype: HR+/HER2+
    stage: neoadjuvant
    title: Taking chemotherapy away when the oestrogen receptor is also on
    chapters:
    - BC-840
    premise: Triple-positive disease is treated by two traditions and belongs to neither. It clears less completely
      under a taxane with HER2 blockade than receptor-negative HER2-positive disease does, and it keeps a second
      driver that endocrine therapy can reach. So the neoadjuvant argument here is about what that second driver
      lets a clinic take away, and about how anyone would know in advance which patient it is safe to take it
      from.
    questions:
    - id: SQ-0290
      ask: Why does pathological complete response fall when the oestrogen receptor is also expressed?
      rationale: The two receptors talk to each other. Blocking HER2 lifts the suppression it exerts on oestrogen
        receptor signalling, so a tumour carrying both can shift its dependence instead of dying. A tumour with
        somewhere to go should be harder to eradicate before surgery than one without.
      experiment: The neoadjuvant HER2 trials stratified randomisation by hormone receptor status and reported
        response within each stratum, across a taxane with one antibody, a taxane with two, and a conjugate substituted
        for the taxane. The same split was reported in the large modern single-arm cohort given a taxane with
        dual blockade. Separately, intrinsic subtype was called on pretreatment biopsies in chemotherapy-free
        cohorts and set against response.
      finding: Response is lower in the receptor-positive stratum than in the receptor-negative one on every backbone
        tested, whether the HER2 blockade was single or dual and whether the cytotoxic was a taxane or a conjugate.
        The size of the gap tracks how often these tumours are called HER2-enriched rather than how much HER2-directed
        treatment they were given.
      limitation: 'Hormone receptor status was a stratification factor and a reporting subgroup in these trials.
        It was never randomised, so the two strata differ in more than the receptor. The endpoint is also not
        the same endpoint across them: some scored the breast alone and some the breast and the axilla, and the
        receptor-positive stratum is where low-volume residual disease is most common, so where the threshold
        is set changes the size of the gap it produces. Nothing here separates a tumour that resists treatment
        from one that shrinks without clearing.'
      next: If the oestrogen receptor is the escape route, does blocking it and the cell cycle it feeds, at the
        same time as HER2, close the route?
      trials:
      - neoaltto
      - neosphere
      - kristine
      - compassher2pcr
      - pamela
      - perelisa
    - id: SQ-0300
      ask: Does blocking the oestrogen receptor, HER2 and the cell cycle at once let the taxane be left out?
      rationale: Both receptors converge on cyclin D1 and CDK4/6, which is where a tumour that switches drivers
        has to pass. Blocking that node as well as both receptors should close the escape route rather than leave
        it open. It should do so with no cytotoxic anywhere in the regimen.
      experiment: A single-arm study gave dual HER2 antibodies with a CDK4/6 inhibitor and a receptor degrader
        before surgery, with proliferation measured at two weeks and again at surgery as the primary readout rather
        than response. A randomised phase II trial then substituted a CDK4/6 inhibitor with an aromatase inhibitor
        for weekly paclitaxel, keeping the same two antibodies in both arms, and made a gene signature of E2F
        pathway activity its primary question.
      finding: Proliferation collapses within two weeks of starting the chemotherapy-free triplet and has not
        returned to baseline at surgery. When the substitution was put against a taxane, the two arms reached
        the same response rate.
      limitation: The single-arm study had no control group, and its primary endpoint was the change in proliferation
        rather than response, so what it shows is that the drugs are reaching their target and not that the strategy
        suffices. The randomised trial was not designed as a non-inferiority comparison, so two response estimates
        that land in the same place are not evidence that the chemotherapy-free arm is as good as the taxane.
        Its population was postmenopausal and at the older end of the range, which is narrower than the group
        the strategy would be offered to.
      next: If adding cell-cycle blockade can match a taxane without being shown to replace it, how much can be
        taken away with the antibodies and endocrine therapy alone?
      trials:
      - na-pher2
      - touch
    - id: SQ-0310
      ask: Can antibodies with endocrine therapy and no cytotoxic at all clear enough disease?
      rationale: Dual HER2 blockade eradicates a real fraction of tumours by itself. In receptor-positive disease
        endocrine therapy is on hand to hold the other pathway while it does. If the pair is enough for a substantial
        minority, then the taxane is being given to everyone in order to reach the rest.
      experiment: 'The trial that established dual blockade carried an arm of the two antibodies with no chemotherapy
        at all. Dedicated studies followed: a single-arm window of two antibodies with concurrent oestrogen deprivation,
        the same window randomised for duration, and a conjugate given with or without endocrine therapy against
        an antibody with endocrine therapy. Two trials then put a chemotherapy-free arm against a cytotoxic one,
        substituting a conjugate for docetaxel and carboplatin in the first and endocrine therapy for weekly paclitaxel
        in the second.'
      finding: A chemotherapy-free window clears disease in a minority and leaves low-volume residual disease
        in many more. Longer exposure produced more complete responses than shorter exposure in the one trial
        that randomised duration, and the gain sat in the receptor-positive subgroup. Against a cytotoxic comparator
        the chemotherapy-free arms lose response, by a little when a conjugate carries the payload and by a lot
        when nothing cytotoxic is given at all. Toxicity falls in the same order.
      limitation: The duration trial was built to pick a winner rather than to compare the two durations and was
        not powered for that comparison, so its gap is a numerical difference with no test behind it. Its duration
        effect also sat in the receptor-positive subgroup of a trial that admitted any receptor status, which
        is a subgroup of a design that was not asking about receptors. The conjugate comparison and the endocrine
        comparison were both sized for response, so their survival curves are secondary readouts on samples chosen
        for a different endpoint, and the interval around the endocrine trial's survival estimate is wide enough
        to hold very different truths.
      next: If a chemotherapy-free regimen clears disease in some patients and not in others, can the ones it
        will clear be picked out before treatment starts, or early enough to change it?
      trials:
      - neosphere
      - tbcrc006
      - tbcrc-023
      - wsg-adapt-tp
      - kristine
      - wsg-tpii
    - id: SQ-0320
      ask: Can the patients who can safely be spared chemotherapy be identified in advance, or from their early
        response?
      rationale: A chemotherapy-free strategy is only defensible if it is offered to tumours that will answer
        it. Two kinds of marker were proposed for that. One is read on the pretreatment biopsy and says what the
        tumour is. The other is read after a short exposure and says what the tumour does.
      experiment: On the baseline side, intrinsic subtype was called on pretreatment biopsies in two chemotherapy-free
        cohorts, HER2 was scored prospectively on biopsies taken from two separate sites of each tumour before
        a conjugate with dual blockade, and a signature of E2F pathway activity was tested as a formal treatment
        interaction in the randomised substitution trial. On the dynamic side, a fall in proliferation after two
        weeks of an aromatase inhibitor was used to route patients to a chemotherapy-free regimen or to a taxane,
        metabolic response on imaging was used the same way with chemotherapy added only on failure to respond,
        and pathological response at surgery was used to assign what came after it.
      finding: Baseline biology separates the population. Tumours called HER2-enriched respond far more often
        than tumours that are not, and tumours whose HER2 scores as heterogeneous across the same specimen scarcely
        respond at all to a conjugate given without chemotherapy. The E2F signature, the one marker tested as
        a treatment interaction rather than as a prognostic split, showed no interaction with the treatment given.
        Dynamic selection separates the population too, and the imaging-guided pathway that withholds chemotherapy
        from responders holds up on freedom from invasive disease.
      limitation: The subtype and heterogeneity results come from cohorts that were not randomised on the marker,
        so they say who responds and not who needed the chemotherapy that was withheld. Heterogeneity in particular
        is a sampling convention rather than a property of the disease, being two biopsies from one tumour scored
        against a threshold, and only a small handful of tumours met that definition, so the contrast rests on
        a very small denominator. The response-adapted trials measure their strategy against a fixed expectation
        rather than against the same patients treated the other way, and a patient who has declared herself a
        responder is by construction one who was going to do well.
      next: If a marker spares a patient chemotherapy before surgery and the prediction is wrong, what does the
        residual disease in the specimen then commit her to?
      trials:
      - pamela
      - perelisa
      - her2-heterogeneity
      - touch
      - phergain
      - phergain2
      - compassher2pcr
    - id: SQ-0330
      ask: What does leaving chemotherapy out before surgery commit a patient to after it?
      rationale: In this subtype the adjuvant decision is made on what is left in the specimen. Residual invasive
        disease sends a patient to a conjugate, so a neoadjuvant regimen that raises the residual disease rate
        does not take cytotoxic treatment out of the pathway. It moves it, and it changes which agent is given
        and on what evidence that agent was chosen.
      experiment: The randomised comparison of two antibodies with endocrine therapy against the same antibodies
        with weekly paclitaxel reported response and then followed the same patients for invasive disease-free
        survival, as did the comparison of a conjugate against docetaxel and carboplatin. Set against those are
        the post-neoadjuvant trials, which randomised patients with residual invasive disease to a conjugate against
        trastuzumab, and then to one conjugate against another.
      finding: The chemotherapy-free arms leave more residual disease than their cytotoxic comparators do, and
        they therefore send more patients into post-neoadjuvant escalation. Escalation there is worth a great
        deal against trastuzumab alone, and the newer conjugate is worth more again than the older one. Much of
        what was saved before surgery is spent after it.
      limitation: Nobody randomised the pathway as a whole. The neoadjuvant substitution trials were sized for
        response, so their survival curves are secondary. The post-neoadjuvant trials enrolled patients who arrived
        at residual disease after a cytotoxic backbone rather than after a chemotherapy-free one, so the benefit
        of escalation is being read across from a different upstream treatment, and residual disease left by a
        taxane is not obviously the same disease as residual disease left by endocrine therapy. The trial that
        restricts escalation by receptor and nodal status has not reported.
      next: If post-neoadjuvant escalation is what carries the outcome in this subtype, should the neoadjuvant
        course be chosen to sort patients rather than to maximise response?
      trials:
      - wsg-tpii
      - kristine
      - katherine
      - destiny-b05
      - compassher2-rd
  ST-070:
    setting: early
    subtype: TNBC
    stage: neoadjuvant
    title: Choosing what to add to preoperative chemotherapy, and what to take out
    chapters:
    - BC-860
    premise: Treatment is given before surgery in this cell because the tumour answers back, sorting the population
      for everything that follows. So almost every question here is asked against pathological complete response,
      a measurement taken once at one operation. Almost every answer then has to survive the gap between that
      measurement and recurrence.
    questions:
    - id: SQ-0340
      ask: Does adding carboplatin to preoperative chemotherapy do more than raise pathological complete response?
      rationale: Triple-negative tumours are enriched for defective homologous recombination. Platinum works by
        making the interstrand crosslinks that this repair pathway exists to resolve. So a drug the rest of breast
        cancer has little use for should earn its place here. The preoperative setting is where that prediction
        could be read quickly.
      experiment: Randomised addition of carboplatin to a taxane and anthracycline backbone, in trials that differed
        in the backbone and in what else was randomised alongside it. The endpoint in each was pathological complete
        response. Later trials put the same addition against event-free or disease-free survival instead, giving
        the platinum before surgery, after it, or either way.
      finding: Carboplatin raised pathological complete response over the same backbone without it, in trial after
        trial. The trials that used survival rather than response as their endpoint found fewer events in the
        carboplatin arm. One trial that set carboplatin against a different partner drug on the same taxane backbone
        saw its response advantage gone by the time survival was counted.
      limitation: These trials vary the platinum and the backbone together, so the variable under test is not
        the platinum alone. They differ in which anthracycline was given, in whether a second experimental agent
        was randomised alongside in a factorial, and in how much of the planned chemotherapy survived the added
        toxicity. In the trial where the response advantage disappeared, treatment after the first twelve weeks
        depended on how the tumour had responded, so its survival comparison is confounded by what came next.
        One of the survival trials violated the proportional hazards assumption its summary estimate is computed
        under, so that estimate does not describe the whole of its follow-up. Pathological complete response is
        also prognostic within an arm rather than a demonstrated surrogate across arms. The older trial that doubled
        it by adding a preoperative taxane, and changed no survival curve, is the standing demonstration of the
        difference.
      next: If the benefit comes from damage the tumour cannot repair, can the tumours that cannot repair it be
        identified before treatment starts?
      trials:
      - geparsixto
      - calgb40603
      - brightness
      - wsg-adapt-tn
      - nsabp-b-27
      - pearly
      - citrine
    - id: SQ-0350
      ask: Does a homologous recombination deficiency assay, or a germline BRCA mutation, identify who needs the
        platinum?
      rationale: If platinum works because a crosslink goes unrepaired, tumours that can repair one should not
        need it. A test for the defect would let the drug be allocated rather than given to everyone. That matters
        here because platinum toxicity is what limits delivery of the rest of the regimen.
      experiment: Two randomised trials built around the marker rather than around the drug. One set single-agent
        platinum against a single-agent taxane, and asked whether a deficiency score above a fixed cut-point predicted
        response to the platinum specifically. The other set single-agent platinum against an anthracycline regimen
        in germline carriers. A third trial selected patients by the deficiency assay and put a PARP inhibitor
        in the platinum's place. A single-arm window study gave a PARP inhibitor to patients selected for none
        of this.
      finding: The deficiency score did not separate response to platinum from response to a taxane. In germline
        carriers, platinum produced no more complete responses than the anthracycline regimen those patients would
        have had anyway. Selecting on the assay did not make the platinum-free arm clear the response threshold
        set for it. Unselected tumours given a PARP inhibitor responded often enough to make the marker look less
        like a gate than a description.
      limitation: The biomarker trial was sized to test a predictive claim rather than to compare two drugs, so
        its arm-to-arm difference is not an efficacy result. A large share of its patients crossed to another
        preoperative regimen before surgery, and the assay could not be scored on all of them. Entry to the germline
        trial required a mutation rather than triple-negative disease, so hormone receptor-positive patients sit
        inside its answer. The assay-selected trial tested one arm against a fixed threshold rather than against
        its comparator, so its arms can be described and not compared. No trial here kept an assay-negative arm
        on the same treatment, which is the comparison that would show what the selection bought.
      next: If the assay cannot allocate the platinum, can it allocate a PARP inhibitor, and can that drug replace
        the chemotherapy rather than join it?
      trials:
      - tbcrc-030
      - inform
      - geparola
      - petremac
    - id: SQ-0360
      ask: Can a PARP inhibitor stand in for the chemotherapy before surgery rather than be added to it?
      rationale: A PARP inhibitor kills cells that cannot repair a double-strand break. That is the same vulnerability
        the platinum is aimed at. If the oral drug does that work, the case for the cytotoxic backbone weakens.
        Its toxicity is of a different kind, which is the whole appeal in a disease being treated for cure.
      experiment: The designs run from addition to replacement. One trial randomised a PARP inhibitor on top of
        a platinum and taxane backbone, with a third arm carrying neither. One substituted the PARP inhibitor
        for the platinum in assay-selected patients. Two gave a PARP inhibitor as the only preoperative treatment,
        one for a full course in germline carriers, one as a short window before the chemotherapy in unselected
        disease. A further single-arm study pairs a PARP inhibitor with a checkpoint inhibitor and no chemotherapy
        at all.
      finding: Added to a platinum-containing backbone, the PARP inhibitor added nothing to it. Substituted for
        the platinum in selected patients, it did not clear the response threshold the trial had set itself, although
        it landed near the platinum arm. Given alone for a full course in germline carriers, it cleared tumours
        at a rate close to what combination chemotherapy achieves, and still fell short of its own prespecified
        bar. A short window of it, in patients unselected for a repair defect, produced objective responses in
        many of the tumours it was given to.
      limitation: The addition trial used a PARP inhibitor that traps the enzyme on DNA weakly, so a null result
        there is a result about one molecule rather than about the class. The monotherapy trials are single-arm,
        so their response rates have no concurrent comparator and get read against chemotherapy rates from other
        trials in other populations. One of them reports its response on an evaluable denominator rather than
        on everyone enrolled. A window of a few weeks followed by planned chemotherapy says nothing about whether
        that chemotherapy could have been left out. The chemotherapy-free combination has no PARP-only arm, so
        nothing in it separates the checkpoint inhibitor's contribution from the PARP inhibitor's.
      next: If chemotherapy is to come out, the other candidate for carrying the treatment is the immune response.
        Does adding a checkpoint inhibitor before surgery lower recurrence?
      trials:
      - brightness
      - geparola
      - neotala
      - petremac
      - tbcrc-056
    - id: SQ-0370
      ask: Does adding a checkpoint inhibitor to preoperative chemotherapy lower recurrence, and does it have
        to be given before surgery?
      rationale: Triple-negative tumours carry more tumour-infiltrating lymphocytes and more neoantigen than the
        other subtypes. Chemotherapy releases antigen as it kills. A checkpoint inhibitor given while the primary
        tumour and its draining nodes are still in place should prime a wider response than one given to a patient
        who has neither left.
      experiment: Several randomised additions of a checkpoint inhibitor to preoperative chemotherapy. They differ
        in the drug, in whether the backbone carried a platinum, and in whether the checkpoint inhibitor continued
        after surgery. Set against them, two trials gave a checkpoint inhibitor only after surgery, with no preoperative
        phase at all.
      finding: Adding a checkpoint inhibitor raised pathological complete response over the same chemotherapy
        with placebo in most of these trials. In the trial that also continued it after surgery, the event-free
        survival advantage held. A large trial of a different checkpoint inhibitor, given across both halves of
        the pathway, missed its primary endpoint. Both trials that waited until after surgery were negative.
      limitation: The practice-defining trial varies more than the checkpoint inhibitor. Its backbone carries
        a platinum. Its treatment continues after surgery. Neither of those was randomised separately, so the
        trial cannot say which part is load-bearing. The trial that ran no post-surgical phase reported a survival
        separation its own response endpoint did not support, on few events. Programmed death-ligand 1 expression
        did not select here the way it does in metastatic disease, and the co-primary analysis in the marker-positive
        population did not cross its boundary. The assay and its cut-point differ between these trials in any
        case. The adjuvant-only trials differ in drug and in population as well as in timing, so the case for
        the preoperative window is drawn between trials rather than inside one. Whether the post-surgical half
        is needed at all is only now being randomised, in patients who cleared their tumour, and has not reported.
      next: If the parts of the package were never randomised against each other, the first one to take out is
        the cytotoxic backbone. How much chemotherapy still has to sit underneath the checkpoint inhibitor?
      trials:
      - keynote522
      - impassion031
      - ispy2-pembro
      - geparnuevo
      - b59
      - impassion030
      - abrave
      - optimice
    - id: SQ-0380
      ask: How much chemotherapy still has to sit underneath the checkpoint inhibitor?
      rationale: The cytotoxic part of the regimen carries the cardiac risk, the leukaemia risk and most of the
        acute toxicity. If the platinum and the immune agent are doing the work, the anthracycline is a cost with
        nothing on the other side of it. Taken further, the same argument asks whether any chemotherapy is needed
        in a tumour that already has an immune infiltrate.
      experiment: One randomised comparison of an anthracycline-free platinum and taxane regimen against the same
        drugs followed by an anthracycline, with response as the endpoint. A single-arm version of the short regimen
        with a checkpoint inhibitor added. One trial that kept the anthracycline but moved it after surgery, and
        randomised the checkpoint inhibitor on what was left in front. A randomised trial of the short regimen
        against the standard one, with event-free survival as its endpoint, is running. At the far end, a chemotherapy-free
        trial gave checkpoint blockade alone to tumours selected by a lymphocyte cut-point.
      finding: Anthracycline-free regimens reach response rates close to those of the anthracycline-containing
        ones. Where the anthracycline was deferred until after surgery, the checkpoint inhibitor's response advantage
        did not appear. Checkpoint blockade with no chemotherapy at all cleared some lymphocyte-rich tumours completely.
        It did so at the price of frequent immune endocrinopathy in patients who were otherwise well.
      limitation: All of these read out at the operation. The one trial randomising the two regimens against an
        outcome has not reported. The anthracycline-free comparison is small and was powered for response, which
        is the endpoint already shown in this cell to move without survival moving with it. The trial that deferred
        the anthracycline has published only a secondary response endpoint, so it cannot be used to argue that
        the anthracycline was the missing ingredient. The chemotherapy-free trial ran window cohorts whose endpoint
        is a laboratory measure of immune activation, and only its selected surgical cohort carried a response
        endpoint. A lymphocyte score read on one slide against a percentage cut-point is a scoring convention,
        and that trial selected on it. Substituting one taxane formulation for another raised response in an all-comers
        trial and did not replicate in a trial restricted to HER2-negative disease, which is the standing reminder
        that a backbone change is not portable between populations.
      next: If response at the operation cannot license taking a drug out, what can a preoperative trial settle
        at all, and what has to wait for a randomised outcome trial?
      trials:
      - neostop
      - neopact
      - neotrip
      - scarlet
      - bellini
      - geparsepto-gbg-69
      - etna
    - id: SQ-0390
      ask: What can a preoperative trial settle about a new drug, and what has to wait for a randomised trial
        after surgery?
      rationale: The preoperative window is the fastest read in this disease. The tumour is still in place, the
        endpoint arrives at the operation, and paired biopsies make the mechanism visible. So it is the natural
        place to try a conjugate, a targeted addition or a physical primer, well before anyone commits to a trial
        with survival as its endpoint.
      experiment: An adaptive platform runs candidate agents against a shared chemotherapy control and graduates
        them on a Bayesian probability of success in a future trial. A conjugate was given alone in a single arm,
        with treatment after those cycles left to the treating physician. A JAK inhibitor was added to preoperative
        chemotherapy in inflammatory triple-negative disease, with a pharmacodynamic conversion as the primary
        endpoint. Preoperative radiation dose was randomised as an immune primer, with immunological endpoints.
        The randomised conjugate trials in this disease all sit after surgery, in patients with residual disease.
      finding: Conjugate monotherapy cleared a minority of untreated tumours. That is enough to say the class
        is active before surgery. It is not enough to say it belongs there. The JAK inhibitor hit its pharmacodynamic
        target while response in that rare population stayed low.
      limitation: A graduation probability is a prediction about a trial not yet done rather than a result. The
        conjugate trial is single-arm and response-guided, and what patients received afterwards was at their
        physician's discretion, so its event-free survival describes a pathway rather than a drug. The inflammatory
        trial enrolled very few patients, its response figure rests on a handful of events, and its run-in sits
        inside the randomisation rather than before it, so its two comparisons overlap. The radiation trial's
        endpoints are immunological and its dose comparisons are exploratory, so they do not rank doses for efficacy.
        None of the randomised conjugate trials asks a preoperative question, so there is no randomised basis
        for moving one in front of surgery.
      next: Does the conjugate stay behind surgery, where the residual-disease trials are already randomising
        it, or is a preoperative comparison against the standard regimen worth mounting first?
      trials:
      - ispy2
      - neostar
      - tbcrc-039
      - p-rad
      - ascent05
      - tropion-b03
      - sascia-gbg-102
  ST-080:
    setting: early
    subtype: TNBC
    stage: post-neoadjuvant
    title: Allocating further treatment on what surgery finds
    chapters:
    - BC-850
    premise: Nearly every stage II or III triple-negative cancer now meets chemotherapy before it meets a surgeon,
      which makes the operation a report on the drugs as well as a removal of the tumour. That report splits the
      cell in two, into a pathological complete response that rarely relapses and residual invasive disease that
      carries most of the events, arriving within a few years rather than over decades. Every question at this
      position is therefore about what to add, to whom, and on the strength of which measurement.
    questions:
    - id: SQ-0400
      ask: Does what surgery finds after neoadjuvant treatment identify who needs more treatment?
      rationale: Giving the same chemotherapy before surgery rather than after it does not change survival. The
        reason to give it first is that surgery then reports whether the drugs worked. In triple-negative disease
        that report separates the cell more sharply than anything measurable before treatment, because a complete
        response is common here and residual invasive disease relapses early.
      experiment: The foundational trials randomised the timing of chemotherapy, and then the addition of a taxane
        to it, with survival as the endpoint and pathological response recorded alongside. Later trials read the
        same response against outcome inside a platform design and inside a registration trial, where an agent
        and its shared control could be compared on both endpoints within one randomisation.
      finding: Response sorts the population steeply. Patients who clear the breast and the axilla relapse rarely.
        Residual disease accounts for most of the events. That sorting is prognostic within an arm. It has repeatedly
        failed to behave as a surrogate between arms, where an agent that raised the response rate did not go
        on to lower recurrence.
      limitation: The timing trials enrolled all comers before subtype was routinely recorded, so the response
        gradient they established is being read into a subtype they did not define. What counts as a complete
        response is a convention rather than a fact. The trials differ on whether residual in-situ disease disqualifies
        it. Residual cancer burden grades what that dichotomy discards. What the pathologist reports also depends
        on how the specimen and the post-chemotherapy axilla were sampled. Residual disease marks resistance to
        the regimen that was actually given, and it says nothing about drugs the tumour never met.
      next: If residual disease marks the population carrying the events, does giving those patients a further
        course of a different chemotherapy lower recurrence?
      trials:
      - nsabp-b-18
      - nsabp-b-27
      - ispy2
      - keynote522
      - b59
      - neotrip
    - id: SQ-0410
      ask: Does a further course of chemotherapy after surgery lower recurrence in residual triple-negative disease?
      rationale: A tumour still present after a full anthracycline and taxane course has demonstrated resistance
        to both classes in the patient it is growing in. The interval before relapse is short, so anything that
        will work has to be given now. A fluoropyrimidine is not cross-resistant with either class and is tolerable
        enough to start soon after surgery.
      experiment: Residual HER2-negative disease after neoadjuvant anthracycline, taxane or both was randomised
        to capecitabine or to no further chemotherapy, with disease-free survival as the endpoint. The same drug
        was tested separately in populations selected by stage rather than by response, once as a conventional
        course after standard adjuvant chemotherapy and once as a metronomic year.
      finding: Capecitabine for residual disease lowered recurrence and death. The triple-negative subgroup carried
        the effect. In the populations not selected by response the same drug missed its endpoint in one trial
        and met it in the other, and those two differed in dose, schedule and duration.
      limitation: The residual disease trial stopped early at an interim analysis that had met its endpoint, which
        is exactly the circumstance in which an effect is most likely to be overstated. Its triple-negative result
        is a subgroup of a HER2-negative trial rather than a trial in this cell. It was run where neither carboplatin
        nor a checkpoint inhibitor formed part of neoadjuvant treatment, so its control arm is a patient nobody
        now treats. The basal and non-basal gradient reported in the response-unselected trial is an interaction
        test on a centrally scored phenotype, not a randomised allocation by that phenotype.
      next: If a fluoropyrimidine is the benchmark, is it the right cytotoxic, or would a platinum do better against
        tumours selected for having survived a taxane?
      trials:
      - create-x
      - ciboma
      - sysucc001
    - id: SQ-0420
      ask: Is a platinum a better post-neoadjuvant cytotoxic than capecitabine for residual disease?
      rationale: Triple-negative tumours carry defects in homologous recombination often enough to give a DNA-crosslinking
        agent a mechanistic claim on them. Adding carboplatin before surgery raises the pathological response
        rate. If it works on the tumour while it is still in the breast, it ought to work on what is left of it.
      experiment: Residual disease above a size threshold was randomised to a platinum or to capecitabine as a
        non-inferiority design. Subtype was assigned by a multigene classifier run on the residual tissue, and
        the primary comparison was prespecified in the basal group.
      finding: Platinum did not prove non-inferior. The estimate ran against it. Toxicity was worse. The monitoring
        committee closed the trial well short of its planned enrolment. Outcome in both arms was poor.
      limitation: A non-inferiority trial closed before it has its events can show neither non-inferiority nor
        inferiority, and this one read a fraction of the information it was designed for, so similar-looking estimates
        would not have settled anything either. The classifier was run on tissue that had already been through
        chemotherapy, so the subtype defining the analysis population is a measurement made after selection rather
        than a property of the tumour that was enrolled. The size threshold narrows the population further, and
        residual disease below it is not represented. The case for platinum came from trials in chemotherapy-naive
        tumours, which is precisely the extrapolation at issue.
      next: If choosing the cytotoxic by histology has run out, does choosing a drug by the tumour's inherited
        genotype do better?
      trials:
      - geparsixto
      - calgb40603
      - ea1131
      - create-x
    - id: SQ-0430
      ask: Does a PARP inhibitor lower recurrence in germline BRCA carriers left with residual disease?
      rationale: A germline BRCA1 or BRCA2 loss is a repair defect the tumour cannot work around, and PARP inhibition
        is lethal in that background. Carriers are over-represented in triple-negative disease. The carriers at
        highest risk are the ones whose tumours survived neoadjuvant chemotherapy.
      experiment: High-risk HER2-negative germline carriers were randomised after local treatment and chemotherapy
        to a year of olaparib or to placebo, with invasive disease-free survival as the endpoint. High risk was
        met either by residual disease after neoadjuvant chemotherapy or by stage in patients who had surgery
        first.
      finding: Olaparib lowered invasive and distant recurrence. The advantage held, and it became an overall
        survival difference on longer follow-up.
      limitation: The two routes into the trial are not one population, and the trial was not designed to separate
        them, so what the drug is worth specifically in residual triple-negative disease is an inference from
        a stratified trial rather than a result of it. Selection was germline, which leaves outside the result
        the larger group of triple-negative tumours with a BRCA-like phenotype and no inherited variant. Attempts
        to identify that group by a repair-deficiency score have not predicted response to a platinum, and in
        carriers themselves a platinum did not outperform an anthracycline before surgery, so the genotype does
        not simply mean platinum sensitivity. Enrolment also largely preceded the checkpoint inhibitor, so nothing
        here says how olaparib sits alongside adjuvant pembrolizumab or alongside capecitabine.
      next: Since every benchmark at this position was set before the checkpoint inhibitor entered neoadjuvant
        treatment, does that drug have to continue after surgery at all?
      trials:
      - olympia
      - create-x
      - inform
      - tbcrc-030
    - id: SQ-0440
      ask: Does checkpoint blockade have to continue after surgery?
      rationale: The registration trial gave pembrolizumab before and after surgery inside a single randomisation,
        so it cannot say which half of the schedule produced the benefit. There is reason to think the halves
        are not equivalent. Before surgery the antigen and the infiltrating lymphocytes are still in the breast.
        Afterwards they are not. The adjuvant phase also carries most of the endocrinopathy, and that is permanent.
      experiment: 'Three trials asked the adjuvant-only version directly: an antibody added to adjuvant chemotherapy
        in patients operated first, a year of a different antibody after surgery in high-risk disease with a residual
        disease stratum as a co-primary population, and a third antibody continued across surgery on a carboplatin-containing
        backbone. A fourth trial randomises omission of the adjuvant phase in patients who achieved a complete
        response.'
      finding: Checkpoint blockade begun after surgery has not lowered recurrence. The trial in patients operated
        first was halted for futility with its estimate on the wrong side. The trial with the residual disease
        stratum missed both co-primary endpoints. The trial that did include a neoadjuvant phase missed as well.
        The omission trial has not reported.
      limitation: None of these is the experiment the clinic needs, which is randomised omission of the adjuvant
        phase in patients who have already had the neoadjuvant phase. They use different antibodies on different
        chemotherapy backbones, so they are not replicates of one another and a negative result in one does not
        transfer. The survival comparison favouring avelumab was descriptive and sat outside the testing hierarchy,
        so it is not a positive result recovered from a negative trial. The trial that continued its antibody
        across surgery had carboplatin in both arms, so nothing in it separates the antibody from the backbone.
      next: Since the adjuvant phase is nevertheless now the control arm in every residual disease trial, can
        anything beat that control?
      trials:
      - keynote522
      - impassion030
      - abrave
      - b59
      - optimice
    - id: SQ-0450
      ask: Can an antibody-drug conjugate displace capecitabine as the treatment for residual disease?
      rationale: The capecitabine benchmark was set in patients who had received neither carboplatin nor a checkpoint
        inhibitor, so the group left with residual disease today has already survived more than the group in which
        that benchmark was measured. Conjugates deliver a topoisomerase-I payload to antigens expressed on most
        triple-negative tumours, and they work in pretreated metastatic disease. Residual disease is the earliest
        point at which that activity can be aimed at a population still curable.
      experiment: Three randomised trials are open. Two compare a conjugate, with or without a checkpoint inhibitor,
        against physician's or investigator's choice of pembrolizumab with or without capecitabine. The third
        compares a conjugate against physician's choice in residual HER2-negative disease, in separate hormone
        receptor-positive and triple-negative cohorts. A single-arm neoadjuvant study had already shown that a
        conjugate alone produces pathological responses in untreated disease.
      finding: Nothing has reported. What is on the record is design, rationale and a single-arm signal, and it
        should be read as that and nothing more.
      limitation: A design paper is not an efficacy result and must never be cited as one. The comparator in each
        trial is a choice rather than a fixed regimen, so the control is a mixture that will drift as practice
        drifts, and a difference against it is harder to attribute than a difference against a named drug. The
        trial spanning hormone receptor-positive and triple-negative residual disease has to be read by cohort,
        because the two differ in biology and in what their choice arm is likely to contain. The single-arm study
        left subsequent systemic treatment to the treating physician, so its later outcomes describe a whole pathway
        rather than the conjugate.
      next: If a conjugate, a PARP inhibitor and a checkpoint inhibitor each prove themselves against a control
        arm that contained neither of the other two, on what evidence does a clinic give one carrier with residual
        disease all three?
      trials:
      - ascent05
      - tropion-b03
      - sascia-gbg-102
      - create-x
      - neostar
  ST-090:
    setting: metastatic
    subtype: HR+/HER2-
    stage: 1L
    title: Choosing the first-line regimen and the moment to leave it
    chapters:
    - BC-880
    - BC-870
    premise: 'Nearly every patient in this cell has a first option that works and is tolerable. The disease is
      still incurable, so the drug that is not given now will usually be given later. That makes the arguments
      here about allocation rather than about activity: what belongs in the first regimen, what can be held back
      for the second, and what signal should end the first line.'
    questions:
    - id: SQ-0460
      ask: Does adding a CDK4/6 inhibitor to first-line endocrine therapy do more than endocrine therapy alone?
      rationale: Oestrogen drives proliferation through cyclin D and the CDK4 and CDK6 kinases, so the receptor
        and the cell cycle sit on one line. Endocrine monotherapy holds first-line disease for a while and then
        stops holding it. Blocking the kinases downstream of the receptor was expected to deepen that control
        and to delay the escape rather than to work around it.
      experiment: Placebo-controlled addition of an inhibitor to the endocrine therapy the patient would have
        received anyway, in endocrine-sensitive disease untreated for the advanced stage. The trials differ in
        the agent, in the endocrine partner, and in whether the population was postmenopausal or premenopausal
        with ovarian suppression.
      finding: Every one of these trials lengthened time to progression against the same endocrine therapy given
        alone. The progression results sit close enough together across the agents in wide use to read as one
        class effect. The survival results do not, and the disagreement falls along the agent rather than along
        the design.
      limitation: No trial here compared one inhibitor with another, and none is planned, so the survival column
        is a set of across-trial contrasts. None of these trials carried overall survival as its primary endpoint,
        which makes every survival result a secondary one from a trial powered for progression. They also differ
        in endocrine partner, in enrolment year and in what patients were allowed afterwards. One of them enrolled
        a population mixing first and second line, so it speaks less cleanly to this question than the rest. A
        fourth agent was tested in one country and is licensed there only.
      next: If the combination beats endocrine therapy alone in the first line, is that because the inhibitor
        was given first, or only because it was given at all?
      trials:
      - paloma-1-trio-18
      - paloma2
      - monaleesa2
      - monaleesa7
      - monaleesa3
      - monarch3
      - dawna-2
    - id: SQ-0470
      ask: Does the CDK4/6 inhibitor have to be given in the first line, or can it be held back for the second?
      rationale: The first-line trials compared a regimen containing the inhibitor against one without it. That
        is not the choice a clinic faces, because almost every patient will receive the drug at some point. What
        is being chosen is where in the sequence to spend it, and spending it first commits the patient to continuous
        treatment and monitoring while the disease is still endocrine-sensitive.
      experiment: One randomised trial allocated untreated advanced disease to two strategies rather than to two
        drugs. The inhibitor with an aromatase inhibitor first and endocrine monotherapy second, against endocrine
        monotherapy first and the inhibitor with fulvestrant second. The endpoint ran from randomisation to the
        second progression, because any within-line endpoint would necessarily favour the arm given two drugs
        first.
      finding: Neither the across-line endpoint nor overall survival separated the two strategies. The early strategy
        delivered far more inhibitor exposure than the deferred one, and more high-grade toxicity with it. Analyses
        inside the trial point to premenopausal patients and to patients with high baseline aneuploidy as possible
        exceptions.
      limitation: The endpoint that makes this a strategy trial also stops it answering a within-line question,
        so nothing in it contradicts the first-line trials on their own terms. The inhibitor was the investigator's
        choice, so the result travels only as far as the agents actually used, and those agents do not carry the
        same survival evidence. The premenopausal signal is post hoc. The aneuploidy signal was prespecified and
        is still not a randomised allocation rule, because nobody was randomised to strategy within a marker-defined
        group. Nobody was excluded for disease tempo, so the trial says nothing about the patient who needs a
        response now.
      next: If deferral costs nothing on average, does it cost something in the patient whose disease is moving
        fast enough that chemotherapy is being considered?
      trials:
      - sonia
      - monaleesa2
      - paloma2
      - monarch3
      - paloma3
      - monarch2
    - id: SQ-0480
      ask: Can endocrine therapy with a CDK4/6 inhibitor replace chemotherapy when the disease is moving fast?
      rationale: Aggressive visceral disease is where clinicians reach for chemotherapy first, on the belief that
        only cytotoxic treatment produces a response quickly enough to matter. That belief was formed against
        the slow and partial responses of endocrine monotherapy. The combination changes both the response rate
        and how quickly the response arrives, so the belief was worth testing rather than carrying forward.
      experiment: A randomised comparison of ribociclib with endocrine therapy against investigator's choice combination
        chemotherapy, in first-line disease the investigator judged aggressive enough to warrant chemotherapy.
        Alongside it, two trials set an inhibitor with endocrine therapy against capecitabine, one in premenopausal
        patients with ovarian suppression and one in aromatase inhibitor-resistant disease. A further trial randomises
        immediate abemaciclib with endocrine therapy against a short course of paclitaxel given before the same
        combination.
      finding: In aggressive first-line disease the endocrine combination held the disease longer than combination
        chemotherapy did. Time to response was not the disadvantage the practice had assumed. Against capecitabine
        the answer depends on the population. In premenopausal patients the combination won. In aromatase inhibitor-resistant
        disease it did not beat capecitabine.
      limitation: The aggressive-disease trial was a phase II. Its comparator was a combination chemotherapy regimen
        rather than the sequential single agents many clinics would use, which is a comparator chosen for toxicity
        as much as for efficacy. Entry turned on the investigator's judgement that chemotherapy was indicated
        rather than on a stated visceral crisis threshold, so the population is defined by a decision rather than
        by a measurement and cannot be reproduced from a protocol. Of the two capecitabine trials, one enrolled
        a population only half of whom were untreated for metastatic disease, and the other was not first line
        at all. The induction trial has no verified peer-reviewed result on the record, so nothing about giving
        chemotherapy before the combination can be read from it yet, and an early response to induction is not
        an answer for every urgent presentation. Its eligibility and its exact sequence have to travel with it
        whenever it is cited.
      next: If the endocrine combination can carry disease this aggressive, is an aromatase inhibitor still the
        right endocrine half of it?
      trials:
      - right-choice
      - young-pearl-kcsg-br15-10
      - pearl
      - abigail
    - id: SQ-0490
      ask: Which endocrine partner should the first-line inhibitor be given with?
      rationale: An aromatase inhibitor lowers the ligand and leaves the receptor standing. A degrader removes
        the receptor itself, which should matter more as the receptor rather than the ligand becomes the limiting
        step. The comparison is an old one, and it was settled in a backbone that no longer exists in clinic.
      experiment: Fulvestrant was compared with anastrozole as first-line monotherapy in endocrine-naive advanced
        disease, first in a phase II and then in a phase III. Two further trials added fulvestrant to anastrozole
        instead of substituting it. Three phase III trials now put an oral degrader against an aromatase inhibitor
        with the same CDK4/6 inhibitor in both arms, which is the substitution question asked in the backbone
        actually used.
      finding: Substituting fulvestrant for the aromatase inhibitor lengthened time to progression in endocrine-naive
        disease in the phase III. The phase II that preceded it did not meet its own clinical benefit endpoint.
        Adding fulvestrant to anastrozole gave a gain in one trial and nothing in the other. The three degrader
        trials with an inhibitor in both arms have not reported.
      limitation: Every reported trial in this comparison used an endocrine backbone with no CDK4/6 inhibitor
        in it, so it answers a question about monotherapy and not about the combination now given. The two addition
        trials disagree and differ in how much adjuvant endocrine therapy their populations had already had, so
        the disagreement has an explanation that is not the drug. Both of them also used the lower fulvestrant
        dose, which a separate randomised comparison later showed was the wrong one, so the addition question
        was asked at a dose nobody now prescribes. The phase II's survival analysis was added by protocol amendment
        after the progression results were known and is not a prespecified comparison.
      next: If the aromatase inhibitor is the part of the backbone under which the receptor mutates, should it
        be replaced when the mutation appears rather than at the start for everyone?
      trials:
      - first
      - falcon
      - swog-s0226
      - fact
      - confirm
      - serena4
      - persevera
      - veritac3
    - id: SQ-0500
      ask: Should a rising ESR1 mutation end the first line before the scan does?
      rationale: ESR1 mutations are selected by oestrogen deprivation and leave the receptor active without ligand,
        which is why an aromatase inhibitor stops working while a degrader still has a target. The mutation is
        detectable in blood months before radiological progression. That interval is an opportunity if acting
        inside it changes anything, and a source of premature treatment change if it does not.
      experiment: Two trials sampled blood serially during first-line treatment and randomised only those patients
        whose ESR1 mutation rose while the disease was still controlled radiologically. One swapped the aromatase
        inhibitor for fulvestrant and kept palbociclib. The other swapped it for an oral degrader and kept whichever
        inhibitor the patient was already taking. Both left the control arm on the aromatase inhibitor the tumour
        had already learned to ignore.
      finding: Switching at the molecular signal lengthened progression-free survival measured from that randomisation
        in both trials. The receptor-directed drugs tested after clinical progression point the same way and show
        the same dependence on ESR1 status, which is what makes the mechanism credible rather than the timing.
      limitation: Neither trial randomised the comparison a clinic actually weighs, which is making the same switch
        at clinical progression. The control arm continued a treatment already known at the molecular level to
        be failing, so the contrast is against something close to inert. The endpoint is progression on the new
        line measured from the molecular randomisation, which is a surrogate for what the strategy is worth across
        the whole line and is a clock that starts at a point chosen by an assay. The population is defined by
        that assay and its threshold, so molecular progression here is a laboratory convention as much as a biological
        event, and patients whose resistance takes another route never enter. An earlier trial that switched treatment
        on a persistent blood marker rather than on a scan did not improve survival, which is the reason this
        design needs an outcome and not only a progression result.
      next: If a resistance mechanism that appears during treatment can be acted on before it causes progression,
        should an alteration present from the start change the first regimen itself?
      trials:
      - pada1
      - serena6
      - swog-s0500
      - emerald
      - veritac2
      - ember3
    - id: SQ-0510
      ask: Should the first-line regimen be chosen by the tumour's pathway alterations rather than given as one
        combination to everyone?
      rationale: PIK3CA, AKT1 and PTEN alterations mark disease that escapes endocrine control early, and a germline
        BRCA mutation marks a repair defect that a different class exploits. Both have been treated as later-line
        problems, addressed once the standard first line has failed. If the alteration is already there at presentation,
        waiting for it to cause progression spends the best line of treatment on a regimen the tumour is equipped
        to escape.
      experiment: One trial took patients whose disease relapsed on or soon after adjuvant endocrine therapy and
        carried a PIK3CA mutation, and added a PI3K-alpha inhibitor to palbociclib with fulvestrant against the
        same doublet with placebo. Trials of AKT inhibition added to an inhibitor with fulvestrant, and of a PARP1-selective
        inhibitor with a degrader replacing the inhibitor in germline BRCA-mutated disease, are running. The pathway
        drugs themselves were established after progression, each against endocrine therapy alone in a marker-defined
        population.
      finding: Adding the PI3K-alpha inhibitor to the first-line doublet lengthened both progression-free and
        overall survival in that selected population. The later-line trials of the same pathway established a
        progression benefit in marker-defined disease without establishing a survival benefit. Selection by anything
        other than a PIK3CA mutation is so far a design rather than a result.
      limitation: The first-line triplet population was selected twice, by the mutation and by relapse on or within
        a year of adjuvant endocrine therapy, so it is a narrow and unusually resistant slice of the first line.
        The result does not transfer to a mutation-positive patient with a long treatment-free interval, and no
        trial has tested it in one. The comparison is a triplet against a doublet, so added toxicity is part of
        what is being traded and no arm isolates the pathway inhibitor from the cell cycle drug. No arm held the
        pathway inhibitor back to progression, so first-line intensification has never been compared with the
        same drug given later, which is the question the deferral trial asked of the CDK4/6 inhibitor.
      next: Does first-line intensification by biology survive the test that was applied to the CDK4/6 inhibitor,
        an endpoint that runs across both lines rather than within the first?
      trials:
      - inavo120
      - solar1
      - capitello291
      - capitello292
      - evopar-breast01
  ST-100:
    setting: metastatic
    subtype: HR+/HER2-
    stage: later
    title: Choosing the next treatment after CDK4/6 inhibition fails
    chapters:
    - BC-880
    premise: 'Everyone who reaches this cell has already had a CDK4/6 inhibitor with endocrine therapy, so the
      question is no longer whether to give one. It is what the disease has become on it. Resistance here is seldom
      loss of the drug''s target: it is more often the oestrogen receptor rewritten so that it works without its
      ligand, a parallel pathway carrying the proliferative signal, or a clone that has stopped depending on oestrogen
      at all. The first two are still endocrine problems. The third is not. These questions run in that order,
      from what to change inside the endocrine regimen to when to give it up.'
    questions:
    - id: SQ-0520
      ask: Is there anything left to gain from CDK4/6 inhibition after the disease has progressed on a CDK4/6
        inhibitor?
      rationale: Resistance to this class is rarely the loss of its target. Retinoblastoma protein is still expressed
        in most tumours that progress, and much of what fails is the endocrine half of the combination. If that
        is right, the combination failed at the receptor rather than at the kinase, and the kinase is still worth
        blocking.
      experiment: Four randomised trials gave a CDK4/6 inhibitor with endocrine therapy after progression on a
        CDK4/6 inhibitor, against the same endocrine therapy alone. Two switched to a different inhibitor from
        the one that had failed. Two continued or restarted the same one. Two single-arm studies asked the same
        question without a control, one by rechallenging with the failed inhibitor and one by adding an mTOR inhibitor
        to continued inhibition.
      finding: The trials that switched to a different inhibitor lengthened progression-free survival against
        endocrine therapy alone. The trials that kept the same inhibitor did not, whether it was continued without
        a break or restarted after one. Where a gain exists it is a fraction of what the same class bought when
        it was given in the first line.
      limitation: Almost every patient in these trials had progressed on palbociclib, so the comparison is between
        a second inhibitor and none in a sequence that begins with the weakest of the three, and it does not transfer
        to a clinic that begins with ribociclib or abemaciclib. The trial with the largest effect switched the
        endocrine partner in the same arm as the inhibitor, so neither change can be credited on its own. The
        control arm throughout is endocrine monotherapy started at progression, which does very little, and the
        single-arm studies have no control at all; the resistance signature one of them proposes was scored on
        retinoblastoma protein staining in very few tumours and is a hypothesis about a biomarker rather than
        a test of one.
      next: If switching the inhibitor buys only a little, and if switching the endocrine partner may be doing
        part of that work, what should the endocrine partner be once an aromatase inhibitor has failed?
      trials:
      - maintain
      - postmonarch
      - pace
      - palmira
      - triniti-1
      - bioper
    - id: SQ-0530
      ask: What should the endocrine partner be once an aromatase inhibitor with a CDK4/6 inhibitor has failed?
      rationale: Oestrogen deprivation selects for ESR1 mutations that hold the receptor in an active conformation
        with no ligand bound. An aromatase inhibitor cannot reach a receptor that no longer needs its ligand.
        Fulvestrant can, but only at the exposure an intramuscular injection allows. An orally bioavailable degrader
        was meant to solve both problems at once.
      experiment: Randomised comparisons of an oral degrader against standard endocrine monotherapy, almost always
        fulvestrant, in disease that had progressed on a CDK4/6 inhibitor. Several prespecified the ESR1-mutant
        population, called from plasma, as a co-primary population alongside all patients. One trial also randomised
        the degrader with and without a CDK4/6 inhibitor.
      finding: The agents that prespecified the mutant population showed a gain in progression-free survival there
        against endocrine monotherapy, and little or none in the population unselected for the mutation. Two degraders
        tested without that selection missed their primary endpoint against endocrine monotherapy. The degrader
        given with a CDK4/6 inhibitor beat the same degrader alone.
      limitation: The comparator throughout is endocrine monotherapy in disease that has just progressed on endocrine
        therapy, where it performs poorly, so these trials establish superiority over a weak control and not a
        rank order among the degraders, none of which has been compared with another. ESR1 status was read from
        circulating tumour DNA at each assay's own limit of detection, so the mutant and wild-type groups are
        set by a sequencing threshold rather than by a boundary in the biology, and a tumour called wild-type
        may carry a subclone below it. The trial that added a CDK4/6 inhibitor to a degrader did not require prior
        exposure to that class for the comparison, so it does not settle the continuation question.
      next: If the receptor still drives only the part of this population whose receptor carries a mutation, what
        drives the rest?
      trials:
      - emerald
      - veritac2
      - ember3
      - serena2
      - acelera
      - ameera3
    - id: SQ-0540
      ask: Does blocking the PI3K, AKT and mTOR axis restore endocrine sensitivity?
      rationale: This pathway is the best-documented route by which a hormone receptor-positive tumour keeps proliferating
        while its receptor is blocked. Activating PIK3CA mutations are common at diagnosis and are enriched under
        treatment. Loss of PTEN and activating AKT1 mutations reach the same node from other directions. Blocking
        the node should return the cell to depending on oestrogen.
      experiment: 'Randomised additions of an inhibitor to fulvestrant or exemestane at each level of the pathway:
        mTOR, PI3K-alpha, AKT, and PI3K with mTOR together. They differ in how the pathway alteration entered
        the design. Some required it for entry, some prespecified the altered patients as a cohort inside an unselected
        trial, and one kept the CDK4/6 inhibitor running alongside. A single-arm cohort was built to show that
        the alpha inhibitor still worked in disease that had already had a CDK4/6 inhibitor.'
      finding: Every level of the pathway produced a gain in progression-free survival over the endocrine partner
        alone. The gain is larger in tumours carrying an alteration in the pathway than in those without one.
        It is bought with hyperglycaemia, rash, stomatitis and diarrhoea, which decide how much of it a patient
        actually receives.
      limitation: Whether the genotype was an entry criterion, a prespecified cohort or a subgroup read out afterwards
        differs from trial to trial, and that difference, rather than the drug, decides how much of each estimate
        is selection. Alterations were called centrally on tissue in some trials and on circulating tumour DNA
        in others, and the two do not identify the same patients. The largest recent effect belongs to the wild-type
        cohort of a trial whose mutant cohort has not reported, against a fulvestrant control that did almost
        nothing, and the only head-to-head comparison of two alpha inhibitors is still running. The cohort study
        that carried the alpha inhibitor into post-CDK4/6 disease has no control arm, and its report carries a
        published expression of concern.
      next: If an alteration in this pathway is what makes a targeted addition worth giving, what should be done
        with the other alterations a sequencing report returns at progression?
      trials:
      - bolero2
      - solar1
      - bylieve
      - faktion
      - capitello291
      - viktoria1
      - inavo121
      - inavo120
    - id: SQ-0550
      ask: Does an activating HER2 mutation found at progression change what to give?
      rationale: A small fraction of these tumours carry an activating mutation in ERBB2, and the fraction rises
        after endocrine therapy. The mutation switches the receptor on without raising its copy number, so immunohistochemistry
        and in situ hybridisation both report the tumour as HER2-negative. A receptor activated by mutation should
        still be blockable at its kinase.
      experiment: Cohorts inside basket studies gave an irreversible HER2 kinase inhibitor to patients whose tumours
        carried an activating HER2 mutation without amplification, with fulvestrant added for hormone receptor-positive
        disease. One of them also ran arms of fulvestrant alone and of fulvestrant with trastuzumab. Another paired
        a selective HER2 kinase inhibitor with trastuzumab.
      finding: Responses occurred, in a population defined by the mutation rather than by amplification. In the
        study that carried comparison arms, neither fulvestrant alone nor fulvestrant with the antibody produced
        a response, which places the activity in the kinase inhibitor rather than in the endocrine partner.
      limitation: These are small single-arm cohorts inside basket studies, reported at a wider confidence convention
        than the rest of the registry uses, so each gives an estimate of activity and no comparison against what
        a clinic would otherwise give. They pool mutations in different domains of the receptor, which do not
        all respond alike, and the mutation was called by whatever assay the enrolling centre happened to run.
        One cohort enrolled hormone receptor-positive and hormone receptor-negative disease together, gave fulvestrant
        only to the first group, and reports no split between them.
      next: If selecting on a genotype is what makes a small study work, what became of the resistance hypotheses
        that were tested with no marker to select on?
      trials:
      - summit
      - muther
      - sgntuc-019
    - id: SQ-0560
      ask: Do the resistance mechanisms tested without a selecting biomarker give anything back?
      rationale: Not every proposed mechanism of endocrine resistance arrives with a marker to enrich for. Apoptotic
        priming through BCL2, mitotic dependence through Aurora A kinase, epigenetic silencing of the receptor,
        and the androgen receptor as an alternative nuclear receptor were each argued from laboratory work. Each
        named a drug that could be added to endocrine therapy, or given in its place, in disease that had already
        failed on endocrine therapy.
      experiment: Randomised additions to fulvestrant or exemestane after endocrine failure, most of them after
        CDK4/6 failure as well. One trial instead randomised two doses of an androgen receptor agonist against
        each other. The endpoints were clinical benefit rate, response rate or progression-free survival rather
        than survival.
      finding: None of the randomised comparisons improved on its endocrine control. The one trial that produced
        responses produced them in both of its arms, because both arms contained the experimental drug.
      limitation: Each of these is negative about the combination and the schedule it tested and not about the
        mechanism, because none of them selected patients on the marker its own hypothesis names; the BCL2 trial's
        biomarker-defined subgroups were exploratory and small. The Aurora A trial randomised only whether fulvestrant
        was added to the inhibitor, so the activity of the inhibitor itself has no control anywhere in that trial
        and remains a single-arm observation. The epigenetic trial enrolled mostly patients who had never had
        a CDK4/6 inhibitor, so it tested reversal of aromatase inhibitor resistance rather than of resistance
        to the combination, and the androgen trial had no standard-therapy arm at all and assessed its primary
        endpoint only in the patients whose androgen receptor positivity was confirmed centrally after randomisation.
      next: If nothing on offer restores dependence on the oestrogen receptor, when should endocrine-directed
        treatment be given up for cytotoxic treatment?
      trials:
      - veronica
      - tbcrc-041
      - e2112
      - enobosarm
    - id: SQ-0570
      ask: When should endocrine-directed treatment give way to chemotherapy or an antibody-drug conjugate?
      rationale: The convention is to hold cytotoxic treatment back while any endocrine option remains, because
        endocrine treatment is easier to live with. The convention assumes the remaining endocrine option still
        works, which after a CDK4/6 inhibitor is exactly what is in doubt. A conjugate was meant to move that
        threshold, by delivering a cytotoxic payload only to cells carrying a surface antigen.
      experiment: Two trials randomised a CDK4/6 inhibitor with endocrine therapy against capecitabine in endocrine-resistant
        disease. Two more randomised a TROP2-directed conjugate against chemotherapy of the physician's choice.
        One asked whether adding a checkpoint inhibitor to such a conjugate helped. A single-arm study took a
        HER3-directed conjugate into the same setting.
      finding: The two capecitabine trials disagree with each other, and the disagreement follows their populations
        rather than their drugs. Both TROP2-directed conjugates lengthened progression-free survival against physician's
        choice chemotherapy, and only one of the two also lengthened overall survival. Adding a checkpoint inhibitor
        to a conjugate added nothing to progression-free survival. The HER3-directed conjugate produced responses
        in a single arm after CDK4/6 inhibition and chemotherapy.
      limitation: Neither capecitabine trial belongs to this cell as it stands, because both were giving a CDK4/6
        inhibitor to patients who had never had one, and they differ from each other in menopausal status and
        in how much of the population had had any treatment for metastatic disease, which is enough to explain
        the disagreement without invoking the drugs. Physician's choice is a different set of agents in each conjugate
        trial and in each country, so the comparator is not a fixed quantity across them. A progression-free survival
        gain that is not followed by a gain in overall survival is a difference measured on imaging, and the conjugate
        whose survival curves lay on top of each other is the warning the class has to answer. The checkpoint
        result that looks positive is a secondary analysis confined to the patients with evaluable tissue that
        scored PD-L1-positive, and it is not significant.
      next: If a conjugate beats chemotherapy after endocrine treatment has failed, does it belong ahead of the
        first chemotherapy line, and what is left to give once it has been spent there?
      trials:
      - pearl
      - young-pearl-kcsg-br15-10
      - tropics02
      - tropion-b01
      - saci-io-hr
      - icarus-breast01
      - ascent07
  ST-110:
    setting: metastatic
    subtype: HR+/HER2-
    stage: later
    title: Molecular exceptions to the endocrine sequence
    chapters:
    - BC-870
    - BC-890
    premise: Almost everything in this cell moves along one path. Endocrine therapy with CDK4/6 inhibition, then
      whatever endocrine option the resistance mechanism still allows, then conjugates and chemotherapy. A small
      number of these tumours carry an alteration that puts a different drug in front of them, and not one of
      those alterations is reported by the assays that assign hormone receptor and HER2 status, so each is found
      only if someone goes looking for it. The trials that test them are correspondingly small, biomarker-selected
      and mostly single-arm, which is the thing this story has to read around.
    questions:
    - id: SQ-0580
      ask: Does an activating HER2 mutation make a HER2-negative tumour treatable with HER2-directed therapy?
      rationale: HER2 status is assigned by protein overexpression and by gene copy number. An activating mutation
        switches the receptor on without amplifying it, so a tumour can signal through HER2 and still score negative
        on the test that decides who is offered HER2-directed treatment. If the drug answers to the signalling
        rather than to the copy number, the conventional assay is looking for the wrong thing in these patients.
      experiment: 'Three mutation-selected cohorts gave HER2-directed treatment to disease that was HER2-negative
        on conventional local testing: neratinib with fulvestrant and trastuzumab, neratinib with fulvestrant
        in cohorts split by previous fulvestrant exposure, and tucatinib with trastuzumab with fulvestrant added
        for hormone receptor-positive patients. Selection was on the mutation in every case, never on amplification
        or on protein expression.'
      finding: Responses occur, and in a minority they last. They appear across several different mutations of
        the receptor, in the kinase and the extracellular domain, and in lobular as well as ductal disease. Selecting
        on the mutation identifies a treatable population that the amplification assay does not see.
      limitation: Every cohort here is single-arm apart from one small randomised substudy inside a basket trial,
        and that substudy set the triplet against fulvestrant-based arms rather than against the chemotherapy
        these patients would otherwise be offered. The tucatinib cohort is one arm of a solid-tumour basket and
        reports its interval at a wider confidence level than the rest of the registry, so its response rate does
        not sit beside the others as a like comparison. Mutations are pooled within each trial, so none of them
        can say which alleles respond. One alteration class looked worse than the rest in an analysis far too
        small to act on.
      next: Is the mutant receptor an independent driver, or an escape route out of oestrogen dependence that
        hands the tumour back to the endocrine agent once it is blocked?
      trials:
      - summit
      - muther
      - sgntuc-019
    - id: SQ-0590
      ask: Does blocking a mutant HER2 restore endocrine sensitivity, or does it work without the endocrine partner?
      rationale: HER2 mutations are enriched at relapse on endocrine treatment and in lobular disease. That pattern
        reads as a route out of oestrogen dependence rather than as a driver that arrived on its own. If it is
        a route out, blocking the receptor should return the tumour to the endocrine agent that had stopped working,
        and the two drugs are then not separable.
      experiment: One basket study randomised patients carrying a HER2 mutation between fulvestrant alone, fulvestrant
        with trastuzumab, and the triplet adding neratinib, with crossover permitted at progression. Another asked
        the same question by exposure history instead of by randomisation, treating a fulvestrant-pretreated cohort
        separately from a fulvestrant-naive one.
      finding: Neither fulvestrant alone nor fulvestrant with trastuzumab produced a response. Patients who crossed
        over to the triplet did respond. Clinical benefit appeared in the fulvestrant-pretreated cohort as well
        as the naive one, so previous failure of fulvestrant does not exclude benefit from a combination that
        contains it.
      limitation: The randomised substudy shows that the fulvestrant-based control arms were inert in this population.
        It cannot measure what neratinib adds, because no arm gave neratinib without fulvestrant. Neratinib alone
        was given only in an oestrogen receptor-negative cohort, which is a different population and the smallest
        of the three. The two oestrogen receptor-positive cohorts were never randomised against each other and
        differ in treatment history in every other respect as well. The tucatinib cohort withheld fulvestrant
        from its hormone receptor-negative patients but reports no split between the two groups, so the one within-trial
        comparison available is not recoverable.
      next: The shape here is general. A genomic test nominates a target, a drug is given, and the response rate
        is read against nothing. Does that reasoning hold where the target is a DNA repair gene and a licensed
        drug class already exists for one version of the defect?
      trials:
      - summit
      - muther
      - sgntuc-019
    - id: SQ-0600
      ask: Does PARP sensitivity extend beyond a germline BRCA mutation?
      rationale: The licence for PARP inhibition is written around germline BRCA1 and BRCA2. The mechanism it
        exploits is a failure of homologous recombination. BRCA is not the only gene whose loss produces that
        failure, and a somatic mutation disables the protein as completely as an inherited one does. If the repair
        defect is what matters, germline status is a fact about the patient rather than about the tumour.
      experiment: Two single-arm trials selected on repair genes other than germline BRCA. One gave olaparib to
        a germline cohort and a somatic cohort, the other talazoparib to patients wild-type for BRCA1 and BRCA2
        who carried a mutation in a different homologous recombination gene, with the randomised comparisons against
        single-agent chemotherapy that established the class in germline carriers standing behind both.
      finding: Activity did not spread evenly across the genes. It concentrated in germline PALB2 and in somatic
        BRCA, where the response looked like what germline carriers get from the same drugs. The remaining repair
        genes contributed very little. A homologous recombination gene list is therefore not one biomarker but
        several, and they do not behave alike.
      limitation: Both trials are single-arm, and both report gene by gene from cohorts of a few patients each,
        so the genes that look inert are as uncertain as the ones that look active. The olaparib trial's registry
        row carries a BRCA subtype tag although most of its patients had hormone receptor-positive, HER2-negative
        disease, so the row reads as a germline BRCA result when it is not one. The repair deficiency scores that
        tracked response in the talazoparib study were measured in tumours already chosen for carrying one of
        these mutations, so the correlation cannot show that a score would have selected anyone on its own. Neither
        trial randomised against the chemotherapy the germline trials used as their comparator, so what the drug
        is worth against the alternative outside BRCA is unmeasured.
      next: If a marker is only confirmed inside a population already selected on it, what would it take to show
        the marker is doing the selecting? The problem sharpens when the randomisation tests something other than
        the decision, one dose of a drug against another.
      trials:
      - tbcrc048
      - talazoparib-beyond-brca
      - olympiad
      - embraca
    - id: SQ-0610
      ask: Can activating the androgen receptor, rather than blocking it, control oestrogen receptor-positive
        disease?
      rationale: The androgen receptor is present in most oestrogen receptor-positive tumours. There it competes
        with oestrogen-driven transcription rather than supporting it, which makes it a brake and not a driver.
        The move that follows is agonism. It is the opposite pharmacology to the one tested in receptor-negative
        disease, where the androgen receptor is what remains once oestrogen signalling has gone.
      experiment: A randomised phase II compared two doses of a selective androgen receptor modulator against
        each other, with no standard-therapy arm, in previously treated oestrogen receptor-positive, HER2-negative
        disease, reading clinical benefit at a fixed time point in tumours centrally confirmed as androgen receptor-positive.
        Set beside it for contrast only, two single-arm studies of androgen receptor antagonism in receptor-negative
        disease, one with bicalutamide and one with enzalutamide with or without PI3K inhibition.
      finding: Agonism produced clinical benefit in a pretreated population, with no advantage to the higher dose.
        Antagonism produced benefit in a minority of receptor-negative tumours. Each pharmacology shows activity
        in the population where the receptor's role runs the way the drug pushes it.
      limitation: The randomisation was between two doses, so there is no control arm to read the clinical benefit
        rate against. Nothing in the trial says whether another endocrine agent would have done as much in the
        same patients. Central confirmation of androgen receptor positivity defined the population the endpoint
        describes but was not required for entry, so a substantial part of those randomised falls outside the
        population the result is about. Positivity is in any case a nuclear staining cut-off set by protocol rather
        than a biological boundary, and the cut-offs are not the same across the agonist and antagonist studies.
        The antagonist trials are here for contrast. Their populations are receptor-negative and their designs
        single-arm, so nothing on this page compares agonism with antagonism in the same tumour.
      next: If a population is defined by a threshold applied after entry, the threshold is a hypothesis rather
        than a rule. What happens when the threshold is itself the message of the trial?
      trials:
      - enobosarm
      - tbcrc-011
      - tbcrc-032
    - id: SQ-0620
      ask: Can tumour mutational burden select hormone receptor-positive disease for checkpoint blockade?
      rationale: This is the least immunogenic of the subtypes, and checkpoint blockade has found no place in
        it. A small fraction of these tumours are nonetheless hypermutated, often after long endocrine exposure
        or a mismatch repair defect. If immune benefit follows neoantigen load rather than receptor status, those
        tumours should behave like hypermutated cancers elsewhere.
      experiment: A single-arm trial gave nivolumab with low-dose ipilimumab to HER2-negative disease entered
        on a tumour mutational burden above a fixed threshold, with a prespecified correlative analysis at a higher
        threshold. Beside it, a randomised trial added pembrolizumab to a TROP2 conjugate in this subtype without
        selecting on PD-L1, and a rare-histology cohort gave the same dual blockade on histology alone.
      finding: Responses occurred in hypermutated disease. The patients above the higher burden threshold responded
        more often than those below it. In the randomised setting the checkpoint inhibitor added nothing to the
        conjugate. Its PD-L1-defined subgroup gave a direction rather than a result. The rare-histology cohort
        produced a few responses that have run on for years against no activity in the rest.
      limitation: The burden-selected trial entered patients on burden within HER2-negative disease and never
        reports how many were hormone receptor-positive, so the registry tags it across both subtypes and no hormone
        receptor-positive result can be read out of it. The threshold analysis carrying the selection message
        rests on a handful of patients and was prespecified as a correlative outcome rather than randomised, so
        it nominates a cut-off and does not validate one. The PD-L1 subgroup in the conjugate trial is a secondary
        analysis confined to patients with evaluable tissue, and it was not significant. Burden is also a property
        of the panel that counts it, so a threshold expressed per megabase of sequence travels between assays
        less well than it reads.
      next: Every exception in this story depends on a test the receptor workup does not perform, and most of
        these alterations are acquired under treatment rather than present at diagnosis. Where is that test actually
        done?
      trials:
      - nimbus
      - saci-io-hr
      - dart-metaplastic
    - id: SQ-0630
      ask: Can these alterations be found in the clinic without a fresh biopsy at every progression?
      rationale: Each exception here is rare. Most of the alterations arise under treatment, so the archival block
        from the original operation is the wrong sample to interrogate. None of them is reported by the immunohistochemistry
        that assigns receptor status. The practical limit on all of this is the test rather than the drug.
      experiment: A platform trial registered patients on circulating tumour DNA, checked digital PCR against
        targeted sequencing and both against tissue sequencing, then routed patients into treatment cohorts by
        the mutation found. One of those cohorts matched a HER2 mutation to neratinib, which is the population
        the mutation-selected trials above recruited from tissue.
      finding: Plasma agreed closely with tissue where the biopsy was contemporaneous. Routing on the plasma result
        produced responses in the matched cohorts, at rates that differed between cohorts rather than describing
        the strategy as a whole. Circulating DNA is an adequate way to find these patients.
      limitation: Agreement with tissue was measured where the biopsy was contemporaneous, which is the favourable
        case. Sensitivity falls when the tissue is older, and older tissue is the situation the plasma test exists
        to solve. The cohorts were single-arm, so a matched response rate says who to treat next and not whether
        the match beat the alternative. Plasma reports what a tumour sheds, so a negative result in low-shedding
        or bone-only disease is not evidence that the alteration is absent. None of the mutation-selected trials
        in this story required the alteration to be found in plasma, so the eligibility their results describe
        is a tissue result.
      next: A patient can carry more than one of these alterations, and each trial that nominated one excluded
        the others. Which target is acted on first when two are found, and does the order change what the second
        one is worth?
      trials:
      - plasmamatch
      - summit
      - tbcrc048
      - talazoparib-beyond-brca
      - nimbus
  ST-120:
    setting: metastatic
    subtype: HR+/HER2-
    stage: later
    title: Delivering the payload after endocrine therapy is exhausted
    chapters:
    - BC-890
    premise: By the time endocrine therapy and its combinations are exhausted, what is left is cytotoxic. For
      decades the only question was which single agent, and in what order. Antibody-drug conjugates changed the
      address of the payload rather than its class. The questions in this cell are therefore about what a better
      address is worth, and about whether the antigen that supplies the address selects anyone. Under all of them
      runs a measurement problem, because the antigens these drugs are named for are scored by assays built to
      answer a different question.
    questions:
    - id: SQ-0640
      ask: Once endocrine therapy is exhausted, does an antibody-drug conjugate beat the single-agent chemotherapy
        a clinic would otherwise give?
      rationale: The payload inside these conjugates is an ordinary cytotoxic. What the antibody changes is where
        that payload is delivered, not what it does to a dividing cell. The question was therefore whether a better
        address buys enough tumour exposure to beat giving a cytotoxic systemically and accepting the toxicity
        that follows.
      experiment: Three randomised phase III trials gave a conjugate against physician's choice of single-agent
        chemotherapy in hormone receptor-positive disease that had run out of endocrine options. They differ in
        the antigen the antibody binds and in how much chemotherapy was required before entry. The control arm
        in each was the same short menu of single agents, and that menu had been assembled by earlier trials that
        compared those agents against one another.
      finding: Each conjugate lengthened the time to progression against physician's choice chemotherapy. Overall
        survival did not follow in every case. In the trial that made progression-free survival and overall survival
        both primary, the first moved against chemotherapy and the second did not.
      limitation: Physician's choice is a composite control. The trials that put those drugs on the menu showed
        only that none of them beat another, so the comparator is the average of interchangeable agents rather
        than the drug a particular clinician would have chosen for a particular patient. The three conjugate trials
        also required different amounts of prior chemotherapy, so they cannot be stacked into a sequence or read
        as a ranking. The dual-primary trial is the standing warning here, because it shows that a progression-free
        survival gain against chemotherapy in this setting does not convert into a survival gain on its own.
      next: If the payload does the killing, does the antigen the antibody binds select anyone, or does it only
        have to be present?
      trials:
      - tropics02
      - destiny-b04
      - tropion-b01
      - embrace
      - study301
    - id: SQ-0650
      ask: Does the amount of antigen on the tumour select who benefits, or does the antigen only have to be present?
      rationale: A conjugate is named for its target, so the natural expectation is that more target means more
        benefit and that below some level the drug stops working. HER2-low was written as an eligibility category
        for a trial rather than as a description of a biological class. TROP2 is expressed across almost all of
        this disease, which makes it a poor candidate for grading anyone.
      experiment: The HER2-directed conjugate was tested first in disease scored at the bottom of the conventional
        HER2 scale, then in disease scored below even that, including tumours read as negative with only faint
        membrane staining. Separately, a single-arm study gave the same drug in cohorts spanning the whole expression
        range, from overexpressing down to no detectable staining. The TROP2 trials did not select on expression
        at all, and one of them measured TROP2 by immunohistochemistry, by immunofluorescence and in plasma, testing
        each against outcome.
      finding: The HER2-directed conjugate works in disease scored below the threshold that defined its own registration
        trial. Response falls as staining falls and does not disappear where staining is absent. The TROP2 results
        held across expression subgroups rather than concentrating in the high ones, and where TROP2 was measured
        three different ways in one trial none of the three tracked outcome.
      limitation: HER2-low and ultralow are scoring conventions on an immunohistochemistry assay designed to find
        amplification, read at the bottom of its range where agreement between pathologists is at its worst. The
        category is a property of the assay before it is a property of the tumour. The cohort study spanning the
        expression range is single-arm, so a lower response in a lower-expression cohort carries no chemotherapy
        comparison inside that cohort and cannot say whether the advantage over chemotherapy differs by expression.
        The ultralow group in the trial that extended the threshold was exploratory, sitting alongside a primary
        analysis in the scored-low population rather than testing the threshold itself, so no trial has yet randomised
        anyone on the score.
      next: If expression does not select the patient, is the address interchangeable, and does redirecting the
        payload to a different antigen still work once one conjugate has failed?
      trials:
      - destiny-b04
      - destiny-b06
      - daisy
      - tropics02
      - tropion-b01
      - saci-io-hr
    - id: SQ-0660
      ask: Does a second antibody-drug conjugate work after a first one has failed?
      rationale: The conjugates used in this cell share a payload mechanism while differing in the antibody. If
        resistance is to the payload, changing the antibody buys nothing. If it is to the target, to its internalisation
        or to trafficking inside the cell, a different address might still work. Patients now arrive in later
        lines having already had a conjugate, so the question has stopped being theoretical.
      experiment: A HER3-directed conjugate was given as a single arm after progression on CDK4/6 inhibition and
        one chemotherapy line, with paired baseline and on-treatment biopsies taken to see how far the drug distributed
        inside the tumour and what the tumour did in response. A prospective study is now assigning a second conjugate
        after a first, in separate cohorts defined by which conjugate came before.
      finding: Redirecting the payload to a third antigen produced responses in a population already treated with
        CDK4/6 inhibition and chemotherapy. The tissue work associated response with how far the conjugate distributed
        within the tumour and with an interferon response, rather than with the level of receptor alone.
      limitation: The HER3 study is single-arm, so its response rate has nothing to be read against and cannot
        rank HER3 delivery against another conjugate or against chemotherapy. Its response is reported with a
        narrower confidence interval than the randomised trials beside it use, which is what a single-arm design
        specifies and not a sign of greater precision. The on-treatment biopsies come only from patients who stayed
        on the drug long enough to be rebiopsied, which is selection on the very outcome the biomarkers are being
        asked to explain, and the authors state that every association is pending validation. The prospective
        sequencing study is still running, and its cohorts are non-comparative by design, so it will report activity
        after a conjugate rather than a sequence.
      next: If the limit is the payload rather than the address, can a drug with a different mechanism be added
        to the conjugate to make it work harder?
      trials:
      - tropics02
      - tropion-b01
      - icarus-breast01
      - trade-dxd
    - id: SQ-0670
      ask: Does adding checkpoint blockade to a TROP2 conjugate improve on the conjugate alone?
      rationale: A topoisomerase payload kills in a way that releases tumour antigen and can draw immune cells
        into the tumour, which is the standard argument for putting a conjugate next to a checkpoint inhibitor.
        Hormone receptor-positive disease is the least immunogenic of the common subtypes. If a conjugate is what
        makes a tumour visible to the immune system, this is where the added effect should be easiest to see.
      experiment: A randomised phase II trial gave a TROP2 conjugate with or without a checkpoint inhibitor in
        disease pretreated with endocrine therapy and at most one chemotherapy regimen, with progression-free
        survival as the primary endpoint and PD-L1 status as a key secondary population. Elsewhere in this subtype,
        checkpoint blockade has been tested either in single-arm combinations, where the partner drug cannot be
        separated from the checkpoint inhibitor, or in populations selected for a high mutational burden.
      finding: Adding the checkpoint inhibitor did not improve progression-free survival over the conjugate alone
        in the population unselected for PD-L1. The PD-L1-positive subgroup pointed in the right direction without
        reaching significance. Checkpoint blockade in this subtype produces responses where the population has
        been selected for a mutational phenotype, and not otherwise.
      limitation: The PD-L1 result is a key secondary analysis in fewer than half of the patients who had evaluable
        tissue. It did not reach significance, and its own authors describe it as a trend for larger randomised
        trials to test rather than a result. Nearly half of those enrolled had received no chemotherapy at all
        for metastatic disease, so the trial sits earlier in the course than the line at which this conjugate
        is registered in this subtype, and a single line label is covering a mixed population. The single-arm
        combination that sits beside it cannot establish what its checkpoint inhibitor added, as its authors say
        themselves, so it supplies no counterweight in either direction, and a phase II comparison was not sized
        to exclude the size of effect a phase III would chase.
      next: If neither a partner drug nor a measured biomarker improves on the conjugate, does the only remaining
        lever become where in the sequence the conjugate is given?
      trials:
      - saci-io-hr
      - nimbus
      - mediola
      - mk2870-010
    - id: SQ-0680
      ask: Should a conjugate replace the first chemotherapy rather than follow it?
      rationale: Every trial that established these drugs enrolled after chemotherapy had already been given,
        so what they measured is the value of a conjugate at that point in the course. Moving it forward means
        giving a drug with its own distinctive toxicity to people who might have done well for a long time on
        one gentle cytotoxic, or who might not have needed cytotoxic treatment at all yet.
      experiment: One phase III trial moved the HER2-directed conjugate ahead of any chemotherapy for metastatic
        disease in endocrine-pretreated patients, against physician's choice chemotherapy. Two TROP2 trials are
        doing the same in the first chemotherapy slot and have not reported. From the opposite direction, a randomised
        trial in aggressive disease compared endocrine therapy with a CDK4/6 inhibitor against combination chemotherapy,
        asking whether cytotoxic treatment was needed at that point at all.
      finding: The conjugate given before any chemotherapy lengthened time to progression against physician's
        choice chemotherapy, with overall survival immature at that analysis. Endocrine therapy with a CDK4/6
        inhibitor outlasted combination chemotherapy in aggressive disease that would once have gone straight
        to cytotoxic treatment. Both push conventional single-agent chemotherapy out of the slot it used to hold,
        from opposite directions.
      limitation: The control arm in the earlier-line conjugate trial is the same physician's-choice menu, and
        its overall survival was immature at the primary analysis, so a longer time to first progression is currently
        the whole of the case for moving the drug forward. The aggressive-disease trial is phase II and premenopausal,
        and it enrolled on a clinical judgement of aggressiveness rather than on a stated threshold, so it does
        not define who can safely be kept off chemotherapy. Most of all, no trial here randomised the order of
        the same drugs. The design that would answer it randomises the position and then measures progression
        on the line after next, which is how the first-line CDK4/6 question was settled and is not how any conjugate
        in this cell has been studied.
      next: Does giving the conjugate earlier lengthen the whole sequence or only its first segment, and will
        any conjugate trial measure the second progression rather than the first?
      trials:
      - destiny-b06
      - ascent07
      - mk2870-010
      - right-choice
      - embrace
      - study301
      - sonia
  ST-130:
    setting: metastatic
    subtype: HER2+
    stage: any
    title: Layering HER2 blockade and choosing what follows it
    chapters:
    - BC-900
    premise: Everything that works in this cell works through one receptor, either by blocking it or by using
      it to deliver a cytotoxic. So the questions here are not whether to target HER2 but how many ways to block
      it at once, what cytotoxic to attach to it, and whether progression means the target has gone. The answers
      arrived as a chain of trials, each tested against the standard of its own year rather than against the order
      a clinic now uses.
    questions:
    - id: SQ-0690
      ask: Does blocking HER2 at more than one site do more than blocking it at one?
      rationale: HER2 has no ligand of its own. It signals by pairing. Its most active partner is HER3, which
        is ligand-driven. Trastuzumab binds the membrane-proximal domain and leaves the dimerisation arm exposed,
        so ligand-driven pairing continues underneath it. A second antibody aimed at that arm, or a small molecule
        that shuts the kinase down from inside the cell, should close an escape the first antibody never covered.
      experiment: A sequence of first-line randomised trials, each adding one more layer to the layer below. Trastuzumab
        added to chemotherapy. Then pertuzumab added to trastuzumab and a taxane. Then a HER2 kinase inhibitor
        added to trastuzumab and a taxane in one trial, and to trastuzumab with pertuzumab as maintenance in another.
        A large single-arm study ran alongside them, giving the same antibody pair with a taxane the investigator
        chose.
      finding: Each added layer lengthened progression-free survival against the layer beneath it. The second
        antibody also lengthened overall survival against a single antibody given with the same chemotherapy,
        which none of the later additions has yet shown. The single-arm study reported tolerability for the antibody
        pair with each of the three taxanes, with no comparator to rank them.
      limitation: These trials were run against the standard of their own year, so the additions are not stacked
        on one backbone. CLEOPATRA's control arm had none of the drugs that now follow first-line progression,
        so the survival difference it measured belongs to a sequence rather than to pertuzumab alone. PHILA's
        control arm was trastuzumab and docetaxel without pertuzumab, so it says what a kinase inhibitor adds
        to a doublet rather than what it adds to the triplet a clinic now starts with. It also enrolled in one
        country. HER2CLIMB-05 randomised only patients who had not progressed during induction, so its population
        is selected for disease the backbone already controls. PERUSE had safety as its primary endpoint and no
        comparator at all, so its efficacy results describe a cohort rather than test anything.
      next: If three layers of HER2 blockade beat two, what is the free taxane still doing in the regimen?
      trials:
      - h0648g
      - m77001
      - cleopatra
      - phila
      - her2climb-05
      - peruse
    - id: SQ-0700
      ask: Does the cytotoxic have to be given as free chemotherapy, or can it travel on the antibody?
      rationale: A conjugate uses the antibody as a delivery vehicle, so the cytotoxic concentrates where the
        antigen is displayed and spares tissue that does not display it. If that holds at the front of the disease
        course, the free taxane is doing nothing the conjugate does not do better. The stronger version of the
        idea drops the cytotoxic altogether, on the argument that a HER2-dependent tumour can be held by blockade
        alone.
      experiment: Two first-line randomised trials substituted a conjugate for the taxane. One compared trastuzumab
        emtansine, alone and with pertuzumab, against trastuzumab plus a taxane. The other compared trastuzumab
        deruxtecan plus pertuzumab against the taxane, trastuzumab and pertuzumab triplet, with a third arm of
        the conjugate alone. The chemotherapy-free version of the question was asked separately, in a single-arm
        study of lapatinib with trastuzumab across two cohorts defined by prior treatment, and in a randomised
        trial of lapatinib with or without trastuzumab after progression.
      finding: The first-generation conjugate was noninferior to the taxane backbone and was not superior to it,
        with or without the second antibody. The newer conjugate with the second antibody lengthened progression-free
        survival against the triplet. Chemotherapy-free dual blockade produced responses in a cohort untreated
        for metastatic disease and in a pretreated cohort, more often in the untreated one.
      limitation: Noninferiority is a claim about a prespecified margin rather than a demonstration that two regimens
        are the same. MARIANNE's primary publication reported no overall survival at all. DESTINY-Breast09's third
        arm, the conjugate without pertuzumab, was still blinded at the interim analysis, so nothing yet separates
        what the conjugate contributes from what the second antibody contributes. Its overall survival is not
        reported either. DESTINY-Breast07 has no publication on the record, so it names a programme rather than
        a result. TBCRC 003 is single-arm and its two cohorts were defined by prior treatment, so the gap between
        their response rates is a difference between populations rather than a comparison. A chemotherapy-free
        response rate from that era cannot stand as a comparator for a modern chemotherapy-containing regimen.
      next: If the cytotoxic can be carried on the antibody or left out at the start, is the receptor still worth
        blocking once the disease has progressed on drugs aimed at it?
      trials:
      - marianne
      - destiny-b09
      - destiny-breast07
      - tbcrc-003
      - egf104900
    - id: SQ-0710
      ask: Is HER2 still worth blocking once the disease has progressed on HER2 blockade?
      rationale: Progression on trastuzumab admits two readings. Either the tumour has stopped depending on HER2,
        in which case the target should be abandoned, or it has escaped one way of blocking a receptor it still
        needs, in which case the target should be attacked differently. The two readings imply opposite prescriptions.
        Only a trial that holds the chemotherapy fixed and varies the blockade can tell them apart.
      experiment: Randomised trials that fixed the chemotherapy and varied only the HER2 blockade after progression
        on trastuzumab. Capecitabine with continued trastuzumab against capecitabine alone. Capecitabine with
        lapatinib against capecitabine alone. Lapatinib with or without trastuzumab in disease already progressing
        on trastuzumab. Further down the course, a conjugate against whatever the physician would otherwise have
        chosen.
      finding: Each of these lengthened time to progression against the same chemotherapy given without the added
        HER2 blockade. Blocking the receptor two ways beat blocking it one way in disease that had already failed
        one of them. The target survives progression on the drugs aimed at it.
      limitation: These are separate trials with separate control arms. Two of those arms are weak by design.
        EGF104900 compared lapatinib plus trastuzumab against lapatinib alone, which is not a regimen a clinic
        would choose for anyone. TH3RESA's comparator was physician's choice in heavily pretreated disease, which
        is a floor rather than a standard. GBG 26 randomised a small population against a time-to-progression
        endpoint. Its overall survival difference was not significant, so it shows that continuing the antibody
        delays progression without showing that it extends life. None of these trials required a repeat biopsy
        at progression, so the receptor's persistence is inferred from the fact that drugs against it still work
        rather than measured.
      next: If the receptor stays worth blocking through successive lines, in what order should the drugs aimed
        at it be given?
      trials:
      - gbg-26-big-03-05
      - egf100151
      - egf104900
      - emilia
      - th3resa
    - id: SQ-0720
      ask: In what order should the later-line HER2 drugs be given?
      rationale: After the first-line triplet the choices are a conjugate, a kinase inhibitor with an oral cytotoxic,
        or another antibody. Each was developed against whatever was standard when it entered trial, so the sequence
        a clinic uses was assembled from a chain of comparisons rather than chosen in any one of them.
      experiment: A conjugate against a kinase inhibitor with capecitabine after trastuzumab and a taxane. A newer
        conjugate against that conjugate in the same line. The newer conjugate against physician's choice in disease
        that had already progressed on the older one. A kinase inhibitor added to the older conjugate. One kinase
        inhibitor against another with the same oral partner, early in the sequence and again late. A kinase inhibitor
        added to trastuzumab and capecitabine in heavily pretreated disease.
      finding: Each comparison favoured the newer agent or the more heavily blocked arm against its own control.
        The single head-to-head of the two conjugates was decisive enough to move the newer one into second line.
        The order a clinic now uses is a reading across that chain rather than the result of any trial in it.
      limitation: No trial randomised the order. The controls are era-specific. Physician's choice inside a conjugate
        trial is not the set of options a clinic would now reach for, so the separation measured against it overstates
        what the drug adds today. DESTINY-Breast02's second-line label is a floor rather than a description, because
        entry required only progression on trastuzumab emtansine and capped nothing before that. HER2CLIMB-02
        improved progression-free survival against the conjugate alone while its interim overall survival ran
        the other way, which is not a shape a sequencing decision can be built on. PHOEBE's result is a prespecified
        interim analysis and its comparator has since been displaced. HER2CLIMB and NALA both admitted patients
        with brain metastases, so part of what they measured belongs to the central nervous system question rather
        than to this one.
      next: If no trial randomised the order, can the next drug be chosen by measuring the target rather than
        by counting the lines already given?
      trials:
      - emilia
      - destiny-b03
      - destiny-breast02
      - her2climb-02
      - phoebe
      - her2climb
      - nala
    - id: SQ-0730
      ask: Can the next drug be chosen by measuring the target rather than by counting previous lines?
      rationale: A patient's HER2 status is usually assigned once, on the primary tumour, by an immunohistochemistry
        cut-off chosen to select for trastuzumab. Metastatic deposits are not obliged to match the primary, and
        they are not obliged to match each other. If the antigen can be measured in the disease actually being
        treated, the choice of the next drug could rest on the target rather than on the treatment history.
      experiment: Three ways of measuring rather than counting. Imaging the antigen with a labelled antibody before
        giving a conjugate, read alongside an early metabolic scan. An early metabolic response read embedded
        in the chemotherapy-free dual blockade study. A conjugate given to prespecified cohorts defined by immunohistochemistry
        score, from overexpressing through low down to no detectable staining. Set against those, the registration
        study that gave a newer conjugate to disease that had already failed an older conjugate aimed at the same
        antigen.
      finding: Antigen imaging found patients whose lesions took up no tracer and found uneven uptake within single
        patients. Its predictive values against radiological response improved when the early metabolic scan was
        read with it. The conjugate produced responses in every staining cohort, most often in the overexpressing
        one and not rarely in the cohort scored as non-expressing. Failure of one conjugate aimed at HER2 did
        not predict failure of the next.
      limitation: These are measurement studies rather than allocation trials. A predictive value is computed
        in one cohort all treated the same way, against a radiological definition of response, so it describes
        how a scan tracks an outcome rather than showing that acting on the scan changes one. Nobody has randomised
        patients to be allocated by imaging. DAISY's cohorts were defined by immunohistochemistry on archival
        tissue. Each cohort was single-arm, so activity in the non-expressing cohort may be reporting the floor
        of the assay rather than activity without the target. The metabolic read in TBCRC 003 sat inside a single-arm
        study, which gives its predictive claim the same shape. DESTINY-Breast01 had no control arm, so it cannot
        say whether the second conjugate worked because the antigen persisted or because its payload differs.
      next: When the antigen is still present and the drug has stopped working, can a mechanism other than HER2
        blockade reach what is failing downstream of binding?
      trials:
      - zephir
      - tbcrc-003
      - destiny-breast01
      - daisy
    - id: SQ-0740
      ask: Can a mechanism other than HER2 blockade be added to extend what HER2 blockade can do?
      rationale: Part of trastuzumab's effect is immune. It engages Fc receptors on effector cells. The response
        to it tracks with the lymphocytic infiltrate in the tumour. Two routes follow from that. Re-engineer the
        Fc so it binds the low-affinity receptor allele better, or take the brake off the effector cells with
        a checkpoint antibody. A third route has nothing to do with the immune system. HER2 amplification is associated
        with replication stress, which raised the possibility that a PARP inhibitor would work here without a
        germline BRCA variant.
      experiment: An Fc-engineered anti-HER2 antibody against trastuzumab, each with chemotherapy, randomised
        in pretreated disease. Pembrolizumab added to trastuzumab in a single-arm study, with PD-L1 scored centrally
        on a metastatic biopsy and with parallel PD-L1-positive and PD-L1-negative cohorts. Atezolizumab or placebo
        added to trastuzumab emtansine, randomised. Niraparib added to trastuzumab with no germline selection.
      finding: The engineered antibody lengthened progression-free survival against trastuzumab given with the
        same chemotherapy. Its final overall survival did not favour it. Checkpoint blockade added to trastuzumab
        produced responses only in PD-L1-positive tumours, and in a minority of those. Added to the conjugate
        in a randomised design, it did not meet its endpoint. The PARP combination has produced no full report.
      limitation: PANACEA is single-arm, so its responses cannot be separated from what trastuzumab alone would
        have done in a PD-L1-selected group. Its PD-L1 scoring was central and required a metastatic biopsy, which
        is not how the marker is obtained in clinic. Its headline response applies to the phase 2 PD-L1-positive
        cohort rather than to everyone treated. KATE2 was unmasked early for futility, so follow-up is short on
        both arms. The PD-L1-positive subgroup its authors argue for is not reported as a subgroup result, so
        the case for pursuing it rests on an analysis nobody can read. TBCRC 050 sits on the record only as conference
        material, with no enrolment, no stated endpoint and no result, so it is a strategy that was tested rather
        than a finding. SOPHIA's separation in progression-free survival without a survival difference leaves
        the Fc hypothesis neither confirmed nor refuted.
      next: Does the same combination belong earlier in the course, before repeated HER2 blockade has thinned
        the infiltrate, and is the escape being chased here immune at all rather than luminal?
      trials:
      - sophia
      - panacea
      - kate2
      - tbcrc-050
  ST-140:
    setting: metastatic
    subtype: HR+/HER2+
    stage: any
    title: The luminal half of a HER2-driven cancer
    chapters:
    - BC-910
    premise: A tumour that is both hormone receptor-positive and HER2-positive runs on two pathways that prop
      each other up, so suppressing one raises the other. Nearly every practice-defining HER2 trial enrolled both
      receptor groups and reported them together, which left what is specific to the triple-positive patient to
      smaller trials off to one side. The questions here are whether the luminal half of that biology is worth
      treating in its own right, when in the course to treat it, and in whom.
    questions:
    - id: SQ-0750
      ask: Does a tumour that is both hormone receptor-positive and HER2-positive need both pathways blocked?
      rationale: The two pathways hold each other up. Blocking HER2 restores oestrogen receptor signalling. Blocking
        the receptor pushes growth signalling back through HER2, so either drug given alone leaves an escape route
        open.
      experiment: Chemotherapy-free randomisations in this cell, first adding a HER2-directed drug to an aromatase
        inhibitor, then adding a second HER2-directed drug to that pair. EGF30008 enrolled hormone receptor-positive
        patients regardless of HER2 status and made the HER2-positive group its prespecified primary analysis.
        ALTERNATIVE asked the same question in patients who had already had trastuzumab and endocrine therapy.
      finding: Each addition delays progression against the regimen it was added to. In the trial that enrolled
        both HER2 groups the gain appeared only where HER2 was amplified, which is an internal control the single-subtype
        trials do not have.
      limitation: Every control arm here is a regimen no clinic would now offer, either endocrine therapy alone
        or a single antibody with endocrine therapy. ALTERNATIVE enrolled only patients for whom chemotherapy
        was not intended, which selects on a clinician's judgement rather than on anything measured. Most of TAnDEM's
        endocrine-only arm crossed to trastuzumab on progression, so its survival comparison settles nothing.
        None of these trials set the chemotherapy-free combination against dual blockade with a taxane.
      next: If endocrine therapy with HER2 blockade controls this disease at all, can it stand in for chemotherapy
        rather than be arranged around it?
      trials:
      - tandem
      - egf30008
      - pertain
      - alternative
    - id: SQ-0760
      ask: Can endocrine therapy stand in for chemotherapy alongside HER2-directed treatment?
      rationale: First-line treatment pairs HER2 blockade with a taxane. The taxane is the part the patient pays
        for. If the tumour depends on oestrogen as much as on HER2, an endocrine agent is the cheaper partner
        for the antibody.
      experiment: SYSUCC-002 randomised untreated metastatic patients to trastuzumab with endocrine therapy or
        trastuzumab with chemotherapy, powered to show that the endocrine partner was not worse than the cytotoxic
        one by more than a prespecified margin on progression-free survival. PERTAIN puts the same comparison
        informally, since induction chemotherapy in it was optional.
      finding: The endocrine partner met the noninferiority margin against chemotherapy for time to progression,
        at much lower toxicity. In PERTAIN the patients who had no induction chemotherapy did at least as well
        as those who had it.
      limitation: The SYSUCC-002 control was a single antibody with chemotherapy rather than the dual blockade
        with a taxane that was already standard when it reported, so noninferiority was shown against a comparator
        its own era had improved on. The margin was set on progression-free survival and no overall survival has
        been reported, so what is being traded for the lower toxicity is unmeasured. The PERTAIN comparison is
        not randomised at all, because induction was an investigator's decision and the chemotherapy-free group
        is therefore a group judged not to need chemotherapy.
      next: If the endocrine partner can carry a whole line, can it also carry one after HER2-directed treatment
        has failed, where chemotherapy is the default?
      trials:
      - sysucc-002
      - pertain
      - cleopatra
    - id: SQ-0770
      ask: After HER2-directed regimens have failed, does a CDK4/6 inhibitor with trastuzumab and endocrine therapy
        beat returning to chemotherapy?
      rationale: Cyclin D1 and CDK4/6 sit downstream of both the oestrogen receptor and HER2, which makes them
        the node where the two pathways converge. Escape from HER2 blockade runs through that node. Blocking it
        would also put a chemotherapy-free option into a line where chemotherapy is the default.
      experiment: 'monarcHER randomised pretreated triple-positive patients three ways: abemaciclib with trastuzumab
        and fulvestrant, abemaciclib with trastuzumab, and physician''s choice chemotherapy with trastuzumab.
        The two-drug arm carries the same CDK4/6 inhibitor without the endocrine partner, which is what isolates
        the endocrine contribution.'
      finding: Only the arm carrying the endocrine partner improved on chemotherapy for time to progression. The
        same CDK4/6 inhibitor without it was no better than chemotherapy. Overall survival favoured the triplet
        without having been tested as a primary endpoint.
      limitation: This was a screening phase II and its progression-free survival result was declared against
        a significance threshold much looser than a phase III would use, so it is a signal to be confirmed rather
        than a confirmation. Its chemotherapy control predates the antibody-drug conjugate that now holds this
        line, so the comparison is against an option a clinic would no longer reach for. Entry turned on receptor
        positivity by immunohistochemistry, with no requirement that the tumour behave as a luminal one.
      next: If the endocrine partner is what makes the combination work, does the tumour have to be luminal by
        more than a receptor stain?
      trials:
      - monarcher
      - destiny-b03
      - patricia-solti
    - id: SQ-0780
      ask: Does the benefit hold only in tumours that are luminal by intrinsic subtype, rather than in every tumour
        that stains receptor-positive?
      rationale: Receptor positivity is a protein stain read against a scoring threshold. Intrinsic subtyping
        reads the transcriptional programme instead, and a substantial share of receptor-positive, HER2-positive
        tumours classify as HER2-enriched rather than luminal. If the luminal programme is what the endocrine
        drug and the CDK4/6 inhibitor exploit, the stain is only a proxy and the subtype call is the thing itself.
      experiment: PATRICIA ran single-arm cohorts of palbociclib with trastuzumab, split by oestrogen receptor
        status and given with or without letrozole, and found on secondary analysis that luminal tumours ran longer
        before progressing than non-luminal ones. It then closed those cohorts and opened a randomised one restricted
        to PAM50 luminal disease, comparing palbociclib with trastuzumab and endocrine therapy against trastuzumab-based
        treatment of physician's choice.
      finding: In the subtype-restricted randomised cohort the triplet delayed progression against physician's
        choice. A minority on the triplet were still free of progression well past the point at which almost nobody
        on physician's choice was.
      limitation: The subtype rule was derived in this study's own earlier cohorts and then tested in a cohort
        built around it, so the biomarker was measured after selection on it and no randomised non-luminal comparison
        exists to show that the rule excludes anyone correctly. The control arm was whatever the investigator
        chose, mixing a conjugate, chemotherapy and endocrine therapy into a single comparator. Patients allocated
        to that arm could be randomised again on progression, so the randomised assignments outnumber the people,
        and the cohort reports no overall survival.
      next: If subtype picks out who benefits after HER2-directed lines have failed, does the same selection apply
        earlier, where a CDK4/6 inhibitor is given to everyone whose disease has responded to induction?
      trials:
      - patricia-solti
      - monarcher
      - patina
    - id: SQ-0790
      ask: Is the right moment for a CDK4/6 inhibitor the maintenance phase after induction, rather than a later
        line?
      rationale: First-line treatment in this cell ends in a long maintenance phase on HER2-directed and endocrine
        therapy, with the disease quiet and the residual burden small. Holding proliferation down is exactly what
        a CDK4/6 inhibitor does. Waiting for several HER2-directed lines to fail hands the drug a tumour that
        has had time to find other routes.
      experiment: PATINA randomised patients whose disease had not progressed after induction chemotherapy with
        HER2-directed treatment to add palbociclib to maintenance HER2-directed and endocrine therapy, or to continue
        that maintenance alone. No subtype or biomarker selection was applied.
      finding: Adding the CDK4/6 inhibitor lengthened the maintenance phase against the same maintenance without
        it, in an unselected receptor-positive population. It also brought the neutropenia the class brings, into
        a phase in which patients feel well.
      limitation: Randomisation came after induction, so the population is selected for disease that did not progress
        on chemotherapy with HER2 blockade. The trial says what palbociclib adds to a patient who is already responding,
        not what it adds to everyone who starts first line, and no overall survival has been reported. Its induction
        regimens predate the first-line antibody-drug conjugate, so the maintenance phase it improved is not quite
        the one a clinic will be managing.
      next: If first-line induction becomes an antibody-drug conjugate with dual blockade, is there still a maintenance
        phase to put an endocrine and CDK4/6 backbone into, and would the subtype assay be needed to find the
        patients for it?
      trials:
      - patina
      - cleopatra
      - destiny-b09
      - monarcher
      - patricia-solti
  ST-150:
    setting: metastatic
    subtype: TNBC
    stage: any
    title: Finding something to aim at in a disease defined by absence
    chapters:
    - BC-920
    premise: Triple-negative is the output of three negative assays, so the name says what the tumour lacks and
      nothing about what it needs. Every question in this cell is therefore a search for something to aim at.
      The things that have changed practice here were not lineage targets at all, but a repair defect, an immune
      infiltrate and a surface antigen, each carrying a measurement problem of its own.
    questions:
    - id: SQ-0800
      ask: Does naming a molecular dependency inside triple-negative disease produce a subset that a drug can
        be aimed at?
      rationale: 'The definition names no driver, so the search has been for whatever else the tumour depends
        on. Expression profiling supplied the candidates: epidermal growth factor receptor signalling, death receptor
        signalling, the androgen receptor, and the PI3K-AKT pathway. Each looked like a receptor-defined subtype
        waiting for its own drug.'
      experiment: Each candidate was tested by adding its agent to chemotherapy, or by giving it alone in a population
        selected for the marker. EGFR antibody blockade went with carboplatin and a death receptor agonist with
        a taxane. An androgen receptor antagonist was given alone, and then with a PI3K inhibitor, in androgen
        receptor-positive tumours. The AKT axis was carried furthest, from two randomised phase II trials of an
        AKT inhibitor added to paclitaxel to two phase III trials, the later of which prespecified a pathway-altered
        population alongside the whole.
      finding: Every candidate produced responses in somebody. None produced a group that a controlled comparison
        could separate from the rest. The AKT axis is the clearest case, positive on progression-free survival
        in phase II and negative in phase III both overall and in the tumours selected for a pathway alteration.
      limitation: Most of these designs cannot say what the added agent contributed. The EGFR trial crossed over
        by protocol, so the same patients supply more than one response group. The death receptor trial set its
        primary endpoint as the response rate within each arm rather than the difference between arms. The androgen
        receptor work reports the combination without a matching figure for the antagonist given alone, and its
        entry criteria asked for oestrogen and progesterone receptor negativity while saying nothing about HER2,
        so the enrolled population is wider than the cell it is filed under. The phase II AKT trials read progression-free
        survival against one-sided thresholds and the phase III trials read overall survival, so the signal that
        justified going forward and the endpoint that refuted it are not the same measurement.
      next: If a receptor or a pathway does not define a treatable subset, does a functional defect in DNA repair
        do better, and can it be measured in a tumour with no germline mutation?
      trials:
      - tbcrc-001
      - tbcrc-019
      - tbcrc-011
      - tbcrc-032
      - lotus
      - ipatunity130-cohort-a
      - pakt
      - capitello-290
    - id: SQ-0810
      ask: Does any measure of defective DNA repair select who benefits from platinum, beyond a germline BRCA
        mutation?
      rationale: Triple-negative tumours carry genomic scars that resemble those of BRCA1-mutant cancers. Platinum
        kills cells that cannot repair a crosslink. If the resemblance is functional rather than cosmetic, an
        assay of repair ought to find platinum responders among the large majority who carry no germline mutation.
      experiment: Single-agent platinum was given with a gene expression predictor written in as a coprimary endpoint.
        Platinum was then randomised against a taxane in unselected advanced disease with germline BRCA and other
        repair-defect subgroups prespecified, and against a taxane doublet in a first-line design that tested
        non-inferiority before superiority. Two further trials asked the same question of PARP inhibition, one
        adding it to platinum and taxane in germline carriers, the other giving it alone to tumours wild-type
        for BRCA1 and BRCA2 that carried a mutation in another repair gene.
      finding: Platinum is as good as a taxane in unselected disease and no better. Germline BRCA status is the
        one marker that tracks response across these trials. The attempts to extend selection by expression, by
        genomic instability or by a panel of other repair genes did not reproduce it, apart from a signal in a
        single gene resting on very few patients.
      limitation: The predictive claims rest on subgroups and on single arms rather than on randomised selection.
        In the platinum monotherapy trial the choice between cisplatin and carboplatin was left to the treating
        physician, so the two agents are not being compared. Its germline carriers were a subgroup rather than
        an entry criterion. Its prespecified expression predictor was the negative half of a coprimary endpoint,
        and the genomic instability analyses that did separate responders were exploratory. The randomised platinum
        against taxane comparison reported response rate rather than survival, so a difference in how long benefit
        lasted would not have shown. The trial that added a PARP inhibitor to platinum and taxane required a germline
        mutation but allowed any HER2-negative disease, so hormone receptor-positive patients sit inside a result
        filed here.
      next: If the one marker that holds names a minority, does the immune compartment offer a marker for anyone
        else?
      trials:
      - tbcrc-009
      - tnt
      - cbcsg006
      - brocade3
      - talazoparib-beyond-brca
    - id: SQ-0820
      ask: Does the PD-L1 assay identify the patients who gain from adding a checkpoint inhibitor to first-line
        chemotherapy?
      rationale: Triple-negative tumours carry more lymphocytic infiltrate and more PD-L1 than the other subtypes
        do. Only a minority of them carry either. A checkpoint inhibitor can release a response only where one
        already exists, so each trial carried a companion assay meant to find the tumours where it does.
      experiment: Four randomised first-line trials added a checkpoint inhibitor to a chemotherapy backbone and
        compared it against the same backbone alone. They differ in the checkpoint antibody, in the chemotherapy
        partner, and in how PD-L1 was stained, scored and thresholded. Two used nab-paclitaxel, one a plain taxane,
        and one allowed a choice of backbones. A fifth trial gave the checkpoint inhibitor alone against the physician's
        choice of chemotherapy after prior treatment, with the score as the stratifying question.
      finding: Benefit concentrates in the assay-positive population and is absent below the threshold. It did
        not appear at all in the trial that paired the same class with a plain taxane. Given alone after prior
        treatment, a checkpoint inhibitor did not beat chemotherapy at any score.
      limitation: There is no single PD-L1 test in this set. The trials used different antibodies, scored different
        compartments, tumour cells against immune cells against a combined count, and set different cut-offs,
        so a patient positive in one trial is not necessarily positive in another. The discordance between the
        two atezolizumab trials is a comparison across trials rather than a randomised one. Those two differ in
        the taxane, in the corticosteroid premedication a plain taxane requires, and in the population enrolled,
        so the failure cannot be assigned to the backbone alone. Where hierarchical testing stopped at a gate,
        the overall survival figure clinicians quote was never formally tested.
      next: If the assay disagrees with itself between trials, and some of the population it excludes responds
        anyway, can responsiveness be manufactured rather than looked for?
      trials:
      - impassion130
      - keynote355
      - impassion131
      - torchlight
      - keynote119
    - id: SQ-0830
      ask: Where the assay calls the tumour uninflamed, can another drug make it respond to checkpoint blockade?
      rationale: The infiltrate an assay measures on one biopsy at one moment is not a fixed property of the tumour.
        Cytotoxic drugs and radiation release antigen and change what sits in the microenvironment. PARP inhibition
        leaves cytosolic DNA that drives an interferon response. Each of those is a way of manufacturing the condition
        the assay was looking for.
      experiment: 'Induction was tested first. Patients were allocated between short courses of radiation, cyclophosphamide,
        cisplatin or doxorubicin, or no induction at all, before a common PD-1 backbone, with no control group.
        A separate single-arm study gave radiation with a checkpoint inhibitor and looked for response in the
        lesions that were not irradiated. Concurrent combination was tested by randomising carboplatin against
        carboplatin with PD-L1 blockade. The PARP route was tested three times: a PARP inhibitor with PD-1 blockade
        in disease unselected for BRCA status, a PARP inhibitor run-in followed by added PD-L1 blockade in germline
        carriers, and chemotherapy-free maintenance with a PARP inhibitor with or without PD-L1 blockade after
        platinum.'
      finding: Each of these combinations produces disease control in a minority. In the PARP combinations the
        responses concentrate in tumours carrying a BRCA mutation, though the maintenance trial singles out durable
        control in tumours without one. The randomised platinum comparison favoured adding PD-L1 blockade on both
        progression-free and overall survival. The benefit there did not follow PD-L1 status, which is the reverse
        of the selection the first-line trials were built on. Response after the common checkpoint backbone differed
        by which induction preceded it, the anthracycline course highest among the induction cohorts and the platinum
        course next.
      limitation: 'None of these designs isolates what the immune agent adds. The induction trial allocated patients
        between priming cohorts but never compared those cohorts statistically, the cohorts are small, and only
        its first stage is reported, so the ranking of priming strategies is a hypothesis rather than a result.
        The randomised platinum trial is an exploratory phase II and its result is not the confirmatory evidence
        the approved chemotherapy-immunotherapy regimens rest on. Two of the three PARP combinations are single
        arms, so the contribution of either drug cannot be separated out. The third randomised its two arms but
        judged each against a historical control of continued platinum rather than against the other, so the longer
        median in the combination arm is not evidence that the immune agent did anything. Eligibility drifts as
        well: one PARP cohort required only HER2-negative disease, and the maintenance trial defined triple-negative
        at a receptor staining threshold rather than at no expression, so hormone receptor-positive tumours sit
        inside both.'
      next: If the immune agent needs a cytotoxic partner to work at all, does it matter how that cytotoxic is
        delivered?
      trials:
      - tonic
      - pembrolizumab-plus-radiotherapy-in-metas
      - tbcrc-043
      - topacio
      - mediola
      - dora
    - id: SQ-0840
      ask: Does an antibody-drug conjugate do better than the chemotherapy it replaces, and does it belong in
        the first line?
      rationale: TROP2 sits on the surface of most triple-negative tumours. A conjugate puts a topoisomerase inhibitor
        inside the cells that carry it, at a dose higher than free drug would allow. If chemotherapy earns its
        place in these regimens by killing cells, a conjugate should earn more of it.
      experiment: The conjugate was first randomised against the physician's choice of single-agent chemotherapy
        in patients already treated with at least two lines. It was then moved to the first line in two randomised
        trials that split the population by whether checkpoint blockade was an option, given with pembrolizumab
        against chemotherapy with pembrolizumab where PD-L1 was positive, and given alone against chemotherapy
        where it was not. A second TROP2 conjugate was randomised against the investigator's choice of chemotherapy
        in the first line. A platform study gave that second conjugate with PD-L1 blockade in two single-arm first-line
        cohorts, one taking all comers and one restricted to PD-L1-high tumours.
      finding: The conjugate beat chemotherapy in every randomised comparison, in later lines and in the first
        line, with a checkpoint partner and without one. The single-arm cohorts of conjugate with PD-L1 blockade
        report the highest response rate of any first-line regimen at this position.
      limitation: Those cohorts have no control arm. They cannot show what the immune agent adds to the conjugate,
        and they do not validate other pairings of a conjugate with immunotherapy. The two cohorts differ in selection
        rather than in treatment, so their response rates are not a comparison with each other, and the PD-L1-high
        cohort is early with immature duration of response. In the randomised first-line combination the control
        arm was chemotherapy with pembrolizumab rather than the conjugate alone, so the trial does not say whether
        the checkpoint inhibitor is still needed once the conjugate is in the regimen. Overall survival has not
        reported in either first-line trial of the conjugate that carries the later-line evidence, so the move
        forward currently rests on progression-free survival.
      next: Once the backbone is a conjugate for nearly everybody, which patients are still defined by a biomarker
        rather than by a line of treatment?
      trials:
      - ascent
      - ascent04
      - ascent03
      - tropion-b02
      - begonia
    - id: SQ-0850
      ask: When a tumour is picked out by its histology or by an uncommon alteration rather than by its receptors,
        is there enough evidence to act on?
      rationale: 'A small number of tumours filed as triple-negative carry something else that is actionable:
        a metaplastic histology, a high tumour mutational burden, an activating HER2 mutation without amplification,
        or a mutation in a repair gene other than BRCA1 and BRCA2. None is common enough to support a randomised
        trial in breast cancer alone. Each has therefore been studied as a cohort of a basket or as a single arm.'
      experiment: Dual checkpoint blockade was given to a metaplastic cohort of a rare-tumour basket, and separately
        to patients selected on tumour mutational burden within HER2-negative disease. A HER2 kinase inhibitor
        with trastuzumab was given to a cohort with an activating HER2 mutation in disease that was HER2-negative
        by conventional testing. A PARP inhibitor was given alone to tumours wild-type for BRCA1 and BRCA2 carrying
        a mutation in another repair gene. All four are single arms reporting response rate.
      finding: Each cohort produced responses at a rate that would be unremarkable in an unselected population
        and is not unremarkable in these. The responses cluster rather than spread. In the metaplastic cohort
        they were few and still running at the time of the report, and in the repair-gene cohort the regressions
        were confined to a single gene.
      limitation: None of these is a trial of triple-negative disease. A clinic has to match its patient to the
        entry criterion and not to the label on the cell. The metaplastic cohort was entered on histology alone,
        and its publication does not report hormone receptor or HER2 status at all. The mutational burden cohort
        was entered on burden within HER2-negative disease, so hormone receptor-positive patients are inside it
        with no split reported. The subgroup in it that carries the message about where to set the burden threshold
        is a handful of patients in a prespecified correlative analysis, not a randomised comparison, so it establishes
        no cut-off. The HER2 mutation cohort likewise took both receptor groups, and its intervals are reported
        at a looser confidence level than the rest of the registry uses. Single arms of this size in selected
        populations establish that a response can happen, not how often it will.
      next: Should a tumour that has exhausted its receptor-defined and antigen-defined options be sequenced for
        these alterations before the next line of chemotherapy is chosen, and who pays for the tissue?
      trials:
      - dart-metaplastic
      - nimbus
      - sgntuc-019
      - talazoparib-beyond-brca
  ST-160:
    setting: cns
    subtype: HER2+
    stage: any
    title: Reaching the central nervous system and reading what comes back
    chapters:
    - BC-600
    - BC-900
    premise: 'HER2-positive disease sends more patients to the brain than any other subtype, in part because the
      drugs that hold the body have been better than the ones that reach the head. For years the registration
      trials excluded brain metastases that were untreated or progressing. So the belief that a large molecule
      cannot cross was assumed rather than tested, and the questions in this cell run on two tracks at once: whether
      the compartment can be reached, and whether the endpoints used to report it mean what they appear to mean.'
    questions:
    - id: SQ-0860
      ask: Does adding a brain-penetrant HER2 tyrosine kinase inhibitor to systemic treatment control brain metastases
        that are still active?
      rationale: The compartment was treated as radiation's problem, on the argument that a full-length antibody
        does not cross an intact blood-brain barrier. The argument was never tested, because trials excluded patients
        whose brain disease was untreated or progressing. An earlier single-arm study had already paired a tyrosine
        kinase inhibitor with capecitabine in brain metastases that had never been irradiated, and reported volumetric
        intracranial responses. That made a randomised version of the question worth asking.
      experiment: Tucatinib was randomised against placebo on a trastuzumab and capecitabine backbone in pretreated
        disease, and entry was opened to patients whose brain metastases were untreated or progressing after local
        therapy. Intracranial progression and intracranial response in that group were specified in advance rather
        than found afterwards. The same drug was then randomised on a conjugate backbone and as first-line maintenance,
        in populations that admitted brain metastases without requiring them.
      finding: Adding tucatinib lengthened the time to intracranial progression as well as the time to systemic
        progression. It improved overall survival in the trial as a whole. The direction of effect in the brain
        metastasis group followed the direction in the whole trial rather than diverging from it.
      limitation: This is a group within a systemic trial, not a trial whose entry required brain disease. The
        randomisation protects the drug comparison and not the choice of a central nervous system strategy. The
        control arm carried capecitabine, which has intracranial activity of its own, so the contrast is against
        an active backbone rather than against local therapy or against nothing. Entry followed trastuzumab, pertuzumab
        and a conjugate, so the result is silent about the same question asked earlier in the disease. The two
        later tucatinib trials admitted brain metastases without requiring them, so neither carries a central
        nervous system population that stands on its own.
      next: If a small molecule reaches the compartment, does a conjugate whose antibody should not cross reach
        it as well?
      trials:
      - landscape
      - her2climb
      - her2climb-02
      - her2climb-05
    - id: SQ-0870
      ask: Can an antibody-drug conjugate produce intracranial responses when its antibody is too large to cross
        an intact barrier?
      rationale: The size argument applies to an intact barrier. A metastasis large enough to measure on imaging
        has vasculature that is already disrupted, so the question is not whether the antibody crosses healthy
        brain but whether it reaches tumour. A conjugate also has only to deliver payload, and a membrane-permeable
        payload can act on cells the antibody never bound.
      experiment: Single-arm studies of conjugates in patients with brain metastases, entered by the state of
        the brain disease rather than by line of treatment. Trastuzumab deruxtecan was given in small cohorts
        defined as stable after local therapy, untreated or progressing, and then in a large brain metastasis
        cohort studied alongside a cohort without brain disease. Trastuzumab emtansine was reported from the brain
        metastasis subgroup of a single-arm safety study, and was also given with neratinib in successive cohorts.
      finding: Intracranial responses with the deruxtecan conjugate are routine rather than anecdotal, in active
        disease as well as in disease already treated and stable. In the largest cohort the time to intracranial
        progression was close to the time to systemic progression in the patients who had no brain metastases
        at all. The emtansine conjugate produced intracranial responses too, at a lower rate than the deruxtecan
        conjugate in cohorts that are not otherwise comparable.
      limitation: 'None of these studies has a control arm, so each is measured against what its cohort was expected
        to do. The central nervous system endpoints are not the same object: a progression-free rate at a fixed
        timepoint, an intracranial response by neuro-oncology criteria and an intracranial response by solid tumour
        criteria cannot be read off against one another, and the fixed timepoints are not the same timepoint either.
        The largest of these studies performed no formal hypothesis testing. The emtansine result is a post hoc
        subgroup of a safety study rather than a prespecified endpoint. The first-line conjugate module has only
        a design on the record, so nothing here speaks to untreated disease.'
      next: If response rates cannot be compared across these cohorts, what is actually driving the difference
        between them?
      trials:
      - tuxedo-1
      - debbrah
      - destiny-b12
      - kamilla
      - tbcrc-022
      - destiny-breast07-module-7
    - id: SQ-0880
      ask: Does an intracranial response rate mean the same thing in a radiotherapy-naive cohort as in one that
        has progressed after radiotherapy?
      rationale: A response rate is read as a property of the drug. It is at least as much a property of who was
        admitted and of how a lesion was measured. A previously irradiated lesion has been selected for resistance
        to treatment, and it is also harder to measure, because treatment effect, necrosis and tumour resemble
        each other on imaging.
      experiment: Studies that split their population by central nervous system state on purpose and reported
        the strata separately. One regimen was given to a radiotherapy-naive cohort and to a post-radiotherapy
        cohort within the same trial. Another split its cohorts by whether disease was stable after local therapy,
        untreated or progressing. A third required progression after radiotherapy for entry, and the earliest
        of them required that no brain radiotherapy had been given at all.
      finding: Within a single regimen, intracranial response is higher in the radiotherapy-naive stratum than
        in the stratum that progressed after radiotherapy. Across trials, the ranking of intracranial response
        rates tracks how permissive the entry criteria were more closely than it tracks which drug was given.
      limitation: Prior radiotherapy is not a clean variable. It marks lesions selected for radioresistance, and
        it marks lesions that are harder to measure, and no design here separates the two. No trial randomised
        the order of radiotherapy and systemic treatment, so what a radiotherapy-naive strategy costs the patient,
        if anything, is unmeasured. Reading these strata as a ranking of drugs is the error that this grouping
        exists to prevent.
      next: If the cohorts that look best are the ones that deferred radiotherapy, is there anything to be gained
        by giving the drug and the radiation together?
      trials:
      - permeate
      - landscape
      - debbrah
      - patricia
      - tbcrc-022
      - destiny-b12
    - id: SQ-0890
      ask: Does giving a HER2-directed drug concurrently with brain radiotherapy improve intracranial control
        over radiotherapy alone?
      rationale: The compartment is being irradiated in any case. A HER2 inhibitor that reaches it could act as
        a radiosensitiser. That would buy local control without adding a modality and without waiting for the
        drug to work on its own.
      experiment: Whole brain radiotherapy or radiosurgery was randomised with or without concurrent lapatinib
        in HER2-positive brain metastases, with intracranial complete response at an early fixed timepoint as
        the endpoint. A dose-finding study is now testing the same idea with a more brain-penetrant inhibitor
        alongside radiosurgery.
      finding: Concurrent lapatinib did not improve intracranial complete response over radiotherapy alone. Objective
        response at the same timepoint was not improved either. Complete responses were seen only in the arm that
        received radiotherapy alone.
      limitation: A complete response rate at an early fixed timepoint is a radiographic surrogate chosen because
        it reads out quickly. It is not a measure of how long the compartment stays controlled, and it is the
        endpoint most sensitive to post-radiotherapy imaging change. Lapatinib is also the weakest brain-penetrant
        member of its class, and the same class given without radiotherapy did change intracranial outcomes, so
        this is evidence against one drug on one schedule rather than against concurrency. The study that would
        test the concept with a better drug is a dose-finding protocol with no outcomes on the record, so it cannot
        settle efficacy whatever it eventually reports.
      next: If the concept failed with a drug assumed not to reach tumour in useful concentration, is intracranial
        failure a delivery problem at all?
      trials:
      - nrg-oncology-krog-rtog-1119
      - tutor
      - her2climb
    - id: SQ-0900
      ask: Is intracranial failure a failure of drug delivery, and does engineering for penetration fix it?
      rationale: The standing explanation for central nervous system relapse is that drug does not reach the compartment.
        That explanation makes a prediction. Raising exposure, building a carrier that crosses, or choosing a
        molecule that crosses by design should convert patients who do not respond into patients who do.
      experiment: Four treatment studies came at that prediction from different directions, and one measurement
        study tested its premise directly. Trastuzumab was given at high dose with pertuzumab in brain metastases
        progressing after radiotherapy, and again with a checkpoint inhibitor added, on the argument that exposure
        was the limiting variable. Paclitaxel was conjugated to a peptide that uses a receptor-mediated transport
        route across the barrier, and everolimus, which crosses, was added to trastuzumab and vinorelbine in progressive
        brain metastases under a staged design built to separate a useless intracranial response rate from a useful
        one. Separately, a window study measured a conjugate and its payload in resected brain metastasis tissue.
      finding: Drug is measurable in resected brain metastasis tissue, at the concentration the study had set
        out to demonstrate. None of the four treatment studies met its preset intracranial response rule, and
        two closed early on that basis. Reaching the compartment is necessary, and on this evidence it is not
        sufficient.
      limitation: The window study measured concentration and not benefit. Its lesions were operable and therefore
        large, it enrolled a glioblastoma cohort alongside the breast one, and no design here connects tissue
        concentration to response. The peptide conjugate produced an investigator-read and an independently-read
        intracranial response rate that differ, and they have to be read separately rather than averaged. The
        everolimus study reported response on the patients evaluable for efficacy rather than on everyone enrolled,
        and its correlative claim that pathway mutations did not predict response rests on very few responders.
        The high-dose antibody studies stopped at a preset threshold, which is a judgement about that dose and
        that schedule rather than about the hypothesis.
      next: If penetration is not the limiting step in the parenchyma, is it the limiting step in the leptomeninges,
        where the barrier, the disease and the measurement are all different?
      trials:
      - patricia
      - atezolizumab-plus-pertuzumab-and-high-do
      - ang1005
      - lccc1025
      - sacituzumab-govitecan-phase-0-window-stu
    - id: SQ-0910
      ask: In leptomeningeal HER2-positive disease, does the drug have to be put into the compartment?
      rationale: The leptomeninges are not the parenchyma. There is no bulky lesion with disrupted vasculature
        to exploit. Disease is read from cerebrospinal fluid cytology and from neurological examination rather
        than from target lesions. Survival is short enough that the choice of endpoint constrains the choice of
        design before any drug is chosen.
      experiment: Two routes, tested separately and never against each other. Systemically, tucatinib with trastuzumab
        and capecitabine, and trastuzumab deruxtecan, were each given as a single arm with overall survival against
        a prespecified historical control as the endpoint. By the compartment-directed route, dose-finding and
        phase II studies of intrathecal trastuzumab established a tolerated dose and reported neurological progression-free
        survival, and the only randomised test of the principle added intrathecal liposomal cytarabine to systemic
        therapy in breast cancer of any subtype.
      finding: Both routes report survival longer than the historical expectation each was written against. Intrathecal
        trastuzumab is tolerable and produces cerebrospinal fluid and neurological responses. The randomised intrathecal
        comparison lengthened leptomeningeal progression-free survival without a matching gain in overall survival.
      limitation: 'A prespecified historical control is a fixed number taken from an era before brain-penetrant
        HER2 therapy, so a cohort enrolled now beats it partly by being enrolled now, and the HER2-positive leptomeningeal
        cohorts here are very small. The intrathecal studies do not agree on a dose or a schedule, one of them
        admitted HER2-positive tumours of any origin rather than breast alone, and their endpoints are different
        objects: a maximum tolerated dose, a cerebrospinal fluid response and a neurological progression-free
        survival cannot be pooled into a response rate. The randomised evidence for the intrathecal route comes
        from a drug that is not HER2-directed in a population not selected by subtype, so it supports the principle
        of compartment-directed treatment and not the use of intrathecal trastuzumab. The peptide conjugate''s
        leptomeningeal group is a subset of a parenchymal study compared against historical survival, so it sits
        beside these single arms rather than inside them.'
      next: If systemic HER2 therapy now reaches the leptomeninges well enough to move survival, what does the
        intrathecal route add, and which endpoint would be capable of showing it?
      trials:
      - tbcrc-049
      - debbrah-cohort-5
      - intrathecal-trastuzumab-bonneau-phase-i
      - intrathecal-trastuzumab-kumthekar-phase-
      - intrathecal-trastuzumab-oberkampf-phase-
      - deposein
      - ang1005
  ST-170:
    setting: cns
    subtype: all
    stage: any
    title: The central nervous system as a compartment
    chapters:
    - BC-600
    premise: The brain is the one site where the question is not only which drug to give but whether it arrives,
      and where the treatment that controls the disease can cost the patient the faculties she was being treated
      to keep. The population here is defined by the compartment rather than by the tumour, so most of the randomised
      evidence was generated by radiation oncology in brain metastases of any primary cancer, while the breast-specific
      work is almost all single-arm. Two arguments run through the position. One is what local treatment does
      to cognition, and the other is whether anything given into the blood or into the cerebrospinal fluid changes
      the course of disease behind a barrier built to exclude it.
    questions:
    - id: SQ-0920
      ask: When a limited number of brain metastases has already been treated focally, does adding whole-brain
        radiotherapy earn what it costs?
      rationale: Deposits exist beyond what MRI resolves, so irradiating the whole brain should postpone the appearance
        of new lesions and the neurological death that follows them. The hippocampus and the rest of the normal
        brain take the same dose as the deposits, so whatever is bought in intracranial control is paid for in
        cognition. That trade has to be measured rather than assumed.
      experiment: Randomised comparisons that held the focal treatment constant and varied the whole-brain component.
        Whole-brain radiotherapy against observation after complete resection or radiosurgery, radiosurgery alone
        against radiosurgery plus whole-brain treatment with a cognitive primary endpoint, cavity radiosurgery
        against whole-brain treatment after resection, cavity radiosurgery against observation after resection,
        and whole-brain treatment with or without a radiosurgical boost. Alongside these, a prospective cohort
        asked whether the number of lesions treated with radiosurgery alone changes survival.
      finding: Whole-brain radiotherapy lowers relapse both at the treated site and at new sites, and it lengthens
        neither survival nor the time to loss of performance status. It worsens cognition against focal treatment
        alone, whether it follows resection or radiosurgery. Leaving the resection cavity untreated is a separate
        question and costs local control, so the case is against irradiating the whole brain rather than against
        irradiating anything.
      limitation: Every one of these trials enrolled brain metastases from solid tumours generally and was powered
        on that mixed population, so a breast-specific estimate is a subgroup at best. Cognitive deterioration
        is a scoring convention rather than a clinical event. One trial called it a decline beyond a set margin
        on any single test in a battery and another used a reliability index, and both scored only the patients
        still well enough to be tested, which is an increasingly selected group as the disease progresses. The
        survival advantage for a radiosurgical boost lives in a single-lesion subgroup on univariate analysis
        of a trial that was negative overall. The lesion-count comparison used to justify radiosurgery for several
        metastases comes from a prospective observational cohort compared against itself, not from a randomisation.
      next: If whole-brain radiotherapy remains the right answer for diffuse disease, can the part of its cognitive
        cost that comes from the dose be engineered away?
      trials:
      - ncctg-n0574
      - eortc-22952-26001
      - ncctg-n107c-cec-3
      - mahajan-postoperative-srs-trial
      - rtog-9508
      - jlgk0901
    - id: SQ-0930
      ask: If whole-brain radiotherapy has to be given, can its cognitive cost be engineered down?
      rationale: The memory decline that follows whole-brain treatment is attributed to the dose delivered to
        the hippocampal stem cell niche and to a vascular and glutamatergic injury that a receptor antagonist
        might blunt. Neither mechanism requires the dose to the metastases to change, so both are modifiable without
        giving up intracranial control.
      experiment: One randomised trial gave memantine or placebo through and after whole-brain radiotherapy, with
        delayed recall at a fixed timepoint as the primary measure. A later trial held memantine constant in both
        arms and varied the plan instead, conformally avoiding the hippocampi against conventional whole-brain
        treatment.
      finding: Avoiding the hippocampi lowers the risk of cognitive failure against conventional whole-brain treatment
        given on the same memantine backbone, with survival and intracranial progression unchanged. The memantine
        trial favoured the drug on its own primary measure without crossing its threshold for significance, and
        a secondary measure of time to cognitive decline did favour it.
      limitation: The memantine result is an attrition failure and not a demonstration of no effect, since only
        a minority of those randomised were analysable at the endpoint and the report states its own power as
        far below what the design called for. That matters for how the later trial reads, because its control
        arm already contained memantine on evidence that never met its own threshold, so the avoidance question
        was asked on a backbone the field had adopted rather than proved. Both trials scored cognition by a change
        index on a test battery, which is a measurement convention, and neither enrolled breast cancer specifically.
      next: Local treatment is being refined at its margins. Does anything given systemically alongside radiotherapy
        improve what happens inside the irradiated field?
      trials:
      - rtog-0614
      - nrg-cc001
    - id: SQ-0940
      ask: Does adding a systemic drug to brain radiotherapy improve intracranial control?
      rationale: Radiation and a drug act on the same lesion at the same time, and a drug that reaches the brain
        at all should reach it best while the barrier is disrupted by the tumour and by the radiation itself.
        Radiosensitisation would also let the delivered dose do more without raising it.
      experiment: Randomised trials that held brain radiotherapy constant and added a drug. Concurrent lapatinib
        in HER2-positive disease, concurrent temozolomide, and induction bevacizumab with etoposide and cisplatin
        given before whole-brain treatment rather than with it. A single-arm study paired radiosurgery with a
        checkpoint antibody to ask whether the combination was safe rather than whether it worked.
      finding: No randomised addition improved intracranial response. Concurrent lapatinib produced no complete
        responses at the radiological timepoint and no gain in objective response. Temozolomide did not raise
        response above whole-brain treatment alone. The induction arm separated from radiotherapy alone on brain-specific
        progression only against a significance level the trial had set unusually permissive, and its early brain
        response was no better than the control arm's.
      limitation: The induction trial declared its result against a prespecified alpha far looser than convention,
        and its interval for brain progression or death included no difference, so it is a signal-seeking result
        and not a positive trial. The response endpoints were read on MRI at a fixed early timepoint, where radiation
        change and residual tumour are hard to separate, which is a measurement problem rather than a biological
        one. The radiosurgery and checkpoint study was tiny, single-arm, sized for safety and reported only as
        a long-term follow-up, so its local control has no comparator. The tucatinib and radiosurgery study on
        the record is a protocol with no outcomes, and it asserts nothing about efficacy.
      next: If adding a drug to radiation changes nothing inside the field, is the problem that the drugs used
        never reached the lesion?
      trials:
      - nrg-oncology-krog-rtog-1119
      - wbrt-with-or-without-temozolomide
      - a-plus
      - srs-plus-nivolumab
      - tutor
    - id: SQ-0950
      ask: Is exclusion by the blood-brain barrier the reason systemic drugs fail in the brain?
      rationale: The standard explanation for intracranial progression during effective systemic treatment is
        exposure, in that the drug holds disease everywhere it reaches and the brain is the place it does not.
        If exposure is the whole story, a molecule engineered to cross, or a drug chosen for its penetration,
        should convert into intracranial response.
      experiment: Three different ways of testing that claim. A window study gave an antibody-drug conjugate before
        craniotomy and measured the payload recovered from the resected metastasis, making delivery itself the
        endpoint. A peptide conjugate built to cross by receptor-mediated transcytosis was given to patients with
        recurrent brain metastases. Two further studies took drugs already chosen for brain penetration, a CDK4/6
        inhibitor in hormone receptor-positive disease and an mTOR inhibitor added to HER2 blockade with chemotherapy,
        and asked for intracranial response.
      finding: Delivery and activity came apart. The window study met its concentration endpoint in resected brain
        metastases. The transcytosis conjugate, the CDK4/6 inhibitor and the mTOR combination each missed the
        intracranial response rule they had set themselves in advance.
      limitation: A drug concentration in resected tissue is a pharmacological surrogate with no clinical outcome
        attached, and the tissue came only from patients selected for being operable. The transcytosis conjugate
        was read at two different response rates by investigators and by independent review, and those should
        be read separately rather than merged, with its preset rule assessed on the independent read. The mTOR
        study's response rests on the smaller group evaluable for efficacy rather than on everyone enrolled, and
        its correlative work found no pathway alteration that marked a responder, so no biomarker-defined subgroup
        survives in which the rationale still holds.
      next: If exposure is not the whole explanation in the parenchyma, does the argument hold where exposure
        is lowest, and can a drug given systemically change the course of leptomeningeal disease?
      trials:
      - sacituzumab-govitecan-phase-0-window-stu
      - ang1005
      - jpbo-abemaciclib-cns-study
      - lccc1025
    - id: SQ-0960
      ask: Can systemic therapy alone change the course of leptomeningeal disease?
      rationale: Leptomeningeal involvement has been treated as a terminal event of the compartment, and the trials
        that established the modern systemic agents excluded it by protocol. If a drug reaches the meningeal deposits
        at all, survival counted in weeks might become survival counted in months without any intrathecal or radiation
        treatment at all.
      experiment: Two single-arm studies enrolled leptomeningeal disease specifically and set overall survival
        as the primary endpoint against a prespecified historical median. One gave tucatinib with trastuzumab
        and capecitabine in HER2-positive disease. The other gave trastuzumab deruxtecan in a cohort that admitted
        HER2-positive and HER2-low disease. A leptomeningeal group within the brain-penetrant conjugate study
        was reported alongside its parenchymal population.
      finding: Both prespecified survival endpoints were met against their historical comparators, and the leptomeningeal
        group within the conjugate study was reported as surviving longer than its own historical expectation
        while the parenchymal primary endpoint of that same study was negative.
      limitation: A historical median is the weakest comparator available here, and the medians on offer were
        assembled before the systemic drugs these patients had already received existed, so the comparison contains
        an era effect as well as a treatment effect. Both cohorts are very small, entry required fitness for a
        trial, and diagnosis rested on cytology or on MRI depending on the protocol, which is a case definition
        rather than a biological boundary. The conjugate's leptomeningeal group is a subset of an enrolled population
        rather than a separately powered cohort, so its survival claim is a subgroup measured against history.
      next: If a drug given systemically can hold the leptomeninges, is there anything left for treatment aimed
        at the compartment itself?
      trials:
      - tbcrc-049
      - debbrah-cohort-5
      - ang1005
    - id: SQ-0970
      ask: Does treating the leptomeningeal compartment directly add to treating the patient systemically?
      rationale: Cerebrospinal fluid is a space that can be dosed on its own, either by placing a drug in it or
        by irradiating the whole neuraxis. Both approaches take the exposure problem at face value. Both accept
        a toxicity confined to the compartment in exchange for an exposure that systemic dosing cannot reach.
      experiment: One randomised trial added intrathecal liposomal cytarabine to whatever systemic therapy the
        patient was already receiving and left that systemic choice to the treating clinician. Three single-arm
        studies gave intrathecal trastuzumab in HER2-positive leptomeningeal disease, two as dose-finding and
        one with a neurological progression endpoint. A randomised study compared proton craniospinal irradiation
        against photon radiotherapy to the involved field, with a phase III successor now open.
      finding: Adding intrathecal cytarabine lengthened leptomeningeal progression-free survival against systemic
        therapy alone. Intrathecal trastuzumab proved deliverable, and most patients treated at the recommended
        dose were free of neurological progression at the early timepoint, with responses in a minority. Craniospinal
        proton irradiation lengthened central nervous system progression-free survival against involved-field
        photon treatment.
      limitation: The randomised intrathecal trial measured progression in the compartment it was treating and
        allowed systemic therapy to vary from patient to patient, so the endpoint favours the intervention by
        construction and the background treatment is uncontrolled. The two intrathecal trastuzumab programmes
        arrived at different recommended doses and different schedules, which is a property of their escalation
        rules and their definitions of dose-limiting toxicity rather than of the drug, and one of them admitted
        HER2-positive tumours of any origin rather than breast cancer alone. The proton trial randomised breast
        and lung cancer together, stopped early at a planned interim analysis, and compared treatment of the whole
        neuraxis against a field that by definition did not cover disease outside it, so part of the separation
        is the field size and not the particle. Its confirmatory trial has no result on the record and asserts
        nothing yet.
      next: Every leptomeningeal result here rests on a small cohort, a historical median or a comparator field
        that was never going to win. What would a trial have to randomise to say whether compartment-directed
        and systemic treatment are alternatives or additions?
      trials:
      - deposein
      - intrathecal-trastuzumab-bonneau-phase-i
      - intrathecal-trastuzumab-oberkampf-phase-
      - intrathecal-trastuzumab-kumthekar-phase-
      - proton-csi-versus-photon-ifrt
      - radiate-lm-nrg-bn014
