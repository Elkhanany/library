schema: 1
_note: Single source of truth for every citation in the book. Keys are permanent and position-free. Chapters cite
  [@key]. The build numbers citations per page at render time, so reordering chapters never changes a citation.
_key_policy: lowercase first author surname plus year, e.g. slamon1987. Disambiguate with a letter suffix.
_ingest: Preferred path is Zotero export to CSL-JSON, then tools/import_csl.py. Hand entries are fine.
