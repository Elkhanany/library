<!--
name: capital against risk
source: new for this book: chapter 13G, "Capital against risk"
-->
<figure class="fig" id="fig-{{uid}}">
  <canvas id="{{uid}}-c" data-h="170"></canvas>
  <div class="ctrls">
    <div class="ctrl" role="group" aria-label="How the dollars are split" id="{{uid}}-mix">
      <label>dollars</label>
      <button type="button" data-v="6040" class="on" aria-pressed="true">60/40</button>
      <button type="button" data-v="eqd" aria-pressed="false">equal dollars</button>
      <button type="button" data-v="erc" aria-pressed="false">equal risk</button>
    </div>
  </div>
  <div class="ctrls">
    <div class="ctrl">
      <label for="{{uid}}-vt">trend's volatility</label>
      <input type="range" id="{{uid}}-vt" min="6" max="24" step="1" value="12">
      <output id="{{uid}}-vt-o" for="{{uid}}-vt"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-rt">trend with equity</label>
      <input type="range" id="{{uid}}-rt" min="-0.3" max="0.9" step="0.05" value="0">
      <output id="{{uid}}-rt-o" for="{{uid}}-rt"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-rv">VRP with equity</label>
      <input type="range" id="{{uid}}-rv" min="-0.3" max="0.9" step="0.05" value="0">
      <output id="{{uid}}-rv-o" for="{{uid}}-rv"></output>
    </div>
  </div>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-e"></output></div>
    <div class="ctrl"><output id="{{uid}}-t"></output></div>
    <div class="ctrl"><output id="{{uid}}-v"></output></div>
  </div>
  <p class="readout" aria-live="polite"><span id="{{uid}}-say"></span></p>
  <figcaption><b>Equal dollars are not equal risk.</b> Three foundation sleeves at the chapter's
  volatilities, equity 16%, the VRP 10% and trend at the volatility you set, split by dollars
  (top) and by their risk contributions, RC = w(Σw)/σp (bottom). Choose the chapter's 60/40 of
  equity and trend, equal dollars, or the weights that give each sleeve a third of the risk,
  and set each sleeve's correlation with equity; trend and the VRP move together only through
  equity. Raise the VRP's correlation toward the 1.0 of a liquidity event and its share of the
  risk grows well past what its volatility alone would give.</figcaption>
</figure>
<script>
(function () {
  var U = '{{uid}}';
  var VT = DL.$(U + '-vt'), RT = DL.$(U + '-rt'), RV = DL.$(U + '-rv');
  var mix = DL.seg(U + '-mix', update);
  var NAMES = ['equity', 'trend', 'VRP'], ROLE = ['accent', 'insight', 'familiar'];

  /* the covariance matrix. Each sleeve's correlation with equity is set; trend and the VRP
     are taken to move together only through equity, so their correlation is the product of
     the two, which keeps the matrix a valid one for every setting of the sliders */
  function cov(sig, rt, rv) {
    var C = [[1, rt, rv], [rt, 1, rt * rv], [rv, rt * rv, 1]];
    return C.map(function (row, i) { return row.map(function (c, j) { return c * sig[i] * sig[j]; }); });
  }
  function times(S, w) { return S.map(function (row) { return row.reduce(function (a, c, j) { return a + c * w[j]; }, 0); }); }
  /* the portfolio's volatility and each sleeve's contribution, RC_i = w_i (Sigma w)_i / sigma_p */
  function split(S, w) {
    var Sw = times(S, w), v = w.reduce(function (a, wi, i) { return a + wi * Sw[i]; }, 0);
    var sp = Math.sqrt(v), rc = w.map(function (wi, i) { return wi * Sw[i] / sp; });
    return { sp: sp, rc: rc };
  }
  /* the weights that give equal contributions: start from 1/sigma, the answer when the
     sleeves are uncorrelated, and scale each weight toward the average contribution */
  function equalRisk(S, sig) {
    var w = sig.map(function (s) { return 1 / s; }), i, k;
    for (k = 0; k < 400; k++) {
      var sum = w.reduce(function (a, b) { return a + b; }, 0);
      w = w.map(function (x) { return x / sum; });
      var r = split(S, w).rc, avg = (r[0] + r[1] + r[2]) / 3;
      for (i = 0; i < 3; i++) w[i] *= r[i] > 0 ? Math.sqrt(avg / r[i]) : 2;
    }
    var s2 = w.reduce(function (a, b) { return a + b; }, 0);
    return w.map(function (x) { return x / s2; });
  }

  var st;
  function compute() {
    var sig = [0.16, +VT.value / 100, 0.10], rt = +RT.value, rv = +RV.value, m = mix();
    var S = cov(sig, rt, rv);
    var w = m === 'eqd' ? [1 / 3, 1 / 3, 1 / 3] : m === 'erc' ? equalRisk(S, sig) : [0.6, 0.4, 0];
    var sp = split(S, w);
    st = { sig: sig, rt: rt, rv: rv, m: m, w: w, sp: sp.sp, rc: sp.rc,
           share: sp.rc.map(function (x) { return x / sp.sp; }) };
  }

  compute();
  var draw = DL.figure(U + '-c', function (c) {
    var neg = 0, pos = 0;
    st.share.forEach(function (x) { if (x < 0) neg += x; else pos += x; });
    var lo = Math.min(0, neg), hi = Math.max(1, pos);
    var p = new NMT.Plot(c, { xmin: lo, xmax: hi, ymin: 0, ymax: 3,
                              pad: { l: 58, r: 14, t: 26, b: 26 }, grid: false });
    DL.axes(p, { xs: [0, 0.25, 0.5, 0.75, 1], y: false, yAxis: false, grid: false,
                 x: function (v) { return Math.round(v * 100) + '%'; } });
    var g = p.g, soft = DL.color('ink-soft'), paper = DL.color('paper');
    var font = '11px ' + DL.color('sans');
    DL.legend(p, NAMES.map(function (n, i) { return { label: n, color: DL.color(ROLE[i]), box: true }; }),
              { dx: -p.o.pad.l + 6 - 10, dy: -p.o.pad.t + 2 });

    /* one stacked bar: positive parts from 0 to the right, a negative part (a sleeve that
       lowers the total) from 0 to the left, a gap of the page's ground between segments */
    function bar(y, parts) {
      var right = 0, left = 0, h = 0.72;
      parts.forEach(function (x, i) {
        if (Math.abs(x) < 1e-9) return;
        var a = x >= 0 ? right : left + x, b = x >= 0 ? right + x : left;
        if (x >= 0) right += x; else left += x;
        var x0 = p.X(a), x1 = p.X(b), y0 = p.Y(y + h / 2), y1 = p.Y(y - h / 2);
        g.fillStyle = DL.fade(DL.color(ROLE[i]), x >= 0 ? 0.85 : 0.35);
        g.fillRect(x0, y0, Math.max(1, x1 - x0), y1 - y0);
        g.strokeStyle = paper;
        g.lineWidth = 2;
        g.strokeRect(x0, y0, Math.max(1, x1 - x0), y1 - y0);
        /* the segment's share inside it, with its name where there is room */
        g.save();
        g.font = font;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillStyle = paper;
        var pct = (x < 0 ? DL.MINUS : '') + Math.round(Math.abs(x) * 100) + '%', wid = x1 - x0;
        var full = NAMES[i] + ' ' + pct;
        var txt = g.measureText(full).width + 8 <= wid ? full : g.measureText(pct).width + 6 <= wid ? pct : '';
        if (x < 0) g.fillStyle = soft;
        g.fillText(txt, (x0 + x1) / 2, (y0 + y1) / 2 + 0.5);
        g.restore();
      });
    }
    bar(2.1, st.w);
    bar(0.95, st.share);
    g.save();
    g.font = font;
    g.fillStyle = soft;
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    g.fillText('dollars', p.X(lo) - 8, p.Y(2.1));
    g.fillText('risk', p.X(lo) - 8, p.Y(0.95));
    g.restore();
    if (lo < 0) DL.vline(p, 0, { color: DL.color('ink-faint') });
  });

  function pc(x) { return (x < 0 ? DL.MINUS : '') + Math.round(Math.abs(x) * 100) + '%'; }
  function rho(x) { return x === 0 ? '0' : (x < 0 ? DL.MINUS : '') + DL.num(Math.abs(x), 2); }
  function update() {
    compute();
    DL.out(U + '-vt-o', Math.round(st.sig[1] * 100) + '%');
    DL.out(U + '-rt-o', rho(st.rt));
    DL.out(U + '-rv-o', rho(st.rv));
    [U + '-e', U + '-t', U + '-v'].forEach(function (id, i) {
      DL.out(id, NAMES[i] + ': dollars ' + pc(st.w[i]) + ', risk ' + pc(st.share[i]));
    });
    var pts = st.rc.map(function (x) { return DL.num(x * 100, 1); });
    DL.out(U + '-say', 'The portfolio\'s volatility is ' + DL.num(st.sp * 100, 1) + '%: equity contributes ' +
           pts[0] + ' points, trend ' + pts[1] + ' and the VRP ' + pts[2] + '.');
    draw();
  }
  update();
  DL.bind([U + '-vt', U + '-rt', U + '-rv'], update);
})();
</script>
