<!--
name: factor sorting machine
source: new for this book: chapter 10F, "A factor sorting machine"
-->
<figure class="fig" id="fig-{{uid}}">
  <canvas id="{{uid}}-s" data-h="170"></canvas>
  <canvas id="{{uid}}-c" data-h="240"></canvas>
  <div class="ctrls">
    <div class="ctrl">
      <label for="{{uid}}-b">monthly trait link</label>
      <input type="range" id="{{uid}}-b" min="0" max="0.5" step="0.01" value="0.15">
      <output id="{{uid}}-b-o" for="{{uid}}-b"></output>
    </div>
    <div class="ctrl" role="group" aria-label="Stocks in each group" id="{{uid}}-k">
      <label>stocks in each group</label>
      <button type="button" data-v="5" aria-pressed="false">5</button>
      <button type="button" data-v="10" class="on" aria-pressed="true">10</button>
      <button type="button" data-v="25" aria-pressed="false">25</button>
    </div>
    <div class="ctrl"><button type="button" id="{{uid}}-new">new stocks</button></div>
  </div>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-sr"></output></div>
    <div class="ctrl"><output id="{{uid}}-yrs"></output></div>
    <div class="ctrl"><output id="{{uid}}-run"></output></div>
    <div class="ctrl"><output id="{{uid}}-dd"></output></div>
  </div>
  <figcaption><b>A weak link, sorted every month for twenty years.</b> Each month fifty made-up
  stocks get a new trait score, and each standard deviation of score adds the trait link to a
  stock's expected monthly return, against 8% a month of noise of its own. Above is the first
  month's sort: buy the top group, sell the bottom group short, and earn the gap between their
  returns. Below are 240 months of that long-short portfolio beside a made-up market, as the
  growth of $1 on a log scale, with the longest stretch below an old peak shaded. At the default
  link the true Sharpe ratio is 0.40, and this run, a typical one, ends short of t = 2 after
  more than six years below one peak.</figcaption>
</figure>
<script>
(function () {
  var U = '{{uid}}';
  var LINK = DL.$(U + '-b');
  var k = DL.seg(U + '-k', update);

  /* The made-up market: 50 stocks, 240 months. Each month the market returns
     MU + SM * g; each stock gets a fresh trait score z ~ N(0, 1) and returns
         r = market + b * z + SE * e,     e ~ N(0, 1),
     so b is the extra monthly return of a stock one standard deviation up the
     ranking and SE is the noise of its own. The long-short portfolio buys the
     top k stocks by z and sells the bottom k short, equal weights:
         F = mean(r, top) - mean(r, bottom)   (the market cancels). */
  var N = 50, T = 240, MU = 0.006, SM = 0.045, SE = 0.08, KS = [5, 10, 25];
  /* the expected gap in trait score between the top k and the bottom k of 50 draws,
     and its variance (order statistics of the normal), for the true Sharpe ratio */
  var DZ = { 5: [3.4110, 0.1354], 10: [2.7436, 0.0799], 25: [1.5710, 0.0288] };
  var seed = 52, sim;

  function simulate(s) {
    var r = DL.rng(s), mkt = [], gz = {}, ge = {}, first = null;
    KS.forEach(function (n) { gz[n] = []; ge[n] = []; });
    for (var t = 0; t < T; t++) {
      var m = MU + SM * DL.gauss(r), z = [], e = [], i;
      for (i = 0; i < N; i++) { z.push(DL.gauss(r)); e.push(DL.gauss(r)); }
      var idx = z.map(function (_, j) { return j; }).sort(function (a, c) { return z[a] - z[c]; });
      KS.forEach(function (n) {
        var dz = 0, de = 0;
        for (var j = 0; j < n; j++) {
          dz += z[idx[N - 1 - j]] - z[idx[j]];
          de += e[idx[N - 1 - j]] - e[idx[j]];
        }
        gz[n].push(dz / n);
        ge[n].push(de / n);
      });
      mkt.push(m);
      if (t === 0) first = { m: m, z: z, e: e, idx: idx };
    }
    /* the first month's chart keeps one scale while the link moves */
    var lo = Infinity, hi = -Infinity;
    first.e.forEach(function (x) { lo = Math.min(lo, first.m + SE * x); hi = Math.max(hi, first.m + SE * x); });
    first.lo = Math.floor((lo - 0.016) / 0.05) * 0.05;
    first.hi = Math.ceil((hi + 0.016) / 0.05) * 0.05;
    first.zx = Math.max(3, Math.ceil((Math.max.apply(null, first.z.map(Math.abs)) + 0.25) * 2) / 2);
    return { mkt: mkt, gz: gz, ge: ge, first: first };
  }

  var st;
  function compute() {
    var b = +LINK.value / 100, n = +k(), F = [], vf = [1], vm = [1], t;
    for (t = 0; t < T; t++) {
      F.push(b * sim.gz[n][t] + SE * sim.ge[n][t]);
      vf.push(vf[t] * (1 + F[t]));
      vm.push(vm[t] * (1 + sim.mkt[t]));
    }
    var mean = 0, v = 0;
    F.forEach(function (x) { mean += x; });
    mean /= T;
    F.forEach(function (x) { v += (x - mean) * (x - mean); });
    var sd = Math.sqrt(v / (T - 1));
    /* the longest time from a peak to the month that regains it (to the end if never) */
    var peak = 1, pk = 0, best = { len: 0, from: 0, to: 0, level: 1, open: false };
    for (t = 1; t <= T; t++) {
      if (vf[t] >= peak) {
        if (t - pk > 1 && t - pk > best.len) best = { len: t - pk, from: pk, to: t, level: peak, open: false };
        peak = vf[t];
        pk = t;
      }
    }
    if (T - pk > 1 && T - pk > best.len) best = { len: T - pk, from: pk, to: T, level: peak, open: true };
    var dz = DZ[n];
    var srTrue = Math.sqrt(12) * b * dz[0] / Math.sqrt(2 * SE * SE / n + b * b * dz[1]);
    st = { b: b, n: n, F: F, vf: vf, vm: vm, srTrue: srTrue,
           srRun: mean / sd * Math.sqrt(12), tRun: mean / sd * Math.sqrt(T), dd: best };
  }

  function font() { return '11px ' + DL.color('sans'); }
  /* text on a paper patch, so a line passing under it leaves it readable */
  function label(p, px, py, s, color, align) {
    var g = p.g;
    g.save();
    g.font = font();
    var w = g.measureText(s).width;
    var x0 = align === 'right' ? px - w : align === 'center' ? px - w / 2 : px;
    g.fillStyle = DL.fade(DL.color('paper'), 0.88);
    g.fillRect(x0 - 3, py - 8, w + 6, 16);
    g.fillStyle = color;
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillText(s, x0, py);
    g.restore();
    return w;
  }
  function sigma(v) {
    if (v === 0) return '0';
    return (v < 0 ? DL.MINUS : '+') + Math.abs(v) + 'σ';
  }

  sim = simulate(seed);
  compute();
  var drawSort = DL.figure(U + '-s', function (c) {
    var f = sim.first, b = st.b, n = st.n, zx = f.zx;
    var p = new NMT.Plot(c, { xmin: -zx, xmax: zx, ymin: f.lo, ymax: f.hi,
                              pad: { l: 42, r: 16, t: 24, b: 24 } });
    var ys = [];
    for (var y = Math.ceil(f.lo / 0.1) * 0.1; y <= f.hi + 1e-9; y += 0.1) ys.push(Math.round(y * 10) / 10);
    DL.axes(p, { xs: [-2, -1, 0, 1, 2], ys: ys, x: sigma,
                 y: function (v) { return DL.num(v * 100, 0) + '%'; } });
    var ret = function (i) { return f.m + b * f.z[i] + SE * f.e[i]; };
    var top = f.idx.slice(N - n), bot = f.idx.slice(0, n), mid = f.idx.slice(n, N - n);
    var ins = DL.color('insight'), pla = DL.color('plain');
    mid.forEach(function (i) { p.dot(f.z[i], ret(i), { r: 2.6, color: DL.fade(DL.color('ink-faint'), 0.6) }); });
    top.forEach(function (i) { p.dot(f.z[i], ret(i), { r: 3, color: DL.fade(ins, 0.85) }); });
    bot.forEach(function (i) { p.dot(f.z[i], ret(i), { r: 3, color: DL.fade(pla, 0.85) }); });
    /* the true link, and each group's average return across the group's scores */
    p.seg(-zx, f.m - zx * b, zx, f.m + zx * b, { color: DL.color('ink-soft'), width: 1.2, dash: [4, 3] });
    function avg(g) { var s = 0; g.forEach(function (i) { s += ret(i); }); return s / g.length; }
    var at = avg(top), ab = avg(bot);
    p.seg(f.z[top[0]], at, f.z[top[n - 1]], at, { color: ins, width: 2.4 });
    p.seg(f.z[bot[0]], ab, f.z[bot[n - 1]], ab, { color: pla, width: 2.4 });
    label(p, p.X(-zx) + 2, 12, "the first month's sort", DL.color('ink-soft'), 'left');
    label(p, p.X(zx), 12, 'top ' + DL.MINUS + ' bottom = ' + DL.spct(at - ab, 1),
          DL.color('accent'), 'right');
  });

  var draw = DL.figure(U + '-c', function (c) {
    var L2 = function (v) { return Math.log(v) / Math.LN2; };
    var lo = 0, hi = 0;
    st.vf.concat(st.vm).forEach(function (v) { lo = Math.min(lo, L2(v)); hi = Math.max(hi, L2(v)); });
    lo = Math.floor(lo - 0.15);
    hi = Math.ceil(hi + 0.35);
    var p = new NMT.Plot(c, { xmin: 0, xmax: T, ymin: lo, ymax: hi,
                              pad: { l: 42, r: 16, t: 14, b: 24 } });
    var ys = [];
    var step = hi - lo > 7 ? 2 : 1;
    for (var y = lo; y <= hi; y++) if ((y - lo) % step === 0) ys.push(y);
    DL.axes(p, { xs: [0, 60, 120, 180, 240], ys: ys,
                 x: function (v) { return v === 0 ? '0' : v / 12 + ' yr'; },
                 y: function (v) { return '$' + DL.num(Math.pow(2, v), v < 0 ? (v < -1 ? 2 : 1) : 0); } });
    var xs = [];
    for (var t = 0; t <= T; t++) xs.push(t);
    var dd = st.dd, pla = DL.color('plain'), acc = DL.color('accent'), fam = DL.color('familiar');
    if (dd.len > 0) {
      var g = p.g;
      g.save();
      g.fillStyle = DL.fade(pla, 0.1);
      g.fillRect(p.X(dd.from), p.Y(hi), p.X(dd.to) - p.X(dd.from), p.Y(lo) - p.Y(hi));
      g.restore();
      p.seg(dd.from, L2(dd.level), dd.to, L2(dd.level), { color: pla, width: 1.2, dash: [4, 3] });
    }
    DL.line(p, xs, st.vm.map(L2), { color: DL.fade(fam, 0.85), width: 1.3 });
    DL.line(p, xs, st.vf.map(L2), { color: acc, width: 2 });
    DL.legend(p, [{ label: 'long-short', color: acc }, { label: 'market', color: fam }]);
    if (dd.len > 0) {
      var s = DL.num(dd.len / 12, 1) + (dd.open ? '+' : '') + ' years below a peak';
      var g2 = p.g;
      g2.save();
      g2.font = font();
      var w = g2.measureText(s).width;
      g2.restore();
      var cx = (p.X(dd.from) + p.X(dd.to)) / 2;
      cx = Math.max(p.X(0) + w / 2 + 4, Math.min(p.X(T) - w / 2 - 4, cx));
      /* under the key when the two would meet */
      var yy = cx - w / 2 < p.X(0) + 175 ? 44 : 26;
      label(p, cx, yy, s, pla, 'center');
    }
  });

  function update() {
    compute();
    DL.out(U + '-b-o', DL.num(st.b * 100, 2) + '% per σ');
    DL.out(U + '-sr', 'true Sharpe ratio = ' + DL.num(st.srTrue, 2));
    var yrs = st.srTrue > 0 ? Math.pow(2 / st.srTrue, 2) : Infinity;
    DL.out(U + '-yrs', isFinite(yrs) ? 't = 2 takes ' + DL.num(yrs, 0) + ' years' : 't = 2: never');
    DL.out(U + '-run', 'this run: Sharpe ' + DL.num(st.srRun, 2) + ', t = ' + DL.num(st.tRun, 2));
    DL.out(U + '-dd', 'longest below a peak: ' + DL.num(st.dd.len / 12, 1) +
                      (st.dd.open ? '+' : '') + ' years');
    drawSort();
    draw();
  }
  update();
  DL.bind([U + '-b'], update);
  DL.$(U + '-new').addEventListener('click', function () { seed += 1; sim = simulate(seed); update(); });
})();
</script>
