<!--
name: filter screening grid
source: new for this book: chapter 10A, "A filter as a screening test"
-->
<figure class="fig" id="fig-{{uid}}">
  <canvas id="{{uid}}-c" data-h="300"></canvas>
  <div class="ctrls">
    <div class="ctrl">
      <label for="{{uid}}-prev">stress months</label>
      <input type="range" id="{{uid}}-prev" min="1" max="50" step="1" value="10">
      <output id="{{uid}}-prev-o" for="{{uid}}-prev"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-sens">sensitivity</label>
      <input type="range" id="{{uid}}-sens" min="0" max="100" step="5" value="80">
      <output id="{{uid}}-sens-o" for="{{uid}}-sens"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-spec">specificity</label>
      <input type="range" id="{{uid}}-spec" min="50" max="100" step="1" value="90">
      <output id="{{uid}}-spec-o" for="{{uid}}-spec"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-loss">loss in stress</label>
      <input type="range" id="{{uid}}-loss" min="1" max="20" step="1" value="8">
      <output id="{{uid}}-loss-o" for="{{uid}}-loss"></output>
    </div>
  </div>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-flags"></output></div>
    <div class="ctrl"><output id="{{uid}}-hit"></output></div>
    <div class="ctrl"><output id="{{uid}}-net"></output></div>
  </div>
  <p class="readout" aria-live="polite"><b id="{{uid}}-vk"></b> <span id="{{uid}}-vt"></span></p>
  <figcaption><b>Wrong on most of its calls, and still worth keeping.</b> A hundred months of
  a put-writing sleeve that earns 1% in a calm month, one square each, sorted by what the
  regime filter did. The bar is the hit rate, the share of flags followed by stress. The solid
  tick is the kill rule's 50% line, and the dashed tick is the break-even, where the losses
  avoided just pay for the gains given up. Lower the share of stress months and the hit rate
  falls however good the filter is, while the net value stays positive far below the
  line.</figcaption>
</figure>
<script>
(function () {
  var U = '{{uid}}';
  var PREV = DL.$(U + '-prev'), SENS = DL.$(U + '-sens'), SPEC = DL.$(U + '-spec'),
      LOSS = DL.$(U + '-loss');
  var GAIN = 1;   /* the chapter's calm month: the sleeve earns 1% */

  /* the chapter's count of 100 months: S stress months and C calm ones; the filter flags
     sensitivity x S of the stress months and (1 - specificity) x C of the calm ones,
     rounded to whole months so that the grid and the numbers agree */
  var st;
  function compute() {
    var S = Math.round(+PREV.value), C = 100 - S;
    var tp = Math.round(+SENS.value * S / 100), fp = Math.round((100 - +SPEC.value) * C / 100);
    var L = +LOSS.value, G = GAIN;
    st = { S: S, C: C, tp: tp, fn: S - tp, fp: fp, tn: C - fp, L: L, G: G,
           flags: tp + fp, hit: tp + fp > 0 ? tp / (tp + fp) : null,
           saved: tp * L, cost: fp * G, even: G / (L + G) };
    st.net = st.saved - st.cost;
  }

  function pts(x) { return DL.num(x, Math.abs(x - Math.round(x)) > 1e-9 ? 1 : 0); }
  function ptsw(x) { return pts(x) + (Math.abs(x) === 1 ? ' point' : ' points'); }
  function font(px) { return (px || 11) + 'px ' + DL.color('sans'); }

  compute();
  var draw = DL.figure(U + '-c', function (cv) {
    var p = new NMT.Plot(cv, { xmin: 0, xmax: 1, ymin: 0, ymax: 1,
                               pad: { l: 0, r: 0, t: 0, b: 0 } });
    var g = p.g, W = p.w, H = p.h;
    g.clearRect(0, 0, W, H);
    g.fillStyle = DL.color('paper');
    g.fillRect(0, 0, W, H);

    var cols = { tp: DL.color('insight'), fp: DL.color('accent'), fn: DL.color('plain'),
                 tn: DL.fade(DL.color('ink-faint'), 0.22) };
    var soft = DL.color('ink-soft'), faint = DL.color('ink-faint'), ink = DL.color('ink');

    /* a wide column: the grid at the left, the key and the bar to its right;
       a phone: the grid and the key side by side, the bar across the bottom */
    var wide = W >= 560, side, lx, ly, t0, t1, ty;
    if (wide) {
      side = H - 12; lx = side + 40; ly = 22; t0 = lx; t1 = W - 12; ty = ly + 4 * 22 + 56;
    } else {
      side = Math.min(W - 128, H - 100); lx = side + 16; ly = 14; t0 = 6; t1 = W - 6;
      ty = side + 46;
    }
    var cell = side / 10, gap = Math.max(1.5, cell * 0.12), y0 = 6;

    /* flagged months first (true, then false alarms), then the unflagged (missed stress,
       then quiet months), read across the rows */
    var kinds = [];
    var n;
    for (n = 0; n < st.tp; n++) kinds.push('tp');
    for (n = 0; n < st.fp; n++) kinds.push('fp');
    for (n = 0; n < st.fn; n++) kinds.push('fn');
    for (n = 0; n < st.tn; n++) kinds.push('tn');
    kinds.forEach(function (k, i) {
      var r = Math.floor(i / 10), c = i % 10;
      g.fillStyle = cols[k];
      g.fillRect(c * cell + gap / 2, y0 + r * cell + gap / 2, cell - gap, cell - gap);
    });

    /* the key, with each count */
    var key = [['tp', st.tp, st.tp === 1 ? 'true alarm' : 'true alarms'],
               ['fp', st.fp, st.fp === 1 ? 'false alarm' : 'false alarms'],
               ['fn', st.fn, 'missed stress'],
               ['tn', st.tn, st.tn === 1 ? 'quiet month' : 'quiet months']];
    g.save();
    g.font = font(11);
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    key.forEach(function (k, i) {
      var y = ly + i * 22;
      g.fillStyle = cols[k[0]];
      g.fillRect(lx, y - 6, 12, 12);
      g.fillStyle = soft;
      g.fillText(k[1] + ' ' + k[2], lx + 18, y);
    });
    g.restore();

    /* the bar: the hit rate against the kill line (50%) and the break-even */
    function X(v) { return t0 + v * (t1 - t0); }
    var hit = st.hit, bh = 8;
    g.save();
    g.fillStyle = DL.fade(DL.color('ink-faint'), 0.18);
    g.fillRect(t0, ty, t1 - t0, bh);
    if (hit != null) {
      g.fillStyle = hit >= 0.5 ? cols.tp : st.net > 0 ? cols.fp : cols.fn;
      g.fillRect(t0, ty, Math.max(2, X(hit) - t0), bh);
    }
    g.strokeStyle = ink;
    g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(Math.round(X(0.5)) + 0.5, ty - 6);
    g.lineTo(Math.round(X(0.5)) + 0.5, ty + bh + 6);
    g.stroke();
    g.setLineDash([3, 2]);
    g.strokeStyle = soft;
    g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(Math.round(X(st.even)) + 0.5, ty - 6);
    g.lineTo(Math.round(X(st.even)) + 0.5, ty + bh + 6);
    g.stroke();
    g.setLineDash([]);

    /* labels: the hit rate above the bar, the two ticks below it, pushed apart when
       they would touch and kept inside the canvas */
    g.font = font(11);
    g.textBaseline = 'bottom';
    var hl = hit == null ? 'no flags' : 'hit rate ' + DL.pct(hit, 0);
    var hw = g.measureText(hl).width, hx = hit == null ? t0 : X(hit);
    hx = Math.max(t0 + hw / 2, Math.min(t1 - hw / 2, hx));
    g.textAlign = 'center';
    g.fillStyle = ink;
    g.fillText(hl, hx, ty - 8);

    var labs = [{ x: X(st.even), s: 'break-even ' + DL.pct(st.even, 0), c: soft },
                { x: X(0.5), s: 'kill line 50%', c: ink }];
    labs.forEach(function (l) { l.w = g.measureText(l.s).width; l.l = l.x - l.w / 2; });
    labs.sort(function (a, b) { return a.x - b.x; });
    var a = labs[0], b = labs[1], need = a.l + a.w + 10 - b.l;
    if (need > 0) { a.l -= need / 2; b.l += need / 2; }
    if (a.l < t0) { b.l += t0 - a.l; a.l = t0; }
    if (b.l + b.w > t1) { a.l -= b.l + b.w - t1; b.l = t1 - b.w; }
    a.l = Math.max(t0, a.l);
    g.textAlign = 'left';
    g.textBaseline = 'top';
    var row2 = a.l + a.w + 6 > b.l;
    labs.forEach(function (l, i) {
      g.fillStyle = l.c;
      g.fillText(l.s, l.l, ty + bh + 8 + (row2 && i === 1 ? 14 : 0));
    });
    g.restore();
  });

  function update() {
    compute();
    DL.out(U + '-prev-o', st.S + '%');
    DL.out(U + '-sens-o', DL.$(U + '-sens').value + '%');
    DL.out(U + '-spec-o', DL.$(U + '-spec').value + '%');
    DL.out(U + '-loss-o', st.L + '%');
    DL.out(U + '-flags', 'flags = ' + st.flags + ' (' + st.tp + ' true, ' + st.fp + ' false)');
    DL.out(U + '-hit', st.hit == null ? 'hit rate: no flags'
                                      : 'hit rate = ' + st.tp + '/' + st.flags + ' = ' + DL.pct(st.hit, 0));
    DL.out(U + '-net', 'net = ' + pts(st.saved) + ' ' + DL.MINUS + ' ' + pts(st.cost) + ' = ' +
           (st.net > 0 ? '+' : '') + ptsw(st.net));
    var vk, vt, are = st.tp === 1 ? 'is' : 'are';
    if (st.hit == null) {
      vk = 'No flags.';
      vt = 'The filter never stands aside, so it avoids no loss and gives up no gain.';
    } else if (st.hit >= 0.5) {
      vk = 'Keep it.';
      vt = st.tp + ' of ' + st.flags + ' flags ' + are + ' followed by stress, at or above the 50% line.' +
           (st.net > 0 ? ' Standing aside saves ' + ptsw(st.net) + ' over the 100 months.' : '');
    } else if (st.net > 0) {
      vk = 'Recalibrate, do not drop.';
      vt = 'Only ' + st.tp + ' of ' + st.flags + ' flags ' + are + ' followed by stress, below the 50% line.' +
           ' Standing aside still avoids ' + ptsw(st.saved) + ' of loss and gives up ' +
           ptsw(st.cost) + ' of gain.';
    } else {
      vk = 'Recalibrate: as set, it costs money.';
      vt = 'Only ' + st.tp + ' of ' + st.flags + ' flags ' + are + ' followed by stress, below the' +
           ' break-even of ' + DL.pct(st.even, 0) + ', so the gains it gives up outweigh the' +
           ' losses it avoids.';
    }
    DL.out(U + '-vk', vk);
    DL.out(U + '-vt', vt);
    draw();
  }
  update();
  DL.bind([U + '-prev', U + '-sens', U + '-spec', U + '-loss'], update);
})();
</script>
