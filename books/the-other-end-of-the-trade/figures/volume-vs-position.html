<!--
name: volume is not position
source: new for this book: chapter 8B, "Volume is not position"
-->
<figure class="fig" id="fig-{{uid}}">
  <canvas id="{{uid}}-b" data-h="120"></canvas>
  <canvas id="{{uid}}-c" data-h="220"></canvas>
  <div class="ctrls">
    <div class="ctrl">
      <label for="{{uid}}-p">customers buying</label>
      <input type="range" id="{{uid}}-p" min="45" max="55" step="0.5" value="51.5">
      <output id="{{uid}}-p-o" for="{{uid}}-p"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-e">misclassified, e</label>
      <input type="range" id="{{uid}}-e" min="0" max="45" step="1" value="13">
      <output id="{{uid}}-e-o" for="{{uid}}-e"></output>
    </div>
  </div>
  <div class="ctrls">
    <div class="ctrl">
      <label for="{{uid}}-sp">spread legs</label>
      <input type="range" id="{{uid}}-sp" min="0" max="50" step="5" value="15">
      <output id="{{uid}}-sp-o" for="{{uid}}-sp"></output>
    </div>
    <div class="ctrl"><button type="button" id="{{uid}}-new">new day</button></div>
  </div>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-held"></output></div>
    <div class="ctrl"><output id="{{uid}}-map"></output></div>
    <div class="ctrl"><output id="{{uid}}-all"></output></div>
  </div>
  <p class="readout" aria-live="polite"><b id="{{uid}}-vk"></b> <span id="{{uid}}-vt"></span></p>
  <figcaption><b>Volume is not position.</b> A made-up session in one same-day put: 2,000
  trades, 100,000 contracts in all, and each trade's true side. Customers buy the chosen share
  of the volume over the day, and market makers take the other side of every trade, so they
  end short what customers net bought. Above, on one scale, the day's gross volume, the market
  makers' true net position at the close, and the position a flow-based map infers. Below, the
  true position and the inferred one through the day. The map signs each trade with a rule
  that errs with probability e, and signs the legs of spreads at random, the near-50% error
  Savickas and Wilson found for the legs of complex index orders. At the start the session
  echoes Cboe's example of August 15, 2023: about 100,000 contracts traded, and market makers
  left short about 3,000.</figcaption>
</figure>
<script>
(function () {
  var U = '{{uid}}';
  var PP = DL.$(U + '-p'), EE = DL.$(U + '-e'), SPR = DL.$(U + '-sp');
  var NT = 2000, GROSS = 100000, STEPS = 390;
  var seed = 2, st;

  /* The session: each trade has a minute, a size and draws for its side, its spread status
     and its classification, all from one seed, so the controls change the rules and not the
     trades. Sizes are heavy-tailed and scaled so the day adds up to 100,000 contracts. */
  function day(sd) {
    var r = DL.rng(sd), raw = [], tot = 0, out = [];
    for (var i = 0; i < NT; i++) {
      var s = Math.exp(DL.gauss(r) * 0.9);
      raw.push(s);
      tot += s;
    }
    var sum = 0;
    for (var j = 0; j < NT; j++) {
      var n = Math.max(1, Math.round(raw[j] * GROSS / tot));
      sum += n;
      out.push({ t: (j + r()) * STEPS / NT, n: n, u: r(), sp: r(), cl: r(), coin: r() });
    }
    out[NT - 1].n += GROSS - sum;
    return out;
  }
  var trades = day(seed), tradesSeed = seed;

  /* Sides: a customer buys with a probability that leans toward the chosen share, so the
     running balance wanders but ends near it. Market makers hold minus the customers' net.
     The map signs a simple trade wrongly when its draw falls below e, and a spread leg by a
     coin toss. */
  function compute() {
    if (tradesSeed !== seed) { trades = day(seed); tradesSeed = seed; }
    var p = +PP.value / 100, e = +EE.value / 100, sp = +SPR.value / 100;
    var V = 0, B = 0, mm = 0, map = 0, wrong = 0, wrongN = 0;
    var ts = [0], tru = [0], inf = [0];
    trades.forEach(function (tr) {
      var lean = p + (p * V - B) / 2000;
      var buy = tr.u < Math.max(0.05, Math.min(0.95, lean));
      V += tr.n;
      if (buy) B += tr.n;
      mm += buy ? -tr.n : tr.n;
      var isSpread = tr.sp < sp;
      var wrongSide = isSpread ? tr.coin < 0.5 : tr.cl < e;
      if (wrongSide) { wrong++; wrongN += tr.n; }
      var seenBuy = wrongSide ? !buy : buy;
      map += seenBuy ? -tr.n : tr.n;
      ts.push(tr.t); tru.push(mm); inf.push(map);
    });
    st = { p: p, e: e, sp: sp, V: V, mm: mm, map: map, wrong: wrong, wrongN: wrongN,
           ts: ts, tru: tru, inf: inf };
  }

  function pos(x) { return x === 0 ? 'flat' : (x > 0 ? 'long ' : 'short ') + DL.num(Math.abs(x), 0); }
  function font() { return '11px ' + DL.color('sans'); }

  compute();
  var drawBars = DL.figure(U + '-b', function (c) {
    var p = new NMT.Plot(c, { xmin: 0, xmax: GROSS * 1.02, ymin: 0, ymax: 3.4,
                              pad: { l: 12, r: 12, t: 8, b: 20 } });
    var g = p.g;
    g.clearRect(0, 0, p.w, p.h);
    g.fillStyle = DL.color('paper');
    g.fillRect(0, 0, p.w, p.h);
    var rows = [[st.V, 'gross volume: ' + DL.num(st.V, 0), DL.color('ink-faint')],
                [Math.abs(st.mm), 'market makers hold: ' + pos(st.mm), DL.color('accent')],
                [Math.abs(st.map), 'the map infers: ' + pos(st.map), DL.color('familiar')]];
    rows.forEach(function (rw, i) {
      var y = 2.9 - i * 1.05;
      g.fillStyle = DL.fade(rw[2], 0.85);
      g.fillRect(p.X(0), p.Y(y + 0.18), Math.max(2, p.X(rw[0]) - p.X(0)), p.Y(y - 0.18) - p.Y(y + 0.18));
      p.text(0, y + 0.18, rw[1], { dy: -8, font: font(), color: DL.color('ink-soft') });
    });
    g.save();
    g.font = font();
    g.fillStyle = DL.color('ink-faint');
    g.textAlign = 'right';
    g.textBaseline = 'bottom';
    g.fillText('contracts, one scale', p.w - 12, p.h - 3);
    g.restore();
  });

  var drawPath = DL.figure(U + '-c', function (c) {
    var top = 8000;
    st.tru.concat(st.inf).forEach(function (v) { top = Math.max(top, Math.abs(v)); });
    var ty = DL.ticks(-top, top, 4), YM = Math.max(Math.abs(ty.vals[0]), ty.vals[ty.vals.length - 1]);
    if (YM < top) YM += ty.step;
    var ys = [];
    for (var v = -YM; v <= YM + 1e-9; v += ty.step) ys.push(Math.abs(v) < 1e-9 ? 0 : v);
    var p = new NMT.Plot(c, { xmin: 0, xmax: STEPS, ymin: -YM, ymax: YM,
                              pad: { l: 52, r: 14, t: 24, b: 24 } });
    DL.axes(p, { xs: [0, 90, 180, 270, 360], ys: ys,
                 x: function (x) { return ['9:30', '11:00', '12:30', '2:00', '3:30'][x / 90]; },
                 y: function (v) { return v === 0 ? '0' : (v > 0 ? '+' : DL.MINUS) + DL.num(Math.abs(v), 0); } });
    DL.line(p, st.ts, st.inf, { color: DL.color('familiar'), width: 1.4 });
    DL.line(p, st.ts, st.tru, { color: DL.color('accent'), width: 2.2 });
    var g = p.g;
    g.save();
    g.font = font();
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillStyle = DL.color('ink-soft');
    g.fillText("market makers' net position:", 6, 11);
    var kx = 6 + g.measureText("market makers' net position:").width + 10;
    [[DL.color('accent'), 'true'], [DL.color('familiar'), 'inferred']].forEach(function (k) {
      g.strokeStyle = k[0];
      g.lineWidth = 2.2;
      g.beginPath(); g.moveTo(kx, 11); g.lineTo(kx + 14, 11); g.stroke();
      g.fillText(k[1], kx + 19, 11);
      kx += 19 + g.measureText(k[1]).width + 12;
    });
    g.restore();
  });

  function update() {
    compute();
    DL.out(U + '-p-o', DL.num(st.p * 100, 1) + '%');
    DL.out(U + '-e-o', Math.round(st.e * 100) + '%');
    DL.out(U + '-sp-o', Math.round(st.sp * 100) + '%');
    DL.out(U + '-held', 'held: ' + pos(st.mm) + ' (' + DL.num(Math.abs(st.mm) / st.V * 100, 1) + '% of volume)');
    DL.out(U + '-map', 'inferred: ' + pos(st.map));
    DL.out(U + '-all', 'volume signed wrongly: ' + DL.num(st.wrongN / st.V * 100, 0) + '%');
    var err = st.map - st.mm, flip = st.mm !== 0 && (st.map > 0) !== (st.mm > 0);
    DL.out(U + '-vk', flip ? 'Wrong sign.' : Math.abs(err) >= 0.5 * Math.abs(st.mm) ? 'Far off.' : 'Close.');
    DL.out(U + '-vt', 'The map is off by ' + DL.num(Math.abs(err), 0) + ' contracts, against a true position of ' +
                      DL.num(Math.abs(st.mm), 0) + '. Its errors scale with the ' + DL.num(st.V, 0) +
                      ' contracts traded, the true position with the balance between buys and sells.');
    drawBars();
    drawPath();
  }
  update();
  DL.bind([U + '-p', U + '-e', U + '-sp'], update);
  DL.$(U + '-new').addEventListener('click', function () { seed += 1; update(); });
})();
</script>
