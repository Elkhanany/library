<!--
name: one jagged day
source: new for this book: chapter 6E, "One jagged day sampled at different thresholds"
-->
<figure class="fig" id="fig-{{uid}}">
  <canvas id="{{uid}}-day" data-h="210"></canvas>
  <canvas id="{{uid}}-cap" data-h="170"></canvas>
  <div class="ctrls">
    <div class="ctrl">
      <label for="{{uid}}-mr">mean reversion</label>
      <input type="range" id="{{uid}}-mr" min="0" max="8" step="1" value="6">
      <output id="{{uid}}-mr-o" for="{{uid}}-mr"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-th">threshold</label>
      <input type="range" id="{{uid}}-th" min="5" max="200" step="5" value="25">
      <output id="{{uid}}-th-o" for="{{uid}}-th"></output>
    </div>
    <div class="ctrl">
      <button type="button" id="{{uid}}-new">new day</button>
    </div>
  </div>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-n"></output></div>
    <div class="ctrl"><output id="{{uid}}-one"></output></div>
    <div class="ctrl"><output id="{{uid}}-avg"></output></div>
  </div>
  <figcaption><b>A coarse threshold misses the wiggles only when the path doubles
  back.</b> A simulated day of the index in 780 half-minute steps, with the chapter's 1.26%
  daily volatility and a pull back toward the open whose half-life the mean-reversion slider
  sets. The hedger rebalances at the dots, whenever the price leaves the shaded corridor around
  its last hedge, and collects the squared moves between rebalances and to the close, as a
  share of the finest sampling. Below, that share at every threshold is averaged over 600 such
  days, with the middle half of the days shaded and this day as the small dot. With no mean
  reversion the average stays near 100% while the days spread out, and as the pull strengthens,
  wide thresholds collect less, down toward the day's variance ratio.</figcaption>
</figure>
<script>
(function () {
  var U = '{{uid}}';
  var MR = DL.$(U + '-mr'), TH = DL.$(U + '-th');

  /* the made-up days: the price in basis points from the open, x, follows
     dx = −κ x dt + s dW over one trading day of 780 half-minute steps, stepped exactly, with
     s = 126 bps, the chapter's 20% realized volatility, 0.20/√252 = 1.26% a day. κ comes from
     the half-life of a swing in minutes of the 390-minute day; none is a random walk. Each
     day has its own seed, so any day can be drawn again. */
  var STEPS = 780, NDAYS = 600, SD = 126, SEED = 500, FIRST = 23;
  var HALF = [0, 240, 120, 60, 30, 20, 15, 10, 5];
  var GRID = [5, 7, 10, 15, 20, 25, 35, 50, 70, 100, 140, 200];
  function kappa(v) { return HALF[v] ? Math.LN2 * 390 / HALF[v] : 0; }

  var cur = { v: null }, curves = {}, day = FIRST;
  function paths(v) {
    if (cur.v === v) return cur;
    var k = kappa(v), dt = 1 / STEPS;
    var a = k > 0 ? Math.exp(-k * dt) : 1;
    var b = k > 0 ? SD * Math.sqrt((1 - Math.exp(-2 * k * dt)) / (2 * k)) : SD * Math.sqrt(dt);
    var P = new Float32Array((STEPS + 1) * NDAYS), F = new Float64Array(NDAYS);
    for (var d = 0; d < NDAYS; d++) {
      var r = DL.rng(SEED + d), x = 0, o = d * (STEPS + 1), f = 0, i;
      P[o] = 0;
      for (i = 1; i <= STEPS; i++) { x = a * x + b * DL.gauss(r); P[o + i] = x; }
      for (i = 1; i <= STEPS; i++) { var s = P[o + i] - P[o + i - 1]; f += s * s; }
      F[d] = f;
    }
    cur = { v: v, P: P, F: F };
    return cur;
  }
  /* the hedger: from the last hedged level, trade when the price has moved h or more,
     collecting the square of the move; the close marks what is left */
  function capture(d, h, trail) {
    var P = cur.P, o = d * (STEPS + 1), last = P[o], c = 0, n = 0;
    for (var i = 1; i <= STEPS; i++) {
      var m = P[o + i] - last;
      if (m >= h || m <= -h) { c += m * m; last = P[o + i]; n++; if (trail) trail.dots.push(i); }
      if (trail) trail.level.push(last);
    }
    var e = P[o + STEPS] - last;
    return { c: c + e * e, n: n };
  }
  function average(h) {
    var C = 0, F = 0;
    for (var d = 0; d < NDAYS; d++) { C += capture(d, h).c; F += cur.F[d]; }
    return C / F;
  }
  /* the share at every threshold of the grid: the average (total collected over total
     finest) and the middle half of the days' own shares */
  function curve(v) {
    if (curves[v]) return curves[v];
    var out = GRID.map(function (h) {
      var C = 0, F = 0, per = [];
      for (var d = 0; d < NDAYS; d++) {
        var c = capture(d, h).c;
        C += c; F += cur.F[d]; per.push(c / cur.F[d]);
      }
      per.sort(function (p, q) { return p - q; });
      return { avg: C / F, lo: per[Math.floor(0.25 * (NDAYS - 1))], hi: per[Math.floor(0.75 * (NDAYS - 1))] };
    });
    curves[v] = out;
    return out;
  }

  var st;
  function compute() {
    var v = +MR.value, h = +TH.value;
    paths(v);
    var trail = { dots: [], level: [0] }, one = capture(day, h, trail), k = kappa(v);
    st = { v: v, h: h, trail: trail, one: one.c / cur.F[day], n: one.n, avg: average(h),
           curve: curve(v), vr: k > 0 ? (1 - Math.exp(-k)) / k : 1 };
  }
  function pct(x) { return DL.num(100 * x, 0) + '%'; }
  function font() { return '11px ' + DL.color('sans'); }

  compute();
  var drawDay = DL.figure(U + '-day', function (c) {
    var P = cur.P, o = day * (STEPS + 1), xs = [], ys = [], lo = 0, hi = 0, i;
    for (i = 0; i <= STEPS; i++) {
      xs.push(6.5 * i / STEPS); ys.push(P[o + i]);
      lo = Math.min(lo, P[o + i]); hi = Math.max(hi, P[o + i]);
    }
    var pad = Math.max(8, 0.12 * (hi - lo));
    lo = Math.min(lo - pad, -30); hi = Math.max(hi + pad, 30);
    var p = new NMT.Plot(c, { xmin: 0, xmax: 6.5, ymin: lo, ymax: hi,
                              pad: { l: 40, r: 12, t: 20, b: 32 }, xlabel: 'hours into the day' });
    DL.axes(p, { xs: [0, 1, 2, 3, 4, 5, 6], ny: 4 });
    var acc = DL.color('accent'), lv = st.trail.level;
    /* the corridor: within h of the last hedged level nothing trades */
    DL.band(p, xs, lv.map(function (l) { return l + st.h; }), lv.map(function (l) { return l - st.h; }),
            DL.fade(acc, 0.13));
    DL.line(p, xs, lv, { color: DL.fade(acc, 0.75), width: 1.2 });
    DL.line(p, xs, ys, { color: DL.color('ink-soft'), width: 1.3 });
    st.trail.dots.forEach(function (j) { p.dot(xs[j], ys[j], { color: acc, r: 3.6, ring: true }); });
    p.text(0, hi, 'bps from the open', { dx: 2, dy: -6, color: DL.color('ink-soft'), font: font() });
  });

  var drawCap = DL.figure(U + '-cap', function (c) {
    var L0 = Math.log(5) / Math.LN10, L1 = Math.log(200) / Math.LN10;
    function X(h) { return Math.log(h) / Math.LN10; }
    var p = new NMT.Plot(c, { xmin: L0, xmax: L1, ymin: 0, ymax: 1.5,
                              pad: { l: 40, r: 12, t: 12, b: 32 }, xlabel: 'threshold, bps' });
    var marks = [5, 10, 25, 50, 100, 200];
    DL.axes(p, { xs: marks.map(X), ys: [0, 0.5, 1, 1.5],
                 x: function (v) { return String(Math.round(Math.pow(10, v))); },
                 y: function (v) { return DL.num(v * 100, 0) + '%'; } });
    var fam = DL.color('familiar'), gx = GRID.map(X), cv = st.curve;
    DL.band(p, gx, cv.map(function (q) { return Math.min(q.hi, 1.5); }),
            cv.map(function (q) { return q.lo; }), DL.fade(fam, 0.16));
    DL.hline(p, 1, { color: DL.color('ink-faint'), dash: [4, 4] });
    if (st.v > 0) {
      DL.hline(p, st.vr, { color: DL.color('plain'), dash: [3, 3] });
      p.text(L1, st.vr, "day's variance ratio", { dx: -2, dy: -4, align: 'right',
                                                   color: DL.color('plain'), font: font() });
    }
    DL.line(p, gx, cv.map(function (q) { return q.avg; }), { color: fam, width: 2 });
    p.seg(X(st.h), 0, X(st.h), 1.5, { color: DL.fade(DL.color('accent'), 0.7), width: 1.2 });
    p.dot(X(st.h), st.avg, { color: fam, r: 4.5, ring: true });
    p.dot(X(st.h), Math.min(st.one, 1.5), { color: DL.color('accent'), r: 3.6, ring: true });
    p.g.textAlign = 'left';
    DL.legend(p, [{ label: 'average of 600 days', color: fam },
                  { label: 'middle half', color: DL.fade(fam, 0.35), box: true }]);
  });

  function update() {
    compute();
    DL.out(U + '-mr-o', HALF[st.v] ? 'half-life ' + HALF[st.v] + ' min' : 'none');
    DL.out(U + '-th-o', st.h + ' bps');
    DL.out(U + '-n', 'this day: ' + st.n + ' rebalance' + (st.n === 1 ? '' : 's'));
    DL.out(U + '-one', 'this day collects ' + pct(st.one));
    DL.out(U + '-avg', 'average of 600 days = ' + pct(st.avg));
    drawDay();
    drawCap();
  }
  DL.$(U + '-new').addEventListener('click', function () { day = (day + 1) % NDAYS; update(); });
  DL.bind([U + '-mr', U + '-th'], update);
  update();
})();
</script>
