<!--
name: stop and release
source: new for this book: chapter 11K, "The stop and the release"
-->
<figure class="fig" id="fig-{{uid}}">
  <canvas id="{{uid}}-c" data-h="230"></canvas>
  <div class="ctrls">
    <div class="ctrl">
      <label for="{{uid}}-m">expected move</label>
      <input type="range" id="{{uid}}-m" min="0.2" max="3" step="0.05" value="1.2">
      <output id="{{uid}}-m-o" for="{{uid}}-m"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-d">stop distance</label>
      <input type="range" id="{{uid}}-d" min="0.1" max="3" step="0.05" value="0.65">
      <output id="{{uid}}-d-o" for="{{uid}}-d"></output>
    </div>
    <div class="ctrl" role="group" aria-label="The chapter's cases">
      <label>cases</label>
      <button type="button" id="{{uid}}-fomc">FOMC Tuesday</button>
      <button type="button" id="{{uid}}-cpi">CPI morning</button>
    </div>
  </div>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-sd"></output></div>
    <div class="ctrl"><output id="{{uid}}-p"></output></div>
    <div class="ctrl"><output id="{{uid}}-fill"></output></div>
    <div class="ctrl"><output id="{{uid}}-loss"></output></div>
  </div>
  <p class="readout" aria-live="polite"><b id="{{uid}}-vk"></b> <span id="{{uid}}-vt"></span></p>
  <figcaption><b>A stop does not cap a release.</b> The curve is the release's move, normal
  with a standard deviation of the expected move over 0.8. The shaded tail is the chance that
  the release alone reaches a stop the set distance below the price, N(−0.8 d/m). The stop
  fills after the move, so a hit fills beyond it, on average at the dashed line; with the
  stop's distance as the planned loss of 1R, that average fill is what a hit costs. The two
  cases are the chapter's: Tuesday's close in the FOMC week, and the CPI check
  question.</figcaption>
</figure>
<script>
(function () {
  var U = '{{uid}}';
  var M = DL.$(U + '-m'), D = DL.$(U + '-d');

  /* the mean of a normal tail beyond z, in standard deviations: phi(z) / N(-z), with the
     asymptotic series far out, where N(-z) is too small to divide by */
  function mills(z) {
    if (z < 4) return DL.phi(z) / DL.N(-z);
    return z + 1 / z - 2 / Math.pow(z, 3) + 10 / Math.pow(z, 5);
  }
  /* eq:pstop: the release's move is normal with standard deviation m / 0.8, since the
     expected move m is about 0.8 of it; a stop d below the price is hit with probability
     N(-0.8 d / m), and a hit fills at the move itself, on average sigma times mills(z) */
  function state() {
    var m = parseFloat(M.value), d = parseFloat(D.value), sig = m / 0.8, z = d / sig;
    var p = DL.N(-z), fill = sig * mills(z);
    return { m: m, d: d, sig: sig, z: z, p: p, fill: fill, lossR: fill / d };
  }
  function pc(x) { return DL.num(x, 2) + '%'; }
  function font() { return '11px ' + DL.color('sans'); }
  function nice(x) {
    var c = [0.25, 0.5, 1, 2, 2.5, 5, 10];
    for (var i = 0; i < c.length; i++) if (c[i] >= x) return c[i];
    return 20;
  }
  var WORDS = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];

  var st = state();
  var draw = DL.figure(U + '-c', function (c) {
    var s = st;
    /* the axis follows the curve, so what moves is the stop against the spread; the tick
       step is chosen from the width, so the labels never crowd on a phone */
    var W = c.clientWidth || 640;
    var raw = Math.max(4 * s.sig, 1.2 * Math.max(s.d, s.fill), 1);
    var step = nice(2 * raw / Math.max(4, Math.floor((W - 36) / 46)));
    var half = Math.ceil(raw / step - 1e-9) * step;
    var peak = 1 / (s.sig * Math.sqrt(2 * Math.PI)), top = peak * 1.36;
    var p = new NMT.Plot(c, { xmin: -half, xmax: half, ymin: 0, ymax: top,
                              pad: { l: 18, r: 18, t: 10, b: 24 } });
    var xs = [], dec = step < 0.5 ? 2 : step < 1 ? 1 : 0;
    for (var t = -half; t <= half + 1e-9; t += step) xs.push(Math.round(t * 100) / 100);
    DL.axes(p, { xs: xs, y: false, yAxis: false,
                 x: function (v) { return v === 0 ? '0' : DL.signed(v, dec) + '%'; } });
    var g = p.g, acc = DL.color('accent'), pla = DL.color('plain'), fam = DL.color('familiar');
    function f(x) { return DL.phi(x / s.sig) / s.sig; }
    /* a label beside a vertical line, on its left unless it would run off the plot */
    function side(x, y, text, col, dy) {
      g.save();
      g.font = font();
      var w = g.measureText(text).width;
      g.restore();
      var left = p.X(x) - 4 - w >= p.o.pad.l;
      p.text(x, y, text, { align: left ? 'right' : 'left', dx: left ? -4 : 4, dy: dy || 0,
                           color: col, font: font() });
    }

    /* the expected move, a light band from -m to +m */
    DL.clip(p);
    g.fillStyle = DL.fade(fam, 0.09);
    g.fillRect(p.X(-s.m), p.Y(top), p.X(s.m) - p.X(-s.m), p.Y(0) - p.Y(top));
    g.restore();
    /* its label sits top right, a row lower if it would reach the stop's line */
    var em = 'expected move ±' + DL.num(s.m, 2) + '%';
    g.save();
    g.font = font();
    var ew = g.measureText(em).width;
    g.restore();
    if (p.X(half) - 2 - ew >= p.X(-s.d) + 4) {
      p.text(half, top, em, { align: 'right', dx: -2, dy: 13, color: fam, font: font() });
    } else {
      p.text(-s.d, top, em, { align: 'right', dx: -4, dy: 13, color: fam, font: font() });
    }

    /* the tail beyond the stop, shaded under the curve */
    var tx = [], ty = [];
    for (var i = 0; i <= 160; i++) {
      var x = -half + (half - s.d) * i / 160;
      tx.push(x); ty.push(f(x));
    }
    DL.band(p, tx, ty, 0, DL.fade(pla, 0.35));
    p.fn(f, { color: acc, width: 2 });

    /* the stop, and the average fill of the releases that pass it */
    DL.vline(p, -s.d, { color: pla, width: 1.6 });
    var fy = Math.min(top * 0.66, f(s.fill) + peak * 0.12);
    p.seg(-s.fill, 0, -s.fill, fy, { color: pla, width: 1.2, dash: [4, 3] });
    side(-s.d, top, 'stop ' + DL.MINUS + DL.num(s.d, 2) + '%', pla, 28);
    side(-s.fill, fy, 'average fill', pla, 0);
  });

  function update() {
    st = state();
    var s = st;
    DL.out(U + '-m-o', '±' + pc(s.m));
    DL.out(U + '-d-o', pc(s.d));
    DL.out(U + '-sd', 'σ = m/0.8 = ' + pc(s.sig));
    DL.out(U + '-p', 'Pr(stop) = N(' + DL.MINUS + DL.num(s.z, 2) + ') = ' + DL.num(s.p, 2));
    DL.out(U + '-fill', 'average fill = ' + DL.MINUS + pc(s.fill));
    DL.out(U + '-loss', 'average loss = ' + DL.num(s.lossR, 2) + 'R');
    var n = Math.round(1 / s.p), text;
    if (s.p < 0.01) text = 'The release alone has under one chance in 100 of reaching the ' +
      'stop; a hit would fill beyond it, at ' + DL.num(s.lossR, 1) + 'R on average.';
    else text = 'The release alone has about one chance in ' + (n < 10 ? WORDS[n] : DL.num(n, 0)) +
      ' of reaching the stop, and a hit fills beyond it: ' + DL.num(s.lossR, 1) +
      'R on average where the plan allowed 1R.';
    DL.out(U + '-vk', s.d < s.m ? 'Inside the expected move.' : 'Outside the expected move.');
    DL.out(U + '-vt', text);
    draw();
  }
  function setCase(m, d) { M.value = m; D.value = d; update(); }
  DL.$(U + '-fomc').addEventListener('click', function () { setCase(1.2, 0.65); });
  DL.$(U + '-cpi').addEventListener('click', function () { setCase(0.8, 1.0); });
  update();
  DL.bind([U + '-m', U + '-d'], update);
})();
</script>
