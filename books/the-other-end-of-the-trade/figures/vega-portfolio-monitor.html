<!--
name: vega portfolio monitor
source: src/interactives/VegaPortfolioMonitor.jsx
-->
<figure class="fig" id="fig-{{uid}}">
  <canvas id="{{uid}}-c" data-h="120"></canvas>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-count"></output></div>
    <div class="ctrl"><button type="button" id="{{uid}}-add">+ add position</button></div>
  </div>
  <div class="evidence"><div class="ev-scroll"><table class="trials">
    <thead><tr><th class="c-trial">Position</th><th>Ctr</th><th>Vega / ctr</th><th>β · vega_adj</th></tr></thead>
    <tbody>
      <tr id="{{uid}}-p0"><td class="c-trial"><select aria-label="Position 1 instrument" id="{{uid}}-i0"><option value="SPX">SPX</option><option value="SPY" selected>SPY</option><option value="QQQ">QQQ</option><option value="IWM">IWM</option><option value="NVDA">NVDA</option><option value="AAPL">AAPL</option><option value="MSFT">MSFT</option><option value="Other">Other</option></select>
        <select aria-label="Position 1 side" id="{{uid}}-s0"><option value="short" selected>short</option><option value="long">long</option></select>
        <div class="ctrl"><button type="button" id="{{uid}}-x0" aria-label="Remove position 1">×</button></div></td>
        <td data-label="Ctr"><input type="number" aria-label="Position 1 contracts" id="{{uid}}-n0" min="0" max="999" step="1" value="5"></td>
        <td data-label="Vega / ctr"><input type="number" aria-label="Position 1 vega per contract" id="{{uid}}-v0" min="0" max="9999" step="1" value="25"></td>
        <td data-label="β · vega_adj" id="{{uid}}-a0"></td></tr>
      <tr id="{{uid}}-p1"><td class="c-trial"><select aria-label="Position 2 instrument" id="{{uid}}-i1"><option value="SPX">SPX</option><option value="SPY" selected>SPY</option><option value="QQQ">QQQ</option><option value="IWM">IWM</option><option value="NVDA">NVDA</option><option value="AAPL">AAPL</option><option value="MSFT">MSFT</option><option value="Other">Other</option></select>
        <select aria-label="Position 2 side" id="{{uid}}-s1"><option value="short" selected>short</option><option value="long">long</option></select>
        <div class="ctrl"><button type="button" id="{{uid}}-x1" aria-label="Remove position 2">×</button></div></td>
        <td data-label="Ctr"><input type="number" aria-label="Position 2 contracts" id="{{uid}}-n1" min="0" max="999" step="1" value="5"></td>
        <td data-label="Vega / ctr"><input type="number" aria-label="Position 2 vega per contract" id="{{uid}}-v1" min="0" max="9999" step="1" value="25"></td>
        <td data-label="β · vega_adj" id="{{uid}}-a1"></td></tr>
      <tr id="{{uid}}-p2" hidden><td class="c-trial"><select aria-label="Position 3 instrument" id="{{uid}}-i2"><option value="SPX">SPX</option><option value="SPY" selected>SPY</option><option value="QQQ">QQQ</option><option value="IWM">IWM</option><option value="NVDA">NVDA</option><option value="AAPL">AAPL</option><option value="MSFT">MSFT</option><option value="Other">Other</option></select>
        <select aria-label="Position 3 side" id="{{uid}}-s2"><option value="short" selected>short</option><option value="long">long</option></select>
        <div class="ctrl"><button type="button" id="{{uid}}-x2" aria-label="Remove position 3">×</button></div></td>
        <td data-label="Ctr"><input type="number" aria-label="Position 3 contracts" id="{{uid}}-n2" min="0" max="999" step="1" value="5"></td>
        <td data-label="Vega / ctr"><input type="number" aria-label="Position 3 vega per contract" id="{{uid}}-v2" min="0" max="9999" step="1" value="25"></td>
        <td data-label="β · vega_adj" id="{{uid}}-a2"></td></tr>
      <tr id="{{uid}}-p3" hidden><td class="c-trial"><select aria-label="Position 4 instrument" id="{{uid}}-i3"><option value="SPX">SPX</option><option value="SPY" selected>SPY</option><option value="QQQ">QQQ</option><option value="IWM">IWM</option><option value="NVDA">NVDA</option><option value="AAPL">AAPL</option><option value="MSFT">MSFT</option><option value="Other">Other</option></select>
        <select aria-label="Position 4 side" id="{{uid}}-s3"><option value="short" selected>short</option><option value="long">long</option></select>
        <div class="ctrl"><button type="button" id="{{uid}}-x3" aria-label="Remove position 4">×</button></div></td>
        <td data-label="Ctr"><input type="number" aria-label="Position 4 contracts" id="{{uid}}-n3" min="0" max="999" step="1" value="5"></td>
        <td data-label="Vega / ctr"><input type="number" aria-label="Position 4 vega per contract" id="{{uid}}-v3" min="0" max="9999" step="1" value="25"></td>
        <td data-label="β · vega_adj" id="{{uid}}-a3"></td></tr>
      <tr id="{{uid}}-p4" hidden><td class="c-trial"><select aria-label="Position 5 instrument" id="{{uid}}-i4"><option value="SPX">SPX</option><option value="SPY" selected>SPY</option><option value="QQQ">QQQ</option><option value="IWM">IWM</option><option value="NVDA">NVDA</option><option value="AAPL">AAPL</option><option value="MSFT">MSFT</option><option value="Other">Other</option></select>
        <select aria-label="Position 5 side" id="{{uid}}-s4"><option value="short" selected>short</option><option value="long">long</option></select>
        <div class="ctrl"><button type="button" id="{{uid}}-x4" aria-label="Remove position 5">×</button></div></td>
        <td data-label="Ctr"><input type="number" aria-label="Position 5 contracts" id="{{uid}}-n4" min="0" max="999" step="1" value="5"></td>
        <td data-label="Vega / ctr"><input type="number" aria-label="Position 5 vega per contract" id="{{uid}}-v4" min="0" max="9999" step="1" value="25"></td>
        <td data-label="β · vega_adj" id="{{uid}}-a4"></td></tr>
      <tr id="{{uid}}-p5" hidden><td class="c-trial"><select aria-label="Position 6 instrument" id="{{uid}}-i5"><option value="SPX">SPX</option><option value="SPY" selected>SPY</option><option value="QQQ">QQQ</option><option value="IWM">IWM</option><option value="NVDA">NVDA</option><option value="AAPL">AAPL</option><option value="MSFT">MSFT</option><option value="Other">Other</option></select>
        <select aria-label="Position 6 side" id="{{uid}}-s5"><option value="short" selected>short</option><option value="long">long</option></select>
        <div class="ctrl"><button type="button" id="{{uid}}-x5" aria-label="Remove position 6">×</button></div></td>
        <td data-label="Ctr"><input type="number" aria-label="Position 6 contracts" id="{{uid}}-n5" min="0" max="999" step="1" value="5"></td>
        <td data-label="Vega / ctr"><input type="number" aria-label="Position 6 vega per contract" id="{{uid}}-v5" min="0" max="9999" step="1" value="25"></td>
        <td data-label="β · vega_adj" id="{{uid}}-a5"></td></tr>
    </tbody>
  </table></div></div>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-agg"></output></div>
  </div>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-k5"></output></div>
    <div class="ctrl"><output id="{{uid}}-k10"></output></div>
    <div class="ctrl"><output id="{{uid}}-k15"></output></div>
  </div>
  <div class="ctrls">
    <div class="ctrl" role="group" aria-label="Target vega" id="{{uid}}-tgt">
      <label>target vega</label>
      <button type="button" data-v="flat" aria-pressed="false">flat</button>
      <button type="button" data-v="half" class="on" aria-pressed="true">half</button>
      <button type="button" data-v="full" aria-pressed="false">full</button>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-vix">VIX spot</label>
      <input type="number" id="{{uid}}-vix" min="1" max="150" step="1" value="17">
    </div>
  </div>
  <p class="readout" aria-live="polite"><b id="{{uid}}-vk"></b> <span id="{{uid}}-vt"></span></p>
  <figcaption><b>Short vega does not diversify.</b> Each position's vega per contract, in
  dollars per vol point, times its contracts and side, is scaled by its underlying's VIX beta
  (SPX and SPY 1.00, QQQ 0.90, IWM 0.85, NVDA 0.75, AAPL 0.70, MSFT 0.65, other 0.50), and the
  sum is the aggregate vega: the strip marks it against the bands at $500 and $1,500 a vol
  point, and a VIX spike of 5, 10 or 15 points moves the book by that many times it. The overlay
  counts the 90-DTE VIX calls, struck near 1.4 × VIX spot with about $80 of vega each, that take
  the vega to a target: flat (a full hedge), half of today's, or the full vega left in
  place.</figcaption>
</figure>
<script>
(function () {
  var U = '{{uid}}', MAX = 6;
  var VIX_BETA = { SPX: 1.00, SPY: 1.00, QQQ: 0.90, IWM: 0.85, NVDA: 0.75, AAPL: 0.70,
                   MSFT: 0.65, Other: 0.50 };
  var FRESH = { i: 'SPY', s: 'short', n: '5', v: '25' };
  var n = 2;
  var target = DL.seg(U + '-tgt', function () { draw(); });

  function el(f, k) { return DL.$(U + '-' + f + k); }
  function num(id) { var x = parseFloat(DL.$(id).value); return isFinite(x) ? x : 0; }
  /* the app's fmt(): a sign on positives, dollars with no cents */
  function fmt(v) { return (v >= 0 ? '+' : DL.MINUS) + '$' + DL.num(Math.abs(v), 0); }
  /* the same in a readout, where a word joiner keeps the sign on the line
     with the dollar sign */
  function money(v) { return (v >= 0 ? '+' : DL.MINUS) + '\u2060$' + DL.num(Math.abs(v), 0); }
  /* tick labels: the app's bands while they are in view, round steps beyond */
  function short(v) {
    if (v === 0) return '$0';
    var s = DL.compact(Math.abs(v), 1, '$').replace('.0', '');
    return (v > 0 ? '+' : DL.MINUS) + s;
  }

  function compute() {
    var rows = [], pv = 0;
    for (var k = 0; k < n; k++) {
      var inst = el('i', k).value;
      /* the app looked "Other" up in a beta override it never let the reader
         set (1.00); the figure uses the table's own 0.50 */
      var beta = VIX_BETA[inst];
      var sign = el('s', k).value === 'long' ? 1 : -1;
      var adj = num(U + '-v' + k) * num(U + '-n' + k) * sign * beta;
      rows.push({ beta: beta, adj: adj });
      pv += adj;
    }
    var t = target();
    var tv = t === 'flat' ? 0 : t === 'half' ? pv / 2 : pv;
    return { rows: rows, pv: pv, target: t, tv: tv, gap: tv - pv };
  }
  function tone(pv) {
    var a = Math.abs(pv);
    return a < 500 ? 'insight' : a < 1500 ? 'accent' : 'plain';
  }
  /* a label centred on x, kept inside the canvas */
  function tag(p, x, y, s, color, dy, base) {
    var font = '11px ' + DL.color('sans');
    p.g.font = font;
    var w = p.g.measureText(s).width, px = p.X(x);
    var at = Math.min(Math.max(px, w / 2 + 2), p.w - w / 2 - 2);
    p.text(x, y, s, { dx: at - px, dy: dy, align: 'center', baseline: base || 'bottom',
                      color: color, font: font });
  }

  var draw = DL.figure(U + '-c', function (c) {
    var st = compute(), pv = st.pv;
    var m = Math.max(2000, Math.abs(pv) * 1.15);
    var p = new NMT.Plot(c, { xmin: -m, xmax: m, ymin: 0, ymax: 1,
                              pad: { l: 18, r: 18, t: 24, b: 24 }, grid: false });
    /* ticks at the band edges while their labels have room, round steps beyond */
    var room = function (v) { return p.X(v) - p.X(0); }, xs, wide = false;
    if (room(500) >= 46) xs = [-1500, -500, 0, 500, 1500];
    else if (room(1500) >= 56 && m < 6000) xs = [-1500, 0, 1500];
    else {
      wide = true;
      xs = DL.ticks(-m, m, Math.max(2, Math.floor((p.w - 36) / 90))).vals;
    }
    DL.axes(p, { xs: xs, y: false, yAxis: false, grid: false,
                 x: function (v) { return v === 0 ? '$0' : wide ? short(v) : fmt(v); } });
    /* the app's tone bands on the size of the aggregate vega */
    var y0 = p.Y(0.66), y1 = p.Y(0.3);
    [[-m, -1500, 'plain'], [-1500, -500, 'accent'], [-500, 500, 'insight'],
     [500, 1500, 'accent'], [1500, m, 'plain']].forEach(function (z) {
      p.g.fillStyle = DL.fade(DL.color(z[2]), 0.2);
      p.g.fillRect(p.X(z[0]), y0, p.X(z[1]) - p.X(z[0]), y1 - y0);
    });
    DL.vline(p, 0, { color: DL.color('rule') });
    /* where the overlay would take the book, then the book itself */
    if (Math.abs(st.tv - pv) > 1e-9) {
      p.seg(st.tv, 0.2, st.tv, 0.76, { color: DL.color('ink-soft'), dash: [3, 3], width: 1.4 });
      tag(p, st.tv, 0.2, 'target', DL.color('ink-soft'), 1, 'top');
    }
    var col = DL.color(tone(pv));
    p.seg(pv, 0.22, pv, 0.9, { color: col, width: 2.2 });
    p.dot(pv, 0.48, { r: 4.5, color: col, ring: true });
    tag(p, pv, 0.9, 'net ' + fmt(pv) + '/vp', col, -2);
  });

  function update() {
    var st = compute();
    for (var k = 0; k < MAX; k++) {
      var row = el('p', k), show = k < n;
      if (row.hidden === show) row.hidden = !show;
      if (show) DL.out(U + '-a' + k, 'β=' + st.rows[k].beta.toFixed(2) + ' · ' + money(st.rows[k].adj));
    }
    var add = DL.$(U + '-add');
    if (add.disabled !== (n >= MAX)) add.disabled = n >= MAX;
    DL.out(U + '-count', 'positions (' + n + '/' + MAX + ')');
    DL.out(U + '-agg', 'aggregate vega = ' + money(st.pv) + ' / vol point');
    DL.out(U + '-k5', 'VIX +5 P&L = ' + money(st.pv * 5));
    DL.out(U + '-k10', 'VIX +10 P&L = ' + money(st.pv * 10));
    DL.out(U + '-k15', 'VIX +15 P&L = ' + money(st.pv * 15));
    var calls = Math.ceil(Math.abs(st.gap) / 80);
    var strike = Math.round(num(U + '-vix') * 1.4);
    /* calls add vega: a long-vega book reaches a lower target by selling them */
    DL.out(U + '-vk', 'Macro vega overlay.');
    DL.out(U + '-vt', 'To reach the ' + st.target + '-vega target (' + money(st.tv) + '/vp), ' +
           (st.gap < 0 ? 'sell' : 'buy') + ' approximately ' + calls + ' 90\u2011DTE VIX calls at strike ~' +
           strike + '. Informational sizing only; actual vega per VIX call varies by IV and DTE.');
  }
  var redraw = draw;
  draw = function () { update(); redraw(); };

  /* removing a position closes the gap, as the app's list does */
  function remove(k) {
    if (k >= n) return;
    for (var j = k; j < n - 1; j++) {
      ['i', 's', 'n', 'v'].forEach(function (f) { el(f, j).value = el(f, j + 1).value; });
    }
    n -= 1;
    draw();
  }
  function add() {
    if (n >= MAX) return;
    el('i', n).value = FRESH.i; el('s', n).value = FRESH.s;
    el('n', n).value = FRESH.n; el('v', n).value = FRESH.v;
    n += 1;
    draw();
  }
  var ids = [U + '-vix'];
  for (var k = 0; k < MAX; k++) {
    (function (k) { el('x', k).addEventListener('click', function () { remove(k); }); })(k);
    ids.push(U + '-i' + k, U + '-s' + k, U + '-n' + k, U + '-v' + k);
  }
  DL.$(U + '-add').addEventListener('click', add);
  DL.bind(ids, function () { draw(); });
  update();
})();
</script>
