<!--
name: half off and trail
source: new for this book: chapter 11J, "Half off and trail"
-->
<figure class="fig" id="fig-{{uid}}">
  <canvas id="{{uid}}-c" data-h="260"></canvas>
  <div class="ctrls">
    <div class="ctrl">
      <label for="{{uid}}-mu">drift</label>
      <input type="range" id="{{uid}}-mu" min="0" max="0.08" step="0.005" value="0.03">
      <output id="{{uid}}-mu-o" for="{{uid}}-mu"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-k">trailing stop</label>
      <input type="range" id="{{uid}}-k" min="0.25" max="3" step="0.25" value="0.75">
      <output id="{{uid}}-k-o" for="{{uid}}-k"></output>
    </div>
    <div class="ctrl">
      <button type="button" id="{{uid}}-new">new paths</button>
    </div>
  </div>
  <div class="evidence"><div class="ev-scroll"><table class="trials">
    <thead><tr><th class="c-trial">Exit rule</th><th>Median</th><th>Mean</th><th>Losing trades</th><th>Best 10% from</th></tr></thead>
    <tbody>
      <tr><td class="c-trial">all out at +0.75R</td><td data-label="Median" id="{{uid}}-a0"></td><td data-label="Mean" id="{{uid}}-a1"></td><td data-label="Losing trades" id="{{uid}}-a2"></td><td data-label="Best 10% from" id="{{uid}}-a3"></td></tr>
      <tr><td class="c-trial">half off at +0.75R, rest trailed</td><td data-label="Median" id="{{uid}}-b0"></td><td data-label="Mean" id="{{uid}}-b1"></td><td data-label="Losing trades" id="{{uid}}-b2"></td><td data-label="Best 10% from" id="{{uid}}-b3"></td></tr>
      <tr><td class="c-trial">all held to day 60</td><td data-label="Median" id="{{uid}}-c0"></td><td data-label="Mean" id="{{uid}}-c1"></td><td data-label="Losing trades" id="{{uid}}-c2"></td><td data-label="Best 10% from" id="{{uid}}-c3"></td></tr>
    </tbody>
  </table></div></div>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-floor"></output></div>
  </div>
  <figcaption><b>The half that is sold, and the half that runs.</b> Four hundred made-up
  trades, each a random walk in units of R, with daily moves of about 0.25R and a drift drawn
  for each trade: most small, a few large. Each trade is stopped at −1R and taken three ways:
  all out at +0.75R, half out at +0.75R with the rest behind a trailing stop, and all held to
  day 60. The lines sort each rule's results from worst to best, and stops and targets fill at
  their levels. Set the drift to zero: no rule then makes money on average, and each only
  reshapes the results.</figcaption>
</figure>
<script>
(function () {
  var U = '{{uid}}';
  var MU = DL.$(U + '-mu'), K = DL.$(U + '-k');

  /* the made-up book: N trades, a 60-day time stop, eight steps a day so that stops and
     targets are met on the way rather than only at the close, and a daily spread of 0.25R */
  var N = 400, T = 60, S = 8, SIG = 0.25, TGT = 0.75;
  var seed = 1, W;

  /* each trade's drift is the slider's value times an exponential draw, mean 1: most
     trades drift a little and a few a lot; the shocks are the same for every rule */
  function world(sd) {
    var r = DL.rng(sd), E = new Float64Array(N), Z = new Float64Array(N * T * S);
    for (var i = 0; i < N; i++) E[i] = -Math.log(1 - r());
    for (var j = 0; j < Z.length; j++) Z[j] = DL.gauss(r);
    return { E: E, Z: Z };
  }

  /* one pass over every path, trading it three ways at once:
     a: everything out at +0.75R; b: half out at +0.75R, the rest behind a stop k below the
     highest price since entry (never below the first stop); c: everything held to day 60.
     All three start with the stop at -1R and close whatever is left at day 60. */
  function trade(mubar, k) {
    var A = [], B = [], C = [], dm = 1 / S, ds = SIG / Math.sqrt(S), n = T * S;
    for (var i = 0; i < N; i++) {
      var mu = mubar * W.E[i] * dm, x = 0, a = null, b = null, c = null, half = false, M = 0;
      var base = i * n;
      for (var j = 0; j < n; j++) {
        x += mu + ds * W.Z[base + j];
        var last = j === n - 1;
        if (a === null) { if (x <= -1) a = -1; else if (x >= TGT) a = TGT; else if (last) a = x; }
        if (c === null) { if (x <= -1) c = -1; else if (last) c = x; }
        if (b === null) {
          if (!half) {
            if (x <= -1) b = -1;
            else if (x >= TGT) { half = true; M = x; }
            else if (last) b = x;
          }
          if (half && b === null) {
            var stop = Math.max(-1, M - k);
            if (x <= stop) b = 0.5 * TGT + 0.5 * stop;
            else { if (x > M) M = x; if (last) b = 0.5 * TGT + 0.5 * x; }
          }
        }
        if (a !== null && b !== null && c !== null) break;
      }
      A.push(a); B.push(b); C.push(c);
    }
    return [A, B, C].map(function (v) { return v.sort(function (p, q) { return p - q; }); });
  }
  function q(s, p) {
    var h = (s.length - 1) * p, lo = Math.floor(h), hi = Math.min(s.length - 1, lo + 1);
    return s[lo] + (s[hi] - s[lo]) * (h - lo);
  }
  function stats(s) {
    var sum = 0, lose = 0;
    s.forEach(function (v) { sum += v; if (v < 0) lose++; });
    return { med: q(s, 0.5), mean: sum / s.length, lose: lose / s.length, p90: q(s, 0.9) };
  }

  var st;
  function compute() {
    var mubar = parseFloat(MU.value), k = parseFloat(K.value);
    var R = trade(mubar, k);
    st = { mubar: mubar, k: k, R: R, S: R.map(stats) };
  }

  function rr(x) { return DL.num(x, 2) + 'R'; }
  function font() { return '11px ' + DL.color('sans'); }
  var ROLES = ['familiar', 'accent', 'ink-soft'];
  var NAMES = ['all out at +0.75R', 'half off, rest trailed', 'all held to day 60'];

  W = world(seed);
  compute();
  var draw = DL.figure(U + '-c', function (c) {
    var s = st;
    var top = Math.max(3, Math.min(12, Math.ceil(Math.max(q(s.R[2], 0.95), q(s.R[1], 0.95)) + 0.5)));
    var p = new NMT.Plot(c, { xmin: 0, xmax: 1, ymin: -1.5, ymax: top,
                              pad: { l: 40, r: 12, t: 12, b: 24 } });
    /* the trades in order along the bottom, worst to best, with the median in the middle */
    DL.axes(p, { xs: [0, 0.25, 0.5, 0.75, 1], ny: 5,
                 x: function (v) {
                   return v === 0 ? 'worst' : v === 1 ? 'best' : v === 0.5 ? 'median' :
                          Math.round(v * 100) + '%';
                 },
                 y: function (v) { return (v > 0 ? '+' : v < 0 ? DL.MINUS : '') + Math.abs(v) + 'R'; } });
    /* each rule's results, worst to best: a flat stretch is many trades ending at one level */
    [2, 0, 1].forEach(function (r) {
      var v = s.R[r], pts = v.map(function (y, i) { return [(i + 0.5) / v.length, y]; });
      p.path(pts, { color: DL.color(ROLES[r]), width: r === 1 ? 2.4 : 1.6 });
    });
    [2, 0, 1].forEach(function (r) {
      p.dot(0.5, s.S[r].med, { r: 3.5, color: DL.color(ROLES[r]), ring: true });
    });
    /* the key, stacked at the top left, where the worst trades never reach */
    var g = p.g, x0 = p.X(0) + 10, y0 = p.Y(top) + 10;
    g.save();
    g.font = font();
    g.textBaseline = 'middle';
    NAMES.forEach(function (name, r) {
      var y = y0 + r * 16;
      g.strokeStyle = DL.color(ROLES[r]);
      g.lineWidth = r === 1 ? 2.4 : 1.6;
      g.beginPath();
      g.moveTo(x0, y);
      g.lineTo(x0 + 16, y);
      g.stroke();
      g.fillStyle = DL.color('ink-soft');
      g.fillText(name, x0 + 22, y);
    });
    g.restore();
  });

  function update() {
    compute();
    var s = st;
    DL.out(U + '-mu-o', DL.num(s.mubar, 3) + 'R a day');
    DL.out(U + '-k-o', DL.num(s.k, 2) + 'R');
    ['a', 'b', 'c'].forEach(function (key, r) {
      var x = s.S[r];
      DL.out(U + '-' + key + '0', rr(x.med));
      DL.out(U + '-' + key + '1', DL.signed(x.mean, 2) + 'R');
      DL.out(U + '-' + key + '2', DL.pct(x.lose, 0));
      DL.out(U + '-' + key + '3', rr(x.p90));
    });
    /* eq:half at the worst: the trailed half stopped where its stop starts, k below +0.75R */
    var floor = 0.5 * TGT + 0.5 * Math.max(-1, TGT - s.k);
    DL.out(U + '-floor', 'worst once half is off = ' + DL.num(floor, 3) + 'R');
    draw();
  }
  update();
  DL.bind([U + '-mu', U + '-k'], update);
  DL.$(U + '-new').addEventListener('click', function () {
    seed += 1;
    W = world(seed);
    update();
  });
})();
</script>
