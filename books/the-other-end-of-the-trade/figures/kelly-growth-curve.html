<!--
name: Kelly growth curve
source: new for this book: chapter 3D, "The growth curve of one bet"
-->
<figure class="fig" id="fig-{{uid}}">
  <canvas id="{{uid}}-c" data-h="260"></canvas>
  <div class="ctrls">
    <div class="ctrl">
      <label for="{{uid}}-p">win probability p</label>
      <input type="range" id="{{uid}}-p" min="0.4" max="0.8" step="0.01" value="0.55">
      <output id="{{uid}}-p-o" for="{{uid}}-p"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-g">win per dollar G</label>
      <input type="range" id="{{uid}}-g" min="0.05" max="2" step="0.01" value="1">
      <output id="{{uid}}-g-o" for="{{uid}}-g"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-l">loss per dollar L</label>
      <input type="range" id="{{uid}}-l" min="0.05" max="2" step="0.01" value="1">
      <output id="{{uid}}-l-o" for="{{uid}}-l"></output>
    </div>
  </div>
  <div class="ctrls">
    <div class="ctrl" role="group" aria-label="Presets">
      <label>preset</label>
      <button type="button" id="{{uid}}-even">55% at even odds</button>
      <button type="button" id="{{uid}}-swing">the retail swing trade</button>
    </div>
  </div>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-k"></output></div>
    <div class="ctrl"><output id="{{uid}}-z"></output></div>
  </div>
  <div class="evidence"><div class="ev-scroll"><table class="trials">
    <thead><tr><th class="c-trial">Stake</th><th>f</th><th>g(f) a bet</th><th>Share of peak</th></tr></thead>
    <tbody>
      <tr id="{{uid}}-r0"><td class="c-trial">quarter Kelly</td><td data-label="f" id="{{uid}}-f0"></td><td data-label="g(f) a bet" id="{{uid}}-g0"></td><td data-label="Share of peak" id="{{uid}}-s0"></td></tr>
      <tr id="{{uid}}-r1"><td class="c-trial">half Kelly</td><td data-label="f" id="{{uid}}-f1"></td><td data-label="g(f) a bet" id="{{uid}}-g1"></td><td data-label="Share of peak" id="{{uid}}-s1"></td></tr>
      <tr id="{{uid}}-r2" class="on"><td class="c-trial">full Kelly</td><td data-label="f" id="{{uid}}-f2"></td><td data-label="g(f) a bet" id="{{uid}}-g2"></td><td data-label="Share of peak" id="{{uid}}-s2"></td></tr>
      <tr id="{{uid}}-r3"><td class="c-trial">twice Kelly</td><td data-label="f" id="{{uid}}-f3"></td><td data-label="g(f) a bet" id="{{uid}}-g3"></td><td data-label="Share of peak" id="{{uid}}-s3"></td></tr>
    </tbody>
  </table></div></div>
  <figcaption><b>A flat top and a cliff beyond it.</b> The growth rate of an account that
  stakes a fraction f of its wealth on every bet, g(f) = p ln(1 + fG) + (1 − p) ln(1 − fL),
  with the win G and the loss L measured per dollar staked. The dots mark quarter, half and
  full Kelly, f* = p/L − (1 − p)/G, and twice Kelly, and the table gives the growth each
  earns and its share of the peak. At 55% and even odds, half Kelly keeps 75% of the growth,
  quarter Kelly 44%, and twice Kelly sits where the curve crosses zero. Raise the edge and the
  first two shares hardly move, while the fall past the peak gets steeper.</figcaption>
</figure>
<script>
(function () {
  var U = '{{uid}}';
  var P = DL.$(U + '-p'), G = DL.$(U + '-g'), L = DL.$(U + '-l');
  var MULT = [0.25, 0.5, 1, 2], TAG = ['¼f*', '½f*', 'f*', '2f*'];

  /* the chapter's growth rate, eq:growth: the expected log return per bet; a stake that
     can lose all the wealth (1 − fL ≤ 0) is ruin, a growth rate of minus infinity */
  function growth(f, p, g, l) {
    var b = 1 - f * l;
    if (b <= 0) return -Infinity;
    return p * Math.log(1 + f * g) + (1 - p) * Math.log(b);
  }
  /* eq:kelly, the stake at the top of the curve */
  function kelly(p, g, l) { return p / l - (1 - p) / g; }
  /* where growth turns negative past the peak: g is concave, positive at f* and falls to
     minus infinity at f = 1/L, so there is one crossing between them */
  function zero(p, g, l, fk) {
    var lo = fk, hi = 1 / l;
    for (var i = 0; i < 80; i++) {
      var m = (lo + hi) / 2;
      if (growth(m, p, g, l) > 0) lo = m; else hi = m;
    }
    return (lo + hi) / 2;
  }
  function fnum(f) { return DL.num(f, Math.abs(f) < 1 ? 3 : 2); }
  function gnum(v, top) { return DL.num(v, Math.abs(top) < 0.1 ? 4 : 3); }

  var draw = DL.figure(U + '-c', function (c) {
    var p = +P.value, g = +G.value, l = +L.value;
    var fk = kelly(p, g, l), edge = fk > 0, i;
    var gk = edge ? growth(fk, p, g, l) : 0, f0 = edge ? zero(p, g, l, fk) : null;
    var xmax, ymin, ymax;
    if (edge) {
      xmax = Math.min(1.18 * f0, 0.995 / l);
      ymax = 1.38 * gk;
      ymin = -0.8 * gk;
    } else {
      xmax = 0.25 / Math.max(g, l);
      ymin = 1.25 * growth(xmax, p, g, l);
      ymax = -0.45 * ymin;
    }
    var plot = new NMT.Plot(c, { xmin: 0, xmax: xmax, ymin: ymin, ymax: ymax,
                                 pad: { l: 50, r: 16, t: 14, b: 34 }, xlabel: 'fraction staked f' });
    DL.axes(plot, { nx: 5, ny: 4 });
    var acc = DL.color('accent'), safe = DL.color('insight'), over = DL.color('plain'),
        soft = DL.color('ink-soft'), font = '11px ' + DL.color('sans');
    plot.text(0, ymax, 'growth g(f) a bet', { dx: 6, dy: 13, color: soft, font: font });

    if (!edge) {
      plot.fn(function (f) { return growth(f, p, g, l); }, { color: over, width: 2, N: 400 });
      plot.text(xmax, ymax, 'no edge: every stake shrinks growth',
                { dx: -4, dy: 13, align: 'right', color: over, font: font });
    } else {
      plot.seg(fk, ymin, fk, gk, { color: DL.fade(acc, 0.55), dash: [3, 3], width: 1 });
      plot.fn(function (f) { return growth(f, p, g, l); }, { color: acc, width: 2.2, N: 600 });
      for (i = 0; i < 4; i++) {
        var f = MULT[i] * fk, v = growth(f, p, g, l);
        if (!(f <= xmax) || !isFinite(v) || v < ymin) continue;
        var col = i < 2 ? safe : i === 2 ? acc : over;
        plot.dot(f, v, { color: col, r: 4.5, ring: true });
        /* the rising side's tags sit under the curve, the peak's above it, and twice
           Kelly's to the upper right, clear of the curve falling through it */
        if (i < 2) plot.text(f, v, TAG[i], { dx: 6, dy: 15, color: col, font: font });
        else if (i === 2) plot.text(f, v, TAG[i], { dy: -8, align: 'center', color: col, font: font });
        else plot.text(f, v, TAG[i], { dx: 7, dy: -6, color: col, font: font });
      }
    }

    DL.out(U + '-p-o', DL.num(p * 100, 0) + '%');
    DL.out(U + '-g-o', DL.num(g, 2));
    DL.out(U + '-l-o', DL.num(l, 2));
    DL.out(U + '-k', 'f* = p/L − (1 − p)/G = ' + fnum(fk));
    DL.out(U + '-z', edge ? 'growth is negative past f = ' + fnum(f0)
                          : 'no edge: do not bet');
    for (i = 0; i < 4; i++) {
      var fi = MULT[i] * fk, vi = edge ? growth(fi, p, g, l) : null;
      DL.out(U + '-f' + i, edge ? fnum(fi) : '—');
      DL.out(U + '-g' + i, !edge ? '—' : isFinite(vi) ? gnum(vi, gk) : 'ruin');
      DL.out(U + '-s' + i, !edge || !isFinite(vi) ? '—' : DL.num(100 * vi / gk, 0) + '%');
    }
  });
  function preset(p, g, l) { P.value = p; G.value = g; L.value = l; draw(); }
  DL.$(U + '-even').addEventListener('click', function () { preset(0.55, 1, 1); });
  DL.$(U + '-swing').addEventListener('click', function () { preset(0.6, 0.08, 0.06); });
  DL.bind([U + '-p', U + '-g', U + '-l'], draw);
})();
</script>
