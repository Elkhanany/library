<!--
name: two-asset mix
source: new for this book: chapter 1F, "Two assets and their mix"
-->
<figure class="fig" id="fig-{{uid}}">
  <canvas id="{{uid}}-c" data-h="240"></canvas>
  <canvas id="{{uid}}-s" data-h="170"></canvas>
  <div class="ctrls">
    <div class="ctrl">
      <label for="{{uid}}-rho">correlation ρ</label>
      <input type="range" id="{{uid}}-rho" min="-1" max="1" step="0.05" value="-0.3">
      <output id="{{uid}}-rho-o" for="{{uid}}-rho"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-w">weight w₁</label>
      <input type="range" id="{{uid}}-w" min="0" max="100" step="5" value="60">
      <output id="{{uid}}-w-o" for="{{uid}}-w"></output>
    </div>
  </div>
  <div class="ctrls">
    <div class="ctrl">
      <label for="{{uid}}-s1">σ₁</label>
      <input type="range" id="{{uid}}-s1" min="5" max="40" step="1" value="20">
      <output id="{{uid}}-s1-o" for="{{uid}}-s1"></output>
    </div>
    <div class="ctrl">
      <label for="{{uid}}-s2">σ₂</label>
      <input type="range" id="{{uid}}-s2" min="5" max="40" step="1" value="10">
      <output id="{{uid}}-s2-o" for="{{uid}}-s2"></output>
    </div>
  </div>
  <div class="ctrls">
    <div class="ctrl"><output id="{{uid}}-sp"></output></div>
    <div class="ctrl"><output id="{{uid}}-avg"></output></div>
    <div class="ctrl"><output id="{{uid}}-ben"></output></div>
  </div>
  <figcaption><b>Diversification is the gap below the straight line.</b> Above, the volatility
  σp of a portfolio holding w₁ in an asset of volatility σ₁ and the rest in one of volatility
  σ₂, from all in the second asset (left) to all in the first (right). The dashed
  line is the same mix at ρ = +1, the weighted average of the two volatilities, and the shaded gap
  is the diversification benefit. Below, 120 made-up monthly returns of the two assets, drawn with
  exactly the chosen correlation. Drag ρ from −0.3 up to +1 and the curve rises through the
  chapter's 11.5%, 12.6%, 14.4% and 16.0% at w₁ = 60%, until it lies on the line.</figcaption>
</figure>
<script>
(function () {
  var U = '{{uid}}';
  var RHO = DL.$(U + '-rho'), W = DL.$(U + '-w'), S1 = DL.$(U + '-s1'), S2 = DL.$(U + '-s2');

  /* two standard normal samples of 120 months whose sample correlation is exactly zero:
     centered, the second made orthogonal to the first, both scaled to a standard deviation
     of one. Mixing them as ρ·z₁ + √(1 − ρ²)·z₂ then gives a sample correlation of exactly ρ. */
  var N = 120;
  var Z = (function () {
    var r = DL.rng(21), a = [], b = [], i, ma = 0, mb = 0;
    for (i = 0; i < N; i++) { a.push(DL.gauss(r)); b.push(DL.gauss(r)); }
    for (i = 0; i < N; i++) { ma += a[i] / N; mb += b[i] / N; }
    a = a.map(function (x) { return x - ma; });
    b = b.map(function (x) { return x - mb; });
    var ab = 0, aa = 0;
    for (i = 0; i < N; i++) { ab += a[i] * b[i]; aa += a[i] * a[i]; }
    b = b.map(function (x, j) { return x - ab / aa * a[j]; });
    function unit(v) {
      var ss = 0;
      v.forEach(function (x) { ss += x * x; });
      var s = Math.sqrt(ss / N);
      return v.map(function (x) { return x / s; });
    }
    return { a: unit(a), b: unit(b) };
  })();

  function state() {
    return { rho: +RHO.value, w: +W.value / 100, s1: +S1.value / 100, s2: +S2.value / 100 };
  }
  /* [eq:pvar]: σp² = w₁²σ₁² + w₂²σ₂² + 2·w₁w₂·ρ·σ₁σ₂, with w₂ = 1 − w₁ */
  function vol(w, s1, s2, rho) {
    var v = w * w * s1 * s1 + (1 - w) * (1 - w) * s2 * s2 + 2 * w * (1 - w) * rho * s1 * s2;
    return Math.sqrt(Math.max(0, v));
  }
  function rhoText(rho) {
    var r = Math.round(rho * 100) / 100;
    return (r > 0 ? '+' : '') + DL.num(r, 2);
  }
  function font() { return '11px ' + DL.color('sans'); }

  var drawCurve = DL.figure(U + '-c', function (c) {
    var st = state(), top = Math.max(st.s1, st.s2) * 1.12;
    var p = new NMT.Plot(c, { xmin: 0, xmax: 1, ymin: 0, ymax: top,
                              pad: { l: 42, r: 16, t: 26, b: 30 } });
    DL.axes(p, { xs: [0, 0.25, 0.5, 0.75, 1], ny: 4,
                 x: function (v) { return Math.round(v * 100) + '%'; },
                 y: function (v, step) { return DL.num(v * 100, step < 0.01 ? 1 : 0) + '%'; } });
    var xs = [], cur = [], avg = [], i;
    for (i = 0; i <= 200; i++) {
      var w = i / 200;
      xs.push(w);
      cur.push(vol(w, st.s1, st.s2, st.rho));
      avg.push(w * st.s1 + (1 - w) * st.s2);
    }
    var ins = DL.color('insight'), acc = DL.color('accent'), faint = DL.color('ink-faint');
    DL.band(p, xs, avg, cur, DL.fade(ins, 0.16));
    DL.line(p, xs, avg, { color: DL.color('ink-soft'), width: 1.4, dash: [5, 4] });
    DL.line(p, xs, cur, { color: acc, width: 2.4 });

    /* the chosen mix: its volatility, the straight line's, and the gap between them */
    var sp = vol(st.w, st.s1, st.s2, st.rho), sa = st.w * st.s1 + (1 - st.w) * st.s2;
    DL.vline(p, st.w, { color: faint, dash: [2, 3] });
    p.seg(st.w, sp, st.w, sa, { color: ins, width: 2.5 });
    p.dot(st.w, sa, { r: 3.5, color: DL.color('ink-soft'), ring: true });
    p.dot(st.w, sp, { r: 4.5, color: acc, ring: true });
    var right = st.w > 0.7;
    if (p.Y(sp) - p.Y(sa) >= 20) {
      p.text(st.w, (sp + sa) / 2, DL.num((sa - sp) * 100, 1) + ' pts',
             { dx: right ? -7 : 7, dy: 4, align: right ? 'right' : 'left', font: font(), color: ins });
    }
    p.text(0, 0, 'all in asset 2', { dx: 4, dy: -5, font: font(), color: faint });
    p.text(1, 0, 'all in asset 1', { dx: -4, dy: -5, align: 'right', font: font(), color: faint });
    DL.legend(p, [{ label: 'σp at ρ = ' + rhoText(st.rho), color: acc },
                  { label: 'ρ = +1', color: DL.color('ink-soft'), dash: [5, 4] }],
              { dx: -48, dy: -26 });
    p.text(st.w, top, 'w₁ = ' + Math.round(st.w * 100) + '%',
           { dx: right ? -5 : 5, dy: 13, align: right ? 'right' : 'left',
             font: font(), color: DL.color('ink-soft') });

    DL.out(U + '-rho-o', rhoText(st.rho));
    DL.out(U + '-w-o', Math.round(st.w * 100) + '%');
    DL.out(U + '-s1-o', Math.round(st.s1 * 100) + '%');
    DL.out(U + '-s2-o', Math.round(st.s2 * 100) + '%');
    DL.out(U + '-sp', 'σp = ' + DL.pct(sp, 1));
    DL.out(U + '-avg', 'at ρ = +1: ' + DL.pct(sa, 1));
    DL.out(U + '-ben', 'diversification benefit = ' + DL.num((sa - sp) * 100, 1) + ' pts');
  });

  var drawScatter = DL.figure(U + '-s', function (c) {
    var st = state(), m1 = st.s1 / Math.sqrt(12), m2 = st.s2 / Math.sqrt(12), k = 3.4;
    var p = new NMT.Plot(c, { xmin: -k * m1, xmax: k * m1, ymin: -k * m2, ymax: k * m2,
                              pad: { l: 42, r: 16, t: 22, b: 26 } });
    var fmt = function (v, step) { return DL.num(v * 100, step < 0.01 ? 1 : 0) + '%'; };
    DL.axes(p, { nx: p.w < 500 ? 4 : 6, ny: 4, x: fmt, y: fmt });
    var q = Math.sqrt(Math.max(0, 1 - st.rho * st.rho)), col = DL.fade(DL.color('familiar'), 0.7);
    for (var i = 0; i < N; i++) {
      var x = m1 * Z.a[i], y = m2 * (st.rho * Z.a[i] + q * Z.b[i]);
      p.dot(x, y, { r: 2.6, color: col });
    }
    p.text(-k * m1, k * m2, '120 made-up monthly returns', { dx: 0, dy: -8, font: font(),
           color: DL.color('ink-soft') });
    p.text(k * m1, 0, 'asset 1', { dx: -4, dy: -5, align: 'right', font: font(),
           color: DL.color('ink-faint') });
    p.text(0, k * m2, 'asset 2', { dx: 5, dy: 12, font: font(), color: DL.color('ink-faint') });
  });

  function update() { drawCurve(); drawScatter(); }
  DL.bind([U + '-rho', U + '-w', U + '-s1', U + '-s2'], update);
})();
</script>
